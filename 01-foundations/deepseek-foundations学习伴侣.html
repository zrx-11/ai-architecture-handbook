an class=\"katex-inline\">d\\times m<\/span>。乘积 <span class=\"katex-inline\">Y=XW<\/span> 是 <span class=\"katex-inline\">n\\times m<\/span>：<\/p>\n<div class=\"katex-block\">Y_{ij} = \\sum_{k=1}^{d} X_{ik}W_{kj}<\/div>\n<p>每一行是一个 token，每一列是一个输出特征。参数量就是 <span class=\"katex-inline\">d\\times m<\/span>（忽略偏置）。一个 7168 维到 18432 维的 FFN 升维矩阵，参数量是 <span class=\"katex-inline\">7168\\times 18432 \\approx 1.32<\/span> 亿。<\/p>\n<p>矩阵乘法的计算量也是 <span class=\"katex-inline\">n\\times d\\times m<\/span> 次乘加。MoE 之所以省算力，是因为每个 token 只乘少数几个专家的矩阵，而不是全部。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n不是对应位置相乘，那叫逐元素乘法。\n<\/li><li>\n维度不匹配就不能乘，左矩阵列数必须等于右矩阵行数。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch01<\/td><td>基础运算<\/td><td>矩阵乘法按行加权求和<\/td><\/tr><tr><td>ch04<\/td><td>Transformer<\/td><td>投影、FFN 都是矩阵乘法<\/td><\/tr><tr><td>ch05<\/td><td>MoE<\/td><td>每个 token 只走 top-k 专家的矩阵<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：向量\n<\/li><li>\n后续：注意力、FFN、MoE\n<\/ul>", "c03": "<div class=\"source-badge\">出处：本课程整理 · 基础数学<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">向量<\/a><\/span><\/div><h1>softmax<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1 章、第 3 章、第 5 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>softmax 把一组任意实数分数转成一组非负、总和为 1 的权重。<\/p>\n<h2>为什么重要<\/h2>\n<p>注意力权重、MoE 路由权重、下一个 token 的概率分布，全都靠 softmax。它决定“资源怎么分配”。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[&quot;分数 [2, 1, 0]&quot;] --&gt; B[&quot;取指数 [7.39, 2.72, 1]&quot;]\n  B --&gt; C[&quot;求和 11.11&quot;]\n  C --&gt; D[&quot;归一化 [0.665, 0.245, 0.090]&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<div class=\"katex-block\">\\text{softmax}(z_i)=\\frac{e^{z_i}}{\\sum_j e^{z_j}}<\/div>\n<p>三个性质：<\/p>\n<ol><li>\n输出为正，因为指数恒正。\n<\/li><li>\n总和为 1，因为分母是所有指数之和。\n<\/li><li>\n保序：原来大的分数，输出仍然大。\n<\/ol>\n<p>温度参数可以调节“尖锐程度”。除以温度 <span class=\"katex-inline\">T<\/span> 后再 softmax，<span class=\"katex-inline\">T<\/span> 小则分布更集中，<span class=\"katex-inline\">T<\/span> 大则更平缓。语言模型采样时常用温度控制随机性。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\nsoftmax 不改变排序，它只改变数值比例。\n<\/li><li>\nsoftmax 输出高不代表“正确”，它只是当前模型认为的概率。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch01<\/td><td>基础<\/td><td>分数变比例<\/td><\/tr><tr><td>ch03<\/td><td>注意力<\/td><td>分数矩阵按行 softmax 成权重<\/td><\/tr><tr><td>ch05<\/td><td>MoE<\/td><td>路由分数决定专家权重<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：向量\n<\/li><li>\n后续：注意力、MoE 路由、采样\n<\/ul>", "c04": "<div class=\"source-badge\">出处：本课程整理 · 训练基础<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c02\">矩阵乘法<\/a><\/span><\/div><h1>参数与损失<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 2 章、第 5 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>参数是模型里可训练的数字，损失是衡量模型输出与正确答案差距的标量。<\/p>\n<h2>为什么重要<\/h2>\n<p>训练的全部动作，就是围绕“调参数让损失变小”。模型规模、激活参数、预训练 token 数，最终都要落到这两个词上。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[&quot;参数 θ&quot;] --&gt; B[&quot;预测 ŷ&quot;]\n  B --&gt; C[&quot;损失 L(ŷ, y)&quot;]\n  C --&gt; D[&quot;梯度 ∂L/∂θ&quot;]\n  D --&gt; E[&quot;更新 θ&quot;]\n  E --&gt; A<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>参数包括矩阵元素、偏置、归一化的缩放因子等。V3 有 671B 参数，V4-Pro 有 1.6T，V4.1-Flash 主干 552B 加 196B Engram。<\/p>\n<p>损失常见两类：<\/p>\n<ul><li>\n回归：平方误差 <span class=\"katex-inline\">L=(\\hat{y}-y)^2<\/span>。\n<\/li><li>\n分类/语言模型：交叉熵 <span class=\"katex-inline\">L=-\\log p(y)<\/span>，正确答案概率越低，损失越大。\n<\/ul>\n<p>训练不是一次算完，而是把数据分成 batch，反复前向、求损失、反向传播、更新。一个 epoch 表示把训练集过一遍。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n损失小不等于模型能力强，可能只是记住了训练集。\n<\/li><li>\n参数多不等于每次计算都用上，MoE 只有激活参数参与当前 token 的计算。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch02<\/td><td>训练基础<\/td><td>参数、损失、梯度构成训练循环<\/td><\/tr><tr><td>ch05<\/td><td>V3 规模<\/td><td>671B 总参数，37B 激活<\/td><\/tr><tr><td>ch07<\/td><td>R1 训练<\/td><td>奖励信号代替部分监督损失<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：向量、矩阵乘法\n<\/li><li>\n后续：梯度下降、强化学习\n<\/ul>", "c05": "<div class=\"source-badge\">出处：本课程整理 · 训练基础<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c04\">参数与损失<\/a><\/span><\/div><h1>梯度下降<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 2 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>梯度下降是沿着损失下降最快的方向，按学习率大小一步步调整参数的方法。<\/p>\n<h2>为什么重要<\/h2>\n<p>所有预训练、微调、强化学习，底层都用某种梯度更新。理解它，才能理解“学习率”“训练不稳定”“梯度爆炸”这些论文里的常见词。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[&quot;当前参数 w&quot;] --&gt; B[&quot;算损失 L&quot;]\n  B --&gt; C[&quot;求梯度 ∂L/∂w&quot;]\n  C --&gt; D[&quot;w ← w - η·梯度&quot;]\n  D --&gt; A<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>更新公式：<\/p>\n<div class=\"katex-block\">w \\leftarrow w-\\eta\\frac{\\partial L}{\\partial w}<\/div>\n<p><span class=\"katex-inline\">\\eta<\/span> 是学习率。梯度为正，说明参数增大时损失增大，所以要减小参数；梯度为负则相反。<\/p>\n<p>实际训练用<strong>随机梯度下降<\/strong>（SGD）的变体：每次只取一小批数据（batch）估梯度，噪声大但算得快。现代大模型多用 AdamW、Muon 这类自适应优化器，它们会给不同参数不同的步长。<\/p>\n<p>常见问题：<\/p>\n<ul><li>\n梯度爆炸：梯度数值过大，参数一步飞出去。用梯度裁剪。\n<\/li><li>\n梯度消失：梯度接近 0，前面的层学不动。用残差、归一化缓解。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n学习率不是固定越好，通常要预热再衰减。\n<\/li><li>\n梯度不是误差本身，它是损失对参数的变化率。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch02<\/td><td>训练基础<\/td><td>更新规则与学习率<\/td><\/tr><tr><td>ch05<\/td><td>V3<\/td><td>预训练用 AdamW<\/td><\/tr><tr><td>ch08<\/td><td>V4<\/td><td>改用 Muon 优化器<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：参数与损失\n<\/li><li>\n后续：反向传播、优化器、Muon\n<\/ul>", "c06": "<div class=\"source-badge\">出处：本课程整理 · 注意力<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c02\">矩阵乘法<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c03\">softmax<\/a><\/span><\/div><h1>注意力<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3 章、第 4 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>注意力是让每个 token 根据与其他 token 的相似度，从它们那里按权重收集信息的机制。<\/p>\n<h2>为什么重要<\/h2>\n<p>Transformer 的核心就是注意力。DeepSeek 三代架构的差异，一大半在“怎么算注意力、怎么存缓存”。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[&quot;当前 token 的 Q&quot;] --&gt; B[&quot;与所有 K 点积&quot;]\n  B --&gt; C[&quot;softmax 权重&quot;]\n  C --&gt; D[&quot;加权求和所有 V&quot;]\n  D --&gt; E[&quot;当前 token 的新表示&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>对第 <span class=\"katex-inline\">i<\/span> 个 token：<\/p>\n<div class=\"katex-block\">o_i=\\sum_j \\alpha_{ij}v_j,\\quad \\alpha_{ij}=\\text{softmax}\\left(\\frac{q_i\\cdot k_j}{\\sqrt{d_k}}\\right)<\/div>\n<p>注意力解决了“词与词之间怎么交换信息”。没有它，每个 token 只能独立变换，无法处理指代、语序、长距离依赖。<\/p>\n<p>变体：<\/p>\n<ul><li>\n<strong>因果注意力<\/strong>：只能看左边，用于生成模型。\n<\/li><li>\n<strong>双向注意力<\/strong>：能看两边，用于编码器（如 BERT）。\n<\/li><li>\n<strong>滑动窗口注意力<\/strong>（SWA）：只看附近固定窗口，省计算，V4.1 大量使用。\n<\/li><li>\n<strong>压缩注意力<\/strong>：把远处的 K/V 压成少量表示，V4 的 CSA/HCA 属于这一类。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n注意力权重不是“人类可读的解释”。\n<\/li><li>\n注意力不是只能有一个头，多头可以并行捕捉不同关系。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch03<\/td><td>基础<\/td><td>Q/K/V 与加权求和<\/td><\/tr><tr><td>ch04<\/td><td>Transformer<\/td><td>每层都有一段注意力<\/td><\/tr><tr><td>ch05<\/td><td>MLA<\/td><td>缓存压缩后的潜向量<\/td><\/tr><tr><td>ch08<\/td><td>V4<\/td><td>CSA/HCA 压缩远端上下文<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：向量、矩阵乘法、softmax\n<\/li><li>\n后续：Q/K/V、多头注意力、MLA、CSA\n<\/ul>", "c07": "<div class=\"source-badge\">出处：本课程整理 · 注意力<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c06\">注意力<\/a><\/span><\/div><h1>Q / K / V<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3 章、第 5 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>Query 是“我想找什么”，Key 是“我有什么标签”，Value 是“我实际给出的内容”，三者都由同一个输入向量经不同矩阵投影得到。<\/p>\n<h2>为什么重要<\/h2>\n<p>所有注意力变体，包括 MLA、CSA、HCA，改的都是 Q/K/V 的计算与缓存方式。分不清三者，就无法理解“压缩 KV cache”到底压了什么。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  X[&quot;输入 x&quot;] --&gt; Q[&quot;Q = xW_Q：查询&quot;]\n  X --&gt; K[&quot;K = xW_K：标签&quot;]\n  X --&gt; V[&quot;V = xW_V：内容&quot;]\n  Q --&gt; S[&quot;匹配分数&quot;]\n  K --&gt; S\n  S --&gt; O[&quot;按分数混合 V&quot;]\n  V --&gt; O<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<ul><li>\n<span class=\"katex-inline\">q=xW_Q<\/span>：当前 token 用来“检索”的向量。\n<\/li><li>\n<span class=\"katex-inline\">k=xW_K<\/span>：每个 token 对外展示的“标签”。\n<\/li><li>\n<span class=\"katex-inline\">v=xW_V<\/span>：每个 token 被选中后贡献的“内容”。\n<\/ul>\n<p>输出只混合 V，Q 和 K 只参与打分。因此：<\/p>\n<ul><li>\n压缩 KV cache，压的是 K 和 V 的存储，不压 Q。\n<\/li><li>\nMLA 缓存 <span class=\"katex-inline\">c^{KV}<\/span>，需要时再升维出 K、V；Q 仍可每次现算。\n<\/li><li>\nCSA/HCA 压缩的是远端 token 的 K/V 表示。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\nQ、K、V 不是三份不同的输入，而是同一份输入的三次线性投影。\n<\/li><li>\nV 的维度不一定和 Q/K 相同，但通常设计成相同以便拼接。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch03<\/td><td>注意力<\/td><td>Q/K/V 的分工与计算<\/td><\/tr><tr><td>ch05<\/td><td>MLA<\/td><td>缓存的是压缩后的 K/V 来源<\/td><\/tr><tr><td>ch08<\/td><td>V4.1<\/td><td>CSA2 复用 KV，跨层共享<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：注意力\n<\/li><li>\n后续：多头注意力、MLA、CSA/HCA\n<\/ul><details class=\"depth-fragment\"><summary>展开完整第一性原理推导（Q / K / V）<\/summary><div class=\"depth-body\"><h2>Q/K/V 的第一性原理推导：从“加权平均”到注意力<\/h2>\n<h3>先退到你会的东西：加权平均<\/h3>\n<p>假设你要给三个同学打分，权重分别是 <span class=\"katex-inline\">0.5, 0.3, 0.2<\/span>，分数是 <span class=\"katex-inline\">90, 80, 70<\/span>。总分是多少？<\/p>\n<div class=\"katex-block\">0.5\\times 90 + 0.3\\times 80 + 0.2\\times 70 = 45 + 24 + 14 = 83<\/div>\n<p>这就是<strong>加权平均<\/strong>：每个数先乘自己的权重，再全部相加。权重加起来等于 1。注意力输出本质上就是这个动作，只不过“分数”换成了每个 token 的 Value 向量，“权重”由 Query 和 Key 的相似度决定。<\/p>\n<h3>第一步：怎么衡量两个向量“像不像”<\/h3>\n<p>两个向量逐位相乘再相加，叫<strong>点积<\/strong>。拿两个 2 维向量试：<\/p>\n<div class=\"katex-block\">\\mathbf{a}=[1,0],\\quad \\mathbf{b}=[1,1]<\/div>\n<div class=\"katex-block\">\\mathbf{a}\\cdot\\mathbf{b}=1\\times 1 + 0\\times 1 = 1<\/div>\n<p>再拿 <span class=\"katex-inline\">\\mathbf{c}=[0,1]<\/span>：<\/p>\n<div class=\"katex-block\">\\mathbf{a}\\cdot\\mathbf{c}=1\\times 0 + 0\\times 1 = 0<\/div>\n<p>点积为 1 说明 <span class=\"katex-inline\">\\mathbf{a}<\/span> 和 <span class=\"katex-inline\">\\mathbf{b}<\/span> 方向接近；点积为 0 说明 <span class=\"katex-inline\">\\mathbf{a}<\/span> 和 <span class=\"katex-inline\">\\mathbf{c}<\/span> 垂直，关系远。点积越大，越“像”。<\/p>\n<h3>第二步：为什么分数要除以 <span class=\"katex-inline\">\\sqrt{d_k}<\/span><\/h3>\n<p>如果向量是 128 维，每一维都是 1，点积就是 128。指数 <span class=\"katex-inline\">e^{128}<\/span> 是一个天文数字，softmax 会变成“一个权重 1，其他全 0”。这样梯度几乎没有，训练学不动。<\/p>\n<p>除以 <span class=\"katex-inline\">\\sqrt{d_k}<\/span> 相当于把分数拉回个位数。<span class=\"katex-inline\">d_k=128<\/span> 时 <span class=\"katex-inline\">\\sqrt{128}\\approx 11.3<\/span>，128 分的点积变成 11.3，softmax 还能保留梯度。<\/p>\n<h3>第三步：Q、K、V 为什么要三套矩阵<\/h3>\n<p>如果直接拿原始向量 <span class=\"katex-inline\">x_i<\/span> 和 <span class=\"katex-inline\">x_j<\/span> 做点积，只能衡量“原始表示像不像”。但模型需要不同的“提问方式”：<\/p>\n<ul><li>\n找主语时，Query 应该问“谁在做动作”。\n<\/li><li>\n找修饰语时，Query 应该问“谁在描述名词”。\n<\/ul>\n<p>所以让输入分别乘三个可学习矩阵：<\/p>\n<div class=\"katex-block\">\\mathbf{q}_i=x_iW_Q,\\quad \\mathbf{k}_j=x_jW_K,\\quad \\mathbf{v}_j=x_jW_V<\/div>\n<p><span class=\"katex-inline\">W_Q<\/span>、<span class=\"katex-inline\">W_K<\/span>、<span class=\"katex-inline\">W_V<\/span> 是训练出来的。Q 和 K 负责“提问与匹配”，V 负责“真正被取走的内容”。分开的好处是：匹配标准和内容可以解耦，模型可以学“按 A 标准找，但取 B 内容”。<\/p>\n<h3>第四步：把分数变成权重<\/h3>\n<p>对第 <span class=\"katex-inline\">i<\/span> 个 token，拿它的 <span class=\"katex-inline\">q_i<\/span> 和所有 <span class=\"katex-inline\">k_j<\/span> 点积，得到分数 <span class=\"katex-inline\">s_{ij}<\/span>。然后 softmax：<\/p>\n<div class=\"katex-block\">\\alpha_{ij}=\\frac{e^{s_{ij}}}{\\sum_l e^{s_{il}}}<\/div>\n<p>分母是把当前 token 对所有 token 的指数分数全部加起来，保证权重总和为 1。<\/p>\n<h3>第五步：数值算例，自己复核一遍<\/h3>\n<p>三个 token，2 维：<\/p>\n<ul><li>\n<span class=\"katex-inline\">q_1=[2,0]<\/span>\n<\/li><li>\n<span class=\"katex-inline\">k_1=[1,0]<\/span>，<span class=\"katex-inline\">k_2=[0,1]<\/span>，<span class=\"katex-inline\">k_3=[1,1]<\/span>\n<\/li><li>\n<span class=\"katex-inline\">v_1=[10,0]<\/span>，<span class=\"katex-inline\">v_2=[0,10]<\/span>，<span class=\"katex-inline\">v_3=[4,4]<\/span>\n<\/ul>\n<p>点积（先不缩放，<span class=\"katex-inline\">d_k=2<\/span> 时缩放因子 <span class=\"katex-inline\">\\sqrt{2}\\approx1.414<\/span>，这里为演示省略）：<\/p>\n<ul><li>\n<span class=\"katex-inline\">q_1\\cdot k_1=2<\/span>\n<\/li><li>\n<span class=\"katex-inline\">q_1\\cdot k_2=0<\/span>\n<\/li><li>\n<span class=\"katex-inline\">q_1\\cdot k_3=2<\/span>\n<\/ul>\n<p>取指数：<span class=\"katex-inline\">e^2\\approx7.389<\/span>，<span class=\"katex-inline\">e^0=1<\/span>，<span class=\"katex-inline\">e^2\\approx7.389<\/span>，总和 <span class=\"katex-inline\">15.778<\/span>。<\/p>\n<p>权重：<span class=\"katex-inline\">[0.468, 0.063, 0.468]<\/span>。<\/p>\n<p>输出：<\/p>\n<div class=\"katex-block\">0.468[10,0]+0.063[0,10]+0.468[4,4]=[4.68+1.87,\\ 0.63+1.87]=[6.55,\\ 2.50]<\/div>\n<p>检查：权重和 <span class=\"katex-inline\">0.468+0.063+0.468=0.999<\/span>，输出两个分量都来自三个 V 的加权，没有凭空多出数字。<\/p>\n<h3>第六步：为什么要多头<\/h3>\n<p>一套 Q/K/V 只能学一种匹配标准。多头让模型并行学多套，每套有自己的 <span class=\"katex-inline\">W_Q/W_K/W_V<\/span>。比如 128 头、每头 128 维，各头独立算注意力，拼起来再乘 <span class=\"katex-inline\">W_O<\/span>。不同头可以关注相邻词、句法结构、指代关系等不同模式。<\/p>\n<h3>差生检查<\/h3>\n<ul><li>\n符号 <span class=\"katex-inline\">\\sum_l<\/span> 表示“对所有 l 求和”，第一次出现已解释。\n<\/li><li>\n点积、softmax 都在前面章节出现过，这里直接复用。\n<\/li><li>\n每一步的数值都能用计算器复核。\n<\/li><li>\n结论给了“为什么这样设计”：分开 Q/K/V 是为了解耦匹配与内容，多头是为了多套匹配标准。\n<\/ul>\n<h3>前置与后续<\/h3>\n<ul><li>\n前置：向量、矩阵乘法、softmax（第 1 章）\n<\/li><li>\n后续：多头注意力、因果掩码（第 3 章）、MLA/CSA（第 5、8 章）\n<\/ul><\/div><\/details>", "c08": "<div class=\"source-badge\">出处：本课程整理 · Transformer<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c02\">矩阵乘法<\/a><\/span><\/div><h1>残差连接<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 4 章、第 7 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>残差连接把子层的输入直接加到子层的输出上，让信息和梯度有一条直通的路径。<\/p>\n<h2>为什么重要<\/h2>\n<p>没有残差，几十层的 Transformer 根本训不动。DeepSeek-V4 的 mHC 就是在残差连接上做文章，把它从“简单相加”升级成“流形约束的矩阵混合”。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[&quot;输入 x&quot;] --&gt; B[&quot;子层 Layer(x)&quot;]\n  A --&gt; C[&quot;直通路径&quot;]\n  B --&gt; D[&quot;相加&quot;]\n  C --&gt; D\n  D --&gt; E[&quot;输出 x + Layer(x)&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<div class=\"katex-block\">y=x+\\text{Layer}(x)<\/div>\n<p>两个作用：<\/p>\n<ol><li>\n信息保真：子层可以学到接近 0 的输出，此时 <span class=\"katex-inline\">y\\approx x<\/span>，深层不会比浅层更差。\n<\/li><li>\n梯度直通：反向传播时，梯度可以通过加法直接流回输入，不需要穿过整个子层。\n<\/ol>\n<p>形状要求：<span class=\"katex-inline\">x<\/span> 与 <span class=\"katex-inline\">\\text{Layer}(x)<\/span> 必须同形状。若维度变化，需要额外的投影把 <span class=\"katex-inline\">x<\/span> 映射到目标维度。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n残差不是“把输入复制一份”，而是逐元素相加。\n<\/li><li>\n残差不是只在最后加一次，每个子层都有自己的残差。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch04<\/td><td>Transformer<\/td><td>注意力和 FFN 各带一次残差<\/td><\/tr><tr><td>ch07<\/td><td>V4<\/td><td>mHC 用矩阵混合替代简单相加<\/td><\/tr><tr><td>ch09<\/td><td>V4.1<\/td><td>20 个 CED 块继承 mHC<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：向量、矩阵乘法\n<\/li><li>\n后续：RMSNorm、mHC\n<\/ul>", "c09": "<div class=\"source-badge\">出处：本课程整理 · Transformer<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">向量<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c08\">残差连接<\/a><\/span><\/div><h1>RMSNorm<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 4 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>RMSNorm 用向量的均方根做缩放，不减去均值，比 LayerNorm 少一次统计计算。<\/p>\n<h2>为什么重要<\/h2>\n<p>DeepSeek 全系使用 RMSNorm。它是理解“Pre-Norm 结构为什么能训深”和“训练稳定性”的基础。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[&quot;输入 x&quot;] --&gt; B[&quot;算均方根 rms&quot;]\n  B --&gt; C[&quot;x / rms&quot;]\n  C --&gt; D[&quot;乘以可学习缩放 g&quot;]\n  D --&gt; E[&quot;输出&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<div class=\"katex-block\">\\text{RMSNorm}(x)=\\frac{x}{\\sqrt{\\frac{1}{d}\\sum_i x_i^2+\\epsilon}}\\odot g<\/div>\n<p>与 LayerNorm 的差别：LayerNorm 先减均值再除以标准差，RMSNorm 只除以均方根。少了减均值这一步，计算更快，且在 Transformer 上效果差别很小。<\/p>\n<p><span class=\"katex-inline\">\\epsilon<\/span> 是防止除零的小常数，通常取 <span class=\"katex-inline\">10^{-6}<\/span> 量级。<span class=\"katex-inline\">g<\/span> 是每个维度一个可学习参数，让模型自己决定缩放多少。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\nRMSNorm 不是“没有归一化”，它仍然缩放，只是统计量不同。\n<\/li><li>\n归一化不改变方向，只改变长度，因此不能替代激活函数。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch04<\/td><td>Transformer<\/td><td>每个子层前做 RMSNorm<\/td><\/tr><tr><td>ch07<\/td><td>V4<\/td><td>保留 RMSNorm，新增 mHC<\/td><\/tr><tr><td>ch09<\/td><td>V4.1<\/td><td>结构与 V4 一致<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：向量\n<\/li><li>\n后续：Transformer 层、训练稳定性\n<\/ul>", "c10": "<div class=\"source-badge\">出处：本课程整理 · Transformer<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c02\">矩阵乘法<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c09\">RMSNorm<\/a><\/span><\/div><h1>前馈网络（FFN）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 4 章、第 5 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>FFN 是对每个 token 独立做“升维—激活—降维”的两层线性变换，负责存储和变换知识。<\/p>\n<h2>为什么重要<\/h2>\n<p>FFN 通常占模型参数的绝大部分。DeepSeekMoE 就是把 FFN 拆成多个专家，从而在不增加单 token 计算量的前提下扩大参数。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[&quot;x: 8 维&quot;] --&gt; B[&quot;W1 升到 32 维&quot;]\n  B --&gt; C[&quot;激活函数&quot;]\n  C --&gt; D[&quot;W2 降回 8 维&quot;]\n  D --&gt; E[&quot;输出&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<div class=\"katex-block\">\\text{FFN}(x)=W_2\\,\\sigma(W_1x)<\/div>\n<p>中间维度通常是隐藏维度的 4 倍。激活函数早期用 ReLU，现代大模型多用 SwiGLU：<\/p>\n<div class=\"katex-block\">\\text{SwiGLU}(x)=\\text{Swish}(xW_1)\\odot(xW_3)<\/div>\n<p>它有两个升维矩阵，参数量比普通 FFN 多，但效果更好。V3 的专家中间维度是 2048，隐藏维度 7168。<\/p>\n<p>MoE 把 FFN 换成多个专家后，每个 token 只走 top-k 个专家，计算量按激活专家算，参数量按全部专家算。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\nFFN 不是“可有可无的附加层”，它承担了大部分知识存储。\n<\/li><li>\nMoE 不是把注意力也拆成专家，通常只拆 FFN。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch04<\/td><td>Transformer<\/td><td>FFN 升维再降维<\/td><\/tr><tr><td>ch05<\/td><td>DeepSeekMoE<\/td><td>FFN 拆成共享 + 路由专家<\/td><\/tr><tr><td>ch07<\/td><td>V4<\/td><td>专家数 256，激活 6<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：矩阵乘法、RMSNorm\n<\/li><li>\n后续：DeepSeekMoE、负载均衡\n<\/ul>", "c11": "<div class=\"source-badge\">出处：本课程整理 · 生成<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c03\">softmax<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c04\">参数与损失<\/a><\/span><\/div><h1>自回归生成<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 4 章、第 6 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>自回归生成是每次根据已有 token 预测下一个 token，把它接回输入，再预测下一个，循环直到结束。<\/p>\n<h2>为什么重要<\/h2>\n<p>所有对话模型、推理模型都用这种方式输出。理解它，才能理解为什么推理分“预填充”和“解码”两个阶段，为什么 KV cache 重要。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">sequenceDiagram\n  participant U as 输入\n  participant M as 模型\n  participant O as 输出\n  U-&gt;&gt;M: 今天天气\n  M-&gt;&gt;O: 怎\n  O-&gt;&gt;U: 今天天气怎\n  U-&gt;&gt;M: 今天天气怎\n  M-&gt;&gt;O: 么\n  O-&gt;&gt;U: 今天天气怎么\n  U-&gt;&gt;M: 今天天气怎么\n  M-&gt;&gt;O: 样<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>两个阶段：<\/p>\n<ol><li>\n<strong>预填充<\/strong>（prefill）：把整段输入一次性送进模型，并行计算所有位置的 K/V，建立 KV cache。计算密集，GPU 利用率高。\n<\/li><li>\n<strong>解码<\/strong>（decode）：每次只生成一个 token，读已有 KV cache，算新 token 的 Q 和输出。显存带宽密集，延迟受限于搬运速度。\n<\/ol>\n<p>生成长度越长，解码阶段占比越高。投机解码、MTP、DSpark 都是在解码阶段做加速。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n训练时不是自回归串行，而是整句并行、用因果掩码防偷看。\n<\/li><li>\n生成不是每次重算全部 token，KV cache 让历史只算一次。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch04<\/td><td>Transformer<\/td><td>输出头产生下一个 token 分布<\/td><\/tr><tr><td>ch06<\/td><td>R1<\/td><td>长思维链让解码 token 数暴涨<\/td><\/tr><tr><td>ch09<\/td><td>V4.1<\/td><td>DSpark 加速解码<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：softmax、Transformer 层\n<\/li><li>\n后续：KV cache、投机解码\n<\/ul>", "c12": "<div class=\"source-badge\">出处：DeepSeek-V3 技术报告 §2.1<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c07\">Q / K / V<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c16\">KV cache<\/a><\/span><\/div><h1>MLA（多头潜在注意力）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 5 章、第 10 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>MLA 把每个 token 的 K/V 压缩成一个低维潜向量再缓存，需要时升维还原，并用解耦 RoPE 保留位置信息。<\/p>\n<h2>为什么重要<\/h2>\n<p>MLA 是 DeepSeek-V2 提出、V3 继承的关键技术。它让长上下文推理的 KV cache 从“每 token 几十 KB”降到“几 KB”，是 DeepSeek 能把上下文拉到 128K 甚至 1M 的基础。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  H[&quot;输入 h&quot;] --&gt; D[&quot;降维 W_DKV&quot;]\n  D --&gt; C[&quot;潜向量 c_KV（缓存）&quot;]\n  C --&gt; UK[&quot;升维 W_UK → K&quot;]\n  C --&gt; UV[&quot;升维 W_UV → V&quot;]\n  H --&gt; R[&quot;RoPE 分支 k_R（缓存）&quot;]\n  UK --&gt; A[&quot;注意力计算&quot;]\n  UV --&gt; A\n  R --&gt; A<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>标准 MHA 缓存每个 token 的全部 K、V，大小是 <span class=\"katex-inline\">2n_hd_h<\/span> 个数。MLA 缓存：<\/p>\n<ul><li>\n内容潜向量 <span class=\"katex-inline\">c^{KV}<\/span>，维度 <span class=\"katex-inline\">d_c<\/span>，V3 取 512。\n<\/li><li>\n解耦 RoPE 的 key <span class=\"katex-inline\">k^R<\/span>，每头 64 维。\n<\/ul>\n<p>需要 K、V 时：<\/p>\n<div class=\"katex-block\">k^C=c^{KV}W^{UK},\\quad v^C=c^{KV}W^{UV}<\/div>\n<p>K 由内容部分 <span class=\"katex-inline\">k^C<\/span> 和位置部分 <span class=\"katex-inline\">k^R<\/span> 拼接。V 只用内容部分。<\/p>\n<p>为什么解耦：RoPE 是旋转操作，对每个头的位置敏感。如果把位置信息压进低维潜向量，升维后旋转关系会被破坏。解耦后，位置信息走单独的小通道，压缩通道只存内容。<\/p>\n<p>代价：MLA 的计算图比 MHA 复杂，训练时需要同时学降维和升维矩阵；但推理时缓存大幅减少，吞吐提升。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\nMLA 不是简单地把 K/V 量化到低比特，它是改变表示维度。\n<\/li><li>\n解耦 RoPE 不是“不用位置编码”，而是把位置编码单独保留。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch05<\/td><td>V3 地基<\/td><td>KV cache 减少约 93.3%<\/td><\/tr><tr><td>ch08<\/td><td>V4<\/td><td>被 CSA/HCA 取代，但低秩压缩思想保留<\/td><\/tr><tr><td>ch10<\/td><td>架构对比<\/td><td>MLA 是“压缩缓存”路线的起点<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：Q/K/V、KV cache\n<\/li><li>\n后续：CSA、HCA、CSA2\n<\/ul><details class=\"depth-fragment\"><summary>展开完整第一性原理推导（MLA（多头潜在注意力））<\/summary><div class=\"depth-body\"><h2>MLA 的第一性原理推导：把 KV cache 从 64 KB 压到几 KB<\/h2>\n<h3>第一步：先算清楚 KV cache 到底多大<\/h3>\n<p>一个 token 在标准多头注意力里，需要缓存 K 和 V。每个头有 <span class=\"katex-inline\">d_h<\/span> 维，有 <span class=\"katex-inline\">n_h<\/span> 个头，每个数用 2 字节（FP16）存：<\/p>\n<div class=\"katex-block\">\\text{每 token 字节}=2\\times n_h\\times d_h\\times 2<\/div>\n<p>V3 的配置：<span class=\"katex-inline\">n_h=128<\/span>，<span class=\"katex-inline\">d_h=128<\/span>。<\/p>\n<div class=\"katex-block\">2\\times128\\times128\\times2=65{,}536\\ \\text{字节}=64\\ \\text{KB}<\/div>\n<p>100 万 token：<\/p>\n<div class=\"katex-block\">65{,}536\\times1{,}000{,}000=65{,}536{,}000{,}000\\ \\text{字节}\\approx65.5\\ \\text{GB}<\/div>\n<p>这就是为什么长上下文模型拼命压 KV cache。<\/p>\n<h3>第二步：能不能只存一个“压缩包”<\/h3>\n<p>K 和 V 虽然维度高，但它们由同一个输入 <span class=\"katex-inline\">h<\/span> 投影出来，信息有冗余。假设存在一个低维表示 <span class=\"katex-inline\">c<\/span>，能通过两个矩阵还原出 K 和 V：<\/p>\n<div class=\"katex-block\">k=cW_{UK},\\quad v=cW_{UV}<\/div>\n<p>那么缓存 <span class=\"katex-inline\">c<\/span> 就够了。<span class=\"katex-inline\">c<\/span> 的维度 <span class=\"katex-inline\">d_c<\/span> 远小于 <span class=\"katex-inline\">2n_hd_h<\/span> 时，缓存大幅下降。<\/p>\n<p>V3 取 <span class=\"katex-inline\">d_c=512<\/span>。每个 token 的内容潜向量是 512 个数，FP16 下 1024 字节，而不是 65,536 字节。<\/p>\n<h3>第三步：怎么得到这个压缩包<\/h3>\n<p>用一个降维矩阵 <span class=\"katex-inline\">W_{DKV}<\/span>：<\/p>\n<div class=\"katex-block\">c^{KV}=hW_{DKV}<\/div>\n<p><span class=\"katex-inline\">h<\/span> 是当前 token 的隐藏向量（7168 维），<span class=\"katex-inline\">W_{DKV}<\/span> 把它压到 512 维。需要 K、V 时再升维：<\/p>\n<div class=\"katex-block\">k^C=c^{KV}W_{UK},\\quad v^C=c^{KV}W_{UV}<\/div>\n<p>注意这里的 <span class=\"katex-inline\">W_{UK}<\/span>、<span class=\"katex-inline\">W_{UV}<\/span> 是“上投影”，和标准注意力的 <span class=\"katex-inline\">W_K<\/span>、<span class=\"katex-inline\">W_V<\/span> 作用类似，但输入是压缩后的 <span class=\"katex-inline\">c^{KV}<\/span>。<\/p>\n<h3>第四步：位置信息为什么不能一起压<\/h3>\n<p>RoPE 的做法是把向量按位置旋转一个角度。旋转依赖每个头的具体维度。如果把位置信息压进 <span class=\"katex-inline\">c^{KV}<\/span> 再升维，升维矩阵会把旋转关系搅乱，模型就分不清位置。<\/p>\n<p>MLA 的解法是<strong>解耦<\/strong>：内容走压缩通道，位置走单独的小通道。每个头保留 64 维的 <span class=\"katex-inline\">k^R<\/span>，只承载 RoPE，不参与低秩压缩。最终 K 是内容部分和位置部分拼接：<\/p>\n<div class=\"katex-block\">k=[k^C;\\ k^R]<\/div>\n<p>缓存里存 <span class=\"katex-inline\">c^{KV}<\/span> 和 <span class=\"katex-inline\">k^R<\/span> 两份，仍然远小于完整 K/V。<\/p>\n<h3>第五步：数值感受一下<\/h3>\n<p>假设 <span class=\"katex-inline\">d_c=512<\/span>，每头 RoPE 64 维、128 头。缓存每 token：<\/p>\n<ul><li>\n内容潜向量：512 个数\n<\/li><li>\nRoPE key：<span class=\"katex-inline\">64\\times128=8192<\/span> 个数（有些实现会共享，具体随配置）\n<\/ul>\n<p>合计约 8704 个数，FP16 下约 17 KB。相比 64 KB，压到约四分之一。V3 报告给出的 93.3% 降幅对应更优的配置与实现。<\/p>\n<h3>第六步：为什么不直接量化<\/h3>\n<p>量化是把每个数从 16 位压到 8 位或 4 位，精度损失直接作用在 K/V 上，长上下文容易崩。MLA 是改变表示结构：用低秩假设去掉冗余，再让模型在训练中学会“压完后仍然够用”。两者可以叠加，但解决的不是同一个问题。<\/p>\n<h3>差生检查<\/h3>\n<ul><li>\n字节数计算逐步展开，乘法和单位换算都能复核。\n<\/li><li>\n<span class=\"katex-inline\">d_c<\/span>、<span class=\"katex-inline\">n_h<\/span>、<span class=\"katex-inline\">d_h<\/span> 第一次出现都给了含义。\n<\/li><li>\n解释了“为什么解耦 RoPE”这个设计动机，而不只是说“MLA 用了 RoPE”。\n<\/li><li>\n数值示例标明是量级演示，避免把示例当成 V3 的精确配置。\n<\/ul>\n<h3>前置与后续<\/h3>\n<ul><li>\n前置：Q/K/V、KV cache、矩阵乘法（第 1、3、5 章）\n<\/li><li>\n后续：CSA/HCA 的压缩思路（第 8 章）、CSA2 跨层复用（第 9 章）\n<\/ul><\/div><\/details>", "c13": "<div class=\"source-badge\">出处：DeepSeek-V3 技术报告 §2.2<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c03\">softmax<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c10\">前馈网络（FFN）<\/a><\/span><\/div><h1>DeepSeekMoE<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 5 章、第 7 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>DeepSeekMoE 把 FFN 拆成大量细粒度路由专家和一个共享专家，每个 token 只激活少数专家。<\/p>\n<h2>为什么重要<\/h2>\n<p>它让模型总参数可以做到 671B、1.6T，而单 token 计算只按 37B、49B 的激活参数算。没有 MoE，DeepSeek 的规模故事不成立。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  X[&quot;token 向量&quot;] --&gt; S[&quot;共享专家（总激活）&quot;]\n  X --&gt; R[&quot;路由打分&quot;]\n  R --&gt; E1[&quot;专家 1&quot;]\n  R --&gt; E2[&quot;专家 2&quot;]\n  R --&gt; E3[&quot;……专家 256&quot;]\n  E1 --&gt; C[&quot;加权合并&quot;]\n  E2 --&gt; C\n  E3 --&gt; C\n  S --&gt; C\n  C --&gt; O[&quot;输出&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>V3 配置：1 个共享专家 + 256 个路由专家，每个 token 激活 8 个路由专家。V4-Flash 激活 6 个，V4-Pro 384 个路由专家、激活 6 个。<\/p>\n<p>路由分数：<\/p>\n<div class=\"katex-block\">s_i=\\text{Sigmoid}(x\\cdot e_i)<\/div>\n<p>取 top-k 后归一化，得到每个被选中专家的权重。共享专家不参与路由，所有 token 都过它。<\/p>\n<p>为什么细粒度：一个大专家只能整体激活或整体不激活；拆成很多小专家后，组合空间更大，不同 token 可以调用不同的知识片段。<\/p>\n<p>为什么共享专家：路由专家会被不同 token 轮流使用，容易重复学习通用知识。共享专家专门兜住通用部分，让路由专家更专注细分。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\nMoE 不是“每个 token 只用一个专家”，是 top-k 加共享专家。\n<\/li><li>\n专家不是按学科划分的，训练不会给每个专家打上“数学专家”“语法专家”的标签。\n<\/li><li>\n总参数大不等于计算量大，只有激活参数参与当前 token 的计算。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch05<\/td><td>V3 地基<\/td><td>1 共享 + 256 路由，激活 8<\/td><\/tr><tr><td>ch07<\/td><td>V4<\/td><td>256 路由，激活 6<\/td><\/tr><tr><td>ch09<\/td><td>V4.1<\/td><td>256 路由，激活 6，专家中间维度 2048<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：FFN、softmax\n<\/li><li>\n后续：负载均衡、专家塌缩\n<\/ul><details class=\"depth-fragment\"><summary>展开完整第一性原理推导（DeepSeekMoE）<\/summary><div class=\"depth-body\"><h2>DeepSeekMoE 的第一性原理推导：为什么“专家多、激活少”能同时省算力和涨参数<\/h2>\n<h3>第一步：先看清普通 FFN 的成本<\/h3>\n<p>一个 FFN 做两次矩阵乘法：<\/p>\n<div class=\"katex-block\">y=W_2\\sigma(W_1x)<\/div>\n<p>设输入 <span class=\"katex-inline\">d=7168<\/span>，中间维度 <span class=\"katex-inline\">m=18432<\/span>。参数量：<\/p>\n<div class=\"katex-block\">d\\times m+m\\times d=2\\times7168\\times18432\\approx2.64\\ \\text{亿}<\/div>\n<p>每个 token 都要过这 2.64 亿个参数，计算量也是这个量级。想让模型记住更多知识，最直接的办法是把 <span class=\"katex-inline\">m<\/span> 加大，但每个 token 的计算量跟着涨。<\/p>\n<h3>第二步：把一个大 FFN 切成很多小专家<\/h3>\n<p>把中间维度 18432 切成 256 份，每份 2048 维，每份就是一个“专家”。每个专家的参数量：<\/p>\n<div class=\"katex-block\">2\\times7168\\times2048\\approx2935\\ \\text{万}<\/div>\n<p>256 个专家总参数约 75 亿，比原来大 28 倍。但如果每个 token 只激活其中 8 个，计算量是：<\/p>\n<div class=\"katex-block\">8\\times2935\\ \\text{万}\\approx2.35\\ \\text{亿}<\/div>\n<p>和原来一个 FFN 的 2.64 亿差不多。参数量涨了 28 倍，单 token 计算却没涨。这就是 MoE 的核心账本。<\/p>\n<h3>第三步：路由怎么选专家<\/h3>\n<p>每个专家有一个可学习的向量 <span class=\"katex-inline\">e_i<\/span>。token 向量 <span class=\"katex-inline\">x<\/span> 和 <span class=\"katex-inline\">e_i<\/span> 做内积，再取 Sigmoid：<\/p>\n<div class=\"katex-block\">s_i=\\text{Sigmoid}(x\\cdot e_i)<\/div>\n<p>Sigmoid 把分数压到 0 到 1 之间。取分数最高的 <span class=\"katex-inline\">k<\/span> 个专家（V3 的 <span class=\"katex-inline\">k=8<\/span>），再把这 <span class=\"katex-inline\">k<\/span> 个分数归一化，作为加权系数。每个被选中专家算自己的 FFN，输出按系数加权相加。<\/p>\n<h3>第四步：为什么还要一个共享专家<\/h3>\n<p>路由专家会被不同 token 轮流使用。如果所有 token 都需要“基本语法”这类通用知识，每个被选中的专家都得学一遍，参数浪费。<\/p>\n<p>加一个<strong>共享专家<\/strong>，所有 token 都过它，专门学通用知识。路由专家就不用重复学通用部分，可以专注细分模式。V3 是 1 个共享 + 256 个路由。<\/p>\n<h3>第五步：专家为什么会“饿死”<\/h3>\n<p>训练初期，某些专家的 <span class=\"katex-inline\">e_i<\/span> 碰巧和很多 token 的内积大，路由把大量 token 送给它们。这些专家梯度多、学得快，变得更强；其他专家拿不到 token，梯度接近 0，永远学不出来。这叫<strong>专家塌缩<\/strong>。<\/p>\n<p>传统解法是加辅助损失：<\/p>\n<div class=\"katex-block\">L_{\\text{aux}}=\\alpha\\sum_i f_i p_i<\/div>\n<p><span class=\"katex-inline\">f_i<\/span> 是分给专家 <span class=\"katex-inline\">i<\/span> 的 token 比例，<span class=\"katex-inline\">p_i<\/span> 是路由概率均值。这个损失惩罚“负载集中”。但它和语言建模目标打架，<span class=\"katex-inline\">\\alpha<\/span> 难调。<\/p>\n<p>DeepSeek 的解法：给每个专家一个偏置 <span class=\"katex-inline\">b_i<\/span>，路由分数改成 <span class=\"katex-inline\">s_i+b_i<\/span>。训练时统计负载，负载高的专家调低 <span class=\"katex-inline\">b_i<\/span>，负载低的调高 <span class=\"katex-inline\">b_i<\/span>。偏置只影响“选不选”，不影响选中后的加权系数。这样不用往主损失里加项，也能把负载拉平。<\/p>\n<h3>第六步：一次完整的玩具计算<\/h3>\n<p>3 个专家，<span class=\"katex-inline\">k=1<\/span>，token 与专家的分数：<\/p>\n<ul><li>\n<span class=\"katex-inline\">s_1=0.9<\/span>，<span class=\"katex-inline\">s_2=0.5<\/span>，<span class=\"katex-inline\">s_3=0.1<\/span>\n<\/ul>\n<p>选 top-1 就是专家 1。输出就是专家 1 的 FFN 输出，权重 1。若 <span class=\"katex-inline\">k=2<\/span>，选专家 1 和 2，归一化权重：<\/p>\n<div class=\"katex-block\">w_1=\\frac{0.9}{0.9+0.5}=0.643,\\quad w_2=\\frac{0.5}{1.4}=0.357<\/div>\n<p>输出 <span class=\"katex-inline\">=0.643\\cdot\\text{FFN}_1(x)+0.357\\cdot\\text{FFN}_2(x)<\/span>。检查：两个权重相加为 1。<\/p>\n<h3>差生检查<\/h3>\n<ul><li>\n参数量与计算量分开算，明确“总参数”和“激活参数”不是一回事。\n<\/li><li>\n路由、Sigmoid、归一化都给了公式和数字。\n<\/li><li>\n解释了“共享专家”和“负载均衡”的设计动机，并给了反例（专家塌缩）。\n<\/li><li>\n玩具计算可以手算复核。\n<\/ul>\n<h3>前置与后续<\/h3>\n<ul><li>\n前置：FFN、矩阵乘法、softmax（第 1、4 章）\n<\/li><li>\n后续：V3/V4 的专家配置（第 5、7 章）、负载均衡偏置（第 5 章）\n<\/ul><\/div><\/details>", "c14": "<div class=\"source-badge\">出处：DeepSeek-V3 技术报告 §2.3<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c11\">自回归生成<\/a><\/span><\/div><h1>MTP（多 token 预测）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 5 章、第 8 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>MTP 在训练时让每个位置额外预测未来第 2 个 token，增加训练信号密度，也可用于推理时的投机解码。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是 DeepSeek-V3 的三大地基之一，V4 继续保留。理解 MTP，才能理解“为什么训练 token 数不算多，模型却学得快”。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  H[&quot;位置 t 的隐藏状态&quot;] --&gt; M[&quot;主头：预测 t+1&quot;]\n  H --&gt; T[&quot;MTP 头&quot;]\n  E[&quot;t+1 的 token 嵌入&quot;] --&gt; T\n  T --&gt; N[&quot;预测 t+2&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>标准语言模型在每个位置只监督下一个 token。MTP 增加一条支路：<\/p>\n<ol><li>\n取位置 <span class=\"katex-inline\">t<\/span> 的隐藏状态 <span class=\"katex-inline\">h_t<\/span>。\n<\/li><li>\n把位置 <span class=\"katex-inline\">t+1<\/span> 的 token 嵌入 <span class=\"katex-inline\">e_{t+1}<\/span> 投影后与 <span class=\"katex-inline\">h_t<\/span> 结合。\n<\/li><li>\n用结合后的表示预测 <span class=\"katex-inline\">t+2<\/span>。\n<\/ol>\n<p>损失是主损失加 MTP 损失的加权和。V3 的 MTP 深度为 1。<\/p>\n<p>推理时，MTP 头可以当草稿模型：先猜出若干个 token，再让主模型并行验证，接受匹配的前缀。这叫投机解码。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\nMTP 不是“推理时一次输出两个 token”，输出仍由主模型验证。\n<\/li><li>\nMTP 的主要收益在训练，不在推理；推理加速是附带用途。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch05<\/td><td>V3<\/td><td>MTP 深度 1，训练信号更密<\/td><\/tr><tr><td>ch07<\/td><td>V4<\/td><td>保留 MTP，用于投机解码<\/td><\/tr><tr><td>ch09<\/td><td>V4.1<\/td><td>用 DSpark 替代 MTP 做推理加速<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：自回归生成、softmax\n<\/li><li>\n后续：投机解码、DSpark\n<\/ul>", "c15": "<div class=\"source-badge\">出处：DeepSeek-V3 技术报告 §2.2<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c03\">softmax<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c13\">DeepSeekMoE<\/a><\/span><\/div><h1>负载均衡<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 5 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>负载均衡是防止 MoE 路由器总把 token 送给少数专家、导致其他专家“饿死”的训练技巧。<\/p>\n<h2>为什么重要<\/h2>\n<p>MoE 训练最常见的失败模式就是专家塌缩。DeepSeek 的无辅助损失方案是 V3 论文的亮点之一，也是后续 V4 继承的关键设计。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[&quot;一批 token&quot;] --&gt; B[&quot;路由打分&quot;]\n  B --&gt; C{&quot;各专家负载均衡?&quot;}\n  C --&gt;|否| D[&quot;调高冷门专家偏置&quot;]\n  D --&gt; B\n  C --&gt;|是| E[&quot;正常训练&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>问题：路由分数由 token 和专家向量的内积决定，训练初期某些专家可能碰巧得分高，越来越多 token 涌向它们。结果少数专家过载，多数专家得不到梯度。<\/p>\n<p>传统方案：加辅助损失，惩罚负载不均。但辅助损失和语言建模目标冲突，权重难调，还会损害模型效果。<\/p>\n<p>DeepSeek 方案：给每个专家一个可学习偏置 <span class=\"katex-inline\">b_i<\/span>，路由分数变成 <span class=\"katex-inline\">s_i+b_i<\/span>。训练时统计每个专家的负载，负载高的调低偏置，负载低的调高偏置。偏置只影响“选不选”，不影响被选中后的权重。<\/p>\n<div class=\"katex-block\">s_i=\\text{Sigmoid}(x\\cdot e_i)+b_i<\/div>\n<p>这样负载均衡通过调整选择偏好实现，不往主损失里塞额外项。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n负载均衡不是“平均分配所有 token”，而是防止极端失衡。\n<\/li><li>\n无辅助损失不是“完全不管均衡”，而是用偏置调节代替损失项。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch05<\/td><td>V3<\/td><td>无辅助损失负载均衡<\/td><\/tr><tr><td>ch07<\/td><td>V4<\/td><td>继承该方案<\/td><\/tr><tr><td>ch09<\/td><td>V4.1<\/td><td>继承该方案<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：DeepSeekMoE、softmax\n<\/li><li>\n后续：训练稳定性\n<\/ul>", "c16": "<div class=\"source-badge\">出处：DeepSeek-V3 技术报告 §2.1<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c07\">Q / K / V<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c11\">自回归生成<\/a><\/span><\/div><h1>KV cache<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 5 章、第 8 章、第 10 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>KV cache 是推理时缓存历史 token 的 Key 和 Value，避免每生成一个新 token 都重算全部历史。<\/p>\n<h2>为什么重要<\/h2>\n<p>长上下文推理的显存瓶颈几乎全在 KV cache。DeepSeek 三代架构的注意力改动，本质上都在想办法把这份缓存压小。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  P[&quot;预填充：整段输入&quot;] --&gt; C[&quot;写入 KV cache&quot;]\n  C --&gt; D[&quot;解码第 1 个 token&quot;]\n  D --&gt; E[&quot;追加新 KV&quot;]\n  E --&gt; F[&quot;解码第 2 个 token&quot;]\n  F --&gt; G[&quot;……&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>标准 MHA 每 token 缓存：<\/p>\n<div class=\"katex-block\">2\\times n_h\\times d_h\\times \\text{字节数}<\/div>\n<p>V3 的 128 头、128 维、FP16：每 token 约 64 KB。100 万 token 就是 64 GB。<\/p>\n<p>压缩路线：<\/p>\n<ul><li>\n<strong>MLA<\/strong>：缓存低维潜向量 + RoPE key，V3 报告减少约 93.3%。\n<\/li><li>\n<strong>CSA<\/strong>：把每 4 个 token 压成一条 KV 记录（V4）。\n<\/li><li>\n<strong>HCA<\/strong>：每 128 个 token 压成一条（V4）。\n<\/li><li>\n<strong>CSA2<\/strong>：跨层复用 KV，进一步减少重复存储（V4.1）。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\nKV cache 不是模型参数，它是推理时的临时状态。\n<\/li><li>\n量化 KV cache 能省显存，但会损失精度；MLA/CSA 是改变表示结构，不是单纯量化。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch05<\/td><td>MLA<\/td><td>压缩潜向量替代完整 K/V<\/td><\/tr><tr><td>ch08<\/td><td>V4<\/td><td>CSA 4:1、HCA 128:1<\/td><\/tr><tr><td>ch09<\/td><td>V4.1<\/td><td>CSA2 跨层复用<\/td><\/tr><tr><td>ch10<\/td><td>架构对比<\/td><td>所有路线都在压同一份缓存<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：Q/K/V、自回归生成\n<\/li><li>\n后续：MLA、CSA、HCA、CSA2\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：向量、矩阵、softmax<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：数字怎么变成“意思”：向量、矩阵与 softmax<\/a><br>检查点：完成 ch01 自测，能手算矩阵乘向量与 softmax<\/li><li class='path-step' id='path-02'><strong>步骤 02：参数、损失、梯度<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：模型怎么学会：参数、损失、梯度<\/a><br>检查点：完成 ch02 自测，能算一次梯度更新<\/li><li class='path-step' id='path-03'><strong>步骤 03：注意力机制<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：注意力机制：一句话里谁该看谁<\/a><br>检查点：能手算 3 个 token 的注意力权重<\/li><li class='path-step' id='path-04'><strong>步骤 04：Transformer 一层楼<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：Transformer 一层一层拆<\/a><br>检查点：能画出一次前向的 shape 变化<\/li><li class='path-step' id='path-05'><strong>步骤 05：V3 的三块地基<\/strong><br>阅读：<a href=\"#/chapter/ch05\">第 5 章：DeepSeek-V3 的三块地基<\/a><br>检查点：能说出 MLA、MoE、MTP 各解决什么问题<\/li><li class='path-step' id='path-06'><strong>步骤 06：附录：形状、公式与手算<\/strong><br>阅读：<a href=\"#/chapter/ch06\">附录：形状、公式与手算清单<\/a><br>检查点：能手算注意力、梯度与 KV cache 字节<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<p>（无综合题）<\/p>", "__quiz_ch01__": "<h1>测验：第 1 章：数字怎么变成“意思”：向量、矩阵与 softmax<\/h1><div class='quiz-item' data-qid='q01' data-type='single' data-concept='c02' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> 一个 2×3 矩阵乘一个 3 维向量，结果是什么形状？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 2×3 矩阵<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 3 维向量<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 2 维向量<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 一个标量<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single' data-concept='c03' data-chapter='ch01'><p class='quiz-q'><b>Q2.<\/b> 对分数 [0, 0, 0] 做 softmax，输出是什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> [0, 0, 0]<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> [1/3, 1/3, 1/3]<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> [1, 0, 0]<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> [3, 3, 3]<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q3.<\/b> embedding 表在模型里做什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 把 token 编号映射成向量<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 把向量压缩成标量<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 把句子翻译成英文<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 计算损失<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch02__": "<h1>测验：第 2 章：模型怎么学会：参数、损失、梯度<\/h1><div class='quiz-item' data-qid='q04' data-type='single' data-concept='c05' data-chapter='ch02'><p class='quiz-q'><b>Q1.<\/b> 梯度为正时，梯度下降会把参数往哪个方向更新？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> 增大<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> 减小<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> 不变<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> 随机<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q05' data-type='single' data-concept='c05' data-chapter='ch02'><p class='quiz-q'><b>Q2.<\/b> w=1、x=2、y=3，损失 L=(wx-y)^2，对 w 的梯度是多少？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> -4<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> 4<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> -2<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> 2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single' data-concept='c04' data-chapter='ch02'><p class='quiz-q'><b>Q3.<\/b> 学习率取得过大，训练曲线通常会出现什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> 收敛更快且稳定<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> 损失震荡或发散<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> 参数不再更新<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> 模型自动变小<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch03__": "<h1>测验：第 3 章：注意力机制：一句话里谁该看谁<\/h1><div class='quiz-item' data-qid='q07' data-type='single' data-concept='c06' data-chapter='ch03'><p class='quiz-q'><b>Q1.<\/b> 注意力里真正被加权混合的是哪一项？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> Query<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> Key<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> Value<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 因果掩码<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single' data-concept='c03' data-chapter='ch03'><p class='quiz-q'><b>Q2.<\/b> 分数 [1, 1, 1] 经过 softmax 后的权重是什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> [1, 0, 0]<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> [1/3, 1/3, 1/3]<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> [0.5, 0.5, 0]<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> [3, 3, 3]<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q09' data-type='single' data-concept='c06' data-chapter='ch03'><p class='quiz-q'><b>Q3.<\/b> 注意力分数为什么要除以 sqrt(d_k)？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q09' value='0'> 让分数更大<\/label><label class='quiz-opt'><input type='radio' name='q09' value='1'> 防止 softmax 过度集中<\/label><label class='quiz-opt'><input type='radio' name='q09' value='2'> 增加注意力头数<\/label><label class='quiz-opt'><input type='radio' name='q09' value='3'> 去掉位置信息<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch04__": "<h1>测验：第 4 章：Transformer 一层一层拆<\/h1><div class='quiz-item' data-qid='q10' data-type='single' data-concept='c08' data-chapter='ch04'><p class='quiz-q'><b>Q1.<\/b> 一个 Transformer 层里，残差连接加在哪两处？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q10' value='0'> 只在注意力后<\/label><label class='quiz-opt'><input type='radio' name='q10' value='1'> 只在 FFN 后<\/label><label class='quiz-opt'><input type='radio' name='q10' value='2'> 注意力和 FFN 后各一次<\/label><label class='quiz-opt'><input type='radio' name='q10' value='3'> 每层最后只加一次<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q11' data-type='single' data-concept='c10' data-chapter='ch04'><p class='quiz-q'><b>Q2.<\/b> 输入形状 [6, 16] 经过 4 倍 FFN 后，中间层形状是什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q11' value='0'> [6, 16]<\/label><label class='quiz-opt'><input type='radio' name='q11' value='1'> [6, 64]<\/label><label class='quiz-opt'><input type='radio' name='q11' value='2'> [24, 16]<\/label><label class='quiz-opt'><input type='radio' name='q11' value='3'> [6, 4]<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q12' data-type='single' data-concept='c11' data-chapter='ch04'><p class='quiz-q'><b>Q3.<\/b> 为什么位置信息必须显式注入 Transformer？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q12' value='0'> 让模型知道词序<\/label><label class='quiz-opt'><input type='radio' name='q12' value='1'> 减少参数量<\/label><label class='quiz-opt'><input type='radio' name='q12' value='2'> 加速训练<\/label><label class='quiz-opt'><input type='radio' name='q12' value='3'> 替代注意力<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch05__": "<h1>测验：第 5 章：DeepSeek-V3 的三块地基<\/h1><div class='quiz-item' data-qid='q13' data-type='single' data-concept='c12' data-chapter='ch05'><p class='quiz-q'><b>Q1.<\/b> MLA 推理时缓存的核心内容是什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q13' value='0'> 每个头的完整 K 和 V<\/label><label class='quiz-opt'><input type='radio' name='q13' value='1'> 低维潜向量和 RoPE key<\/label><label class='quiz-opt'><input type='radio' name='q13' value='2'> 只有 Query<\/label><label class='quiz-opt'><input type='radio' name='q13' value='3'> 整个隐藏层输出<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q14' data-type='single' data-concept='c13' data-chapter='ch05'><p class='quiz-q'><b>Q2.<\/b> DeepSeekMoE 中共享专家的作用是什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q14' value='0'> 只处理英文<\/label><label class='quiz-opt'><input type='radio' name='q14' value='1'> 始终激活，兜住通用知识<\/label><label class='quiz-opt'><input type='radio' name='q14' value='2'> 只处理数学题<\/label><label class='quiz-opt'><input type='radio' name='q14' value='3'> 替代注意力<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q15' data-type='single' data-concept='c14' data-chapter='ch05'><p class='quiz-q'><b>Q3.<\/b> MTP 在训练时额外预测哪个位置？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q15' value='0'> 只预测 t+1<\/label><label class='quiz-opt'><input type='radio' name='q15' value='1'> 额外预测 t+2<\/label><label class='quiz-opt'><input type='radio' name='q15' value='2'> 预测前一个 token<\/label><label class='quiz-opt'><input type='radio' name='q15' value='3'> 随机位置<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='向量'>向量 — 一串有顺序的数字，长度叫维度。 <span class=glossary-ref>（第 1 章：数字怎么变成“意思”：向量、矩阵与 softmax）<\/span><\/li><li data-term='矩阵乘法'>矩阵乘法 — 左矩阵每行与右矩阵每列做点积，得到新矩阵。 <span class=glossary-ref>（第 1 章：数字怎么变成“意思”：向量、矩阵与 softmax）<\/span><\/li><li data-term='softmax'>softmax — 把分数转成非负、总和为 1 的权重。 <span class=glossary-ref>（第 1 章：数字怎么变成“意思”：向量、矩阵与 softmax）<\/span><\/li><li data-term='token'>token — 模型处理文本的基本单位，可以是一个字、一个词或词的一部分。 <span class=glossary-ref>（第 1 章：数字怎么变成“意思”：向量、矩阵与 softmax）<\/span><\/li><li data-term='embedding'>embedding — 把 token 编号映射成固定长度向量的表。 <span class=glossary-ref>（第 1 章：数字怎么变成“意思”：向量、矩阵与 softmax）<\/span><\/li><li data-term='参数'>参数 — 模型里可训练的数值，比如矩阵元素。 <span class=glossary-ref>（第 2 章：模型怎么学会：参数、损失、梯度）<\/span><\/li><li data-term='损失'>损失 — 衡量预测与正确答案差距的标量。 <span class=glossary-ref>（第 2 章：模型怎么学会：参数、损失、梯度）<\/span><\/li><li data-term='梯度'>梯度 — 损失对参数的变化率，指示更新方向。 <span class=glossary-ref>（第 2 章：模型怎么学会：参数、损失、梯度）<\/span><\/li><li data-term='学习率'>学习率 — 每次参数更新走多大的一步。 <span class=glossary-ref>（第 2 章：模型怎么学会：参数、损失、梯度）<\/span><\/li><li data-term='过拟合'>过拟合 — 训练集上损失很小，换数据就变差。 <span class=glossary-ref>（第 2 章：模型怎么学会：参数、损失、梯度）<\/span><\/li><li data-term='注意力'>注意力 — 按 token 间相似度加权收集信息的机制。 <span class=glossary-ref>（第 3 章：注意力机制：一句话里谁该看谁）<\/span><\/li><li data-term='q / k / v'>Q / K / V — 查询、键、值，同一输入的三次投影。 <span class=glossary-ref>（第 3 章：注意力机制：一句话里谁该看谁）<\/span><\/li><li data-term='多头注意力'>多头注意力 — 并行多套 Q/K/V，捕捉不同关系。 <span class=glossary-ref>（第 3 章：注意力机制：一句话里谁该看谁）<\/span><\/li><li data-term='因果掩码'>因果掩码 — 禁止每个 token 看到未来 token。 <span class=glossary-ref>（第 3 章：注意力机制：一句话里谁该看谁）<\/span><\/li><li data-term='残差连接'>残差连接 — 把子层输入加到子层输出。 <span class=glossary-ref>（第 4 章：Transformer 一层一层拆）<\/span><\/li><li data-term='rmsnorm'>RMSNorm — 用均方根缩放向量的归一化。 <span class=glossary-ref>（第 4 章：Transformer 一层一层拆）<\/span><\/li><li data-term='ffn'>FFN — 对每个 token 独立做升维-激活-降维。 <span class=glossary-ref>（第 4 章：Transformer 一层一层拆）<\/span><\/li><li data-term='自回归生成'>自回归生成 — 逐个预测下一个 token 并接回输入。 <span class=glossary-ref>（第 4 章：Transformer 一层一层拆）<\/span><\/li><li data-term='mla'>MLA — 用低维潜向量压缩 KV cache 的注意力。 <span class=glossary-ref>（第 5 章：DeepSeek-V3 的三块地基）<\/span><\/li><li data-term='deepseekmoe'>DeepSeekMoE — 共享专家 + 细粒度路由专家的混合专家结构。 <span class=glossary-ref>（第 5 章：DeepSeek-V3 的三块地基）<\/span><\/li><li data-term='mtp'>MTP — 训练时额外预测未来第 2 个 token。 <span class=glossary-ref>（第 5 章：DeepSeek-V3 的三块地基）<\/span><\/li><li data-term='kv cache'>KV cache — 推理时缓存历史 token 的 K/V。 <span class=glossary-ref>（第 5 章：DeepSeek-V3 的三块地基）<\/span><\/li><li data-term='专家塌缩'>专家塌缩 — MoE 路由总选少数专家，其他专家学不到东西。 <span class=glossary-ref>（第 5 章：DeepSeek-V3 的三块地基）<\/span><\/li><\/ul>", "__diagnosis__": "<h1>诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：从数字到结构<\/h2>\n<p>学任何一个模型结构，按“输入是什么数字 → 做哪种运算 → 形状怎么变 → 解决什么问题”四步走。不要先背名字。<\/p>\n<h2>框架：三件套理解法<\/h2>\n<p>每个抽象概念至少配一个类比、一个图示、一个可手算的实例；缺一个就容易停在“好像懂了”。<\/p>\n<h2>决策规则<\/h2>\n<ul><li>\n看到公式先问“每个符号是什么”，再问“为什么这样设计”。\n<\/li><li>\n看到架构先问“它省的是计算、显存还是带宽”。\n<\/li><li>\n看到数字先问“单位是什么、和谁比”。\n<\/ul>\n<h2>反模式<\/h2>\n<ul><li>\n只背缩写，不追动机。\n<\/li><li>\n把“注意力权重”当成模型解释。\n<\/li><li>\n把总参数和激活参数混为一谈。\n<\/ul>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式与规则<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>矩阵乘向量<\/td><td>每行与向量做点积<\/td><\/tr><tr><td>softmax<\/td><td><span class=\"katex-inline\">e^{z_i}/\\sum_j e^{z_j}<\/span><\/td><\/tr><tr><td>梯度下降<\/td><td><span class=\"katex-inline\">w\\leftarrow w-\\eta\\partial L/\\partial w<\/span><\/td><\/tr><tr><td>注意力分数<\/td><td><span class=\"katex-inline\">q\\cdot k/\\sqrt{d_k}<\/span><\/td><\/tr><tr><td>注意力输出<\/td><td><span class=\"katex-inline\">\\sum_j\\alpha_{ij}v_j<\/span><\/td><\/tr><tr><td>残差<\/td><td><span class=\"katex-inline\">y=x+\\mathrm{Layer}(x)<\/span><\/td><\/tr><tr><td>RMSNorm<\/td><td><span class=\"katex-inline\">x/\\sqrt{\\mathrm{mean}(x^2)+\\epsilon}\\odot g<\/span><\/td><\/tr><\/tbody><\/table>\n<h2>关键数字<\/h2>\n<table><thead><tr><th>项目<\/th><th>数值<\/th><\/tr><\/thead><tbody><tr><td>V3 总参数 / 激活<\/td><td>671B / 37B<\/td><\/tr><tr><td>V3 层数 / 头数<\/td><td>61 / 128<\/td><\/tr><tr><td>V3 路由专家 / 激活<\/td><td>256 / 8<\/td><\/tr><tr><td>V3 预训练 token<\/td><td>14.8T<\/td><\/tr><tr><td>V3 上下文<\/td><td>128K<\/td><\/tr><\/tbody><\/table>"}};
const pages = DATA.rendered;
const manifest = DATA.manifest;
const SYN_GROUPS = [["定义", "含义", "释义", "概念"], ["例题", "算例", "示例", "例子", "案例"], ["习题", "题目", "练习", "测验", "自测"], ["推导", "证明", "论证", "演算"], ["步骤", "流程", "过程", "环节"], ["性质", "特性", "特点", "属性"], ["公式", "表达式", "式子"], ["定理", "定律", "法则", "准则"], ["图像", "图形", "图示", "曲线"], ["计算", "求解", "算出", "求值"], ["平均值", "均值", "平均数"], ["误差", "偏差", "偏离"], ["函数", "映射", "对应关系"], ["导数", "变化率", "切线斜率", "微商"], ["原函数", "不定积分", "反导数"], ["概率", "几率", "可能性"]];
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
const ZS_VERSION = '1.5.0';
/* ---------- 进度导出 / 导入（跨设备） ---------- */
function exportProgress(){
  const data = {};
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.indexOf(SLUG+':')===0) data[k]=localStorage.getItem(k);
  }
  const payload = {app:'zhishu', skillVersion:ZS_VERSION, kind:'companion', exportedAt:new Date().toISOString(), prefix:SLUG+':', data};
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (SLUG||'book')+'-progress-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
function importProgress(file){
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const p = JSON.parse(fr.result);
      if(!p || p.app!=='zhishu' || !p.data || typeof p.data!=='object') throw new Error('不是知枢进度文件');
      let n = 0;
      Object.keys(p.data).forEach(k=>{ if(k.indexOf(SLUG+':')===0){ localStorage.setItem(k, p.data[k]); n++; } });
      if(!n){ alert('这个文件里没有属于本书的进度（slug 不一致）'); return; }
      alert('已导入 '+n+' 条进度，页面将刷新'); location.reload();
    }catch(e){ alert('导入失败：'+e.message); }
  };
  fr.readAsText(file);
}
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{}, mastery: store.get('mastery')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  if(h==='diagnosis') return 'diagnosis';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h;
}
function showPage(rid){
  let id;
  if(rid==='path') id='__path__';
  else if(rid==='diagnosis') id='__diagnosis__';
  else if(rid==='graph') id='__graph__';
  else if(rid.startsWith('quiz/')) id='__quiz_'+rid.split('/')[1]+'__';
  else if(rid==='cards') id='__cards__';
  else if(rid==='glossary') id='__glossary__';
  else if(rid==='patterns') id='__patterns__';
  else if(rid==='cheatsheet') id='__cheatsheet__';
  else if(rid.startsWith('chapter/')) id=rid.split('/')[1];
  else if(rid.startsWith('concept/')) id=rid.split('/')[1];
  else id=rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  $$('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(rid==='diagnosis') initDiagnosis();
  if(rid==='graph') initGraph();
  if(id==='__path__') updatePath();
  renderMath();
  renderMermaid();
  applyPendingHighlight();
}

/* ---------- KaTeX 渲染（多源回退） ---------- */
let katexLoading = false, katexReady = false;
function renderMath(){
  const hasMath = document.querySelector('.katex-inline, .katex-block');
  if(!hasMath) return;
  if(katexReady){ doRenderMath(); return; }
  if(katexLoading) return;
  katexLoading = true;
  const cssUrls = [
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.css',
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.css'
  ];
  const jsUrls = [
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.js',
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.js'
  ];
  let ci = 0, ji = 0;
  const tryCss = () => {
    if(ci >= cssUrls.length){ tryJs(); return; }
    const link = document.createElement('link');
    link.rel = 'stylesheet'; link.href = cssUrls[ci++];
    let settled = false, timer = null;
    const next = () => {
      if(settled) return;
      settled = true; clearTimeout(timer); link.remove(); tryCss();
    };
    timer = setTimeout(next, 4000);
    link.onload = () => {
      if(settled) return;
      settled = true; clearTimeout(timer); tryJs();
    };
    link.onerror = next;
    document.head.appendChild(link);
  };
  const tryJs = () => {
    if(ji >= jsUrls.length){ katexLoading = false; return; }
    const s = document.createElement('script');
    s.src = jsUrls[ji++];
    let settled = false, timer = null;
    const next = () => {
      if(settled) return;
      settled = true; clearTimeout(timer); s.onload = null; s.onerror = null; s.remove(); tryJs();
    };
    timer = setTimeout(next, 5000);
    s.onload = () => {
      if(settled) return;
      settled = true; clearTimeout(timer); katexReady = true; katexLoading = false; doRenderMath();
    };
    s.onerror = next;
    document.head.appendChild(s);
  };
  tryCss();
}
function doRenderMath(){
  if(typeof katex === 'undefined') return;
  // 行内公式：.katex-inline 里的内容
  $$('.katex-inline').forEach(el=>{
    try{ katex.render(el.textContent, el, {throwOnError:false}); }catch(e){}
  });
  // 块级公式：.katex-block 里的内容
  $$('.katex-block').forEach(el=>{
    try{ katex.render(el.textContent, el, {displayMode:true, throwOnError:false}); }catch(e){}
  });
}
// 公式内容预处理：把 < 后跟字母的位置转成 &lt;，避免被 HTML 解析器当标签吃掉
// （这是 first-principles-derivation 踩过的坑：$m<n$ 会变成残留 $m）
function sanitizeMathHTML(){
  $$('.katex-inline, .katex-block').forEach(el=>{
    el.innerHTML = el.innerHTML.replace(/<([a-zA-Z])/g, '&lt;$1');
  });
}

/* ---------- 概念/章节依赖查找（用于诊断倒推） ---------- */
function findConcept(id){ return (manifest.concepts||[]).find(c=>c.id===id); }
function findChapter(id){ return (manifest.chapters||[]).find(c=>c.id===id); }
function getPrereqs(node){
  if(!node) return [];
  return node.prerequisites || node.prereqs || [];
}
/**
 * 答错倒推：从错题关联的概念/章节出发，沿 prerequisites 回溯，
 * 返回一串"你可能需要先补的"节点，带跳转链接。
 */
function traceBack(startConceptId, startChapterId){
  const visited = new Set();
  const chain = [];
  const queue = [];
  if(startConceptId){ const c = findConcept(startConceptId); if(c) queue.push({node:c, kind:'concept'}); }
  if(startChapterId){ const c = findChapter(startChapterId); if(c) queue.push({node:c, kind:'chapter'}); }
  while(queue.length && chain.length < 6){
    const {node, kind} = queue.shift();
    if(visited.has(node.id)) continue;
    visited.add(node.id);
    chain.push({node, kind});
    (getPrereqs(node)||[]).forEach(pid=>{
      const cn = findConcept(pid); if(cn){ queue.push({node:cn, kind:'concept'}); return; }
      const ch = findChapter(pid); if(ch) queue.push({node:ch, kind:'chapter'});
    });
  }
  return chain;
}

/* ---------- 测验（带倒推） ---------- */
function initQuizzes(rid){
  $$('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        i.parentElement.style.color = (Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) ? 'var(--ok)' : 'var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 答错时：倒推前置 + 误解卡片 + 掌握度更新
      if(!correct){
        let remedy = item.querySelector('.quiz-remedy');
        if(!remedy){ remedy = document.createElement('div'); remedy.className='quiz-remedy'; item.appendChild(remedy); }
        const chain = traceBack(item.dataset.concept, item.dataset.chapter);
        if(chain.length > 1){
          const links = chain.slice(1).map(({node,kind})=>{
            const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
            return `<a href="${href}">${esc(node.title||node.id)}</a>`;
          }).join(' → ');
          remedy.innerHTML = '可能的根因（沿依赖链回溯）：' + links;
        }
        // 误解卡片：如果选错的选项标注了 misconceptionId
        const checked = item.querySelector('input:checked');
        const misId = checked ? checked.dataset.misconception : '';
        if(misId){
          const mis = (manifest.misconceptions||[]).find(m=>m.id===misId);
          if(mis){
            let misCard = item.querySelector('.misconception-card');
            if(!misCard){ misCard = document.createElement('div'); misCard.className='misconception-card'; item.appendChild(misCard); }
            misCard.innerHTML = `<b>⚠ 常见误解</b><br>你选了「${esc(mis.wrong)}」——${esc(mis.correction)}`;
          }
        }
        // 掌握度下降
        updateMastery(item.dataset.concept, -0.15);
      } else {
        updateMastery(item.dataset.concept, +0.15);
      }
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 知识图谱（vis-network） ---------- */
let networkLoaded = false;
function loadVisNetwork(cb){
  if(networkLoaded){ cb(); return; }
  const urls = [
    'https://cdn.jsdelivr.net/npm/vis-network@9.1.9/dist/vis-network.min.js',
    'https://unpkg.com/vis-network@9.1.9/dist/vis-network.min.js',
    'https://registry.npmmirror.com/vis-network/9.1.9/dist/vis-network.min.js'
  ];
  let i = 0;
  const tryNext = () => {
    if(i >= urls.length) return;
    const s = document.createElement('script');
    s.src = urls[i++];
    const timer = setTimeout(() => { s.onload = null; s.onerror = null; s.remove(); tryNext(); }, 4000);
    s.onload = () => { clearTimeout(timer); networkLoaded = true; cb(); };
    s.onerror = () => { clearTimeout(timer); s.remove(); tryNext(); };
    document.head.appendChild(s);
  };
  tryNext();
}
function initGraph(){
  const container = document.getElementById('graph-container');
  if(!container) return;
  loadVisNetwork(() => {
    if(typeof vis === 'undefined'){ container.innerHTML = '<p class="empty">图谱库加载失败，请联网后刷新</p>'; return; }
    const concepts = manifest.concepts || [];
    const chapters = manifest.chapters || [];
    const nodes = [];
    const edges = [];
    concepts.forEach(c => {
      const mastery = Math.round(getMastery(c.id)*100);
      nodes.push({
        id: 'c_' + c.id,
        label: c.title || c.id,
        title: (c.title||c.id) + '（掌握度 ' + mastery + '%）',
        color: mastery > 70 ? '#86efac' : mastery > 40 ? '#fde68a' : '#fca5a5',
        shape: 'dot',
        size: mastery > 70 ? 20 : 14,
        font: { size: 13 }
      });
    });
    chapters.forEach(ch => {
      nodes.push({
        id: 'ch_' + ch.id,
        label: ch.title || ch.id,
        shape: 'box',
        color: '#93c5fd',
        font: { size: 12 }
      });
    });
    // 前置边
    concepts.forEach(c => {
      (c.prerequisites || []).forEach(p => {
        const pid = typeof p === 'string' ? p : p.id;
        const ptype = typeof p === 'string' ? 'hard' : (p.type || 'hard');
        const from = (pid.startsWith('ch') ? 'ch_' : 'c_') + pid;
        const to = 'c_' + c.id;
        if(nodes.find(n => n.id === from)){
          edges.push({
            from: from, to: to,
            color: { color: ptype === 'hard' ? '#dc2626' : ptype === 'soft' ? '#9ca3af' : '#3b82f6' },
            arrows: 'to',
            width: ptype === 'hard' ? 2 : 1,
            dashes: ptype !== 'hard'
          });
        }
      });
    });
    const data = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };
    const options = {
      physics: { stabilization: true, barnesHut: { gravitationalConstant: -3000 } },
      interaction: { hover: true, tooltipDelay: 200 }
    };
    const net = new vis.Network(container, data, options);
    net.on('click', params => {
      if(params.nodes.length > 0){
        const nid = params.nodes[0];
        if(nid.startsWith('c_')) location.hash = '#/concept/' + nid.slice(2);
        else if(nid.startsWith('ch_')) location.hash = '#/chapter/' + nid.slice(3);
      }
    });
  });
}

/* ---------- 诊断模式 ---------- */
let diagQueue = [], diagIdx = 0, diagWrong = [];
function initDiagnosis(){
  const startBtn = $('#diag-start');
  if(!startBtn || startBtn.dataset.inited) return;
  startBtn.dataset.inited='1';
  startBtn.addEventListener('click', ()=>{
    const all = (manifest.quizzes||[]).slice();
    // 随机抽 5 题（不够就全抽）
    for(let i = all.length-1; i>0; i--){ const j = Math.floor(Math.random()*(i+1)); [all[i],all[j]]=[all[j],all[i]]; }
    diagQueue = all.slice(0, Math.min(5, all.length));
    diagIdx = 0; diagWrong = [];
    showDiagQuestion();
  });
}
function showDiagQuestion(){
  const stage = $('#diag-stage');
  const result = $('#diag-result');
  result.innerHTML = '';
  if(diagIdx >= diagQueue.length){ finishDiagnosis(); return; }
  const q = diagQueue[diagIdx];
  $('#diag-progress').textContent = `第 ${diagIdx+1} / ${diagQueue.length} 题`;
  const fakeItem = document.createElement('div');
  fakeItem.innerHTML = _renderQuizHTML(q, diagIdx+1);
  stage.innerHTML = fakeItem.innerHTML;
  // 绑定检查按钮
  const item = stage.querySelector('.quiz-item');
  const btn = item.querySelector('.quiz-check');
  btn.addEventListener('click', ()=>{
    const type = item.dataset.type;
    let user, correct=false;
    if(type==='single'){
      const sel = item.querySelector('input:checked');
      user = sel? parseInt(sel.value) : null;
      correct = user===q.answer;
    } else if(type==='multi'){
      user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
      const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
      correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
    } else if(type==='blank'){
      const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
      correct = v===String(q.answer).trim().toLowerCase();
    }
    if(!correct){
      diagWrong.push(q);
      const chain = traceBack(q.relatedConceptId, q.chapterId);
      if(chain.length > 1){
        const links = chain.slice(1).map(({node,kind})=>{
          const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
          return `<div class="diag-remedy-item">建议先学：<a href="${href}">${esc(node.title||node.id)}</a></div>`;
        }).join('');
        $('#diag-result').innerHTML = '<h3>这道题答错了，可能的根因：</h3>' + links +
          '<p><button id="diag-next" class="quiz-check">下一题 →</button></p>';
      } else {
        $('#diag-result').innerHTML = '<p><button id="diag-next" class="quiz-check">下一题 →</button></p>';
      }
    } else {
      $('#diag-result').innerHTML = '<p>✓ 正确。<button id="diag-next" class="quiz-check">下一题 →</button></p>';
    }
    $('#diag-next').addEventListener('click', ()=>{ diagIdx++; showDiagQuestion(); });
  });
}
function _renderQuizHTML(q, idx){
  // 复用服务端渲染的 quiz HTML 结构
  const qtype = q.type||'single';
  const qid = q.id||('diag'+idx);
  let html = `<div class='quiz-item' data-qid='${qid}' data-type='${qtype}' data-concept='${esc(q.relatedConceptId||"")}' data-chapter='${esc(q.chapterId||"")}'>`;
  html += `<p class='quiz-q'><b>Q${idx}.</b> ${esc(q.question||"")}</p>`;
  if(qtype==='single'||qtype==='multi'){
    const it = qtype==='single'?'radio':'checkbox';
    html += "<div class='quiz-opts'>";
    (q.options||[]).forEach((o,i)=>{ html += `<label class='quiz-opt'><input type='${it}' name='${qid}' value='${i}'> ${esc(String(o))}</label>`; });
    html += '</div>';
  } else {
    html += `<input class='quiz-blank' type='text' placeholder='填写答案'>`;
  }
  html += `<div class='quiz-actions'><button class='quiz-check'>检查答案</button><span class='quiz-feedback'></span></div></div>`;
  return html;
}
function finishDiagnosis(){
  const total = diagQueue.length;
  const wrong = diagWrong.length;
  const right = total - wrong;
  let html = `<h2>诊断完成：${right}/${total} 正确</h2>`;
  if(wrong === 0){
    html += '<p>这组题全对，可以继续往下学。</p>';
  } else {
    html += `<p>有 ${wrong} 道题答错。下面是按依赖链回溯的补强建议：</p>`;
    const seen = new Set();
    diagWrong.forEach(q=>{
      const chain = traceBack(q.relatedConceptId, q.chapterId);
      chain.slice(1).forEach(({node,kind})=>{
        if(seen.has(node.id)) return;
        seen.add(node.id);
        const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
        html += `<div class="diag-remedy-item"><a href="${href}">${esc(node.title||node.id)}</a></div>`;
      });
    });
  }
  html += '<p><button id="diag-restart" class="quiz-check">重新诊断</button></p>';
  $('#diag-stage').innerHTML = '';
  $('#diag-progress').textContent = '';
  $('#diag-result').innerHTML = html;
  $('#diag-restart').addEventListener('click', ()=>{
    $('#diag-start').click();
  });
}

/* ---------- 掌握度（简化 BKT） ---------- */
function getMastery(cid){
  if(!cid) return 0.5;
  const m = (state.mastery||{})[cid];
  return m !== undefined ? m : 0.3;
}
function updateMastery(cid, delta){
  if(!cid) return;
  if(!state.mastery) state.mastery = {};
  const cur = state.mastery[cid] !== undefined ? state.mastery[cid] : 0.3;
  state.mastery[cid] = Math.max(0, Math.min(1, cur + delta));
  store.set('mastery', state.mastery);
}
function masteryBar(cid){
  const v = Math.round(getMastery(cid)*100);
  return `<div class="mastery-bar"><div style="width:${v}%"></div></div><span class="mastery-label">掌握度 ${v}%</span>`;
}

/* ---------- 抽认卡 ---------- */
let cardIdx = 0, cardList = [];
function initCards(){
  const cards = manifest.flashcards||[];
  cardList = cards.slice();
  cardIdx = 0;
  const sel = $('#card-filter');
  sel.innerHTML = '<option value="">全部</option>';
  [...new Set(cards.map(c=>c.chapterId).filter(Boolean))].forEach(c=>{
    const o=document.createElement('option'); o.value=c; o.textContent=manifestChTitle(c); sel.appendChild(o);
  });
  sel.onchange = ()=>{ const v=sel.value; cardList = v? cards.filter(c=>c.chapterId===v): cards.slice(); cardIdx=0; showCard(); };
  $('#flashcard').onclick = ()=>$('#flashcard').classList.toggle('flip');
  $('#card-known-btn').onclick = ()=>{ markCard(true); };
  $('#card-again-btn').onclick = ()=>{ markCard(false); };
  showCard();
}
function showCard(){
  updateCardCounts();
  if(cardIdx>=cardList.length){ $('#card-stage').innerHTML='<div class="empty">本组卡片已全部复习完</div>'; return; }
  const c = cardList[cardIdx];
  document.querySelector('.fc-front').textContent = c.front;
  document.querySelector('.fc-back').textContent = c.back;
  $('#flashcard').classList.remove('flip');
}
function markCard(known){
  const c = cardList[cardIdx]; if(!c) return;
  state.cards[c.id] = known?'known':'again';
  store.set('cards', state.cards);
  cardIdx++; showCard();
}
function updateCardCounts(){
  const known = Object.values(state.cards).filter(v=>v==='known').length;
  const again = Object.values(state.cards).filter(v=>v==='again').length;
  $('#card-known').textContent = known;
  $('#card-again').textContent = again;
  $('#card-left').textContent = Math.max(0, cardList.length-cardIdx);
}
function manifestChTitle(id){
  const c=(manifest.chapters||[]).find(x=>x.id===id); return c? c.title : id;
}

/* ---------- 术语表 ---------- */
