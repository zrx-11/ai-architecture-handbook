算，参数量按全部专家算。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\nFFN 不是“可有可无的附加层”，它承担了大部分知识存储。\n<\/li><li>\nMoE 不是把注意力也拆成专家，通常只拆 FFN。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch04<\/td><td>Transformer<\/td><td>FFN 升维再降维<\/td><\/tr><tr><td>ch05<\/td><td>DeepSeekMoE<\/td><td>FFN 拆成共享 + 路由专家<\/td><\/tr><tr><td>ch07<\/td><td>V4<\/td><td>专家数 256，激活 6<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：矩阵乘法、RMSNorm\n<\/li><li>\n后续：DeepSeekMoE、负载均衡\n<\/ul>", "kind": "concept", "title": "前馈网络（FFN）"}, "c11": {"html": "<div class=\"source-badge\">出处：本课程整理 · 生成<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c03\">softmax<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c04\">参数与损失<\/a><\/span><\/div><h1>自回归生成<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 4 章、第 6 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>自回归生成是每次根据已有 token 预测下一个 token，把它接回输入，再预测下一个，循环直到结束。<\/p>\n<h2>为什么重要<\/h2>\n<p>所有对话模型、推理模型都用这种方式输出。理解它，才能理解为什么推理分“预填充”和“解码”两个阶段，为什么 KV cache 重要。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">sequenceDiagram\n  participant U as 输入\n  participant M as 模型\n  participant O as 输出\n  U-&gt;&gt;M: 今天天气\n  M-&gt;&gt;O: 怎\n  O-&gt;&gt;U: 今天天气怎\n  U-&gt;&gt;M: 今天天气怎\n  M-&gt;&gt;O: 么\n  O-&gt;&gt;U: 今天天气怎么\n  U-&gt;&gt;M: 今天天气怎么\n  M-&gt;&gt;O: 样<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>两个阶段：<\/p>\n<ol><li>\n<strong>预填充<\/strong>（prefill）：把整段输入一次性送进模型，并行计算所有位置的 K/V，建立 KV cache。计算密集，GPU 利用率高。\n<\/li><li>\n<strong>解码<\/strong>（decode）：每次只生成一个 token，读已有 KV cache，算新 token 的 Q 和输出。显存带宽密集，延迟受限于搬运速度。\n<\/ol>\n<p>生成长度越长，解码阶段占比越高。投机解码、MTP、DSpark 都是在解码阶段做加速。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n训练时不是自回归串行，而是整句并行、用因果掩码防偷看。\n<\/li><li>\n生成不是每次重算全部 token，KV cache 让历史只算一次。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch04<\/td><td>Transformer<\/td><td>输出头产生下一个 token 分布<\/td><\/tr><tr><td>ch06<\/td><td>R1<\/td><td>长思维链让解码 token 数暴涨<\/td><\/tr><tr><td>ch09<\/td><td>V4.1<\/td><td>DSpark 加速解码<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：softmax、Transformer 层\n<\/li><li>\n后续：KV cache、投机解码\n<\/ul>", "kind": "concept", "title": "自回归生成"}, "c12": {"html": "<div class=\"source-badge\">出处：DeepSeek-V3 技术报告 §2.1<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c07\">Q / K / V<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c16\">KV cache<\/a><\/span><\/div><h1>MLA（多头潜在注意力）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 5 章、第 10 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>MLA 把每个 token 的 K/V 压缩成一个低维潜向量再缓存，需要时升维还原，并用解耦 RoPE 保留位置信息。<\/p>\n<h2>为什么重要<\/h2>\n<p>MLA 是 DeepSeek-V2 提出、V3 继承的关键技术。它让长上下文推理的 KV cache 从“每 token 几十 KB”降到“几 KB”，是 DeepSeek 能把上下文拉到 128K 甚至 1M 的基础。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  H[&quot;输入 h&quot;] --&gt; D[&quot;降维 W_DKV&quot;]\n  D --&gt; C[&quot;潜向量 c_KV（缓存）&quot;]\n  C --&gt; UK[&quot;升维 W_UK → K&quot;]\n  C --&gt; UV[&quot;升维 W_UV → V&quot;]\n  H --&gt; R[&quot;RoPE 分支 k_R（缓存）&quot;]\n  UK --&gt; A[&quot;注意力计算&quot;]\n  UV --&gt; A\n  R --&gt; A<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>标准 MHA 缓存每个 token 的全部 K、V，大小是 <span class=\"katex-inline\">2n_hd_h<\/span> 个数。MLA 缓存：<\/p>\n<ul><li>\n内容潜向量 <span class=\"katex-inline\">c^{KV}<\/span>，维度 <span class=\"katex-inline\">d_c<\/span>，V3 取 512。\n<\/li><li>\n解耦 RoPE 的 key <span class=\"katex-inline\">k^R<\/span>，每头 64 维。\n<\/ul>\n<p>需要 K、V 时：<\/p>\n<div class=\"katex-block\">k^C=c^{KV}W^{UK},\\quad v^C=c^{KV}W^{UV}<\/div>\n<p>K 由内容部分 <span class=\"katex-inline\">k^C<\/span> 和位置部分 <span class=\"katex-inline\">k^R<\/span> 拼接。V 只用内容部分。<\/p>\n<p>为什么解耦：RoPE 是旋转操作，对每个头的位置敏感。如果把位置信息压进低维潜向量，升维后旋转关系会被破坏。解耦后，位置信息走单独的小通道，压缩通道只存内容。<\/p>\n<p>代价：MLA 的计算图比 MHA 复杂，训练时需要同时学降维和升维矩阵；但推理时缓存大幅减少，吞吐提升。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\nMLA 不是简单地把 K/V 量化到低比特，它是改变表示维度。\n<\/li><li>\n解耦 RoPE 不是“不用位置编码”，而是把位置编码单独保留。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch05<\/td><td>V3 地基<\/td><td>KV cache 减少约 93.3%<\/td><\/tr><tr><td>ch08<\/td><td>V4<\/td><td>被 CSA/HCA 取代，但低秩压缩思想保留<\/td><\/tr><tr><td>ch10<\/td><td>架构对比<\/td><td>MLA 是“压缩缓存”路线的起点<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：Q/K/V、KV cache\n<\/li><li>\n后续：CSA、HCA、CSA2\n<\/ul><details class=\"depth-fragment\"><summary>展开完整第一性原理推导（MLA（多头潜在注意力））<\/summary><div class=\"depth-body\"><h2>MLA 的第一性原理推导：把 KV cache 从 64 KB 压到几 KB<\/h2>\n<h3>第一步：先算清楚 KV cache 到底多大<\/h3>\n<p>一个 token 在标准多头注意力里，需要缓存 K 和 V。每个头有 <span class=\"katex-inline\">d_h<\/span> 维，有 <span class=\"katex-inline\">n_h<\/span> 个头，每个数用 2 字节（FP16）存：<\/p>\n<div class=\"katex-block\">\\text{每 token 字节}=2\\times n_h\\times d_h\\times 2<\/div>\n<p>V3 的配置：<span class=\"katex-inline\">n_h=128<\/span>，<span class=\"katex-inline\">d_h=128<\/span>。<\/p>\n<div class=\"katex-block\">2\\times128\\times128\\times2=65{,}536\\ \\text{字节}=64\\ \\text{KB}<\/div>\n<p>100 万 token：<\/p>\n<div class=\"katex-block\">65{,}536\\times1{,}000{,}000=65{,}536{,}000{,}000\\ \\text{字节}\\approx65.5\\ \\text{GB}<\/div>\n<p>这就是为什么长上下文模型拼命压 KV cache。<\/p>\n<h3>第二步：能不能只存一个“压缩包”<\/h3>\n<p>K 和 V 虽然维度高，但它们由同一个输入 <span class=\"katex-inline\">h<\/span> 投影出来，信息有冗余。假设存在一个低维表示 <span class=\"katex-inline\">c<\/span>，能通过两个矩阵还原出 K 和 V：<\/p>\n<div class=\"katex-block\">k=cW_{UK},\\quad v=cW_{UV}<\/div>\n<p>那么缓存 <span class=\"katex-inline\">c<\/span> 就够了。<span class=\"katex-inline\">c<\/span> 的维度 <span class=\"katex-inline\">d_c<\/span> 远小于 <span class=\"katex-inline\">2n_hd_h<\/span> 时，缓存大幅下降。<\/p>\n<p>V3 取 <span class=\"katex-inline\">d_c=512<\/span>。每个 token 的内容潜向量是 512 个数，FP16 下 1024 字节，而不是 65,536 字节。<\/p>\n<h3>第三步：怎么得到这个压缩包<\/h3>\n<p>用一个降维矩阵 <span class=\"katex-inline\">W_{DKV}<\/span>：<\/p>\n<div class=\"katex-block\">c^{KV}=hW_{DKV}<\/div>\n<p><span class=\"katex-inline\">h<\/span> 是当前 token 的隐藏向量（7168 维），<span class=\"katex-inline\">W_{DKV}<\/span> 把它压到 512 维。需要 K、V 时再升维：<\/p>\n<div class=\"katex-block\">k^C=c^{KV}W_{UK},\\quad v^C=c^{KV}W_{UV}<\/div>\n<p>注意这里的 <span class=\"katex-inline\">W_{UK}<\/span>、<span class=\"katex-inline\">W_{UV}<\/span> 是“上投影”，和标准注意力的 <span class=\"katex-inline\">W_K<\/span>、<span class=\"katex-inline\">W_V<\/span> 作用类似，但输入是压缩后的 <span class=\"katex-inline\">c^{KV}<\/span>。<\/p>\n<h3>第四步：位置信息为什么不能一起压<\/h3>\n<p>RoPE 的做法是把向量按位置旋转一个角度。旋转依赖每个头的具体维度。如果把位置信息压进 <span class=\"katex-inline\">c^{KV}<\/span> 再升维，升维矩阵会把旋转关系搅乱，模型就分不清位置。<\/p>\n<p>MLA 的解法是<strong>解耦<\/strong>：内容走压缩通道，位置走单独的小通道。每个头保留 64 维的 <span class=\"katex-inline\">k^R<\/span>，只承载 RoPE，不参与低秩压缩。最终 K 是内容部分和位置部分拼接：<\/p>\n<div class=\"katex-block\">k=[k^C;\\ k^R]<\/div>\n<p>缓存里存 <span class=\"katex-inline\">c^{KV}<\/span> 和 <span class=\"katex-inline\">k^R<\/span> 两份，仍然远小于完整 K/V。<\/p>\n<h3>第五步：数值感受一下<\/h3>\n<p>假设 <span class=\"katex-inline\">d_c=512<\/span>，每头 RoPE 64 维、128 头。缓存每 token：<\/p>\n<ul><li>\n内容潜向量：512 个数\n<\/li><li>\nRoPE key：<span class=\"katex-inline\">64\\times128=8192<\/span> 个数（有些实现会共享，具体随配置）\n<\/ul>\n<p>合计约 8704 个数，FP16 下约 17 KB。相比 64 KB，压到约四分之一。V3 报告给出的 93.3% 降幅对应更优的配置与实现。<\/p>\n<h3>第六步：为什么不直接量化<\/h3>\n<p>量化是把每个数从 16 位压到 8 位或 4 位，精度损失直接作用在 K/V 上，长上下文容易崩。MLA 是改变表示结构：用低秩假设去掉冗余，再让模型在训练中学会“压完后仍然够用”。两者可以叠加，但解决的不是同一个问题。<\/p>\n<h3>差生检查<\/h3>\n<ul><li>\n字节数计算逐步展开，乘法和单位换算都能复核。\n<\/li><li>\n<span class=\"katex-inline\">d_c<\/span>、<span class=\"katex-inline\">n_h<\/span>、<span class=\"katex-inline\">d_h<\/span> 第一次出现都给了含义。\n<\/li><li>\n解释了“为什么解耦 RoPE”这个设计动机，而不只是说“MLA 用了 RoPE”。\n<\/li><li>\n数值示例标明是量级演示，避免把示例当成 V3 的精确配置。\n<\/ul>\n<h3>前置与后续<\/h3>\n<ul><li>\n前置：Q/K/V、KV cache、矩阵乘法（第 1、3、5 章）\n<\/li><li>\n后续：CSA/HCA 的压缩思路（第 8 章）、CSA2 跨层复用（第 9 章）\n<\/ul><\/div><\/details>", "kind": "concept", "title": "MLA（多头潜在注意力）"}, "c13": {"html": "<div class=\"source-badge\">出处：DeepSeek-V3 技术报告 §2.2<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c03\">softmax<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c10\">前馈网络（FFN）<\/a><\/span><\/div><h1>DeepSeekMoE<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 5 章、第 7 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>DeepSeekMoE 把 FFN 拆成大量细粒度路由专家和一个共享专家，每个 token 只激活少数专家。<\/p>\n<h2>为什么重要<\/h2>\n<p>它让模型总参数可以做到 671B、1.6T，而单 token 计算只按 37B、49B 的激活参数算。没有 MoE，DeepSeek 的规模故事不成立。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  X[&quot;token 向量&quot;] --&gt; S[&quot;共享专家（总激活）&quot;]\n  X --&gt; R[&quot;路由打分&quot;]\n  R --&gt; E1[&quot;专家 1&quot;]\n  R --&gt; E2[&quot;专家 2&quot;]\n  R --&gt; E3[&quot;……专家 256&quot;]\n  E1 --&gt; C[&quot;加权合并&quot;]\n  E2 --&gt; C\n  E3 --&gt; C\n  S --&gt; C\n  C --&gt; O[&quot;输出&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>V3 配置：1 个共享专家 + 256 个路由专家，每个 token 激活 8 个路由专家。V4-Flash 激活 6 个，V4-Pro 384 个路由专家、激活 6 个。<\/p>\n<p>路由分数：<\/p>\n<div class=\"katex-block\">s_i=\\text{Sigmoid}(x\\cdot e_i)<\/div>\n<p>取 top-k 后归一化，得到每个被选中专家的权重。共享专家不参与路由，所有 token 都过它。<\/p>\n<p>为什么细粒度：一个大专家只能整体激活或整体不激活；拆成很多小专家后，组合空间更大，不同 token 可以调用不同的知识片段。<\/p>\n<p>为什么共享专家：路由专家会被不同 token 轮流使用，容易重复学习通用知识。共享专家专门兜住通用部分，让路由专家更专注细分。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\nMoE 不是“每个 token 只用一个专家”，是 top-k 加共享专家。\n<\/li><li>\n专家不是按学科划分的，训练不会给每个专家打上“数学专家”“语法专家”的标签。\n<\/li><li>\n总参数大不等于计算量大，只有激活参数参与当前 token 的计算。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch05<\/td><td>V3 地基<\/td><td>1 共享 + 256 路由，激活 8<\/td><\/tr><tr><td>ch07<\/td><td>V4<\/td><td>256 路由，激活 6<\/td><\/tr><tr><td>ch09<\/td><td>V4.1<\/td><td>256 路由，激活 6，专家中间维度 2048<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：FFN、softmax\n<\/li><li>\n后续：负载均衡、专家塌缩\n<\/ul><details class=\"depth-fragment\"><summary>展开完整第一性原理推导（DeepSeekMoE）<\/summary><div class=\"depth-body\"><h2>DeepSeekMoE 的第一性原理推导：为什么“专家多、激活少”能同时省算力和涨参数<\/h2>\n<h3>第一步：先看清普通 FFN 的成本<\/h3>\n<p>一个 FFN 做两次矩阵乘法：<\/p>\n<div class=\"katex-block\">y=W_2\\sigma(W_1x)<\/div>\n<p>设输入 <span class=\"katex-inline\">d=7168<\/span>，中间维度 <span class=\"katex-inline\">m=18432<\/span>。参数量：<\/p>\n<div class=\"katex-block\">d\\times m+m\\times d=2\\times7168\\times18432\\approx2.64\\ \\text{亿}<\/div>\n<p>每个 token 都要过这 2.64 亿个参数，计算量也是这个量级。想让模型记住更多知识，最直接的办法是把 <span class=\"katex-inline\">m<\/span> 加大，但每个 token 的计算量跟着涨。<\/p>\n<h3>第二步：把一个大 FFN 切成很多小专家<\/h3>\n<p>把中间维度 18432 切成 256 份，每份 2048 维，每份就是一个“专家”。每个专家的参数量：<\/p>\n<div class=\"katex-block\">2\\times7168\\times2048\\approx2935\\ \\text{万}<\/div>\n<p>256 个专家总参数约 75 亿，比原来大 28 倍。但如果每个 token 只激活其中 8 个，计算量是：<\/p>\n<div class=\"katex-block\">8\\times2935\\ \\text{万}\\approx2.35\\ \\text{亿}<\/div>\n<p>和原来一个 FFN 的 2.64 亿差不多。参数量涨了 28 倍，单 token 计算却没涨。这就是 MoE 的核心账本。<\/p>\n<h3>第三步：路由怎么选专家<\/h3>\n<p>每个专家有一个可学习的向量 <span class=\"katex-inline\">e_i<\/span>。token 向量 <span class=\"katex-inline\">x<\/span> 和 <span class=\"katex-inline\">e_i<\/span> 做内积，再取 Sigmoid：<\/p>\n<div class=\"katex-block\">s_i=\\text{Sigmoid}(x\\cdot e_i)<\/div>\n<p>Sigmoid 把分数压到 0 到 1 之间。取分数最高的 <span class=\"katex-inline\">k<\/span> 个专家（V3 的 <span class=\"katex-inline\">k=8<\/span>），再把这 <span class=\"katex-inline\">k<\/span> 个分数归一化，作为加权系数。每个被选中专家算自己的 FFN，输出按系数加权相加。<\/p>\n<h3>第四步：为什么还要一个共享专家<\/h3>\n<p>路由专家会被不同 token 轮流使用。如果所有 token 都需要“基本语法”这类通用知识，每个被选中的专家都得学一遍，参数浪费。<\/p>\n<p>加一个<strong>共享专家<\/strong>，所有 token 都过它，专门学通用知识。路由专家就不用重复学通用部分，可以专注细分模式。V3 是 1 个共享 + 256 个路由。<\/p>\n<h3>第五步：专家为什么会“饿死”<\/h3>\n<p>训练初期，某些专家的 <span class=\"katex-inline\">e_i<\/span> 碰巧和很多 token 的内积大，路由把大量 token 送给它们。这些专家梯度多、学得快，变得更强；其他专家拿不到 token，梯度接近 0，永远学不出来。这叫<strong>专家塌缩<\/strong>。<\/p>\n<p>传统解法是加辅助损失：<\/p>\n<div class=\"katex-block\">L_{\\text{aux}}=\\alpha\\sum_i f_i p_i<\/div>\n<p><span class=\"katex-inline\">f_i<\/span> 是分给专家 <span class=\"katex-inline\">i<\/span> 的 token 比例，<span class=\"katex-inline\">p_i<\/span> 是路由概率均值。这个损失惩罚“负载集中”。但它和语言建模目标打架，<span class=\"katex-inline\">\\alpha<\/span> 难调。<\/p>\n<p>DeepSeek 的解法：给每个专家一个偏置 <span class=\"katex-inline\">b_i<\/span>，路由分数改成 <span class=\"katex-inline\">s_i+b_i<\/span>。训练时统计负载，负载高的专家调低 <span class=\"katex-inline\">b_i<\/span>，负载低的调高 <span class=\"katex-inline\">b_i<\/span>。偏置只影响“选不选”，不影响选中后的加权系数。这样不用往主损失里加项，也能把负载拉平。<\/p>\n<h3>第六步：一次完整的玩具计算<\/h3>\n<p>3 个专家，<span class=\"katex-inline\">k=1<\/span>，token 与专家的分数：<\/p>\n<ul><li>\n<span class=\"katex-inline\">s_1=0.9<\/span>，<span class=\"katex-inline\">s_2=0.5<\/span>，<span class=\"katex-inline\">s_3=0.1<\/span>\n<\/ul>\n<p>选 top-1 就是专家 1。输出就是专家 1 的 FFN 输出，权重 1。若 <span class=\"katex-inline\">k=2<\/span>，选专家 1 和 2，归一化权重：<\/p>\n<div class=\"katex-block\">w_1=\\frac{0.9}{0.9+0.5}=0.643,\\quad w_2=\\frac{0.5}{1.4}=0.357<\/div>\n<p>输出 <span class=\"katex-inline\">=0.643\\cdot\\text{FFN}_1(x)+0.357\\cdot\\text{FFN}_2(x)<\/span>。检查：两个权重相加为 1。<\/p>\n<h3>差生检查<\/h3>\n<ul><li>\n参数量与计算量分开算，明确“总参数”和“激活参数”不是一回事。\n<\/li><li>\n路由、Sigmoid、归一化都给了公式和数字。\n<\/li><li>\n解释了“共享专家”和“负载均衡”的设计动机，并给了反例（专家塌缩）。\n<\/li><li>\n玩具计算可以手算复核。\n<\/ul>\n<h3>前置与后续<\/h3>\n<ul><li>\n前置：FFN、矩阵乘法、softmax（第 1、4 章）\n<\/li><li>\n后续：V3/V4 的专家配置（第 5、7 章）、负载均衡偏置（第 5 章）\n<\/ul><\/div><\/details>", "kind": "concept", "title": "DeepSeekMoE"}, "c14": {"html": "<div class=\"source-badge\">出处：DeepSeek-V3 技术报告 §2.3<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c11\">自回归生成<\/a><\/span><\/div><h1>MTP（多 token 预测）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 5 章、第 8 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>MTP 在训练时让每个位置额外预测未来第 2 个 token，增加训练信号密度，也可用于推理时的投机解码。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是 DeepSeek-V3 的三大地基之一，V4 继续保留。理解 MTP，才能理解“为什么训练 token 数不算多，模型却学得快”。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  H[&quot;位置 t 的隐藏状态&quot;] --&gt; M[&quot;主头：预测 t+1&quot;]\n  H --&gt; T[&quot;MTP 头&quot;]\n  E[&quot;t+1 的 token 嵌入&quot;] --&gt; T\n  T --&gt; N[&quot;预测 t+2&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>标准语言模型在每个位置只监督下一个 token。MTP 增加一条支路：<\/p>\n<ol><li>\n取位置 <span class=\"katex-inline\">t<\/span> 的隐藏状态 <span class=\"katex-inline\">h_t<\/span>。\n<\/li><li>\n把位置 <span class=\"katex-inline\">t+1<\/span> 的 token 嵌入 <span class=\"katex-inline\">e_{t+1}<\/span> 投影后与 <span class=\"katex-inline\">h_t<\/span> 结合。\n<\/li><li>\n用结合后的表示预测 <span class=\"katex-inline\">t+2<\/span>。\n<\/ol>\n<p>损失是主损失加 MTP 损失的加权和。V3 的 MTP 深度为 1。<\/p>\n<p>推理时，MTP 头可以当草稿模型：先猜出若干个 token，再让主模型并行验证，接受匹配的前缀。这叫投机解码。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\nMTP 不是“推理时一次输出两个 token”，输出仍由主模型验证。\n<\/li><li>\nMTP 的主要收益在训练，不在推理；推理加速是附带用途。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch05<\/td><td>V3<\/td><td>MTP 深度 1，训练信号更密<\/td><\/tr><tr><td>ch07<\/td><td>V4<\/td><td>保留 MTP，用于投机解码<\/td><\/tr><tr><td>ch09<\/td><td>V4.1<\/td><td>用 DSpark 替代 MTP 做推理加速<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：自回归生成、softmax\n<\/li><li>\n后续：投机解码、DSpark\n<\/ul>", "kind": "concept", "title": "MTP（多 token 预测）"}, "c15": {"html": "<div class=\"source-badge\">出处：DeepSeek-V3 技术报告 §2.2<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c03\">softmax<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c13\">DeepSeekMoE<\/a><\/span><\/div><h1>负载均衡<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 5 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>负载均衡是防止 MoE 路由器总把 token 送给少数专家、导致其他专家“饿死”的训练技巧。<\/p>\n<h2>为什么重要<\/h2>\n<p>MoE 训练最常见的失败模式就是专家塌缩。DeepSeek 的无辅助损失方案是 V3 论文的亮点之一，也是后续 V4 继承的关键设计。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[&quot;一批 token&quot;] --&gt; B[&quot;路由打分&quot;]\n  B --&gt; C{&quot;各专家负载均衡?&quot;}\n  C --&gt;|否| D[&quot;调高冷门专家偏置&quot;]\n  D --&gt; B\n  C --&gt;|是| E[&quot;正常训练&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>问题：路由分数由 token 和专家向量的内积决定，训练初期某些专家可能碰巧得分高，越来越多 token 涌向它们。结果少数专家过载，多数专家得不到梯度。<\/p>\n<p>传统方案：加辅助损失，惩罚负载不均。但辅助损失和语言建模目标冲突，权重难调，还会损害模型效果。<\/p>\n<p>DeepSeek 方案：给每个专家一个可学习偏置 <span class=\"katex-inline\">b_i<\/span>，路由分数变成 <span class=\"katex-inline\">s_i+b_i<\/span>。训练时统计每个专家的负载，负载高的调低偏置，负载低的调高偏置。偏置只影响“选不选”，不影响被选中后的权重。<\/p>\n<div class=\"katex-block\">s_i=\\text{Sigmoid}(x\\cdot e_i)+b_i<\/div>\n<p>这样负载均衡通过调整选择偏好实现，不往主损失里塞额外项。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n负载均衡不是“平均分配所有 token”，而是防止极端失衡。\n<\/li><li>\n无辅助损失不是“完全不管均衡”，而是用偏置调节代替损失项。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch05<\/td><td>V3<\/td><td>无辅助损失负载均衡<\/td><\/tr><tr><td>ch07<\/td><td>V4<\/td><td>继承该方案<\/td><\/tr><tr><td>ch09<\/td><td>V4.1<\/td><td>继承该方案<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：DeepSeekMoE、softmax\n<\/li><li>\n后续：训练稳定性\n<\/ul>", "kind": "concept", "title": "负载均衡"}, "c16": {"html": "<div class=\"source-badge\">出处：DeepSeek-V3 技术报告 §2.1<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c07\">Q / K / V<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c11\">自回归生成<\/a><\/span><\/div><h1>KV cache<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 5 章、第 8 章、第 10 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>KV cache 是推理时缓存历史 token 的 Key 和 Value，避免每生成一个新 token 都重算全部历史。<\/p>\n<h2>为什么重要<\/h2>\n<p>长上下文推理的显存瓶颈几乎全在 KV cache。DeepSeek 三代架构的注意力改动，本质上都在想办法把这份缓存压小。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  P[&quot;预填充：整段输入&quot;] --&gt; C[&quot;写入 KV cache&quot;]\n  C --&gt; D[&quot;解码第 1 个 token&quot;]\n  D --&gt; E[&quot;追加新 KV&quot;]\n  E --&gt; F[&quot;解码第 2 个 token&quot;]\n  F --&gt; G[&quot;……&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>标准 MHA 每 token 缓存：<\/p>\n<div class=\"katex-block\">2\\times n_h\\times d_h\\times \\text{字节数}<\/div>\n<p>V3 的 128 头、128 维、FP16：每 token 约 64 KB。100 万 token 就是 64 GB。<\/p>\n<p>压缩路线：<\/p>\n<ul><li>\n<strong>MLA<\/strong>：缓存低维潜向量 + RoPE key，V3 报告减少约 93.3%。\n<\/li><li>\n<strong>CSA<\/strong>：把每 4 个 token 压成一条 KV 记录（V4）。\n<\/li><li>\n<strong>HCA<\/strong>：每 128 个 token 压成一条（V4）。\n<\/li><li>\n<strong>CSA2<\/strong>：跨层复用 KV，进一步减少重复存储（V4.1）。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\nKV cache 不是模型参数，它是推理时的临时状态。\n<\/li><li>\n量化 KV cache 能省显存，但会损失精度；MLA/CSA 是改变表示结构，不是单纯量化。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch05<\/td><td>MLA<\/td><td>压缩潜向量替代完整 K/V<\/td><\/tr><tr><td>ch08<\/td><td>V4<\/td><td>CSA 4:1、HCA 128:1<\/td><\/tr><tr><td>ch09<\/td><td>V4.1<\/td><td>CSA2 跨层复用<\/td><\/tr><tr><td>ch10<\/td><td>架构对比<\/td><td>所有路线都在压同一份缓存<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：Q/K/V、自回归生成\n<\/li><li>\n后续：MLA、CSA、HCA、CSA2\n<\/ul>", "kind": "concept", "title": "KV cache"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：向量、矩阵、softmax<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：数字怎么变成“意思”：向量、矩阵与 softmax<\/a><br>检查点：完成 ch01 自测，能手算矩阵乘向量与 softmax<\/li><li class='path-step' id='path-02'><strong>步骤 02：参数、损失、梯度<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：模型怎么学会：参数、损失、梯度<\/a><br>检查点：完成 ch02 自测，能算一次梯度更新<\/li><li class='path-step' id='path-03'><strong>步骤 03：注意力机制<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：注意力机制：一句话里谁该看谁<\/a><br>检查点：能手算 3 个 token 的注意力权重<\/li><li class='path-step' id='path-04'><strong>步骤 04：Transformer 一层楼<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：Transformer 一层一层拆<\/a><br>检查点：能画出一次前向的 shape 变化<\/li><li class='path-step' id='path-05'><strong>步骤 05：V3 的三块地基<\/strong><br>阅读：<a href=\"#/chapter/ch05\">第 5 章：DeepSeek-V3 的三块地基<\/a><br>检查点：能说出 MLA、MoE、MTP 各解决什么问题<\/li><li class='path-step' id='path-06'><strong>步骤 06：附录：形状、公式与手算<\/strong><br>阅读：<a href=\"#/chapter/ch06\">附录：形状、公式与手算清单<\/a><br>检查点：能手算注意力、梯度与 KV cache 字节<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__graph__": {"html": "<h1>知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "kind": "graph", "title": "知识图谱"}, "__quiz_all__": {"html": "<p>（无综合题）<\/p>", "kind": "quiz", "title": "综合测验"}, "__quiz_ch01__": {"html": "<h1>测验：第 1 章：数字怎么变成“意思”：向量、矩阵与 softmax<\/h1><div class='quiz-item' data-qid='q01' data-type='single' data-concept='c02' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> 一个 2×3 矩阵乘一个 3 维向量，结果是什么形状？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 2×3 矩阵<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 3 维向量<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 2 维向量<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 一个标量<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single' data-concept='c03' data-chapter='ch01'><p class='quiz-q'><b>Q2.<\/b> 对分数 [0, 0, 0] 做 softmax，输出是什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> [0, 0, 0]<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> [1/3, 1/3, 1/3]<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> [1, 0, 0]<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> [3, 3, 3]<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q3.<\/b> embedding 表在模型里做什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 把 token 编号映射成向量<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 把向量压缩成标量<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 把句子翻译成英文<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 计算损失<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch02__": {"html": "<h1>测验：第 2 章：模型怎么学会：参数、损失、梯度<\/h1><div class='quiz-item' data-qid='q04' data-type='single' data-concept='c05' data-chapter='ch02'><p class='quiz-q'><b>Q1.<\/b> 梯度为正时，梯度下降会把参数往哪个方向更新？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> 增大<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> 减小<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> 不变<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> 随机<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q05' data-type='single' data-concept='c05' data-chapter='ch02'><p class='quiz-q'><b>Q2.<\/b> w=1、x=2、y=3，损失 L=(wx-y)^2，对 w 的梯度是多少？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> -4<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> 4<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> -2<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> 2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single' data-concept='c04' data-chapter='ch02'><p class='quiz-q'><b>Q3.<\/b> 学习率取得过大，训练曲线通常会出现什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> 收敛更快且稳定<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> 损失震荡或发散<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> 参数不再更新<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> 模型自动变小<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch03__": {"html": "<h1>测验：第 3 章：注意力机制：一句话里谁该看谁<\/h1><div class='quiz-item' data-qid='q07' data-type='single' data-concept='c06' data-chapter='ch03'><p class='quiz-q'><b>Q1.<\/b> 注意力里真正被加权混合的是哪一项？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> Query<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> Key<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> Value<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 因果掩码<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single' data-concept='c03' data-chapter='ch03'><p class='quiz-q'><b>Q2.<\/b> 分数 [1, 1, 1] 经过 softmax 后的权重是什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> [1, 0, 0]<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> [1/3, 1/3, 1/3]<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> [0.5, 0.5, 0]<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> [3, 3, 3]<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q09' data-type='single' data-concept='c06' data-chapter='ch03'><p class='quiz-q'><b>Q3.<\/b> 注意力分数为什么要除以 sqrt(d_k)？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q09' value='0'> 让分数更大<\/label><label class='quiz-opt'><input type='radio' name='q09' value='1'> 防止 softmax 过度集中<\/label><label class='quiz-opt'><input type='radio' name='q09' value='2'> 增加注意力头数<\/label><label class='quiz-opt'><input type='radio' name='q09' value='3'> 去掉位置信息<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch04__": {"html": "<h1>测验：第 4 章：Transformer 一层一层拆<\/h1><div class='quiz-item' data-qid='q10' data-type='single' data-concept='c08' data-chapter='ch04'><p class='quiz-q'><b>Q1.<\/b> 一个 Transformer 层里，残差连接加在哪两处？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q10' value='0'> 只在注意力后<\/label><label class='quiz-opt'><input type='radio' name='q10' value='1'> 只在 FFN 后<\/label><label class='quiz-opt'><input type='radio' name='q10' value='2'> 注意力和 FFN 后各一次<\/label><label class='quiz-opt'><input type='radio' name='q10' value='3'> 每层最后只加一次<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q11' data-type='single' data-concept='c10' data-chapter='ch04'><p class='quiz-q'><b>Q2.<\/b> 输入形状 [6, 16] 经过 4 倍 FFN 后，中间层形状是什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q11' value='0'> [6, 16]<\/label><label class='quiz-opt'><input type='radio' name='q11' value='1'> [6, 64]<\/label><label class='quiz-opt'><input type='radio' name='q11' value='2'> [24, 16]<\/label><label class='quiz-opt'><input type='radio' name='q11' value='3'> [6, 4]<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q12' data-type='single' data-concept='c11' data-chapter='ch04'><p class='quiz-q'><b>Q3.<\/b> 为什么位置信息必须显式注入 Transformer？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q12' value='0'> 让模型知道词序<\/label><label class='quiz-opt'><input type='radio' name='q12' value='1'> 减少参数量<\/label><label class='quiz-opt'><input type='radio' name='q12' value='2'> 加速训练<\/label><label class='quiz-opt'><input type='radio' name='q12' value='3'> 替代注意力<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch05__": {"html": "<h1>测验：第 5 章：DeepSeek-V3 的三块地基<\/h1><div class='quiz-item' data-qid='q13' data-type='single' data-concept='c12' data-chapter='ch05'><p class='quiz-q'><b>Q1.<\/b> MLA 推理时缓存的核心内容是什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q13' value='0'> 每个头的完整 K 和 V<\/label><label class='quiz-opt'><input type='radio' name='q13' value='1'> 低维潜向量和 RoPE key<\/label><label class='quiz-opt'><input type='radio' name='q13' value='2'> 只有 Query<\/label><label class='quiz-opt'><input type='radio' name='q13' value='3'> 整个隐藏层输出<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q14' data-type='single' data-concept='c13' data-chapter='ch05'><p class='quiz-q'><b>Q2.<\/b> DeepSeekMoE 中共享专家的作用是什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q14' value='0'> 只处理英文<\/label><label class='quiz-opt'><input type='radio' name='q14' value='1'> 始终激活，兜住通用知识<\/label><label class='quiz-opt'><input type='radio' name='q14' value='2'> 只处理数学题<\/label><label class='quiz-opt'><input type='radio' name='q14' value='3'> 替代注意力<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q15' data-type='single' data-concept='c14' data-chapter='ch05'><p class='quiz-q'><b>Q3.<\/b> MTP 在训练时额外预测哪个位置？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q15' value='0'> 只预测 t+1<\/label><label class='quiz-opt'><input type='radio' name='q15' value='1'> 额外预测 t+2<\/label><label class='quiz-opt'><input type='radio' name='q15' value='2'> 预测前一个 token<\/label><label class='quiz-opt'><input type='radio' name='q15' value='3'> 随机位置<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='向量'>向量 — 一串有顺序的数字，长度叫维度。 <span class=glossary-ref>（第 1 章：数字怎么变成“意思”：向量、矩阵与 softmax）<\/span><\/li><li data-term='矩阵乘法'>矩阵乘法 — 左矩阵每行与右矩阵每列做点积，得到新矩阵。 <span class=glossary-ref>（第 1 章：数字怎么变成“意思”：向量、矩阵与 softmax）<\/span><\/li><li data-term='softmax'>softmax — 把分数转成非负、总和为 1 的权重。 <span class=glossary-ref>（第 1 章：数字怎么变成“意思”：向量、矩阵与 softmax）<\/span><\/li><li data-term='token'>token — 模型处理文本的基本单位，可以是一个字、一个词或词的一部分。 <span class=glossary-ref>（第 1 章：数字怎么变成“意思”：向量、矩阵与 softmax）<\/span><\/li><li data-term='embedding'>embedding — 把 token 编号映射成固定长度向量的表。 <span class=glossary-ref>（第 1 章：数字怎么变成“意思”：向量、矩阵与 softmax）<\/span><\/li><li data-term='参数'>参数 — 模型里可训练的数值，比如矩阵元素。 <span class=glossary-ref>（第 2 章：模型怎么学会：参数、损失、梯度）<\/span><\/li><li data-term='损失'>损失 — 衡量预测与正确答案差距的标量。 <span class=glossary-ref>（第 2 章：模型怎么学会：参数、损失、梯度）<\/span><\/li><li data-term='梯度'>梯度 — 损失对参数的变化率，指示更新方向。 <span class=glossary-ref>（第 2 章：模型怎么学会：参数、损失、梯度）<\/span><\/li><li data-term='学习率'>学习率 — 每次参数更新走多大的一步。 <span class=glossary-ref>（第 2 章：模型怎么学会：参数、损失、梯度）<\/span><\/li><li data-term='过拟合'>过拟合 — 训练集上损失很小，换数据就变差。 <span class=glossary-ref>（第 2 章：模型怎么学会：参数、损失、梯度）<\/span><\/li><li data-term='注意力'>注意力 — 按 token 间相似度加权收集信息的机制。 <span class=glossary-ref>（第 3 章：注意力机制：一句话里谁该看谁）<\/span><\/li><li data-term='q / k / v'>Q / K / V — 查询、键、值，同一输入的三次投影。 <span class=glossary-ref>（第 3 章：注意力机制：一句话里谁该看谁）<\/span><\/li><li data-term='多头注意力'>多头注意力 — 并行多套 Q/K/V，捕捉不同关系。 <span class=glossary-ref>（第 3 章：注意力机制：一句话里谁该看谁）<\/span><\/li><li data-term='因果掩码'>因果掩码 — 禁止每个 token 看到未来 token。 <span class=glossary-ref>（第 3 章：注意力机制：一句话里谁该看谁）<\/span><\/li><li data-term='残差连接'>残差连接 — 把子层输入加到子层输出。 <span class=glossary-ref>（第 4 章：Transformer 一层一层拆）<\/span><\/li><li data-term='rmsnorm'>RMSNorm — 用均方根缩放向量的归一化。 <span class=glossary-ref>（第 4 章：Transformer 一层一层拆）<\/span><\/li><li data-term='ffn'>FFN — 对每个 token 独立做升维-激活-降维。 <span class=glossary-ref>（第 4 章：Transformer 一层一层拆）<\/span><\/li><li data-term='自回归生成'>自回归生成 — 逐个预测下一个 token 并接回输入。 <span class=glossary-ref>（第 4 章：Transformer 一层一层拆）<\/span><\/li><li data-term='mla'>MLA — 用低维潜向量压缩 KV cache 的注意力。 <span class=glossary-ref>（第 5 章：DeepSeek-V3 的三块地基）<\/span><\/li><li data-term='deepseekmoe'>DeepSeekMoE — 共享专家 + 细粒度路由专家的混合专家结构。 <span class=glossary-ref>（第 5 章：DeepSeek-V3 的三块地基）<\/span><\/li><li data-term='mtp'>MTP — 训练时额外预测未来第 2 个 token。 <span class=glossary-ref>（第 5 章：DeepSeek-V3 的三块地基）<\/span><\/li><li data-term='kv cache'>KV cache — 推理时缓存历史 token 的 K/V。 <span class=glossary-ref>（第 5 章：DeepSeek-V3 的三块地基）<\/span><\/li><li data-term='专家塌缩'>专家塌缩 — MoE 路由总选少数专家，其他专家学不到东西。 <span class=glossary-ref>（第 5 章：DeepSeek-V3 的三块地基）<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__diagnosis__": {"html": "<h1>诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "kind": "diagnosis", "title": "诊断测试"}, "__patterns__": {"html": "<h1>模式与框架库<\/h1>\n<h2>框架：从数字到结构<\/h2>\n<p>学任何一个模型结构，按“输入是什么数字 → 做哪种运算 → 形状怎么变 → 解决什么问题”四步走。不要先背名字。<\/p>\n<h2>框架：三件套理解法<\/h2>\n<p>每个抽象概念至少配一个类比、一个图示、一个可手算的实例；缺一个就容易停在“好像懂了”。<\/p>\n<h2>决策规则<\/h2>\n<ul><li>\n看到公式先问“每个符号是什么”，再问“为什么这样设计”。\n<\/li><li>\n看到架构先问“它省的是计算、显存还是带宽”。\n<\/li><li>\n看到数字先问“单位是什么、和谁比”。\n<\/ul>\n<h2>反模式<\/h2>\n<ul><li>\n只背缩写，不追动机。\n<\/li><li>\n把“注意力权重”当成模型解释。\n<\/li><li>\n把总参数和激活参数混为一谈。\n<\/ul>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表<\/h1>\n<h2>公式与规则<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>矩阵乘向量<\/td><td>每行与向量做点积<\/td><\/tr><tr><td>softmax<\/td><td><span class=\"katex-inline\">e^{z_i}/\\sum_j e^{z_j}<\/span><\/td><\/tr><tr><td>梯度下降<\/td><td><span class=\"katex-inline\">w\\leftarrow w-\\eta\\partial L/\\partial w<\/span><\/td><\/tr><tr><td>注意力分数<\/td><td><span class=\"katex-inline\">q\\cdot k/\\sqrt{d_k}<\/span><\/td><\/tr><tr><td>注意力输出<\/td><td><span class=\"katex-inline\">\\sum_j\\alpha_{ij}v_j<\/span><\/td><\/tr><tr><td>残差<\/td><td><span class=\"katex-inline\">y=x+\\mathrm{Layer}(x)<\/span><\/td><\/tr><tr><td>RMSNorm<\/td><td><span class=\"katex-inline\">x/\\sqrt{\\mathrm{mean}(x^2)+\\epsilon}\\odot g<\/span><\/td><\/tr><\/tbody><\/table>\n<h2>关键数字<\/h2>\n<table><thead><tr><th>项目<\/th><th>数值<\/th><\/tr><\/thead><tbody><tr><td>V3 总参数 / 激活<\/td><td>671B / 37B<\/td><\/tr><tr><td>V3 层数 / 头数<\/td><td>61 / 128<\/td><\/tr><tr><td>V3 路由专家 / 激活<\/td><td>256 / 8<\/td><\/tr><tr><td>V3 预训练 token<\/td><td>14.8T<\/td><\/tr><tr><td>V3 上下文<\/td><td>128K<\/td><\/tr><\/tbody><\/table>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38454307882185474/deepseek-architecture-learning/01-foundations", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "知识图谱", "href": "#/graph"}, {"label": "诊断测试", "href": "#/diagnosis"}, {"label": "章节", "children": [{"label": "第 1 章：数字怎么变成“意思”：向量、矩阵与 softmax", "href": "#/chapter/ch01"}, {"label": "第 2 章：模型怎么学会：参数、损失、梯度", "href": "#/chapter/ch02"}, {"label": "第 3 章：注意力机制：一句话里谁该看谁", "href": "#/chapter/ch03"}, {"label": "第 4 章：Transformer 一层一层拆", "href": "#/chapter/ch04"}, {"label": "第 5 章：DeepSeek-V3 的三块地基", "href": "#/chapter/ch05"}, {"label": "附录：形状、公式与手算清单", "href": "#/chapter/ch06"}]}, {"label": "概念", "children": [{"label": "向量", "href": "#/concept/c01"}, {"label": "矩阵乘法", "href": "#/concept/c02"}, {"label": "softmax", "href": "#/concept/c03"}, {"label": "参数与损失", "href": "#/concept/c04"}, {"label": "梯度下降", "href": "#/concept/c05"}, {"label": "注意力", "href": "#/concept/c06"}, {"label": "Q / K / V", "href": "#/concept/c07"}, {"label": "残差连接", "href": "#/concept/c08"}, {"label": "RMSNorm", "href": "#/concept/c09"}, {"label": "前馈网络（FFN）", "href": "#/concept/c10"}, {"label": "自回归生成", "href": "#/concept/c11"}, {"label": "MLA（多头潜在注意力）", "href": "#/concept/c12"}, {"label": "DeepSeekMoE", "href": "#/concept/c13"}, {"label": "MTP（多 token 预测）", "href": "#/concept/c14"}, {"label": "负载均衡", "href": "#/concept/c15"}, {"label": "KV cache", "href": "#/concept/c16"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：数字怎么变成“意思”：向量、矩阵与 softmax", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：模型怎么学会：参数、损失、梯度", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：注意力机制：一句话里谁该看谁", "href": "#/quiz/ch03"}, {"label": "测验：第 4 章：Transformer 一层一层拆", "href": "#/quiz/ch04"}, {"label": "测验：第 5 章：DeepSeek-V3 的三块地基", "href": "#/quiz/ch05"}, {"label": "测验：附录：形状、公式与手算清单", "href": "#/quiz/ch06"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<div class=\"source-badge\">出处：本课程整理 · 基础数学<\/div><h1>第 1 章：数字怎么变成“意思”：向量、矩阵与 softmax<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用白话解释向量、矩阵、矩阵乘法分别是什么。\n<\/li><li>\n手算一个 3 维向量的点积，以及一个 2×3 矩阵乘 3 维向量的结果。\n<\/li><li>\n给定三个分数，手算 softmax，并解释它为什么输出一组“比例”。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>模型不认字，它把每个词变成一串数字，再用矩阵乘法不断把这些数字重新组合。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：向量就是一串有顺序的数字（难度：基础）<\/h3>\n<p><strong>向量<\/strong>（vector）在模型里没有那么神秘，它就是“一串按顺序排好的数字”。比如描述一个人的三项体检指标，可以写成：<\/p>\n<div class=\"katex-block\">\\mathbf{x} = [1.72,\\ 70,\\ 25]<\/div>\n<p>三项分别是身高、体重、年龄。顺序不能乱：把 70 放到第一位，含义就变了。向量的长度叫<strong>维度<\/strong>（dimension），上面这个是 3 维。<\/p>\n<p>模型处理一个词时也做同样的事：把“猫”映射成例如 <code>[0.2, -0.5, 1.1, 0.03]<\/code> 这样一串数。这串数叫<strong>词向量<\/strong>，也叫 <strong>embedding<\/strong>。每个位置的数字没有“身高体重”那么直白的含义，它们是训练过程中自己学出来的。<\/p>\n<blockquote>类比：向量像一张配料表。每种配料的用量是一个数字，整张表决定这道菜的味道。失效边界：配料表是人写的，词向量是模型自己学出来的，单个数字往往无法翻译成人话。<\/blockquote>\n<h3>概念 2：矩阵乘法就是“按行做加权求和”（难度：基础）<\/h3>\n<p><strong>矩阵<\/strong>（matrix）是数字排成的矩形表。一个 2×3 的矩阵有两行三列：<\/p>\n<div class=\"katex-block\">W = \\begin{bmatrix} 1 & 0 & 2 \\\\ 0 & 1 & -1 \\end{bmatrix}<\/div>\n<p>它乘一个 3 维向量，会得到一个 2 维向量。规则只有一句：<strong>结果的第 i 个数，等于矩阵第 i 行与向量对应位置相乘再相加。<\/strong><\/p>\n<p>拿 <span class=\"katex-inline\">\\mathbf{x} = [3, 1, 4]<\/span> 来算：<\/p>\n<ul><li>\n第一行：<span class=\"katex-inline\">1\\times 3 + 0\\times 1 + 2\\times 4 = 3 + 0 + 8 = 11<\/span>\n<\/li><li>\n第二行：<span class=\"katex-inline\">0\\times 3 + 1\\times 1 + (-1)\\times 4 = 0 + 1 - 4 = -3<\/span>\n<\/ul>\n<p>所以结果是 <span class=\"katex-inline\">[11, -3]<\/span>。写成公式：<\/p>\n<div class=\"katex-block\">(W\\mathbf{x})_i = \\sum_j W_{ij}x_j<\/div>\n<p>这里的 <span class=\"katex-inline\">\\sum<\/span> 是“把 j 取遍所有值后加起来”的意思，<span class=\"katex-inline\">\\sum_j W_{ij}x_j<\/span> 念作“第 i 行每个元素乘以对应输入，再全部相加”。<\/p>\n<p>矩阵乘法有两种常见误读，先排除：<\/p>\n<ul><li>\n它不是“对应位置相乘”。对应位置相乘叫<strong>逐元素乘法<\/strong>，结果还是同样形状，不叫矩阵乘法。\n<\/li><li>\n它也不是“两个矩阵随便乘”。左矩阵的列数必须等于右矩阵的行数，否则无法配对。\n<\/ul>\n<blockquote>类比：矩阵像一台有多条生产线的机器，每条生产线按自己的配方（一行权重）把同一批原料加工成一个输出。失效边界：真实模型的矩阵是成千上万行，配方不是人设计的，是训练出来的。<\/blockquote>\n<h3>概念 3：softmax 把一堆分数变成一组比例（难度：基础）<\/h3>\n<p>模型经常需要对若干个候选打分，然后决定“各占多少份额”。<strong>softmax<\/strong> 就干这件事。给定三个分数 <span class=\"katex-inline\">z_1, z_2, z_3<\/span>，它先取指数，再归一化：<\/p>\n<div class=\"katex-block\">\\text{softmax}(z_i) = \\frac{e^{z_i}}{\\sum_j e^{z_j}}<\/div>\n<p><span class=\"katex-inline\">e<\/span> 是自然常数，约等于 2.718。取指数的目的，是把负数也变成正数，并且让高分和低分的差距被拉大。分母把所有指数加起来，保证输出总和为 1。<\/p>\n<p>拿分数 <span class=\"katex-inline\">[2, 1, 0]<\/span> 手算：<\/p>\n<ul><li>\n<span class=\"katex-inline\">e^2 \\approx 7.389<\/span>\n<\/li><li>\n<span class=\"katex-inline\">e^1 \\approx 2.718<\/span>\n<\/li><li>\n<span class=\"katex-inline\">e^0 = 1<\/span>\n<\/li><li>\n总和 <span class=\"katex-inline\">= 7.389 + 2.718 + 1 = 11.107<\/span>\n<\/li><li>\n输出：<span class=\"katex-inline\">[7.389/11.107,\\ 2.718/11.107,\\ 1/11.107] \\approx [0.665,\\ 0.245,\\ 0.090]<\/span>\n<\/ul>\n<p>三个数都为正，加起来正好是 1。这就是“比例”。注意，softmax 不改变大小顺序：原来最大的，输出仍然最大。<\/p>\n<blockquote>类比：三个人分一块蛋糕，softmax 按“表现分”决定每人切多少，总分归一。失效边界：蛋糕总量固定，softmax 的输出也确实固定为 1，这一点是它和普通归一化的共同点；但 softmax 会放大强者优势，不是简单的按比例平分。<\/blockquote>\n<h3>概念 4：文字先进 token，再进向量（难度：基础）<\/h3>\n<p>模型读一句话，要经过两步：<\/p>\n<ol><li>\n<strong>分词<\/strong>：把句子切成一个个 <strong>token<\/strong>。中文可能一个字一个 token，也可能两个字的词一个 token；英文常见是一个词的一部分一个 token。\n<\/li><li>\n<strong>查表<\/strong>：每个 token 有一个整数编号，模型用这个编号去一张大表里取出对应的向量。\n<\/ol>\n<p>于是“猫坐在垫子上”最终变成一串向量。后面所有注意力、矩阵乘法，都是在这串向量上做运算。模型内部没有“猫”这个字，只有与它对应的那串数字。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[&quot;猫坐在垫子上&quot;] --&gt; B[分词]\n  B --&gt; C[&quot;token: 猫 / 坐 / 在 / 垫子 / 上&quot;]\n  C --&gt; D[查 embedding 表]\n  D --&gt; E[&quot;向量序列：x1, x2, x3, x4, x5&quot;]\n  E --&gt; F[矩阵乘法]\n  F --&gt; G[softmax 得到比例]\n  G --&gt; H[下一层]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：从文字到向量是“查表”，从向量到新向量是“矩阵乘法”，需要分配权重时用 softmax。这三件事会贯穿整本书。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：把一句话想成一张 Excel 表，每一行是一个 token，每一列是一个数字特征。模型做的事，就是不断用固定的公式重新计算这张表。\n<\/li><li>\n<strong>实例<\/strong>：假设只有三个 token，它们的向量分别是 <span class=\"katex-inline\">[1,0]<\/span>、<span class=\"katex-inline\">[0,1]<\/span>、<span class=\"katex-inline\">[1,1]<\/span>。用矩阵\n<\/ul>\n<div class=\"katex-block\">W = \\begin{bmatrix} 2 & 1 \\\\ 0 & 3 \\end{bmatrix}<\/div>\n<p>乘第一个向量 <span class=\"katex-inline\">[1,0]<\/span>，得 <span class=\"katex-inline\">[2, 0]<\/span>；乘第三个向量 <span class=\"katex-inline\">[1,1]<\/span>，得 <span class=\"katex-inline\">[3, 3]<\/span>。同一个矩阵作用在不同 token 上，得到不同结果，这就是“共享一套参数，处理不同输入”。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为向量一定是空间里的箭头<\/strong>——在模型里它就是一串数字，箭头只是二维、三维时的几何解释。\n<\/li><li>\n<strong>别以为矩阵乘法是逐元素相乘<\/strong>——逐元素相乘不改变形状；矩阵乘法会改变维度，并且要做“乘后求和”。\n<\/li><li>\n<strong>别以为 softmax 的输出可以随便解释<\/strong>——它只是把分数变成比例，比例高不等于模型“真的理解”了那个 token。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<p>1.（单选）一个 2×3 矩阵乘一个 3 维向量，结果是什么形状？ A. 2×3 矩阵 B. 3 维向量 C. 2 维向量 D. 一个数 <strong>答案：C<\/strong>；解析：左矩阵两行，每行与 3 维向量做一次加权求和，得到两个数。<\/p>\n<p>2.（填空）对分数 <span class=\"katex-inline\">[0, 0, 0]<\/span> 做 softmax，输出是 ______。 <strong>答案：<span class=\"katex-inline\">[1/3, 1/3, 1/3]<\/span><\/strong>；解析：三个 <span class=\"katex-inline\">e^0=1<\/span>，总和 3，各自占三分之一。<\/p>\n<p>3.（简答）用一句话解释“embedding 表”在模型里做什么。 <strong>答案要点<\/strong>：把 token 的整数编号映射成一串固定长度的向量，让后续层可以对它做数值运算。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n向量是一串有顺序的数字，维度就是数字的个数。\n<\/li><li>\n矩阵乘法等于“每行做一次加权求和”，会改变维度。\n<\/li><li>\nsoftmax 先取指数再归一化，输出非负且总和为 1。\n<\/ul>", "ch02": "<div class=\"source-badge\">出处：本课程整理 · 训练基础<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：数字怎么变成“意思”：向量、矩阵与 softmax<\/a><\/span><\/div><h1>第 2 章：模型怎么学会：参数、损失、梯度<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 1 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清“参数”“预测”“损失”三个词分别在训练里扮演什么角色。\n<\/li><li>\n用一个单参数例子手算一次梯度下降更新。\n<\/li><li>\n解释学习率过大和过小分别会发生什么。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>训练就是反复做三件事：拿当前参数去预测，算预测和答案差多少，再沿着让差距变小的方向挪一点参数。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：参数是模型身上“可调的旋钮”（难度：基础）<\/h3>\n<p><strong>参数<\/strong>（parameter）就是模型里那些会被训练改变的数值。第 1 章里的矩阵 <span class=\"katex-inline\">W<\/span>，每一个位置都是一个参数；一个 671B 参数的模型，就有 6710 亿个这样的旋钮。<\/p>\n<p>训练开始前，这些旋钮随机初始化，模型输出基本是胡猜。训练的过程，就是一点点拧旋钮，让输出越来越接近正确答案。<\/p>\n<blockquote>类比：老式收音机的调台旋钮。拧到某个位置，声音最清楚；训练就是自动找这个位置。失效边界：收音机通常只有几个旋钮，大模型有几千亿个，而且它们互相影响，不能一个一个独立调。<\/blockquote>\n<h3>概念 2：预测就是一次前向计算（难度：基础）<\/h3>\n<p>给定输入 <span class=\"katex-inline\">x<\/span>，模型用当前参数算出输出 <span class=\"katex-inline\">\\hat{y}<\/span>，这一步叫<strong>前向传播<\/strong>（forward pass）。最简单的模型只有一个参数 <span class=\"katex-inline\">w<\/span>：<\/p>\n<div class=\"katex-block\">\\hat{y} = wx<\/div>\n<p>如果 <span class=\"katex-inline\">w=2<\/span>、<span class=\"katex-inline\">x=3<\/span>，预测就是 6。真实答案 <span class=\"katex-inline\">y=5<\/span>，预测偏大。训练要做的就是根据这个偏差去改 <span class=\"katex-inline\">w<\/span>。<\/p>\n<h3>概念 3：损失是一个“差距分数”（难度：基础）<\/h3>\n<p><strong>损失<\/strong>（loss）把“预测和答案差多少”变成一个数字。回归问题常用平方误差：<\/p>\n<div class=\"katex-block\">L = (\\hat{y} - y)^2<\/div>\n<p>代入 <span class=\"katex-inline\">\\hat{y}=6<\/span>、<span class=\"katex-inline\">y=5<\/span>，损失是 <span class=\"katex-inline\">(6-5)^2=1<\/span>。预测越准，损失越小；完全预测对，损失为 0。<\/p>\n<p>分类问题常用<strong>交叉熵<\/strong>，它衡量的是“模型给正确答案分配的概率有多低”。这一章不展开公式，只要记住：损失是一个标量，越小越好。<\/p>\n<blockquote>类比：考试扣分。差距越大，扣分越多。失效边界：考试的扣分规则是人定的，损失函数是数学上选的，不同任务用不同损失。<\/blockquote>\n<h3>概念 4：梯度告诉你“往哪边拧、拧多猛”（难度：基础）<\/h3>\n<p><strong>梯度<\/strong>（gradient）是损失对参数的导数，记作 <span class=\"katex-inline\">\\frac{\\partial L}{\\partial w}<\/span>。它回答一个问题：参数增大一点点，损失会变大还是变小，变化有多快。<\/p>\n<p>还是上面的例子，<span class=\"katex-inline\">L=(wx-y)^2<\/span>。对 <span class=\"katex-inline\">w<\/span> 求导，用链式法则：<\/p>\n<div class=\"katex-block\">\\frac{\\partial L}{\\partial w} = 2(wx-y)\\cdot x<\/div>\n<p>代入 <span class=\"katex-inline\">w=2<\/span>、<span class=\"katex-inline\">x=3<\/span>、<span class=\"katex-inline\">y=5<\/span>：<span class=\"katex-inline\">2(6-5)\\cdot 3 = 6<\/span>。梯度为正，说明 <span class=\"katex-inline\">w<\/span> 增大时损失会增大，所以应该把 <span class=\"katex-inline\">w<\/span> 往小的方向挪。<\/p>\n<h3>概念 5：梯度下降就是“往下坡走一步”（难度：基础）<\/h3>\n<p><strong>梯度下降<\/strong>（gradient descent）的更新规则：<\/p>\n<div class=\"katex-block\">w \\leftarrow w - \\eta \\frac{\\partial L}{\\partial w}<\/div>\n<p><span class=\"katex-inline\">\\eta<\/span> 是<strong>学习率<\/strong>（learning rate），控制每一步走多大。取 <span class=\"katex-inline\">\\eta=0.1<\/span>：<\/p>\n<ul><li>\n新 <span class=\"katex-inline\">w = 2 - 0.1\\times 6 = 1.4<\/span>\n<\/li><li>\n新预测 <span class=\"katex-inline\">= 1.4\\times 3 = 4.2<\/span>，更接近 5\n<\/li><li>\n新损失 <span class=\"katex-inline\">= (4.2-5)^2 = 0.64<\/span>，比原来的 1 小\n<\/ul>\n<p>一次更新，损失从 1 降到 0.64。把这一步重复几千几万次，参数就会慢慢逼近让损失最小的位置。<\/p>\n<blockquote>类比：蒙着眼睛下山，只能用脚感受哪边是下坡，然后朝那个方向迈一小步。失效边界：山可能是凹凸不平的，会卡在局部低点；深度学习的损失面维度极高，不能画成一座山。<\/blockquote>\n<h3>概念 6：学习率是最难调的旋钮之一（难度：基础）<\/h3>\n<ul><li>\n学习率太小：每步挪一点，训练慢得让人怀疑人生。\n<\/li><li>\n学习率太大：一步跨过谷底，损失可能反而越来越大，甚至变成 NaN（数值溢出）。\n<\/li><li>\n常见做法：先用较大的学习率快速下降，后期逐渐调小，叫<strong>学习率衰减<\/strong>。\n<\/ul>\n<p>DeepSeek-V4 的预训练学习率从 <span class=\"katex-inline\">2.7\\times 10^{-4}<\/span> 开始，训练末期按余弦曲线降到 <span class=\"katex-inline\">2.7\\times 10^{-5}<\/span>，就是同一个思路。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[初始化参数] --&gt; B[前向计算预测]\n  B --&gt; C[算损失]\n  C --&gt; D[反向传播求梯度]\n  D --&gt; E[按学习率更新参数]\n  E --&gt; B\n  C --&gt; F{损失够小?}\n  F --&gt;|否| B\n  F --&gt;|是| G[停止训练]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：这个循环叫<strong>训练步<\/strong>。模型不是“看懂”了数据，而是每走一步都让损失小一点。图里没有“理解”这个环节。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：调淋浴水温。手先试一下（前向），觉得太凉（损失），往热的方向拧一点（梯度方向），再试一次。拧的幅度就是学习率。\n<\/li><li>\n<strong>实例<\/strong>：<span class=\"katex-inline\">w=2<\/span>、<span class=\"katex-inline\">x=3<\/span>、<span class=\"katex-inline\">y=5<\/span>、<span class=\"katex-inline\">\\eta=0.1<\/span>，一次更新后 <span class=\"katex-inline\">w=1.4<\/span>、损失从 1 降到 0.64。再算一次：梯度 <span class=\"katex-inline\">=2(4.2-5)\\times 3=-4.8<\/span>，新 <span class=\"katex-inline\">w=1.4-0.1\\times(-4.8)=1.88<\/span>，预测 5.64，损失 0.41。两次更新，参数已经越过 1.67（理论最优）附近。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为梯度就是误差<\/strong>——误差是预测和答案的差，梯度是“误差对参数的变化率”，方向和信息不同。\n<\/li><li>\n<strong>别以为学习率越大收敛越快<\/strong>——太大会震荡甚至发散。\n<\/li><li>\n<strong>别以为损失为 0 就代表模型“学会了”<\/strong>——它只代表在这批训练数据上拟合得很好，换一批数据可能很差，这叫过拟合。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<p>1.（单选）梯度为正时，梯度下降会把参数往哪个方向更新？ A. 增大 B. 减小 C. 不变 D. 随机 <strong>答案：B<\/strong>；解析：更新规则是减去 <span class=\"katex-inline\">\\eta<\/span> 乘以梯度，梯度为正就减。<\/p>\n<p>2.（填空）<span class=\"katex-inline\">w=1<\/span>、<span class=\"katex-inline\">x=2<\/span>、<span class=\"katex-inline\">y=3<\/span>，损失 <span class=\"katex-inline\">L=(wx-y)^2<\/span>，对 <span class=\"katex-inline\">w<\/span> 的梯度是 ______。 <strong>答案：<span class=\"katex-inline\">-4<\/span><\/strong>；解析：<span class=\"katex-inline\">2(2-3)\\times 2=-4<\/span>。<\/p>\n<p>3.（简答）学习率取得过大，训练曲线通常会出现什么现象？ <strong>答案要点<\/strong>：损失震荡、飙升，严重时数值溢出变成 NaN，无法收敛。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n参数是可调旋钮，前向计算产生预测，损失衡量差距。\n<\/li><li>\n梯度给出“往哪边调、调多快”，更新规则是参数减去学习率乘梯度。\n<\/li><li>\n学习率决定步子大小，过小慢，过大震荡。\n<\/ul>", "ch03": "<div class=\"source-badge\">出处：本课程整理 · 注意力机制<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：数字怎么变成“意思”：向量、矩阵与 softmax<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 2 章：模型怎么学会：参数、损失、梯度<\/a><\/span><\/div><h1>第 3 章：注意力机制：一句话里谁该看谁<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 1 章、第 2 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用白话解释 Query、Key、Value 各自负责什么。\n<\/li><li>\n手算 3 个 token 的注意力分数、softmax 权重和加权输出。\n<\/li><li>\n说清“多头注意力”和“因果掩码”分别在解决什么问题。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>注意力就是：当前 token 拿自己的 Query 去和所有 token 的 Key 比相似度，再按相似度把它们的 Value 加权混合。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：为什么需要注意力（难度：基础）<\/h3>\n<p>如果模型把一句话里每个词都独立处理，“猫追老鼠”和“老鼠追猫”在它眼里没有区别。模型需要一种机制，让每个词都能参考句子里其他词的信息。注意力就是这套机制。<\/p>\n<h3>概念 2：Q、K、V 是同一份输入的三次投影（难度：进阶）<\/h3>\n<p>每个 token 的向量 <span class=\"katex-inline\">x<\/span> 会分别乘三个矩阵，得到三个新向量：<\/p>\n<ul><li>\n<strong>Query<\/strong>（查询，<span class=\"katex-inline\">q<\/span>）：我想找什么信息。\n<\/li><li>\n<strong>Key<\/strong>（键，<span class=\"katex-inline\">k<\/span>）：我能提供什么信息。\n<\/li><li>\n<strong>Value<\/strong>（值，<span class=\"katex-inline\">v<\/span>）：如果被选中，我实际交出的内容。\n<\/ul>\n<p>写成公式：<\/p>\n<div class=\"katex-block\">q = xW_Q,\\quad k = xW_K,\\quad v = xW_V<\/div>\n<p><span class=\"katex-inline\">W_Q<\/span>、<span class=\"katex-inline\">W_K<\/span>、<span class=\"katex-inline\">W_V<\/span> 都是训练出来的参数矩阵。注意，Q、K、V 不是三份不同的输入，而是同一份输入经过三种不同的“翻译”。<\/p>\n<blockquote>类比：去图书馆找书。Query 是你心里的检索词，Key 是每本书的标签，Value 是书里的正文。你拿检索词和标签比，匹配度高的书，正文被借走的比重就大。失效边界：图书馆的标签是人写的，模型的 Key 是学出来的，不一定对应人能读懂的关键词。<\/blockquote>\n<h3>概念 3：相似度用点积算（难度：进阶）<\/h3>\n<p>两个向量的<strong>点积<\/strong>（dot product）是对应位置相乘再相加：<\/p>\n<div class=\"katex-block\">q\\cdot k = \\sum_i q_i k_i<\/div>\n<p>点积越大，说明两个向量方向越接近。注意力用点积当相似度分数。分数还要除以 <span class=\"katex-inline\">\\sqrt{d_k}<\/span>，<span class=\"katex-inline\">d_k<\/span> 是向量维度。原因很实在：维度越高，点积的数值容易变得很大，softmax 之后会变成“一家独大”，梯度几乎消失。除以 <span class=\"katex-inline\">\\sqrt{d_k}<\/span> 把数值拉回可控范围。<\/p>\n<div class=\"katex-block\">s_{ij} = \\frac{q_i \\cdot k_j}{\\sqrt{d_k}}<\/div>\n<h3>概念 4：softmax 把分数变成权重（难度：基础）<\/h3>\n<p>对第 <span class=\"katex-inline\">i<\/span> 个 token 的所有分数做 softmax，得到它给每个 token 的权重：<\/p>\n<div class=\"katex-block\">\\alpha_{ij} = \\frac{e^{s_{ij}}}{\\sum_{l} e^{s_{il}}}<\/div>\n<p>权重非负，加起来为 1。最后把每个 token 的 Value 按权重加起来：<\/p>\n<div class=\"katex-block\">o_i = \\sum_j \\alpha_{ij} v_j<\/div>\n<p>这就是注意力的输出。<\/p>\n<h3>概念 5：手算一个 3 token 的例子（难度：进阶）<\/h3>\n<p>假设三个 token 的 Query、Key、Value 已经算好（为了好算，只用 2 维）：<\/p>\n<ul><li>\n<span class=\"katex-inline\">q_1=[1,0]<\/span>\n<\/li><li>\n<span class=\"katex-inline\">k_1=[1,0]<\/span>，<span class=\"katex-inline\">k_2=[0,1]<\/span>，<span class=\"katex-inline\">k_3=[1,1]<\/span>\n<\/li><li>\n<span class=\"katex-inline\">v_1=[10,0]<\/span>，<span class=\"katex-inline\">v_2=[0,10]<\/span>，<span class=\"katex-inline\">v_3=[5,5]<\/span>\n<\/ul>\n<p>先算点积分数（忽略 <span class=\"katex-inline\">\\sqrt{d_k}<\/span> 的缩放，取 <span class=\"katex-inline\">d_k=1<\/span> 方便演示）：<\/p>\n<ul><li>\n<span class=\"katex-inline\">q_1\\cdot k_1 = 1<\/span>\n<\/li><li>\n<span class=\"katex-inline\">q_1\\cdot k_2 = 0<\/span>\n<\/li><li>\n<span class=\"katex-inline\">q_1\\cdot k_3 = 1<\/span>\n<\/ul>\n<p>softmax：<span class=\"katex-inline\">e^1\\approx 2.718<\/span>，<span class=\"katex-inline\">e^0=1<\/span>，总和 <span class=\"katex-inline\">6.436<\/span>，权重约为 <span class=\"katex-inline\">[0.422, 0.155, 0.422]<\/span>。<\/p>\n<p>加权输出：<\/p>\n<div class=\"katex-block\">o_1 = 0.422[10,0] + 0.155[0,10] + 0.422[5,5] = [6.33,\\ 3.66]<\/div>\n<p>第一个 token 的输出里，混进了第一个和第三个 token 的 Value，第二个 token 贡献很小。谁和它的 Query 更相似，谁的 Value 占比就更高。<\/p>\n<h3>概念 6：多头注意力：同时用几套不同的眼光看（难度：进阶）<\/h3>\n<p>一套 Q/K/V 只能捕捉一种关系。<strong>多头注意力<\/strong>（multi-head attention）让模型并行做 <span class=\"katex-inline\">h<\/span> 组，每组有自己的 <span class=\"katex-inline\">W_Q<\/span>、<span class=\"katex-inline\">W_K<\/span>、<span class=\"katex-inline\">W_V<\/span>，各自算出一份输出，最后拼起来再乘一个输出矩阵：<\/p>\n<div class=\"katex-block\">\\text{MultiHead}(X) = [\\text{head}_1;\\ \\text{head}_2;\\ \\ldots;\\ \\text{head}_h]W_O<\/div>\n<p>每个头可以关注不同的东西：有的盯相邻词，有的盯标点，有的盯主语。DeepSeek-V3 的注意力有 128 个头，每头维度 128。<\/p>\n<blockquote>类比：同一场会议派几个记录员，一个记谁说了什么，一个记语气，一个记时间顺序，最后把几份笔记合并。失效边界：记录员是分工好的，模型的多头分工没有明确标签，是训练中自发形成的。<\/blockquote>\n<h3>概念 7：因果掩码：不许看未来（难度：进阶）<\/h3>\n<p>语言模型的任务是“根据前面的词预测下一个词”。训练时如果把整句话一次性喂进去，第 3 个 token 就能看到第 4、第 5 个 token，等于提前偷看答案。<strong>因果掩码<\/strong>（causal mask）把每个 token 对“未来 token”的注意力分数设成负无穷，softmax 之后权重变成 0。这样每个位置只能看自己和左边。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  X[&quot;输入向量 X&quot;] --&gt; Q[&quot;Q = XW_Q&quot;]\n  X --&gt; K[&quot;K = XW_K&quot;]\n  X --&gt; V[&quot;V = XW_V&quot;]\n  Q --&gt; S[&quot;QK^T / sqrt(d_k)&quot;]\n  K --&gt; S\n  S --&gt; M[&quot;因果掩码 + softmax&quot;]\n  M --&gt; W[&quot;权重 α&quot;]\n  V --&gt; O[&quot;加权求和&quot;]\n  W --&gt; O\n  O --&gt; P[&quot;输出投影 W_O&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：Q 和 K 只负责“算匹配分数”，真正被混合的是 V。掩码加在 softmax 之前，未来位置的分数被压到负无穷。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：投票。每个 token 拿自己的提案（Q）去和其他 token 的竞选纲领（K）比对，相似度决定票数，最后按票数分配资源（V）。\n<\/li><li>\n<strong>实例<\/strong>：上面的 3 token 计算，输出 <span class=\"katex-inline\">[6.33, 3.66]<\/span>。如果把 <span class=\"katex-inline\">q_1<\/span> 改成 <span class=\"katex-inline\">[0,1]<\/span>，分数变成 <span class=\"katex-inline\">[0,1,1]<\/span>，权重变成 <span class=\"katex-inline\">[0.155,0.422,0.422]<\/span>，输出会变成 <span class=\"katex-inline\">[3.66, 6.33]<\/span>，第一个 token 的关注点从“和自己像的”转向“和第二个维度像的”。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为注意力权重就是“模型解释”<\/strong>——权重高只说明这个头的数值匹配度高，不代表模型真的在用这个 token 做决策。多头叠加后更难直接解释。\n<\/li><li>\n<strong>别以为多头只是把同一个计算重复几次<\/strong>——每个头有独立的投影矩阵，学到的关系不同。\n<\/li><li>\n<strong>别以为因果掩码会让模型变笨<\/strong>——它只是禁止偷看答案，推理时本来也只能看到已经生成的词。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<p>1.（单选）注意力里真正被加权混合的是哪一项？ A. Query B. Key C. Value D. 掩码 <strong>答案：C<\/strong>；解析：Q 和 K 只用于算分数，输出是 V 的加权和。<\/p>\n<p>2.（填空）分数 <span class=\"katex-inline\">[1,1,1]<\/span> 经过 softmax 后的权重是 ______。 <strong>答案：<span class=\"katex-inline\">[1/3,1/3,1/3]<\/span><\/strong>；解析：三个 <span class=\"katex-inline\">e^1<\/span> 相等，各占三分之一。<\/p>\n<p>3.（简答）为什么点积要除以 <span class=\"katex-inline\">\\sqrt{d_k}<\/span>？ <strong>答案要点<\/strong>：维度越高点积数值越大，softmax 会过度集中，梯度变小；缩放让分数回到可控范围。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\nQ 找信息、K 提供标签、V 提供内容，输出是 V 的加权和。\n<\/li><li>\n注意力分数是 Q 与 K 的点积，softmax 后变成权重。\n<\/li><li>\n多头并行捕捉不同关系，因果掩码禁止看未来。\n<\/ul>\n<h2>想继续深入<\/h2>\n<p>标准 Transformer 的位置编码、多头、掩码和训练目标，见 <a href=\"../07-transformer-deep/index.html\" target=\"_blank\" rel=\"noopener\">Transformer 从零推导深潜课<\/a>。<\/p>", "ch04": "<div class=\"source-badge\">出处：本课程整理 · Transformer<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 3 章：注意力机制：一句话里谁该看谁<\/a><\/span><\/div><h1>第 4 章：Transformer 一层一层拆<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 3 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n按顺序说出一个 Transformer 层里有哪些部件。\n<\/li><li>\n跟踪一个 4 token、8 维的输入经过一层后的形状变化。\n<\/li><li>\n解释残差连接、RMSNorm、前馈网络各自的作用。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>一个 Transformer 层就是“注意力 + 前馈网络”两段计算，每段外面都套着残差和归一化，然后把同样的层重复几十次。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：token 向量进层之前先加位置信息（难度：基础）<\/h3>\n<p>第 1 章说过，每个 token 被查表变成一个向量。但查表只给出“这个词是什么”，没给出“它在第几个位置”。词序很重要，“猫追老鼠”和“老鼠追猫”的 token 完全一样，顺序不同意思就反了。<\/p>\n<p>常见做法是给向量加<strong>位置编码<\/strong>（positional encoding）。DeepSeek 系列用的是 <strong>RoPE<\/strong>（旋转位置编码），它不直接把位置向量加进去，而是把向量按位置“旋转”一个角度。第 5 章讲 MLA 时会再遇到它，这里只要知道：位置信息必须显式注入，否则模型分不清词序。<\/p>\n<h3>概念 2：一层的第一段是注意力（难度：基础）<\/h3>\n<p>输入是一张表，形状是 <code>[序列长度, 隐藏维度]<\/code>。比如 4 个 token、每个 8 维，就是 <code>[4, 8]<\/code>。<\/p>\n<p>注意力对这张表做三件事：<\/p>\n<ol><li>\n用三个矩阵把每个 token 投影成 Q、K、V，形状仍是 <code>[4, 8]<\/code>（如果只有 1 个头）。\n<\/li><li>\n算 Q 与所有 K 的分数，softmax 得到 <code>[4, 4]<\/code> 的权重矩阵。\n<\/li><li>\n用权重把 V 加权求和，输出 <code>[4, 8]<\/code>。\n<\/ol>\n<p>多头时，8 维会拆成几个头，比如 2 个头各 4 维，各自算完再拼回 <code>[4, 8]<\/code>。<\/p>\n<h3>概念 3：残差连接：给信息留一条直通车道（难度：基础）<\/h3>\n<p>如果每层都只做“注意力”或“前馈”，深层的输入会被反复改写，原始信息容易丢失，梯度也很难传回去。<strong>残差连接<\/strong>（residual connection）把层的输入直接加到层的输出上：<\/p>\n<div class=\"katex-block\">y = x + \\text{Layer}(x)<\/div>\n<p>这样即使这一层什么都没学到（输出接近 0），信息也能原样穿过去。反向传播时，梯度可以沿着这条直通车道直接流回前面的层，深层网络才训得动。<\/p>\n<blockquote>类比：楼层之间除了楼梯，还有一部直达电梯。楼梯负责加工，电梯保证原始包裹不会被弄丢。失效边界：残差不是“复制一份”，它是逐元素相加，维度和形状必须完全一致。<\/blockquote>\n<h3>概念 4：RMSNorm：把数值拉回稳定范围（难度：进阶）<\/h3>\n<p>层与层之间，数值可能越算越大，最后溢出。<strong>归一化<\/strong>（normalization）把每个 token 的向量缩放一下，让整体 magnitude 稳定。<\/p>\n<p>DeepSeek 用的是 <strong>RMSNorm<\/strong>（均方根归一化）。它只算向量的均方根，不减去均值：<\/p>\n<div class=\"katex-block\">\\text{RMSNorm}(x) = \\frac{x}{\\sqrt{\\frac{1}{d}\\sum_i x_i^2 + \\epsilon}} \\odot g<\/div>\n<p><span class=\"katex-inline\">\\epsilon<\/span> 是一个很小的数，防止除零；<span class=\"katex-inline\">g<\/span> 是可学习的缩放参数。它比 LayerNorm 少一次求均值的计算，速度更快，效果在大模型上够用。<\/p>\n<h3>概念 5：前馈网络：真正存知识的地方（难度：进阶）<\/h3>\n<p>注意力负责“在 token 之间搬运信息”，<strong>前馈网络<\/strong>（Feed-Forward Network，FFN）负责“对每个 token 单独做一次变换”。典型结构是两层线性变换加一个激活函数：<\/p>\n<div class=\"katex-block\">\\text{FFN}(x) = W_2\\ \\sigma(W_1x)<\/div>\n<p>中间维度通常比隐藏维度大 4 倍左右。比如 8 维输入，先升到 32 维，再降回 8 维。第一个矩阵有 <span class=\"katex-inline\">8\\times 32<\/span> 个权重，第二个有 <span class=\"katex-inline\">32\\times 8<\/span> 个，加起来 512 个参数（忽略偏置）。<\/p>\n<p>大模型里，FFN 往往占了总参数的绝大部分。DeepSeek 把 FFN 换成 MoE（第 5 章），就是为了在参数很多的同时，每个 token 只算一小部分。<\/p>\n<h3>概念 6：一层完整走一遍（难度：进阶）<\/h3>\n<p>以 4 个 token、8 维、2 个头为例：<\/p>\n<table><thead><tr><th>步骤<\/th><th>形状<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>输入<\/td><td><code>[4, 8]<\/code><\/td><td>4 个 token，每个 8 维<\/td><\/tr><tr><td>Q/K/V 投影<\/td><td><code>[4, 8]<\/code> 各一份<\/td><td>每个头 4 维，2 头拼回 8<\/td><\/tr><tr><td>注意力分数<\/td><td><code>[4, 4]<\/code><\/td><td>每个 token 对其他 4 个的分数<\/td><\/tr><tr><td>注意力输出<\/td><td><code>[4, 8]<\/code><\/td><td>V 的加权和<\/td><\/tr><tr><td>残差相加<\/td><td><code>[4, 8]<\/code><\/td><td>输入 + 注意力输出<\/td><\/tr><tr><td>RMSNorm<\/td><td><code>[4, 8]<\/code><\/td><td>数值缩放<\/td><\/tr><tr><td>FFN 升维<\/td><td><code>[4, 32]<\/code><\/td><td>中间层放大 4 倍<\/td><\/tr><tr><td>FFN 降维<\/td><td><code>[4, 8]<\/code><\/td><td>回到隐藏维度<\/td><\/tr><tr><td>残差相加<\/td><td><code>[4, 8]<\/code><\/td><td>归一化后的值 + FFN 输出<\/td><\/tr><\/tbody><\/table>\n<p>这就是一个<strong>Transformer 层<\/strong>。DeepSeek-V3 有 61 层，V4-Pro 也是 61 层，V4-Flash 43 层，V4.1-Flash 40 层。层数越多，模型能做的抽象层级越高，但计算和显存也越贵。<\/p>\n<h3>概念 7：最后一层怎么变成下一个词（难度：基础）<\/h3>\n<p>整条网络跑完，每个 token 得到一个 8 维（实际是几千维）的向量。最后接一个<strong>输出头<\/strong>（LM head），把隐藏向量映射到词表大小。词表有 128K 个 token，输出就是一个 128K 维的分数向量，softmax 之后得到下一个词的概率分布。<\/p>\n<p>训练时，答案 token 的概率越高，交叉熵损失越小；推理时，按这个分布采样或选最大概率，生成下一个 token，再把它接回输入，重复这个过程，叫<strong>自回归生成<\/strong>。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n  A[&quot;输入 x (4,8)&quot;] --&gt; B[&quot;RMSNorm&quot;]\n  B --&gt; C[&quot;多头注意力&quot;]\n  C --&gt; D[&quot;+ 残差&quot;]\n  D --&gt; E[&quot;RMSNorm&quot;]\n  E --&gt; F[&quot;FFN 升维到 32&quot;]\n  F --&gt; G[&quot;激活函数&quot;]\n  G --&gt; H[&quot;FFN 降维回 8&quot;]\n  H --&gt; I[&quot;+ 残差&quot;]\n  I --&gt; J[&quot;输出 (4,8)&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：注意残差是从 Norm 之前分出来的，和这一段的输出相加。一个层里有两段这样的结构：注意力一段、FFN 一段。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：一条流水线。注意力是“跨工位协调”，FFN 是“本工位深加工”，残差是“传送带”，归一化是“每道工序后校准仪器”。\n<\/li><li>\n<strong>实例<\/strong>：8 维输入、4 倍 FFN，单个 token 的 FFN 计算量是 <span class=\"katex-inline\">8\\times 32 + 32\\times 8 = 512<\/span> 次乘加；4 个 token 就是 2048 次。层数 61 时，仅 FFN 一项就是 <span class=\"katex-inline\">2048\\times 61 \\approx 12.5<\/span> 万次乘加/token（未计 MoE 稀疏化）。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为 Transformer 是一个词一个词串行处理的<\/strong>——训练时整句话并行进层，因果掩码保证每个位置只看左边；只有推理生成时才一个 token 一个 token 地产出。\n<\/li><li>\n<strong>别以为残差只是“防止梯度消失”的口号<\/strong>——它还保证深层网络至少能学到“什么都不做”，不会比浅层更差。\n<\/li><li>\n<strong>别以为 FFN 不重要<\/strong>——注意力负责搬运，FFN 负责存储和变换知识，参数大头在 FFN。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<p>1.（单选）一个 Transformer 层里，残差连接加在哪两处？ A. 只在注意力后 B. 只在 FFN 后 C. 注意力和 FFN 后各一次 D. 每一小步都加 <strong>答案：C<\/strong>；解析：标准结构是两段子层，各自带残差。<\/p>\n<p>2.（填空）输入 <code>[6, 16]<\/code> 经过 4 倍 FFN 后，中间层形状是 ______。 <strong>答案：<code>[6, 64]<\/code><\/strong>；解析：隐藏维度 16 放大 4 倍是 64，token 数不变。<\/p>\n<p>3.（简答）为什么位置信息必须显式注入 Transformer？ <strong>答案要点<\/strong>：查表得到的 token 向量不含顺序信息，没有位置编码时，模型无法区分不同词序。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n一层 = 注意力 + FFN，两段都带残差和归一化。\n<\/li><li>\n形状在层内基本保持 <code>[序列长度, 隐藏维度]<\/code>，FFN 中间会临时放大。\n<\/li><li>\n输出头把隐藏向量映射到词表，自回归逐个生成 token。\n<\/ul>\n<h2>想继续深入<\/h2>\n<p>把编码器/解码器、残差、层归一化和训练过程逐段推完，见 <a href=\"../07-transformer-deep/index.html\" target=\"_blank\" rel=\"noopener\">Transformer 从零推导深潜课<\/a>。<\/p>", "ch05": "<div class=\"source-badge\">出处：DeepSeek-V3 技术报告（arXiv:2412.19437）§2<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 3 章：注意力机制：一句话里谁该看谁<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch04\">第 4 章：Transformer 一层一层拆<\/a><\/span><\/div><h1>第 5 章：DeepSeek-V3 的三块地基<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 3 章、第 4 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用一句话说清 MLA 省的是什么、怎么省。\n<\/li><li>\n解释 DeepSeekMoE 的“共享专家 + 细粒度路由专家”结构。\n<\/li><li>\n说出 MTP 在训练和推理里各有什么用。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>DeepSeek-V3 用 MLA 把 KV cache 压小，用 DeepSeekMoE 把参数量做大但每次只算一小部分，用 MTP 让每个 token 多学一个未来位置。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：先有 V3，才有 R1 和 V4（难度：基础）<\/h3>\n<p>DeepSeek-R1 不是从零训练的新模型，它是在 <strong>DeepSeek-V3-Base<\/strong> 上做强化学习得到的。DeepSeek-V4 则继承了 V3 的 DeepSeekMoE 和 MTP，只改注意力、残差和优化器。所以读 R1 和 V4 的论文，绕不开 V3 这三块地基：<\/p>\n<ul><li>\n<strong>MLA<\/strong>：多头潜在注意力，解决长文本的 KV cache 显存问题。\n<\/li><li>\n<strong>DeepSeekMoE<\/strong>：混合专家，解决“参数要多、计算要省”的矛盾。\n<\/li><li>\n<strong>MTP<\/strong>：多 token 预测，让训练信号更密，顺便给推理加速。\n<\/ul>\n<p>V3 本身是 671B 总参数、37B 激活参数的 MoE 模型，预训练用了 14.8T token。<\/p>\n<h3>概念 2：KV cache 是什么，为什么它贵（难度：进阶）<\/h3>\n<p>生成文本时，每生成一个新 token，都要拿它的 Query 和前面所有 token 的 Key、Value 做注意力。前面 token 的 K、V 不会变，可以缓存起来重复用，这份缓存叫 <strong>KV cache<\/strong>。<\/p>\n<p>问题在于它有多大。标准多头注意力（MHA）每个 token 的缓存是：<\/p>\n<div class=\"katex-block\">2 \\times n_h \\times d_h \\times \\text{字节数}<\/div>\n<p><span class=\"katex-inline\">n_h<\/span> 是头数，<span class=\"katex-inline\">d_h<\/span> 是每头维度，系数 2 表示 K 和 V 各一份。V3 有 128 个头、每头 128 维，用 FP16 存（每数 2 字节），每个 token 就是：<\/p>\n<div class=\"katex-block\">2 \\times 128 \\times 128 \\times 2 = 65{,}536\\ \\text{字节} \\approx 64\\ \\text{KB}<\/div>\n<p>一条 100 万 token 的上下文，光 KV cache 就是 64 GB。还没算模型权重和其他开销，单卡已经放不下。<\/p>\n<h3>概念 3：MLA 怎么把 KV cache 压小（难度：高难）<\/h3>\n<p>MLA 的思路不是“少存几个头”，而是“存的不是完整的 K 和 V，而是一个压缩后的潜向量”。<\/p>\n<p>标准做法里，每个 token 的 K、V 是所有头拼起来的高维矩阵。MLA 先把输入 <span class=\"katex-inline\">h<\/span> 压到一个低维潜向量 <span class=\"katex-inline\">c^{KV}<\/span>：<\/p>\n<div class=\"katex-block\">c^{KV} = h W^{DKV}<\/div>\n<p><span class=\"katex-inline\">W^{DKV}<\/span> 是降维矩阵，把几千维压到比如 512 维。需要 K、V 时，再从 <span class=\"katex-inline\">c^{KV}<\/span> 升维回去：<\/p>\n<div class=\"katex-block\">k = c^{KV} W^{UK},\\quad v = c^{KV} W^{UV}<\/div>\n<p>推理时缓存的是 <span class=\"katex-inline\">c^{KV}<\/span>，不是完整的 K、V 拼接。每个 token 只存 512 个数，而不是 128 个头各 128 维的两份。DeepSeek-V3 报告给出的结果是：相比标准 MHA，KV cache 减少约 93.3%，推理吞吐提升到 5.76 倍。<\/p>\n<p><strong>解耦 RoPE<\/strong> 是 MLA 的另一个关键。位置信息不能直接塞进低维潜向量再升维，因为旋转位置编码对每个头的位置敏感，压缩再还原会破坏它。MLA 额外保留一小段专门承载 RoPE 的 key（每个头 64 维），这部分不参与低秩压缩，和压缩后的内容 key 拼在一起使用。<\/p>\n<blockquote>类比：不把整本账本复印一份带走，只带一个压缩包，需要哪页再解压哪页。失效边界：压缩不是无损的，低秩表示会丢信息；MLA 靠训练让压缩后的表示保留对任务有用的部分。<\/blockquote>\n<h3>概念 4：DeepSeekMoE：专家很多，但每次只叫几个（难度：高难）<\/h3>\n<p>普通 Transformer 的 FFN 是全参激活：每个 token 都要过同一个 FFN，参数越多算得越久。<strong>混合专家<\/strong>（Mixture-of-Experts，MoE）把 FFN 拆成很多个“专家”，每个 token 只选其中几个。<\/p>\n<p>DeepSeekMoE 有两个和经典 MoE 不一样的设计：<\/p>\n<ol><li>\n<strong>细粒度专家<\/strong>：把一个大 FFN 切成很多小专家。V3 有 256 个路由专家，每个专家中间维度 2048；每个 token 只激活其中 8 个。专家多而小，组合更灵活。\n<\/li><li>\n<strong>共享专家<\/strong>：额外保留 1 个“永远激活”的共享专家，所有 token 都过它。它负责兜住通用知识，路由专家负责细分知识，减少专家之间的重复学习。\n<\/ol>\n<p>路由分数用 Sigmoid 算，取 top-k 个专家。这里有个副作用：如果不管，模型会总挑少数几个专家，其他专家“饿死”，叫<strong>专家塌缩<\/strong>。传统做法是加一个负载均衡辅助损失，但辅助损失会干扰语言建模目标。DeepSeek 用的是<strong>无辅助损失的负载均衡<\/strong>：给每个专家一个可学习的偏置，训练时根据负载调整偏置，偏置只影响“选谁”，不影响“权重多大”。<\/p>\n<p>V3 的配置是 1 个共享专家 + 256 个路由专家，激活 8 个；V4-Flash 改成 6 个激活，V4-Pro 384 个路由专家、激活 6 个。参数总量因此可以做得很大，但每个 token 的计算量只按激活参数算：V3 是 671B 总参数、37B 激活；V4-Pro 是 1.6T 总参数、49B 激活。<\/p>\n<blockquote>类比：一家大医院，有几百个专科医生，但每个病人只挂号 6 个最对口的，外加一个全科医生。失效边界：病人可以自己选科室，token 的路由是模型学出来的，选错专家就会丢信息。<\/blockquote>\n<h3>概念 5：MTP：让每个 token 多预测一个未来（难度：进阶）<\/h3>\n<p>标准语言模型在每个位置只预测下一个 token。<strong>多 token 预测<\/strong>（Multi-Token Prediction，MTP）在每个位置额外预测下下个 token：<\/p>\n<ul><li>\n主损失：预测 <span class=\"katex-inline\">t+1<\/span>。\n<\/li><li>\nMTP 损失：用 <span class=\"katex-inline\">t<\/span> 位置的隐藏状态，加上 <span class=\"katex-inline\">t+1<\/span> 的 token 嵌入，去预测 <span class=\"katex-inline\">t+2<\/span>。\n<\/ul>\n<p>V3 的 MTP 深度是 1，也就是多预测一个。好处有两个：训练时每个位置获得更密的信号，逼模型学更长的依赖；推理时可以把这个 MTP 头当<strong>投机解码<\/strong>的草稿模型，先猜几个 token，再用主模型验证，猜对就一次接受多个，加快生成。<\/p>\n<blockquote>类比：下棋时不仅想下一步，还顺带想下下步。失效边界：多预测的那一步不一定准，推理时仍要用主模型校验，不能无条件相信草稿。<\/blockquote>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n  subgraph V3[&quot;DeepSeek-V3 的一个 Transformer 层&quot;]\n    A[&quot;输入 h&quot;] --&gt; B[&quot;MLA 注意力&quot;]\n    B --&gt; C[&quot;残差 + RMSNorm&quot;]\n    C --&gt; D[&quot;DeepSeekMoE&quot;]\n    D --&gt; E[&quot;残差&quot;]\n    E --&gt; F[&quot;输出&quot;]\n  end\n  G[&quot;MTP 头&quot;] --&gt; H[&quot;预测 t+2&quot;]\n  F --&gt; G\n  I[&quot;KV cache 只存 c_KV + RoPE key&quot;] --&gt; B<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：MLA 改变的是注意力里“缓存什么”，MoE 改变的是 FFN 里“激活哪些专家”，MTP 是挂在主干旁边的额外预测头。三块互不替代。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：MLA 像把整本词典压成索引卡，MoE 像按问题叫专科医生，MTP 像下棋多想一步。\n<\/li><li>\n<strong>实例<\/strong>：一个 100 万 token 的请求，标准 MHA 每 token 64 KB，KV cache 约 64 GB；MLA 若压到每 token 约 4 KB，同样的上下文只要 4 GB 左右（具体数值随配置变化，这里只做量级演示）。这就是 V3 能长文本推理的基础。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为 MoE 是“每个 token 只用一个专家”<\/strong>——通常是 top-k，V3 激活 8 个，V4 激活 6 个，共享专家始终参与。\n<\/li><li>\n<strong>别以为 MLA 是量化或剪枝<\/strong>——它是改变 K/V 的表示方式，用低秩潜向量替代完整缓存，精度损失靠训练补偿。\n<\/li><li>\n<strong>别以为 MTP 只是为了推理加速<\/strong>——它首先是一个训练目标，主要收益在训练阶段；投机解码只是附带用途。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<p>1.（单选）MLA 推理时缓存的核心内容是什么？ A. 每个头的完整 K 和 V B. 低维潜向量和 RoPE key C. 只有 Query D. 整个隐藏层输出 <strong>答案：B<\/strong>；解析：MLA 缓存压缩后的 <span class=\"katex-inline\">c^{KV}<\/span> 和承载位置的 RoPE key，不缓存完整 K/V。<\/p>\n<p>2.（填空）DeepSeekMoE 中始终激活、负责通用知识的专家叫 ______。 <strong>答案：共享专家<\/strong>；解析：共享专家对所有 token 生效，路由专家按 top-k 选择。<\/p>\n<p>3.（简答）MTP 的损失在训练时预测的是哪个位置？ <strong>答案要点<\/strong>：在位置 <span class=\"katex-inline\">t<\/span> 额外预测 <span class=\"katex-inline\">t+2<\/span>，用 <span class=\"katex-inline\">t<\/span> 的隐藏状态和 <span class=\"katex-inline\">t+1<\/span> 的 token 嵌入作为输入。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\nMLA 用低秩潜向量压缩 KV cache，并用解耦 RoPE 保留位置信息。\n<\/li><li>\nDeepSeekMoE = 共享专家 + 细粒度路由专家 + 无辅助损失负载均衡。\n<\/li><li>\nMTP 在训练时多预测一个未来 token，推理时可做投机解码草稿。\n<\/ul>", "ch06": "<div class=\"source-badge\">出处：本课程整理 · 手算附录<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch05\">第 5 章：DeepSeek-V3 的三块地基<\/a><\/span><\/div><h1>附录：形状、公式与手算清单<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 1–5 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完这篇附录，你能：不查资料写出注意力与 MLA 的张量形状；手算一次 softmax 与梯度更新；用字节公式估算 KV cache；用一个 8 专家例子走完 MoE 路由与负载均衡。<\/p>\n<h2>一句话核心<\/h2>\n<p>读架构图时，先问“这个矩阵乘法的两边形状是什么、结果是什么”，再问“它省了哪部分计算或显存”。形状对不上，后面的解释都是空的。<\/p>\n<h2>1. 形状检查清单<\/h2>\n<h3>1.1 矩阵乘法<\/h3>\n<p>设 <span class=\"katex-inline\">A<\/span> 是 <span class=\"katex-inline\">m\\times n<\/span>，<span class=\"katex-inline\">B<\/span> 是 <span class=\"katex-inline\">n\\times p<\/span>，则 <span class=\"katex-inline\">AB<\/span> 是 <span class=\"katex-inline\">m\\times p<\/span>。中间维度 <span class=\"katex-inline\">n<\/span> 必须相同。<\/p>\n<p>例：<span class=\"katex-inline\">A<\/span> 是 <span class=\"katex-inline\">2\\times 3<\/span>，<span class=\"katex-inline\">B<\/span> 是 <span class=\"katex-inline\">3\\times 4<\/span>，结果是 <span class=\"katex-inline\">2\\times 4<\/span>。不是 <span class=\"katex-inline\">3\\times 3<\/span>，也不是 <span class=\"katex-inline\">4\\times 2<\/span>。<\/p>\n<h3>1.2 注意力的标准形状<\/h3>\n<p>设 batch 为 <span class=\"katex-inline\">B<\/span>，序列长度为 <span class=\"katex-inline\">L<\/span>，模型维度为 <span class=\"katex-inline\">d<\/span>，头数为 <span class=\"katex-inline\">h<\/span>，每个头维度 <span class=\"katex-inline\">d_h=d/h<\/span>。<\/p>\n<table><thead><tr><th>张量<\/th><th>形状<\/th><\/tr><\/thead><tbody><tr><td>输入 <span class=\"katex-inline\">X<\/span><\/td><td><span class=\"katex-inline\">[B,L,d]<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">Q,K,V<\/span><\/td><td><span class=\"katex-inline\">[B,L,d]<\/span><\/td><\/tr><tr><td>拆头后<\/td><td><span class=\"katex-inline\">[B,h,L,d_h]<\/span><\/td><\/tr><tr><td>分数 <span class=\"katex-inline\">QK^\\top<\/span><\/td><td><span class=\"katex-inline\">[B,h,L,L]<\/span><\/td><\/tr><tr><td>softmax 后权重<\/td><td><span class=\"katex-inline\">[B,h,L,L]<\/span><\/td><\/tr><tr><td>加权 <span class=\"katex-inline\">AV<\/span><\/td><td><span class=\"katex-inline\">[B,h,L,d_h]<\/span><\/td><\/tr><tr><td>合并头<\/td><td><span class=\"katex-inline\">[B,L,d]<\/span><\/td><\/tr><\/tbody><\/table>\n<p>例：<span class=\"katex-inline\">B=2,L=4,d=8,h=2<\/span>，则 <span class=\"katex-inline\">d_h=4<\/span>；分数形状是 <span class=\"katex-inline\">[2,2,4,4]<\/span>，不是 <span class=\"katex-inline\">[2,4,4]<\/span>。<\/p>\n<h3>1.3 为什么要缩放<\/h3>\n<p><span class=\"katex-inline\">QK^\\top<\/span> 的每个元素是 <span class=\"katex-inline\">d_h<\/span> 个乘积之和。<span class=\"katex-inline\">d_h<\/span> 越大，点积方差越大，softmax 越容易饱和。缩放因子是 <span class=\"katex-inline\">\\sqrt{d_h}<\/span>：<\/p>\n<div class=\"katex-block\">\\text{Attention}(Q,K,V)=\\text{softmax}\\left(\\frac{QK^\\top}{\\sqrt{d_h}}\\right)V<\/div>\n<h2>2. softmax 手算<\/h2>\n<p>给定分数 <span class=\"katex-inline\">z=[2,1,0]<\/span>。<\/p>\n<p>先减最大值 <span class=\"katex-inline\">2<\/span>：<span class=\"katex-inline\">[0,-1,-2]<\/span>，防止指数溢出。<\/p>\n<p>取指数：<span class=\"katex-inline\">[e^0,e^{-1},e^{-2}]\\approx[1,0.368,0.135]<\/span>。<\/p>\n<p>求和：<span class=\"katex-inline\">1.503<\/span>。<\/p>\n<p>归一化：<span class=\"katex-inline\">[0.665,0.245,0.090]<\/span>。三个数相加为 1。<\/p>\n<p>温度 <span class=\"katex-inline\">T<\/span> 的作用：<span class=\"katex-inline\">T=0.5<\/span> 时分数变成 <span class=\"katex-inline\">[4,2,0]<\/span>，概率更集中；<span class=\"katex-inline\">T=2<\/span> 时分数变成 <span class=\"katex-inline\">[1,0.5,0]<\/span>，概率更平均。<\/p>\n<h2>3. 梯度下降手算<\/h2>\n<p>用一条直线拟合三个点：<span class=\"katex-inline\">(1,2),(2,4),(3,6)<\/span>。模型 <span class=\"katex-inline\">y=wx+b<\/span>，初始 <span class=\"katex-inline\">w=0,b=0<\/span>，学习率 <span class=\"katex-inline\">\\eta=0.1<\/span>。<\/p>\n<p>预测全为 0，残差 <span class=\"katex-inline\">r_i=\\hat y_i-y_i<\/span> 为 <span class=\"katex-inline\">[-2,-4,-6]<\/span>。<\/p>\n<p>均方损失 <span class=\"katex-inline\">L=\\frac{1}{3}\\sum r_i^2<\/span>。<\/p>\n<p>梯度：<\/p>\n<div class=\"katex-block\">\\frac{\\partial L}{\\partial w}=\\frac{2}{3}\\sum r_i x_i=\\frac{2}{3}(-2\\cdot1-4\\cdot2-6\\cdot3)=\\frac{2}{3}(-28)=-18.67<\/div>\n<div class=\"katex-block\">\\frac{\\partial L}{\\partial b}=\\frac{2}{3}\\sum r_i=\\frac{2}{3}(-12)=-8<\/div>\n<p>更新：<\/p>\n<div class=\"katex-block\">w\\leftarrow 0-0.1(-18.67)=1.867,\\quad b\\leftarrow0-0.1(-8)=0.8<\/div>\n<p>一次更新后，<span class=\"katex-inline\">w<\/span> 已经接近真实斜率 2，<span class=\"katex-inline\">b<\/span> 接近 0。这就是“负梯度方向走一步”。<\/p>\n<h2>4. 三 token 注意力手算<\/h2>\n<p>设三个 token 的 <span class=\"katex-inline\">Q,K<\/span> 都是一维标量，<span class=\"katex-inline\">Q=[1,0,1]<\/span>，<span class=\"katex-inline\">K=[1,1,0]<\/span>，<span class=\"katex-inline\">V=[2,4,6]<\/span>。<\/p>\n<p>分数矩阵 <span class=\"katex-inline\">S_{ij}=Q_iK_j<\/span>：<\/p>\n<div class=\"katex-block\">S=\\begin{bmatrix}\\\\1&1&0\\\\\\\\0&0&0\\\\\\\\1&1&0\\\\\\end{bmatrix}<\/div>\n<p>对每一行做 softmax。第一行 <span class=\"katex-inline\">[1,1,0]<\/span> 减最大值 1 得 <span class=\"katex-inline\">[0,0,-1]<\/span>，指数 <span class=\"katex-inline\">[1,1,0.368]<\/span>，和 <span class=\"katex-inline\">2.368<\/span>，权重 <span class=\"katex-inline\">[0.422,0.422,0.155]<\/span>。<\/p>\n<p>第二行全 0，softmax 为 <span class=\"katex-inline\">[1/3,1/3,1/3]<\/span>。<\/p>\n<p>第三行与第一行相同。<\/p>\n<p>输出是权重对 <span class=\"katex-inline\">V=[2,4,6]<\/span> 加权：第一行 <span class=\"katex-inline\">0.422\\cdot2+0.422\\cdot4+0.155\\cdot6=3.45<\/span>。<\/p>\n<p>这说明：注意力不是“查一个词”，而是把所有 token 的 V 按相关性加权混合。<\/p>\n<h2>5. MLA 的形状与 KV cache<\/h2>\n<p>标准多头注意力每个 token 要缓存 <span class=\"katex-inline\">2<\/span> 份（K 和 V），每层每头 <span class=\"katex-inline\">d_h<\/span> 个数。MLA 把 K/V 压成一个潜向量 <span class=\"katex-inline\">c_t<\/span>，缓存的是 <span class=\"katex-inline\">c_t<\/span> 加一个解耦的 RoPE 部分。<\/p>\n<p>V3 配置：61 层，KV 潜向量 512，解耦 RoPE 64。每 token 每层缓存约 <span class=\"katex-inline\">512+64=576<\/span> 个数。用 BF16（2 字节）：<\/p>\n<div class=\"katex-block\">576\\times2\\times61\\approx70{,}272\\ \\text{字节/ token}<\/div>\n<p>约 70 KB/token。标准 MHA（128 头、每头 128 维、K/V 两份）约为：<\/p>\n<div class=\"katex-block\">2\\times128\\times128\\times2\\times61\\approx4{,}014{,}080\\ \\text{字节/ token}<\/div>\n<p>约 4 MB/token。两者差约 57 倍；论文口径的 KV cache 降低约 93.3%、吞吐 5.76 倍，是端到端测量，不等于单 token 字节数的理论比。<\/p>\n<h2>6. MoE 路由例子<\/h2>\n<p>设 1 个共享专家 + 8 个路由专家，每个 token 选 top-2 路由专家。<\/p>\n<p>某 token 对 8 个专家的打分：<span class=\"katex-inline\">[0.1,0.05,0.2,0.15,0.3,0.05,0.1,0.05]<\/span>。<\/p>\n<p>top-2 是第 5 个（0.3）和第 3 个（0.2）。归一化后权重：<\/p>\n<div class=\"katex-block\">\\frac{0.3}{0.3+0.2}=0.6,\\quad \\frac{0.2}{0.3+0.2}=0.4<\/div>\n<p>输出 <span class=\"katex-inline\">=0.6\\cdot E_5(x)+0.4\\cdot E_3(x)+E_{\\text{shared}}(x)<\/span>。<\/p>\n<p>负载均衡要解决的问题：如果所有 token 都挤向第 3、5 个专家，其余专家收不到梯度，容量浪费。DeepSeekMoE 用无辅助损失的偏置调节与序列级平衡来缓解，不是简单加一个“负载均衡损失”就结束。<\/p>\n<h2>7. KV cache 字节公式<\/h2>\n<p>通用公式：<\/p>\n<div class=\"katex-block\">\\text{bytes/token}=2\\times L_{\\text{layers}}\\times H_{\\text{kv}}\\times d_h\\times b<\/div>\n<p>其中 <span class=\"katex-inline\">2<\/span> 表示 K 和 V，<span class=\"katex-inline\">b<\/span> 是每元素字节数（BF16 为 2，FP8 为 1）。<\/p>\n<p>以 1M token、70 KB/token 估算，单序列 KV 约 70 GB；50 并发就是 3.5 TB。这个数字说明为什么长上下文的第一瓶颈是显存，不是算力。<\/p>\n<h2>8. 自测题<\/h2>\n<ol><li>\n<span class=\"katex-inline\">A<\/span> 是 <span class=\"katex-inline\">3\\times4<\/span>，<span class=\"katex-inline\">B<\/span> 是 <span class=\"katex-inline\">4\\times5<\/span>，<span class=\"katex-inline\">AB<\/span> 的形状是？（答案：B；解析：中间维度 4 相同，结果取外侧 3 和 5。）\n<ul>\n<li>\nA. <span class=\"katex-inline\">3\\times4<\/span>　B. <span class=\"katex-inline\">3\\times5<\/span>　C. <span class=\"katex-inline\">4\\times5<\/span>　D. <span class=\"katex-inline\">5\\times3<\/span>\n<\/li><li>\n头数 <span class=\"katex-inline\">h=8<\/span>，<span class=\"katex-inline\">d=512<\/span>，每个头维度是多少？（答案：A；解析：<span class=\"katex-inline\">512/8=64<\/span>。）\n<\/li><li>\nA. 64　B. 128　C. 512　D. 8\n<\/li><li>\nKV cache 公式里为什么有因子 2？（答案：C；解析：K 和 V 各缓存一份。）\n<\/li><li>\nA. 因为 batch 为 2　B. 因为 FP16 是 2 字节　C. 因为 K 和 V 两份　D. 因为两层残差\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n先看形状，再看计算；中间维度必须对上。\n<\/li><li>\n注意力分数是 <span class=\"katex-inline\">[B,h,L,L]<\/span>，不是 <span class=\"katex-inline\">[B,L,L]<\/span>。\n<\/li><li>\nsoftmax 先减最大值，再取指数、归一化。\n<\/li><li>\nKV cache 按“层数 × KV 头数 × 头维度 × 2 × 字节”估。\n<\/li><li>\nMoE 路由是加权组合，负载均衡决定专家是否被充分训练。\n<\/ul>", "c01": "<div class=\"source-badge\">出处：本课程整理 · 基础数学<\/div><h1>向量<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1 章、第 3 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>向量是一串有顺序的数字，在模型里用来表示一个 token、一个词或一个中间状态。<\/p>\n<h2>为什么重要<\/h2>\n<p>模型的所有输入、输出、中间结果都是向量。不懂向量，后面的矩阵乘法、注意力、KV cache 都无从谈起。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[&quot;token 编号 5021&quot;] --&gt; B[&quot;embedding 表第 5021 行&quot;]\n  B --&gt; C[&quot;向量 [0.2, -0.5, 1.1, 0.03]&quot;]\n  C --&gt; D[&quot;进入 Transformer 层&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>一个向量可以写成 <span class=\"katex-inline\">\\mathbf{x} = [x_1, x_2, \\ldots, x_d]<\/span>，<span class=\"katex-inline\">d<\/span> 是维度。模型里常见的隐藏维度是 4096、5120、7168，V3 是 7168。每个位置的数字没有独立的人类含义，它们共同表示一个 token 在当前层的状态。<\/p>\n<p>两个向量可以做点积：<\/p>\n<div class=\"katex-block\">\\mathbf{a}\\cdot\\mathbf{b} = \\sum_i a_i b_i<\/div>\n<p>点积衡量方向相似度，是注意力分数的来源。向量还可以逐元素相加，残差连接就是这种运算。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n向量不一定是空间箭头，高维向量无法直观画出来。\n<\/li><li>\n单个维度一般不对应可解释的概念，别试图把某一维翻译成“猫”。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch01<\/td><td>文字变成数字<\/td><td>token 查表得到词向量<\/td><\/tr><tr><td>ch03<\/td><td>注意力<\/td><td>Q/K/V 都是向量，点积算相似度<\/td><\/tr><tr><td>ch05<\/td><td>MLA<\/td><td>潜向量 <span class=\"katex-inline\">c^{KV}<\/span> 是压缩后的缓存<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：无\n<\/li><li>\n后续：矩阵乘法、softmax、注意力\n<\/ul>", "c02": "<div class=\"source-badge\">出处：本课程整理 · 基础数学<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">向量<\/a><\/span><\/div><h1>矩阵乘法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1 章、第 4 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>矩阵乘法是“左矩阵每一行与右矩阵每一列做点积”，结果是新矩阵；在模型里它负责把一批向量整体变换。<\/p>\n<h2>为什么重要<\/h2>\n<p>Transformer 里几乎所有参数都是矩阵：Q/K/V 投影、输出投影、FFN 的升降维、MoE 专家的门控。不会矩阵乘法，就看不懂参数量的来源。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[&quot;输入 X: [n, d]&quot;] --&gt; B[&quot;权重 W: [d, m]&quot;]\n  B --&gt; C[&quot;输出 Y = XW: [n, m]&quot;]\n  C --&gt; D[&quot;每个 token 从 d 维变成 m 维&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>设 <span class=\"katex-inline\">X<\/span> 是 <span class=\"katex-inline\">n\\times d<\/span> 的矩阵（<span class=\"katex-inline\">n<\/span> 个 token，每个 <span class=\"katex-inline\">d<\/span> 维），<span class=\"katex-inline\">W<\/span> 是 <sp
