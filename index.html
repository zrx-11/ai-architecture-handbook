<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>学习总手册</title>
<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --text:#1f2328; --muted:#6b7280;
  --accent:#2563eb; --accent-soft:#dbeafe; --border:#e5e7eb;
  --ok:#16a34a; --bad:#dc2626; --code-bg:#f3f4f6;
}
[data-theme="dark"]{
  --bg:#111318; --panel:#1a1d24; --text:#e5e7eb; --muted:#9ca3af;
  --accent:#60a5fa; --accent-soft:#1e3a5f; --border:#2d333d;
  --ok:#4ade80; --bad:#f87171; --code-bg:#20242c;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--border);padding:10px 18px}
.brand{font-size:17px;font-weight:700;display:inline-block;margin-right:18px}
.brand span{color:var(--muted);font-weight:400;font-size:12px;margin-left:6px}
.tabs{display:inline-flex;gap:6px;flex-wrap:wrap;vertical-align:middle}
.tab{border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:999px;padding:4px 14px;cursor:pointer;font-size:13px}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.hdr-right{float:right;display:flex;gap:8px;align-items:center;margin-top:2px}
#q{width:260px;padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:13px}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
#progress-export,#progress-import{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px;white-space:nowrap}
.misconception-card{margin-top:10px;padding:10px 14px;border-left:4px solid var(--bad);background:#fef2f2;border-radius:0 8px 8px 0;font-size:13px}
.misconception-card b{color:var(--bad)}
[data-theme="dark"] .misconception-card{background:#2a1215}
.layout{display:flex;min-height:calc(100vh - 60px)}
.sidebar{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  padding:14px;position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:6px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
#progress-label{font-size:12px;color:var(--muted);margin-bottom:8px}
.nav-sec{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.nav-item{display:block;padding:5px 10px;border-radius:6px;color:var(--text);font-size:14px}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .done{float:right;color:var(--ok);font-size:12px}
#nav-toggle{display:none}
.main{flex:1;min-width:0;padding:28px 40px 80px;max-width:920px;margin:0 auto}
.page h1{font-size:26px;border-bottom:2px solid var(--border);padding-bottom:8px;margin-top:0}
.page h2{font-size:20px;margin-top:26px}
.page h3{font-size:17px;margin-top:22px}
.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.page th{background:var(--code-bg)}
.page code{background:var(--code-bg);padding:2px 5px;border-radius:4px;font-size:.9em}
.page pre{background:var(--code-bg);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
.page pre code{background:none;padding:0}
.page blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}
.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}
.mermaid-hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
svg{max-width:100%;height:auto}
.quiz-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--panel)}
.quiz-q{margin:0 0 8px;font-weight:500}
.quiz-opts label{display:block;padding:4px 0;cursor:pointer}
.quiz-blank{width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}
#glossary-filter{width:100%;max-width:380px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:6px 0}
.search-group{margin:18px 0}
.grp-head{font-size:13px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--border);padding-bottom:5px;margin-bottom:4px}
.grp-count{margin-left:6px;font-weight:400;opacity:.75}
.syn-note{display:inline-block;margin-left:8px;padding:1px 6px;border-radius:4px;background:var(--accent-soft);color:var(--muted);font-size:12px;vertical-align:middle}
.search-hit mark,.hl{background:#fde68a;color:inherit;padding:0 1px;border-radius:2px}
.hit-hl{background:#fbbf24;color:inherit;border-radius:3px;box-shadow:0 0 0 2px #fde68a}
.hit-flash{animation:hitFlash 1.8s ease-out}
@keyframes hitFlash{from{background:#f59e0b}to{background:#fbbf24}}
[data-theme="dark"] .search-hit mark,[data-theme="dark"] .hl{background:#92400e;color:#fef3c7}
[data-theme="dark"] .hit-hl{background:#b45309;color:#fff;box-shadow:0 0 0 2px #78350f}
.book-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin:16px 0}
.book-card{border:1px solid var(--border);border-radius:12px;padding:16px;background:var(--panel)}
.book-card h3{margin:0 0 6px;font-size:16px}
.book-card .meta{font-size:13px;color:var(--muted);margin-bottom:10px}
.book-card .enter{font-size:13px}
.empty{color:var(--muted);padding:20px 0}
@media print{header,.sidebar,.quiz-actions,.card-actions,.card-controls{display:none!important}.main{max-width:none;padding:0}}
.katex-inline{font-size:1.05em}
.katex-block{overflow-x:auto;padding:8px 0;text-align:center}
.katex-block .katex{font-size:1.1em}
@media (max-width:820px){.sidebar{width:100%;height:auto;position:static;padding:10px 14px}
  .page{overflow-wrap:anywhere}.page table{display:block;overflow-x:auto;max-width:100%}
  .page h1,.page h2,.page h3{line-height:1.35}
  #nav{display:none;max-height:46vh;overflow-y:auto;overscroll-behavior:contain}.sidebar.open #nav{display:block}
  .nav-item{padding:9px 10px}
  #q,#glossary-filter{font-size:16px}
  .quiz-opts label{padding:8px 0;min-height:30px}
  .quiz-check{padding:10px 18px;min-height:40px}
  #diag-start{min-height:40px}
  .card-actions button{min-height:40px}
  #nav-toggle{display:block;width:100%;padding:8px 10px;margin:4px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;text-align:left;cursor:pointer}
  .layout{flex-direction:column}.main{padding:20px 18px 64px;max-width:none;width:100%}
  .hdr-right{float:none;margin-top:8px}#q{width:100%}}
</style>
</head>
<body>
<header>
  <span class="brand">学习总手册<span>点化学习系统 · 统一入口</span></span>
  <span class="tabs" id="tabs"></span>
  <span class="hdr-right">
    <input id="q" type="search" placeholder="全书搜索…">
    <button id="progress-export">⬇ 导出进度</button>
    <button id="progress-import">⬆ 导入进度</button>
    <button id="theme-btn">🌙 深色</button>
    <input type="file" id="progress-file" accept="application/json" hidden>
  </span>
</header>
<div class="layout">
  <aside class="sidebar">
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <div id="progress-label">进度 0%</div>
    <nav id="nav"></nav>
  </aside>
  <main class="main"><div id="view" class="page"></div></main>
</div>
<script>
const BOOKS = {"deepseek-foundations":{"manifest": {"slug": "deepseek-foundations", "title": "基础篇：从零到 Transformer", "subtitle": "读懂 DeepSeek 论文之前，先把数字、注意力与 V3 地基补齐", "book": {"title": "基础篇：从零到 Transformer", "author": "本课程整理", "source": ["DeepSeek-V3 技术报告（arXiv:2412.19437）", "DeepSeek-R1 论文（arXiv:2501.12948）", "DeepSeek-V4 技术报告（arXiv:2606.19348）"]}, "audience": "数学与代码接近零基础", "goal": "能读懂 Transformer 与 DeepSeek-V3 的架构图，为读 R1/V4/V4.1 论文打底", "learningPath": [{"step": "01", "title": "向量、矩阵、softmax", "chapterIds": ["ch01"], "checkpoint": "完成 ch01 自测，能手算矩阵乘向量与 softmax"}, {"step": "02", "title": "参数、损失、梯度", "chapterIds": ["ch02"], "checkpoint": "完成 ch02 自测，能算一次梯度更新"}, {"step": "03", "title": "注意力机制", "chapterIds": ["ch03"], "checkpoint": "能手算 3 个 token 的注意力权重"}, {"step": "04", "title": "Transformer 一层楼", "chapterIds": ["ch04"], "checkpoint": "能画出一次前向的 shape 变化"}, {"step": "05", "title": "V3 的三块地基", "chapterIds": ["ch05"], "checkpoint": "能说出 MLA、MoE、MTP 各解决什么问题"}], "chapters": [{"id": "ch01", "title": "第 1 章：数字怎么变成“意思”：向量、矩阵与 softmax", "file": "chapters/ch01-vectors-matrices-softmax.md", "difficulty": 1, "source": "本课程整理 · 基础数学", "prerequisites": []}, {"id": "ch02", "title": "第 2 章：模型怎么学会：参数、损失、梯度", "file": "chapters/ch02-learning-parameters.md", "difficulty": 1, "source": "本课程整理 · 训练基础", "prerequisites": ["ch01"]}, {"id": "ch03", "title": "第 3 章：注意力机制：一句话里谁该看谁", "file": "chapters/ch03-attention.md", "difficulty": 2, "source": "本课程整理 · 注意力机制", "prerequisites": ["ch01", "ch02"]}, {"id": "ch04", "title": "第 4 章：Transformer 一层一层拆", "file": "chapters/ch04-transformer-block.md", "difficulty": 2, "source": "本课程整理 · Transformer", "prerequisites": ["ch03"]}, {"id": "ch05", "title": "第 5 章：DeepSeek-V3 的三块地基", "file": "chapters/ch05-v3-foundations.md", "difficulty": 3, "source": "DeepSeek-V3 技术报告（arXiv:2412.19437）§2", "prerequisites": ["ch03", "ch04"]}], "concepts": [{"id": "c01", "title": "向量", "file": "concepts/c01-vector.md", "chapterIds": ["ch01"], "difficulty": "基础", "source": "本课程整理 · 基础数学", "prerequisites": []}, {"id": "c02", "title": "矩阵乘法", "file": "concepts/c02-matrix-multiplication.md", "chapterIds": ["ch01"], "difficulty": "基础", "source": "本课程整理 · 基础数学", "prerequisites": ["c01"]}, {"id": "c03", "title": "softmax", "file": "concepts/c03-softmax.md", "chapterIds": ["ch01"], "difficulty": "基础", "source": "本课程整理 · 基础数学", "prerequisites": ["c01"]}, {"id": "c04", "title": "参数与损失", "file": "concepts/c04-parameters-loss.md", "chapterIds": ["ch02"], "difficulty": "基础", "source": "本课程整理 · 训练基础", "prerequisites": ["c02"]}, {"id": "c05", "title": "梯度下降", "file": "concepts/c05-gradient-descent.md", "chapterIds": ["ch02"], "difficulty": "基础", "source": "本课程整理 · 训练基础", "prerequisites": ["c04"]}, {"id": "c06", "title": "注意力", "file": "concepts/c06-attention.md", "chapterIds": ["ch03", "ch04"], "difficulty": "进阶", "source": "本课程整理 · 注意力", "prerequisites": ["c02", "c03"]}, {"id": "c07", "title": "Q / K / V", "file": "concepts/c07-qkv.md", "chapterIds": ["ch03", "ch05"], "difficulty": "进阶", "source": "本课程整理 · 注意力", "prerequisites": ["c06"], "depthFragment": "concepts/c07-qkv-depth.md"}, {"id": "c08", "title": "残差连接", "file": "concepts/c08-residual.md", "chapterIds": ["ch04"], "difficulty": "基础", "source": "本课程整理 · Transformer", "prerequisites": ["c02"]}, {"id": "c09", "title": "RMSNorm", "file": "concepts/c09-rmsnorm.md", "chapterIds": ["ch04"], "difficulty": "进阶", "source": "本课程整理 · Transformer", "prerequisites": ["c01", "c08"]}, {"id": "c10", "title": "前馈网络（FFN）", "file": "concepts/c10-ffn.md", "chapterIds": ["ch04", "ch05"], "difficulty": "进阶", "source": "本课程整理 · Transformer", "prerequisites": ["c02", "c09"]}, {"id": "c11", "title": "自回归生成", "file": "concepts/c11-autoregressive.md", "chapterIds": ["ch04"], "difficulty": "基础", "source": "本课程整理 · 生成", "prerequisites": ["c03", "c04"]}, {"id": "c12", "title": "MLA（多头潜在注意力）", "file": "concepts/c12-mla.md", "chapterIds": ["ch05"], "difficulty": "高难", "source": "DeepSeek-V3 技术报告 §2.1", "prerequisites": ["c07", "c16"], "depthFragment": "concepts/c12-mla-depth.md"}, {"id": "c13", "title": "DeepSeekMoE", "file": "concepts/c13-deepseekmoe.md", "chapterIds": ["ch05"], "difficulty": "高难", "source": "DeepSeek-V3 技术报告 §2.2", "prerequisites": ["c03", "c10"], "depthFragment": "concepts/c13-moe-depth.md"}, {"id": "c14", "title": "MTP（多 token 预测）", "file": "concepts/c14-mtp.md", "chapterIds": ["ch05"], "difficulty": "进阶", "source": "DeepSeek-V3 技术报告 §2.3", "prerequisites": ["c11"]}, {"id": "c15", "title": "负载均衡", "file": "concepts/c15-load-balancing.md", "chapterIds": ["ch05"], "difficulty": "进阶", "source": "DeepSeek-V3 技术报告 §2.2", "prerequisites": ["c03", "c13"]}, {"id": "c16", "title": "KV cache", "file": "concepts/c16-kv-cache.md", "chapterIds": ["ch05"], "difficulty": "进阶", "source": "DeepSeek-V3 技术报告 §2.1", "prerequisites": ["c07", "c11"]}], "glossary": [{"term": "向量", "def": "一串有顺序的数字，长度叫维度。", "chapterId": "ch01"}, {"term": "矩阵乘法", "def": "左矩阵每行与右矩阵每列做点积，得到新矩阵。", "chapterId": "ch01"}, {"term": "softmax", "def": "把分数转成非负、总和为 1 的权重。", "chapterId": "ch01"}, {"term": "token", "def": "模型处理文本的基本单位，可以是一个字、一个词或词的一部分。", "chapterId": "ch01"}, {"term": "embedding", "def": "把 token 编号映射成固定长度向量的表。", "chapterId": "ch01"}, {"term": "参数", "def": "模型里可训练的数值，比如矩阵元素。", "chapterId": "ch02"}, {"term": "损失", "def": "衡量预测与正确答案差距的标量。", "chapterId": "ch02"}, {"term": "梯度", "def": "损失对参数的变化率，指示更新方向。", "chapterId": "ch02"}, {"term": "学习率", "def": "每次参数更新走多大的一步。", "chapterId": "ch02"}, {"term": "过拟合", "def": "训练集上损失很小，换数据就变差。", "chapterId": "ch02"}, {"term": "注意力", "def": "按 token 间相似度加权收集信息的机制。", "chapterId": "ch03"}, {"term": "Q / K / V", "def": "查询、键、值，同一输入的三次投影。", "chapterId": "ch03"}, {"term": "多头注意力", "def": "并行多套 Q/K/V，捕捉不同关系。", "chapterId": "ch03"}, {"term": "因果掩码", "def": "禁止每个 token 看到未来 token。", "chapterId": "ch03"}, {"term": "残差连接", "def": "把子层输入加到子层输出。", "chapterId": "ch04"}, {"term": "RMSNorm", "def": "用均方根缩放向量的归一化。", "chapterId": "ch04"}, {"term": "FFN", "def": "对每个 token 独立做升维-激活-降维。", "chapterId": "ch04"}, {"term": "自回归生成", "def": "逐个预测下一个 token 并接回输入。", "chapterId": "ch04"}, {"term": "MLA", "def": "用低维潜向量压缩 KV cache 的注意力。", "chapterId": "ch05"}, {"term": "DeepSeekMoE", "def": "共享专家 + 细粒度路由专家的混合专家结构。", "chapterId": "ch05"}, {"term": "MTP", "def": "训练时额外预测未来第 2 个 token。", "chapterId": "ch05"}, {"term": "KV cache", "def": "推理时缓存历史 token 的 K/V。", "chapterId": "ch05"}, {"term": "专家塌缩", "def": "MoE 路由总选少数专家，其他专家学不到东西。", "chapterId": "ch05"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "quizzes": [{"id": "ch01-q01", "chapterId": "ch01", "type": "single", "question": "一个 2×3 矩阵乘一个 3 维向量，结果是什么形状？", "options": ["2×3 矩阵", "3 维向量", "2 维向量", "一个标量"], "answer": 2, "explain": "左矩阵两行，每行与 3 维向量做一次加权求和，得到两个数。", "relatedConceptId": "c02"}, {"id": "ch01-q02", "chapterId": "ch01", "type": "single", "question": "对分数 [0, 0, 0] 做 softmax，输出是什么？", "options": ["[0, 0, 0]", "[1/3, 1/3, 1/3]", "[1, 0, 0]", "[3, 3, 3]"], "answer": 1, "explain": "三个 e^0=1，总和 3，各占三分之一。", "relatedConceptId": "c03"}, {"id": "ch01-q03", "chapterId": "ch01", "type": "single", "question": "embedding 表在模型里做什么？", "options": ["把 token 编号映射成向量", "把向量压缩成标量", "把句子翻译成英文", "计算损失"], "answer": 0, "explain": "embedding 表按 token 编号查出一串固定长度的向量。", "relatedConceptId": "c01"}, {"id": "ch02-q04", "chapterId": "ch02", "type": "single", "question": "梯度为正时，梯度下降会把参数往哪个方向更新？", "options": ["增大", "减小", "不变", "随机"], "answer": 1, "explain": "更新规则是减去学习率乘梯度，梯度为正就减小参数。", "relatedConceptId": "c05"}, {"id": "ch02-q05", "chapterId": "ch02", "type": "single", "question": "w=1、x=2、y=3，损失 L=(wx-y)^2，对 w 的梯度是多少？", "options": ["-4", "4", "-2", "2"], "answer": 0, "explain": "2(wx-y)x = 2(2-3)×2 = -4。", "relatedConceptId": "c05"}, {"id": "ch02-q06", "chapterId": "ch02", "type": "single", "question": "学习率取得过大，训练曲线通常会出现什么？", "options": ["收敛更快且稳定", "损失震荡或发散", "参数不再更新", "模型自动变小"], "answer": 1, "explain": "步子太大会跨过谷底，损失震荡甚至变成 NaN。", "relatedConceptId": "c04"}, {"id": "ch03-q07", "chapterId": "ch03", "type": "single", "question": "注意力里真正被加权混合的是哪一项？", "options": ["Query", "Key", "Value", "因果掩码"], "answer": 2, "explain": "Q 和 K 只用于算分数，输出是 V 的加权和。", "relatedConceptId": "c06"}, {"id": "ch03-q08", "chapterId": "ch03", "type": "single", "question": "分数 [1, 1, 1] 经过 softmax 后的权重是什么？", "options": ["[1, 0, 0]", "[1/3, 1/3, 1/3]", "[0.5, 0.5, 0]", "[3, 3, 3]"], "answer": 1, "explain": "三个 e^1 相等，各占三分之一。", "relatedConceptId": "c03"}, {"id": "ch03-q09", "chapterId": "ch03", "type": "single", "question": "注意力分数为什么要除以 sqrt(d_k)？", "options": ["让分数更大", "防止 softmax 过度集中", "增加注意力头数", "去掉位置信息"], "answer": 1, "explain": "维度高时点积数值大，softmax 会过度集中，梯度变小。", "relatedConceptId": "c06"}, {"id": "ch04-q10", "chapterId": "ch04", "type": "single", "question": "一个 Transformer 层里，残差连接加在哪两处？", "options": ["只在注意力后", "只在 FFN 后", "注意力和 FFN 后各一次", "每层最后只加一次"], "answer": 2, "explain": "注意力和 FFN 是两个子层，各自带残差。", "relatedConceptId": "c08"}, {"id": "ch04-q11", "chapterId": "ch04", "type": "single", "question": "输入形状 [6, 16] 经过 4 倍 FFN 后，中间层形状是什么？", "options": ["[6, 16]", "[6, 64]", "[24, 16]", "[6, 4]"], "answer": 1, "explain": "隐藏维度 16 放大 4 倍是 64，token 数不变。", "relatedConceptId": "c10"}, {"id": "ch04-q12", "chapterId": "ch04", "type": "single", "question": "为什么位置信息必须显式注入 Transformer？", "options": ["让模型知道词序", "减少参数量", "加速训练", "替代注意力"], "answer": 0, "explain": "查表得到的 token 向量不含顺序信息，不注入位置就分不清词序。", "relatedConceptId": "c11"}, {"id": "ch05-q13", "chapterId": "ch05", "type": "single", "question": "MLA 推理时缓存的核心内容是什么？", "options": ["每个头的完整 K 和 V", "低维潜向量和 RoPE key", "只有 Query", "整个隐藏层输出"], "answer": 1, "explain": "MLA 缓存压缩后的 c_KV 和承载位置的 RoPE key。", "relatedConceptId": "c12"}, {"id": "ch05-q14", "chapterId": "ch05", "type": "single", "question": "DeepSeekMoE 中共享专家的作用是什么？", "options": ["只处理英文", "始终激活，兜住通用知识", "只处理数学题", "替代注意力"], "answer": 1, "explain": "共享专家对所有 token 生效，减少路由专家重复学习通用知识。", "relatedConceptId": "c13"}, {"id": "ch05-q15", "chapterId": "ch05", "type": "single", "question": "MTP 在训练时额外预测哪个位置？", "options": ["只预测 t+1", "额外预测 t+2", "预测前一个 token", "随机位置"], "answer": 1, "explain": "在位置 t 额外预测 t+2，增加训练信号密度。", "relatedConceptId": "c14"}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "向量在模型里是什么？", "back": "一串有顺序的数字，长度叫维度。", "tags": ["基础", "向量"]}, {"id": "f02", "chapterId": "ch01", "front": "矩阵乘法的计算规则？", "back": "左矩阵每一行与右矩阵每一列做点积。", "tags": ["基础", "矩阵"]}, {"id": "f03", "chapterId": "ch01", "front": "softmax 的两个关键性质？", "back": "输出非负、总和为 1，并且保持原有大小顺序。", "tags": ["基础", "softmax"]}, {"id": "f04", "chapterId": "ch01", "front": "embedding 表做什么？", "back": "把 token 编号映射成固定长度的向量。", "tags": ["基础", "embedding"]}, {"id": "f05", "chapterId": "ch02", "front": "参数、损失、梯度各是什么？", "back": "参数是可调旋钮，损失是差距分数，梯度是损失对参数的变化率。", "tags": ["训练", "基础"]}, {"id": "f06", "chapterId": "ch02", "front": "梯度下降的更新公式？", "back": "w ← w - η·∂L/∂w。", "tags": ["训练", "梯度"]}, {"id": "f07", "chapterId": "ch02", "front": "学习率过大和过小分别会怎样？", "back": "过大震荡或发散，过小学得慢。", "tags": ["训练", "学习率"]}, {"id": "f08", "chapterId": "ch02", "front": "过拟合是什么？", "back": "训练集损失很小，换一批数据表现变差。", "tags": ["训练", "泛化"]}, {"id": "f09", "chapterId": "ch03", "front": "Q、K、V 各自负责什么？", "back": "Q 找信息，K 提供标签，V 提供实际内容。", "tags": ["注意力", "QKV"]}, {"id": "f10", "chapterId": "ch03", "front": "注意力分数怎么算？", "back": "Q 与 K 点积，除以 sqrt(d_k)，再 softmax。", "tags": ["注意力", "公式"]}, {"id": "f11", "chapterId": "ch03", "front": "为什么要除以 sqrt(d_k)？", "back": "防止高维点积过大，softmax 过度集中导致梯度消失。", "tags": ["注意力", "缩放"]}, {"id": "f12", "chapterId": "ch03", "front": "因果掩码的作用？", "back": "把未来位置的分数设为负无穷，禁止模型偷看答案。", "tags": ["注意力", "掩码"]}, {"id": "f13", "chapterId": "ch04", "front": "Transformer 一层有哪两段？", "back": "多头注意力和前馈网络，各自带残差与归一化。", "tags": ["Transformer", "结构"]}, {"id": "f14", "chapterId": "ch04", "front": "残差连接的公式？", "back": "y = x + Layer(x)。", "tags": ["Transformer", "残差"]}, {"id": "f15", "chapterId": "ch04", "front": "RMSNorm 与 LayerNorm 的区别？", "back": "RMSNorm 不减均值，只除以均方根，计算更快。", "tags": ["Transformer", "归一化"]}, {"id": "f16", "chapterId": "ch04", "front": "FFN 的形状怎么变？", "back": "先升到约 4 倍中间维度，激活后再降回隐藏维度。", "tags": ["Transformer", "FFN"]}, {"id": "f17", "chapterId": "ch05", "front": "MLA 缓存什么？", "back": "低维潜向量 c_KV 和解耦的 RoPE key。", "tags": ["DeepSeek", "MLA"]}, {"id": "f18", "chapterId": "ch05", "front": "DeepSeekMoE 的结构？", "back": "1 个共享专家 + 多个细粒度路由专家，每 token 激活 top-k 个路由专家。", "tags": ["DeepSeek", "MoE"]}, {"id": "f19", "chapterId": "ch05", "front": "MTP 的训练目标？", "back": "在每个位置额外预测未来第 2 个 token。", "tags": ["DeepSeek", "MTP"]}, {"id": "f20", "chapterId": "ch05", "front": "无辅助损失负载均衡怎么做？", "back": "给每个专家一个可学习偏置，按负载调偏置，不往主损失加辅助项。", "tags": ["DeepSeek", "负载均衡"]}]}, "rendered": {"ch01": "<div class=\"source-badge\">📖 出处：本课程整理 · 基础数学<\/div><h1>第 1 章：数字怎么变成“意思”：向量、矩阵与 softmax<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用白话解释向量、矩阵、矩阵乘法分别是什么。\n<\/li><li>\n手算一个 3 维向量的点积，以及一个 2×3 矩阵乘 3 维向量的结果。\n<\/li><li>\n给定三个分数，手算 softmax，并解释它为什么输出一组“比例”。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>模型不认字，它把每个词变成一串数字，再用矩阵乘法不断把这些数字重新组合。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：向量就是一串有顺序的数字（难度：基础）<\/h3>\n<p><strong>向量<\/strong>（vector）在模型里没有那么神秘，它就是“一串按顺序排好的数字”。比如描述一个人的三项体检指标，可以写成：<\/p>\n<div class=\"katex-block\">\\mathbf{x} = [1.72,\\ 70,\\ 25]<\/div>\n<p>三项分别是身高、体重、年龄。顺序不能乱：把 70 放到第一位，含义就变了。向量的长度叫<strong>维度<\/strong>（dimension），上面这个是 3 维。<\/p>\n<p>模型处理一个词时也做同样的事：把“猫”映射成例如 <code>[0.2, -0.5, 1.1, 0.03]<\/code> 这样一串数。这串数叫<strong>词向量<\/strong>，也叫 <strong>embedding<\/strong>。每个位置的数字没有“身高体重”那么直白的含义，它们是训练过程中自己学出来的。<\/p>\n<blockquote>类比：向量像一张配料表。每种配料的用量是一个数字，整张表决定这道菜的味道。失效边界：配料表是人写的，词向量是模型自己学出来的，单个数字往往无法翻译成人话。<\/blockquote>\n<h3>概念 2：矩阵乘法就是“按行做加权求和”（难度：基础）<\/h3>\n<p><strong>矩阵<\/strong>（matrix）是数字排成的矩形表。一个 2×3 的矩阵有两行三列：<\/p>\n<div class=\"katex-block\">W = \\begin{bmatrix} 1 & 0 & 2 \\\\ 0 & 1 & -1 \\end{bmatrix}<\/div>\n<p>它乘一个 3 维向量，会得到一个 2 维向量。规则只有一句：<strong>结果的第 i 个数，等于矩阵第 i 行与向量对应位置相乘再相加。<\/strong><\/p>\n<p>拿 <span class=\"katex-inline\">\\mathbf{x} = [3, 1, 4]<\/span> 来算：<\/p>\n<ul><li>\n第一行：<span class=\"katex-inline\">1\\times 3 + 0\\times 1 + 2\\times 4 = 3 + 0 + 8 = 11<\/span>\n<\/li><li>\n第二行：<span class=\"katex-inline\">0\\times 3 + 1\\times 1 + (-1)\\times 4 = 0 + 1 - 4 = -3<\/span>\n<\/ul>\n<p>所以结果是 <span class=\"katex-inline\">[11, -3]<\/span>。写成公式：<\/p>\n<div class=\"katex-block\">(W\\mathbf{x})_i = \\sum_j W_{ij}x_j<\/div>\n<p>这里的 <span class=\"katex-inline\">\\sum<\/span> 是“把 j 取遍所有值后加起来”的意思，<span class=\"katex-inline\">\\sum_j W_{ij}x_j<\/span> 念作“第 i 行每个元素乘以对应输入，再全部相加”。<\/p>\n<p>矩阵乘法有两种常见误读，先排除：<\/p>\n<ul><li>\n它不是“对应位置相乘”。对应位置相乘叫<strong>逐元素乘法<\/strong>，结果还是同样形状，不叫矩阵乘法。\n<\/li><li>\n它也不是“两个矩阵随便乘”。左矩阵的列数必须等于右矩阵的行数，否则无法配对。\n<\/ul>\n<blockquote>类比：矩阵像一台有多条生产线的机器，每条生产线按自己的配方（一行权重）把同一批原料加工成一个输出。失效边界：真实模型的矩阵是成千上万行，配方不是人设计的，是训练出来的。<\/blockquote>\n<h3>概念 3：softmax 把一堆分数变成一组比例（难度：基础）<\/h3>\n<p>模型经常需要对若干个候选打分，然后决定“各占多少份额”。<strong>softmax<\/strong> 就干这件事。给定三个分数 <span class=\"katex-inline\">z_1, z_2, z_3<\/span>，它先取指数，再归一化：<\/p>\n<div class=\"katex-block\">\\text{softmax}(z_i) = \\frac{e^{z_i}}{\\sum_j e^{z_j}}<\/div>\n<p><span class=\"katex-inline\">e<\/span> 是自然常数，约等于 2.718。取指数的目的，是把负数也变成正数，并且让高分和低分的差距被拉大。分母把所有指数加起来，保证输出总和为 1。<\/p>\n<p>拿分数 <span class=\"katex-inline\">[2, 1, 0]<\/span> 手算：<\/p>\n<ul><li>\n<span class=\"katex-inline\">e^2 \\approx 7.389<\/span>\n<\/li><li>\n<span class=\"katex-inline\">e^1 \\approx 2.718<\/span>\n<\/li><li>\n<span class=\"katex-inline\">e^0 = 1<\/span>\n<\/li><li>\n总和 <span class=\"katex-inline\">= 7.389 + 2.718 + 1 = 11.107<\/span>\n<\/li><li>\n输出：<span class=\"katex-inline\">[7.389/11.107,\\ 2.718/11.107,\\ 1/11.107] \\approx [0.665,\\ 0.245,\\ 0.090]<\/span>\n<\/ul>\n<p>三个数都为正，加起来正好是 1。这就是“比例”。注意，softmax 不改变大小顺序：原来最大的，输出仍然最大。<\/p>\n<blockquote>类比：三个人分一块蛋糕，softmax 按“表现分”决定每人切多少，总分归一。失效边界：蛋糕总量固定，softmax 的输出也确实固定为 1，这一点是它和普通归一化的共同点；但 softmax 会放大强者优势，不是简单的按比例平分。<\/blockquote>\n<h3>概念 4：文字先进 token，再进向量（难度：基础）<\/h3>\n<p>模型读一句话，要经过两步：<\/p>\n<ol><li>\n<strong>分词<\/strong>：把句子切成一个个 <strong>token<\/strong>。中文可能一个字一个 token，也可能两个字的词一个 token；英文常见是一个词的一部分一个 token。\n<\/li><li>\n<strong>查表<\/strong>：每个 token 有一个整数编号，模型用这个编号去一张大表里取出对应的向量。\n<\/ol>\n<p>于是“猫坐在垫子上”最终变成一串向量。后面所有注意力、矩阵乘法，都是在这串向量上做运算。模型内部没有“猫”这个字，只有与它对应的那串数字。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[&quot;猫坐在垫子上&quot;] --&gt; B[分词]\n  B --&gt; C[&quot;token: 猫 / 坐 / 在 / 垫子 / 上&quot;]\n  C --&gt; D[查 embedding 表]\n  D --&gt; E[&quot;向量序列：x1, x2, x3, x4, x5&quot;]\n  E --&gt; F[矩阵乘法]\n  F --&gt; G[softmax 得到比例]\n  G --&gt; H[下一层]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：从文字到向量是“查表”，从向量到新向量是“矩阵乘法”，需要分配权重时用 softmax。这三件事会贯穿整本书。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：把一句话想成一张 Excel 表，每一行是一个 token，每一列是一个数字特征。模型做的事，就是不断用固定的公式重新计算这张表。\n<\/li><li>\n<strong>实例<\/strong>：假设只有三个 token，它们的向量分别是 <span class=\"katex-inline\">[1,0]<\/span>、<span class=\"katex-inline\">[0,1]<\/span>、<span class=\"katex-inline\">[1,1]<\/span>。用矩阵\n<\/ul>\n<div class=\"katex-block\">W = \\begin{bmatrix} 2 & 1 \\\\ 0 & 3 \\end{bmatrix}<\/div>\n<p>乘第一个向量 <span class=\"katex-inline\">[1,0]<\/span>，得 <span class=\"katex-inline\">[2, 0]<\/span>；乘第三个向量 <span class=\"katex-inline\">[1,1]<\/span>，得 <span class=\"katex-inline\">[3, 3]<\/span>。同一个矩阵作用在不同 token 上，得到不同结果，这就是“共享一套参数，处理不同输入”。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为向量一定是空间里的箭头<\/strong>——在模型里它就是一串数字，箭头只是二维、三维时的几何解释。\n<\/li><li>\n<strong>别以为矩阵乘法是逐元素相乘<\/strong>——逐元素相乘不改变形状；矩阵乘法会改变维度，并且要做“乘后求和”。\n<\/li><li>\n<strong>别以为 softmax 的输出可以随便解释<\/strong>——它只是把分数变成比例，比例高不等于模型“真的理解”了那个 token。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<p>1.（单选）一个 2×3 矩阵乘一个 3 维向量，结果是什么形状？ A. 2×3 矩阵 B. 3 维向量 C. 2 维向量 D. 一个数 <strong>答案：C<\/strong>；解析：左矩阵两行，每行与 3 维向量做一次加权求和，得到两个数。<\/p>\n<p>2.（填空）对分数 <span class=\"katex-inline\">[0, 0, 0]<\/span> 做 softmax，输出是 ______。 <strong>答案：<span class=\"katex-inline\">[1/3, 1/3, 1/3]<\/span><\/strong>；解析：三个 <span class=\"katex-inline\">e^0=1<\/span>，总和 3，各自占三分之一。<\/p>\n<p>3.（简答）用一句话解释“embedding 表”在模型里做什么。 <strong>答案要点<\/strong>：把 token 的整数编号映射成一串固定长度的向量，让后续层可以对它做数值运算。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n向量是一串有顺序的数字，维度就是数字的个数。\n<\/li><li>\n矩阵乘法等于“每行做一次加权求和”，会改变维度。\n<\/li><li>\nsoftmax 先取指数再归一化，输出非负且总和为 1。\n<\/ul>", "ch02": "<div class=\"source-badge\">📖 出处：本课程整理 · 训练基础<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/deepseek-foundations/chapter/ch01\">第 1 章：数字怎么变成“意思”：向量、矩阵与 softmax<\/a><\/span><\/div><h1>第 2 章：模型怎么学会：参数、损失、梯度<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 1 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清“参数”“预测”“损失”三个词分别在训练里扮演什么角色。\n<\/li><li>\n用一个单参数例子手算一次梯度下降更新。\n<\/li><li>\n解释学习率过大和过小分别会发生什么。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>训练就是反复做三件事：拿当前参数去预测，算预测和答案差多少，再沿着让差距变小的方向挪一点参数。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：参数是模型身上“可调的旋钮”（难度：基础）<\/h3>\n<p><strong>参数<\/strong>（parameter）就是模型里那些会被训练改变的数值。第 1 章里的矩阵 <span class=\"katex-inline\">W<\/span>，每一个位置都是一个参数；一个 671B 参数的模型，就有 6710 亿个这样的旋钮。<\/p>\n<p>训练开始前，这些旋钮随机初始化，模型输出基本是胡猜。训练的过程，就是一点点拧旋钮，让输出越来越接近正确答案。<\/p>\n<blockquote>类比：老式收音机的调台旋钮。拧到某个位置，声音最清楚；训练就是自动找这个位置。失效边界：收音机通常只有几个旋钮，大模型有几千亿个，而且它们互相影响，不能一个一个独立调。<\/blockquote>\n<h3>概念 2：预测就是一次前向计算（难度：基础）<\/h3>\n<p>给定输入 <span class=\"katex-inline\">x<\/span>，模型用当前参数算出输出 <span class=\"katex-inline\">\\hat{y}<\/span>，这一步叫<strong>前向传播<\/strong>（forward pass）。最简单的模型只有一个参数 <span class=\"katex-inline\">w<\/span>：<\/p>\n<div class=\"katex-block\">\\hat{y} = wx<\/div>\n<p>如果 <span class=\"katex-inline\">w=2<\/span>、<span class=\"katex-inline\">x=3<\/span>，预测就是 6。真实答案 <span class=\"katex-inline\">y=5<\/span>，预测偏大。训练要做的就是根据这个偏差去改 <span class=\"katex-inline\">w<\/span>。<\/p>\n<h3>概念 3：损失是一个“差距分数”（难度：基础）<\/h3>\n<p><strong>损失<\/strong>（loss）把“预测和答案差多少”变成一个数字。回归问题常用平方误差：<\/p>\n<div class=\"katex-block\">L = (\\hat{y} - y)^2<\/div>\n<p>代入 <span class=\"katex-inline\">\\hat{y}=6<\/span>、<span class=\"katex-inline\">y=5<\/span>，损失是 <span class=\"katex-inline\">(6-5)^2=1<\/span>。预测越准，损失越小；完全预测对，损失为 0。<\/p>\n<p>分类问题常用<strong>交叉熵<\/strong>，它衡量的是“模型给正确答案分配的概率有多低”。这一章不展开公式，只要记住：损失是一个标量，越小越好。<\/p>\n<blockquote>类比：考试扣分。差距越大，扣分越多。失效边界：考试的扣分规则是人定的，损失函数是数学上选的，不同任务用不同损失。<\/blockquote>\n<h3>概念 4：梯度告诉你“往哪边拧、拧多猛”（难度：基础）<\/h3>\n<p><strong>梯度<\/strong>（gradient）是损失对参数的导数，记作 <span class=\"katex-inline\">\\frac{\\partial L}{\\partial w}<\/span>。它回答一个问题：参数增大一点点，损失会变大还是变小，变化有多快。<\/p>\n<p>还是上面的例子，<span class=\"katex-inline\">L=(wx-y)^2<\/span>。对 <span class=\"katex-inline\">w<\/span> 求导，用链式法则：<\/p>\n<div class=\"katex-block\">\\frac{\\partial L}{\\partial w} = 2(wx-y)\\cdot x<\/div>\n<p>代入 <span class=\"katex-inline\">w=2<\/span>、<span class=\"katex-inline\">x=3<\/span>、<span class=\"katex-inline\">y=5<\/span>：<span class=\"katex-inline\">2(6-5)\\cdot 3 = 6<\/span>。梯度为正，说明 <span class=\"katex-inline\">w<\/span> 增大时损失会增大，所以应该把 <span class=\"katex-inline\">w<\/span> 往小的方向挪。<\/p>\n<h3>概念 5：梯度下降就是“往下坡走一步”（难度：基础）<\/h3>\n<p><strong>梯度下降<\/strong>（gradient descent）的更新规则：<\/p>\n<div class=\"katex-block\">w \\leftarrow w - \\eta \\frac{\\partial L}{\\partial w}<\/div>\n<p><span class=\"katex-inline\">\\eta<\/span> 是<strong>学习率<\/strong>（learning rate），控制每一步走多大。取 <span class=\"katex-inline\">\\eta=0.1<\/span>：<\/p>\n<ul><li>\n新 <span class=\"katex-inline\">w = 2 - 0.1\\times 6 = 1.4<\/span>\n<\/li><li>\n新预测 <span class=\"katex-inline\">= 1.4\\times 3 = 4.2<\/span>，更接近 5\n<\/li><li>\n新损失 <span class=\"katex-inline\">= (4.2-5)^2 = 0.64<\/span>，比原来的 1 小\n<\/ul>\n<p>一次更新，损失从 1 降到 0.64。把这一步重复几千几万次，参数就会慢慢逼近让损失最小的位置。<\/p>\n<blockquote>类比：蒙着眼睛下山，只能用脚感受哪边是下坡，然后朝那个方向迈一小步。失效边界：山可能是凹凸不平的，会卡在局部低点；深度学习的损失面维度极高，不能画成一座山。<\/blockquote>\n<h3>概念 6：学习率是最难调的旋钮之一（难度：基础）<\/h3>\n<ul><li>\n学习率太小：每步挪一点，训练慢得让人怀疑人生。\n<\/li><li>\n学习率太大：一步跨过谷底，损失可能反而越来越大，甚至变成 NaN（数值溢出）。\n<\/li><li>\n常见做法：先用较大的学习率快速下降，后期逐渐调小，叫<strong>学习率衰减<\/strong>。\n<\/ul>\n<p>DeepSeek-V4 的预训练学习率从 <span class=\"katex-inline\">2.7\\times 10^{-4}<\/span> 开始，训练末期按余弦曲线降到 <span class=\"katex-inline\">2.7\\times 10^{-5}<\/span>，就是同一个思路。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[初始化参数] --&gt; B[前向计算预测]\n  B --&gt; C[算损失]\n  C --&gt; D[反向传播求梯度]\n  D --&gt; E[按学习率更新参数]\n  E --&gt; B\n  C --&gt; F{损失够小?}\n  F --&gt;|否| B\n  F --&gt;|是| G[停止训练]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：这个循环叫<strong>训练步<\/strong>。模型不是“看懂”了数据，而是每走一步都让损失小一点。图里没有“理解”这个环节。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：调淋浴水温。手先试一下（前向），觉得太凉（损失），往热的方向拧一点（梯度方向），再试一次。拧的幅度就是学习率。\n<\/li><li>\n<strong>实例<\/strong>：<span class=\"katex-inline\">w=2<\/span>、<span class=\"katex-inline\">x=3<\/span>、<span class=\"katex-inline\">y=5<\/span>、<span class=\"katex-inline\">\\eta=0.1<\/span>，一次更新后 <span class=\"katex-inline\">w=1.4<\/span>、损失从 1 降到 0.64。再算一次：梯度 <span class=\"katex-inline\">=2(4.2-5)\\times 3=-4.8<\/span>，新 <span class=\"katex-inline\">w=1.4-0.1\\times(-4.8)=1.88<\/span>，预测 5.64，损失 0.41。两次更新，参数已经越过 1.67（理论最优）附近。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为梯度就是误差<\/strong>——误差是预测和答案的差，梯度是“误差对参数的变化率”，方向和信息不同。\n<\/li><li>\n<strong>别以为学习率越大收敛越快<\/strong>——太大会震荡甚至发散。\n<\/li><li>\n<strong>别以为损失为 0 就代表模型“学会了”<\/strong>——它只代表在这批训练数据上拟合得很好，换一批数据可能很差，这叫过拟合。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<p>1.（单选）梯度为正时，梯度下降会把参数往哪个方向更新？ A. 增大 B. 减小 C. 不变 D. 随机 <strong>答案：B<\/strong>；解析：更新规则是减去 <span class=\"katex-inline\">\\eta<\/span> 乘以梯度，梯度为正就减。<\/p>\n<p>2.（填空）<span class=\"katex-inline\">w=1<\/span>、<span class=\"katex-inline\">x=2<\/span>、<span class=\"katex-inline\">y=3<\/span>，损失 <span class=\"katex-inline\">L=(wx-y)^2<\/span>，对 <span class=\"katex-inline\">w<\/span> 的梯度是 ______。 <strong>答案：<span class=\"katex-inline\">-4<\/span><\/strong>；解析：<span class=\"katex-inline\">2(2-3)\\times 2=-4<\/span>。<\/p>\n<p>3.（简答）学习率取得过大，训练曲线通常会出现什么现象？ <strong>答案要点<\/strong>：损失震荡、飙升，严重时数值溢出变成 NaN，无法收敛。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n参数是可调旋钮，前向计算产生预测，损失衡量差距。\n<\/li><li>\n梯度给出“往哪边调、调多快”，更新规则是参数减去学习率乘梯度。\n<\/li><li>\n学习率决定步子大小，过小慢，过大震荡。\n<\/ul>", "ch03": "<div class=\"source-badge\">📖 出处：本课程整理 · 注意力机制<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/deepseek-foundations/chapter/ch01\">第 1 章：数字怎么变成“意思”：向量、矩阵与 softmax<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/deepseek-foundations/chapter/ch02\">第 2 章：模型怎么学会：参数、损失、梯度<\/a><\/span><\/div><h1>第 3 章：注意力机制：一句话里谁该看谁<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 1 章、第 2 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用白话解释 Query、Key、Value 各自负责什么。\n<\/li><li>\n手算 3 个 token 的注意力分数、softmax 权重和加权输出。\n<\/li><li>\n说清“多头注意力”和“因果掩码”分别在解决什么问题。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>注意力就是：当前 token 拿自己的 Query 去和所有 token 的 Key 比相似度，再按相似度把它们的 Value 加权混合。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：为什么需要注意力（难度：基础）<\/h3>\n<p>如果模型把一句话里每个词都独立处理，“猫追老鼠”和“老鼠追猫”在它眼里没有区别。模型需要一种机制，让每个词都能参考句子里其他词的信息。注意力就是这套机制。<\/p>\n<h3>概念 2：Q、K、V 是同一份输入的三次投影（难度：进阶）<\/h3>\n<p>每个 token 的向量 <span class=\"katex-inline\">x<\/span> 会分别乘三个矩阵，得到三个新向量：<\/p>\n<ul><li>\n<strong>Query<\/strong>（查询，<span class=\"katex-inline\">q<\/span>）：我想找什么信息。\n<\/li><li>\n<strong>Key<\/strong>（键，<span class=\"katex-inline\">k<\/span>）：我能提供什么信息。\n<\/li><li>\n<strong>Value<\/strong>（值，<span class=\"katex-inline\">v<\/span>）：如果被选中，我实际交出的内容。\n<\/ul>\n<p>写成公式：<\/p>\n<div class=\"katex-block\">q = xW_Q,\\quad k = xW_K,\\quad v = xW_V<\/div>\n<p><span class=\"katex-inline\">W_Q<\/span>、<span class=\"katex-inline\">W_K<\/span>、<span class=\"katex-inline\">W_V<\/span> 都是训练出来的参数矩阵。注意，Q、K、V 不是三份不同的输入，而是同一份输入经过三种不同的“翻译”。<\/p>\n<blockquote>类比：去图书馆找书。Query 是你心里的检索词，Key 是每本书的标签，Value 是书里的正文。你拿检索词和标签比，匹配度高的书，正文被借走的比重就大。失效边界：图书馆的标签是人写的，模型的 Key 是学出来的，不一定对应人能读懂的关键词。<\/blockquote>\n<h3>概念 3：相似度用点积算（难度：进阶）<\/h3>\n<p>两个向量的<strong>点积<\/strong>（dot product）是对应位置相乘再相加：<\/p>\n<div class=\"katex-block\">q\\cdot k = \\sum_i q_i k_i<\/div>\n<p>点积越大，说明两个向量方向越接近。注意力用点积当相似度分数。分数还要除以 <span class=\"katex-inline\">\\sqrt{d_k}<\/span>，<span class=\"katex-inline\">d_k<\/span> 是向量维度。原因很实在：维度越高，点积的数值容易变得很大，softmax 之后会变成“一家独大”，梯度几乎消失。除以 <span class=\"katex-inline\">\\sqrt{d_k}<\/span> 把数值拉回可控范围。<\/p>\n<div class=\"katex-block\">s_{ij} = \\frac{q_i \\cdot k_j}{\\sqrt{d_k}}<\/div>\n<h3>概念 4：softmax 把分数变成权重（难度：基础）<\/h3>\n<p>对第 <span class=\"katex-inline\">i<\/span> 个 token 的所有分数做 softmax，得到它给每个 token 的权重：<\/p>\n<div class=\"katex-block\">\\alpha_{ij} = \\frac{e^{s_{ij}}}{\\sum_{l} e^{s_{il}}}<\/div>\n<p>权重非负，加起来为 1。最后把每个 token 的 Value 按权重加起来：<\/p>\n<div class=\"katex-block\">o_i = \\sum_j \\alpha_{ij} v_j<\/div>\n<p>这就是注意力的输出。<\/p>\n<h3>概念 5：手算一个 3 token 的例子（难度：进阶）<\/h3>\n<p>假设三个 token 的 Query、Key、Value 已经算好（为了好算，只用 2 维）：<\/p>\n<ul><li>\n<span class=\"katex-inline\">q_1=[1,0]<\/span>\n<\/li><li>\n<span class=\"katex-inline\">k_1=[1,0]<\/span>，<span class=\"katex-inline\">k_2=[0,1]<\/span>，<span class=\"katex-inline\">k_3=[1,1]<\/span>\n<\/li><li>\n<span class=\"katex-inline\">v_1=[10,0]<\/span>，<span class=\"katex-inline\">v_2=[0,10]<\/span>，<span class=\"katex-inline\">v_3=[5,5]<\/span>\n<\/ul>\n<p>先算点积分数（忽略 <span class=\"katex-inline\">\\sqrt{d_k}<\/span> 的缩放，取 <span class=\"katex-inline\">d_k=1<\/span> 方便演示）：<\/p>\n<ul><li>\n<span class=\"katex-inline\">q_1\\cdot k_1 = 1<\/span>\n<\/li><li>\n<span class=\"katex-inline\">q_1\\cdot k_2 = 0<\/span>\n<\/li><li>\n<span class=\"katex-inline\">q_1\\cdot k_3 = 1<\/span>\n<\/ul>\n<p>softmax：<span class=\"katex-inline\">e^1\\approx 2.718<\/span>，<span class=\"katex-inline\">e^0=1<\/span>，总和 <span class=\"katex-inline\">6.436<\/span>，权重约为 <span class=\"katex-inline\">[0.422, 0.155, 0.422]<\/span>。<\/p>\n<p>加权输出：<\/p>\n<div class=\"katex-block\">o_1 = 0.422[10,0] + 0.155[0,10] + 0.422[5,5] = [6.33,\\ 3.66]<\/div>\n<p>第一个 token 的输出里，混进了第一个和第三个 token 的 Value，第二个 token 贡献很小。谁和它的 Query 更相似，谁的 Value 占比就更高。<\/p>\n<h3>概念 6：多头注意力：同时用几套不同的眼光看（难度：进阶）<\/h3>\n<p>一套 Q/K/V 只能捕捉一种关系。<strong>多头注意力<\/strong>（multi-head attention）让模型并行做 <span class=\"katex-inline\">h<\/span> 组，每组有自己的 <span class=\"katex-inline\">W_Q<\/span>、<span class=\"katex-inline\">W_K<\/span>、<span class=\"katex-inline\">W_V<\/span>，各自算出一份输出，最后拼起来再乘一个输出矩阵：<\/p>\n<div class=\"katex-block\">\\text{MultiHead}(X) = [\\text{head}_1;\\ \\text{head}_2;\\ \\ldots;\\ \\text{head}_h]W_O<\/div>\n<p>每个头可以关注不同的东西：有的盯相邻词，有的盯标点，有的盯主语。DeepSeek-V3 的注意力有 128 个头，每头维度 128。<\/p>\n<blockquote>类比：同一场会议派几个记录员，一个记谁说了什么，一个记语气，一个记时间顺序，最后把几份笔记合并。失效边界：记录员是分工好的，模型的多头分工没有明确标签，是训练中自发形成的。<\/blockquote>\n<h3>概念 7：因果掩码：不许看未来（难度：进阶）<\/h3>\n<p>语言模型的任务是“根据前面的词预测下一个词”。训练时如果把整句话一次性喂进去，第 3 个 token 就能看到第 4、第 5 个 token，等于提前偷看答案。<strong>因果掩码<\/strong>（causal mask）把每个 token 对“未来 token”的注意力分数设成负无穷，softmax 之后权重变成 0。这样每个位置只能看自己和左边。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  X[&quot;输入向量 X&quot;] --&gt; Q[&quot;Q = XW_Q&quot;]\n  X --&gt; K[&quot;K = XW_K&quot;]\n  X --&gt; V[&quot;V = XW_V&quot;]\n  Q --&gt; S[&quot;QK^T / sqrt（d_k）&quot;]\n  K --&gt; S\n  S --&gt; M[&quot;因果掩码 + softmax&quot;]\n  M --&gt; W[&quot;权重 α&quot;]\n  V --&gt; O[&quot;加权求和&quot;]\n  W --&gt; O\n  O --&gt; P[&quot;输出投影 W_O&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：Q 和 K 只负责“算匹配分数”，真正被混合的是 V。掩码加在 softmax 之前，未来位置的分数被压到负无穷。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：投票。每个 token 拿自己的提案（Q）去和其他 token 的竞选纲领（K）比对，相似度决定票数，最后按票数分配资源（V）。\n<\/li><li>\n<strong>实例<\/strong>：上面的 3 token 计算，输出 <span class=\"katex-inline\">[6.33, 3.66]<\/span>。如果把 <span class=\"katex-inline\">q_1<\/span> 改成 <span class=\"katex-inline\">[0,1]<\/span>，分数变成 <span class=\"katex-inline\">[0,1,1]<\/span>，权重变成 <span class=\"katex-inline\">[0.155,0.422,0.422]<\/span>，输出会变成 <span class=\"katex-inline\">[3.66, 6.33]<\/span>，第一个 token 的关注点从“和自己像的”转向“和第二个维度像的”。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为注意力权重就是“模型解释”<\/strong>——权重高只说明这个头的数值匹配度高，不代表模型真的在用这个 token 做决策。多头叠加后更难直接解释。\n<\/li><li>\n<strong>别以为多头只是把同一个计算重复几次<\/strong>——每个头有独立的投影矩阵，学到的关系不同。\n<\/li><li>\n<strong>别以为因果掩码会让模型变笨<\/strong>——它只是禁止偷看答案，推理时本来也只能看到已经生成的词。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<p>1.（单选）注意力里真正被加权混合的是哪一项？ A. Query B. Key C. Value D. 掩码 <strong>答案：C<\/strong>；解析：Q 和 K 只用于算分数，输出是 V 的加权和。<\/p>\n<p>2.（填空）分数 <span class=\"katex-inline\">[1,1,1]<\/span> 经过 softmax 后的权重是 ______。 <strong>答案：<span class=\"katex-inline\">[1/3,1/3,1/3]<\/span><\/strong>；解析：三个 <span class=\"katex-inline\">e^1<\/span> 相等，各占三分之一。<\/p>\n<p>3.（简答）为什么点积要除以 <span class=\"katex-inline\">\\sqrt{d_k}<\/span>？ <strong>答案要点<\/strong>：维度越高点积数值越大，softmax 会过度集中，梯度变小；缩放让分数回到可控范围。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\nQ 找信息、K 提供标签、V 提供内容，输出是 V 的加权和。\n<\/li><li>\n注意力分数是 Q 与 K 的点积，softmax 后变成权重。\n<\/li><li>\n多头并行捕捉不同关系，因果掩码禁止看未来。\n<\/ul>", "ch04": "<div class=\"source-badge\">📖 出处：本课程整理 · Transformer<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/deepseek-foundations/chapter/ch03\">第 3 章：注意力机制：一句话里谁该看谁<\/a><\/span><\/div><h1>第 4 章：Transformer 一层一层拆<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 3 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n按顺序说出一个 Transformer 层里有哪些部件。\n<\/li><li>\n跟踪一个 4 token、8 维的输入经过一层后的形状变化。\n<\/li><li>\n解释残差连接、RMSNorm、前馈网络各自的作用。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>一个 Transformer 层就是“注意力 + 前馈网络”两段计算，每段外面都套着残差和归一化，然后把同样的层重复几十次。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：token 向量进层之前先加位置信息（难度：基础）<\/h3>\n<p>第 1 章说过，每个 token 被查表变成一个向量。但查表只给出“这个词是什么”，没给出“它在第几个位置”。词序很重要，“猫追老鼠”和“老鼠追猫”的 token 完全一样，顺序不同意思就反了。<\/p>\n<p>常见做法是给向量加<strong>位置编码<\/strong>（positional encoding）。DeepSeek 系列用的是 <strong>RoPE<\/strong>（旋转位置编码），它不直接把位置向量加进去，而是把向量按位置“旋转”一个角度。第 5 章讲 MLA 时会再遇到它，这里只要知道：位置信息必须显式注入，否则模型分不清词序。<\/p>\n<h3>概念 2：一层的第一段是注意力（难度：基础）<\/h3>\n<p>输入是一张表，形状是 <code>[序列长度, 隐藏维度]<\/code>。比如 4 个 token、每个 8 维，就是 <code>[4, 8]<\/code>。<\/p>\n<p>注意力对这张表做三件事：<\/p>\n<ol><li>\n用三个矩阵把每个 token 投影成 Q、K、V，形状仍是 <code>[4, 8]<\/code>（如果只有 1 个头）。\n<\/li><li>\n算 Q 与所有 K 的分数，softmax 得到 <code>[4, 4]<\/code> 的权重矩阵。\n<\/li><li>\n用权重把 V 加权求和，输出 <code>[4, 8]<\/code>。\n<\/ol>\n<p>多头时，8 维会拆成几个头，比如 2 个头各 4 维，各自算完再拼回 <code>[4, 8]<\/code>。<\/p>\n<h3>概念 3：残差连接：给信息留一条直通车道（难度：基础）<\/h3>\n<p>如果每层都只做“注意力”或“前馈”，深层的输入会被反复改写，原始信息容易丢失，梯度也很难传回去。<strong>残差连接<\/strong>（residual connection）把层的输入直接加到层的输出上：<\/p>\n<div class=\"katex-block\">y = x + \\text{Layer}(x)<\/div>\n<p>这样即使这一层什么都没学到（输出接近 0），信息也能原样穿过去。反向传播时，梯度可以沿着这条直通车道直接流回前面的层，深层网络才训得动。<\/p>\n<blockquote>类比：楼层之间除了楼梯，还有一部直达电梯。楼梯负责加工，电梯保证原始包裹不会被弄丢。失效边界：残差不是“复制一份”，它是逐元素相加，维度和形状必须完全一致。<\/blockquote>\n<h3>概念 4：RMSNorm：把数值拉回稳定范围（难度：进阶）<\/h3>\n<p>层与层之间，数值可能越算越大，最后溢出。<strong>归一化<\/strong>（normalization）把每个 token 的向量缩放一下，让整体 magnitude 稳定。<\/p>\n<p>DeepSeek 用的是 <strong>RMSNorm<\/strong>（均方根归一化）。它只算向量的均方根，不减去均值：<\/p>\n<div class=\"katex-block\">\\text{RMSNorm}(x) = \\frac{x}{\\sqrt{\\frac{1}{d}\\sum_i x_i^2 + \\epsilon}} \\odot g<\/div>\n<p><span class=\"katex-inline\">\\epsilon<\/span> 是一个很小的数，防止除零；<span class=\"katex-inline\">g<\/span> 是可学习的缩放参数。它比 LayerNorm 少一次求均值的计算，速度更快，效果在大模型上够用。<\/p>\n<h3>概念 5：前馈网络：真正存知识的地方（难度：进阶）<\/h3>\n<p>注意力负责“在 token 之间搬运信息”，<strong>前馈网络<\/strong>（Feed-Forward Network，FFN）负责“对每个 token 单独做一次变换”。典型结构是两层线性变换加一个激活函数：<\/p>\n<div class=\"katex-block\">\\text{FFN}(x) = W_2\\ \\sigma(W_1x)<\/div>\n<p>中间维度通常比隐藏维度大 4 倍左右。比如 8 维输入，先升到 32 维，再降回 8 维。第一个矩阵有 <span class=\"katex-inline\">8\\times 32<\/span> 个权重，第二个有 <span class=\"katex-inline\">32\\times 8<\/span> 个，加起来 512 个参数（忽略偏置）。<\/p>\n<p>大模型里，FFN 往往占了总参数的绝大部分。DeepSeek 把 FFN 换成 MoE（第 5 章），就是为了在参数很多的同时，每个 token 只算一小部分。<\/p>\n<h3>概念 6：一层完整走一遍（难度：进阶）<\/h3>\n<p>以 4 个 token、8 维、2 个头为例：<\/p>\n<table><thead><tr><th>步骤<\/th><th>形状<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>输入<\/td><td><code>[4, 8]<\/code><\/td><td>4 个 token，每个 8 维<\/td><\/tr><tr><td>Q/K/V 投影<\/td><td><code>[4, 8]<\/code> 各一份<\/td><td>每个头 4 维，2 头拼回 8<\/td><\/tr><tr><td>注意力分数<\/td><td><code>[4, 4]<\/code><\/td><td>每个 token 对其他 4 个的分数<\/td><\/tr><tr><td>注意力输出<\/td><td><code>[4, 8]<\/code><\/td><td>V 的加权和<\/td><\/tr><tr><td>残差相加<\/td><td><code>[4, 8]<\/code><\/td><td>输入 + 注意力输出<\/td><\/tr><tr><td>RMSNorm<\/td><td><code>[4, 8]<\/code><\/td><td>数值缩放<\/td><\/tr><tr><td>FFN 升维<\/td><td><code>[4, 32]<\/code><\/td><td>中间层放大 4 倍<\/td><\/tr><tr><td>FFN 降维<\/td><td><code>[4, 8]<\/code><\/td><td>回到隐藏维度<\/td><\/tr><tr><td>残差相加<\/td><td><code>[4, 8]<\/code><\/td><td>归一化后的值 + FFN 输出<\/td><\/tr><\/tbody><\/table>\n<p>这就是一个<strong>Transformer 层<\/strong>。DeepSeek-V3 有 61 层，V4-Pro 也是 61 层，V4-Flash 43 层，V4.1-Flash 40 层。层数越多，模型能做的抽象层级越高，但计算和显存也越贵。<\/p>\n<h3>概念 7：最后一层怎么变成下一个词（难度：基础）<\/h3>\n<p>整条网络跑完，每个 token 得到一个 8 维（实际是几千维）的向量。最后接一个<strong>输出头<\/strong>（LM head），把隐藏向量映射到词表大小。词表有 128K 个 token，输出就是一个 128K 维的分数向量，softmax 之后得到下一个词的概率分布。<\/p>\n<p>训练时，答案 token 的概率越高，交叉熵损失越小；推理时，按这个分布采样或选最大概率，生成下一个 token，再把它接回输入，重复这个过程，叫<strong>自回归生成<\/strong>。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n  A[&quot;输入 x （4,8）&quot;] --&gt; B[&quot;RMSNorm&quot;]\n  B --&gt; C[&quot;多头注意力&quot;]\n  C --&gt; D[&quot;+ 残差&quot;]\n  D --&gt; E[&quot;RMSNorm&quot;]\n  E --&gt; F[&quot;FFN 升维到 32&quot;]\n  F --&gt; G[&quot;激活函数&quot;]\n  G --&gt; H[&quot;FFN 降维回 8&quot;]\n  H --&gt; I[&quot;+ 残差&quot;]\n  I --&gt; J[&quot;输出 （4,8）&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：注意残差是从 Norm 之前分出来的，和这一段的输出相加。一个层里有两段这样的结构：注意力一段、FFN 一段。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：一条流水线。注意力是“跨工位协调”，FFN 是“本工位深加工”，残差是“传送带”，归一化是“每道工序后校准仪器”。\n<\/li><li>\n<strong>实例<\/strong>：8 维输入、4 倍 FFN，单个 token 的 FFN 计算量是 <span class=\"katex-inline\">8\\times 32 + 32\\times 8 = 512<\/span> 次乘加；4 个 token 就是 2048 次。层数 61 时，仅 FFN 一项就是 <span class=\"katex-inline\">2048\\times 61 \\approx 12.5<\/span> 万次乘加/token（未计 MoE 稀疏化）。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为 Transformer 是一个词一个词串行处理的<\/strong>——训练时整句话并行进层，因果掩码保证每个位置只看左边；只有推理生成时才一个 token 一个 token 地产出。\n<\/li><li>\n<strong>别以为残差只是“防止梯度消失”的口号<\/strong>——它还保证深层网络至少能学到“什么都不做”，不会比浅层更差。\n<\/li><li>\n<strong>别以为 FFN 不重要<\/strong>——注意力负责搬运，FFN 负责存储和变换知识，参数大头在 FFN。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<p>1.（单选）一个 Transformer 层里，残差连接加在哪两处？ A. 只在注意力后 B. 只在 FFN 后 C. 注意力和 FFN 后各一次 D. 每一小步都加 <strong>答案：C<\/strong>；解析：标准结构是两段子层，各自带残差。<\/p>\n<p>2.（填空）输入 <code>[6, 16]<\/code> 经过 4 倍 FFN 后，中间层形状是 ______。 <strong>答案：<code>[6, 64]<\/code><\/strong>；解析：隐藏维度 16 放大 4 倍是 64，token 数不变。<\/p>\n<p>3.（简答）为什么位置信息必须显式注入 Transformer？ <strong>答案要点<\/strong>：查表得到的 token 向量不含顺序信息，没有位置编码时，模型无法区分不同词序。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n一层 = 注意力 + FFN，两段都带残差和归一化。\n<\/li><li>\n形状在层内基本保持 <code>[序列长度, 隐藏维度]<\/code>，FFN 中间会临时放大。\n<\/li><li>\n输出头把隐藏向量映射到词表，自回归逐个生成 token。\n<\/ul>", "ch05": "<div class=\"source-badge\">📖 出处：DeepSeek-V3 技术报告（arXiv:2412.19437）§2<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/deepseek-foundations/chapter/ch03\">第 3 章：注意力机制：一句话里谁该看谁<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/deepseek-foundations/chapter/ch04\">第 4 章：Transformer 一层一层拆<\/a><\/span><\/div><h1>第 5 章：DeepSeek-V3 的三块地基<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 3 章、第 4 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用一句话说清 MLA 省的是什么、怎么省。\n<\/li><li>\n解释 DeepSeekMoE 的“共享专家 + 细粒度路由专家”结构。\n<\/li><li>\n说出 MTP 在训练和推理里各有什么用。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>DeepSeek-V3 用 MLA 把 KV cache 压小，用 DeepSeekMoE 把参数量做大但每次只算一小部分，用 MTP 让每个 token 多学一个未来位置。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：先有 V3，才有 R1 和 V4（难度：基础）<\/h3>\n<p>DeepSeek-R1 不是从零训练的新模型，它是在 <strong>DeepSeek-V3-Base<\/strong> 上做强化学习得到的。DeepSeek-V4 则继承了 V3 的 DeepSeekMoE 和 MTP，只改注意力、残差和优化器。所以读 R1 和 V4 的论文，绕不开 V3 这三块地基：<\/p>\n<ul><li>\n<strong>MLA<\/strong>：多头潜在注意力，解决长文本的 KV cache 显存问题。\n<\/li><li>\n<strong>DeepSeekMoE<\/strong>：混合专家，解决“参数要多、计算要省”的矛盾。\n<\/li><li>\n<strong>MTP<\/strong>：多 token 预测，让训练信号更密，顺便给推理加速。\n<\/ul>\n<p>V3 本身是 671B 总参数、37B 激活参数的 MoE 模型，预训练用了 14.8T token。<\/p>\n<h3>概念 2：KV cache 是什么，为什么它贵（难度：进阶）<\/h3>\n<p>生成文本时，每生成一个新 token，都要拿它的 Query 和前面所有 token 的 Key、Value 做注意力。前面 token 的 K、V 不会变，可以缓存起来重复用，这份缓存叫 <strong>KV cache<\/strong>。<\/p>\n<p>问题在于它有多大。标准多头注意力（MHA）每个 token 的缓存是：<\/p>\n<div class=\"katex-block\">2 \\times n_h \\times d_h \\times \\text{字节数}<\/div>\n<p><span class=\"katex-inline\">n_h<\/span> 是头数，<span class=\"katex-inline\">d_h<\/span> 是每头维度，系数 2 表示 K 和 V 各一份。V3 有 128 个头、每头 128 维，用 FP16 存（每数 2 字节），每个 token 就是：<\/p>\n<div class=\"katex-block\">2 \\times 128 \\times 128 \\times 2 = 65{,}536\\ \\text{字节} \\approx 64\\ \\text{KB}<\/div>\n<p>一条 100 万 token 的上下文，光 KV cache 就是 64 GB。还没算模型权重和其他开销，单卡已经放不下。<\/p>\n<h3>概念 3：MLA 怎么把 KV cache 压小（难度：高难）<\/h3>\n<p>MLA 的思路不是“少存几个头”，而是“存的不是完整的 K 和 V，而是一个压缩后的潜向量”。<\/p>\n<p>标准做法里，每个 token 的 K、V 是所有头拼起来的高维矩阵。MLA 先把输入 <span class=\"katex-inline\">h<\/span> 压到一个低维潜向量 <span class=\"katex-inline\">c^{KV}<\/span>：<\/p>\n<div class=\"katex-block\">c^{KV} = h W^{DKV}<\/div>\n<p><span class=\"katex-inline\">W^{DKV}<\/span> 是降维矩阵，把几千维压到比如 512 维。需要 K、V 时，再从 <span class=\"katex-inline\">c^{KV}<\/span> 升维回去：<\/p>\n<div class=\"katex-block\">k = c^{KV} W^{UK},\\quad v = c^{KV} W^{UV}<\/div>\n<p>推理时缓存的是 <span class=\"katex-inline\">c^{KV}<\/span>，不是完整的 K、V 拼接。每个 token 只存 512 个数，而不是 128 个头各 128 维的两份。DeepSeek-V3 报告给出的结果是：相比标准 MHA，KV cache 减少约 93.3%，推理吞吐提升到 5.76 倍。<\/p>\n<p><strong>解耦 RoPE<\/strong> 是 MLA 的另一个关键。位置信息不能直接塞进低维潜向量再升维，因为旋转位置编码对每个头的位置敏感，压缩再还原会破坏它。MLA 额外保留一小段专门承载 RoPE 的 key（每个头 64 维），这部分不参与低秩压缩，和压缩后的内容 key 拼在一起使用。<\/p>\n<blockquote>类比：不把整本账本复印一份带走，只带一个压缩包，需要哪页再解压哪页。失效边界：压缩不是无损的，低秩表示会丢信息；MLA 靠训练让压缩后的表示保留对任务有用的部分。<\/blockquote>\n<h3>概念 4：DeepSeekMoE：专家很多，但每次只叫几个（难度：高难）<\/h3>\n<p>普通 Transformer 的 FFN 是全参激活：每个 token 都要过同一个 FFN，参数越多算得越久。<strong>混合专家<\/strong>（Mixture-of-Experts，MoE）把 FFN 拆成很多个“专家”，每个 token 只选其中几个。<\/p>\n<p>DeepSeekMoE 有两个和经典 MoE 不一样的设计：<\/p>\n<ol><li>\n<strong>细粒度专家<\/strong>：把一个大 FFN 切成很多小专家。V3 有 256 个路由专家，每个专家中间维度 2048；每个 token 只激活其中 8 个。专家多而小，组合更灵活。\n<\/li><li>\n<strong>共享专家<\/strong>：额外保留 1 个“永远激活”的共享专家，所有 token 都过它。它负责兜住通用知识，路由专家负责细分知识，减少专家之间的重复学习。\n<\/ol>\n<p>路由分数用 Sigmoid 算，取 top-k 个专家。这里有个副作用：如果不管，模型会总挑少数几个专家，其他专家“饿死”，叫<strong>专家塌缩<\/strong>。传统做法是加一个负载均衡辅助损失，但辅助损失会干扰语言建模目标。DeepSeek 用的是<strong>无辅助损失的负载均衡<\/strong>：给每个专家一个可学习的偏置，训练时根据负载调整偏置，偏置只影响“选谁”，不影响“权重多大”。<\/p>\n<p>V3 的配置是 1 个共享专家 + 256 个路由专家，激活 8 个；V4-Flash 改成 6 个激活，V4-Pro 384 个路由专家、激活 6 个。参数总量因此可以做得很大，但每个 token 的计算量只按激活参数算：V3 是 671B 总参数、37B 激活；V4-Pro 是 1.6T 总参数、49B 激活。<\/p>\n<blockquote>类比：一家大医院，有几百个专科医生，但每个病人只挂号 6 个最对口的，外加一个全科医生。失效边界：病人可以自己选科室，token 的路由是模型学出来的，选错专家就会丢信息。<\/blockquote>\n<h3>概念 5：MTP：让每个 token 多预测一个未来（难度：进阶）<\/h3>\n<p>标准语言模型在每个位置只预测下一个 token。<strong>多 token 预测<\/strong>（Multi-Token Prediction，MTP）在每个位置额外预测下下个 token：<\/p>\n<ul><li>\n主损失：预测 <span class=\"katex-inline\">t+1<\/span>。\n<\/li><li>\nMTP 损失：用 <span class=\"katex-inline\">t<\/span> 位置的隐藏状态，加上 <span class=\"katex-inline\">t+1<\/span> 的 token 嵌入，去预测 <span class=\"katex-inline\">t+2<\/span>。\n<\/ul>\n<p>V3 的 MTP 深度是 1，也就是多预测一个。好处有两个：训练时每个位置获得更密的信号，逼模型学更长的依赖；推理时可以把这个 MTP 头当<strong>投机解码<\/strong>的草稿模型，先猜几个 token，再用主模型验证，猜对就一次接受多个，加快生成。<\/p>\n<blockquote>类比：下棋时不仅想下一步，还顺带想下下步。失效边界：多预测的那一步不一定准，推理时仍要用主模型校验，不能无条件相信草稿。<\/blockquote>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n  subgraph V3[&quot;DeepSeek-V3 的一个 Transformer 层&quot;]\n    A[&quot;输入 h&quot;] --&gt; B[&quot;MLA 注意力&quot;]\n    B --&gt; C[&quot;残差 + RMSNorm&quot;]\n    C --&gt; D[&quot;DeepSeekMoE&quot;]\n    D --&gt; E[&quot;残差&quot;]\n    E --&gt; F[&quot;输出&quot;]\n  end\n  G[&quot;MTP 头&quot;] --&gt; H[&quot;预测 t+2&quot;]\n  F --&gt; G\n  I[&quot;KV cache 只存 c_KV + RoPE key&quot;] --&gt; B<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：MLA 改变的是注意力里“缓存什么”，MoE 改变的是 FFN 里“激活哪些专家”，MTP 是挂在主干旁边的额外预测头。三块互不替代。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：MLA 像把整本词典压成索引卡，MoE 像按问题叫专科医生，MTP 像下棋多想一步。\n<\/li><li>\n<strong>实例<\/strong>：一个 100 万 token 的请求，标准 MHA 每 token 64 KB，KV cache 约 64 GB；MLA 若压到每 token 约 4 KB，同样的上下文只要 4 GB 左右（具体数值随配置变化，这里只做量级演示）。这就是 V3 能长文本推理的基础。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为 MoE 是“每个 token 只用一个专家”<\/strong>——通常是 top-k，V3 激活 8 个，V4 激活 6 个，共享专家始终参与。\n<\/li><li>\n<strong>别以为 MLA 是量化或剪枝<\/strong>——它是改变 K/V 的表示方式，用低秩潜向量替代完整缓存，精度损失靠训练补偿。\n<\/li><li>\n<strong>别以为 MTP 只是为了推理加速<\/strong>——它首先是一个训练目标，主要收益在训练阶段；投机解码只是附带用途。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<p>1.（单选）MLA 推理时缓存的核心内容是什么？ A. 每个头的完整 K 和 V B. 低维潜向量和 RoPE key C. 只有 Query D. 整个隐藏层输出 <strong>答案：B<\/strong>；解析：MLA 缓存压缩后的 <span class=\"katex-inline\">c^{KV}<\/span> 和承载位置的 RoPE key，不缓存完整 K/V。<\/p>\n<p>2.（填空）DeepSeekMoE 中始终激活、负责通用知识的专家叫 ______。 <strong>答案：共享专家<\/strong>；解析：共享专家对所有 token 生效，路由专家按 top-k 选择。<\/p>\n<p>3.（简答）MTP 的损失在训练时预测的是哪个位置？ <strong>答案要点<\/strong>：在位置 <span class=\"katex-inline\">t<\/span> 额外预测 <span class=\"katex-inline\">t+2<\/span>，用 <span class=\"katex-inline\">t<\/span> 的隐藏状态和 <span class=\"katex-inline\">t+1<\/span> 的 token 嵌入作为输入。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\nMLA 用低秩潜向量压缩 KV cache，并用解耦 RoPE 保留位置信息。\n<\/li><li>\nDeepSeekMoE = 共享专家 + 细粒度路由专家 + 无辅助损失负载均衡。\n<\/li><li>\nMTP 在训练时多预测一个未来 token，推理时可做投机解码草稿。\n<\/ul>", "c01": "<div class=\"source-badge\">📖 出处：本课程整理 · 基础数学<\/div><h1>向量<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1 章、第 3 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>向量是一串有顺序的数字，在模型里用来表示一个 token、一个词或一个中间状态。<\/p>\n<h2>为什么重要<\/h2>\n<p>模型的所有输入、输出、中间结果都是向量。不懂向量，后面的矩阵乘法、注意力、KV cache 都无从谈起。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[&quot;token 编号 5021&quot;] --&gt; B[&quot;embedding 表第 5021 行&quot;]\n  B --&gt; C[&quot;向量 [0.2, -0.5, 1.1, 0.03]&quot;]\n  C --&gt; D[&quot;进入 Transformer 层&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>一个向量可以写成 <span class=\"katex-inline\">\\mathbf{x} = [x_1, x_2, \\ldots, x_d]<\/span>，<span class=\"katex-inline\">d<\/span> 是维度。模型里常见的隐藏维度是 4096、5120、7168，V3 是 7168。每个位置的数字没有独立的人类含义，它们共同表示一个 token 在当前层的状态。<\/p>\n<p>两个向量可以做点积：<\/p>\n<div class=\"katex-block\">\\mathbf{a}\\cdot\\mathbf{b} = \\sum_i a_i b_i<\/div>\n<p>点积衡量方向相似度，是注意力分数的来源。向量还可以逐元素相加，残差连接就是这种运算。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n向量不一定是空间箭头，高维向量无法直观画出来。\n<\/li><li>\n单个维度一般不对应可解释的概念，别试图把某一维翻译成“猫”。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch01<\/td><td>文字变成数字<\/td><td>token 查表得到词向量<\/td><\/tr><tr><td>ch03<\/td><td>注意力<\/td><td>Q/K/V 都是向量，点积算相似度<\/td><\/tr><tr><td>ch05<\/td><td>MLA<\/td><td>潜向量 <span class=\"katex-inline\">c^{KV}<\/span> 是压缩后的缓存<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：无\n<\/li><li>\n后续：矩阵乘法、softmax、注意力\n<\/ul>", "c02": "<div class=\"source-badge\">📖 出处：本课程整理 · 基础数学<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/deepseek-foundations/concept/c01\">向量<\/a><\/span><\/div><h1>矩阵乘法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1 章、第 4 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>矩阵乘法是“左矩阵每一行与右矩阵每一列做点积”，结果是新矩阵；在模型里它负责把一批向量整体变换。<\/p>\n<h2>为什么重要<\/h2>\n<p>Transformer 里几乎所有参数都是矩阵：Q/K/V 投影、输出投影、FFN 的升降维、MoE 专家的门控。不会矩阵乘法，就看不懂参数量的来源。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[&quot;输入 X: [n, d]&quot;] --&gt; B[&quot;权重 W: [d, m]&quot;]\n  B --&gt; C[&quot;输出 Y = XW: [n, m]&quot;]\n  C --&gt; D[&quot;每个 token 从 d 维变成 m 维&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>设 <span class=\"katex-inline\">X<\/span> 是 <span class=\"katex-inline\">n\\times d<\/span> 的矩阵（<span class=\"katex-inline\">n<\/span> 个 token，每个 <span class=\"katex-inline\">d<\/span> 维），<span class=\"katex-inline\">W<\/span> 是 <span class=\"katex-inline\">d\\times m<\/span>。乘积 <span class=\"katex-inline\">Y=XW<\/span> 是 <span class=\"katex-inline\">n\\times m<\/span>：<\/p>\n<div class=\"katex-block\">Y_{ij} = \\sum_{k=1}^{d} X_{ik}W_{kj}<\/div>\n<p>每一行是一个 token，每一列是一个输出特征。参数量就是 <span class=\"katex-inline\">d\\times m<\/span>（忽略偏置）。一个 7168 维到 18432 维的 FFN 升维矩阵，参数量是 <span class=\"katex-inline\">7168\\times 18432 \\approx 1.32<\/span> 亿。<\/p>\n<p>矩阵乘法的计算量也是 <span class=\"katex-inline\">n\\times d\\times m<\/span> 次乘加。MoE 之所以省算力，是因为每个 token 只乘少数几个专家的矩阵，而不是全部。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n不是对应位置相乘，那叫逐元素乘法。\n<\/li><li>\n维度不匹配就不能乘，左矩阵列数必须等于右矩阵行数。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch01<\/td><td>基础运算<\/td><td>矩阵乘法按行加权求和<\/td><\/tr><tr><td>ch04<\/td><td>Transformer<\/td><td>投影、FFN 都是矩阵乘法<\/td><\/tr><tr><td>ch05<\/td><td>MoE<\/td><td>每个 token 只走 top-k 专家的矩阵<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：向量\n<\/li><li>\n后续：注意力、FFN、MoE\n<\/ul>", "c03": "<div class=\"source-badge\">📖 出处：本课程整理 · 基础数学<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/deepseek-foundations/concept/c01\">向量<\/a><\/span><\/div><h1>softmax<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1 章、第 3 章、第 5 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>softmax 把一组任意实数分数转成一组非负、总和为 1 的权重。<\/p>\n<h2>为什么重要<\/h2>\n<p>注意力权重、MoE 路由权重、下一个 token 的概率分布，全都靠 softmax。它决定“资源怎么分配”。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[&quot;分数 [2, 1, 0]&quot;] --&gt; B[&quot;取指数 [7.39, 2.72, 1]&quot;]\n  B --&gt; C[&quot;求和 11.11&quot;]\n  C --&gt; D[&quot;归一化 [0.665, 0.245, 0.090]&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<div class=\"katex-block\">\\text{softmax}(z_i)=\\frac{e^{z_i}}{\\sum_j e^{z_j}}<\/div>\n<p>三个性质：<\/p>\n<ol><li>\n输出为正，因为指数恒正。\n<\/li><li>\n总和为 1，因为分母是所有指数之和。\n<\/li><li>\n保序：原来大的分数，输出仍然大。\n<\/ol>\n<p>温度参数可以调节“尖锐程度”。除以温度 <span class=\"katex-inline\">T<\/span> 后再 softmax，<span class=\"katex-inline\">T<\/span> 小则分布更集中，<span class=\"katex-inline\">T<\/span> 大则更平缓。语言模型采样时常用温度控制随机性。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\nsoftmax 不改变排序，它只改变数值比例。\n<\/li><li>\nsoftmax 输出高不代表“正确”，它只是当前模型认为的概率。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch01<\/td><td>基础<\/td><td>分数变比例<\/td><\/tr><tr><td>ch03<\/td><td>注意力<\/td><td>分数矩阵按行 softmax 成权重<\/td><\/tr><tr><td>ch05<\/td><td>MoE<\/td><td>路由分数决定专家权重<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：向量\n<\/li><li>\n后续：注意力、MoE 路由、采样\n<\/ul>", "c04": "<div class=\"source-badge\">📖 出处：本课程整理 · 训练基础<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/deepseek-foundations/concept/c02\">矩阵乘法<\/a><\/span><\/div><h1>参数与损失<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 2 章、第 5 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>参数是模型里可训练的数字，损失是衡量模型输出与正确答案差距的标量。<\/p>\n<h2>为什么重要<\/h2>\n<p>训练的全部动作，就是围绕“调参数让损失变小”。模型规模、激活参数、预训练 token 数，最终都要落到这两个词上。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[&quot;参数 θ&quot;] --&gt; B[&quot;预测 ŷ&quot;]\n  B --&gt; C[&quot;损失 L（ŷ, y）&quot;]\n  C --&gt; D[&quot;梯度 ∂L/∂θ&quot;]\n  D --&gt; E[&quot;更新 θ&quot;]\n  E --&gt; A<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>参数包括矩阵元素、偏置、归一化的缩放因子等。V3 有 671B 参数，V4-Pro 有 1.6T，V4.1-Flash 主干 552B 加 196B Engram。<\/p>\n<p>损失常见两类：<\/p>\n<ul><li>\n回归：平方误差 <span class=\"katex-inline\">L=(\\hat{y}-y)^2<\/span>。\n<\/li><li>\n分类/语言模型：交叉熵 <span class=\"katex-inline\">L=-\\log p(y)<\/span>，正确答案概率越低，损失越大。\n<\/ul>\n<p>训练不是一次算完，而是把数据分成 batch，反复前向、求损失、反向传播、更新。一个 epoch 表示把训练集过一遍。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n损失小不等于模型能力强，可能只是记住了训练集。\n<\/li><li>\n参数多不等于每次计算都用上，MoE 只有激活参数参与当前 token 的计算。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch02<\/td><td>训练基础<\/td><td>参数、损失、梯度构成训练循环<\/td><\/tr><tr><td>ch05<\/td><td>V3 规模<\/td><td>671B 总参数，37B 激活<\/td><\/tr><tr><td>ch07<\/td><td>R1 训练<\/td><td>奖励信号代替部分监督损失<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：向量、矩阵乘法\n<\/li><li>\n后续：梯度下降、强化学习\n<\/ul>", "c05": "<div class=\"source-badge\">📖 出处：本课程整理 · 训练基础<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/deepseek-foundations/concept/c04\">参数与损失<\/a><\/span><\/div><h1>梯度下降<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 2 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>梯度下降是沿着损失下降最快的方向，按学习率大小一步步调整参数的方法。<\/p>\n<h2>为什么重要<\/h2>\n<p>所有预训练、微调、强化学习，底层都用某种梯度更新。理解它，才能理解“学习率”“训练不稳定”“梯度爆炸”这些论文里的常见词。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[&quot;当前参数 w&quot;] --&gt; B[&quot;算损失 L&quot;]\n  B --&gt; C[&quot;求梯度 ∂L/∂w&quot;]\n  C --&gt; D[&quot;w ← w - η·梯度&quot;]\n  D --&gt; A<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>更新公式：<\/p>\n<div class=\"katex-block\">w \\leftarrow w-\\eta\\frac{\\partial L}{\\partial w}<\/div>\n<p><span class=\"katex-inline\">\\eta<\/span> 是学习率。梯度为正，说明参数增大时损失增大，所以要减小参数；梯度为负则相反。<\/p>\n<p>实际训练用<strong>随机梯度下降<\/strong>（SGD）的变体：每次只取一小批数据（batch）估梯度，噪声大但算得快。现代大模型多用 AdamW、Muon 这类自适应优化器，它们会给不同参数不同的步长。<\/p>\n<p>常见问题：<\/p>\n<ul><li>\n梯度爆炸：梯度数值过大，参数一步飞出去。用梯度裁剪。\n<\/li><li>\n梯度消失：梯度接近 0，前面的层学不动。用残差、归一化缓解。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n学习率不是固定越好，通常要预热再衰减。\n<\/li><li>\n梯度不是误差本身，它是损失对参数的变化率。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch02<\/td><td>训练基础<\/td><td>更新规则与学习率<\/td><\/tr><tr><td>ch05<\/td><td>V3<\/td><td>预训练用 AdamW<\/td><\/tr><tr><td>ch08<\/td><td>V4<\/td><td>改用 Muon 优化器<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：参数与损失\n<\/li><li>\n后续：反向传播、优化器、Muon\n<\/ul>", "c06": "<div class=\"source-badge\">📖 出处：本课程整理 · 注意力<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/deepseek-foundations/concept/c02\">矩阵乘法<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/deepseek-foundations/concept/c03\">softmax<\/a><\/span><\/div><h1>注意力<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3 章、第 4 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>注意力是让每个 token 根据与其他 token 的相似度，从它们那里按权重收集信息的机制。<\/p>\n<h2>为什么重要<\/h2>\n<p>Transformer 的核心就是注意力。DeepSeek 三代架构的差异，一大半在“怎么算注意力、怎么存缓存”。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[&quot;当前 token 的 Q&quot;] --&gt; B[&quot;与所有 K 点积&quot;]\n  B --&gt; C[&quot;softmax 权重&quot;]\n  C --&gt; D[&quot;加权求和所有 V&quot;]\n  D --&gt; E[&quot;当前 token 的新表示&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>对第 <span class=\"katex-inline\">i<\/span> 个 token：<\/p>\n<div class=\"katex-block\">o_i=\\sum_j \\alpha_{ij}v_j,\\quad \\alpha_{ij}=\\text{softmax}\\left(\\frac{q_i\\cdot k_j}{\\sqrt{d_k}}\\right)<\/div>\n<p>注意力解决了“词与词之间怎么交换信息”。没有它，每个 token 只能独立变换，无法处理指代、语序、长距离依赖。<\/p>\n<p>变体：<\/p>\n<ul><li>\n<strong>因果注意力<\/strong>：只能看左边，用于生成模型。\n<\/li><li>\n<strong>双向注意力<\/strong>：能看两边，用于编码器（如 BERT）。\n<\/li><li>\n<strong>滑动窗口注意力<\/strong>（SWA）：只看附近固定窗口，省计算，V4.1 大量使用。\n<\/li><li>\n<strong>压缩注意力<\/strong>：把远处的 K/V 压成少量表示，V4 的 CSA/HCA 属于这一类。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n注意力权重不是“人类可读的解释”。\n<\/li><li>\n注意力不是只能有一个头，多头可以并行捕捉不同关系。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch03<\/td><td>基础<\/td><td>Q/K/V 与加权求和<\/td><\/tr><tr><td>ch04<\/td><td>Transformer<\/td><td>每层都有一段注意力<\/td><\/tr><tr><td>ch05<\/td><td>MLA<\/td><td>缓存压缩后的潜向量<\/td><\/tr><tr><td>ch08<\/td><td>V4<\/td><td>CSA/HCA 压缩远端上下文<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：向量、矩阵乘法、softmax\n<\/li><li>\n后续：Q/K/V、多头注意力、MLA、CSA\n<\/ul>", "c07": "<div class=\"source-badge\">📖 出处：本课程整理 · 注意力<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/deepseek-foundations/concept/c06\">注意力<\/a><\/span><\/div><h1>Q / K / V<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3 章、第 5 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>Query 是“我想找什么”，Key 是“我有什么标签”，Value 是“我实际给出的内容”，三者都由同一个输入向量经不同矩阵投影得到。<\/p>\n<h2>为什么重要<\/h2>\n<p>所有注意力变体，包括 MLA、CSA、HCA，改的都是 Q/K/V 的计算与缓存方式。分不清三者，就无法理解“压缩 KV cache”到底压了什么。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  X[&quot;输入 x&quot;] --&gt; Q[&quot;Q = xW_Q：查询&quot;]\n  X --&gt; K[&quot;K = xW_K：标签&quot;]\n  X --&gt; V[&quot;V = xW_V：内容&quot;]\n  Q --&gt; S[&quot;匹配分数&quot;]\n  K --&gt; S\n  S --&gt; O[&quot;按分数混合 V&quot;]\n  V --&gt; O<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<ul><li>\n<span class=\"katex-inline\">q=xW_Q<\/span>：当前 token 用来“检索”的向量。\n<\/li><li>\n<span class=\"katex-inline\">k=xW_K<\/span>：每个 token 对外展示的“标签”。\n<\/li><li>\n<span class=\"katex-inline\">v=xW_V<\/span>：每个 token 被选中后贡献的“内容”。\n<\/ul>\n<p>输出只混合 V，Q 和 K 只参与打分。因此：<\/p>\n<ul><li>\n压缩 KV cache，压的是 K 和 V 的存储，不压 Q。\n<\/li><li>\nMLA 缓存 <span class=\"katex-inline\">c^{KV}<\/span>，需要时再升维出 K、V；Q 仍可每次现算。\n<\/li><li>\nCSA/HCA 压缩的是远端 token 的 K/V 表示。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\nQ、K、V 不是三份不同的输入，而是同一份输入的三次线性投影。\n<\/li><li>\nV 的维度不一定和 Q/K 相同，但通常设计成相同以便拼接。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch03<\/td><td>注意力<\/td><td>Q/K/V 的分工与计算<\/td><\/tr><tr><td>ch05<\/td><td>MLA<\/td><td>缓存的是压缩后的 K/V 来源<\/td><\/tr><tr><td>ch08<\/td><td>V4.1<\/td><td>CSA2 复用 KV，跨层共享<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：注意力\n<\/li><li>\n后续：多头注意力、MLA、CSA/HCA\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（Q / K / V）<\/summary><div class=\"depth-body\"><h2>🔬 Q/K/V 的第一性原理推导：从“加权平均”到注意力<\/h2>\n<h3>先退到你会的东西：加权平均<\/h3>\n<p>假设你要给三个同学打分，权重分别是 <span class=\"katex-inline\">0.5, 0.3, 0.2<\/span>，分数是 <span class=\"katex-inline\">90, 80, 70<\/span>。总分是多少？<\/p>\n<div class=\"katex-block\">0.5\\times 90 + 0.3\\times 80 + 0.2\\times 70 = 45 + 24 + 14 = 83<\/div>\n<p>这就是<strong>加权平均<\/strong>：每个数先乘自己的权重，再全部相加。权重加起来等于 1。注意力输出本质上就是这个动作，只不过“分数”换成了每个 token 的 Value 向量，“权重”由 Query 和 Key 的相似度决定。<\/p>\n<h3>第一步：怎么衡量两个向量“像不像”<\/h3>\n<p>两个向量逐位相乘再相加，叫<strong>点积<\/strong>。拿两个 2 维向量试：<\/p>\n<div class=\"katex-block\">\\mathbf{a}=[1,0],\\quad \\mathbf{b}=[1,1]<\/div>\n<div class=\"katex-block\">\\mathbf{a}\\cdot\\mathbf{b}=1\\times 1 + 0\\times 1 = 1<\/div>\n<p>再拿 <span class=\"katex-inline\">\\mathbf{c}=[0,1]<\/span>：<\/p>\n<div class=\"katex-block\">\\mathbf{a}\\cdot\\mathbf{c}=1\\times 0 + 0\\times 1 = 0<\/div>\n<p>点积为 1 说明 <span class=\"katex-inline\">\\mathbf{a}<\/span> 和 <span class=\"katex-inline\">\\mathbf{b}<\/span> 方向接近；点积为 0 说明 <span class=\"katex-inline\">\\mathbf{a}<\/span> 和 <span class=\"katex-inline\">\\mathbf{c}<\/span> 垂直，关系远。点积越大，越“像”。<\/p>\n<h3>第二步：为什么分数要除以 <span class=\"katex-inline\">\\sqrt{d_k}<\/span><\/h3>\n<p>如果向量是 128 维，每一维都是 1，点积就是 128。指数 <span class=\"katex-inline\">e^{128}<\/span> 是一个天文数字，softmax 会变成“一个权重 1，其他全 0”。这样梯度几乎没有，训练学不动。<\/p>\n<p>除以 <span class=\"katex-inline\">\\sqrt{d_k}<\/span> 相当于把分数拉回个位数。<span class=\"katex-inline\">d_k=128<\/span> 时 <span class=\"katex-inline\">\\sqrt{128}\\approx 11.3<\/span>，128 分的点积变成 11.3，softmax 还能保留梯度。<\/p>\n<h3>第三步：Q、K、V 为什么要三套矩阵<\/h3>\n<p>如果直接拿原始向量 <span class=\"katex-inline\">x_i<\/span> 和 <span class=\"katex-inline\">x_j<\/span> 做点积，只能衡量“原始表示像不像”。但模型需要不同的“提问方式”：<\/p>\n<ul><li>\n找主语时，Query 应该问“谁在做动作”。\n<\/li><li>\n找修饰语时，Query 应该问“谁在描述名词”。\n<\/ul>\n<p>所以让输入分别乘三个可学习矩阵：<\/p>\n<div class=\"katex-block\">\\mathbf{q}_i=x_iW_Q,\\quad \\mathbf{k}_j=x_jW_K,\\quad \\mathbf{v}_j=x_jW_V<\/div>\n<p><span class=\"katex-inline\">W_Q<\/span>、<span class=\"katex-inline\">W_K<\/span>、<span class=\"katex-inline\">W_V<\/span> 是训练出来的。Q 和 K 负责“提问与匹配”，V 负责“真正被取走的内容”。分开的好处是：匹配标准和内容可以解耦，模型可以学“按 A 标准找，但取 B 内容”。<\/p>\n<h3>第四步：把分数变成权重<\/h3>\n<p>对第 <span class=\"katex-inline\">i<\/span> 个 token，拿它的 <span class=\"katex-inline\">q_i<\/span> 和所有 <span class=\"katex-inline\">k_j<\/span> 点积，得到分数 <span class=\"katex-inline\">s_{ij}<\/span>。然后 softmax：<\/p>\n<div class=\"katex-block\">\\alpha_{ij}=\\frac{e^{s_{ij}}}{\\sum_l e^{s_{il}}}<\/div>\n<p>分母是把当前 token 对所有 token 的指数分数全部加起来，保证权重总和为 1。<\/p>\n<h3>第五步：数值算例，自己复核一遍<\/h3>\n<p>三个 token，2 维：<\/p>\n<ul><li>\n<span class=\"katex-inline\">q_1=[2,0]<\/span>\n<\/li><li>\n<span class=\"katex-inline\">k_1=[1,0]<\/span>，<span class=\"katex-inline\">k_2=[0,1]<\/span>，<span class=\"katex-inline\">k_3=[1,1]<\/span>\n<\/li><li>\n<span class=\"katex-inline\">v_1=[10,0]<\/span>，<span class=\"katex-inline\">v_2=[0,10]<\/span>，<span class=\"katex-inline\">v_3=[4,4]<\/span>\n<\/ul>\n<p>点积（先不缩放，<span class=\"katex-inline\">d_k=2<\/span> 时缩放因子 <span class=\"katex-inline\">\\sqrt{2}\\approx1.414<\/span>，这里为演示省略）：<\/p>\n<ul><li>\n<span class=\"katex-inline\">q_1\\cdot k_1=2<\/span>\n<\/li><li>\n<span class=\"katex-inline\">q_1\\cdot k_2=0<\/span>\n<\/li><li>\n<span class=\"katex-inline\">q_1\\cdot k_3=2<\/span>\n<\/ul>\n<p>取指数：<span class=\"katex-inline\">e^2\\approx7.389<\/span>，<span class=\"katex-inline\">e^0=1<\/span>，<span class=\"katex-inline\">e^2\\approx7.389<\/span>，总和 <span class=\"katex-inline\">15.778<\/span>。<\/p>\n<p>权重：<span class=\"katex-inline\">[0.468, 0.063, 0.468]<\/span>。<\/p>\n<p>输出：<\/p>\n<div class=\"katex-block\">0.468[10,0]+0.063[0,10]+0.468[4,4]=[4.68+1.87,\\ 0.63+1.87]=[6.55,\\ 2.50]<\/div>\n<p>检查：权重和 <span class=\"katex-inline\">0.468+0.063+0.468=0.999<\/span>，输出两个分量都来自三个 V 的加权，没有凭空多出数字。<\/p>\n<h3>第六步：为什么要多头<\/h3>\n<p>一套 Q/K/V 只能学一种匹配标准。多头让模型并行学多套，每套有自己的 <span class=\"katex-inline\">W_Q/W_K/W_V<\/span>。比如 128 头、每头 128 维，各头独立算注意力，拼起来再乘 <span class=\"katex-inline\">W_O<\/span>。不同头可以关注相邻词、句法结构、指代关系等不同模式。<\/p>\n<h3>差生检查<\/h3>\n<ul><li>\n符号 <span class=\"katex-inline\">\\sum_l<\/span> 表示“对所有 l 求和”，第一次出现已解释。\n<\/li><li>\n点积、softmax 都在前面章节出现过，这里直接复用。\n<\/li><li>\n每一步的数值都能用计算器复核。\n<\/li><li>\n结论给了“为什么这样设计”：分开 Q/K/V 是为了解耦匹配与内容，多头是为了多套匹配标准。\n<\/ul>\n<h3>前置与后续<\/h3>\n<ul><li>\n前置：向量、矩阵乘法、softmax（第 1 章）\n<\/li><li>\n后续：多头注意力、因果掩码（第 3 章）、MLA/CSA（第 5、8 章）\n<\/ul><\/div><\/details>", "c08": "<div class=\"source-badge\">📖 出处：本课程整理 · Transformer<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/deepseek-foundations/concept/c02\">矩阵乘法<\/a><\/span><\/div><h1>残差连接<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 4 章、第 7 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>残差连接把子层的输入直接加到子层的输出上，让信息和梯度有一条直通的路径。<\/p>\n<h2>为什么重要<\/h2>\n<p>没有残差，几十层的 Transformer 根本训不动。DeepSeek-V4 的 mHC 就是在残差连接上做文章，把它从“简单相加”升级成“流形约束的矩阵混合”。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[&quot;输入 x&quot;] --&gt; B[&quot;子层 Layer（x）&quot;]\n  A --&gt; C[&quot;直通路径&quot;]\n  B --&gt; D[&quot;相加&quot;]\n  C --&gt; D\n  D --&gt; E[&quot;输出 x + Layer（x）&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<div class=\"katex-block\">y=x+\\text{Layer}(x)<\/div>\n<p>两个作用：<\/p>\n<ol><li>\n信息保真：子层可以学到接近 0 的输出，此时 <span class=\"katex-inline\">y\\approx x<\/span>，深层不会比浅层更差。\n<\/li><li>\n梯度直通：反向传播时，梯度可以通过加法直接流回输入，不需要穿过整个子层。\n<\/ol>\n<p>形状要求：<span class=\"katex-inline\">x<\/span> 与 <span class=\"katex-inline\">\\text{Layer}(x)<\/span> 必须同形状。若维度变化，需要额外的投影把 <span class=\"katex-inline\">x<\/span> 映射到目标维度。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n残差不是“把输入复制一份”，而是逐元素相加。\n<\/li><li>\n残差不是只在最后加一次，每个子层都有自己的残差。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch04<\/td><td>Transformer<\/td><td>注意力和 FFN 各带一次残差<\/td><\/tr><tr><td>ch07<\/td><td>V4<\/td><td>mHC 用矩阵混合替代简单相加<\/td><\/tr><tr><td>ch09<\/td><td>V4.1<\/td><td>20 个 CED 块继承 mHC<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：向量、矩阵乘法\n<\/li><li>\n后续：RMSNorm、mHC\n<\/ul>", "c09": "<div class=\"source-badge\">📖 出处：本课程整理 · Transformer<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/deepseek-foundations/concept/c01\">向量<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/deepseek-foundations/concept/c08\">残差连接<\/a><\/span><\/div><h1>RMSNorm<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 4 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>RMSNorm 用向量的均方根做缩放，不减去均值，比 LayerNorm 少一次统计计算。<\/p>\n<h2>为什么重要<\/h2>\n<p>DeepSeek 全系使用 RMSNorm。它是理解“Pre-Norm 结构为什么能训深”和“训练稳定性”的基础。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[&quot;输入 x&quot;] --&gt; B[&quot;算均方根 rms&quot;]\n  B --&gt; C[&quot;x / rms&quot;]\n  C --&gt; D[&quot;乘以可学习缩放 g&quot;]\n  D --&gt; E[&quot;输出&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<div class=\"katex-block\">\\text{RMSNorm}(x)=\\frac{x}{\\sqrt{\\frac{1}{d}\\sum_i x_i^2+\\epsilon}}\\odot g<\/div>\n<p>与 LayerNorm 的差别：LayerNorm 先减均值再除以标准差，RMSNorm 只除以均方根。少了减均值这一步，计算更快，且在 Transformer 上效果差别很小。<\/p>\n<p><span class=\"katex-inline\">\\epsilon<\/span> 是防止除零的小常数，通常取 <span class=\"katex-inline\">10^{-6}<\/span> 量级。<span class=\"katex-inline\">g<\/span> 是每个维度一个可学习参数，让模型自己决定缩放多少。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\nRMSNorm 不是“没有归一化”，它仍然缩放，只是统计量不同。\n<\/li><li>\n归一化不改变方向，只改变长度，因此不能替代激活函数。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch04<\/td><td>Transformer<\/td><td>每个子层前做 RMSNorm<\/td><\/tr><tr><td>ch07<\/td><td>V4<\/td><td>保留 RMSNorm，新增 mHC<\/td><\/tr><tr><td>ch09<\/td><td>V4.1<\/td><td>结构与 V4 一致<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：向量\n<\/li><li>\n后续：Transformer 层、训练稳定性\n<\/ul>", "c10": "<div class=\"source-badge\">📖 出处：本课程整理 · Transformer<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/deepseek-foundations/concept/c02\">矩阵乘法<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/deepseek-foundations/concept/c09\">RMSNorm<\/a><\/span><\/div><h1>前馈网络（FFN）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 4 章、第 5 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>FFN 是对每个 token 独立做“升维—激活—降维”的两层线性变换，负责存储和变换知识。<\/p>\n<h2>为什么重要<\/h2>\n<p>FFN 通常占模型参数的绝大部分。DeepSeekMoE 就是把 FFN 拆成多个专家，从而在不增加单 token 计算量的前提下扩大参数。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[&quot;x: 8 维&quot;] --&gt; B[&quot;W1 升到 32 维&quot;]\n  B --&gt; C[&quot;激活函数&quot;]\n  C --&gt; D[&quot;W2 降回 8 维&quot;]\n  D --&gt; E[&quot;输出&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<div class=\"katex-block\">\\text{FFN}(x)=W_2\\,\\sigma(W_1x)<\/div>\n<p>中间维度通常是隐藏维度的 4 倍。激活函数早期用 ReLU，现代大模型多用 SwiGLU：<\/p>\n<div class=\"katex-block\">\\text{SwiGLU}(x)=\\text{Swish}(xW_1)\\odot(xW_3)<\/div>\n<p>它有两个升维矩阵，参数量比普通 FFN 多，但效果更好。V3 的专家中间维度是 2048，隐藏维度 7168。<\/p>\n<p>MoE 把 FFN 换成多个专家后，每个 token 只走 top-k 个专家，计算量按激活专家算，参数量按全部专家算。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\nFFN 不是“可有可无的附加层”，它承担了大部分知识存储。\n<\/li><li>\nMoE 不是把注意力也拆成专家，通常只拆 FFN。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch04<\/td><td>Transformer<\/td><td>FFN 升维再降维<\/td><\/tr><tr><td>ch05<\/td><td>DeepSeekMoE<\/td><td>FFN 拆成共享 + 路由专家<\/td><\/tr><tr><td>ch07<\/td><td>V4<\/td><td>专家数 256，激活 6<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：矩阵乘法、RMSNorm\n<\/li><li>\n后续：DeepSeekMoE、负载均衡\n<\/ul>", "c11": "<div class=\"source-badge\">📖 出处：本课程整理 · 生成<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/deepseek-foundations/concept/c03\">softmax<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/deepseek-foundations/concept/c04\">参数与损失<\/a><\/span><\/div><h1>自回归生成<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 4 章、第 6 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>自回归生成是每次根据已有 token 预测下一个 token，把它接回输入，再预测下一个，循环直到结束。<\/p>\n<h2>为什么重要<\/h2>\n<p>所有对话模型、推理模型都用这种方式输出。理解它，才能理解为什么推理分“预填充”和“解码”两个阶段，为什么 KV cache 重要。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">sequenceDiagram\n  participant U as 输入\n  participant M as 模型\n  participant O as 输出\n  U-&gt;&gt;M: 今天天气\n  M-&gt;&gt;O: 怎\n  O-&gt;&gt;U: 今天天气怎\n  U-&gt;&gt;M: 今天天气怎\n  M-&gt;&gt;O: 么\n  O-&gt;&gt;U: 今天天气怎么\n  U-&gt;&gt;M: 今天天气怎么\n  M-&gt;&gt;O: 样<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>两个阶段：<\/p>\n<ol><li>\n<strong>预填充<\/strong>（prefill）：把整段输入一次性送进模型，并行计算所有位置的 K/V，建立 KV cache。计算密集，GPU 利用率高。\n<\/li><li>\n<strong>解码<\/strong>（decode）：每次只生成一个 token，读已有 KV cache，算新 token 的 Q 和输出。显存带宽密集，延迟受限于搬运速度。\n<\/ol>\n<p>生成长度越长，解码阶段占比越高。投机解码、MTP、DSpark 都是在解码阶段做加速。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n训练时不是自回归串行，而是整句并行、用因果掩码防偷看。\n<\/li><li>\n生成不是每次重算全部 token，KV cache 让历史只算一次。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch04<\/td><td>Transformer<\/td><td>输出头产生下一个 token 分布<\/td><\/tr><tr><td>ch06<\/td><td>R1<\/td><td>长思维链让解码 token 数暴涨<\/td><\/tr><tr><td>ch09<\/td><td>V4.1<\/td><td>DSpark 加速解码<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：softmax、Transformer 层\n<\/li><li>\n后续：KV cache、投机解码\n<\/ul>", "c12": "<div class=\"source-badge\">📖 出处：DeepSeek-V3 技术报告 §2.1<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/deepseek-foundations/concept/c07\">Q / K / V<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/deepseek-foundations/concept/c16\">KV cache<\/a><\/span><\/div><h1>MLA（多头潜在注意力）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 5 章、第 10 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>MLA 把每个 token 的 K/V 压缩成一个低维潜向量再缓存，需要时升维还原，并用解耦 RoPE 保留位置信息。<\/p>\n<h2>为什么重要<\/h2>\n<p>MLA 是 DeepSeek-V2 提出、V3 继承的关键技术。它让长上下文推理的 KV cache 从“每 token 几十 KB”降到“几 KB”，是 DeepSeek 能把上下文拉到 128K 甚至 1M 的基础。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  H[&quot;输入 h&quot;] --&gt; D[&quot;降维 W_DKV&quot;]\n  D --&gt; C[&quot;潜向量 c_KV（缓存）&quot;]\n  C --&gt; UK[&quot;升维 W_UK → K&quot;]\n  C --&gt; UV[&quot;升维 W_UV → V&quot;]\n  H --&gt; R[&quot;RoPE 分支 k_R（缓存）&quot;]\n  UK --&gt; A[&quot;注意力计算&quot;]\n  UV --&gt; A\n  R --&gt; A<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>标准 MHA 缓存每个 token 的全部 K、V，大小是 <span class=\"katex-inline\">2n_hd_h<\/span> 个数。MLA 缓存：<\/p>\n<ul><li>\n内容潜向量 <span class=\"katex-inline\">c^{KV}<\/span>，维度 <span class=\"katex-inline\">d_c<\/span>，V3 取 512。\n<\/li><li>\n解耦 RoPE 的 key <span class=\"katex-inline\">k^R<\/span>，每头 64 维。\n<\/ul>\n<p>需要 K、V 时：<\/p>\n<div class=\"katex-block\">k^C=c^{KV}W^{UK},\\quad v^C=c^{KV}W^{UV}<\/div>\n<p>K 由内容部分 <span class=\"katex-inline\">k^C<\/span> 和位置部分 <span class=\"katex-inline\">k^R<\/span> 拼接。V 只用内容部分。<\/p>\n<p>为什么解耦：RoPE 是旋转操作，对每个头的位置敏感。如果把位置信息压进低维潜向量，升维后旋转关系会被破坏。解耦后，位置信息走单独的小通道，压缩通道只存内容。<\/p>\n<p>代价：MLA 的计算图比 MHA 复杂，训练时需要同时学降维和升维矩阵；但推理时缓存大幅减少，吞吐提升。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\nMLA 不是简单地把 K/V 量化到低比特，它是改变表示维度。\n<\/li><li>\n解耦 RoPE 不是“不用位置编码”，而是把位置编码单独保留。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch05<\/td><td>V3 地基<\/td><td>KV cache 减少约 93.3%<\/td><\/tr><tr><td>ch08<\/td><td>V4<\/td><td>被 CSA/HCA 取代，但低秩压缩思想保留<\/td><\/tr><tr><td>ch10<\/td><td>架构对比<\/td><td>MLA 是“压缩缓存”路线的起点<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：Q/K/V、KV cache\n<\/li><li>\n后续：CSA、HCA、CSA2\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（MLA（多头潜在注意力））<\/summary><div class=\"depth-body\"><h2>🔬 MLA 的第一性原理推导：把 KV cache 从 64 KB 压到几 KB<\/h2>\n<h3>第一步：先算清楚 KV cache 到底多大<\/h3>\n<p>一个 token 在标准多头注意力里，需要缓存 K 和 V。每个头有 <span class=\"katex-inline\">d_h<\/span> 维，有 <span class=\"katex-inline\">n_h<\/span> 个头，每个数用 2 字节（FP16）存：<\/p>\n<div class=\"katex-block\">\\text{每 token 字节}=2\\times n_h\\times d_h\\times 2<\/div>\n<p>V3 的配置：<span class=\"katex-inline\">n_h=128<\/span>，<span class=\"katex-inline\">d_h=128<\/span>。<\/p>\n<div class
