=\"katex-block\">2\\times128\\times128\\times2=65{,}536\\ \\text{字节}=64\\ \\text{KB}<\/div>\n<p>100 万 token：<\/p>\n<div class=\"katex-block\">65{,}536\\times1{,}000{,}000=65{,}536{,}000{,}000\\ \\text{字节}\\approx65.5\\ \\text{GB}<\/div>\n<p>这就是为什么长上下文模型拼命压 KV cache。<\/p>\n<h3>第二步：能不能只存一个“压缩包”<\/h3>\n<p>K 和 V 虽然维度高，但它们由同一个输入 <span class=\"katex-inline\">h<\/span> 投影出来，信息有冗余。假设存在一个低维表示 <span class=\"katex-inline\">c<\/span>，能通过两个矩阵还原出 K 和 V：<\/p>\n<div class=\"katex-block\">k=cW_{UK},\\quad v=cW_{UV}<\/div>\n<p>那么缓存 <span class=\"katex-inline\">c<\/span> 就够了。<span class=\"katex-inline\">c<\/span> 的维度 <span class=\"katex-inline\">d_c<\/span> 远小于 <span class=\"katex-inline\">2n_hd_h<\/span> 时，缓存大幅下降。<\/p>\n<p>V3 取 <span class=\"katex-inline\">d_c=512<\/span>。每个 token 的内容潜向量是 512 个数，FP16 下 1024 字节，而不是 65,536 字节。<\/p>\n<h3>第三步：怎么得到这个压缩包<\/h3>\n<p>用一个降维矩阵 <span class=\"katex-inline\">W_{DKV}<\/span>：<\/p>\n<div class=\"katex-block\">c^{KV}=hW_{DKV}<\/div>\n<p><span class=\"katex-inline\">h<\/span> 是当前 token 的隐藏向量（7168 维），<span class=\"katex-inline\">W_{DKV}<\/span> 把它压到 512 维。需要 K、V 时再升维：<\/p>\n<div class=\"katex-block\">k^C=c^{KV}W_{UK},\\quad v^C=c^{KV}W_{UV}<\/div>\n<p>注意这里的 <span class=\"katex-inline\">W_{UK}<\/span>、<span class=\"katex-inline\">W_{UV}<\/span> 是“上投影”，和标准注意力的 <span class=\"katex-inline\">W_K<\/span>、<span class=\"katex-inline\">W_V<\/span> 作用类似，但输入是压缩后的 <span class=\"katex-inline\">c^{KV}<\/span>。<\/p>\n<h3>第四步：位置信息为什么不能一起压<\/h3>\n<p>RoPE 的做法是把向量按位置旋转一个角度。旋转依赖每个头的具体维度。如果把位置信息压进 <span class=\"katex-inline\">c^{KV}<\/span> 再升维，升维矩阵会把旋转关系搅乱，模型就分不清位置。<\/p>\n<p>MLA 的解法是<strong>解耦<\/strong>：内容走压缩通道，位置走单独的小通道。每个头保留 64 维的 <span class=\"katex-inline\">k^R<\/span>，只承载 RoPE，不参与低秩压缩。最终 K 是内容部分和位置部分拼接：<\/p>\n<div class=\"katex-block\">k=[k^C;\\ k^R]<\/div>\n<p>缓存里存 <span class=\"katex-inline\">c^{KV}<\/span> 和 <span class=\"katex-inline\">k^R<\/span> 两份，仍然远小于完整 K/V。<\/p>\n<h3>第五步：数值感受一下<\/h3>\n<p>假设 <span class=\"katex-inline\">d_c=512<\/span>，每头 RoPE 64 维、128 头。缓存每 token：<\/p>\n<ul><li>\n内容潜向量：512 个数\n<\/li><li>\nRoPE key：<span class=\"katex-inline\">64\\times128=8192<\/span> 个数（有些实现会共享，具体随配置）\n<\/ul>\n<p>合计约 8704 个数，FP16 下约 17 KB。相比 64 KB，压到约四分之一。V3 报告给出的 93.3% 降幅对应更优的配置与实现。<\/p>\n<h3>第六步：为什么不直接量化<\/h3>\n<p>量化是把每个数从 16 位压到 8 位或 4 位，精度损失直接作用在 K/V 上，长上下文容易崩。MLA 是改变表示结构：用低秩假设去掉冗余，再让模型在训练中学会“压完后仍然够用”。两者可以叠加，但解决的不是同一个问题。<\/p>\n<h3>差生检查<\/h3>\n<ul><li>\n字节数计算逐步展开，乘法和单位换算都能复核。\n<\/li><li>\n<span class=\"katex-inline\">d_c<\/span>、<span class=\"katex-inline\">n_h<\/span>、<span class=\"katex-inline\">d_h<\/span> 第一次出现都给了含义。\n<\/li><li>\n解释了“为什么解耦 RoPE”这个设计动机，而不只是说“MLA 用了 RoPE”。\n<\/li><li>\n数值示例标明是量级演示，避免把示例当成 V3 的精确配置。\n<\/ul>\n<h3>前置与后续<\/h3>\n<ul><li>\n前置：Q/K/V、KV cache、矩阵乘法（第 1、3、5 章）\n<\/li><li>\n后续：CSA/HCA 的压缩思路（第 8 章）、CSA2 跨层复用（第 9 章）\n<\/ul><\/div><\/details>", "c13": "<div class=\"source-badge\">📖 出处：DeepSeek-V3 技术报告 §2.2<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/deepseek-foundations/concept/c03\">softmax<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/deepseek-foundations/concept/c10\">前馈网络（FFN）<\/a><\/span><\/div><h1>DeepSeekMoE<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 5 章、第 7 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>DeepSeekMoE 把 FFN 拆成大量细粒度路由专家和一个共享专家，每个 token 只激活少数专家。<\/p>\n<h2>为什么重要<\/h2>\n<p>它让模型总参数可以做到 671B、1.6T，而单 token 计算只按 37B、49B 的激活参数算。没有 MoE，DeepSeek 的规模故事不成立。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  X[&quot;token 向量&quot;] --&gt; S[&quot;共享专家（总激活）&quot;]\n  X --&gt; R[&quot;路由打分&quot;]\n  R --&gt; E1[&quot;专家 1&quot;]\n  R --&gt; E2[&quot;专家 2&quot;]\n  R --&gt; E3[&quot;……专家 256&quot;]\n  E1 --&gt; C[&quot;加权合并&quot;]\n  E2 --&gt; C\n  E3 --&gt; C\n  S --&gt; C\n  C --&gt; O[&quot;输出&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>V3 配置：1 个共享专家 + 256 个路由专家，每个 token 激活 8 个路由专家。V4-Flash 激活 6 个，V4-Pro 384 个路由专家、激活 6 个。<\/p>\n<p>路由分数：<\/p>\n<div class=\"katex-block\">s_i=\\text{Sigmoid}(x\\cdot e_i)<\/div>\n<p>取 top-k 后归一化，得到每个被选中专家的权重。共享专家不参与路由，所有 token 都过它。<\/p>\n<p>为什么细粒度：一个大专家只能整体激活或整体不激活；拆成很多小专家后，组合空间更大，不同 token 可以调用不同的知识片段。<\/p>\n<p>为什么共享专家：路由专家会被不同 token 轮流使用，容易重复学习通用知识。共享专家专门兜住通用部分，让路由专家更专注细分。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\nMoE 不是“每个 token 只用一个专家”，是 top-k 加共享专家。\n<\/li><li>\n专家不是按学科划分的，训练不会给每个专家打上“数学专家”“语法专家”的标签。\n<\/li><li>\n总参数大不等于计算量大，只有激活参数参与当前 token 的计算。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch05<\/td><td>V3 地基<\/td><td>1 共享 + 256 路由，激活 8<\/td><\/tr><tr><td>ch07<\/td><td>V4<\/td><td>256 路由，激活 6<\/td><\/tr><tr><td>ch09<\/td><td>V4.1<\/td><td>256 路由，激活 6，专家中间维度 2048<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：FFN、softmax\n<\/li><li>\n后续：负载均衡、专家塌缩\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（DeepSeekMoE）<\/summary><div class=\"depth-body\"><h2>🔬 DeepSeekMoE 的第一性原理推导：为什么“专家多、激活少”能同时省算力和涨参数<\/h2>\n<h3>第一步：先看清普通 FFN 的成本<\/h3>\n<p>一个 FFN 做两次矩阵乘法：<\/p>\n<div class=\"katex-block\">y=W_2\\sigma(W_1x)<\/div>\n<p>设输入 <span class=\"katex-inline\">d=7168<\/span>，中间维度 <span class=\"katex-inline\">m=18432<\/span>。参数量：<\/p>\n<div class=\"katex-block\">d\\times m+m\\times d=2\\times7168\\times18432\\approx2.64\\ \\text{亿}<\/div>\n<p>每个 token 都要过这 2.64 亿个参数，计算量也是这个量级。想让模型记住更多知识，最直接的办法是把 <span class=\"katex-inline\">m<\/span> 加大，但每个 token 的计算量跟着涨。<\/p>\n<h3>第二步：把一个大 FFN 切成很多小专家<\/h3>\n<p>把中间维度 18432 切成 256 份，每份 2048 维，每份就是一个“专家”。每个专家的参数量：<\/p>\n<div class=\"katex-block\">2\\times7168\\times2048\\approx2935\\ \\text{万}<\/div>\n<p>256 个专家总参数约 75 亿，比原来大 28 倍。但如果每个 token 只激活其中 8 个，计算量是：<\/p>\n<div class=\"katex-block\">8\\times2935\\ \\text{万}\\approx2.35\\ \\text{亿}<\/div>\n<p>和原来一个 FFN 的 2.64 亿差不多。参数量涨了 28 倍，单 token 计算却没涨。这就是 MoE 的核心账本。<\/p>\n<h3>第三步：路由怎么选专家<\/h3>\n<p>每个专家有一个可学习的向量 <span class=\"katex-inline\">e_i<\/span>。token 向量 <span class=\"katex-inline\">x<\/span> 和 <span class=\"katex-inline\">e_i<\/span> 做内积，再取 Sigmoid：<\/p>\n<div class=\"katex-block\">s_i=\\text{Sigmoid}(x\\cdot e_i)<\/div>\n<p>Sigmoid 把分数压到 0 到 1 之间。取分数最高的 <span class=\"katex-inline\">k<\/span> 个专家（V3 的 <span class=\"katex-inline\">k=8<\/span>），再把这 <span class=\"katex-inline\">k<\/span> 个分数归一化，作为加权系数。每个被选中专家算自己的 FFN，输出按系数加权相加。<\/p>\n<h3>第四步：为什么还要一个共享专家<\/h3>\n<p>路由专家会被不同 token 轮流使用。如果所有 token 都需要“基本语法”这类通用知识，每个被选中的专家都得学一遍，参数浪费。<\/p>\n<p>加一个<strong>共享专家<\/strong>，所有 token 都过它，专门学通用知识。路由专家就不用重复学通用部分，可以专注细分模式。V3 是 1 个共享 + 256 个路由。<\/p>\n<h3>第五步：专家为什么会“饿死”<\/h3>\n<p>训练初期，某些专家的 <span class=\"katex-inline\">e_i<\/span> 碰巧和很多 token 的内积大，路由把大量 token 送给它们。这些专家梯度多、学得快，变得更强；其他专家拿不到 token，梯度接近 0，永远学不出来。这叫<strong>专家塌缩<\/strong>。<\/p>\n<p>传统解法是加辅助损失：<\/p>\n<div class=\"katex-block\">L_{\\text{aux}}=\\alpha\\sum_i f_i p_i<\/div>\n<p><span class=\"katex-inline\">f_i<\/span> 是分给专家 <span class=\"katex-inline\">i<\/span> 的 token 比例，<span class=\"katex-inline\">p_i<\/span> 是路由概率均值。这个损失惩罚“负载集中”。但它和语言建模目标打架，<span class=\"katex-inline\">\\alpha<\/span> 难调。<\/p>\n<p>DeepSeek 的解法：给每个专家一个偏置 <span class=\"katex-inline\">b_i<\/span>，路由分数改成 <span class=\"katex-inline\">s_i+b_i<\/span>。训练时统计负载，负载高的专家调低 <span class=\"katex-inline\">b_i<\/span>，负载低的调高 <span class=\"katex-inline\">b_i<\/span>。偏置只影响“选不选”，不影响选中后的加权系数。这样不用往主损失里加项，也能把负载拉平。<\/p>\n<h3>第六步：一次完整的玩具计算<\/h3>\n<p>3 个专家，<span class=\"katex-inline\">k=1<\/span>，token 与专家的分数：<\/p>\n<ul><li>\n<span class=\"katex-inline\">s_1=0.9<\/span>，<span class=\"katex-inline\">s_2=0.5<\/span>，<span class=\"katex-inline\">s_3=0.1<\/span>\n<\/ul>\n<p>选 top-1 就是专家 1。输出就是专家 1 的 FFN 输出，权重 1。若 <span class=\"katex-inline\">k=2<\/span>，选专家 1 和 2，归一化权重：<\/p>\n<div class=\"katex-block\">w_1=\\frac{0.9}{0.9+0.5}=0.643,\\quad w_2=\\frac{0.5}{1.4}=0.357<\/div>\n<p>输出 <span class=\"katex-inline\">=0.643\\cdot\\text{FFN}_1(x)+0.357\\cdot\\text{FFN}_2(x)<\/span>。检查：两个权重相加为 1。<\/p>\n<h3>差生检查<\/h3>\n<ul><li>\n参数量与计算量分开算，明确“总参数”和“激活参数”不是一回事。\n<\/li><li>\n路由、Sigmoid、归一化都给了公式和数字。\n<\/li><li>\n解释了“共享专家”和“负载均衡”的设计动机，并给了反例（专家塌缩）。\n<\/li><li>\n玩具计算可以手算复核。\n<\/ul>\n<h3>前置与后续<\/h3>\n<ul><li>\n前置：FFN、矩阵乘法、softmax（第 1、4 章）\n<\/li><li>\n后续：V3/V4 的专家配置（第 5、7 章）、负载均衡偏置（第 5 章）\n<\/ul><\/div><\/details>", "c14": "<div class=\"source-badge\">📖 出处：DeepSeek-V3 技术报告 §2.3<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/deepseek-foundations/concept/c11\">自回归生成<\/a><\/span><\/div><h1>MTP（多 token 预测）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 5 章、第 8 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>MTP 在训练时让每个位置额外预测未来第 2 个 token，增加训练信号密度，也可用于推理时的投机解码。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是 DeepSeek-V3 的三大地基之一，V4 继续保留。理解 MTP，才能理解“为什么训练 token 数不算多，模型却学得快”。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  H[&quot;位置 t 的隐藏状态&quot;] --&gt; M[&quot;主头：预测 t+1&quot;]\n  H --&gt; T[&quot;MTP 头&quot;]\n  E[&quot;t+1 的 token 嵌入&quot;] --&gt; T\n  T --&gt; N[&quot;预测 t+2&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>标准语言模型在每个位置只监督下一个 token。MTP 增加一条支路：<\/p>\n<ol><li>\n取位置 <span class=\"katex-inline\">t<\/span> 的隐藏状态 <span class=\"katex-inline\">h_t<\/span>。\n<\/li><li>\n把位置 <span class=\"katex-inline\">t+1<\/span> 的 token 嵌入 <span class=\"katex-inline\">e_{t+1}<\/span> 投影后与 <span class=\"katex-inline\">h_t<\/span> 结合。\n<\/li><li>\n用结合后的表示预测 <span class=\"katex-inline\">t+2<\/span>。\n<\/ol>\n<p>损失是主损失加 MTP 损失的加权和。V3 的 MTP 深度为 1。<\/p>\n<p>推理时，MTP 头可以当草稿模型：先猜出若干个 token，再让主模型并行验证，接受匹配的前缀。这叫投机解码。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\nMTP 不是“推理时一次输出两个 token”，输出仍由主模型验证。\n<\/li><li>\nMTP 的主要收益在训练，不在推理；推理加速是附带用途。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch05<\/td><td>V3<\/td><td>MTP 深度 1，训练信号更密<\/td><\/tr><tr><td>ch07<\/td><td>V4<\/td><td>保留 MTP，用于投机解码<\/td><\/tr><tr><td>ch09<\/td><td>V4.1<\/td><td>用 DSpark 替代 MTP 做推理加速<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：自回归生成、softmax\n<\/li><li>\n后续：投机解码、DSpark\n<\/ul>", "c15": "<div class=\"source-badge\">📖 出处：DeepSeek-V3 技术报告 §2.2<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/deepseek-foundations/concept/c03\">softmax<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/deepseek-foundations/concept/c13\">DeepSeekMoE<\/a><\/span><\/div><h1>负载均衡<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 5 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>负载均衡是防止 MoE 路由器总把 token 送给少数专家、导致其他专家“饿死”的训练技巧。<\/p>\n<h2>为什么重要<\/h2>\n<p>MoE 训练最常见的失败模式就是专家塌缩。DeepSeek 的无辅助损失方案是 V3 论文的亮点之一，也是后续 V4 继承的关键设计。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[&quot;一批 token&quot;] --&gt; B[&quot;路由打分&quot;]\n  B --&gt; C{&quot;各专家负载均衡?&quot;}\n  C --&gt;|否| D[&quot;调高冷门专家偏置&quot;]\n  D --&gt; B\n  C --&gt;|是| E[&quot;正常训练&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>问题：路由分数由 token 和专家向量的内积决定，训练初期某些专家可能碰巧得分高，越来越多 token 涌向它们。结果少数专家过载，多数专家得不到梯度。<\/p>\n<p>传统方案：加辅助损失，惩罚负载不均。但辅助损失和语言建模目标冲突，权重难调，还会损害模型效果。<\/p>\n<p>DeepSeek 方案：给每个专家一个可学习偏置 <span class=\"katex-inline\">b_i<\/span>，路由分数变成 <span class=\"katex-inline\">s_i+b_i<\/span>。训练时统计每个专家的负载，负载高的调低偏置，负载低的调高偏置。偏置只影响“选不选”，不影响被选中后的权重。<\/p>\n<div class=\"katex-block\">s_i=\\text{Sigmoid}(x\\cdot e_i)+b_i<\/div>\n<p>这样负载均衡通过调整选择偏好实现，不往主损失里塞额外项。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n负载均衡不是“平均分配所有 token”，而是防止极端失衡。\n<\/li><li>\n无辅助损失不是“完全不管均衡”，而是用偏置调节代替损失项。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch05<\/td><td>V3<\/td><td>无辅助损失负载均衡<\/td><\/tr><tr><td>ch07<\/td><td>V4<\/td><td>继承该方案<\/td><\/tr><tr><td>ch09<\/td><td>V4.1<\/td><td>继承该方案<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：DeepSeekMoE、softmax\n<\/li><li>\n后续：训练稳定性\n<\/ul>", "c16": "<div class=\"source-badge\">📖 出处：DeepSeek-V3 技术报告 §2.1<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/deepseek-foundations/concept/c07\">Q / K / V<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/deepseek-foundations/concept/c11\">自回归生成<\/a><\/span><\/div><h1>KV cache<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 5 章、第 8 章、第 10 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>KV cache 是推理时缓存历史 token 的 Key 和 Value，避免每生成一个新 token 都重算全部历史。<\/p>\n<h2>为什么重要<\/h2>\n<p>长上下文推理的显存瓶颈几乎全在 KV cache。DeepSeek 三代架构的注意力改动，本质上都在想办法把这份缓存压小。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  P[&quot;预填充：整段输入&quot;] --&gt; C[&quot;写入 KV cache&quot;]\n  C --&gt; D[&quot;解码第 1 个 token&quot;]\n  D --&gt; E[&quot;追加新 KV&quot;]\n  E --&gt; F[&quot;解码第 2 个 token&quot;]\n  F --&gt; G[&quot;……&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>标准 MHA 每 token 缓存：<\/p>\n<div class=\"katex-block\">2\\times n_h\\times d_h\\times \\text{字节数}<\/div>\n<p>V3 的 128 头、128 维、FP16：每 token 约 64 KB。100 万 token 就是 64 GB。<\/p>\n<p>压缩路线：<\/p>\n<ul><li>\n<strong>MLA<\/strong>：缓存低维潜向量 + RoPE key，V3 报告减少约 93.3%。\n<\/li><li>\n<strong>CSA<\/strong>：把每 4 个 token 压成一条 KV 记录（V4）。\n<\/li><li>\n<strong>HCA<\/strong>：每 128 个 token 压成一条（V4）。\n<\/li><li>\n<strong>CSA2<\/strong>：跨层复用 KV，进一步减少重复存储（V4.1）。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\nKV cache 不是模型参数，它是推理时的临时状态。\n<\/li><li>\n量化 KV cache 能省显存，但会损失精度；MLA/CSA 是改变表示结构，不是单纯量化。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch05<\/td><td>MLA<\/td><td>压缩潜向量替代完整 K/V<\/td><\/tr><tr><td>ch08<\/td><td>V4<\/td><td>CSA 4:1、HCA 128:1<\/td><\/tr><tr><td>ch09<\/td><td>V4.1<\/td><td>CSA2 跨层复用<\/td><\/tr><tr><td>ch10<\/td><td>架构对比<\/td><td>所有路线都在压同一份缓存<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：Q/K/V、自回归生成\n<\/li><li>\n后续：MLA、CSA、HCA、CSA2\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：向量、矩阵、softmax<\/strong><br>阅读：<a href=\"#/book/deepseek-foundations/chapter/ch01\">第 1 章：数字怎么变成“意思”：向量、矩阵与 softmax<\/a><br>检查点：完成 ch01 自测，能手算矩阵乘向量与 softmax<\/li><li class='path-step' id='path-02'><strong>步骤 02：参数、损失、梯度<\/strong><br>阅读：<a href=\"#/book/deepseek-foundations/chapter/ch02\">第 2 章：模型怎么学会：参数、损失、梯度<\/a><br>检查点：完成 ch02 自测，能算一次梯度更新<\/li><li class='path-step' id='path-03'><strong>步骤 03：注意力机制<\/strong><br>阅读：<a href=\"#/book/deepseek-foundations/chapter/ch03\">第 3 章：注意力机制：一句话里谁该看谁<\/a><br>检查点：能手算 3 个 token 的注意力权重<\/li><li class='path-step' id='path-04'><strong>步骤 04：Transformer 一层楼<\/strong><br>阅读：<a href=\"#/book/deepseek-foundations/chapter/ch04\">第 4 章：Transformer 一层一层拆<\/a><br>检查点：能画出一次前向的 shape 变化<\/li><li class='path-step' id='path-05'><strong>步骤 05：V3 的三块地基<\/strong><br>阅读：<a href=\"#/book/deepseek-foundations/chapter/ch05\">第 5 章：DeepSeek-V3 的三块地基<\/a><br>检查点：能说出 MLA、MoE、MTP 各解决什么问题<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：数字怎么变成“意思”：向量、矩阵与 softmax<\/h2><div class='quiz-item' data-qid='ch01-q01' data-type='single' data-concept='c02' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> 一个 2×3 矩阵乘一个 3 维向量，结果是什么形状？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> 2×3 矩阵<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> 3 维向量<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> 2 维向量<\/label><label class='quiz-opt'><input type='radio' \/h1><div class='quiz-item' data-qid='ch04-q10' data-type='single' data-concept='c08' data-chapter='ch04'><p class='quiz-q'><b>Q1.<\/b> 一个 Transformer 层里，残差连接加在哪两处？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q10' value='0'> 只在注意力后<\/label><label class='quiz-opt'><input type='radio' name='ch04-q10' value='1'> 只在 FFN 后<\/label><label class='quiz-opt'><input type='radio' name='ch04-q10' value='2'> 注意力和 FFN 后各一次<\/label><label class='quiz-opt'><input type='radio' name='ch04-q10' value='3'> 每层最后只加一次<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch04-q11' data-type='single' data-concept='c10' data-chapter='ch04'><p class='quiz-q'><b>Q2.<\/b> 输入形状 [6, 16] 经过 4 倍 FFN 后，中间层形状是什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q11' value='0'> [6, 16]<\/label><label class='quiz-opt'><input type='radio' name='ch04-q11' value='1'> [6, 64]<\/label><label class='quiz-opt'><input type='radio' name='ch04-q11' value='2'> [24, 16]<\/label><label class='quiz-opt'><input type='radio' name='ch04-q11' value='3'> [6, 4]<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch04-q12' data-type='single' data-concept='c11' data-chapter='ch04'><p class='quiz-q'><b>Q3.<\/b> 为什么位置信息必须显式注入 Transformer？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q12' value='0'> 让模型知道词序<\/label><label class='quiz-opt'><input type='radio' name='ch04-q12' value='1'> 减少参数量<\/label><label class='quiz-opt'><input type='radio' name='ch04-q12' value='2'> 加速训练<\/label><label class='quiz-opt'><input type='radio' name='ch04-q12' value='3'> 替代注意力<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch05__": "<h1>测验：第 5 章：DeepSeek-V3 的三块地基<\/h1><div class='quiz-item' data-qid='ch05-q13' data-type='single' data-concept='c12' data-chapter='ch05'><p class='quiz-q'><b>Q1.<\/b> MLA 推理时缓存的核心内容是什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch05-q13' value='0'> 每个头的完整 K 和 V<\/label><label class='quiz-opt'><input type='radio' name='ch05-q13' value='1'> 低维潜向量和 RoPE key<\/label><label class='quiz-opt'><input type='radio' name='ch05-q13' value='2'> 只有 Query<\/label><label class='quiz-opt'><input type='radio' name='ch05-q13' value='3'> 整个隐藏层输出<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch05-q14' data-type='single' data-concept='c13' data-chapter='ch05'><p class='quiz-q'><b>Q2.<\/b> DeepSeekMoE 中共享专家的作用是什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch05-q14' value='0'> 只处理英文<\/label><label class='quiz-opt'><input type='radio' name='ch05-q14' value='1'> 始终激活，兜住通用知识<\/label><label class='quiz-opt'><input type='radio' name='ch05-q14' value='2'> 只处理数学题<\/label><label class='quiz-opt'><input type='radio' name='ch05-q14' value='3'> 替代注意力<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch05-q15' data-type='single' data-concept='c14' data-chapter='ch05'><p class='quiz-q'><b>Q3.<\/b> MTP 在训练时额外预测哪个位置？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch05-q15' value='0'> 只预测 t+1<\/label><label class='quiz-opt'><input type='radio' name='ch05-q15' value='1'> 额外预测 t+2<\/label><label class='quiz-opt'><input type='radio' name='ch05-q15' value='2'> 预测前一个 token<\/label><label class='quiz-opt'><input type='radio' name='ch05-q15' value='3'> 随机位置<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='向量'>向量 — 一串有顺序的数字，长度叫维度。 <span class=glossary-ref>（第 1 章：数字怎么变成“意思”：向量、矩阵与 softmax）<\/span><\/li><li data-term='矩阵乘法'>矩阵乘法 — 左矩阵每行与右矩阵每列做点积，得到新矩阵。 <span class=glossary-ref>（第 1 章：数字怎么变成“意思”：向量、矩阵与 softmax）<\/span><\/li><li data-term='softmax'>softmax — 把分数转成非负、总和为 1 的权重。 <span class=glossary-ref>（第 1 章：数字怎么变成“意思”：向量、矩阵与 softmax）<\/span><\/li><li data-term='token'>token — 模型处理文本的基本单位，可以是一个字、一个词或词的一部分。 <span class=glossary-ref>（第 1 章：数字怎么变成“意思”：向量、矩阵与 softmax）<\/span><\/li><li data-term='embedding'>embedding — 把 token 编号映射成固定长度向量的表。 <span class=glossary-ref>（第 1 章：数字怎么变成“意思”：向量、矩阵与 softmax）<\/span><\/li><li data-term='参数'>参数 — 模型里可训练的数值，比如矩阵元素。 <span class=glossary-ref>（第 2 章：模型怎么学会：参数、损失、梯度）<\/span><\/li><li data-term='损失'>损失 — 衡量预测与正确答案差距的标量。 <span class=glossary-ref>（第 2 章：模型怎么学会：参数、损失、梯度）<\/span><\/li><li data-term='梯度'>梯度 — 损失对参数的变化率，指示更新方向。 <span class=glossary-ref>（第 2 章：模型怎么学会：参数、损失、梯度）<\/span><\/li><li data-term='学习率'>学习率 — 每次参数更新走多大的一步。 <span class=glossary-ref>（第 2 章：模型怎么学会：参数、损失、梯度）<\/span><\/li><li data-term='过拟合'>过拟合 — 训练集上损失很小，换数据就变差。 <span class=glossary-ref>（第 2 章：模型怎么学会：参数、损失、梯度）<\/span><\/li><li data-term='注意力'>注意力 — 按 token 间相似度加权收集信息的机制。 <span class=glossary-ref>（第 3 章：注意力机制：一句话里谁该看谁）<\/span><\/li><li data-term='q / k / v'>Q / K / V — 查询、键、值，同一输入的三次投影。 <span class=glossary-ref>（第 3 章：注意力机制：一句话里谁该看谁）<\/span><\/li><li data-term='多头注意力'>多头注意力 — 并行多套 Q/K/V，捕捉不同关系。 <span class=glossary-ref>（第 3 章：注意力机制：一句话里谁该看谁）<\/span><\/li><li data-term='因果掩码'>因果掩码 — 禁止每个 token 看到未来 token。 <span class=glossary-ref>（第 3 章：注意力机制：一句话里谁该看谁）<\/span><\/li><li data-term='残差连接'>残差连接 — 把子层输入加到子层输出。 <span class=glossary-ref>（第 4 章：Transformer 一层一层拆）<\/span><\/li><li data-term='rmsnorm'>RMSNorm — 用均方根缩放向量的归一化。 <span class=glossary-ref>（第 4 章：Transformer 一层一层拆）<\/span><\/li><li data-term='ffn'>FFN — 对每个 token 独立做升维-激活-降维。 <span class=glossary-ref>（第 4 章：Transformer 一层一层拆）<\/span><\/li><li data-term='自回归生成'>自回归生成 — 逐个预测下一个 token 并接回输入。 <span class=glossary-ref>（第 4 章：Transformer 一层一层拆）<\/span><\/li><li data-term='mla'>MLA — 用低维潜向量压缩 KV cache 的注意力。 <span class=glossary-ref>（第 5 章：DeepSeek-V3 的三块地基）<\/span><\/li><li data-term='deepseekmoe'>DeepSeekMoE — 共享专家 + 细粒度路由专家的混合专家结构。 <span class=glossary-ref>（第 5 章：DeepSeek-V3 的三块地基）<\/span><\/li><li data-term='mtp'>MTP — 训练时额外预测未来第 2 个 token。 <span class=glossary-ref>（第 5 章：DeepSeek-V3 的三块地基）<\/span><\/li><li data-term='kv cache'>KV cache — 推理时缓存历史 token 的 K/V。 <span class=glossary-ref>（第 5 章：DeepSeek-V3 的三块地基）<\/span><\/li><li data-term='专家塌缩'>专家塌缩 — MoE 路由总选少数专家，其他专家学不到东西。 <span class=glossary-ref>（第 5 章：DeepSeek-V3 的三块地基）<\/span><\/li><\/ul>", "__diagnosis__": "<h1>🩺 诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：从数字到结构<\/h2>\n<p>学任何一个模型结构，按“输入是什么数字 → 做哪种运算 → 形状怎么变 → 解决什么问题”四步走。不要先背名字。<\/p>\n<h2>框架：三件套理解法<\/h2>\n<p>每个抽象概念至少配一个类比、一个图示、一个可手算的实例；缺一个就容易停在“好像懂了”。<\/p>\n<h2>决策规则<\/h2>\n<ul><li>\n看到公式先问“每个符号是什么”，再问“为什么这样设计”。\n<\/li><li>\n看到架构先问“它省的是计算、显存还是带宽”。\n<\/li><li>\n看到数字先问“单位是什么、和谁比”。\n<\/ul>\n<h2>反模式<\/h2>\n<ul><li>\n只背缩写，不追动机。\n<\/li><li>\n把“注意力权重”当成模型解释。\n<\/li><li>\n把总参数和激活参数混为一谈。\n<\/ul>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式与规则<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>矩阵乘向量<\/td><td>每行与向量做点积<\/td><\/tr><tr><td>softmax<\/td><td><span class=\"katex-inline\">e^{z_i}/\\sum_j e^{z_j}<\/span><\/td><\/tr><tr><td>梯度下降<\/td><td><span class=\"katex-inline\">w\\leftarrow w-\\eta\\partial L/\\partial w<\/span><\/td><\/tr><tr><td>注意力分数<\/td><td><span class=\"katex-inline\">q\\cdot k/\\sqrt{d_k}<\/span><\/td><\/tr><tr><td>注意力输出<\/td><td><span class=\"katex-inline\">\\sum_j\\alpha_{ij}v_j<\/span><\/td><\/tr><tr><td>残差<\/td><td><span class=\"katex-inline\">y=x+\\mathrm{Layer}(x)<\/span><\/td><\/tr><tr><td>RMSNorm<\/td><td><span class=\"katex-inline\">x/\\sqrt{\\mathrm{mean}(x^2)+\\epsilon}\\odot g<\/span><\/td><\/tr><\/tbody><\/table>\n<h2>关键数字<\/h2>\n<table><thead><tr><th>项目<\/th><th>数值<\/th><\/tr><\/thead><tbody><tr><td>V3 总参数 / 激活<\/td><td>671B / 37B<\/td><\/tr><tr><td>V3 层数 / 头数<\/td><td>61 / 128<\/td><\/tr><tr><td>V3 路由专家 / 激活<\/td><td>256 / 8<\/td><\/tr><tr><td>V3 预训练 token<\/td><td>14.8T<\/td><\/tr><tr><td>V3 上下文<\/td><td>128K<\/td><\/tr><\/tbody><\/table>"}, "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "🕸 知识图谱", "href": "#/graph"}, {"label": "🩺 诊断测试", "href": "#/diagnosis"}, {"label": "章节", "children": [{"label": "第 1 章：数字怎么变成“意思”：向量、矩阵与 softmax", "href": "#/chapter/ch01"}, {"label": "第 2 章：模型怎么学会：参数、损失、梯度", "href": "#/chapter/ch02"}, {"label": "第 3 章：注意力机制：一句话里谁该看谁", "href": "#/chapter/ch03"}, {"label": "第 4 章：Transformer 一层一层拆", "href": "#/chapter/ch04"}, {"label": "第 5 章：DeepSeek-V3 的三块地基", "href": "#/chapter/ch05"}]}, {"label": "概念", "children": [{"label": "向量", "href": "#/concept/c01"}, {"label": "矩阵乘法", "href": "#/concept/c02"}, {"label": "softmax", "href": "#/concept/c03"}, {"label": "参数与损失", "href": "#/concept/c04"}, {"label": "梯度下降", "href": "#/concept/c05"}, {"label":
