FT，稳定格式。", "chapterId": "ch07"}, {"term": "拒绝采样", "def": "生成多个回答，只保留达标样本做 SFT。", "chapterId": "ch07"}, {"term": "知识蒸馏", "def": "让学生模型学习教师模型的输出。", "chapterId": "ch07"}, {"term": "奖励黑客", "def": "模型钻奖励漏洞拿高分但没真完成任务。", "chapterId": "ch07"}, {"term": "过程奖励模型（PRM）", "def": "给推理每一步打分的奖励模型，R1 尝试后未作主方案。", "chapterId": "ch07"}, {"term": "MCTS", "def": "蒙特卡洛树搜索，R1 尝试后未作主方案。", "chapterId": "ch07"}, {"term": "CSA", "def": "每 4 个 token 压 1 条再做 top-k 稀疏的注意力。", "chapterId": "ch08"}, {"term": "HCA", "def": "每 128 个 token 压 1 条再做稠密注意力的注意力。", "chapterId": "ch08"}, {"term": "mHC", "def": "用双随机矩阵混合多条残差流的超连接。", "chapterId": "ch08"}, {"term": "Muon", "def": "对梯度矩阵做正交化的优化器。", "chapterId": "ch08"}, {"term": "Sinkhorn-Knopp", "def": "交替行列归一化，把矩阵投影到双随机流形。", "chapterId": "ch08"}, {"term": "双随机矩阵", "def": "行和、列和都为 1 的非负矩阵。", "chapterId": "ch08"}, {"term": "CED", "def": "前半编码器、后半解码器，解码全局 KV 由编码器末端投影。", "chapterId": "ch09"}, {"term": "CSA2", "def": "CSA 的跨层复用版本，有 Full/Reindex/Reuse 三模式。", "chapterId": "ch09"}, {"term": "SWA", "def": "只看最近固定窗口的滑动窗口注意力。", "chapterId": "ch09"}, {"term": "SWA Bounded Replay", "def": "只回放最近一个窗口重建 SWA 缓存。", "chapterId": "ch09"}, {"term": "Engram", "def": "用哈希查表的条件记忆模块。", "chapterId": "ch09"}, {"term": "DSpark", "def": "V4.1 独立训练的投机解码 drafter。", "chapterId": "ch09"}, {"term": "FP4", "def": "4 位浮点量化，存储和带宽约为 FP16 的 1/4。", "chapterId": "ch09"}, {"term": "全局 KV cache", "def": "常驻 HBM 的主 KV 缓存；V4.1 为 890 B/token。", "chapterId": "ch09"}, {"term": "持久 KV cache", "def": "放 SSD/主机内存、用于前缀复用的缓存。", "chapterId": "ch09"}, {"term": "预填充（prefill）", "def": "一次性读入整段输入并建立 KV cache。", "chapterId": "ch09"}, {"term": "解码（decode）", "def": "逐 token 生成输出。", "chapterId": "ch09"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "quizzes": [{"id": "ch06-q01", "chapterId": "ch06", "type": "single", "question": "R1-Zero 的奖励由哪两部分组成？", "options": ["过程奖励 + 结果奖励", "准确性奖励 + 格式奖励", "人类偏好 + 长度惩罚", "价值模型 + 策略模型"], "answer": 1, "explain": "论文明确只用规则化的准确性奖励和格式奖励。", "relatedConceptId": "c18"}, {"id": "ch06-q02", "chapterId": "ch06", "type": "blank", "question": "GRPO 中优势的分母是组内______。", "answer": "标准差", "explain": "优势 =（奖励 - 组内均值）/ 组内标准差。", "relatedConceptId": "c17"}, {"id": "ch06-q03", "chapterId": "ch06", "type": "single", "question": "R1-Zero 的初始基座是哪个模型？", "options": ["DeepSeek-V3-Base", "DeepSeek-V4-Flash", "Qwen-7B", "Llama-70B"], "answer": 0, "explain": "R1-Zero 从 V3-Base 出发做纯 RL。", "relatedConceptId": "c17"}, {"id": "ch07-q04", "chapterId": "ch07", "type": "single", "question": "R1 的冷启动数据规模大约是多少？", "options": ["几千条", "80 万条", "8 万条", "45T token"], "answer": 0, "explain": "冷启动是几千条人工高质量长链推理。", "relatedConceptId": "c19"}, {"id": "ch07-q05", "chapterId": "ch07", "type": "single", "question": "R1 的蒸馏阶段使用什么训练方式？", "options": ["强化学习", "监督微调", "蒙特卡洛树搜索", "过程奖励模型"], "answer": 1, "explain": "蒸馏阶段用 R1 生成的数据做 SFT，不再跑 RL。", "relatedConceptId": "c21"}, {"id": "ch07-q06", "chapterId": "ch07", "type": "single", "question": "论文明确列为失败尝试的是哪一项？", "options": ["GRPO", "过程奖励模型（PRM）", "冷启动", "拒绝采样"], "answer": 1, "explain": "论文的 Unsuccessful Attempts 节写了 PRM 和 MCTS 的失败。", "relatedConceptId": "c17"}, {"id": "ch08-q07", "chapterId": "ch08", "type": "single", "question": "V4 的 CSA 压缩率是多少？", "options": ["2:1", "4:1", "64:1", "128:1"], "answer": 1, "explain": "CSA 每 4 个 token 压成 1 条，HCA 是 128:1。", "relatedConceptId": "c22"}, {"id": "ch08-q08", "chapterId": "ch08", "type": "single", "question": "V4 的 HCA 压缩率是多少？", "options": ["2:1", "4:1", "64:1", "128:1"], "answer": 3, "explain": "HCA 每 128 个 token 压成 1 条，压缩后做稠密注意力。", "relatedConceptId": "c23"}, {"id": "ch08-q09", "chapterId": "ch08", "type": "single", "question": "mHC 的混合矩阵被约束成什么？", "options": ["只有行和为 1", "双随机矩阵", "正交矩阵", "稀疏矩阵"], "answer": 1, "explain": "双随机要求行和、列和都为 1，元素非负。", "relatedConceptId": "c24"}, {"id": "ch09-q10", "chapterId": "ch09", "type": "single", "question": "V4.1 的 CED 中，解码器全局 KV 来自哪里？", "options": ["每层自己的隐藏状态", "编码器第 20 层的隐藏状态", "输入 embedding", "Engram 查表"], "answer": 1, "explain": "公式 C_l=H_20 W_l^KV，l>20。", "relatedConceptId": "c26"}, {"id": "ch09-q11", "chapterId": "ch09", "type": "blank", "question": "V4.1 的全局 KV cache 是每 token ______ 字节。", "answer": "890", "explain": "论文摘要与图 1 都给出 890 B/token。", "relatedConceptId": "c27"}, {"id": "ch09-q12", "chapterId": "ch09", "type": "single", "question": "CSA2 的 Reuse 模式复用了什么？", "options": ["只复用 Q", "主 KV 和 top-k 索引", "只复用位置编码", "完全重新计算"], "answer": 1, "explain": "Reuse 模式连主 KV 和上一层选好的 top-k 索引一起复用。", "relatedConceptId": "c27"}], "flashcards": [{"id": "f01", "chapterId": "ch06", "front": "R1-Zero 的两类奖励？", "back": "准确性奖励（答案对错）和格式奖励（推理/答案标签）。", "tags": ["R1", "奖励"]}, {"id": "f02", "chapterId": "ch06", "front": "GRPO 的优势怎么算？", "back": "（该回答奖励 - 组内均值）/ 组内标准差。", "tags": ["R1", "GRPO"]}, {"id": "f03", "chapterId": "ch06", "front": "“aha moment”指什么？", "back": "训练中模型自发出现停下来重新检查、反思的行为。", "tags": ["R1", "现象"]}, {"id": "f04", "chapterId": "ch06", "front": "R1-Zero 不能直接上线的原因？", "back": "可读性差、中英混杂、格式不合规。", "tags": ["R1", "局限"]}, {"id": "f05", "chapterId": "ch07", "front": "冷启动解决什么问题？", "back": "用几千条高质量长链推理稳定格式和可读性。", "tags": ["R1", "冷启动"]}, {"id": "f06", "chapterId": "ch07", "front": "R1 的四个训练阶段？", "back": "冷启动 SFT → 推理 RL → 拒绝采样 SFT → 推理+通用 RL。", "tags": ["R1", "流程"]}, {"id": "f07", "chapterId": "ch07", "front": "R1 的 SFT 数据规模？", "back": "约 80 万条，60 万推理 + 20 万通用。", "tags": ["R1", "数据"]}, {"id": "f08", "chapterId": "ch07", "front": "R1 蒸馏用什么数据、什么方式？", "back": "R1 生成并筛选约 8 万条，学生做 SFT。", "tags": ["R1", "蒸馏"]}, {"id": "f09", "chapterId": "ch08", "front": "CSA 的两个动作？", "back": "每 4 token 压 1 条 + top-k 稀疏选择。", "tags": ["V4", "CSA"]}, {"id": "f10", "chapterId": "ch08", "front": "HCA 为什么不做稀疏？", "back": "压缩到 1/128 后候选很少，稠密算也可接受。", "tags": ["V4", "HCA"]}, {"id": "f11", "chapterId": "ch08", "front": "mHC 为什么用双随机约束？", "back": "保证混合是凸组合，不放大信号，训练稳定。", "tags": ["V4", "mHC"]}, {"id": "f12", "chapterId": "ch08", "front": "Muon 和 AdamW 的核心区别？", "back": "Muon 对梯度矩阵整体正交化，AdamW 逐元素自适应。", "tags": ["V4", "优化器"]}, {"id": "f13", "chapterId": "ch09", "front": "CED 的 prefill 为什么能减半？", "back": "只算前 20 层编码器，解码器全局 KV 由 H20 投影。", "tags": ["V4.1", "CED"]}, {"id": "f14", "chapterId": "ch09", "front": "CSA2 的三种模式？", "back": "Full（完整算）、Reindex（复用 KV 重选 top-k）、Reuse（复用 KV 和索引）。", "tags": ["V4.1", "CSA2"]}, {"id": "f15", "chapterId": "ch09", "front": "Engram 怎么省计算？", "back": "N-gram 哈希查表，O(1) 内存访问替代矩阵乘法。", "tags": ["V4.1", "Engram"]}, {"id": "f16", "chapterId": "ch09", "front": "DSpark 和 MTP 的分工？", "back": "MTP 偏训练信号，DSpark 是独立训练的推理 drafter。", "tags": ["V4.1", "DSpark"]}]}, "rendered": {"ch06": "<div class=\"source-badge\">📖 出处：DeepSeek-R1 论文（arXiv:2501.12948）§1–§3<\/div><h1>第 6 章：R1 论文拆解（上）：先学会读论文，再看 R1-Zero<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：基础篇第 5 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用“五问”框架拆一篇大模型论文：问题、方法、数据、实验、局限。\n<\/li><li>\n说清 R1-Zero 和标准 SFT 模型的区别。\n<\/li><li>\n复述 GRPO 的一次完整计算：采样、奖励、组内优势、更新。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>R1-Zero 证明了一件事：不给推理过程做人工示范，只给“答案对不对”和“格式合不合规”两种规则奖励，强化学习也能把长链推理逼出来。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>先给论文建一张档案卡<\/h3>\n<table><thead><tr><th>项目<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>标题<\/td><td>DeepSeek-R1: Incentivizing Reasoning Capability in LLMs via Reinforcement Learning<\/td><\/tr><tr><td>编号<\/td><td>arXiv:2501.12948<\/td><\/tr><tr><td>发表<\/td><td>2025 年 1 月，DeepSeek-AI<\/td><\/tr><tr><td>基座<\/td><td>DeepSeek-V3-Base（671B 总参数，37B 激活）<\/td><\/tr><tr><td>关键词<\/td><td>纯强化学习、GRPO、规则奖励、R1-Zero、冷启动、蒸馏<\/td><\/tr><\/tbody><\/table>\n<p>读论文先填这张卡，比一上来啃公式有用。卡片填完，你就知道它站在什么基础上、想解决什么。<\/p>\n<h3>读论文五问<\/h3>\n<p><strong>一问：它解决什么问题？<\/strong> 不是“提升性能”这种空话，要具体到“此前的做法贵在哪、差在哪”。<\/p>\n<p><strong>二问：方法的核心改动是什么？<\/strong> 用一句话说清，再展开细节。说不清一句话，说明还没读懂。<\/p>\n<p><strong>三问：数据从哪来、规模多大？<\/strong> 大模型论文的结论高度依赖数据。数据来源不清，实验数字就要打折。<\/p>\n<p><strong>四问：实验证明了什么、没证明什么？<\/strong> 主结果、消融、对比基线要分开看。作者没做的实验，往往就是局限。<\/p>\n<p><strong>五问：作者自己承认的局限是什么？<\/strong> 论文的 Limitations 节通常比摘要诚实，值得逐条读。<\/p>\n<h3>概念 1：R1 之前，大家怎么做推理（难度：基础）<\/h3>\n<p>在 R1 之前，让模型“一步步想”主要靠两种办法：<\/p>\n<ol><li>\n<strong>监督微调<\/strong>：人工写出大量带推理步骤的答案，让模型模仿。问题是：写的人得自己会解题，成本高；模型学到的是“像人那样写”，不一定是“真的会推”。\n<\/li><li>\n<strong>过程奖励模型<\/strong>：训练一个裁判，给推理的每一步打分，再用强化学习优化。问题是：什么叫“这一步推理正确”很难定义，裁判本身也会被模型钻空子，规模一大就难维护。\n<\/ol>\n<p>R1 的论文问了一个更激进的问题：如果只给最终答案的对错，模型能不能自己学会推理？<\/p>\n<h3>概念 2：R1-Zero 的做法：没有冷启动，直接 RL（难度：进阶）<\/h3>\n<p><strong>R1-Zero<\/strong> 的流程很短：<\/p>\n<ol><li>\n拿 DeepSeek-V3-Base 当初始策略。\n<\/li><li>\n对每道题，让模型生成一组回答（论文里每组 16 个）。\n<\/li><li>\n用规则给每个回答打分：\n<ul>\n<li>\n<strong>准确性奖励<\/strong>：最终答案是否和标准答案一致。数学题做精确匹配，代码题跑测试用例。\n<\/li><li>\n<strong>格式奖励<\/strong>：推理过程是否放在 <code>...<\/code> 标签里，答案是否放在 <code>&lt;answer&gt;...<\/code>&lt;/answer&gt;` 标签里。\n<\/li><li>\n用 <strong>GRPO<\/strong> 根据组内相对好坏更新模型。\n<\/li><li>\n重复，不做任何人工推理示范。\n<\/ul>\n<\/ol>\n<p>注意，这里没有“过程奖励模型”。奖励只看最终结果和格式，不看中间步骤。这就是“纯 RL”。<\/p>\n<h3>概念 3：GRPO 怎么算（难度：高难）<\/h3>\n<p><strong>GRPO<\/strong>（Group Relative Policy Optimization，组相对策略优化）是 PPO 的省内存版本。PPO 需要一个和策略模型差不多大的价值模型（critic）来估计“这个状态值多少”，GRPO 用同一道题的一组回答互相比较，省掉 critic。<\/p>\n<p>对一道题 <span class=\"katex-inline\">q<\/span>，采样 <span class=\"katex-inline\">G<\/span> 个回答，得到奖励 <span class=\"katex-inline\">r_1,\\ldots,r_G<\/span>。第 <span class=\"katex-inline\">i<\/span> 个回答的优势：<\/p>\n<div class=\"katex-block\">A_i=\\frac{r_i-\\text{mean}(r_1,\\ldots,r_G)}{\\text{std}(r_1,\\ldots,r_G)}<\/div>\n<p>意思是：比组内平均好的回答，优势为正；比平均差的，优势为负。标准差做归一化，让不同题目的奖励尺度可比。<\/p>\n<p>目标函数（简化版）：<\/p>\n<div class=\"katex-block\">J(\\theta)=\\mathbb{E}\\left[\\frac{1}{G}\\sum_{i=1}^{G}\\min\\left(\\frac{\\pi_\\theta(o_i|q)}{\\pi_{\\theta_{\\text{old}}}(o_i|q)}A_i,\\ \\text{clip}\\left(\\frac{\\pi_\\theta}{\\pi_{\\theta_{\\text{old}}}},1-\\epsilon,1+\\epsilon\\right)A_i\\right)-\\beta D_{\\text{KL}}\\right]<\/div>\n<p>逐项翻译：<\/p>\n<ul><li>\n<span class=\"katex-inline\">\\pi_\\theta(o_i|q)<\/span>：当前模型生成这个回答的概率。\n<\/li><li>\n分子分母的比值：新模型相对旧模型，对这个回答的偏好变化了多少。\n<\/li><li>\n<span class=\"katex-inline\">\\min<\/span> 与 clip：限制一次更新的幅度，防止模型一步走太远。\n<\/li><li>\n<span class=\"katex-inline\">D_{\\text{KL}}<\/span>：惩罚新模型偏离旧模型太远，保持训练稳定。<span class=\"katex-inline\">\\beta<\/span> 控制惩罚强度。\n<\/ul>\n<p>论文的训练配置：学习率 <span class=\"katex-inline\">3\\times10^{-6}<\/span>，KL 系数 0.001，每题采样 16 个回答，最大长度 32768，每个 RL 步 8192 道题，微批 256 道题。<\/p>\n<h3>概念 4：R1-Zero 的结果：分数涨了，但话说不清（难度：进阶）<\/h3>\n<p>论文报告的主要数字（pass@1）：<\/p>\n<table><thead><tr><th>基准<\/th><th>V3-Base<\/th><th>R1-Zero<\/th><\/tr><\/thead><tbody><tr><td>AIME 2024<\/td><td>15.6%<\/td><td>71.0%<\/td><\/tr><tr><td>MATH-500<\/td><td>58.8%<\/td><td>90.2%<\/td><\/tr><tr><td>GPQA Diamond<\/td><td>30.8%<\/td><td>62.1%<\/td><\/tr><tr><td>LiveCodeBench<\/td><td>29.6%<\/td><td>50.8%<\/td><\/tr><tr><td>Codeforces 百分位<\/td><td>31.4<\/td><td>78.9<\/td><\/tr><\/tbody><\/table>\n<p>AIME 从 15.6 涨到 71.0，涨幅非常大。论文还记录了一个“aha moment”：训练中模型会突然停下来重新检查前面的步骤，输出“Wait, let me reconsider...”这类反思。这不是人教出来的，是奖励信号逼出来的。<\/p>\n<p>但 R1-Zero 不能直接拿来用：<\/p>\n<ul><li>\n推理过程可读性差，常常混用中英文。\n<\/li><li>\n格式经常不合规。\n<\/li><li>\n有些回答绕来绕去，答案却错了。\n<\/ul>\n<p>所以论文在 R1-Zero 之后，又做了一版“R1”，加入冷启动和多阶段训练。这是下一章的内容。<\/p>\n<h3>概念 5：怎么读 R1-Zero 的实验表（难度：进阶）<\/h3>\n<p>看实验表，先分清三类数字：<\/p>\n<ul><li>\n<strong>主结果<\/strong>：和基线比，证明方法有效。比如 AIME 15.6 → 71.0。\n<\/li><li>\n<strong>消融<\/strong>：去掉某个组件，看掉多少。R1 论文里对比了“加冷启动”“加多阶段”等版本。\n<\/li><li>\n<strong>训练曲线<\/strong>：看随训练步数怎么变，能发现“aha moment”和长度增长。曲线比单点数字更能说明机制。\n<\/ul>\n<p>不要只看最高分。要看：<\/p>\n<ul><li>\n基线是不是同一个基座？R1-Zero 的基线是 V3-Base，不是 V3 正式版。\n<\/li><li>\n评测是不是 pass@1？pass@1 表示只给一次机会，比 pass@k 严格。\n<\/li><li>\n有没有挑题？AIME 只有 30 道题，波动大，单次分数不能当绝对结论。\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[&quot;V3-Base&quot;] --&gt; B[&quot;对每道题采样 16 个回答&quot;]\n  B --&gt; C[&quot;规则奖励：答案对错 + 格式&quot;]\n  C --&gt; D[&quot;组内标准化算优势&quot;]\n  D --&gt; E[&quot;GRPO 更新，KL 约束&quot;]\n  E --&gt; B\n  E --&gt; F[&quot;R1-Zero&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：这个循环里没有人类写的推理步骤，只有答案对错和格式。GRPO 的作用是把“组内谁更好”变成更新方向。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：老师只告诉你“这道题答案对不对”，不给你讲步骤。你交 16 份卷子，老师圈出最好的几份，让你往那个方向调整。重复很多次，你自己摸索出一套解题流程。\n<\/li><li>\n<strong>实例<\/strong>：一道题采样 4 个回答，奖励分别是 <span class=\"katex-inline\">[1, 0, 1, 0]<\/span>。均值 0.5，标准差 0.5。优势是 <span class=\"katex-inline\">[1, -1, 1, -1]<\/span>。两个答对的回答被鼓励，两个答错的被抑制。下一轮模型会更倾向于生成类似前两个的回答。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为 R1-Zero 没有任何监督<\/strong>——它用了规则奖励，规则是人设计的，只是没有人工写推理步骤。\n<\/li><li>\n<strong>别以为 GRPO 完全不需要价值函数就“更简单”<\/strong>——它省掉 critic，但要用一组采样，采样成本更高；是拿计算换显存。\n<\/li><li>\n<strong>别以为分数涨了就代表“推理能力”全面变强<\/strong>——论文只测了数学、代码、科学问答等基准，通用对话、工具调用并没有提升。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<p>1.（单选）R1-Zero 的奖励由哪两部分组成？ A. 过程奖励 + 结果奖励 B. 准确性奖励 + 格式奖励 C. 人类偏好 + 长度惩罚 D. 价值模型 + 策略模型 <strong>答案：B<\/strong>；解析：论文明确只用规则化的准确性奖励和格式奖励，不用神经奖励模型。<\/p>\n<p>2.（填空）GRPO 中第 <span class=\"katex-inline\">i<\/span> 个回答的优势等于该回答奖励减去组内均值，再除以 ______。 <strong>答案：组内标准差<\/strong>；解析：优势是组内标准化后的相对好坏。<\/p>\n<p>3.（简答）为什么 R1-Zero 不能直接上线？ <strong>答案要点<\/strong>：推理过程可读性差、中英文混用、格式不合规，答案也可能绕远后出错。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n读论文五问：问题、方法、数据、实验、局限。\n<\/li><li>\nR1-Zero = V3-Base + GRPO + 规则奖励，没有冷启动 SFT。\n<\/li><li>\nGRPO 用组内相对优势替代 critic，靠 clip 和 KL 保持稳定。\n<\/ul>", "ch07": "<div class=\"source-badge\">📖 出处：DeepSeek-R1 论文 §2–§4、§6<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/deepseek-papers/chapter/ch06\">第 6 章：R1 论文拆解（上）：先学会读论文，再看 R1-Zero<\/a><\/span><\/div><h1>第 7 章：R1 论文拆解（下）：四阶段流水线、蒸馏与局限<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 6 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n按顺序画出 R1 的四个训练阶段。\n<\/li><li>\n说清冷启动、拒绝采样、第二轮 RL 各自解决什么问题。\n<\/li><li>\n解释蒸馏为什么能把大模型的推理能力搬到小模型，以及它的边界。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>R1 不是“一个 RL 技巧”，而是一条四阶段流水线：冷启动 SFT → 推理 RL → 拒绝采样 SFT → 通用 RL，最后把 80 万条数据蒸馏给小模型。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：为什么需要冷启动（难度：基础）<\/h3>\n<p>R1-Zero 的纯 RL 能涨分，但输出不像人话。<strong>冷启动<\/strong>（cold start）的做法是：先人工写几千条高质量、格式规范、可读性好的长链推理，做一次监督微调，把模型“领进门”，再交给 RL。<\/p>\n<p>论文的冷启动数据有几千条，特点是：<\/p>\n<ul><li>\n每条都有完整的逐步推理。\n<\/li><li>\n格式统一，推理放 <code>...<\/code>，答案放 <code>&lt;answer&gt;...&lt;/answer&gt;<\/code>。\n<\/li><li>\n语言一致，不中英混杂。\n<\/ul>\n<p>这一步不是要让模型背答案，而是给它一个“输出长什么样”的初始分布。没有这个初始分布，RL 探索空间太大，容易学出奇怪格式。<\/p>\n<h3>概念 2：第一轮推理 RL（难度：进阶）<\/h3>\n<p>冷启动之后，做推理 RL。数据和奖励与 R1-Zero 类似，但加了两点：<\/p>\n<ul><li>\n<strong>语言一致性奖励<\/strong>：统计推理过程中目标语言词的比例，比例高就给奖励，缓解中英混杂。\n<\/li><li>\n<strong>更长的训练数据<\/strong>：覆盖数学、代码、科学、逻辑等可验证任务。\n<\/ul>\n<p>这一轮的目标是让模型在“格式已经像样”的前提下，把答案正确率继续往上推。<\/p>\n<h3>概念 3：拒绝采样与 SFT（难度：进阶）<\/h3>\n<p>RL 训完后，模型能生成很多正确答案。接下来做<strong>拒绝采样<\/strong>（rejection sampling）：<\/p>\n<ol><li>\n对每道题让模型生成多个回答。\n<\/li><li>\n只保留答案正确、格式合规、可读性达标的回答。\n<\/li><li>\n把这些高质量回答当作监督数据，做一次 SFT。\n<\/ol>\n<p>论文最终用了约 80 万条 SFT 数据，其中 60 万条是推理数据，20 万条是通用数据。通用数据包括写作、问答、翻译、角色扮演等，用来防止模型变成“只会做题的偏科生”。<\/p>\n<p>拒绝采样的本质是“用模型自己产出的好答案，反过来教自己”。它比人工写答案便宜，但依赖模型已经能产出足够多的正确答案。<\/p>\n<h3>概念 4：第二轮 RL：推理与通用一起练（难度：进阶）<\/h3>\n<p>第二轮 RL 分两部分：<\/p>\n<ul><li>\n<strong>推理 RL<\/strong>：继续用规则奖励，提升数学、代码、逻辑的准确率。\n<\/li><li>\n<strong>通用 RL<\/strong>：用奖励模型给写作、问答、对话等任务打分，提升有用性和安全性。\n<\/ul>\n<p>两部分数据混合训练。论文用了约 1 万条通用 RL 提示，覆盖多种任务。这样做的目的是：不让推理训练把通用能力拉垮。<\/p>\n<h3>概念 5：蒸馏：把大模型的推理搬到小模型（难度：高难）<\/h3>\n<p><strong>知识蒸馏<\/strong>（distillation）在这里的做法很直接：<\/p>\n<ol><li>\n用 R1（671B）对大量题目生成回答。\n<\/li><li>\n筛选出正确的、格式好的回答，约 8 万条。\n<\/li><li>\n用这些回答微调小模型，比如 DeepSeek-V3、Qwen-7B/14B/32B、Llama-8B/70B。\n<\/ol>\n<p>注意，蒸馏阶段不再做 RL，只是监督微调。论文的结论是：小模型通过模仿大模型的长链推理，推理能力可以显著超过同等规模下直接做 RL 的模型。<\/p>\n<p>论文报告的蒸馏结果（AIME 2024 pass@1）：<\/p>\n<table><thead><tr><th>模型<\/th><th>AIME 2024<\/th><\/tr><\/thead><tbody><tr><td>DeepSeek-R1-Distill-Qwen-7B<\/td><td>55.5%<\/td><\/tr><tr><td>DeepSeek-R1-Distill-Qwen-32B<\/td><td>72.2%<\/td><\/tr><tr><td>DeepSeek-R1-Distill-Llama-70B<\/td><td>70.0%<\/td><\/tr><\/tbody><\/table>\n<p>作为对比，论文提到 7B 蒸馏模型在 AIME 上超过 GPT-4o 的 31.4%。这个对比很抓眼球，但要注意评测设置、题目数量和统计波动。<\/p>\n<h3>概念 6：R1 的完整流程（难度：进阶）<\/h3>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n  A[&quot;V3-Base&quot;] --&gt; B[&quot;冷启动 SFT：几千条长链推理&quot;]\n  B --&gt; C[&quot;推理 RL：规则奖励 + 语言一致性&quot;]\n  C --&gt; D[&quot;拒绝采样：筛正确、合规、可读的回答&quot;]\n  D --&gt; E[&quot;SFT：约 80 万条（60 万推理 + 20 万通用）&quot;]\n  E --&gt; F[&quot;第二轮 RL：推理 RL + 通用 RL&quot;]\n  F --&gt; G[&quot;R1（671B）&quot;]\n  G --&gt; H[&quot;生成并筛选约 8 万条&quot;]\n  H --&gt; I[&quot;蒸馏到 7B/14B/32B/70B&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：四阶段是串行的，不是可选模块。冷启动解决可读性，第一轮 RL 解决准确率，拒绝采样解决数据质量，第二轮 RL 解决通用能力。蒸馏是另一条并行的产品线，不是 R1 本身的训练阶段。<\/p>\n<h3>概念 7：论文自己承认的局限（难度：进阶）<\/h3>\n<p>R1 论文的局限写得很具体：<\/p>\n<ul><li>\n<strong>通用能力偏弱<\/strong>：函数调用、工具使用、多轮对话、角色扮演不如专门优化的模型。\n<\/li><li>\n<strong>输出结构僵硬<\/strong>：长链推理有时啰嗦，格式和语气不够灵活。\n<\/li><li>\n<strong>token 效率低<\/strong>：简单问题也写很长，推理成本高。\n<\/li><li>\n<strong>软件工程任务弱<\/strong>：SWE-bench 这类需要仓库级理解的任务，提升有限。\n<\/li><li>\n<strong>提示词敏感<\/strong>：换一种问法，表现可能波动。\n<\/li><li>\n<strong>奖励黑客风险<\/strong>：规则奖励可以被钻空子，比如格式对但答案错，或者靠猜测碰运气。\n<\/ul>\n<p>这些局限不是“以后会修”的客套话。它们直接决定 R1 适合什么场景：数学、代码、逻辑等有明确答案的任务强；开放域对话、工具编排、长程工程任务弱。<\/p>\n<h3>概念 8：论文里失败的尝试（难度：进阶）<\/h3>\n<p>论文专门写了一节“Unsuccessful Attempts”，这部分比成功经验更有信息量：<\/p>\n<ul><li>\n<strong>过程奖励模型（PRM）<\/strong>：给每一步打分。问题是步骤粒度难定义，奖励模型容易被 hack，规模一大就难维护。论文试了，收益不稳定。\n<\/li><li>\n<strong>蒙特卡洛树搜索（MCTS）<\/strong>：把推理拆成树搜索。问题是 token 空间巨大，价值模型难训，算力消耗高，最终没有成为主方案。\n<\/li><li>\n<strong>只用 SFT 不用 RL<\/strong>：给大量推理数据做监督微调，分数能涨，但泛化不如 RL，遇到新题容易崩。\n<\/ul>\n<p>这三条失败说明：R1 的成功不是因为某个单点技巧，而是“冷启动 + 规则 RL + 拒绝采样 + 多阶段”这套组合在特定任务上跑通了。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  subgraph 训练[&quot;R1 训练&quot;]\n    A[&quot;冷启动&quot;] --&gt; B[&quot;推理 RL&quot;]\n    B --&gt; C[&quot;拒绝采样&quot;]\n    C --&gt; D[&quot;SFT&quot;]\n    D --&gt; E[&quot;第二轮 RL&quot;]\n  end\n  subgraph 产品[&quot;蒸馏产品线&quot;]\n    E --&gt; F[&quot;R1 生成数据&quot;]\n    F --&gt; G[&quot;筛选 8 万条&quot;]\n    G --&gt; H[&quot;小模型 SFT&quot;]\n  end<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：上面是 R1 自己的训练，下面是拿 R1 当老师。两条线的优化目标不同：上面追求 671B 的极限，下面追求小模型的性价比。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：冷启动是“先跟着范文练字”，RL 是“自己写，按得分改”，拒绝采样是“把写得好的挑出来当字帖”，蒸馏是“把大师的作品给小徒弟临摹”。\n<\/li><li>\n<strong>实例<\/strong>：假设冷启动数据 5000 条，第一轮 RL 用 8.2 万道推理题，拒绝采样产出 80 万条 SFT 数据，蒸馏筛选 8 万条。每一步的数据规模都不同，不能混着说“R1 用了 80 万条数据训练”。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为蒸馏需要 RL<\/strong>——论文的蒸馏阶段只做 SFT，学生模型不跑 RL。\n<\/li><li>\n<strong>别以为冷启动是“人工教模型推理”<\/strong>——冷启动只给几千条样例定格式和风格，真正的推理能力靠后面的 RL 探索。\n<\/li><li>\n<strong>别以为 R1 在所有任务上都强<\/strong>——论文自己列了通用能力、工具调用、工程任务的短板。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<p>1.（单选）R1 的冷启动阶段用的是什么数据？ A. 大规模无标注网页 B. 几千条人工写的高质量长链推理 C. 80 万条模型自生成数据 D. 只用了 RL 奖励 <strong>答案：B<\/strong>；解析：冷启动是几千条人工冷启动数据，用于稳定格式和可读性。<\/p>\n<p>2.（填空）R1 的 SFT 数据约 80 万条，其中推理数据约 ______ 万条，通用数据约 20 万条。 <strong>答案：60<\/strong>；解析：论文报告 60 万推理 + 20 万通用。<\/p>\n<p>3.（简答）论文为什么放弃过程奖励模型（PRM）作为主方案？ <strong>答案要点<\/strong>：步骤级正确性难定义、奖励模型易被 hack、规模扩展困难，收益不稳定。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\nR1 四阶段：冷启动 SFT → 推理 RL → 拒绝采样 SFT → 推理+通用 RL。\n<\/li><li>\n蒸馏是拿 R1 生成的数据做 SFT，不再跑 RL。\n<\/li><li>\n论文的局限：通用能力、工具调用、token 效率、工程任务、提示词敏感、奖励黑客。\n<\/li><li>\n失败尝试：PRM、MCTS、纯 SFT。\n<\/ul>", "ch08": "<div class=\"source-badge\">📖 出处：DeepSeek-V4 技术报告（arXiv:2606.19348）§2–§5<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/deepseek-papers/chapter/ch05\">ch05<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/deepseek-papers/chapter/ch07\">第 7 章：R1 论文拆解（下）：四阶段流水线、蒸馏与局限<\/a><\/span><\/div><h1>第 8 章：V4 论文拆解：百万上下文的成本怎么砍<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：5 小时 | <strong>前置<\/strong>：基础篇第 5 章、第 6 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清 1M 上下文的成本由哪两部分构成：注意力 FLOPs 和 KV cache。\n<\/li><li>\n解释 CSA 与 HCA 各自的压缩率、稀疏方式和分工。\n<\/li><li>\n说出 mHC 和 Muon 各自解决什么训练问题。\n<\/li><li>\n分辨“FLOPs 降到 27%”和“延迟降到 27%”不是一回事。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>V4 用“CSA 压缩+稀疏”和“HCA 重压缩+稠密”的混合注意力，把 1M 上下文的单 token 推理 FLOPs 和 KV cache 同时压下来，再用 mHC 和 Muon 稳住训练。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>论文档案卡<\/h3>\n<table><thead><tr><th>项目<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>标题<\/td><td>DeepSeek-V4: Towards Highly Efficient Million-Token Context Intelligence<\/td><\/tr><tr><td>编号<\/td><td>arXiv:2606.19348<\/td><\/tr><tr><td>发表<\/td><td>2026 年 4 月，预览版<\/td><\/tr><tr><td>模型<\/td><td>V4-Pro：1.6T 总参数，49B 激活；V4-Flash：284B 总参数，13B 激活<\/td><\/tr><tr><td>上下文<\/td><td>1M token<\/td><\/tr><tr><td>关键词<\/td><td>CSA、HCA、mHC、Muon、MoE、MTP、FP4<\/td><\/tr><\/tbody><\/table>\n<h3>概念 1：1M 上下文到底贵在哪（难度：基础）<\/h3>\n<p>上下文变长，有两笔账同时涨：<\/p>\n<ol><li>\n<strong>注意力计算<\/strong>：标准注意力要让每个 token 和前面所有 token 算相似度，计算量随长度平方增长，记作 <span class=\"katex-inline\">O(n^2)<\/span>。\n<\/li><li>\n<strong>KV cache<\/strong>：每个历史 token 的 K、V 都要存，显存随长度线性增长，记作 <span class=\"katex-inline\">O(n)<\/span>。\n<\/ol>\n<p>短上下文时，这两笔账都不大。到 1M token，KV cache 可能到几十 GB，注意力计算更是天文数字。所以长上下文模型不是“把窗口调大”就行，必须改注意力结构。<\/p>\n<h3>概念 2：CSA：先压 4 倍，再稀疏选 512 条（难度：高难）<\/h3>\n<p><strong>CSA<\/strong>（Compressed Sparse Attention，压缩稀疏注意力）做两件事：<\/p>\n<p><strong>压缩<\/strong>：每 4 个连续 token 的 KV 压成 1 条。压缩不是简单平均，而是用可学习的压缩权重做加权：<\/p>\n<div class=\"katex-block\">C_i^{\\text{Comp}}=\\sum_{j=4i}^{4i+3}S_j\\odot C_j<\/div>\n<p><span class=\"katex-inline\">S_j<\/span> 是 softmax 后的压缩权重，<span class=\"katex-inline\">C_j<\/span> 是原始 KV 条目，<span class=\"katex-inline\">\\odot<\/span> 是逐元素乘。这样序列长度先变成原来的 1/4。<\/p>\n<p><strong>稀疏<\/strong>：压缩后仍有大量条目。CSA 用一个轻量索引器（lightning indexer）给每个 query 打分，只选 top-k 条参与核心注意力。V4-Flash 的 top-k 是 512，V4-Pro 是 1024。<\/p>\n<p>压缩和稀疏是乘法关系：4 倍压缩 × 只选 512 条，计算量大幅下降。CSA 还保留一条滑动窗口分支，窗口 128 个 token，专门看最近的细粒度信息，防止压缩把局部细节抹掉。<\/p>\n<h3>概念 3：HCA：压 128 倍，但不做稀疏（难度：高难）<\/h3>\n<p><strong>HCA<\/strong>（Heavily Compressed Attention，重度压缩注意力）把压缩率拉到 128:1：每 128 个 token 压成 1 条。它不做 top-k 稀疏，而是在压缩后的条目上做稠密注意力。<\/p>\n<p>为什么需要 HCA：CSA 的 top-k 适合“从大量候选里挑重点”，但索引器本身也有成本。HCA 把候选数量直接压到 1/128，稠密算也不贵，适合承载“全局、粗粒度”的上下文。<\/p>\n<p>V4 把 CSA 和 HCA 交错排布：<\/p>\n<ul><li>\nV4-Flash：前 2 层纯滑动窗口，后面 CSA/HCA 交错。\n<\/li><li>\nV4-Pro：前 2 层 HCA，后面 CSA/HCA 交错。\n<\/ul>\n<p>这样既有局部细节（滑动窗口），又有中距离重点（CSA top-k），还有全局粗览（HCA）。三种视野叠加，比单一压缩更稳。<\/p>\n<h3>概念 4：mHC：把残差连接从“加法”升级成“矩阵混合”（难度：高难）<\/h3>\n<p>标准残差是 <span class=\"katex-inline\">y=x+\\text{Layer}(x)<\/span>，一条残差流。<strong>mHC<\/strong>（Manifold-Constrained Hyper-Connections，流形约束超连接）把残差流扩成 4 条，用一个小矩阵混合这 4 条流：<\/p>\n<div class=\"katex-block\">X_{\\text{out}}=M X_{\\text{in}}+\\text{Layer}(X_{\\text{in}})<\/div>\n<p><span class=\"katex-inline\">M<\/span> 不是随便学的，它被约束在<strong>双随机矩阵流形<\/strong>上：每行和为 1，每列和为 1，所有元素非负。这样混合不会放大或缩小总信号，数值稳定。训练时用 Sinkhorn-Knopp 迭代（V4 用 20 次）把矩阵投影回这个约束。<\/p>\n<p>为什么这么做：残差是深层网络的信息主干，简单加法容易让不同层的信息互相干扰。矩阵混合让模型可以学“哪些残差流该合并、哪些该保留”，提升知识传递效率。代价是显存和通信增加，V4 用融合核、重计算和 DualPipe 调整把开销压到流水线阶段的 6.7%。<\/p>\n<h3>概念 5：Muon：不是逐元素调，而是把梯度矩阵“正交化”（难度：高难）<\/h3>\n<p>AdamW 对每个参数单独算一阶、二阶矩，逐元素更新。<strong>Muon<\/strong> 把参数矩阵的梯度当成一个整体，先做 Newton-Schulz 迭代，把梯度矩阵的奇异值拉到接近 1，再做更新。直观效果是：更新方向更“正交”，不同方向之间不互相干扰，收敛更快、训练更稳。<\/p>\n<p>V4 的配置：<\/p>\n<ul><li>\n大多数模块用 Muon，embedding、输出头、RMSNorm 用 AdamW。\n<\/li><li>\n动量 0.95，权重衰减 0.1，更新矩阵 RMS 缩放到 0.18。\n<\/li><li>\nNewton-Schulz 分两段：前 8 步快速收敛，后 2 步把奇异值稳定在 1。\n<\/li><li>\n分布式训练用混合 ZeRO：稠密参数做背包分配，MoE 参数按专家展平分配。\n<\/ul>\n<h3>概念 6：MoE 和 MTP 没有推倒重来（难度：进阶）<\/h3>\n<p>V4 保留 DeepSeekMoE 和 MTP，但改了配置：<\/p>\n<ul><li>\nV4-Flash：1 共享 + 256 路由专家，激活 6 个，专家中间维度 2048。\n<\/li><li>\nV4-Pro：1 共享 + 384 路由专家，激活 6 个，专家中间维度 3072。\n<\/li><li>\n前 3 个 MoE 层用 Hash 路由，不走学习路由，训练早期更稳。\n<\/li><li>\nMTP 深度仍为 1，继续提供额外训练信号和投机解码草稿。\n<\/ul>\n<p>这说明 V4 的创新集中在注意力和训练稳定性，不是把 V3 的整体骨架换掉。<\/p>\n<h3>概念 7：效率数字怎么读（难度：进阶）<\/h3>\n<p>论文给出的对比基线是 DeepSeek-V3.2，在 1M 上下文下：<\/p>\n<table><thead><tr><th>模型<\/th><th>单 token 推理 FLOPs<\/th><th>KV cache<\/th><\/tr><\/thead><tbody><tr><td>V4-Pro<\/td><td>27%<\/td><td>10%<\/td><\/tr><tr><td>V4-Flash<\/td><td>10%<\/td><td>7%<\/td><\/tr><\/tbody><\/table>\n<p>另外，相对 BF16 GQA8、头维度 128 的常见基线，V4 的 KV cache 可压到约 2%。<\/p>\n<p>读这三个数字要分清：<\/p>\n<ul><li>\n<strong>FLOPs<\/strong> 是计算量，不等于延迟。延迟还受显存带宽、kernel 效率、批大小影响。\n<\/li><li>\n<strong>KV cache<\/strong> 是存储量，不等于显存占用峰值。峰值还包括模型权重、激活、临时缓冲区。\n<\/li><li>\n这些数字是“单 token、1M 上下文”的估算，短上下文时优势没那么大。\n<\/ul>\n<h3>概念 8：训练与工程（难度：进阶）<\/h3>\n<ul><li>\n预训练：V4-Flash 32T token，V4-Pro 33T token。\n<\/li><li>\n学习率：<span class=\"katex-inline\">2.7\\times10^{-4}<\/span>，2000 步预热，末期余弦降到 <span class=\"katex-inline\">2.7\\times10^{-5}<\/span>。\n<\/li><li>\n批大小：逐步升到 7550 万 token，大部分训练保持这个规模。\n<\/li><li>\n工程：MoE 融合核把计算、通信、访存重叠；TileLang 写算子；确定性 kernel 保证训练推理逐位一致；混合 ZeRO 支持 Muon；两阶段上下文并行处理压缩注意力的跨 rank 边界。\n<\/li><li>\n后训练：对 MoE 专家权重和索引器 QK 路径做 FP4 量化感知训练，降低显存和计算。\n<\/ul>\n<h3>概念 9：论文的结论与局限（难度：进阶）<\/h3>\n<p>结论：<\/p>\n<ul><li>\n混合 CSA/HCA 让 1M 上下文“可 routinely 支持”，不是实验室 demo。\n<\/li><li>\nmHC 和 Muon 提升训练稳定性，允许更大模型、更长训练。\n<\/li><li>\nV4-Pro-Max 在核心任务上超过前代，官方称其重新定义了开放模型的 SOTA。\n<\/ul>\n<p>局限（论文提及与可从设计推出的）：<\/p>\n<ul><li>\n这是 preview 版本，能力和配置还会迭代。\n<\/li><li>\n1M 上下文仍不是免费：首 token 延迟、缓存存储、长文本检索精度都有代价。\n<\/li><li>\n评测集中在 reasoning、coding、long-context、agentic 等自建或公开基准，跨模型比较受评测设置影响。\n<\/li><li>\nFP4 量化和压缩注意力都可能带来精度损失，论文用 QAT 和训练补偿，但极端任务仍需验证。\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n  A[&quot;1M 上下文输入&quot;] --&gt; B[&quot;CSA：每 4 token 压 1 条 + top-k 512/1024&quot;]\n  A --&gt; C[&quot;HCA：每 128 token 压 1 条 + 稠密注意力&quot;]\n  A --&gt; D[&quot;SWA：最近 128 token 细粒度&quot;]\n  B --&gt; E[&quot;交错层&quot;]\n  C --&gt; E\n  D --&gt; E\n  E --&gt; F[&quot;mHC：4 条残差流矩阵混合&quot;]\n  F --&gt; G[&quot;MoE：1 共享 + 256/384 路由，激活 6&quot;]\n  G --&gt; H[&quot;输出&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：三种注意力视野并行，不是三选一。CSA 管中距离重点，HCA 管全局粗览，SWA 管局部细节。mHC 和 MoE 在注意力之后处理表示和知识。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：读一本 100 万字的书。CSA 是每 4 页做一张摘要卡，再只挑 512 张最相关的；HCA 是每 128 页做一张目录卡；SWA 是手边最近 128 页的原书。三种卡一起用，既不全读，也不丢关键。\n<\/li><li>\n<strong>实例<\/strong>：1M token、每 4 个压 1 条，CSA 候选从 100 万降到 25 万；再选 top-512，参与核心注意力的条目是 512 条，不是 25 万。HCA 把候选压到约 7812 条，稠密算也不贵。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为 CSA 压缩后就不算注意力了<\/strong>——压缩只是减少候选数量，核心注意力仍在压缩条目上做 Q/K/V 计算。\n<\/li><li>\n<strong>别以为 HCA 比 CSA 更“高级”<\/strong>——两者分工不同，HCA 适合全局粗览，CSA 适合中距离精选，缺一不可。\n<\/li><li>\n<strong>别以为 27% FLOPs 就是 27% 延迟<\/strong>——FLOPs 只是计算量，延迟还受带宽和 kernel 影响。\n<\/li><li>\n<strong>别以为 mHC 只是“多几条残差”<\/strong>——关键是双随机约束和 Sinkhorn 投影，没有约束的矩阵混合会训练不稳。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<p>1.（单选）V4 的 CSA 压缩率是多少？ A. 2:1 B. 4:1 C. 64:1 D. 128:1 <strong>答案：B<\/strong>；解析：CSA 每 4 个 token 压成 1 条，HCA 是 128:1。<\/p>\n<p>2.（填空）V4-Pro 的总参数约 ______，激活参数约 ______。 <strong>答案：1.6T，49B<\/strong>；解析：论文摘要明确给出。<\/p>\n<p>3.（简答）为什么 V4 要同时保留 CSA、HCA 和滑动窗口三种注意力？ <strong>答案要点<\/strong>：CSA 管中距离稀疏精选，HCA 管全局重压缩粗览，SWA 管最近局部细节，三者视野互补。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n1M 上下文的两笔账：注意力 FLOPs 和 KV cache。\n<\/li><li>\nCSA = 4:1 压缩 + top-k 稀疏 + SWA；HCA = 128:1 压缩 + 稠密。\n<\/li><li>\nmHC 用双随机矩阵混合 4 条残差流，Sinkhorn 20 次迭代。\n<\/li><li>\nMuon 正交化梯度矩阵，替代大部分 AdamW。\n<\/li><li>\n27% FLOPs ≠ 27% 延迟。\n<\/ul>", "ch09": "<div class=\"source-badge\">📖 出处：DeepSeek-V4.1-Flash 论文（arXiv:2609.19969）§2–§5<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/deepseek-papers/chapter/ch08\">第 8 章：V4 论文拆解：百万上下文的成本怎么砍<\/a><\/span><\/div><h1>第 9 章：V4.1 论文拆解：非对称 CED 与 KV cache 极限<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：5 小时 | <strong>前置<\/strong>：第 8 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n解释 CED 为什么能让 prefill 只激活 8B、decode 激活 16B。\n<\/li><li>\n说清 CSA2 的三种模式：Full、Reindex、Reuse。\n<\/li><li>\n区分“全局 KV cache”和“持久 KV cache”，以及 890 B/token 指的是哪一个。\n<\/li><li>\n说出 Engram 和 DSpark 各自解决什么问题。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>V4.1 把模型结构改成“编码器—解码器”非对称形态：前半段负责读输入、生成全局 KV，后半段只做轻量解码；再靠 CSA2 跨层复用和 FP4 把每个 token 的 KV cache 压到 890 字节。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>论文档案卡<\/h3>\n<table><thead><tr><th>项目<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>标题<\/td><td>DeepSeek-V4.1-Flash: Pushing the Limits of KV Cache Compression<\/td><\/tr><tr><td>编号<\/td><td>arXiv:2609.19969<\/td><\/tr><tr><td>发表<\/td><td>2026 年 9 月<\/td><\/tr><tr><td>模型<\/td><td>552B 主干 + 196B Engram 参数<\/td><\/tr><tr><td>激活<\/td><td>prefill 8B / token，decode 16B / token<\/td><\/tr><tr><td>上下文<\/td><td>1M token，多模态输入（图像+文本）<\/td><\/tr><tr><td>关键词<\/td><td>CED、CSA2、Engram、DSpark、FP4 KV、SWA Bounded Replay<\/td><\/tr><\/tbody><\/table>\n<h3>概念 1：为什么智能体场景要改结构（难度：基础）<\/h3>\n<p>普通聊天请求，输入短、输出长，decode 是主要成本。智能体（agent）不一样：它要反复读网页、读文件、读工具返回结果，输入很长，输出相对短。这类负载叫<strong>输入密集<\/strong>（input-heavy）。<\/p>\n<p>输入密集时，<strong>prefill<\/strong>（把输入读一遍、建立 KV cache）成了主要成本。V4.1 的整个设计，就是围绕“怎么让读输入更便宜”展开的。<\/p>\n<h3>概念 2：CED：前 20 层读，后 20 层写（难度：高难）<\/h3>\n<p><strong>CED<\/strong>（Causal Encoder-Decoder，因果编码器—解码器）把 40 层分成两半：<\/p>\n<ul><li>\n<strong>编码器<\/strong>：前 20 层，正常逐层计算，产出最终隐藏状态 <span class=\"katex-inline\">H_{20}<\/span>。\n<\/li><li>\n<strong>解码器<\/strong>：后 20 层，全局注意力的 KV 不再由本层隐藏状态逐层生成，而是直接从 <span class=\"katex-inline\">H_{20}<\/span> 投影出来：\n<\/ul>\n<div class=\"katex-block\">C_l=H_{20}W_l^{KV},\\quad Z_l=H_{20}W_l^{Z},\\quad l>20<\/div>\n<p><span class=\"katex-inline\">W_l^{KV}<\/span>、<span class=\"katex-inline\">W_l^{Z}<\/span> 是每层独立的投影矩阵。这样 prefill 时只需要算前 20 层，后 20 层的全局 KV 一次性投影出来，计算量接近减半。<\/p>\n<p>但滑动窗口注意力的 KV 仍要逐层算，否则局部细节不够。为了不让这部分抵消收益，V4.1 用 <strong>Decoder SWA Bounded Replay<\/strong>：只回放最近 <span class=\"katex-inline\">n_{\\text{win}}=128<\/span> 个 token，而不是整个窗口长度 × 层数。论文说这样精度损失可以忽略。<\/p>\n<p>结果：prefill 只激活 8B 参数，decode 需要全部 16B 参数。为什么 decode 更多？因为生成每个 token 时，解码器 20 层都要参与，激活参数回到完整规模。<\/p>\n<h3>概念 3：CSA2：把 KV 和索引跨层复用（难度：高难）<\/h3>\n<p>V4 的 CSA 每层都算自己的压缩 KV 和索引。V4.1 发现：相邻层的全局 KV 高度相似，没必要每层存一份。<strong>CSA2<\/strong> 把层分成三种模式：<\/p>\n<ul><li>\n<strong>Full 模式<\/strong>：完整计算。生成本层的主 KV、索引器 K，跑索引器，选出 top-k。\n<\/li><li>\n<strong>Reindex 模式<\/strong>：复用前面某层的主 KV 和索引器 K，但用自己的索引器 Q 重新打分，选出新的 top-k。KV 共享，选择可以变。\n<\/li><li>\n<strong>Reuse 模式<\/strong>：连 top-k 索引也复用，直接用前面层选好的条目做注意力，不跑索引器。\n<\/ul>\n<p>V4.1 的具体排布：<\/p>\n<ul><li>\n编码器 18 层 CSA2，压缩率 <span class=\"katex-inline\">m=2<\/span>，每 6 层一组：第 1 层 Full，后 5 层 Reuse。\n<\/li><li>\n解码器 20 层 CSA2，压缩率 <span class=\"katex-inline\">m=1<\/span>（不压缩序列），每 4 层一组：第一组 1 Full + 3 Reuse；后四组 1 Reindex + 3 Reuse。\n<\/li><li>\ntop-k 512，索引器 32 头、每头 128 维。\n<\/ul>\n<p><strong>分层稀疏索引器<\/strong>（Hierarchical Sparse Indexer）只在解码器用：第一个 Full 层先选出 2048 个块、每块 8 个位置，共 16384 个候选；后面的 Reindex 层只在这个候选池里选 top-512，不再对全上下文打分。这样深层索引器的成本从“随上下文线性增长”变成“常数”。<\/p>\n<h3>概念 4：KV cache 的两本账（难度：进阶）<\/h3>\n<p>论文反复提两个不同的数字，必须分清：<\/p>\n<ol><li>\n<strong>全局 KV cache<\/strong>（global KV，始终在 HBM）：V4.1 是 <strong>890 字节/token<\/strong>，约是 V4-Flash（3514 字节/token）的 1/4，是 V3.2（48068 字节/token）的约 1/54，是 V1（389120 字节/token）的约 1/437。\n<\/li><li>\n<strong>持久 KV cache<\/strong>（persistent KV，放在 SSD 或主机内存）：V4.1 约是 V4-Flash 的 1/8。\n<\/ol>\n<p>怎么压到 890 字节：<\/p>\n<ul><li>\nCSA2 跨层复用，减少重复存储。\n<\/li><li>\nFP4 存主 KV（每个数 4 位），比 FP8 再减半。\n<\/li><li>\nCED 让解码器全局 KV 从编码器输出投影，不再逐层存。\n<\/li><li>\nSWA 不再持久化，靠 Bounded Replay 重建。\n<\/ul>\n<p>这四件事是乘法关系，不是加法。任何一项单独用，都到不了 1/4。<\/p>\n<h3>概念 5：Engram：把“记忆”从计算里拆出来（难度：进阶）<\/h3>\n<p><strong>Engram<\/strong> 是一个条件记忆模块，参数量 196B，放在第 1 层和第 14 层。它做的事很像查表：<\/p>\n<ul><li>\n对输入 token 做 N-gram 压缩（2、3、4 阶）。\n<\/li><li>\n用 8 个哈希头，每个头查一张约 1600 万条目的表。\n<\/li><li>\n查到的嵌入经过门控，注入主干。\n<\/ul>\n<p>关键点：查表是 <span class=\"katex-inline\">O(1)<\/span> 的，不需要矩阵乘法。模型可以把“记住固定搭配、事实、术语”这类任务交给 Engram，把计算留给推理。Engram 参数用 FP8 存，推理时可以从主机内存预取。<\/p>\n<p>为什么放在第 1 层和第 14 层：平衡流水线各阶段的显存占用。放太前，后面层都要带着它；放太后，对早层表示影响小。<\/p>\n<h3>概念 6：DSpark：投机解码的新做法（难度：进阶）<\/h3>\n<p><strong>DSpark<\/strong> 是一个独立的投机解码模块，在主干预训练之后单独训练。它有三个 Transformer 块，滑动窗口 128，一次前向并行给出 5 个草稿位置的 logits，再用置信度调度决定验证多少。<\/p>\n<p>和 MTP 的区别：MTP 是训练时挂在主干的辅助头，DSpark 是后训练阶段单独训练的 drafter。V4.1 在主干预训练时干脆不用 MTP，把投机解码完全交给 DSpark。这样做的好处是主干训练更简单，drafter 可以单独优化。<\/p>\n<h3>概念 7：多模态与负载均衡（难度：进阶）<\/h3>\n<p>V4.1 原生支持图像输入：<\/p>\n<ul><li>\n视觉编码器 32 层，隐藏 1024，16 个注意力头，patch 14。\n<\/li><li>\n一个 2 层 MLP 把视觉特征映射到 5120 维，和文本嵌入拼接。\n<\/li><li>\n多模态数据从语言模型预训练一开始就混入，不是后期补的。\n<\/ul>\n<p>图像 token 和文本 token 的分布不同，MoE 路由偏好也不同。V4.1 给两种模态分别维护一套负载均衡偏置，路由时按 token 的模态选对应的偏置，更新时也分开统计。这样不会因为文本 token 多，就把图像 token 的专家挤掉。<\/p>\n<h3>概念 8：效率与结果（难度：进阶）<\/h3>\n<ul><li>\n预训练：45T 多模态 token。\n<\/li><li>\n全局 KV：890 字节/token。\n<\/li><li>\n持久 KV：约 V4-Flash 的 1/8。\n<\/li><li>\n解码 FLOPs：从 4K 到 1M，只增长约 1/4，几乎不随上下文线性爆炸。\n<\/li><li>\nprefill：约减半。\n<\/ul>\n<p>论文给出的智能体基准（V4.1-Flash vs 对比模型）：<\/p>\n<table><thead><tr><th>基准<\/th><th>V4.1-Flash<\/th><th>Kimi-K3<\/th><th>GLM-5.3<\/th><th>Opus5<\/th><th>GPT5.6-Sol<\/th><\/tr><\/thead><tbody><tr><td>Terminal-Bench 3.0<\/td><td>30.0<\/td><td>17.7<\/td><td>28.3<\/td><td>43.3<\/td><td>34.4<\/td><\/tr><tr><td>DeepSWE v1.1<\/td><td>74.2<\/td><td>67.5<\/td><td>66.9<\/td><td>74.0<\/td><td>73.0<\/td><\/tr><tr><td>CyberGym<\/td><td>88.1<\/td><td>80.0<\/td><td>84.5<\/td><td>84.5<\/td><td>—<\/td><\/tr><tr><td>Automation-Bench<\/td><td>54.8<\/td><td>46.7<\/td><td>48.8<\/td><td>50.3<\/td><td>45.8<\/td><\/tr><\/tbody><\/table>\n<p>读表注意：V4.1 不是每项都第一。Terminal-Bench 上 Opus5（43.3）明显更高；DeepSWE 上 Opus5（74.0）与它接近。论文的主张是“比 V4-Flash 整体更强，且在部分智能体任务上有竞争力”，不是“全面超越所有前沿模型”。<\/p>\n<h3>概念 9：论文的局限（难度：进阶）<\/h3>\n<ul><li>\n只有 Flash 版本，没有 V4.1-Pro；不能把 Flash 的成绩当成整个 V4.1 系列的上限。\n<\/li><li>\n多模态只覆盖图像和文本，不支持音频、视频。\n<\/li><li>\nCED、CSA2、Engram、DSpark 叠加后结构复杂，训练和推理的工程门槛高。\n<\/li><li>\nFP4 KV 和 FP4 权重有精度风险，论文用训练补偿，但极端任务仍需验证。\n<\/li><li>\n智能体基准多为自建或特定环境，跨论文比较要谨慎。\n<\/li><li>\n长上下文 decode 的 FLOPs 仍随长度增长（只是增长很慢），不是完全常数。\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n  subgraph 编码器[&quot;编码器 20 层&quot;]\n    A[&quot;前 2 层：纯 SWA&quot;] --&gt; B[&quot;18 层 CSA2：m=2，6 层一组，1 Full + 5 Reuse&quot;]\n  end\n  B --&gt; C[&quot;H20：最终编码器隐藏状态&quot;]\n  subgraph 解码器[&quot;解码器 20 层&quot;]\n    C --&gt; D[&quot;20 层 CSA2：m=1，4 层一组，Full/Reindex + Reuse&quot;]\n    D --&gt; E[&quot;输出 token&quot;]\n  end\n  C --&gt; F[&quot;解码器全局 KV 由 H20 投影&quot;]\n  E --&gt; G[&quot;DSpark 投机解码&quot;]\n  H[&quot;Engram：第 1、14 层查表&quot;] --&gt; B<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：编码器负责“读”，解码器负责“写”。解码器的全局 KV 不自己逐层算，而是从编码器末端投影；局部 SWA 仍逐层算，用 Bounded Replay 控制成本。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n<strong>类比<\/strong>：一家翻译公司。前 20 个编辑把整本外文书读透，做出一份“全局术语卡”（H20 投影出的 KV）；后 20 个编辑不重读原书，只拿术语卡和最近 128 个词的原文来写译文。读输入的成本减半，写译文的成本不变。\n<\/li><li>\n<strong>实例<\/strong>：1M token 输入，V4-Flash 全局 KV 约 3514 B/token，总计约 3.5 GB；V4.1 压到 890 B/token，总计约 0.89 GB。持久 KV 再降到 V4-Flash 的 1/8，SSD 压力大幅下降。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为 prefill 8B 和 decode 16B 是“两个不同模型”<\/strong>——同一个模型，不同阶段的激活路径不同：prefill 只跑编码器 + 投影，decode 要跑完整解码器。\n<\/li><li>\n<strong>别以为 CSA2 只是“KV 复用”<\/strong>——它还复用索引器 K 和 top-k 索引，三种模式解耦了“KV 共享”和“选择共享”。\n<\/li><li>\n<strong>别以为 890 B/token 是全部缓存<\/strong>——它指全局 KV；持久 KV、SWA 缓存、Engram 表是另外的账。\n<\/li><li>\n<strong>别以为 V4.1-Flash 全面超过 V4-Pro<\/strong>——论文对标的基线是 V4-Flash，不是 Pro；Terminal-Bench 上也不如 Opus5。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<p>1.（单选）V4.1 的 CED 中，解码器的全局 KV 来自哪里？ A. 每层自己的隐藏状态 B. 编码器第 20 层的隐藏状态 C. 输入 embedding D. Engram 查表 <strong>答案：B<\/strong>；解析：公式 <span class=\"katex-inline\">C_l=H_{20}W_l^{KV}<\/span>，<span class=\"katex-inline\">l&gt;20<\/span>。<\/p>\n<p>2.（填空）V4.1 的全局 KV cache 是 ______ 字节/token。 <strong>答案：890<\/strong>；解析：论文摘要与图 1 都给出这个数字。<\/p>\n<p>3.（简答）CSA2 的 Reindex 模式和 Reuse 模式有什么区别？ <strong>答案要点<\/strong>：Reindex 复用主 KV 和索引器 K，但用自己的 Q 重新打分选 top-k；Reuse 连 top-k 索引也复用，不再跑索引器。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\nV4.1 为输入密集的智能体负载设计：prefill 8B，decode 16B。\n<\/li><li>\nCED 把 40 层分成 20 编码 + 20 解码，解码全局 KV 从 H20 投影，prefill 减半。\n<\/li><li>\nCSA2 三模式 Full/Reindex/Reuse，跨层复用 KV 与索引；分层索引器把深层打分变常数。\n<\/li><li>\n全局 KV 890 B/token，持久 KV 约 V4-Flash 的 1/8。\n<\/li><li>\nEngram 查表记忆，DSpark 投机解码，FP4 压 KV。\n<\/ul>", "c17": "<div class=\"source-badge\">📖 出处：DeepSeek-R1 论文 §2.2<\/div><h1>GRPO（组相对策略优化）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 6 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>GRPO 是 PPO 的省显存版本：同一道题采样一组回答，用组内相对排名算优势，不需要单独的价值模型。<\/p>\n<h2>为什么重要<\/h2>\n<p>R1-Zero 和 R1 的推理 RL 都用 GRPO。不懂它，就看不懂 R1 的训练目标，也看不懂“为什么 R1 不需要 critic”。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  Q[&quot;题目 q&quot;] --&gt; S[&quot;采样 G 个回答&quot;]\n  S --&gt; R[&quot;规则奖励 r1..rG&quot;]\n  R --&gt; A[&quot;优势 = （r - 组均值） / 组标准差&quot;]\n  A --&gt; U[&quot;clip 更新策略&quot;]\n  U --&gt; K[&quot;KL 约束&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>PPO 需要一个价值网络估计每个状态的基线，显存占用大。GRPO 用“同一道题的一组回答”当基线：<\/p>\n<div class=\"katex-block\">A_i=\\frac{r_i-\\text{mean}(r)}{\\text{std}(r)}<\/div>\n<p>组内比平均好的为正，比平均差的为负。目标函数带 clip 和 KL：<\/p>\n<div class=\"katex-block\">J=\\mathbb{E}\\left[\\min\\left(\\rho_i A_i,\\ \\text{clip}(\\rho_i,1-\\epsilon,1+\\epsilon)A_i\\right)\\right]-\\beta D_{\\text{KL}}<\/div>\n<p><span class=\"katex-inline\">\\rho_i<\/span> 是新旧策略的概率比。clip 防止一步更新过大，KL 防止模型偏离太远。<\/p>\n<p>R1 的配置：每题 16 个回答，学习率 <span class=\"katex-inline\">3\\times10^{-6}<\/span>，KL 系数 0.001，最大长度 32768。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\nGRPO 不是“不需要基线”，它用组内均值当基线。\n<\/li><li>\nGRPO 不是“没有 critic 就一定更好”，它用更多采样换显存，采样成本高。\n<\/li><li>\n优势归一化用组内标准差，不是全局标准差。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch06<\/td><td>R1-Zero<\/td><td>用 GRPO 做纯 RL<\/td><\/tr><tr><td>ch07<\/td><td>R1<\/td><td>两轮 RL 都用 GRPO<\/td><\/tr><tr><td>ch10<\/td><td>架构对比<\/td><td>RL 算法与架构是两条线<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：参数与损失、softmax\n<\/li><li>\n后续：规则奖励、KL 约束、PPO\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（GRPO（组相对策略优化））<\/summary><div class=\"depth-body\"><h2>🔬 GRPO 的第一性原理推导：没有标准答案，怎么让模型自己变好<\/h2>\n<h3>第一步：先分清“监督学习”和“强化学习”<\/h3>\n<p>监督学习有标准答案：输入一张图，标签是“猫”，模型预测错就改。强化学习没有标准答案，只有做完一件事之后得到一个分数。模型要自己试很多次，才知道哪种做法分高。<\/p>\n<p>R1 的数学题有标准答案，但论文故意不把“推理步骤”当监督信号，只把最终答案对错当奖励。这就是强化学习的场景：过程没人教，结果有对错。<\/p>\n<h3>第二步：策略梯度的直觉<\/h3>\n<p>模型对一道题可以生成很多种回答。每种回答有一个概率，记作 <span class=\"katex-inline\">\\pi_\\theta(o|q)<\/span>。如果某个回答拿到高分，我们希望提高它的概率；拿到低分，就降低它的概率。<\/p>\n<p>最朴素的更新是：<\/p>\n<div class=\"katex-block\">\\theta \\leftarrow \\theta+\\eta \\cdot r \\cdot \\nabla_\\theta \\log \\pi_\\theta(o|q)<\/div>\n<p><span class=\"katex-inline\">\\nabla_\\theta \\log \\pi_\\theta<\/span> 是“怎么调参数才能让这个回答更容易出现”的方向，<span class=\"katex-inline\">r<\/span> 是奖励。奖励为正，就沿着这个方向走；奖励为负，就反着走。<\/p>\n<p>问题：奖励的绝对值波动很大，方差高，训练不稳。需要一个基线。<\/p>\n<h3>第三步：为什么要减去基线<\/h3>\n<p>假设两个回答奖励是 10 和 9。按绝对值，两个都该被鼓励，但 9 明显不如 10。减去基线（比如组内平均 9.5）后，优势变成 +0.5 和 -0.5：一个鼓励，一个抑制。基线让“相对好坏”显现出来。<\/p>\n<p>PPO 用价值网络估计基线，GRPO 直接用同一道题的一组回答的均值当基线，省掉价值网络。<\/p>\n<h3>第四步：组内标准化的数值例子<\/h3>\n<p>一道题采样 4 个回答，奖励：<\/p>\n<div class=\"katex-block\">r=[1,\\ 0,\\ 1,\\ 0]<\/div>\n<p>均值：<\/p>\n<div class=\"katex-block\">\\text{mean}=\\frac{1+0+1+0}{4}=0.5<\/div>\n<p>标准差：<\/p>\n<div class=\"katex-block\">\\text{std}=\\sqrt{\\frac{(1-0.5)^2+(0-0.5)^2+(1-0.5)^2+(0-0.5)^2}{4}}=\\sqrt{0.25}=0.5<\/div>\n<p>优势：<\/p>\n<div class=\"katex-block\">A=[\\frac{1-0.5}{0.5},\\ \\frac{0-0.5}{0.5},\\ \\frac{1-0.5}{0.5},\\ \\frac{0-0.5}{0.5}]=[1,-1,1,-1]<\/div>\n<p>两个答对的被鼓励，两个答错的被抑制。如果四个奖励全是 1，均值和标准差都是 1 和 0，优势全为 0，这一步没有学习信号——这也是 GRPO 的一个边界：题目太简单或太难，组内没有差异，就学不到东西。<\/p>\n<h3>第五步：clip 和 KL 在防什么<\/h3>\n<p>模型一次更新太猛，会把原来会的回答概率压到 0，训练崩掉。PPO/GRPO 用概率比：<\/p>\n<div class=\"katex-block\">\\rho_i=\\frac{\\pi_\\theta(o_i|q)}{\\pi_{\\theta_{\\text{old}}}(o_i|q)}<\/div>\n<p>如果新模型对这个回答的概率变成原来的 3 倍，<span class=\"katex-inline\">\\rho_i=3<\/span>，更新幅度过大。clip 把 <span class=\"katex-inline\">\\rho_i<\/span> 限制在 <span class=\"katex-inline\">[1-\\epsilon,1+\\epsilon]<\/span>，比如 <span class=\"katex-inline\">\\epsilon=0.2<\/span>，最多只认 1.2 倍的提升。<\/p>\n<p>KL 惩罚则防止新模型整体偏离旧模型太远：<\/p>\n<div class=\"katex-block\">D_{\\text{KL}}(\\pi_\\theta\\|\\pi_{\\text{old}})=\\sum_o \\pi_\\theta(o)\\log\\frac{\\pi_\\theta(o)}{\\pi_{\\text{old}}(o)}<\/div>\n<p>R1 的 KL 系数是 0.001，很小，但对稳定训练有用。<\/p>\n<h3>第六步：完整走一遍<\/h3>\n<ol><li>\n对题目 <span class=\"katex-inline\">q<\/span> 采样 16 个回答。\n<\/li><li>\n用规则奖励打分。\n<\/li><li>\n算组内均值和标准差，得到 16 个优势。\n<\/li><li>\n对每个回答算新旧概率比，做 clip。\n<\/li><li>\n加上 KL 惩罚，得到目标函数。\n<\/li><li>\n反向传播，更新参数。\n<\/li><li>\n换下一批题，重复。\n<\/ol>\n<h3>差生检查<\/h3>\n<ul><li>\n策略、奖励、优势、概率比都给了白话解释。\n<\/li><li>\n数值例子可以手算复核。\n<\/li><li>\n解释了“为什么要减基线”“为什么要 clip”“为什么要 KL”，不是只给公式。\n<\/li><li>\n说明了边界：组内奖励全相同，优势为 0，没有学习信号。\n<\/ul>\n<h3>前置与后续<\/h3>\n<ul><li>\n前置：概率、softmax、梯度下降（第 1、2 章）\n<\/li><li>\n后续：规则奖励（ch06）、R1 四阶段（ch07）、OPD（ch11）\n<\/ul><\/div><\/details>", "c18": "<div class=\"source-badge\">📖 出处：DeepSeek-R1 论文 §2.2<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/deepseek-papers/concept/c17\">GRPO（组相对策略优化）<\/a><\/span><\/div><h1>规则奖励<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 6 章、第 7 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>规则奖励是用确定性规则给模型回答打分，不训练神经奖励模型；R1 主要用“答案对不对”和“格式合不合规”两条规则。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是 R1-Zero 能成立的前提。没有规则奖励，纯 RL 就没有稳定信号；有了它，训练可以大规模跑，不怕奖励模型被 hack。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[&quot;模型回答&quot;] --&gt; B[&quot;抽最终答案&quot;]\n  B --&gt; C{&quot;与标准答案一致?&quot;}\n  C --&gt;|是| D[&quot;准确性奖励 +1&quot;]\n  C --&gt;|否| E[&quot;0&quot;]\n  A --&gt; F{&quot;格式合规?&quot;}\n  F --&gt;|是| G[&quot;格式奖励&quot;]\n  F --&gt;|否| H[&quot;0&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>两类奖励：<\/p>\n<ol><li>\n<strong>准确性奖励<\/strong>：数学题做精确匹配（如 <code>\\boxed{}<\/code> 里的答案），代码题跑单元测试，逻辑题比对选项。\n<\/li><li>\n<strong>格式奖励<\/strong>：推理是否放在 <code>...<\/code>，答案是否放在 <code>&lt;answer&gt;...&lt;/answer&gt;<\/code>。\n<\/ol>\n<p>优点：<\/p>\n<ul><li>\n确定性，可复现，不受奖励模型偏好漂移影响。\n<\/li><li>\n可以大规模自动判分，成本低。\n<\/li><li>\n不容易被“讨好裁判”的写法 hack。\n<\/ul>\n<p>缺点：<\/p>\n<ul><li>\n只适用于有明确答案的任务。开放写作、对话、工具调用无法用规则判分。\n<\/li><li>\n规则本身可能被钻空子，比如格式对但答案错，或者靠猜测碰运气。\n<\/li><li>\n对推理过程的“质量”没有直接信号，只看结果。\n<\/ul>\n<p>R1 在通用 RL 阶段改用奖励模型，就是因为开放任务没有标准答案。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n规则奖励不是“没有奖励模型就完全客观”，规则也是人设计的，有盲区。\n<\/li><li>\n规则奖励不是“只能用于数学”，代码测试、格式检查、工具调用成功与否都可以规则化。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch06<\/td><td>R1-Zero<\/td><td>准确性 + 格式两条规则<\/td><\/tr><tr><td>ch07<\/td><td>R1<\/td><td>推理 RL 继续用规则，通用 RL 用奖励模型<\/td><\/tr><tr><td>ch11<\/td><td>训练对比<\/td><td>规则奖励适合可验证任务<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：GRPO\n<\/li><li>\n后续：奖励黑客、奖励模型\n<\/ul>", "c19": "<div class=\"source-badge\">📖 出处：DeepSeek-R1 论文 §2.3.1<\/div><h1>冷启动<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 7 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>冷启动是在 RL 之前，用少量高质量人工长链推理数据做一次 SFT，把模型的输出格式和可读性先“领进门”。<\/p>\n<h2>为什么重要<\/h2>\n<p>R1-Zero 证明纯 RL 能涨分，但输出不可读。冷启动是 R1 从“实验室能跑”变成“产品能用”的关键一步。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[&quot;V3-Base&quot;] --&gt; B[&quot;几千条人工长链推理&quot;]\n  B --&gt; C[&quot;SFT：学格式与风格&quot;]\n  C --&gt; D[&quot;RL：探索推理策略&quot;]\n  D --&gt; E[&quot;可读的 R1&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>冷启动数据的特点：<\/p>\n<ul><li>\n量小：几千条，不是几百万。\n<\/li><li>\n质高：步骤完整、语言一致、格式统一。\n<\/li><li>\n目的不是教知识，是教“输出长什么样”。\n<\/ul>\n<p>为什么不能直接上大量 SFT：会把模型限制在人类写过的推理路径上，失去 RL 探索新策略的空间。为什么不能完全不要：纯 RL 的初始输出太乱，格式奖励很难把可读性拉回来。<\/p>\n<p>论文在冷启动后还加了语言一致性奖励，进一步压制中英混杂。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n冷启动不是“人工教模型每一步怎么推”，它只给少量样例定格式。\n<\/li><li>\n冷启动不是“可有可无”，没有它 R1-Zero 的输出不能直接使用。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch07<\/td><td>R1 四阶段<\/td><td>冷启动是第一阶段<\/td><\/tr><tr><td>ch06<\/td><td>R1-Zero 对比<\/td><td>无冷启动导致可读性差<\/td><\/tr><tr><td>ch11<\/td><td>训练流程<\/td><td>冷启动 + RL 的组合<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：监督微调\n<\/li><li>\n后续：推理 RL、拒绝采样\n<\/ul>", "c20": "<div class=\"source-badge\">📖 出处：DeepSeek-R1 论文 §2.3.2<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/deepseek-papers/concept/c17\">GRPO（组相对策略优化）<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/deepseek-papers/concept/c19\">冷启动<\/a><\/span><\/div><h1>拒绝采样<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 7 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>拒绝采样是让模型对每道题生成多个回答，只保留答案正确、格式合规、可读性达标的样本，作为下一轮 SFT 数据。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是 R1 把 RL 探索出的能力“固化”成监督数据的关键环节。没有它，RL 的成果很难稳定传给下一阶段或小模型。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[&quot;题目&quot;] --&gt; B[&quot;生成多个回答&quot;]\n  B --&gt; C{&quot;答案正确?&quot;}\n  C --&gt;|否| D[&quot;丢弃&quot;]\n  C --&gt;|是| E{&quot;格式/可读性达标?&quot;}\n  E --&gt;|否| D\n  E --&gt;|是| F[&quot;保留为 SFT 数据&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>R1 的拒绝采样规模：<\/p>\n<ul><li>\n推理数据约 60 万条。\n<\/li><li>\n通用数据约 20 万条（用奖励模型和人工规则筛）。\n<\/li><li>\n合计约 80 万条 SFT 数据。\n<\/ul>\n<p>筛选标准不是只看答案：<\/p>\n<ul><li>\n答案必须正确。\n<\/li><li>\n推理过程格式合规。\n<\/li><li>\n语言一致、可读。\n<\/li><li>\n有些任务还要过奖励模型或人工抽检。\n<\/ul>\n<p>拒绝采样的前提是模型已经能产出足够多的正确答案。如果正确率太低，采样成本会爆炸，所以它通常放在 RL 之后，而不是训练一开始。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n拒绝采样不是“随机丢弃”，它是有明确标准的筛选。\n<\/li><li>\n拒绝采样不是“只留最高分”，通常保留所有达标样本，保证多样性。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch07<\/td><td>R1 第三阶段<\/td><td>筛出 80 万条 SFT 数据<\/td><\/tr><tr><td>ch07<\/td><td>蒸馏<\/td><td>从 R1 生成数据中筛 8 万条<\/td><\/tr><tr><td>ch11<\/td><td>数据工程<\/td><td>拒绝采样是数据闭环的一环<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：冷启动、GRPO\n<\/li><li>\n后续：SFT、知识蒸馏\n<\/ul>", "c21": "<div class=\"source-badge\">📖 出处：DeepSeek-R1 论文 §2.3.3<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/deepseek-papers/concept/c20\">拒绝采样<\/a><\/span><\/div><h1>知识蒸馏<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 7 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>知识蒸馏是让一个小模型学习大模型生成的输出，把大模型的能力以监督数据的形式迁移过去。<\/p>\n<h2>为什么重要<\/h2>\n<p>R1 的蒸馏让小模型在数学、代码上显著超过同规模直接训练，是“大模型能力下放”的典型做法。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[&quot;R1 大模型&quot;] --&gt; B[&quot;对题目生成回答&quot;]\n  B --&gt; C[&quot;筛选正确、格式好的回答&quot;]\n  C --&gt; D[&quot;约 8 万条蒸馏数据&quot;]\n  D --&gt; E[&quot;小模型 SFT&quot;]\n  E --&gt; F[&quot;R1-Distill 系列&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>两种蒸馏：<\/p>\n<ol><li>\n<strong>数据蒸馏<\/strong>（R1 采用）：大模型生成答案，筛出高质量样本，小模型做监督微调。学生只学最终输出，不学大模型的概率分布。\n<\/li><li>\n<strong>logit 蒸馏<\/strong>：学生同时拟合教师的输出概率分布，需要访问教师 logits，R1 论文没有采用。\n<\/ol>\n<p>R1 蒸馏的对象包括 DeepSeek-V3（未做 RL 的版本）、Qwen-7B/14B/32B、Llama-8B/70B。论文的结论是：蒸馏带来的提升，比在小模型上直接做 RL 更稳定、更便宜。<\/p>\n<p>蒸馏的边界：<\/p>\n<ul><li>\n学生模型容量有限，长链推理会压缩或变形。\n<\/li><li>\n教师也会犯错，筛数据只能减少错误，不能消除。\n<\/li><li>\n蒸馏学到的是“教师怎么解这类题”，遇到全新领域不一定迁移。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n蒸馏不是“把大模型参数复制给小模型”，参数量完全不同。\n<\/li><li>\n蒸馏不是“学生一定超过教师”，学生的上限受容量限制。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch07<\/td><td>R1 蒸馏<\/td><td>8 万条数据，SFT 不再 RL<\/td><\/tr><tr><td>ch09<\/td><td>V4.1<\/td><td>后训练也用到数据蒸馏/OPD<\/td><\/tr><tr><td>ch11<\/td><td>训练对比<\/td><td>蒸馏 vs 直接 RL<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：拒绝采样、SFT\n<\/li><li>\n后续：OPD、模型压缩\n<\/ul>", "c22": "<div class=\"source-badge\">📖 出处：DeepSeek-V4 技术报告 §2.3.1<\/div><h1>CSA（压缩稀疏注意力）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 8 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>CSA 先把每 4 个 token 的 KV 压成 1 条，再用轻量索引器选 top-k 条参与核心注意力，兼顾压缩与稀疏。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是 V4 长上下文效率的第一根支柱。理解 CSA，才能理解 V4 为什么能把 1M 上下文的 KV cache 压到 10%。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  H[&quot;1M token 的 KV&quot;] --&gt; C[&quot;每 4 个压 1 条：25 万条&quot;]\n  C --&gt; I[&quot;lightning indexer 打分&quot;]\n  I --&gt; T[&quot;选 top-k：512 或 1024 条&quot;]\n  T --&gt; A[&quot;核心注意力（MQA）&quot;]\n  W[&quot;SWA：最近 128 token&quot;] --&gt; A<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>压缩：每 <span class=\"katex-inline\">m=4<\/span> 个连续 token 压成 1 条，压缩权重由 hidden state 算出，softmax 归一化后加权求和。相邻压缩块有重叠，减少边界信息损失。<\/p>\n<p>稀疏：索引器用低秩的索引 Q/K 给每条压缩 KV 打分，选 top-k。V4-Flash k=512，V4-Pro k=1024。<\/p>\n<p>核心注意力：被选中的压缩条目同时充当 K 和 V，用 MQA（多查询注意力）方式计算，多个 query 头共享同一份 KV。<\/p>\n<p>局部分支：额外保留最近 128 个 token 的未压缩 KV，保证局部细节。<\/p>\n<p>三个数字一起看：<\/p>\n<ul><li>\n1M → 25 万（压缩 4 倍）\n<\/li><li>\n25 万 → 512（稀疏选 top-k）\n<\/li><li>\n另外 128 条局部 KV\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\nCSA 不是“只算 512 个 token”，它仍要看压缩后的候选，只是核心注意力只对 top-k 计算。\n<\/li><li>\nCSA 的压缩不是平均池化，压缩权重是学出来的。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch08<\/td><td>V4<\/td><td>m=4，top-k 512/1024<\/td><\/tr><tr><td>ch09<\/td><td>V4.1<\/td><td>CSA2 在此基础上做跨层复用<\/td><\/tr><tr><td>ch10<\/td><td>架构演进<\/td><td>压缩+稀疏路线<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：注意力、KV cache、softmax\n<\/li><li>\n后续：HCA、CSA2\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（CSA（压缩稀疏注意力））<\/summary><div class=\"depth-body\"><h2>🔬 CSA 的第一性原理推导：4 倍压缩 + top-k，到底省了多少<\/h2>\n<h3>第一步：先算不压缩的账<\/h3>\n<p>标准注意力里，每个 query 要和前面所有 token 的 K 做点积。序列长度 <span class=\"katex-inline\">n<\/span> 时，点积次数约为 <span class=\"katex-inline\">n^2/2<\/span>（因果注意力只算左半边）。<span class=\"katex-inline\">n=1{,}000{,}000<\/span> 时，约 <span class=\"katex-inline\">5\\times10^{11}<\/span> 次点积，单次点积还要乘维度，计算量爆炸。<\/p>\n<p>KV cache 也不小：每 token 64 KB，1M token 就是 64 GB。<\/p>\n<h3>第二步：压缩 4 倍，候选降到 25 万<\/h3>\n<p>CSA 把每 4 个 token 的 KV 压成 1 条。压缩不是平均，而是用权重加权：<\/p>\n<div class=\"katex-block\">C_i^{\\text{Comp}}=\\sum_{j=4i}^{4i+3}S_j\\odot C_j<\/div>\n<p><span class=\"katex-inline\">S_j<\/span> 是 4 个压缩权重，经过 softmax 归一化，加起来为 1。<span class=\"katex-inline\">C_j<\/span> 是原始 KV 条目。这样序列长度从 <span class=\"katex-inline\">n<\/span> 变成 <span class=\"katex-inline\">n/4<\/span>。<\/p>\n<p><span class=\"katex-inline\">n=1M<\/span> 时，候选从 100 万降到 25 万。只做这一步，注意力计算量降到约 1/16（因为 <span class=\"katex-inline\">n^2<\/span> 变小 16 倍），KV cache 降到 1/4。<\/p>\n<h3>第三步：再稀疏选 top-k，候选降到 512<\/h3>\n<p>25 万条还是太多。CSA 用轻量索引器给每条候选打分，只选 top-k 条。V4-Flash 选 512 条，V4-Pro 选 1024 条。<\/p>\n<p>这一步把核心注意力的候选从 25 万降到 512，计算量再降约 488 倍。压缩和稀疏是乘法关系：<\/p>\n<div class=\"katex-block\">\\text{总降幅}\\approx 4\\times\\frac{250{,}000}{512}\\approx 1953\\ \\text{倍}<\/div>\n<p>当然，实际不会这么夸张，因为索引器本身也要算分，局部 SWA 还要保留 128 条。但量级方向是对的。<\/p>\n<h3>第四步：压缩权重怎么来的<\/h3>\n<p>对每个 token 的 hidden state <span class=\"katex-inline\">h_j<\/span>，用一个矩阵 <span class=\"katex-inline\">W^Z<\/span> 算出压缩分数 <span class=\"katex-inline\">z_j<\/span>，加上可学习位置偏置 <span class=\"katex-inline\">B<\/span>，在 4 个 token 内做 softmax：<\/p>\n<div class=\"katex-block\">S_j=\\frac{e^{z_j+B_j}}{\\sum_{l=4i}^{4i+3}e^{z_l+B_l}}<\/div>\n<p>位置偏置让模型可以学“这 4 个 token 里哪个更重要”。比如压缩一个短语时，中心词权重可能更高。<\/p>\n<h3>第五步：为什么还要局部 SWA<\/h3>\n<p>压缩块内的 token 互相看不见。比如第 4 个 token 和第 1 个 token 在同一个压缩块里，压缩后只留一条表示，第 4 个 token 看不到第 1 个的细节。语言模型对最近几个 token 的依赖很强，所以 CSA 额外保留最近 128 个 token 的未压缩 KV，单独算一条局部注意力。<\/p>\n<p>最终每个 query 的注意力来源：<\/p>\n<ul><li>\ntop-k 条压缩 KV（512 或 1024）\n<\/li><li>\n最近 128 条未压缩 KV\n<\/ul>\n<p>两者拼在一起做 softmax。<\/p>\n<h3>第六步：数值感受<\/h3>\n<p>1M token，4:1 压缩后 25 万条，选 top-512。每个 query 的核心注意力只算 512 + 128 = 640 条，而不是 100 万条。KV cache 只存压缩条目和最近窗口，不存全部历史。<\/p>\n<h3>差生检查<\/h3>\n<ul><li>\n<span class=\"katex-inline\">n<\/span>、<span class=\"katex-inline\">m<\/span>、<span class=\"katex-inline\">k<\/span> 第一次出现都给了含义。\n<\/li><li>\n压缩公式和 softmax 权重逐步解释。\n<\/li><li>\n区分了“压缩”和“稀疏”两个动作，说明它们是乘法关系。\n<\/li><li>\n数值例子标明是量级演示，不是精确 benchmark。\n<\/ul>\n<h3>前置与后续<\/h3>\n<ul><li>\n前置：注意力、softmax、KV cache（第 1、3、5 章）\n<\/li><li>\n后续：HCA（ch08）、CSA2（ch09）\n<\/ul><\/div><\/details>", "c23": "<div class=\"source-badge\">📖 出处：DeepSeek-V4 技术报告 §2.3.2<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/deepseek-papers/concept/c22\">CSA（压缩稀疏注意力）<\/a><\/span><\/div><h1>HCA（重度压缩注意力）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 8 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>HCA 把每 128 个 token 的 KV 压成 1 条，压缩后做稠密注意力，不跑稀疏索引器。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是 V4 长上下文的第二根支柱。CSA 管中距离精选，HCA 管全局粗览，两者交错才覆盖完整视野。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  H[&quot;1M token 的 KV&quot;] --&gt; C[&quot;每 128 个压 1 条：约 7812 条&quot;]\n  C --&gt; A[&quot;稠密注意力（全部条目）&quot;]\n  W[&quot;SWA：最近 128 token&quot;] --&gt; A<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>压缩率 <span class=\"katex-inline\">m&#x27;=128<\/span>，比 CSA 的 4 大 32 倍。压缩方式与 CSA 类似：压缩权重 softmax 后加权求和，但不做重叠压缩。<\/p>\n<p>为什么不做稀疏：压缩后只剩约 7812 条（1M 上下文），稠密算也可接受；省掉索引器的计算和存储，结构更简单。<\/p>\n<p>为什么需要它：CSA 的 top-k 只能覆盖“最相关的 512 条”，对需要全局扫一遍的任务（比如长文档主题归纳）不够。HCA 保留一个粗粒度的全局视图，弥补这个缺口。<\/p>\n<p>V4-Pro 前 2 层用 HCA，V4-Flash 前 2 层用纯 SWA；之后都是 CSA/HCA 交错。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\nHCA 不是“比 CSA 更弱”，它是不同分工。\n<\/li><li>\nHCA 的 128:1 压缩不是“只保留 128 个 token”，是把每 128 个压成 1 条，总数仍是序列长度的 1/128。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch08<\/td><td>V4<\/td><td>m&#x27;=128，稠密注意力<\/td><\/tr><tr><td>ch09<\/td><td>V4.1<\/td><td>改为纯 CSA2，不再用 HCA<\/td><\/tr><tr><td>ch10<\/td><td>架构演进<\/td><td>重压缩路线<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：CSA、注意力\n<\/li><li>\n后续：CSA2\n<\/ul>", "c24": "<div class=\"source-badge\">📖 出处：DeepSeek-V4 技术报告 §2.2<\/div><h1>mHC（流形约束超连接）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 8 章、第 9 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>mHC 把 Transformer 的残差流从 1 条扩成 4 条，用一个受双随机约束的矩阵混合它们，替代简单的逐元素相加。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是 V4 提升训练稳定性和深层信息传递的关键结构，V4.1 还升级成 Single-Pass mHC，降低显存开销。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  X[&quot;4 条残差流 X&quot;] --&gt; M[&quot;双随机矩阵 M&quot;]\n  M --&gt; S[&quot;混合结果 MX&quot;]\n  X --&gt; L[&quot;子层 Layer（X）&quot;]\n  S --&gt; A[&quot;相加&quot;]\n  L --&gt; A\n  A --&gt; Y[&quot;输出 4 条流&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>标准残差：<span class=\"katex-inline\">y=x+\\text{Layer}(x)<\/span>，只有一条流。<\/p>\n<p>mHC：把隐藏状态复制成 <span class=\"katex-inline\">n=4<\/span> 条残差流，用 <span class=\"katex-inline\">4\\times4<\/span> 矩阵 <span class=\"katex-inline\">M<\/span> 混合：<\/p>\n<div class=\"katex-block\">X_{\\text{out}}=M X_{\\text{in}}+\\text{Layer}(X_{\\text{in}})<\/div>\n<p><span class=\"katex-inline\">M<\/span> 约束为<strong>双随机矩阵<\/strong>：每行和 1、每列和 1、元素非负。这个约束保证混合是凸组合，不会放大信号，也不会让某条流吞掉其他流。训练时用 Sinkhorn-Knopp 迭代 20 次，把学到的矩阵投影回这个流形。<\/p>\n<p>为什么有效：<\/p>\n<ul><li>\n多条流提供更多“信息通道”，不同层可以写不同流。\n<\/li><li>\n双随机约束让混合稳定，避免深层残差爆炸。\n<\/li><li>\n模型可以学“哪些流该合并”，比固定加法灵活。\n<\/ul>\n<p>代价：显存和通信增加。V4 用融合核、重计算、DualPipe 调整，把开销压到流水线阶段的 6.7%。V4.1 的 Single-Pass mHC 用一个融合核完成，激活访存减半。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\nmHC 不是“简单多加几条残差”，关键是矩阵约束。\n<\/li><li>\n双随机约束不是“随便归一化”，行列都要为 1，Sinkhorn 是迭代投影。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch08<\/td><td>V4<\/td><td>n=4，Sinkhorn 20 次<\/td><\/tr><tr><td>ch09<\/td><td>V4.1<\/td><td>Single-Pass mHC<\/td><\/tr><tr><td>ch10<\/td><td>架构对比<\/td><td>残差结构演进<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：残差连接、矩阵乘法\n<\/li><li>\n后续：Sinkhorn、训练稳定性\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（mHC（流形约束超连接））<\/summary><div class=\"depth-body\"><h2>🔬 mHC 的第一性原理推导：为什么残差要“矩阵混合”，还要双随机约束<\/h2>\n<h3>第一步：标准残差在做什么<\/h3>\n<p>一个 Transformer 层可以写成：<\/p>\n<div class=\"katex-block\">x_{l+1}=x_l+F_l(x_l)<\/div>\n<p><span class=\"katex-inline\">x_l<\/span> 是第 <span class=\"katex-inline\">l<\/span> 层的输入，<span class=\"katex-inline\">F_l<\/span> 是注意力或 FFN。残差让信息有一条直通路径：即使 <span class=\"katex-inline\">F_l<\/span> 输出很小，<span class=\"katex-inline\">x_{l+1}<\/span> 仍约等于 <span class=\"katex-inline\">x_l<\/span>。<\/p>\n<p>问题是，所有层共用同一条残差流。第 1 层写进去的信息，到第 60 层可能被后续层覆盖得差不多了。层与层之间也会互相干扰：某一层想保留的特征，可能被下一层的写入冲掉。<\/p>\n<h3>第二步：多几条残差流<\/h3>\n<p>mHC 把一条流扩成 <span class=\"katex-inline\">n=4<\/span> 条，记作矩阵 <span class=\"katex-inline\">X\\in\\mathbb{R}^{4\\times d}<\/span>，每一行是一条流。子层仍然处理拼接后的表示，输出也写成 4 条流。层间混合不再用“直接相加”，而是用一个 <span class=\"katex-inline\">4\\times4<\/span> 矩阵 <span class=\"katex-inline\">M<\/span>：<\/p>\n<div class=\"katex-block\">X_{\\text{out}}=M X_{\\text{in}}+F(X_{\\text{in}})<\/div>\n<p><span class=\"katex-inline\">M_{ij}<\/span> 表示“第 <span class=\"katex-inline\">j<\/span> 条输入流有多少比例进入第 <span class=\"katex-inline\">i<\/span> 条输出流”。这样模型可以学“哪些流该合并、哪些该分开”。<\/p>\n<h3>第三步：为什么不能随便学 M<\/h3>\n<p>如果 <span class=\"katex-inline\">M<\/span> 没有任何约束，训练可能学到很大的元素，导致：<\/p>\n<ul><li>\n某条流的数值被放大，深层爆炸。\n<\/li><li>\n某条流被完全忽略，等于白扩。\n<\/li><li>\n不同层之间的尺度漂移，训练不稳。\n<\/ul>\n<p>所以 mHC 把 <span class=\"katex-inline\">M<\/span> 约束为<strong>双随机矩阵<\/strong>（doubly stochastic）：<\/p>\n<ol><li>\n所有元素非负：<span class=\"katex-inline\">M_{ij}\\ge 0<\/span>。\n<\/li><li>\n每行和为 1：<span class=\"katex-inline\">\\sum_j M_{ij}=1<\/span>。\n<\/li><li>\n每列和为 1：<span class=\"katex-inline\">\\sum_i M_{ij}=1<\/span>。\n<\/ol>\n<p>这保证 <span class=\"katex-inline\">M<\/span> 是一个“凸组合 + 置换”的混合：输出的每条流都是输入流的加权平均，总信号既不放大也不缩小。<\/p>\n<h3>第四步：Sinkhorn 怎么把矩阵投影回约束<\/h3>\n<p>训练时 <span class=\"katex-inline\">M<\/span> 由参数算出，不天然满足双随机。Sinkhorn-Knopp 迭代做交替归一化：<\/p>\n<ol><li>\n每行除以行和，让行和为 1。\n<\/li><li>\n每列除以列和，让列和为 1。\n<\/li><li>\n重复。\n<\/ol>\n<p>拿一个 2×2 的例子：<\/p>\n<div class=\"katex-block\">M=\\begin{bmatrix}2 & 1\\\\1 & 2\\end{bmatrix}<\/div>\n<p>第一步行归一化：<\/p>\n<div class=\"katex-block\">\\begin{bmatrix}2/3 & 1/3\\\\1/3 & 2/3\\end{bmatrix}<\/div>\n<p>行和已经为 1，列和也是 1（<span class=\"katex-inline\">2/3+1/3=1<\/span>），一次就收敛。再看一个不对称的：<\/p>\n<div class=\"katex-block\">M=\\begin{bmatrix}1 & 2\\\\3 & 4\\end{bmatrix}<\/div>\n<p>行归一化：<\/p>\n<div class=\"katex-block\">\\begin{bmatrix}1/3 & 2/3\\\\3/7 & 4/7\\end{bmatrix}<\/div>\n<p>列和：第一列 <span class=\"katex-inline\">1/3+3/7\\approx0.333+0.429=0.762<\/span>，第二列 <span class=\"katex-inline\">2/3+4/7\\approx0.667+0.571=1.238<\/span>。不满足，继续列归一化、行归一化，反复迭代，最终逼近双随机。V4 迭代 20 次，足够稳定。<\/p>\n<h3>第五步：数值感受稳定性<\/h3>\n<p>假设输入两条流都是 1，<span class=\"katex-inline\">M<\/span> 是双随机：<\/p>\n<div class=\"katex-block\">X_{\\text{out}}=M\\begin{bmatrix}1\\\\1\\end{bmatrix}=\\begin{bmatrix}1\\\\1\\end{bmatrix}<\/div>\n<p>因为每行和为 1，输出每条流仍是 1，总和不放大。如果 <span class=\"katex-inline\">M<\/span> 不受约束，比如 <span class=\"katex-inline\">\\begin{bmatrix}10 &amp; 0\\\\0 &amp; 1\\end{bmatrix}<\/span>，输出第一条流变成 10，信号放大 10 倍，深层容易爆炸。<\/p>\n<h3>第六步：代价与优化<\/h3>\n<p>4 条流意味着 4 倍的激活存储和跨层通信。V4 用融合核、选择性重计算、DualPipe 调整，把额外开销压到流水线阶段的 6.7%。V4.1 的 Single-Pass mHC 把多个 kernel 合成一个，激活访存减半。<\/p>\n<h3>差生检查<\/h3>\n<ul><li>\n矩阵、行和、列和都给了具体数字。\n<\/li><li>\nSinkhorn 的每一步都能手算复核。\n<\/li><li>\n解释了“为什么需要约束”，并用反例说明不约束会放大信号。\n<\/li><li>\n区分了算法收益和工程代价。\n<\/ul>\n<h3>前置与后续<\/h3>\n<ul><li>\n前置：矩阵乘法、残差连接（第 1、4 章）\n<\/li><li>\n后续：Sinkhorn、V4 训练稳定性（ch08）、Single-Pass mHC（ch09）\n<\/ul><\/div><\/details>", "c25": "<div class=\"source-badge\">📖 出处：DeepSeek-V4 技术报告 §2.4<\/div><h1>Muon 优化器<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 8 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>Muon 是一种矩阵级优化器：先用 Newton-Schulz 迭代把梯度矩阵正交化，再做带动量和权重衰减的更新。<\/p>\n<h2>为什么重要<\/h2>\n<p>V4 大部分参数改用 Muon，是训练更快、更稳的关键。它和 AdamW 的区别，是“逐元素自适应”与“矩阵整体正交化”的区别。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  G[&quot;梯度矩阵 G&quot;] --&gt; N[&quot;Newton-Schulz：奇异值拉向 1&quot;]\n  N --&gt; O[&quot;正交化梯度&quot;]\n  O --&gt; M[&quot;动量 + 权重衰减&quot;]\n  M --&gt; U[&quot;参数更新&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>AdamW 对每个参数维护一阶、二阶矩，逐元素缩放。Muon 把参数矩阵的梯度当成整体，做多项式迭代：<\/p>\n<div class=\"katex-block\">G_{k+1}=aG_k+bG_kG_k^TG_k+c(G_kG_k^T)^2G_k<\/div>\n<p>V4 的 Newton-Schulz 分两段：前 8 步用系数 <span class=\"katex-inline\">(3.4445,-4.7750,2.0315)<\/span> 快速收敛，后 2 步用 <span class=\"katex-inline\">(2,-1.5,0.5)<\/span> 把奇异值稳定在 1。<\/p>\n<p>配置：动量 0.95，权重衰减 0.1，更新矩阵 RMS 缩放到 0.18。Embedding、输出头、RMSNorm 仍用 AdamW。<\/p>\n<p>分布式难点：Muon 需要完整梯度矩阵，和 ZeRO 的分片逻辑冲突。V4 用混合 ZeRO：稠密参数背包分配，MoE 参数按专家展平分配，并在多余数据并行组里冗余计算。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\nMuon 不是“另一个 AdamW”，它作用于矩阵整体，不是逐元素。\n<\/li><li>\n正交化不是“把梯度变成单位矩阵”，是把奇异值拉到接近 1，保留方向信息。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch08<\/td><td>V4<\/td><td>大多数模块用 Muon<\/td><\/tr><tr><td>ch09<\/td><td>V4.1<\/td><td>继续使用，适配 Engram<\/td><\/tr><tr><td>ch11<\/td><td>训练<\/td><td>优化器与架构共同影响稳定性<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：梯度下降、矩阵乘法\n<\/li><li>\n后续：Newton-Schulz、ZeRO\n<\/ul>", "c26": "<div class=\"source-badge\">📖 出处：DeepSeek-V4.1-Flash 论文 §2.2<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/deepseek-papers/concept/c28\">SWA（滑动窗口注意力）<\/a><\/span><\/div><h1>CED（因果编码器—解码器）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 9 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>CED 把 Transformer 分成前半编码器和后半解码器：解码器的全局 KV 直接从编码器末端隐藏状态投影，不再逐层计算。<\/p>\n<h2>为什么重要<\/h2>\n<p>它让 V4.1 的 prefill 只激活 8B 参数，decode 激活 16B，直接针对智能体“输入重、输出轻”的负载。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[&quot;输入 token&quot;] --&gt; B[&quot;编码器 20 层&quot;]\n  B --&gt; C[&quot;H20&quot;]\n  C --&gt; D[&quot;投影出解码器全局 KV&quot;]\n  C --&gt; E[&quot;解码器 20 层：SWA 逐层 + 全局 KV 复用&quot;]\n  E --&gt; F[&quot;输出&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>标准 Transformer 每层都用自己的隐藏状态生成 K/V。CED 规定，对 <span class=\"katex-inline\">l&gt;L/2<\/span> 的解码器层：<\/p>\n<div class=\"katex-block\">C_l=H_{L/2}W_l^{KV},\\quad Z_l=H_{L/2}W_l^{Z}<\/div>\n<p><span class=\"katex-inline\">H_{L/2}<\/span> 是编码器最后一层的隐藏状态，<span class=\"katex-inline\">W_l^{KV}<\/span>、<span class=\"katex-inline\">W_l^{Z}<\/span> 是每层独立的投影。这样 prefill 只需算前一半层，后一半的全局 KV 一次投影出来。<\/p>\n<p>局部 SWA 仍逐层算，因为局部细节依赖每层自己的表示。为避免回放成本，CED 用 Decoder SWA Bounded Replay：只回放最近 <span class=\"katex-inline\">n_{\\text{win}}=128<\/span> 个 token。<\/p>\n<p>复杂度：prefill 从 <span class=\"katex-inline\">O(NL)<\/span> 降到 <span class=\"katex-inline\">O(NL/2+n_{\\text{win}}L/2)<\/span>，近似减半。<\/p>\n<p>为什么 decode 激活更多：生成每个 token 时，解码器 20 层全部参与，参数回到完整规模。所以“prefill 8B / decode 16B”不是两个模型，是同一模型的不同阶段。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\nCED 不是“编码器只处理输入、解码器只处理输出”的简单分工，关键是 KV 的投影路径。\n<\/li><li>\nCED 不是“完全不用算后 20 层”，decode 阶段后 20 层照常参与。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch09<\/td><td>V4.1<\/td><td>20 编码 + 20 解码<\/td><\/tr><tr><td>ch10<\/td><td>架构对比<\/td><td>非对称计算<\/td><\/tr><tr><td>ch11<\/td><td>部署<\/td><td>prefill/decode 成本分离<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：Transformer 层、KV cache\n<\/li><li>\n后续：SWA Bounded Replay、CSA2\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（CED（因果编码器—解码器））<\/summary><div class=\"depth-body\"><h2>🔬 CED 的第一性原理推导：为什么 prefill 能只算一半<\/h2>\n<h3>第一步：prefill 和 decode 是两笔不同的账<\/h3>\n<p>生成一段回答分两个阶段：<\/p>\n<ul><li>\n<strong>prefill<\/strong>：把整段输入一次性读进模型，算出所有层、所有位置的 KV cache。这个阶段并行度高，计算量大。\n<\/li><li>\n<strong>decode<\/strong>：每生成一个新 token，读已有 KV cache，算出下一个 token。这个阶段每步只算一个 token，受显存带宽限制。\n<\/ul>\n<p>智能体场景输入很长、输出很短，prefill 占大头。CED 就是针对 prefill 动刀。<\/p>\n<h3>第二步：标准 Transformer 的 prefill 为什么贵<\/h3>\n<p>40 层的模型，每一层都要：<\/p>\n<ol><li>\n用自己的隐藏状态算 K、V。\n<\/li><li>\n把 K、V 写入 cache。\n<\/li><li>\n做注意力。\n<\/ol>\n<p>prefill 的计算量大致是 <span class=\"katex-inline\">O(NL)<\/span>：<span class=\"katex-inline\">N<\/span> 是输入长度，<span class=\"katex-inline\">L<\/span> 是层数。<span class=\"katex-inline\">N=100<\/span> 万、<span class=\"katex-inline\">L=40<\/span> 时，这个数字非常大。<\/p>\n<h3>第三步：CED 把后 20 层的 KV 一次性投影出来<\/h3>\n<p>CED 把 40 层分成两半：前 20 层编码器，后 20 层解码器。对解码器层 <span class=\"katex-inline\">l&gt;20<\/span>：<\/p>\n<div class=\"katex-block\">C_l=H_{20}W_l^{KV},\\quad Z_l=H_{20}W_l^{Z}<\/div>\n<p><span class=\"katex-inline\">H_{20}<\/span> 是编码器最后一层的隐藏状态。也就是说，解码器的全局 KV 不再由每层自己的隐藏状态逐层生成，而是从 <span class=\"katex-inline\">H_{20}<\/span> 用每层独立的投影矩阵一次性算出来。<\/p>\n<p>prefill 只需要算前 20 层，后 20 层的全局 KV 一次矩阵乘法就得到。计算量近似减半：<\/p>\n<div class=\"katex-block\">O(NL)\\rightarrow O(NL/2+n_{\\text{win}}L/2)<\/div>\n<p><span class=\"katex-inline\">n_{\\text{win}}=128<\/span> 是滑动窗口长度，第二项是局部 SWA 的回放成本。<span class=\"katex-inline\">N\\gg n_{\\text{win}}<\/span> 时，第二项可以忽略。<\/p>\n<h3>第四步：为什么局部 SWA 不能也省掉<\/h3>\n<p>全局 KV 可以从 <span class=\"katex-inline\">H_{20}<\/span> 投影，但 SWA 的 KV 依赖每层自己的局部表示。如果也省掉，后 20 层看不到最近的词，局部细节（相邻词、标点、代码缩进）会丢失。<\/p>\n<p>完全重建 SWA 需要回放 <span class=\"katex-inline\">L/2\\times n_{\\text{win}}<\/span> 个 token，成本不小。CED 用 <strong>Decoder SWA Bounded Replay<\/strong>：只回放最近 <span class=\"katex-inline\">n_{\\text{win}}=128<\/span> 个 token，而不是整个窗口 × 层数。论文说精度损失可忽略。<\/p>\n<h3>第五步：数值感受<\/h3>\n<p>假设 40 层，输入 100 万 token。标准 prefill 要算 40 层；CED 只算 20 层编码器 + 少量 SWA 回放，计算量约 50%。后 20 层的全局 KV 用 20 次投影矩阵乘 <span class=\"katex-inline\">H_{20}<\/span>，相比逐层注意力，成本很小。<\/p>\n<p>激活参数：prefill 时只走编码器路径，约 8B；decode 时 20 层解码器全部参与，回到 16B。这不是两个模型，是同一模型在不同阶段激活不同子集。<\/p>\n<h3>第六步：代价和边界<\/h3>\n<ul><li>\n解码器全局 KV 全部来自 <span class=\"katex-inline\">H_{20}<\/span>，表达能力受编码器末端表示限制。论文用每层独立投影和训练补偿。\n<\/li><li>\nSWA 回放仍有成本，短输入、多轮对话时更明显。\n<\/li><li>\nCED 让训练和推理的流水线更复杂，跨阶段共享状态管理是工程难点。\n<\/li><li>\ndecode 阶段并没有省，16B 激活是实打实的。\n<\/ul>\n<h3>差生检查<\/h3>\n<ul><li>\nprefill/decode 的区别先用白话讲清。\n<\/li><li>\n复杂度公式里的 <span class=\"katex-inline\">N<\/span>、<span class=\"katex-inline\">L<\/span>、<span class=\"katex-inline\">n_{\\text{win}}<\/span> 都解释了。\n<\/li><li>\n数值例子说明“约一半”从哪来。\n<\/li><li>\n解释了“为什么 decode 仍是 16B”，避免误解成两个模型。\n<\/ul>\n<h3>前置与后续<\/h3>\n<ul><li>\n前置：Transformer 层、KV cache、自回归生成（第 4、5 章）\n<\/li><li>\n后续：CSA2（ch09）、SWA Bounded Replay（ch09）\n<\/ul><\/div><\/details>", "c27": "<div class=\"source-badge\">📖 出处：DeepSeek-V4.1-Flash 论文 §2.3<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/deepseek-papers/concept/c22\">CSA（压缩稀疏注意力）<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/deepseek-papers/concept/c23\">HCA（重度压缩注意力）<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/deepseek-papers/concept/c26\">CED（因果编码器—解码器）<\/a><\/span><\/div><h1>CSA2（压缩稀疏注意力 2）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 9 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>CSA2 在 CSA 的基础上增加跨层复用：主 KV、索引器 K、top-k 索引都可以从前面层继承，层与层之间不再各存一份。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是 V4.1 把全局 KV 压到 890 B/token 的核心。没有跨层复用，FP4 和 CED 也到不了这个量级。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  F[&quot;Full：算主 KV + 索引 K + top-k&quot;] --&gt; R1[&quot;Reindex：复用 KV，重算 top-k&quot;]\n  R1 --&gt; R2[&quot;Reuse：复用 KV + top-k&quot;]\n  R2 --&gt; R3[&quot;Reuse：继续复用&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>三种模式：<\/p>\n<ul><li>\n<strong>Full<\/strong>：完整路径。生成本层主 KV、索引器 K，跑索引器，选 top-k。\n<\/li><li>\n<strong>Reindex<\/strong>：复用前层主 KV 和索引器 K，用自己的索引 Q 重新打分，选新 top-k。KV 共享，选择可变。\n<\/li><li>\n<strong>Reuse<\/strong>：复用前层主 KV 和 top-k 索引，不跑索引器，直接做注意力。\n<\/ul>\n<p>V4.1 的排布：<\/p>\n<ul><li>\n编码器：18 层 CSA2，m=2，每 6 层一组，1 Full + 5 Reuse。\n<\/li><li>\n解码器：20 层 CSA2，m=1，每 4 层一组，首组 1 Full + 3 Reuse，后四组 1 Reindex + 3 Reuse。\n<\/ul>\n<p>另外两个简化：去掉 CSA 的重叠压缩和绝对位置嵌入；索引器 K 直接从主 KV 投影，不再单独压缩。<\/p>\n<p>分层稀疏索引器：解码器第一个 Full 层建 2048 块 × 8 位置的候选池（16384 个候选），后续 Reindex 只在池里选 top-512，成本从线性变常数。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\nCSA2 不是“每层都不算 KV”，Full 层仍然完整计算。\n<\/li><li>\nReuse 不是“完全复制前层输出”，每层仍算自己的 Q 和 SWA KV。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch09<\/td><td>V4.1<\/td><td>三模式 + 分层索引器<\/td><\/tr><tr><td>ch10<\/td><td>架构演进<\/td><td>压缩从序列维扩展到层维<\/td><\/tr><tr><td>ch11<\/td><td>部署<\/td><td>减少 KV 存储与索引计算<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：CSA、KV cache\n<\/li><li>\n后续：FP4 KV、持久缓存\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（CSA2（压缩稀疏注意力 2））<\/summary><div class=\"depth-body\"><h2>🔬 CSA2 的第一性原理推导：把“层”也当成一个可以压缩的维度<\/h2>\n<h3>第一步：KV cache 的三个压缩维度<\/h3>\n<p>长上下文缓存可以从三个方向压：<\/p>\n<ol><li>\n<strong>条目大小<\/strong>：每个 KV 条目用多少个数、多少位。GQA 减少 KV 头数，MLA 用低秩潜向量，FP4 降低位宽。\n<\/li><li>\n<strong>序列长度<\/strong>：每 <span class=\"katex-inline\">m<\/span> 个 token 压成 1 条。CSA 的 4:1、HCA 的 128:1 属于这一类。\n<\/li><li>\n<strong>层数<\/strong>：相邻层共用同一份 KV，不再每层存一份。CSA2 的跨层复用属于这一类。\n<\/ol>\n<p>V4 已经用了前两个维度，V4.1 把第三个维度也用上，三个维度相乘，才有 890 B/token。<\/p>\n<h3>第二步：相邻层的 KV 有多像<\/h3>\n<p>Transformer 每层的 KV 由该层隐藏状态投影而来。相邻层的表示高度相关，尤其是深层。既然相似，就没必要每层都存一份完整的全局 KV。<\/p>\n<p>CSA2 让一部分层只读不写：从前面层继承主 KV 和索引器 K，自己只算 query 和 SWA KV。<\/p>\n<h3>第三步：三种模式的分工<\/h3>\n<ul><li>\n<strong>Full<\/strong>：完整计算，写主 KV、索引器 K，跑索引器选 top-k。它是“生产者”。\n<\/li><li>\n<strong>Reindex<\/strong>：复用生产者的主 KV 和索引器 K，但用自己的索引 Q 重新打分，选新的 top-k。它共享存储，但保留“选择变化”的能力。\n<\/li><li>\n<strong>Reuse<\/strong>：连 top-k 索引也复用，直接做注意力。它是“纯消费者”，最省。\n<\/ul>\n<p>V4.1 编码器每 6 层一组：1 个 Full + 5 个 Reuse。解码器每 4 层一组：首组 1 Full + 3 Reuse，后四组 1 Reindex + 3 Reuse。<\/p>\n<h3>第四步：存储账怎么算<\/h3>\n<p>假设一个 6 层组，只有 1 层 Full 写全局 KV，其余 5 层复用。全局 KV 存储从 6 份变成 1 份：<\/p>\n<div class=\"katex-block\">\\text{存储降幅}=\\frac{6}{1}=6\\ \\text{倍}<\/div>\n<p>解码器 20 层，只有 1 层 Full 写全局 KV（首组第一层），其余 19 层复用；4 个 Reindex 层只重算索引，不写 KV。全局 KV 存储接近 1/20。再叠加 FP4（相对 FP16 再降 4 倍），就能到 890 B/token。<\/p>\n<p>注意：SWA 的 KV 每层都要算、都要存，不在这个账里。所以“1/20”只指全局 KV，不是全部缓存。<\/p>\n<h3>第五步：索引器成本怎么变常数<\/h3>\n<p>问题：即使 KV 共享，Reindex 层仍要对自己的 Q 和全部索引 K 打分，成本随上下文线性增长。<\/p>\n<p>分层稀疏索引器：解码器第一个 Full 层先选 2048 个块，每块 8 个位置，共 16384 个候选。后面的 Reindex 只在这 16384 个候选里选 top-512，不再对 100 万条全扫。<\/p>\n<p>成本对比：<\/p>\n<ul><li>\n全扫：每个 query 打 100 万分。\n<\/li><li>\n分层：第一个 Full 层打 100 万分，后面每层只打 16384 分。\n<\/ul>\n<p>对深层来说，成本从 <span class=\"katex-inline\">O(N)<\/span> 变成 <span class=\"katex-inline\">O(1)<\/span>（相对上下文长度）。<\/p>\n<h3>第六步：三个维度相乘<\/h3>\n<p>以 V4-Flash 的 3514 B/token 为起点：<\/p>\n<ul><li>\n跨层复用：全局 KV 存储大幅下降。\n<\/li><li>\nFP4：每个数从 16 位降到 4 位，约 1/4。\n<\/li><li>\nCED：解码器全局 KV 只存一份，不再逐层。\n<\/ul>\n<p>三者相乘，得到 890 B/token。论文说约是 V4-Flash 的 1/4，和这个量级吻合。<\/p>\n<h3>差生检查<\/h3>\n<ul><li>\n三个压缩维度用白话分开讲，不混在一起。\n<\/li><li>\n6 层组的存储账可以用除法复核。\n<\/li><li>\n分层索引器的候选数 2048×8=16384 明确写出。\n<\/li><li>\n强调 890 B/token 只指全局 KV，避免误解为全部缓存。\n<\/ul>\n<h3>前置与后续<\/h3>\n<ul><li>\n前置：CSA、KV cache、softmax（第 5、8 章）\n<\/li><li>\n后续：FP4（ch09）、持久 KV cache（ch09）\n<\/ul><\/div><\/details>", "c28": "<div class=\"source-badge\">📖 出处：DeepSeek-V4/V4.1 技术报告<\/div><h1>SWA（滑动窗口注意力）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 8 章、第 9 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>SWA 让每个 token 只看最近固定窗口内的 token，窗口外的历史不参与注意力。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是长上下文模型的“局部视野”分支。CSA/HCA 负责远端压缩，SWA 负责最近细节，两者缺一不可。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  T[&quot;当前 token&quot;] --&gt; W[&quot;最近 128 个 token&quot;]\n  W --&gt; A[&quot;局部注意力&quot;]\n  T --&gt; G[&quot;CSA/HCA 全局分支&quot;]\n  A --&gt; O[&quot;合并输出&quot;]\n  G --&gt; O<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>标准注意力看全部历史，SWA 只保留最近 <span class=\"katex-inline\">n_{\\text{win}}<\/span> 个 token 的 KV。V4/V4.1 的窗口都是 128。<\/p>\n<p>作用：<\/p>\n<ul><li>\n保证局部细节不被压缩抹掉，比如相邻词、标点、代码缩进。\n<\/li><li>\n严格保持因果性：压缩块内的 token 互相看不见，SWA 补上这段局部信息。\n<\/li><li>\n降低缓存：只需存最近 128 个 token 的 KV，不用存全部。\n<\/ul>\n<p>V4.1 进一步用 <strong>SWA Bounded Replay<\/strong>：持久缓存不存 SWA，命中前缀时只回放最近 128 个 token 重建，不再回放整个窗口 × 层数。论文说精度损失可忽略。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\nSWA 不是“只看 128 个 token 就完了”，它和全局分支叠加使用。\n<\/li><li>\nSWA 不是“不需要位置编码”，窗口内的位置关系仍要编码。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch08<\/td><td>V4<\/td><td>每层附加 128 窗口分支<\/td><\/tr><tr><td>ch09<\/td><td>V4.1<\/td><td>前 2 层纯 SWA，其余层叠加<\/td><\/tr><tr><td>ch10<\/td><td>架构对比<\/td><td>局部视野的稳定角色<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：注意力、因果掩码\n<\/li><li>\n后续：SWA Bounded Replay、KV cache\n<\/ul>", "c29": "<div class=\"source-badge\">📖 出处：DeepSeek-V4.1-Flash 论文 §2.4.2<\/div><h1>Engram（条件记忆）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 9 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>Engram 是一个通过哈希查表的条件记忆模块，把“记事实、记搭配”从矩阵计算里拆出来，用 <span class=\"katex-inline\">O(1)<\/span> 的查表完成。<\/p>\n<h2>为什么重要<\/h2>\n<p>V4.1 用 196B 参数的 Engram 增强模型能力，却不增加每 token 的矩阵计算量。这是“参数多、算力省”的另一种解法，和 MoE 不同。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  T[&quot;输入 token&quot;] --&gt; N[&quot;N-gram 压缩（2/3/4 阶）&quot;]\n  N --&gt; H[&quot;8 个哈希头&quot;]\n  H --&gt; E[&quot;约 1600 万条目的表&quot;]\n  E --&gt; G[&quot;门控&quot;]\n  G --&gt; M[&quot;注入主干&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>流程：<\/p>\n<ol><li>\n对输入 token 序列做 N-gram 组合（2、3、4 阶），得到短语级键。\n<\/li><li>\n每个键用 8 个哈希头映射到 8 张表，每张约 1600 万条目。\n<\/li><li>\n查到嵌入向量，经上下文感知门控后注入主干。\n<\/ol>\n<p>参数：196B，平均分到两个模块，放在第 1 层和第 14 层。每阶嵌入维度 2048，表项用 FP8 存。<\/p>\n<p>为什么省算力：查表是内存访问，不是矩阵乘法。模型可以把“固定搭配、事实、术语”存进 Engram，把计算留给推理和组合。<\/p>\n<p>为什么放两层：平衡流水线显存。放一层，那一层压力太大；放太深，对早层表示影响小。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\nEngram 不是 MoE 专家，它不参与路由，也不做 FFN 计算。\n<\/li><li>\nEngram 不是“外挂知识库”，它是模型参数的一部分，随训练更新。\n<\/li><li>\n查表不等于“不会泛化”，哈希碰撞和门控让它在相似上下文里仍能组合。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch09<\/td><td>V4.1<\/td><td>196B 参数，第 1、14 层<\/td><\/tr><tr><td>ch10<\/td><td>架构对比<\/td><td>记忆与计算解耦<\/td><\/tr><tr><td>ch11<\/td><td>部署<\/td><td>主机内存预取<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：embedding、MoE\n<\/li><li>\n后续：条件记忆、FP8\n<\/ul>", "c30": "<div class=\"source-badge\">📖 出处：DeepSeek-V4.1-Flash 论文 §2.4.3<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/deepseek-papers/concept/c28\">SWA（滑动窗口注意力）<\/a><\/span><\/div><h1>DSpark（投机解码）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 9 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>DSpark 是 V4.1 独立训练的投机解码模块：用一个小 drafter 一次猜多个 token，再由主模型按置信度验证接受。<\/p>\n<h2>为什么重要<\/h2>\n<p>decode 阶段每步只生成一个 token，GPU 利用率低。DSpark 用“先猜后验”把多步合并，降低长上下文生成的延迟。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">sequenceDiagram\n  participant D as DSpark drafter\n  participant M as 主模型\n  D-&gt;&gt;D: 3 层 Transformer，并行出 5 个草稿\n  D-&gt;&gt;M: 提交草稿\n  M-&gt;&gt;M: 并行验证\n  M-&gt;&gt;D: 接受匹配前缀，拒绝其余<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>结构：3 个 Transformer 块，滑动窗口 128。一次前向并行给出 5 个草稿位置的 logits，半自回归生成草稿。<\/p>\n<p>验证：主模型对草稿做并行前向，按置信度调度决定接受多少。匹配的前缀直接接受，第一个不匹配的位置由主模型纠正。<\/p>\n<p>训练：DSpark 在主干预训练之后单独训练，不参与主干梯度。V4.1 主干预训练时甚至不用 MTP，把投机解码完全交给 DSpark。<\/p>\n<p>为什么有效：decode 是显存带宽瓶颈，一次验证多个 token 能把带宽摊薄。草稿接受率越高，加速越明显。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\nDSpark 不是 MTP，MTP 是主干上的辅助训练头，DSpark 是独立 drafter。\n<\/li><li>\n投机解码不是“一定变快”，草稿接受率低时，验证成本会吃掉收益。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch09<\/td><td>V4.1<\/td><td>独立训练，5 个草稿位置<\/td><\/tr><tr><td>ch10<\/td><td>架构对比<\/td><td>推理加速路线<\/td><\/tr><tr><td>ch11<\/td><td>部署<\/td><td>长上下文 decode 优化<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：自回归生成、MTP\n<\/li><li>\n后续：投机解码、置信度验证\n<\/ul>", "c31": "<div class=\"source-badge\">📖 出处：DeepSeek-V4/V4.1 技术报告<\/div><h1>FP4 量化<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 9 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>FP4 用 4 位浮点数表示权重或 KV cache，把存储和带宽压到 FP16 的约四分之一，代价是精度损失。<\/p>\n<h2>为什么重要<\/h2>\n<p>V4.1 的 890 B/token 全局 KV，很大一部分来自 FP4。没有它，CSA2 的跨层复用也压不到这个量级。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[&quot;FP16：16 位/数&quot;] --&gt; B[&quot;FP8：8 位/数&quot;]\n  B --&gt; C[&quot;FP4：4 位/数&quot;]\n  C --&gt; D[&quot;存储 1/4，带宽 1/4&quot;]\n  D --&gt; E[&quot;精度损失需训练补偿&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>V4.1 的使用位置：<\/p>\n<ul><li>\n主 KV cache 用 FP4。\n<\/li><li>\nEngram 表和键值投影用 FP8。\n<\/li><li>\n视觉模块用 FP8。\n<\/li><li>\nMoE 专家权重在 V4 后训练阶段做 FP4 量化感知训练。\n<\/ul>\n<p>为什么能压：浮点数的位宽决定动态范围和精度。FP4 只有 4 位，表示范围很窄，需要缩放因子（scale）把数值映射到合适区间。缩放因子的选择决定量化误差。<\/p>\n<p>风险：长上下文里，KV 的微小误差会累积；注意力对异常值敏感。论文用训练补偿和混合精度（RoPE 维度保留 BF16）降低风险。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\nFP4 不是“把数直接截断”，需要缩放和量化策略。\n<\/li><li>\nFP4 不是“所有部分都用”，关键位置仍保留更高精度。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch08<\/td><td>V4<\/td><td>MoE 专家与索引器 QK 做 FP4 QAT<\/td><\/tr><tr><td>ch09<\/td><td>V4.1<\/td><td>主 KV 用 FP4<\/td><\/tr><tr><td>ch11<\/td><td>部署<\/td><td>精度与成本的取舍<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：KV cache、矩阵乘法\n<\/li><li>\n后续：量化感知训练、混合精度\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：R1 上：问题、R1-Zero、GRPO<\/strong><br>阅读：<a href=\"#/book/deepseek-papers/chapter/ch06\">第 6 章：R1 论文拆解（上）：先学会读论文，再看 R1-Zero<\/a><br>检查点：能复述 GRPO 的采样、奖励、优势计算<\/li><li class='path-step' id='path-02'><strong>步骤 02：R1 下：四阶段与蒸馏<\/strong><br>阅读：<a href=\"#/book/deepseek-papers/chapter/ch07\">第 7 章：R1 论文拆解（下）：四阶段流水线、蒸馏与局限<\/a><br>检查点：能画出 R1 完整训练流程并说出局限<\/li><li class='path-step' id='path-03'><strong>步骤 03：V4：CSA/HCA、mHC、Muon<\/strong><br>阅读：<a href=\"#/book/deepseek-papers/chapter/ch08\">第 8 章：V4 论文拆解：百万上下文的成本怎么砍<\/a><br>检查点：能说出 1M 上下文省的是哪两项成本<\/li><li class='path-step' id='path-04'><strong>步骤 04：V4.1：CED、CSA2、Engram、DSpark<\/strong><br>阅读：<a href=\"#/book/deepseek-papers/chapter/ch09\">第 9 章：V4.1 论文拆解：非对称 CED 与 KV cache 极限<\/a><br>检查点：能解释 prefill 8B 与 decode 16B 的来源<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 6 章：R1 论文拆解（上）：先学会读论文，再看 R1-Zero<\/h2><div class='quiz-item' data-qid='ch06-q0
