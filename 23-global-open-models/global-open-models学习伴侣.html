t{GB}<\/div>\n<p>（实际 GQA 会小很多；这里用 MHA 说明量级。）<\/p>\n<h3>SSM<\/h3>\n<p>状态 <span class=\"katex-inline\">h<\/span> 的维度是固定的（比如 16–128），每层只存 <span class=\"katex-inline\">O(d h)<\/span>，与 <span class=\"katex-inline\">n<\/span> 无关。128K 序列的显存不会按 128K 线性涨。<\/p>\n<p><strong>但<\/strong>：状态容量固定，早期细节会丢。混合架构就是“大部分层用 SSM/线性，少数层用全注意力”。<\/p>\n<h2>10.7 常见误解<\/h2>\n<ul><li>\n<strong>“线性注意力一定比 Transformer 快。”<\/strong> 短序列、训练前期、核函数开销可能吃掉收益；长序列、大 batch 才明显。\n<\/li><li>\n<strong>“Mamba 没有注意力，所以不能检索。”<\/strong> 它有意选择性状态，能记住一部分；只是不能精确回看所有位置。\n<\/li><li>\n<strong>“Jamba 是纯 Mamba。”<\/strong> 它是 Transformer + Mamba 混合。\n<\/li><li>\n<strong>“Kimi K3 是 96 个 KV 头的 MHA。”<\/strong> 它用线性/混合注意力，KV 增长方式不同；96 是 Q 头数，不等于每层都存 96 组 KV。\n<\/li><li>\n<strong>“非 Transformer 一定更省显存。”<\/strong> 权重可能更大，训练并行更复杂；省的是长序列的激活/KV。\n<\/ul>\n<h2>10.8 自测<\/h2>\n<ol><li>\n写出 SSM 的递推式，并说明 <span class=\"katex-inline\">h_t<\/span> 的维度为什么不随序列长度涨。\n<\/li><li>\nRWKV 的 time-mix 和 channel-mix 各做什么？\n<\/li><li>\nJamba、Griffin、Falcon-H1 各自混合了什么？\n<\/li><li>\nKimi K3 和 Qwen3-Next 的混合注意力有什么共同点？\n<\/li><li>\n为什么纯线性模型在长上下文检索上可能弱于全注意力？\n<\/ol>\n<blockquote>参考答案：1）<span class=\"katex-inline\">h_t=Ah_{t-1}+Bx_t<\/span>，<span class=\"katex-inline\">y_t=Ch_t<\/span>；<span class=\"katex-inline\">h<\/span> 是固定维度状态；2）time-mix 沿时间递归混合历史，channel-mix 沿特征维做 FFN 式混合；3）Jamba=Transformer+Mamba，Griffin=RG-LRU+局部注意力，Falcon-H1=Mamba/Transformer 混合；4）大部分层线性、少量层全注意力；5）固定状态压缩了历史，不能精确回看任意位置。<\/blockquote>\n<h2>10.9 复习锚点<\/h2>\n<ul><li>\n三条路线：线性注意力、SSM、混合。\n<\/li><li>\nSSM 递推：<span class=\"katex-inline\">h_t=Ah_{t-1}+Bx_t<\/span>，<span class=\"katex-inline\">y_t=Ch_t<\/span>。\n<\/li><li>\nRWKV：time-mix + channel-mix。\n<\/li><li>\n混合代表：Jamba、Griffin、Falcon-H1、Kimi K3、Qwen3-Next。\n<\/li><li>\n下一章：MoE 世界，把“总参数/激活参数”彻底算清。\n<\/ul>", "kind": "chapter", "title": "第 10 章：非 Transformer：RWKV、Mamba、Jamba 与混合注意力"}, "ch11": {"html": "<div class=\"source-badge\">📖 出处：https://huggingface.co/models<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch04\">第 4 章：Qwen 家族：从 0.5B 到 2.4T-A95B 的缩放路线<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch09\">第 9 章：中国开放权重：GLM、Kimi、MiniMax、InternLM 与“多路线并行”<\/a><\/span><\/div><h1>第 11 章 MoE 世界：总参数、激活参数与路由的代价<\/h1>\n<blockquote>难度：中高 · 建议 80 分钟 · 前置：第 4、9、10 章<\/blockquote>\n<blockquote>学习目标：能区分总参数和激活参数；能算出 MoE 的激活比例；能说清 top-k、专家数、专家宽度、共享专家、专家并行的取舍；能对比 Mixtral、DeepSeek、Qwen、Llama 4、Mistral Large 4 的 MoE 设计。<\/blockquote>\n<h2>一句话核心<\/h2>\n<p>MoE 把 FFN 拆成多个专家，路由器只激活 top-k 个。<strong>总参数决定显存，激活参数决定每 token 算力。<\/strong> 这两个数字必须分开读；把 <code>2.4T-A95B<\/code> 读成“2.4T 激活”是这类模型最常见的误读。<\/p>\n<h2>11.1 基本公式<\/h2>\n<p>一个 MoE 层：<\/p>\n<div class=\"katex-block\">y=\\sum_{i\\in \\text{top-}k(g(x))} g_i(x)\\,E_i(x)<\/div>\n<ul><li>\n<span class=\"katex-inline\">E_i<\/span> 是第 <span class=\"katex-inline\">i<\/span> 个专家 FFN；\n<\/li><li>\n<span class=\"katex-inline\">g(x)<\/span> 是路由器输出的权重；\n<\/li><li>\ntop-k 只算 k 个专家。\n<\/ul>\n<p>总参数 ≈ 注意力 + embedding + 所有专家； 激活参数 ≈ 注意力 + embedding + top-k 个专家（+ 共享专家）。<\/p>\n<p>激活比例：<\/p>\n<div class=\"katex-block\">\\rho=\\frac{\\text{active}}{\\text{total}}<\/div>\n<p>Qwen3.8-2.4T-A95B：<span class=\"katex-inline\">\\rho=95/2400\\approx3.96\\%<\/span>。 Qwen3.5-397B-A17B：<span class=\"katex-inline\">\\rho=17/397\\approx4.28\\%<\/span>。 Llama 4 Scout：<span class=\"katex-inline\">\\rho=17/109\\approx15.6\\%<\/span>。 Mistral Large 4：<span class=\"katex-inline\">\\rho=52/1000\\approx5.2\\%<\/span>。<\/p>\n<blockquote>比例越低，容量/算力解耦越激进；但路由、通信、显存压力也越大。<\/blockquote>\n<h2>11.2 代表 MoE 对比<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>模型<\/th><th>总参/激活<\/th><th>层数<\/th><th>hidden<\/th><th>专家<\/th><th>top-k<\/th><th>专家宽度<\/th><th>上下文<\/th><th>备注<\/th><\/tr><\/thead><tbody><tr><td>Mixtral 8x7B<\/td><td>46.7B / 12.9B<\/td><td>32<\/td><td>4096<\/td><td>8<\/td><td>2<\/td><td>14336<\/td><td>32K<\/td><td>宽专家、少专家<\/td><\/tr><tr><td>Mixtral 8x22B<\/td><td>141B / 39B<\/td><td>56<\/td><td>6144<\/td><td>8<\/td><td>2<\/td><td>16384<\/td><td>64K<\/td><td>宽专家<\/td><\/tr><tr><td>DeepSeek V3<\/td><td>671B / 37B<\/td><td>61<\/td><td>7168<\/td><td>256 + 1 共享<\/td><td>8<\/td><td>2048<\/td><td>128K<\/td><td>MLA + MoE + MTP<\/td><\/tr><tr><td>Qwen3-235B-A22B<\/td><td>235B / 22B<\/td><td>94<\/td><td>4096<\/td><td>128<\/td><td>8<\/td><td>1536<\/td><td>40K+<\/td><td>GQA 4 KV<\/td><\/tr><tr><td>Qwen3.5-397B-A17B<\/td><td>397B / 17B<\/td><td>60<\/td><td>4096<\/td><td>512<\/td><td>10<\/td><td>1024<\/td><td>262K<\/td><td>窄专家、多专家<\/td><\/tr><tr><td>Qwen3.8-2.4T-A95B<\/td><td>2.4T / 95B<\/td><td>92<\/td><td>8192<\/td><td>512<\/td><td>10<\/td><td>2048<\/td><td>262K<\/td><td>当前最大之一<\/td><\/tr><tr><td>Llama 4 Scout<\/td><td>109B / 17B<\/td><td>48<\/td><td>5120<\/td><td>16<\/td><td>1?<\/td><td>8192<\/td><td>10M<\/td><td>宽专家、少专家<\/td><\/tr><tr><td>Llama 4 Maverick<\/td><td>400B / 17B<\/td><td>48<\/td><td>5120<\/td><td>128<\/td><td>1?<\/td><td>8192<\/td><td>1M<\/td><td>宽专家、多专家<\/td><\/tr><tr><td>Mistral Large 4<\/td><td>1T / 52B<\/td><td>72<\/td><td>6144<\/td><td>128 + 1 共享<\/td><td>4<\/td><td>6144<\/td><td>1M<\/td><td>MHA 64 KV<\/td><\/tr><tr><td>DBRX<\/td><td>132B / 36B<\/td><td>40<\/td><td>6144<\/td><td>16<\/td><td>4<\/td><td>10752?<\/td><td>32K<\/td><td>企业 MoE<\/td><\/tr><tr><td>Arctic<\/td><td>480B / 17B<\/td><td>—<\/td><td>—<\/td><td>128<\/td><td>2<\/td><td>—<\/td><td>32K<\/td><td>极低激活<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote>Llama 4 的 <code>num_experts_per_tok<\/code> 在 config 里可能写成 1 或由代码决定；官方模型卡的“17B 激活”是更可靠的口径。表中标 <code>1?<\/code> 表示不要把 config 的单个字段当唯一事实。<\/blockquote>\n<h2>11.3 三种设计哲学<\/h2>\n<h3>宽专家、少专家（Mixtral、Llama 4 Scout）<\/h3>\n<p>8–16 个专家，每个专家宽度 8192–16384，top-1/2。优点是专家并行通信少、单机友好；缺点是总参数不够大，容量扩展有限。<\/p>\n<h3>窄专家、多专家（Qwen3.5/3.8、DeepSeek、Kimi）<\/h3>\n<p>256–896 个专家，每个宽度 512–2048，top-8/10。优点是总容量大、路由细；缺点是要专家并行（EP），all-to-all 通信和负载均衡复杂。<\/p>\n<h3>折中（Mistral Large 4、DBRX、GLM）<\/h3>\n<p>64–128 个专家，宽度 2048–6144，top-4/8。比少专家更能扩容量，比多专家更好部署。<\/p>\n<h2>11.4 共享专家<\/h2>\n<p>DeepSeek、GLM、Mistral Large 4、MiniMax 等用“路由专家 + 共享专家”：<\/p>\n<ul><li>\n路由专家：每个 token 选 top-k，学专门知识；\n<\/li><li>\n共享专家：所有 token 都走，学通用知识。\n<\/ul>\n<p>共享专家能缓解“每个 token 都换专家导致通用能力碎片化”的问题。代价是共享专家的计算对所有 token 都发生，激活参数会涨一点。<\/p>\n<h2>11.5 手算：Qwen3.8-2.4T 的专家账<\/h2>\n<p>已知：92 层、hidden 8192、专家宽度 2048、512 专家、top-10。粗略每个专家的 SwiGLU 参数量：<\/p>\n<div class=\"katex-block\">3\\times d_{model}\\times d_{expert}\\\\=3\\times8192\\times2048\\\\\\approx50.3\\ \\text{M}<\/div>\n<p>512 个专家、92 层：<\/p>\n<div class=\"katex-block\">50.3\\text{M}\\times512\\times92\\\\\\approx2.37\\ \\text{T}<\/div>\n<p>和 2.4T 总参数同量级（还要加注意力/embedding）。每 token 激活 10 个专家：<\/p>\n<div class=\"katex-block\">50.3\\text{M}\\times10\\times92\\\\\\approx46.3\\ \\text{B}<\/div>\n<p>再加上注意力、embedding、共享专家/路由，接近 95B 激活。<strong>这就是“总参数 2.4T、激活 95B”的来源。<\/strong><\/p>\n<h2>11.6 代价：显存、通信、路由<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>代价<\/th><th>具体表现<\/th><th>缓解<\/th><\/tr><\/thead><tbody><tr><td>显存<\/td><td>所有专家都要装，总参数不等于激活<\/td><td>多卡 EP、量化、offload<\/td><\/tr><tr><td>通信<\/td><td>专家并行 all-to-all；每层都要路由<\/td><td>NVLink/高速互联、容量因子<\/td><\/tr><tr><td>路由<\/td><td>负载不均、专家塌缩、token 丢弃<\/td><td>负载均衡损失、容量因子、专家并行<\/td><\/tr><tr><td>微调<\/td><td>全专家微调贵；LoRA 只改部分<\/td><td>只调注意力/共享专家、QLoRA<\/td><\/tr><tr><td>长上下文<\/td><td>KV 仍按注意力头算，MoE 不省 KV<\/td><td>GQA/MLA、KV 量化、稀疏注意力<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>11.7 常见误解<\/h2>\n<ul><li>\n<strong>“MoE 比 dense 省显存。”<\/strong> 不，MoE 通常更费显存；省的是每 token 算力。\n<\/li><li>\n<strong>“总参数越大越强。”<\/strong> 路由训不好、数据不够，总参数大也会浪费。\n<\/li><li>\n<strong>“top-k 越大越好。”<\/strong> top-k 大，激活参数涨、通信涨；要跟专家数/宽度一起调。\n<\/li><li>\n<strong>“共享专家是多余的。”<\/strong> 它承担通用能力，去掉后路由专家容易碎片化。\n<\/li><li>\n<strong>“MoE 不需要 KV cache。”<\/strong> 注意力部分仍然要 KV；MoE 只改 FFN。\n<\/ul>\n<h2>11.8 自测<\/h2>\n<ol><li>\n用公式解释 <code>2.4T-A95B<\/code> 的含义。\n<\/li><li>\nMixtral 8x7B 为什么总参数 46.7B、激活 12.9B？\n<\/li><li>\nQwen3.5-397B-A17B 和 Qwen3.8-2.4T-A95B 的专家数、top-k、专家宽度各是多少？\n<\/li><li>\n共享专家解决什么问题？代价是什么？\n<\/li><li>\n为什么 MoE 的显存和算力账要分开算？\n<\/ol>\n<blockquote>参考答案：1）2.4T 总参数（显存），95B 每 token 激活（算力）；2）8 个专家都装，top-2 只算 2 个，加注意力/embedding；3）397B：512/top-10/1024；2.4T：512/top-10/2048；4）缓解通用能力碎片化；共享专家对所有 token 计算，激活略涨；5）权重全装 vs 每 token 只走部分专家。<\/blockquote>\n<h2>11.9 复习锚点<\/h2>\n<ul><li>\n总参数 = 显存；激活参数 = 算力。\n<\/li><li>\n激活比例：Qwen3.8 约 4%，Llama 4 Scout 约 15.6%，Mistral Large 4 约 5.2%。\n<\/li><li>\n三种哲学：宽少、窄多、折中。\n<\/li><li>\n共享专家：通用 + 路由分工。\n<\/li><li>\n代价：显存、EP 通信、路由均衡、微调。\n<\/li><li>\n下一章：多模态，把图像/音频 token 接进语言模型。\n<\/ul>", "kind": "chapter", "title": "第 11 章：MoE 世界：总参数、激活参数与路由的代价"}, "ch12": {"html": "<div class=\"source-badge\">📖 出处：https://huggingface.co/models<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch11\">第 11 章：MoE 世界：总参数、激活参数与路由的代价<\/a><\/span><\/div><h1>第 12 章 多模态开放模型：图像怎么变成 token<\/h1>\n<blockquote>难度：中高 · 建议 70 分钟 · 前置：第 4、6、11 章<\/blockquote>\n<blockquote>学习目标：能画出“视觉编码器 → 连接器 → 语言模型”的三段式；能区分早期融合、晚期融合、双系统；能算图像 patch 数与 token 预算；能列出 LLaVA、Qwen-VL、InternVL、Pixtral、Gemma 4、Llama 4、Janus 的差异。<\/blockquote>\n<h2>一句话核心<\/h2>\n<p>多模态不是“加一个 ViT”就完了。图像先被切成 patch，经视觉编码器变成特征，再由连接器压缩成若干 token，最后和文本 token 一起进语言模型。<strong>融合发生在哪一层、图像 token 压到多少、视觉塔训不训，决定了模型的能力和成本。<\/strong><\/p>\n<h2>12.1 三段式<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  I[图像 448x448] --&gt; P[切 patch 14x14]\n  P --&gt; V[ViT 编码器]\n  V --&gt; C[连接器 MLP/Resampler]\n  C --&gt; T[图像 token 256-1024 个]\n  X[文本 token] --&gt; L[语言模型]\n  T --&gt; L\n  L --&gt; O[输出]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h3>视觉编码器<\/h3>\n<p>常见是 ViT（CLIP/SigLIP/InternViT）。它把图像切成 <span class=\"katex-inline\">P\\times P<\/span> 的 patch，每个 patch 展平成向量，过若干 Transformer 层。输出 patch 特征。<\/p>\n<h3>连接器<\/h3>\n<ul><li>\n<strong>MLP<\/strong>：把每个 patch 特征线性投到语言模型维度；简单、token 多。\n<\/li><li>\n<strong>Resampler / Q-Former<\/strong>：用固定数量的查询向量把变长 patch 压成固定 token；省 token，但丢细节。\n<\/li><li>\n<strong>Cross-attention<\/strong>：语言模型层直接对视觉特征做交叉注意力；融合深，工程复杂。\n<\/ul>\n<h3>语言模型<\/h3>\n<p>图像 token 和文本 token 拼成一个序列，走同一个 decoder。图像 token 也占上下文、也进 KV cache。<\/p>\n<h2>12.2 四种融合路线<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>路线<\/th><th>代表<\/th><th>融合层<\/th><th>优点<\/th><th>缺点<\/th><\/tr><\/thead><tbody><tr><td>晚期融合 / 外挂<\/td><td>LLaVA、InternVL、Pixtral、MiniCPM-V<\/td><td>输入端拼 token<\/td><td>实现简单、可复用 LLM<\/td><td>视觉-语言交互浅<\/td><\/tr><tr><td>早期融合<\/td><td>Llama 4、Chameleon、Gemma 4 Unified<\/td><td>早期层拼 token<\/td><td>交互深、可统一训练<\/td><td>训练贵、数据配比难<\/td><\/tr><tr><td>双系统<\/td><td>Janus / Janus-Pro<\/td><td>理解头 + 生成头<\/td><td>理解与生成解耦<\/td><td>两套头、训练复杂<\/td><\/tr><tr><td>任意到任意<\/td><td>Gemma 4 12B、Qwen2.5-Omni、MiniCPM-o<\/td><td>文本/图/音统一序列<\/td><td>模态交互最全<\/td><td>token 预算、编码器多<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>12.3 代表模型<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>模型<\/th><th>视觉塔<\/th><th>连接器<\/th><th>语言模型<\/th><th>备注<\/th><\/tr><\/thead><tbody><tr><td>LLaVA-1.5 7B<\/td><td>CLIP ViT-L/14<\/td><td>2 层 MLP<\/td><td>Vicuna/LLaMA 7B<\/td><td>经典外挂式<\/td><\/tr><tr><td>Qwen2.5-VL 7B/72B<\/td><td>ViT + 动态分辨率<\/td><td>MLP/Resampler<\/td><td>Qwen2.5<\/td><td>M-RoPE、视频<\/td><\/tr><tr><td>Qwen3-VL<\/td><td>ViT<\/td><td>连接器<\/td><td>Qwen3<\/td><td>更强 OCR/视频<\/td><\/tr><tr><td>InternVL 2.5/3<\/td><td>InternViT-6B<\/td><td>MLP<\/td><td>InternLM/Qwen<\/td><td>动态 tiling<\/td><\/tr><tr><td>Pixtral 12B<\/td><td>Pixtral ViT<\/td><td>MLP<\/td><td>Mistral 12B<\/td><td>2D RoPE<\/td><\/tr><tr><td>Gemma 3 27B<\/td><td>SigLIP 类<\/td><td>投影<\/td><td>Gemma 3<\/td><td>128K、视觉<\/td><\/tr><tr><td>Gemma 4 12B<\/td><td>统一视觉塔<\/td><td>统一<\/td><td>Gemma 4<\/td><td>any-to-any<\/td><\/tr><tr><td>Llama 4 Scout/Maverick<\/td><td>早期融合<\/td><td>早期拼 token<\/td><td>Llama 4<\/td><td>图文<\/td><\/tr><tr><td>Janus-Pro 7B<\/td><td>理解/生成双头<\/td><td>双系统<\/td><td>7B<\/td><td>图像生成<\/td><\/tr><tr><td>MiniCPM-V 4.7<\/td><td>视觉塔<\/td><td>Resampler<\/td><td>MiniCPM<\/td><td>35B-A3B<\/td><\/tr><tr><td>Molmo 7B/72B<\/td><td>CLIP?<\/td><td>连接器<\/td><td>OLMo/Qwen<\/td><td>AI2 开放<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote>表中视觉塔/连接器的具体型号在不同版本会变；读模型卡时以“视觉编码器名称 + 连接器类型 + 输入分辨率”为准。<\/blockquote>\n<h2>12.4 图像 token 预算<\/h2>\n<p>一张 <span class=\"katex-inline\">448\\times448<\/span> 的图，patch 14：<\/p>\n<div class=\"katex-block\">N=\\left(\\frac{448}{14}\\right)^2=32^2=1024<\/div>\n<p>1024 个 patch，每个 patch 一个 token，就是 1024 个图像 token。若做 2×2 合并：<\/p>\n<div class=\"katex-block\">1024/4=256\\ \\text{token}<\/div>\n<p>若动态分辨率 1024×1024、patch 14：<\/p>\n<div class=\"katex-block\">(1024/14)^2\\approx73^2=5329\\ \\text{patch}<\/div>\n<p>再 2×2 合并 ≈1332 token。<strong>高分辨率 OCR 的 token 成本是平方涨的。<\/strong><\/p>\n<h3>KV 成本<\/h3>\n<p>图像 token 和文本 token 一样进 KV。以 Qwen3.8-27B 为例，每 token 0.25 MiB：<\/p>\n<ul><li>\n256 图像 token：64 MiB；\n<\/li><li>\n1024 图像 token：256 MiB；\n<\/li><li>\n4096 图像 token：1 GiB。\n<\/ul>\n<p>一张图看似小，几十张图就吃掉几 GB KV。<\/p>\n<h2>12.5 动态分辨率与 tiling<\/h2>\n<p>InternVL 的 dynamic tiling：把大图切成多个 448×448 tile，每个 tile 单独过 ViT，再拼起来。好处是高分辨率细节；坏处是 token 数随 tile 数线性涨。<\/p>\n<p>Qwen2-VL/Qwen2.5-VL 用动态分辨率 + M-RoPE（多模态旋转位置），让不同长宽比的图像有自己的位置编码。Qwen3-VL 继续加强 OCR/视频。<\/p>\n<h2>12.6 早期融合：Llama 4 与 Gemma 4<\/h2>\n<ul><li>\n<strong>Llama 4<\/strong>：图像 token 在较早层进入语言模型，视觉和语言一起训练；官方叫 early fusion。\n<\/li><li>\n<strong>Gemma 4 12B<\/strong>：<code>Gemma4UnifiedForConditionalGeneration<\/code>，文本/图像/音频统一进一个自回归序列，模型卡标 any-to-any。\n<\/li><li>\n<strong>Chameleon<\/strong>：把图像离散化成 token，和文本同一词表；真正“一个 Transformer 处理所有模态”。代价是视觉 tokenization 复杂、图像生成质量难。\n<\/ul>\n<p>早期融合的训练成本高：视觉塔和语言模型一起更新，数据配比、冻结策略、分辨率都要调。晚期融合更容易复用现成 LLM，但模态交互浅。<\/p>\n<h2>12.7 Janus：双系统<\/h2>\n<p>Janus/Janus-Pro 把“理解”和“生成”分开：<\/p>\n<ul><li>\n理解头：视觉编码器 + 语言模型，做图文问答；\n<\/li><li>\n生成头：用离散图像 token 做自回归生成。\n<\/ul>\n<p>好处是理解不被生成目标拖累，生成不被理解目标拖累；坏处是两套头、两套训练，部署更复杂。<\/p>\n<h2>12.8 常见误解<\/h2>\n<ul><li>\n<strong>“图像 token 不占上下文。”<\/strong> 占，而且和文本 token 一样进 KV。\n<\/li><li>\n<strong>“分辨率越高越好。”<\/strong> token 平方涨，KV 和延迟都涨；OCR 要分辨率，普通问答 256–1024 token 就够。\n<\/li><li>\n<strong>“多模态模型一定能生成图。”<\/strong> 大多数只能理解；生成要看是否有图像生成头（Janus、Qwen-Image 等）。\n<\/li><li>\n<strong>“视觉塔越大越好。”<\/strong> 视觉塔参数量和 token 数要跟语言模型匹配；6B 视觉塔 + 7B LLM 可能头重脚轻。\n<\/ul>\n<h2>12.9 自测<\/h2>\n<ol><li>\n画出“图像 → patch → ViT → 连接器 → LLM”的流程。\n<\/li><li>\n448×448、patch 14，图像 token 数是多少？2×2 合并后呢？\n<\/li><li>\n晚期融合和早期融合各有什么代价？\n<\/li><li>\nJanus 的双系统解决什么问题？\n<\/li><li>\n1024 个图像 token 在 Qwen3.8-27B 下占多少 KV？\n<\/ol>\n<blockquote>参考答案：1）见 12.1；2）1024，合并后 256；3）晚期融合交互浅但便宜，早期融合交互深但训练贵；4）理解与生成解耦，避免目标冲突；5）0.25 MiB×1024=256 MiB。<\/blockquote>\n<h2>12.10 复习锚点<\/h2>\n<ul><li>\n三段式：视觉编码器 → 连接器 → 语言模型。\n<\/li><li>\n四种融合：晚期、早期、双系统、any-to-any。\n<\/li><li>\nToken 公式：<span class=\"katex-inline\">(H/P)\\times(W/P)<\/span>，合并除以 <span class=\"katex-inline\">m^2<\/span>。\n<\/li><li>\n代表：LLaVA、Qwen-VL、InternVL、Pixtral、Gemma 4、Llama 4、Janus。\n<\/li><li>\n下一章：注意力与长上下文，把 KV 账算到底。\n<\/ul>", "kind": "chapter", "title": "第 12 章：多模态开放模型：图像怎么变成 token"}, "ch13": {"html": "<div class=\"source-badge\">📖 出处：https://huggingface.co/models<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch10\">第 10 章：非 Transformer：RWKV、Mamba、Jamba 与混合注意力<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch11\">第 11 章：MoE 世界：总参数、激活参数与路由的代价<\/a><\/span><\/div><h1>第 13 章 注意力与长上下文：MHA、GQA、MLA、滑窗与线性注意力<\/h1>\n<blockquote>难度：中高 · 建议 80 分钟 · 前置：第 3、10、11 章<\/blockquote>\n<blockquote>学习目标：能区分 MHA/MQA/GQA/MLA 的 KV 结构；能用公式算任意模型的 KV cache；能解释滑窗、局部/全局交替、DSA、线性注意力的取舍；能读 RoPE/YaRN 的 <code>rope_scaling<\/code> 字段。<\/blockquote>\n<h2>一句话核心<\/h2>\n<p>长上下文的第一成本不是“模型能不能记住”，而是 <strong>KV cache 能不能装下<\/strong>。MHA → MQA → GQA 是在 KV 头上做减法；MLA 是把 KV 压成低秩潜向量；滑窗/局部全局交替是减少每层能看到的 token；DSA/线性注意力是减少每 token 要算的 token。四条路线解决的是同一个账本的不同项。<\/p>\n<h2>13.1 四种注意力结构<\/h2>\n<h3>MHA（多头注意力）<\/h3>\n<p>每个 Q 头有独立的 K/V 头。若 <span class=\"katex-inline\">H<\/span> 个 Q 头、<span class=\"katex-inline\">H_{kv}=H<\/span>：<\/p>\n<div class=\"katex-block\">\\text{KV/token/layer}=2\\times H\\times d_{head}\\times b<\/div>\n<p>表达能力强，KV 最大。<\/p>\n<h3>MQA（多查询注意力）<\/h3>\n<p>所有 Q 头共享 1 组 K/V，<span class=\"katex-inline\">H_{kv}=1<\/span>。KV 降到 MHA 的 <span class=\"katex-inline\">1/H<\/span>。Falcon 7B 是典型。<\/p>\n<h3>GQA（分组查询注意力）<\/h3>\n<p>Q 头分成 <span class=\"katex-inline\">G<\/span> 组，每组共享 1 组 K/V，<span class=\"katex-inline\">H_{kv}=G<\/span>。Llama 3、Qwen、Gemma、Phi-4 都用。<span class=\"katex-inline\">G<\/span> 常为 2/4/8/16。<\/p>\n<h3>MLA（多头潜在注意力）<\/h3>\n<p>不直接存 K/V，而是先把 K/V 压到一个低秩潜向量 <span class=\"katex-inline\">c_t<\/span>，推理时再投影出 K/V。DeepSeek V2/V3 用。KV cache 从“每层 <span class=\"katex-inline\">2H d_{head}<\/span>”降到“每层 <span class=\"katex-inline\">d_c<\/span> + 少量 RoPE 维度”，压缩比很高。<\/p>\n<blockquote>MLA 的代价是实现复杂、训练要调投影矩阵；它不是“免费压缩”，而是用低秩假设换显存。<\/blockquote>\n<h2>13.2 跨家族 KV 对比<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>模型<\/th><th>层数<\/th><th>Q 头<\/th><th>KV 头<\/th><th>head_dim<\/th><th>上下文<\/th><th>KV/token（FP16）<\/th><\/tr><\/thead><tbody><tr><td>Llama 3.3 70B<\/td><td>80<\/td><td>64<\/td><td>8<\/td><td>128<\/td><td>128K<\/td><td>0.3125 MiB<\/td><\/tr><tr><td>Qwen3.8-27B<\/td><td>64<\/td><td>24<\/td><td>4<\/td><td>256<\/td><td>262K<\/td><td>0.25 MiB<\/td><\/tr><tr><td>Qwen3.8-2.4T-A95B<\/td><td>92<\/td><td>64<\/td><td>4<\/td><td>256<\/td><td>262K<\/td><td>0.359 MiB<\/td><\/tr><tr><td>Gemma 3 27B<\/td><td>62<\/td><td>32<\/td><td>16<\/td><td>128<\/td><td>128K<\/td><td>0.484 MiB<\/td><\/tr><tr><td>Phi-4<\/td><td>40<\/td><td>40<\/td><td>10<\/td><td>128<\/td><td>16K<\/td><td>0.195 MiB<\/td><\/tr><tr><td>MiniMax M3<\/td><td>60<\/td><td>64<\/td><td>4<\/td><td>128<\/td><td>1M<\/td><td>0.234 MiB<\/td><\/tr><tr><td>Mistral Large 4<\/td><td>72<\/td><td>64<\/td><td>64<\/td><td>96?<\/td><td>1M<\/td><td>1.72 MiB?<\/td><\/tr><tr><td>GLM-5.3<\/td><td>78<\/td><td>64<\/td><td>64<\/td><td>192<\/td><td>1M<\/td><td>3.66 MiB<\/td><\/tr><tr><td>Falcon 7B<\/td><td>32<\/td><td>71<\/td><td>1（MQA）<\/td><td>64<\/td><td>4K<\/td><td>0.0078 MiB<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote>表中 <code>?<\/code> 表示 head_dim 没有在 config 直接给出，按 hidden/heads 推可能不准；不要拿它做精确部署估算。Mistral Large 4 的 64 个 KV 头 + 1M 上下文，朴素 KV 会非常大，实际依赖 FP8/稀疏/分页。<\/blockquote>\n<h2>13.3 手算：1M 上下文到底多大<\/h2>\n<p>以 MiniMax M3 为例：<\/p>\n<div class=\"katex-block\">2\\times60\\times4\\times128\\times2\\\\=245{,}760\\ \\text{bytes/token}<\/div>\n<p>1M token：<\/p>\n<div class=\"katex-block\">245{,}760\\times1{,}048{,}576\\\\=257{,}698{,}037{,}760\\ \\text{bytes}\\\\\\approx240\\ \\text{GiB}<\/div>\n<p>Qwen3.8-2.4T：<\/p>\n<div class=\"katex-block\">2\\times92\\times4\\times256\\times2=376{,}832\\ \\text{bytes/token}<\/div>\n<p>1M 约 368 GiB。<\/p>\n<p>Gemma 3 27B 在 1M 下约 496 GiB。<\/p>\n<p><strong>所以 1M 上下文模型不可能靠朴素 KV 硬存<\/strong>。它们必须用以下至少一种：<\/p>\n<ul><li>\nGQA/MQA 把 KV 头砍到 2–8；\n<\/li><li>\nMLA 把 KV 压成低秩；\n<\/li><li>\n滑窗/局部全局交替，只让少数层看全局；\n<\/li><li>\nDSA/稀疏注意力，每 token 只选部分历史；\n<\/li><li>\nKV 量化（FP8/INT8）；\n<\/li><li>\n分页/分离部署（PagedAttention、KV offload）。\n<\/ul>\n<h2>13.4 滑窗与局部/全局交替<\/h2>\n<p>Mistral 7B：窗口 4096，序列超过窗口后旧 token 滚出；KV 只保留窗口。<\/p>\n<p>Gemma 2：1:1 局部/全局；Gemma 3：5:1（每 6 层 1 层全局）。局部层窗口 1024，全局层看全序列。<\/p>\n<p>优点：大部分层 KV 和计算按窗口算，长上下文成本大降。 缺点：全局层仍是瓶颈；局部窗口可能丢远处细节。<\/p>\n<h2>13.5 DSA / 稀疏注意力<\/h2>\n<p>DSA（DeepSeek Sparse Attention）这类方法的核心是：<strong>不是每个 token 都和全部历史做注意力，而是用一个轻量索引器选 top-k 个相关 token<\/strong>。GLM-5.3 的 <code>glm_moe_dsa<\/code>、DeepSeek V3.2/V4 的 DSA/CSA 都属于这条路线。<\/p>\n<p>代价：<\/p>\n<ul><li>\n索引器本身要训练；\n<\/li><li>\ntop-k 选错会丢信息；\n<\/li><li>\n实现比标准注意力复杂；\n<\/li><li>\n长上下文效果依赖训练数据。\n<\/ul>\n<h2>13.6 RoPE / YaRN<\/h2>\n<p>RoPE 把 Q/K 按位置旋转。YaRN 通过改旋转频率、温度，把训练长度外推：<\/p>\n<pre class=\"lang-json\"><code>&quot;rope_scaling&quot;: {\n  &quot;rope_type&quot;: &quot;yarn&quot;,\n  &quot;factor&quot;: 8.0,\n  &quot;original_max_position_embeddings&quot;: 8192\n}<\/code><\/pre>\n<p><code>factor=8<\/code> 表示把 8K 训练长度外推到 64K 量级。它不是“免费变长”：外推过头会退化，需要长文本继续训练。<\/p>\n<p>Llama 3.1 的 <code>rope_scaling<\/code> 是 <code>llama3<\/code> 类型，<code>factor=8<\/code>、<code>original_max_position_embeddings=8192<\/code>，所以 8K→128K。Qwen3.5/3.8 直接训到 262K，不再依赖大幅外推。<\/p>\n<h2>13.7 常见误解<\/h2>\n<ul><li>\n<strong>“KV 头数等于 Q 头数。”<\/strong> 只有 MHA 是；GQA/MQA 不是。\n<\/li><li>\n<strong>“head_dim = hidden / heads。”<\/strong> 很多模型不是整数关系（Qwen3.8 27B：hidden 5120、24 头、head_dim 256）。\n<\/li><li>\n<strong>“上下文长度 = 训练长度。”<\/strong> 标称最大位置可能靠 YaRN 外推，实际能力要看训练数据。\n<\/li><li>\n<strong>“MLA 只省显存，不影响效果。”<\/strong> 低秩压缩有信息损失；DeepSeek 用训练和 RoPE 设计来补。\n<\/li><li>\n<strong>“稀疏注意力一定更快。”<\/strong> 索引器、top-k、不规则内存访问可能吃掉收益；要看实现和 batch。\n<\/ul>\n<h2>13.8 自测<\/h2>\n<ol><li>\nMHA、MQA、GQA 的 KV 头数关系是什么？\n<\/li><li>\n用公式算 Llama 3.3 70B 在 32K 下的 KV。\n<\/li><li>\n为什么 1M 上下文模型必须做稀疏/压缩？\n<\/li><li>\nGemma 3 的局部/全局比例是多少？它省的是哪部分？\n<\/li><li>\nYaRN 的 <code>factor<\/code> 和 <code>original_max_position_embeddings<\/code> 各表示什么？\n<\/ol>\n<blockquote>参考答案：1）MHA：<span class=\"katex-inline\">H_{kv}=H<\/span>；MQA：<span class=\"katex-inline\">H_{kv}=1<\/span>；GQA：<span class=\"katex-inline\">H_{kv}=G&lt;H<\/span>；2）327,680×32,768≈10 GiB；3）朴素 KV 可达数百 GiB，必须 GQA/MLA/稀疏/量化；4）5:1，省局部层的 KV 和计算；5）factor 是外推倍数，original 是原训练长度。<\/blockquote>\n<h2>13.9 复习锚点<\/h2>\n<ul><li>\n四种注意力：MHA、MQA、GQA、MLA。\n<\/li><li>\nKV 公式：<span class=\"katex-inline\">2LH_{kv}d_{head}b<\/span>。\n<\/li><li>\n长上下文五件套：GQA/MLA、滑窗、稀疏、量化、分页。\n<\/li><li>\nRoPE/YaRN：<code>factor<\/code>、<code>original_max_position_embeddings<\/code>。\n<\/li><li>\n下一章：许可证、数据与评测，避免“下载了却不能商用”。\n<\/ul>", "kind": "chapter", "title": "第 13 章：注意力与长上下文：MHA、GQA、MLA、滑窗与线性注意力"}, "ch14": {"html": "<div class=\"source-badge\">📖 出处：https://huggingface.co/docs/hub/model-cards<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch08\">第 8 章：北美开放权重：Falcon、BLOOM、OLMo、DBRX 与“非 Llama”路线<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch09\">第 9 章：中国开放权重：GLM、Kimi、MiniMax、InternLM 与“多路线并行”<\/a><\/span><\/div><h1>第 14 章 许可证、数据与评测：开放模型的“隐形架构”<\/h1>\n<blockquote>难度：中级 · 建议 70 分钟 · 前置：第 1、8、9 章<\/blockquote>\n<blockquote>学习目标：能读懂 Apache/MIT/Llama/Gemma/CC-BY-NC/自定义许可的差别；能判断“开放权重”与“开放数据”对复现的意义；能设计一个不被排行榜和污染骗到的选型评测。<\/blockquote>\n<h2>一句话核心<\/h2>\n<p>模型结构决定“能不能跑”，许可证决定“能不能用”，数据决定“能不能复现”，评测决定“值不值得用”。四件事都过关，才叫一个可落地的开放模型。<\/p>\n<h2>14.1 许可证矩阵<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>许可证<\/th><th>商用<\/th><th>修改<\/th><th>再分发<\/th><th>专利<\/th><th>典型模型<\/th><\/tr><\/thead><tbody><tr><td>Apache 2.0<\/td><td>是<\/td><td>是<\/td><td>是<\/td><td>有明确授予<\/td><td>Qwen、Mistral 7B、OLMo、Granite、Phi、ERNIE 4.5<\/td><\/tr><tr><td>MIT<\/td><td>是<\/td><td>是<\/td><td>是<\/td><td>无明确专利条款<\/td><td>Phi-3/4、Ling、MiMo、MiniCPM<\/td><\/tr><tr><td>Llama Community<\/td><td>有条件<\/td><td>是<\/td><td>有条件<\/td><td>有<\/td><td>Llama 2/3/4<\/td><\/tr><tr><td>Gemma Terms<\/td><td>有条件<\/td><td>是<\/td><td>有条件<\/td><td>有<\/td><td>Gemma 1/2/3<\/td><\/tr><tr><td>CC-BY-NC<\/td><td>否<\/td><td>是<\/td><td>是<\/td><td>无<\/td><td>Command R/R+<\/td><\/tr><tr><td>自定义 <code>other<\/code><\/td><td>逐条读<\/td><td>逐条读<\/td><td>逐条读<\/td><td>逐条读<\/td><td>GLM、Kimi、MiniMax、Step、dots<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote>“Apache 2.0”不是“随便用”：要保留版权/许可声明、NOTICE，注意商标和专利。商用前让法务读一遍，不要只看标签。<\/blockquote>\n<h2>14.2 开放权重 vs 开放源码<\/h2>\n<p>OSI 的“开源”定义通常要求：自由使用、修改、再分发，且允许商用。很多“开源大模型”只满足前两条，许可证限制商用/再分发；所以更准确的说法是 <strong>open weights<\/strong>。<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>模型<\/th><th>权重<\/th><th>代码<\/th><th>数据<\/th><th>许可证<\/th><th>复现训练？<\/th><\/tr><\/thead><tbody><tr><td>OLMo 3<\/td><td>是<\/td><td>是<\/td><td>是<\/td><td>Apache 2.0<\/td><td>可以<\/td><\/tr><tr><td>Pythia<\/td><td>是<\/td><td>是<\/td><td>是（deduped）<\/td><td>Apache 2.0<\/td><td>可以<\/td><\/tr><tr><td>BLOOM<\/td><td>是<\/td><td>是<\/td><td>是（部分）<\/td><td>RAIL<\/td><td>部分<\/td><\/tr><tr><td>Llama 3<\/td><td>是<\/td><td>参考实现<\/td><td>否<\/td><td>Llama Community<\/td><td>不可以<\/td><\/tr><tr><td>Gemma 3<\/td><td>是<\/td><td>推理代码<\/td><td>否<\/td><td>Gemma Terms<\/td><td>不可以<\/td><\/tr><tr><td>Command R+<\/td><td>是<\/td><td>推理代码<\/td><td>否<\/td><td>CC-BY-NC<\/td><td>不可以<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote>你要做“训练复现/数据研究”，选 OLMo/Pythia/DCLM；你要做“产品部署”，选许可证清楚的模型；不要拿 Llama 做数据复现。<\/blockquote>\n<h2>14.3 评测的四个陷阱<\/h2>\n<h3>1. 数据污染<\/h3>\n<p>Benchmark 题目可能出现在预训练语料里。模型“记得答案”而不是“会推理”。检查方法：<\/p>\n<ul><li>\n看模型卡是否报告 decontamination；\n<\/li><li>\n用改写/换数字的题目重测；\n<\/li><li>\n看同一模型在“新题”和“原题”上的差距。\n<\/ul>\n<h3>2. 排行榜选择偏差<\/h3>\n<p>排行榜只测有限任务，且大家会针对性调参。MMLU 高不代表代码强；GSM8K 高不代表长文档强。<\/p>\n<h3>3. LLM-as-judge 偏差<\/h3>\n<p>裁判模型偏好长答案、格式漂亮、和自己风格相似的输出。要用人工抽检、成对比较、位置交换。<\/p>\n<h3>4. 评测集泄漏到训练<\/h3>\n<p>如果你用公开评测集微调，再在同一评测集上报分，分数没有意义。保留一个内部 holdout。<\/p>\n<h2>14.4 选型矩阵<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>场景<\/th><th>显存/硬件<\/th><th>优先结构<\/th><th>候选<\/th><\/tr><\/thead><tbody><tr><td>手机/端侧<\/td><td>4–8GB<\/td><td>小 dense、4-bit<\/td><td>Gemma E2B/E4B、Phi-4-mini、MiniCPM5、Qwen3.5-0.8B/2B<\/td><\/tr><tr><td>单卡 24GB<\/td><td>24GB<\/td><td>7B–14B dense，4-bit<\/td><td>Phi-4、Qwen3.5-9B、Gemma 3 12B、Mistral Small 3.1<\/td><\/tr><tr><td>单卡 48GB<\/td><td>48GB<\/td><td>14B–32B dense / 小 MoE<\/td><td>Qwen3.5-27B、Gemma 3 27B、Yi-34B<\/td><\/tr><tr><td>单机 8 卡 80GB<\/td><td>640GB<\/td><td>70B dense / 235B MoE 4-bit<\/td><td>Llama 3.3 70B、Qwen3-235B-A22B<\/td><\/tr><tr><td>多机<\/td><td>多节点<\/td><td>400B–2.4T MoE<\/td><td>Llama 4 Maverick、Qwen3.8-2.4T、Mistral Large 4<\/td><\/tr><tr><td>长文档<\/td><td>大显存<\/td><td>GQA/MLA/滑窗<\/td><td>Qwen3.5/3.8、Gemma 3、Kimi K3<\/td><\/tr><tr><td>图文<\/td><td>24GB+<\/td><td>视觉塔 + LLM<\/td><td>Qwen3-VL、InternVL、Gemma 4、MiniCPM-V<\/td><\/tr><tr><td>商用<\/td><td>看许可证<\/td><td>Apache/MIT 优先<\/td><td>Qwen、Phi、OLMo、Granite、Ling、MiMo<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote>显存估算：权重 FP16 = 参数量 × 2GB；INT8 ≈ ×1GB；INT4 ≈ ×0.5GB；再留 20–30% 给 KV/激活/框架。MoE 按总参数算权重，不按激活参数。<\/blockquote>\n<h2>14.5 模型卡审计清单<\/h2>\n<p>打开任意模型卡，按这 10 条打勾：<\/p>\n<ol><li>\n许可证是否明确？商用是否允许？\n<\/li><li>\n权重是否完整？是否 gated？\n<\/li><li>\n训练数据来源/配比是否公开？\n<\/li><li>\n训练 token 数、上下文长度？\n<\/li><li>\n架构字段：层数、hidden、Q/KV、专家、top-k？\n<\/li><li>\ntokenizer 词表大小、特殊 token？\n<\/li><li>\n评测集、分数、是否去污染？\n<\/li><li>\n已知偏见/安全限制？\n<\/li><li>\n推荐推理框架/量化格式？\n<\/li><li>\n版本/日期/联系人？\n<\/ol>\n<p><strong>缺 3 条以上，这个模型卡不合格；缺许可证，直接放弃商用。<\/strong><\/p>\n<h2>14.6 常见误解<\/h2>\n<ul><li>\n<strong>“Apache 2.0 就可以随便商用。”<\/strong> 要保留声明、注意商标/专利；不是法律建议。\n<\/li><li>\n<strong>“开源模型 = 开放数据。”<\/strong> 多数只开放权重。\n<\/li><li>\n<strong>“排行榜第一就是最好。”<\/strong> 任务、数据、评测方法都不同。\n<\/li><li>\n<strong>“模型卡写了 128K，就能塞 128K。”<\/strong> 还要看训练长度、RoPE、KV 显存。\n<\/li><li>\n<strong>“小模型便宜，长上下文也便宜。”<\/strong> KV 按层数/头数/长度算，小模型也能吃满显存。\n<\/ul>\n<h2>14.7 自测<\/h2>\n<ol><li>\nApache 2.0、Llama Community、CC-BY-NC 的商用差别是什么？\n<\/li><li>\n为什么 OLMo 比 Llama 更适合“训练复现”？\n<\/li><li>\n数据污染怎么检测？说出两种方法。\n<\/li><li>\n24GB 单卡想跑 14B，FP16 够吗？4-bit 呢？\n<\/li><li>\n模型卡缺哪三条你就应该放弃？\n<\/ol>\n<blockquote>参考答案：1）Apache 可商用；Llama 有条件商用；CC-BY-NC 禁止商用；2）OLMo 开放数据/代码/日志；3）改写题目重测、检查 decontamination、对比新题/原题；4）FP16 28GB 不够，4-bit 约 7GB 够；5）许可证、数据来源、评测/去污染（或架构/上下文）。<\/blockquote>\n<h2>14.8 复习锚点<\/h2>\n<ul><li>\n许可证矩阵：Apache/MIT/Llama/Gemma/CC-BY-NC/自定义。\n<\/li><li>\n开放权重 ≠ 开放数据 ≠ 开源。\n<\/li><li>\n评测四陷阱：污染、排行榜偏差、裁判偏差、泄漏。\n<\/li><li>\n选型先看显存，再看许可证，再看任务。\n<\/li><li>\n下一章：读 config.json，把架构字段变成可计算的账。\n<\/ul>", "kind": "chapter", "title": "第 14 章：许可证、数据与评测：开放模型的“隐形架构”"}, "ch15": {"html": "<div class=\"source-badge\">📖 出处：https://huggingface.co/docs/transformers<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch11\">第 11 章：MoE 世界：总参数、激活参数与路由的代价<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch13\">第 13 章：注意力与长上下文：MHA、GQA、MLA、滑窗与线性注意力<\/a><\/span><\/div><h1>第 15 章 读 config.json：把架构字段变成可计算的账<\/h1>\n<blockquote>难度：中高 · 建议 80 分钟 · 前置：第 3、11、13 章<\/blockquote>\n<blockquote>学习目标：能独立下载并读取任意开放模型的 <code>config.json<\/code>；能识别 <code>model_type<\/code> 与 <code>architectures<\/code> 的差别；能用字段估算总参数、激活参数和 KV cache；能避开“名字里的参数量”陷阱。<\/blockquote>\n<h2>一句话核心<\/h2>\n<p>模型卡会写营销数字，<code>config.json<\/code> 写结构事实。<strong>先读 config，再信名字。<\/strong> 你要找的字段只有十几个：层数、hidden、Q/KV 头、head_dim、FFN/专家、top-k、上下文、词表、rope_scaling、dtype。<\/p>\n<h2>15.1 怎么拿到 config<\/h2>\n<pre class=\"lang-python\"><code>from huggingface_hub import hf_hub_download\nimport json\n\npath = hf_hub_download(&quot;Qwen/Qwen3.8-27B&quot;, &quot;config.json&quot;)\ncfg = json.load(open(path))\nprint(cfg.keys())<\/code><\/pre>\n<p>多模态模型的文本参数常藏在 <code>text_config<\/code>：<\/p>\n<pre class=\"lang-python\"><code>tc = cfg.get(&quot;text_config&quot;, cfg)\nfor k in [&quot;model_type&quot;, &quot;num_hidden_layers&quot;, &quot;hidden_size&quot;,\n          &quot;num_attention_heads&quot;, &quot;num_key_value_heads&quot;,\n          &quot;intermediate_size&quot;, &quot;max_position_embeddings&quot;,\n          &quot;vocab_size&quot;, &quot;head_dim&quot;]:\n    print(k, tc.get(k))<\/code><\/pre>\n<blockquote>不要 <code>trust_remote_code=True<\/code> 跑来源不明的仓库；先用 <code>hf_hub_download<\/code> 只下 <code>config.json<\/code>，看字段。需要自定义架构时再读代码。<\/blockquote>\n<h2>15.2 字段地图<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>字段<\/th><th>含义<\/th><th>常见坑<\/th><\/tr><\/thead><tbody><tr><td><code>architectures<\/code><\/td><td>Python 类名，如 <code>LlamaForCausalLM<\/code><\/td><td>同名类可能在不同仓库实现不同<\/td><\/tr><tr><td><code>model_type<\/code><\/td><td>配置族，如 <code>llama<\/code>、<code>qwen3_moe<\/code><\/td><td>多模态顶层 <code>model_type<\/code> 与 <code>text_config.model_type<\/code> 不同<\/td><\/tr><tr><td><code>num_hidden_layers<\/code><\/td><td>层数<\/td><td>多模态塔的层数不在 text_config<\/td><\/tr><tr><td><code>hidden_size<\/code><\/td><td>残差流维度<\/td><td>不是 head_dim × heads 一定相等<\/td><\/tr><tr><td><code>num_attention_heads<\/code><\/td><td>Q 头数<\/td><td>不是 KV 头数<\/td><\/tr><tr><td><code>num_key_value_heads<\/code><\/td><td>KV 头数<\/td><td>缺省时可能等于 Q 头（MHA）<\/td><\/tr><tr><td><code>head_dim<\/code><\/td><td>每头维度<\/td><td>很多模型不写，需要从 q_proj 形状推<\/td><\/tr><tr><td><code>intermediate_size<\/code><\/td><td>dense FFN 宽度<\/td><td>MoE 模型里可能不是专家宽度<\/td><\/tr><tr><td><code>num_experts<\/code> / <code>n_routed_experts<\/code><\/td><td>路由专家数<\/td><td>字段名因家族而异<\/td><\/tr><tr><td><code>num_experts_per_tok<\/code><\/td><td>top-k<\/td><td>有的模型写在代码里，不在 config<\/td><\/tr><tr><td><code>moe_intermediate_size<\/code><\/td><td>专家 FFN 宽度<\/td><td>不等于 dense <code>intermediate_size<\/code><\/td><\/tr><tr><td><code>n_shared_experts<\/code><\/td><td>共享专家数<\/td><td>不是所有 MoE 都有<\/td><\/tr><tr><td><code>max_position_embeddings<\/code><\/td><td>最大位置<\/td><td>可能是外推后的标称值<\/td><\/tr><tr><td><code>rope_scaling<\/code><\/td><td>RoPE 外推配置<\/td><td><code>factor<\/code>、<code>original_max_position_embeddings<\/code> 要看<\/td><\/tr><tr><td><code>vocab_size<\/code><\/td><td>词表大小<\/td><td>影响 embedding 和输出头参数<\/td><\/tr><tr><td><code>torch_dtype<\/code> / <code>dtype<\/code><\/td><td>权重精度<\/td><td>实际发布可能是 FP8/BF16<\/td><\/tr><tr><td><code>quantization_config<\/code><\/td><td>量化方法<\/td><td>FP8/INT4 会影响显存估算<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>15.3 参数量估算<\/h2>\n<h3>dense<\/h3>\n<p>粗略：<\/p>\n<div class=\"katex-block\">P \\approx V H + L\\left(4H^2 + 3H F\\right)<\/div>\n<ul><li>\n<span class=\"katex-inline\">VH<\/span>：embedding（若输出头不共享，再加一份）；\n<\/li><li>\n<span class=\"katex-inline\">4H^2<\/span>：Q/K/V/O 四个投影（GQA 会少一些）；\n<\/li><li>\n<span class=\"katex-inline\">3HF<\/span>：SwiGLU 的三个矩阵。\n<\/ul>\n<p>更精确的注意力项：<\/p>\n<div class=\"katex-block\">P_{attn}=H(H_q d_{head})+2H(H_{kv}d_{head})+H(H_q d_{head})<\/div>\n<h3>MoE<\/h3>\n<div class=\"katex-block\">P_{total}\\approx VH + L\\left(P_{attn}+E\\cdot3H F_{exp}+H E\\right)<\/div>\n<div class=\"katex-block\">P_{active}\\approx VH + L\\left(P_{attn}+k\\cdot3H F_{exp}+P_{shared}\\right)<\/div>\n<p>其中 <span class=\"katex-inline\">E<\/span> 专家数，<span class=\"katex-inline\">k<\/span> top-k，<span class=\"katex-inline\">F_{exp}<\/span> 专家宽度。<\/p>\n<blockquote>这些是“数量级估算”，不含 bias、norm、router 细节；算出来和模型卡差 5–10% 很正常。关键是能判断“总参数/激活”量级，不被名字骗。<\/blockquote>\n<h2>15.4 手算：Qwen3.8-2.4T 的账<\/h2>\n<p>字段：<span class=\"katex-inline\">L=92<\/span>，<span class=\"katex-inline\">H=8192<\/span>，<span class=\"katex-inline\">E=512<\/span>，<span class=\"katex-inline\">F_{exp}=2048<\/span>，<span class=\"katex-inline\">k=10<\/span>。<\/p>\n<p>每个专家：<\/p>\n<div class=\"katex-block\">3\\times8192\\times2048\\approx50.3\\text{M}<\/div>\n<p>全部专家：<\/p>\n<div class=\"katex-block\">50.3\\text{M}\\times512\\times92\\approx2.37\\text{T}<\/div>\n<p>每 token 激活：<\/p>\n<div class=\"katex-block\">50.3\\text{M}\\times10\\times92\\approx46.3\\text{B}<\/div>\n<p>加上注意力、embedding、共享/路由，接近 95B 激活。<strong>这和 2.4T-A95B 的名字对得上。<\/strong><\/p>\n<h2>15.5 KV 估算<\/h2>\n<div class=\"katex-block\">\\text{KV/token}=2\\times L\\times H_{kv}\\times d_{head}\\times b<\/div>\n<p>Qwen3.8-27B：<span class=\"katex-inline\">L=64<\/span>，<span class=\"katex-inline\">H_{kv}=4<\/span>，<span class=\"katex-inline\">d_{head}=256<\/span>，<span class=\"katex-inline\">b=2<\/span>：<\/p>\n<div class=\"katex-block\">2\\times64\\times4\\times256\\times2=262{,}144\\ \\text{bytes}=0.25\\ \\text{MiB}<\/div>\n<p>128K：<span class=\"katex-inline\">0.25\\times131{,}072=32<\/span> GiB。 262K：64 GiB。<\/p>\n<blockquote>这是单序列、单模型、FP16 KV。batch 要乘 batch size；KV 量化到 FP8 可减半，INT8 约减半，INT4 约 1/4（有精度代价）。<\/blockquote>\n<h2>15.6 常见 <code>model_type<\/code> 对照<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th><code>model_type<\/code><\/th><th>家族<\/th><th>备注<\/th><\/tr><\/thead><tbody><tr><td><code>llama<\/code><\/td><td>Llama / MiniCPM<\/td><td>最常见 decoder-only<\/td><\/tr><tr><td><code>qwen2<\/code> / <code>qwen3<\/code><\/td><td>Qwen dense<\/td><td>GQA、RoPE<\/td><\/tr><tr><td><code>qwen3_moe<\/code><\/td><td>Qwen3 MoE<\/td><td>128 专家等<\/td><\/tr><tr><td><code>qwen3_next<\/code><\/td><td>Qwen3-Next<\/td><td>混合线性<\/td><\/tr><tr><td><code>qwen3_5<\/code> / <code>qwen3_5_moe<\/code><\/td><td>Qwen3.5/3.6/3.8<\/td><td>多模态常嵌套 text_config<\/td><\/tr><tr><td><code>qwen4_exp<\/code><\/td><td>Qwen3.8-Flash-Next<\/td><td>试验架构<\/td><\/tr><tr><td><code>mistral<\/code> / <code>mixtral<\/code><\/td><td>Mistral / Mixtral<\/td><td>滑窗/MoE<\/td><\/tr><tr><td><code>gemma2<\/code> / <code>gemma3<\/code> / <code>gemma4<\/code><\/td><td>Gemma<\/td><td>局部/全局、统一多模态<\/td><\/tr><tr><td><code>phi3<\/code><\/td><td>Phi-3/4<\/td><td>部分 MHA/GQA<\/td><\/tr><tr><td><code>falcon<\/code> / <code>falcon_h1<\/code><\/td><td>Falcon<\/td><td>MQA / 混合<\/td><\/tr><tr><td><code>olmo2<\/code> / <code>olmo3<\/code><\/td><td>OLMo<\/td><td>开放数据<\/td><\/tr><tr><td><code>glm_moe_dsa<\/code><\/td><td>GLM-5.3<\/td><td>MoE + DSA<\/td><\/tr><tr><td><code>kimi_linear<\/code><\/td><td>Kimi K3<\/td><td>线性/混合<\/td><\/tr><tr><td><code>minimax_m3_vl<\/code><\/td><td>MiniMax M3<\/td><td>稀疏 MoE + 视觉<\/td><\/tr><tr><td><code>step5<\/code> / <code>step5_vl<\/code><\/td><td>Step-5<\/td><td>MoE + 感知编码器<\/td><\/tr><tr><td><code>bailing_hybrid<\/code><\/td><td>Ling<\/td><td>混合 MoE<\/td><\/tr><tr><td><code>dots1<\/code><\/td><td>dots.llm1<\/td><td>MoE<\/td><\/tr><tr><td><code>ernie4_5_moe<\/code><\/td><td>ERNIE 4.5<\/td><td>MoE<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote><code>model_type<\/code> 是配置族，不等于 <code>architectures<\/code> 类名；两者要一起看。<\/blockquote>\n<h2>15.7 一个最小检查脚本<\/h2>\n<pre class=\"lang-python\"><code>from huggingface_hub import hf_hub_download\nimport json\n\ndef inspect(model_id):\n    cfg = json.load(open(hf_hub_download(model_id, &quot;config.json&quot;)))\n    tc = cfg.get(&quot;text_config&quot;, cfg)\n    keys = [&quot;model_type&quot;, &quot;num_hidden_layers&quot;, &quot;hidden_size&quot;,\n            &quot;num_attention_heads&quot;, &quot;num_key_value_heads&quot;,\n            &quot;intermediate_size&quot;, &quot;moe_intermediate_size&quot;,\n            &quot;num_experts&quot;, &quot;n_routed_experts&quot;, &quot;num_experts_per_tok&quot;,\n            &quot;max_position_embeddings&quot;, &quot;vocab_size&quot;, &quot;head_dim&quot;]\n    print(model_id)\n    for k in keys:\n        if k in tc:\n            print(f&quot;  {k}: {tc[k]}&quot;)\n\ninspect(&quot;Qwen/Qwen3.8-2.4T-A95B&quot;)\ninspect(&quot;google/gemma-4-12B&quot;)<\/code><\/pre>\n<h2>15.8 常见误解<\/h2>\n<ul><li>\n<strong>“名字里的 2.4T 是激活。”<\/strong> 看 <code>A95B<\/code> 后缀；A 是 active。\n<\/li><li>\n<strong>“<code>num_experts<\/code> 就是 top-k。”<\/strong> 不是；top-k 是 <code>num_experts_per_tok<\/code> 或代码里的 <code>top_k<\/code>。\n<\/li><li>\n<strong>“<code>max_position_embeddings<\/code> 就是训练长度。”<\/strong> 可能是外推后的标称值；看 <code>rope_scaling.original_max_position_embeddings<\/code>。\n<\/li><li>\n<strong>“<code>hidden_size<\/code> 除以 heads 就是 head_dim。”<\/strong> 很多模型不是（Qwen3.8-27B：5120/24≠256）。\n<\/li><li>\n<strong>“config 里没有就是不存在。”<\/strong> 多模态塔、视觉/音频参数在别的子 config。\n<\/ul>\n<h2>15.9 自测<\/h2>\n<ol><li>\n<code>architectures<\/code> 和 <code>model_type<\/code> 的区别是什么？\n<\/li><li>\n写出 dense 和 MoE 的参数量粗略公式。\n<\/li><li>\nQwen3.8-2.4T 的 2.4T 和 95B 分别怎么算出来？\n<\/li><li>\n为什么 <code>max_position_embeddings=262144<\/code> 不代表能直接塞 262K？\n<\/li><li>\n说出三个容易混淆的字段。\n<\/ol>\n<blockquote>参考答案：1）architectures 是类名，model_type 是配置族；2）见 15.3；3）512 专家×3×8192×2048×92≈2.37T；top-10×同式≈46B，加注意力/embedding≈95B；4）训练长度、RoPE 外推、KV 显存限制；5）<code>num_experts<\/code> vs <code>num_experts_per_tok<\/code>、<code>intermediate_size<\/code> vs <code>moe_intermediate_size<\/code>、<code>max_position_embeddings<\/code> vs 实际训练长度。<\/blockquote>\n<h2>15.10 复习锚点<\/h2>\n<ul><li>\n先读 config，再信名字。\n<\/li><li>\n字段：层数、hidden、Q/KV、head_dim、FFN/专家、top-k、上下文、词表、rope、dtype。\n<\/li><li>\n公式：dense/MoE 参数、KV。\n<\/li><li>\n<code>model_type<\/code> 对照表。\n<\/li><li>\n下一章：全球开放权重模型索引，把家族放进一张表。\n<\/ul>", "kind": "chapter", "title": "第 15 章：读 config.json：把架构字段变成可计算的账"}, "ch16": {"html": "<div class=\"source-badge\">📖 出处：https://huggingface.co/models<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch14\">第 14 章：许可证、数据与评测：开放模型的“隐形架构”<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch15\">第 15 章：读 config.json：把架构字段变成可计算的账<\/a><\/span><\/div><h1>第 16 章 附录：全球开放权重模型索引<\/h1>\n<blockquote>难度：工具页 · 随时查阅 · 前置：第 14、15 章<\/blockquote>\n<blockquote>用法：先按“地区/家族”定位，再看“代表 checkpoint、总参/激活、上下文、结构、许可证”。这不是每一个 checkpoint 的清单，而是<strong>家族级索引<\/strong>；同一家族的量化版、微调版、合并版不单列。<\/blockquote>\n<h2>16.1 收录口径<\/h2>\n<ul><li>\n只收官方公开发布、权重可从 Hugging Face 等渠道下载的模型；\n<\/li><li>\n同一家族合并尺寸，选 1–6 个代表；\n<\/li><li>\n<code>总/激活<\/code> 用模型卡/命名口径；<code>—<\/code> 表示公开材料没有给出可靠数字；\n<\/li><li>\n上下文是模型卡标称最大值，不等于训练长度或实际可用长度；\n<\/li><li>\n许可证是模型卡标签，商用前读全文；\n<\/li><li>\n截止 2026-11；新模型会继续出现，索引是“当前截面”，不是终局。\n<\/ul>\n<h2>16.2 主线：美洲、欧洲与开源研究模型<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>家族<\/th><th>代表 checkpoint<\/th><th>总参/激活<\/th><th>上下文<\/th><th>结构<\/th><th>许可证<\/th><th>地区<\/th><\/tr><\/thead><tbody><tr><td>Llama<\/td><td>Llama 2 7B/13B/70B<\/td><td>7/13/70B dense<\/td><td>4K<\/td><td>decoder-only, GQA(70B)<\/td><td>Llama 2 Community<\/td><td>US<\/td><\/tr><tr><td>Llama<\/td><td>Llama 3 8B/70B<\/td><td>8/70B dense<\/td><td>8K<\/td><td>decoder-only, GQA<\/td><td>Llama 3 Community<\/td><td>US<\/td><\/tr><tr><td>Llama<\/td><td>Llama 3.1 8B/70B/405B<\/td><td>8/70/405B dense<\/td><td>128K<\/td><td>decoder-only, GQA<\/td><td>Llama 3.1 Community<\/td><td>US<\/td><\/tr><tr><td>Llama<\/td><td>Llama 3.2 1B/3B<\/td><td>1/3B dense<\/td><td>128K<\/td><td>decoder-only, GQA<\/td><td>Llama 3.2 Community<\/td><td>US<\/td><\/tr><tr><td>Llama<\/td><td>Llama 3.3 70B<\/td><td>70B dense<\/td><td>128K<\/td><td>decoder-only, GQA<\/td><td>Llama 3.3 Community<\/td><td>US<\/td><\/tr><tr><td>Llama<\/td><td>Llama 4 Scout<\/td><td>109B / 17B active<\/td><td>10M<\/td><td>MoE 16 experts + early fusion<\/td><td>Llama 4 Community<\/td><td>US<\/td><\/tr><tr><td>Llama<\/td><td>Llama 4 Maverick<\/td><td>400B / 17B active<\/td><td>1M<\/td><td>MoE 128 experts + early fusion<\/td><td>Llama 4 Community<\/td><td>US<\/td><\/tr><tr><td>Mistral<\/td><td>Mistral 7B<\/td><td>7B dense<\/td><td>32K (SWA 4K)<\/td> ><td>7/34B<\/td><td>4K<\/td><td>early fusion, discrete image tokens<\/td><td>自定义<\/td><td>US<\/td><\/tr><tr><td>Janus<\/td><td>Janus-Pro 7B<\/td><td>7B<\/td><td>4K<\/td><td>dual head: understanding + generation<\/td><td>Apache 2.0<\/td><td>CN<\/td><\/tr><tr><td>Idefics<\/td><td>Idefics2 8B<\/td><td>8B<\/td><td>8K<\/td><td>vision + LLM<\/td><td>Apache 2.0<\/td><td>EU<\/td><\/tr><tr><td>T5<\/td><td>T5/Flan-T5 11B<\/td><td>11B<\/td><td>512-2048<\/td><td>encoder-decoder<\/td><td>Apache 2.0<\/td><td>US<\/td><\/tr><tr><td>BART<\/td><td>BART 400M<\/td><td>400M<\/td><td>1024<\/td><td>encoder-decoder<\/td><td>Apache 2.0<\/td><td>US<\/td><\/tr><tr><td>mT5<\/td><td>mT5 13B<\/td><td>13B<\/td><td>1024<\/td><td>encoder-decoder, multilingual<\/td><td>Apache 2.0<\/td><td>US<\/td><\/tr><tr><td>UL2<\/td><td>UL2 20B<\/td><td>20B<\/td><td>512<\/td><td>encoder-decoder, mixture of denoisers<\/td><td>Apache 2.0<\/td><td>US<\/td><\/tr><tr><td>LLaDA<\/td><td>LLaDA 8B<\/td><td>8B<\/td><td>2K<\/td><td>diffusion language model<\/td><td>Apache 2.0<\/td><td>CN<\/td><\/tr><tr><td>Dream<\/td><td>Dream 7B<\/td><td>7B<\/td><td>2K<\/td><td>diffusion language model<\/td><td>Apache 2.0<\/td><td>HK<\/td><\/tr><tr><td>SmolLM<\/td><td>SmolLM3 3B<\/td><td>3B<\/td><td>32K<\/td><td>dense, small<\/td><td>Apache 2.0<\/td><td>US<\/td><\/tr><tr><td>TinyLlama<\/td><td>TinyLlama 1.1B<\/td><td>1.1B<\/td><td>2K<\/td><td>dense, small<\/td><td>Apache 2.0<\/td><td>CN<\/td><\/tr><tr><td>MobileLLM<\/td><td>MobileLLM 1.3B<\/td><td>1.3B<\/td><td>2K<\/td><td>dense, mobile<\/td><td>Apache 2.0<\/td><td>US<\/td><\/tr><tr><td>OpenELM<\/td><td>OpenELM 1.1B/2.7B<\/td><td>1.1/2.7B<\/td><td>2K<\/td><td>dense, efficient<\/td><td>Apache 2.0<\/td><td>US<\/td><\/tr><tr><td>BGE<\/td><td>BGE-M3<\/td><td>—<\/td><td>8192<\/td><td>embedding / reranker<\/td><td>MIT<\/td><td>CN<\/td><\/tr><tr><td>E5<\/td><td>E5-Mistral 7B<\/td><td>7B<\/td><td>4K<\/td><td>embedding<\/td><td>MIT<\/td><td>US<\/td><\/tr><tr><td>GTE<\/td><td>GTE-Qwen2 7B<\/td><td>7B<\/td><td>32K<\/td><td>embedding<\/td><td>Apache 2.0<\/td><td>CN<\/td><\/tr><tr><td>EmbeddingGemma<\/td><td>EmbeddingGemma 300M<\/td><td>300M<\/td><td>2K<\/td><td>embedding<\/td><td>Gemma Terms<\/td><td>US<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>16.5 读表后的三个动作<\/h2>\n<ol><li>\n<strong>先排除许可证不合适的<\/strong>：商用优先 Apache/MIT；Llama/Gemma 读条款；CC-BY-NC 直接排除商用。\n<\/li><li>\n<strong>再排除显存不合适的<\/strong>：MoE 按总参数算权重，按激活参数算算力；别把 <code>A95B<\/code> 当总参数。\n<\/li><li>\n<strong>最后排除上下文不合适的<\/strong>：看 <code>max_position_embeddings<\/code> 与 <code>rope_scaling<\/code>，再算 KV；标称 1M 不等于单卡能跑 1M。\n<\/ol>\n<h2>16.6 已知缺口<\/h2>\n<ul><li>\n视频生成、语音合成、图像生成模型只列了少量代表，没有逐家族展开；\n<\/li><li>\n嵌入/检索模型只列 BGE/E5/GTE/EmbeddingGemma，未覆盖所有 reranker；\n<\/li><li>\n部分 2026 新模型（Qwen3.8-Flash-Next、Kimi K3、MiniMax M3、Step-5）技术报告未完整公开，表中只写 config 能确认的字段；\n<\/li><li>\n同一家族不同尺寸的配置差异，回到第 15 章读具体 <code>config.json<\/code>。\n<\/ul>\n<h2>16.7 复习锚点<\/h2>\n<ul><li>\n索引是家族级，不是 checkpoint 级。\n<\/li><li>\n选型顺序：许可证 → 显存 → 上下文 → 任务。\n<\/li><li>\n不确定的数字写 <code>—<\/code>，不编造。\n<\/ul>", "kind": "chapter", "title": "第 16 章：附录：全球开放权重模型索引"}, "c01": {"html": "<div class=\"source-badge\">📖 出处：https://huggingface.co/docs/hub/model-cards<\/div><h1>开放权重与开源<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1、8、9 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>开放权重指模型参数可下载；开源还要求代码、许可证、数据/训练流程足以复现。大多数“开源大模型”只是开放权重。<\/p>\n<h2>为什么重要<\/h2>\n<p>这决定了你能不能商用、能不能改、能不能复现训练。把两者混为一谈，会在选型和合规上同时踩坑。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[权重可下载] --&gt; B[能推理/能微调]\n  A --&gt; C{许可证允许商用?}\n  C --&gt;|是| D[可商用]\n  C --&gt;|否| E[只能研究/需授权]\n  A --&gt; F{代码/数据公开?}\n  F --&gt;|是| G[可复现]\n  F --&gt;|否| H[只能黑盒使用]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>权重是模型参数文件；代码是结构/推理/训练实现；数据是预训练语料与配比。三者可以分开开放。OLMo/Pythia 开放三层；Llama/Gemma 只开放权重和部分代码；Command R+ 开放权重但禁止商用。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n“Hugging Face 能下载就是开源”——下载只代表权重可获取。\n<\/li><li>\n“Apache 2.0 就是随便用”——要保留声明、注意专利/商标。\n<\/li><li>\n“模型卡写了 architecture 就是架构开源”——架构描述不等于可运行训练代码。\n<\/ul>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：模型、权重、许可证\n<\/li><li>\n后续：许可证族、模型卡审计\n<\/ul>", "kind": "concept", "title": "开放权重与开源"}, "c02": {"html": "<div class=\"source-badge\">📖 出处：https://huggingface.co/models<\/div><h1>decoder-only 与 encoder-decoder<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 2、8 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>decoder-only 只用自回归解码器，按下一个 token 预测训练；encoder-decoder 先用编码器双向读输入，再用解码器生成输出。<\/p>\n<h2>为什么重要<\/h2>\n<p>今天大多数开放大模型是 decoder-only，但翻译、摘要、结构化生成仍有 encoder-decoder 的位置。看懂骨架才知道为什么有的模型不能做双向注意力。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[输入 token] --&gt; B[Encoder 双向注意力]\n  B --&gt; C[Decoder 交叉注意力]\n  C --&gt; D[输出 token]\n  E[输入 token] --&gt; F[Decoder-only 因果注意力]\n  F --&gt; G[输出 token]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>decoder-only 每层用因果掩码，token 只能看左边；训练目标简单，生成灵活，容易扩展到多模态。encoder-decoder 的编码器没有因果掩码，能看全输入；解码器通过交叉注意力读编码器输出，适合输入理解强、输出长度可控的任务。<\/p>\n<p>T5/Flan-T5/BART/mT5/UL2 是 encoder-decoder 代表；Llama/Qwen/Mistral/Gemma 是 decoder-only。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n“decoder-only 就是 GPT，GPT 就是唯一实现”——今天所有 Llama 式模型都是 decoder-only，但细节不同。\n<\/li><li>\n“encoder-decoder 过时了”——通用对话少了，翻译/摘要/检索增强仍在用。\n<\/li><li>\n“decoder-only 不能看全输入”——它把输入当前缀，因果掩码仍然只能看左边；要做双向理解需额外设计。\n<\/ul>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：注意力、因果掩码\n<\/li><li>\n后续：多模态融合、T5/BART\n<\/ul>", "kind": "concept", "title": "decoder-only 与 encoder-decoder"}, "c03": {"html": "<div class=\"source-badge\">📖 出处：https://huggingface.co/models<\/div><h1>稠密与 MoE<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 11 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>稠密模型每个 token 都走同一套 FFN；MoE 把 FFN 拆成多个专家，每个 token 只走 top-k 个。<\/p>\n<h2>为什么重要<\/h2>\n<p>这是理解“总参数 2.4T、激活 95B”这类数字的前提。MoE 是容量与算力解耦的核心手段。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[稠密: 所有 token 走同一 FFN] --&gt; B[算力≈参数量]\n  C[MoE: token 选 top-k 专家] --&gt; D[算力≈激活参数]\n  C --&gt; E[显存≈总参数]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>稠密 FFN 是一个固定矩阵，所有 token 都过它；参数量多大，每 token 矩阵乘就多大。MoE 有多个专家，门控选 top-k，总参数包含所有专家，显存要全装；但每 token 只算被选中的专家。<\/p>\n<p>MoE 的代价是路由、负载均衡、专家并行通信；收益是同算力下容量更大。它适合显存宽裕、算力紧张的场景，不适合显存受限的单机。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n“MoE 每个 token 都算所有专家”——只算 top-k。\n<\/li><li>\n“总参数大就一定慢”——算力看激活参数，但显存/通信会拖后腿。\n<\/li><li>\n“专家越多越好”——路由组合爆炸、负载不均、通信成本都会上升。\n<\/ul>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：FFN、门控\n<\/li><li>\n后续：总参数与激活参数、专家并行\n<\/ul>", "kind": "concept", "title": "稠密与 MoE"}, "c04": {"html": "<div class=\"source-badge\">📖 出处：https://huggingface.co/models<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c03\">稠密与 MoE<\/a><\/span><\/div><h1>MHA、GQA 与 MLA<\/h1>\n<ul><li>\n<strong>难度<\/strong>：中高 | <strong>涉及章节<\/strong>：第 13 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>MHA 每个 Q 头有独立 K/V；GQA 让多组 Q 头共享 K/V；MLA 把 K/V 压成低秩潜向量再投影。<\/p>\n<h2>为什么重要<\/h2>\n<p>长上下文的第一成本是 KV cache。注意力的 KV 结构直接决定 128K/1M 能不能部署。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[MHA: H 组 KV] --&gt; B[KV 最大]\n  C[GQA: G 组 KV] --&gt; D[KV 降 H/G]\n  E[MLA: 低秩潜向量] --&gt; F[KV 压缩比更高]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>KV/token/layer 的公式是 <span class=\"katex-inline\">2\\times H_{kv}\\times d_{head}\\times b<\/span>。MHA 的 <span class=\"katex-inline\">H_{kv}=H<\/span>；MQA 的 <span class=\"katex-inline\">H_{kv}=1<\/span>；GQA 的 <span class=\"katex-inline\">H_{kv}=G&lt;H<\/span>。Llama 3.3 70B 是 64 Q/8 KV；Qwen3.8 27B 是 24 Q/4 KV；Gemma 3 27B 是 32 Q/16 KV。<\/p>\n<p>MLA 不直接存 K/V，而是存低秩潜向量 <span class=\"katex-inline\">c_t<\/span>，推理时投影出 K/V；DeepSeek V2/V3 用。它把 KV 从每层 <span class=\"katex-inline\">2Hd_{head}<\/span> 降到 <span class=\"katex-inline\">d_c<\/span> 量级，但实现复杂、有低秩信息损失。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n“KV 头数等于 Q 头数”——只有 MHA 是。\n<\/li><li>\n“GQA 一定比 MHA 差”——多数模型用 GQA 换长上下文/吞吐，效果靠训练补。\n<\/li><li>\n“MLA 是免费压缩”——低秩压缩有损失，需要训练设计配合。\n<\/ul>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：注意力、KV cache\n<\/li><li>\n后续：RoPE/YaRN、长上下文\n<\/ul>", "kind": "concept", "title": "MHA、GQA 与 MLA"}, "c05": {"html": "<div class=\"source-badge\">📖 出处：https://huggingface.co/models<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c04\">MHA、GQA 与 MLA<\/a><\/span><\/div><h1>RoPE 与 YaRN<\/h1>\n<ul><li>\n<strong>难度<\/strong>：中高 | <strong>涉及章节<\/strong>：第 13 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>RoPE 把 Q/K 按位置旋转，让注意力只看相对位置；YaRN 改旋转频率/温度，把训练长度外推到更长。<\/p>\n<h2>为什么重要<\/h2>\n<p>模型标称 128K/1M，不等于训练过那么长。RoPE 缩放决定“能不能外推”，也影响长文本退化。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[位置 m] --&gt; B[旋转 Q/K]\n  C[位置 n] --&gt; D[旋转 Q/K]\n  B --&gt; E[点积只依赖 m-n]\n  D --&gt; E\n  E --&gt; F[YaRN 调频率/温度]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>二维旋转：<span class=\"katex-inline\">R_{\\theta,m}<\/span> 把向量按 <span class=\"katex-inline\">m\\theta<\/span> 旋转。注意力分数只依赖 <span class=\"katex-inline\">m-n<\/span>，所以是相对位置。YaRN 通过 <code>factor<\/code>、<code>original_max_position_embeddings<\/code>、<code>beta_fast/beta_slow<\/code> 改频率，把 8K 训练外推到 64K/128K。<\/p>\n<p>外推不是免费：超过训练分布，注意力会退化；通常要长文本继续训练。Qwen3.5/3.8 直接训到 262K，Llama 3.1 用 <code>llama3<\/code> 类型缩放 8K→128K。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n“max_position_embeddings 就是训练长度”——可能是外推后的标称值。\n<\/li><li>\n“factor 越大越好”——外推过头会退化。\n<\/li><li>\n“RoPE 是绝对位置编码”——它是相对位置，通过旋转实现。\n<\/ul>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：注意力、位置编码\n<\/li><li>\n后续：长上下文、滑窗\n<\/ul>", "kind": "concept", "title": "RoPE 与 YaRN"}, "c06": {"html": "<div class=\"source-badge\">📖 出处：https://huggingface.co/models<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c04\">MHA、GQA 与 MLA<\/a><\/span><\/div><h1>滑窗与局部/全局交替<\/h1>\n<ul><li>\n<strong>难度<\/strong>：中高 | <strong>涉及章节<\/strong>：第 5、6 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>滑窗让每个 token 只看最近 W 个 token；局部/全局交替让多数层看局部、少数层看全局。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把长上下文的 KV 和计算从“全序列”降到“窗口”，是 Mistral/Gemma 长上下文的核心手段。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[token t] --&gt; B[只看 t-W ... t]\n  B --&gt; C[KV 只留窗口]\n  D[局部层] --&gt; E[窗口 1024/4096]\n  F[全局层] --&gt; G[看全序列]\n  E --&gt; H[省 KV/计算]\n  G --&gt; I[保留远距离]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>Mistral 7B 用 4096 滑窗，序列超过窗口后旧 token 滚出；KV 只保留窗口。Gemma 2 约 1:1 局部/全局，Gemma 3 是 5:1（每 6 层 1 层全局），局部窗口 1024。局部层省成本，全局层补远距离。<\/p>\n<p>代价：不能精确回看窗口外原文；全局层仍是长上下文瓶颈。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n“滑窗模型能精确检索 32K 前的原文”——不能，只靠层间传递。\n<\/li><li>\n“局部/全局就是两种注意力二选一”——是交替堆叠。\n<\/li><li>\n“窗口越小越好”——太小会丢上下文，效果退化。\n<\/ul>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：注意力、KV cache\n<\/li><li>\n后续：长上下文、稀疏注意力\n<\/ul>", "kind": "concept", "title": "滑窗与局部/全局交替"}, "c07": {"html": "<div class=\"source-badge\">📖 出处：https://huggingface.co/models<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c04\">MHA、GQA 与 MLA<\/a><\/span><\/div><h1>线性注意力与 SSM<\/h1>\n<ul><li>\n<strong>难度<\/strong>：中高 | <strong>涉及章节<\/strong>：第 10 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>线性注意力用核函数/递归状态替代 softmax 两两注意力；SSM 用固定状态递推 <span class=\"katex-inline\">h_t=Ah_{t-1}+Bx_t<\/span>。两者都把序列复杂度降到 <span class=\"katex-inline\">O(n)<\/span>。<\/p>\n<h2>为什么重要<\/h2>\n<p>长序列的 <span class=\"katex-inline\">O(n^2)<\/span> 注意力和 KV 是瓶颈；线性/SSM 是替代路线，Kimi/Qwen3-Next/Falcon-H1 都在用混合版本。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[token t] --&gt; B[状态 h_t = A h + B x]\n  B --&gt; C[输出 y_t = C h_t]\n  B --&gt; D[固定大小状态]\n  E[全注意力] --&gt; F[KV 随长度增长]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>SSM 每来一个 token 只更新固定维度状态，不保存全部 K/V；Mamba 的“选择性”让 B/C/Δ 由输入决定，能选择记住/忘记。线性注意力用核函数把 <span class=\"katex-inline\">QK^\\top V<\/span> 变成 <span class=\"katex-inline\">Q(K^\\top V)<\/span>，先算 KV 再乘 Q，复杂度 <span class=\"katex-inline\">O(n)<\/span>。<\/p>\n<p>代价：状态容量固定，精确回看弱；混合架构用少量全注意力层补回。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n“线性注意力一定更快”——短序列/训练前期可能被核函数开销吃掉。\n<\/li><li>\n“Mamba 不能检索”——它能选择性记忆，只是不能精确回看所有位置。\n<\/li><li>\n“非 Transformer 就没有注意力”——混合模型仍保留全注意力层。\n<\/ul>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：注意力、RNN\n<\/li><li>\n后续：Jamba、Kimi Linear、Qwen3-Next\n<\/ul>", "kind": "concept", "title": "线性注意力与 SSM"}, "c08": {"html": "<div class=\"source-badge\">📖 出处：https://huggingface.co/models<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c02\">decoder-only 与 encoder-decoder<\/a><\/span><\/div><h1>多模态连接器<\/h1>\n<ul><li>\n<strong>难度<\/strong>：中高 | <strong>涉及章节<\/strong>：第 12 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>连接器把视觉/音频编码器的特征压成语言模型能吃的 token，常见 MLP、Resampler/Q-Former、交叉注意力。<\/p>\n<h2>为什么重要<\/h2>\n<p>多模态不是“加个 ViT”就完了；连接器决定图像 token 数、融合深度和训练成本。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  I[图像] --&gt; V[ViT patch]\n  V --&gt; C[连接器 MLP/Resampler]\n  C --&gt; T[图像 token 256-1024]\n  X[文本 token] --&gt; L[LLM]\n  T --&gt; L<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>MLP 把每个 patch 特征投到 LLM 维度，token 多、细节保留好；Resampler 用固定查询把变长 patch 压成固定 token，省 token 但丢细节；交叉注意力在 LLM 层直接读视觉特征，融合深但工程复杂。<\/p>\n<p>图像 token 和文本 token 一样进 KV。448×448、patch 14 是 1024 token；2×2 合并后 256。动态分辨率/ tiling 会让 token 数平方涨。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n“图像 token 不占上下文”——占，而且进 KV。\n<\/li><li>\n“分辨率越高越好”——token 和 KV 平方涨。\n<\/li><li>\n“多模态都能生成图”——多数只理解；生成要看生成头。\n<\/ul>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：ViT、注意力\n<\/li><li>\n后续：LLaVA、Qwen-VL、Janus\n<\/ul>", "kind": "concept", "title": "多模态连接器"}, "c09": {"html": "<div class=\"source-badge\">📖 出处：https://huggingface.co/docs/transformers<\/div><h1>Tokenizer 与词表<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 15 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>Tokenizer 把文本切成 token，词表大小决定 embedding/输出头参数量和语言覆盖。<\/p>\n<h2>为什么重要<\/h2>\n<p>词表影响参数量、推理速度、中文/代码切分质量。Llama 3 从 32K 词表换到 128K，是为了提高压缩率和多语言效率。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  T[文本] --&gt; B[BPE/SentencePiece]\n  B --&gt; I[token ids]\n  I --&gt; E[embedding 矩阵 V x H]\n  E --&gt; L[Transformer]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>词表 <span class=\"katex-inline\">V<\/span> 越大，embedding 和输出头越大（<span class=\"katex-inline\">VH<\/span>），但同样文本的 token 数可能更少。Llama 3 128K 词表、Qwen 151K/248K、Gemma 256K/262K、DeepSeek 128K。中文模型通常词表更大，减少中文被切碎。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n“词表越大越好”——embedding 参数和 softmax 变大，小模型不划算。\n<\/li><li>\n“同一个文本在不同模型 token 数一样”——tokenizer 不同，token 数不同。\n<\/li><li>\n“tokenizer 不影响架构”——它决定输入长度和输出头大小。\n<\/ul>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：embedding、softmax\n<\/li><li>\n后续：参数量估算、多语言\n<\/ul>", "kind": "concept", "title": "Tokenizer 与词表"}, "c10": {"html": "<div class=\"source-badge\">📖 出处：https://huggingface.co/models<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c03\">稠密与 MoE<\/a><\/span><\/div><h1>总参数与激活参数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 11 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>总参数是模型全部权重，决定显存；激活参数是每 token 实际参与计算的权重，决定算力。<\/p>\n<h2>为什么重要<\/h2>\n<p><code>2.4T-A95B<\/code>、<code>671B/37B<\/code>、<code>109B/17B<\/code> 这些写法都要求你分开读；混了就会估错显存和成本。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[总参数] --&gt; B[权重显存]\n  C[激活参数] --&gt; D[每 token 算力]\n  E[MoE 路由] --&gt; C\n  F[全部专家] --&gt; A<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>稠密模型总参数=激活参数。MoE 总参数包含所有专家，激活只含 top-k 专家 + 注意力/embedding。Qwen3.8-2.4T-A95B：2.4T 总、95B 激活，比例约 4%。Llama 4 Scout：109B 总、17B 激活，比例约 15.6%。<\/p>\n<p>显存按总参数估（FP16 每 B 约 2GB），算力按激活参数估；但 MoE 还有专家并行通信和路由开销。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n“A95B 是总参数”——A 是 active。\n<\/li><li>\n“MoE 显存按激活算”——权重全装，按总参数。\n<\/li><li>\n“激活小就一定快”——通信/路由/显存带宽可能拖后腿。\n<\/ul>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：MoE、FFN\n<\/li><li>\n后续：专家并行、部署\n<\/ul>", "kind": "concept", "title": "总参数与激活参数"}, "c11": {"html": "<div class=\"source-badge\">📖 出处：https://huggingface.co/docs/hub/model-cards<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">开放权重与开源<\/a><\/span><\/div><h1>许可证族<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1、8、9、14 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>许可证决定你能不能商用、修改、再分发；Apache/MIT 最宽松，Llama/Gemma 有条件，CC-BY-NC 禁止商用，自定义 <code>other<\/code> 逐条读。<\/p>\n<h2>为什么重要<\/h2>\n<p>模型再好，许可证不允许商用就不能上线；这是选型的第一道门。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[许可证] --&gt; B{商用?}\n  B --&gt;|是| C[Apache/MIT]\n  B --&gt;|有条件| D[Llama/Gemma]\n  B --&gt;|否| E[CC-BY-NC]\n  B --&gt;|逐条读| F[自定义 other]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>Apache 2.0 允许商用/修改/再分发，有专利授予；MIT 更短更宽松；Llama Community 有月活/命名/衍生条款；Gemma Terms 不是 OSI 认证；CC-BY-NC 禁止商用；<code>other<\/code> 可能是研究许可、社区许可、自定义商用限制。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n“open weights 就是开源许可证”——不是。\n<\/li><li>\n“Apache 2.0 不用署名”——要保留声明/NOTICE。\n<\/li><li>\n“CC-BY-NC 可以内部商用”——NC 通常禁商用，内部商用也算。\n<\/ul>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：开放权重\n<\/li><li>\n后续：模型卡审计、合规\n<\/ul>", "kind": "concept", "title": "许可证族"}, "c12": {"html": "<div class=\"source-badge\">📖 出处：https://huggingface.co/docs/hub/model-cards<\/div><h1>Benchmark 污染<\/h1>\n<ul><li>\n<strong>难度<\/strong>：中高 | <strong>涉及章节<\/strong>：第 14 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>评测题出现在预训练/微调数据里，模型靠记忆而不是推理得分；排行榜分数因此失真。<\/p>\n<h2>为什么重要<\/h2>\n<p>开放模型常报 MMLU/GSM8K/HumanEval 分数；不查污染，选型会被“高分低能”骗。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[Benchmark 题目] --&gt; B{出现在训练语料?}\n  B --&gt;|是| C[记忆答案]\n  B --&gt;|否| D[真实推理]\n  C --&gt; E[分数虚高]\n  D --&gt; F[可信分数]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>检测方法：看模型卡是否报告 decontamination；用改写/换数字/换语境的题重测；对比新题与原题分数；检查训练数据 n-gram 重叠。公开 benchmark 越老，污染风险越高。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n“排行榜第一就是最强”——任务/数据/评测方法不同。\n<\/li><li>\n“模型卡说去污染就干净”——方法可能不彻底。\n<\/li><li>\n“分数高就能上线”——还要看你的任务分布。\n<\/ul>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：训练/测试集、评测指标\n<\/li><li>\n后续：模型选型、LLM-as-judge\n<\/ul>", "kind": "concept", "title": "Benchmark 污染"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：边界与地图<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：先定边界：开源、开放权重与“能下载”<\/a>、<a href=\"#/chapter/ch02\">第 2 章：世界地图：六种骨架，而不是六个公司<\/a><br>检查点：能解释开放权重/开源/许可证三层，能画出六种骨架<\/li><li class='path-step' id='path-02'><strong>步骤 02：Llama 与 Qwen<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：Llama 家族：decoder-only 的行业基线<\/a>、<a href=\"#/chapter/ch04\">第 4 章：Qwen 家族：从 0.5B 到 2.4T-A95B 的缩放路线<\/a><br>检查点：能读 70B 和 2.4T-A95B 的 config，算 KV<\/li><li class='path-step' id='path-03'><strong>步骤 03：Mistral、Gemma、Phi<\/strong><br>阅读：<a href=\"#/chapter/ch05\">第 5 章：Mistral 家族：滑窗、MoE 与多模态的三次转向<\/a>、<a href=\"#/chapter/ch06\">第 6 章：Gemma 家族：小模型、局部/全局交替与统一多模态<\/a>、<a href=\"#/chapter/ch07\">第 7 章：Phi 与“小模型优先”路线<\/a><br>检查点：能比较滑窗、局部/全局、小模型三条路线<\/li><li class='path-step' id='path-04'><strong>步骤 04：北美与中国其他家族<\/strong><br>阅读：<a href=\"#/chapter/ch08\">第 8 章：北美开放权重：Falcon、BLOOM、OLMo、DBRX 与“非 Llama”路线<\/a>、<a href=\"#/chapter/ch09\">第 9 章：中国开放权重：GLM、Kimi、MiniMax、InternLM 与“多路线并行”<\/a><br>检查点：能列出 8 个家族的结构差异与许可证<\/li><li class='path-step' id='path-05'><strong>步骤 05：非 Transformer 与 MoE<\/strong><br>阅读：<a href=\"#/chapter/ch10\">第 10 章：非 Transformer：RWKV、Mamba、Jamba 与混合注意力<\/a>、<a href=\"#/chapter/ch11\">第 11 章：MoE 世界：总参数、激活参数与路由的代价<\/a><br>检查点：能手算 2.4T/95B 的激活比例<\/li><li class='path-step' id='path-06'><strong>步骤 06：多模态与注意力<\/strong><br>阅读：<a href=\"#/chapter/ch12\">第 12 章：多模态开放模型：图像怎么变成 token<\/a>、<a href=\"#/chapter/ch13\">第 13 章：注意力与长上下文：MHA、GQA、MLA、滑窗与线性注意力<\/a><br>检查点：能算 448×448 图像 token 与 1M KV<\/li><li class='path-step' id='path-07'><strong>步骤 07：许可证、评测与 config<\/strong><br>阅读：<a href=\"#/chapter/ch14\">第 14 章：许可证、数据与评测：开放模型的“隐形架构”<\/a>、<a href=\"#/chapter/ch15\">第 15 章：读 config.json：把架构字段变成可计算的账<\/a>、<a href=\"#/chapter/ch16\">第 16 章：附录：全球开放权重模型索引<\/a><br>检查点：给定预算和任务，能写选型理由<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__graph__": {"html": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "kind": "graph", "title": "知识图谱"}, "__quiz_all__": {"html": "<p>（无综合题）<\/p>", "kind": "quiz", "title": "综合测验"}, "__quiz_ch01__": {"html": "<h1>测验：第 1 章：先定边界：开源、开放权重与“能下载”<\/h1><div class='quiz-item' data-qid='q01' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> “开放权重”最准确的含义是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 模型参数可下载<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 训练数据公开<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 训练代码公开<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 许可证允许商用<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single' data-concept='c11' data-chapter='ch01'><p class='quiz-q'><b>Q2.<\/b> Apache 2.0 与 CC-BY-NC 最关键的区别是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 前者允许商用，后者禁止商用<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 前者禁止修改，后者允许<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 两者都禁止商用<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 前者只允许研究<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q3.<\/b> 本册为什么按“家族”而不是按每个 checkpoint 组织？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> checkpoint 数量无穷且架构重复<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 家族名字更好听<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 每个 checkpoint 都有独立架构<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> Hugging Face 不支持 checkpoint<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch02__": {"html": "<h1>测验：第 2 章：世界地图：六种骨架，而不是六个公司<\/h1><div class='quiz-item' data-qid='q04' data-type='single' data-concept='c02' data-chapter='ch02'><p class='quiz-q'><b>Q1.<\/b> 下列哪一项不是本章说的“结构旋钮”？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> 学习率<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> 注意力类型<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> FFN 类型<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> 位置编码<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q05' data-type='single' data-concept='c10' data-chapter='ch02'><p class='quiz-q'><b>Q2.<\/b> MoE 的“总参数”和“激活参数”分别决定什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> 显存 / 每 token 算力<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> 算力 / 显存<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> 都决定显存 k'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch13__": {"html": "<h1>测验：第 13 章：注意力与长上下文：MHA、GQA、MLA、滑窗与线性注意力<\/h1><div class='quiz-item' data-qid='q41' data-type='single' data-concept='c04' data-chapter='ch13'><p class='quiz-q'><b>Q1.<\/b> GQA 的 KV/token/layer 公式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q41' value='0'> 2 × H_kv × d_head × b<\/label><label class='quiz-opt'><input type='radio' name='q41' value='1'> 2 × H × d_head × b<\/label><label class='quiz-opt'><input type='radio' name='q41' value='2'> H × d_head × b<\/label><label class='quiz-opt'><input type='radio' name='q41' value='3'> 2 × L × H × b<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q42' data-type='single' data-concept='c04' data-chapter='ch13'><p class='quiz-q'><b>Q2.<\/b> Llama 3.3 70B 在 32K 下单序列 KV 约多少？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q42' value='0'> 10 GiB<\/label><label class='quiz-opt'><input type='radio' name='q42' value='1'> 40 GiB<\/label><label class='quiz-opt'><input type='radio' name='q42' value='2'> 4 GiB<\/label><label class='quiz-opt'><input type='radio' name='q42' value='3'> 100 GiB<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q43' data-type='single' data-concept='c04' data-chapter='ch13'><p class='quiz-q'><b>Q3.<\/b> 1M 上下文模型为什么必须稀疏/压缩？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q43' value='0'> 朴素 KV 可达数百 GiB<\/label><label class='quiz-opt'><input type='radio' name='q43' value='1'> 因为词表太大<\/label><label class='quiz-opt'><input type='radio' name='q43' value='2'> 因为层数太少<\/label><label class='quiz-opt'><input type='radio' name='q43' value='3'> 因为不能用 GPU<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q44' data-type='single' data-concept='c05' data-chapter='ch13'><p class='quiz-q'><b>Q4.<\/b> YaRN 的 factor 表示什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q44' value='0'> 长度外推倍数<\/label><label class='quiz-opt'><input type='radio' name='q44' value='1'> KV 头数<\/label><label class='quiz-opt'><input type='radio' name='q44' value='2'> 专家数<\/label><label class='quiz-opt'><input type='radio' name='q44' value='3'> 学习率<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch14__": {"html": "<h1>测验：第 14 章：许可证、数据与评测：开放模型的“隐形架构”<\/h1><div class='quiz-item' data-qid='q45' data-type='single' data-concept='c11' data-chapter='ch14'><p class='quiz-q'><b>Q1.<\/b> CC-BY-NC 的核心限制是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q45' value='0'> 禁止商用<\/label><label class='quiz-opt'><input type='radio' name='q45' value='1'> 禁止修改<\/label><label class='quiz-opt'><input type='radio' name='q45' value='2'> 禁止再分发<\/label><label class='quiz-opt'><input type='radio' name='q45' value='3'> 禁止研究<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q46' data-type='single' data-concept='c01' data-chapter='ch14'><p class='quiz-q'><b>Q2.<\/b> OLMo 比 Llama 更适合训练复现，因为？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q46' value='0'> 开放数据/代码/日志<\/label><label class='quiz-opt'><input type='radio' name='q46' value='1'> 参数更大<\/label><label class='quiz-opt'><input type='radio' name='q46' value='2'> 没有注意力<\/label><label class='quiz-opt'><input type='radio' name='q46' value='3'> 许可证更严<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q47' data-type='single' data-concept='c12' data-chapter='ch14'><p class='quiz-q'><b>Q3.<\/b> 检测 benchmark 污染的可行方法是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q47' value='0'> 改写题目/换数字重测<\/label><label class='quiz-opt'><input type='radio' name='q47' value='1'> 只看排行榜<\/label><label class='quiz-opt'><input type='radio' name='q47' value='2'> 只看模型大小<\/label><label class='quiz-opt'><input type='radio' name='q47' value='3'> 只跑一个样本<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch15__": {"html": "<h1>测验：第 15 章：读 config.json：把架构字段变成可计算的账<\/h1><div class='quiz-item' data-qid='q48' data-type='single' data-concept='c02' data-chapter='ch15'><p class='quiz-q'><b>Q1.<\/b> <code>architectures<\/code> 和 <code>model_type<\/code> 的区别是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q48' value='0'> 前者是类名，后者是配置族<\/label><label class='quiz-opt'><input type='radio' name='q48' value='1'> 两者完全一样<\/label><label class='quiz-opt'><input type='radio' name='q48' value='2'> 前者是许可证<\/label><label class='quiz-opt'><input type='radio' name='q48' value='3'> 后者是参数量<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q49' data-type='single' data-concept='c03' data-chapter='ch15'><p class='quiz-q'><b>Q2.<\/b> <code>num_experts<\/code> 和 <code>num_experts_per_tok<\/code> 的区别是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q49' value='0'> 总专家数 / top-k<\/label><label class='quiz-opt'><input type='radio' name='q49' value='1'> top-k / 总专家数<\/label><label class='quiz-opt'><input type='radio' name='q49' value='2'> 层数 / 头数<\/label><label class='quiz-opt'><input type='radio' name='q49' value='3'> 词表 / 上下文<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q50' data-type='single' data-concept='c10' data-chapter='ch15'><p class='quiz-q'><b>Q3.<\/b> Qwen3.8-2.4T 的 95B 激活大致来自？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q50' value='0'> top-10 专家 + 注意力/embedding<\/label><label class='quiz-opt'><input type='radio' name='q50' value='1'> 全部 512 专家<\/label><label class='quiz-opt'><input type='radio' name='q50' value='2'> 只 embedding<\/label><label class='quiz-opt'><input type='radio' name='q50' value='3'> 只 KV cache<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch16__": {"html": "<h1>测验：第 16 章：附录：全球开放权重模型索引<\/h1><div class='quiz-item' data-qid='q51' data-type='single' data-concept='c01' data-chapter='ch16'><p class='quiz-q'><b>Q1.<\/b> 本索引的收录口径是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q51' value='0'> 官方公开、可下载权重的主要家族<\/label><label class='quiz-opt'><input type='radio' name='q51' value='1'> 所有微调/量化 checkpoint<\/label><label class='quiz-opt'><input type='radio' name='q51' value='2'> 所有论文<\/label><label class='quiz-opt'><input type='radio' name='q51' value='3'> 所有 API 模型<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q52' data-type='single' data-concept='c10' data-chapter='ch16'><p class='quiz-q'><b>Q2.<\/b> MoE 权重显存按哪个参数估？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q52' value='0'> 总参数<\/label><label class='quiz-opt'><input type='radio' name='q52' value='1'> 激活参数<\/label><label class='quiz-opt'><input type='radio' name='q52' value='2'> KV 头数<\/label><label class='quiz-opt'><input type='radio' name='q52' value='3'> 词表<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q53' data-type='single' data-concept='c11' data-chapter='ch16'><p class='quiz-q'><b>Q3.<\/b> 选型的正确顺序是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q53' value='0'> 许可证 → 显存 → 上下文 → 任务<\/label><label class='quiz-opt'><input type='radio' name='q53' value='1'> 参数 → 名字 → 排行榜<\/label><label class='quiz-opt'><input type='radio' name='q53' value='2'> 价格 → 颜色 → 品牌<\/label><label class='quiz-opt'><input type='radio' name='q53' value='3'> 上下文 → 许可证 → 参数量<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='transformer'>Transformer — 由自注意力、FFN、残差和归一化堆叠成的序列模型骨架 <span class=glossary-ref>（第 2 章：世界地图：六种骨架，而不是六个公司）<\/span><\/li><li data-term='decoder-only'>decoder-only — 只用因果解码器、按下一个 token 预测训练的架构 <span class=glossary-ref>（第 2 章：世界地图：六种骨架，而不是六个公司）<\/span><\/li><li data-term='encoder-decoder'>encoder-decoder — 编码器双向读输入、解码器自回归生成的架构 <span class=glossary-ref>（第 2 章：世界地图：六种骨架，而不是六个公司）<\/span><\/li><li data-term='注意力'>注意力 — 让每个 token 根据相关性聚合其他 token 信息的机制 <span class=glossary-ref>（第 2 章：世界地图：六种骨架，而不是六个公司）<\/span><\/li><li data-term='自注意力'>自注意力 — Q/K/V 都来自同一序列的注意力 <span class=glossary-ref>（第 2 章：世界地图：六种骨架，而不是六个公司）<\/span><\/li><li data-term='因果掩码'>因果掩码 — 禁止 token 看到未来位置的掩码 <span class=glossary-ref>（第 2 章：世界地图：六种骨架，而不是六个公司）<\/span><\/li><li data-term='mha'>MHA — 每个 Q 头有独立 K/V 的多头注意力 <span class=glossary-ref>（第 13 章：注意力与长上下文：MHA、GQA、MLA、滑窗与线性注意力）<\/span><\/li><li data-term='mqa'>MQA — 所有 Q 头共享 1 组 K/V 的多查询注意力 <span class=glossary-ref>（第 13 章：注意力与长上下文：MHA、GQA、MLA、滑窗与线性注意力）<\/span><\/li><li data-term='gqa'>GQA — Q 头分组共享 K/V 的分组查询注意力 <span class=glossary-ref>（第 13 章：注意力与长上下文：MHA、GQA、MLA、滑窗与线性注意力）<\/span><\/li><li data-term='mla'>MLA — 把 K/V 压成低秩潜向量再投影的多头潜在注意力 <span class=glossary-ref>（第 13 章：注意力与长上下文：MHA、GQA、MLA、滑窗与线性注意力）<\/span><\/li><li data-term='kv cache'>KV cache — 推理时缓存的 Key/Value，避免每步重算历史 <span class=glossary-ref>（第 13 章：注意力与长上下文：MHA、GQA、MLA、滑窗与线性注意力）<\/span><\/li><li data-term='rope'>RoPE — 用旋转位置编码让注意力只看相对位置的方案 <span class=glossary-ref>（第 13 章：注意力与长上下文：MHA、GQA、MLA、滑窗与线性注意力）<\/span><\/li><li data-term='yarn'>YaRN — 通过改旋转频率/温度把上下文外推的方法 <span class=glossary-ref>（第 13 章：注意力与长上下文：MHA、GQA、MLA、滑窗与线性注意力）<\/span><\/li><li data-term='alibi'>ALiBi — 用距离线性偏置代替位置编码的方案 <span class=glossary-ref>（第 8 章：北美开放权重：Falcon、BLOOM、OLMo、DBRX 与“非 Llama”路线）<\/span><\/li><li data-term='sliding window'>sliding window — 每个 token 只看最近 W 个 token 的注意力 <span class=glossary-ref>（第 5 章：Mistral 家族：滑窗、MoE 与多模态的三次转向）<\/span><\/li><li data-term='局部/全局注意力'>局部/全局注意力 — 多数层看局部窗口、少数层看全序列的交替设计 <span class=glossary-ref>（第 6 章：Gemma 家族：小模型、局部/全局交替与统一多模态）<\/span><\/li><li data-term='rmsnorm'>RMSNorm — 只按均方根归一化、不减均值的归一化 <span class=glossary-ref>（第 3 章：Llama 家族：decoder-only 的行业基线）<\/span><\/li><li data-term='layernorm'>LayerNorm — 减均值、除标准差再仿射的归一化 <span class=glossary-ref>（第 3 章：Llama 家族：decoder-only 的行业基线）<\/span><\/li><li data-term='qk-norm'>QK-Norm — 注意力前对 Q/K 做归一化，稳定大 head_dim 训练 <span class=glossary-ref>（第 6 章：Gemma 家族：小模型、局部/全局交替与统一多模态）<\/span><\/li><li data-term='swiglu'>SwiGLU — 用 Swish 门控的两个线性投影组成的 FFN <span class=glossary-ref>（第 3 章：Llama 家族：decoder-only 的行业基线）<\/span><\/li><li data-term='ffn'>FFN — Transformer 层里的前馈网络 <span class=glossary-ref>（第 2 章：世界地图：六种骨架，而不是六个公司）<\/span><\/li><li data-term='moe'>MoE — 把 FFN 拆成多个专家、每 token 只激活 top-k 的架构 <span class=glossary-ref>（第 11 章：MoE 世界：总参数、激活参数与路由的代价）<\/span><\/li><li data-term='router'>router — 给每个 token 选择专家并输出权重的门控网络 <span class=glossary-ref>（第 11 章：MoE 世界：总参数、激活参数与路由的代价）<\/span><\/li><li data-term='top-k'>top-k — 每个 token 只激活的专家数量 <span class=glossary-ref>（第 11 章：MoE 世界：总参数、激活参数与路由的代价）<\/span><\/li><li data-term='expert'>expert — MoE 中独立的一套 FFN 参数 <span class=glossary-ref>（第 11 章：MoE 世界：总参数、激活参数与路由的代价）<\/span><\/li><li data-term='shared expert'>shared expert — 所有 token 都经过的通用专家 <span class=glossary-ref>（第 11 章：MoE 世界：总参数、激活参数与路由的代价）<\/span><\/li><li data-term='total params'>total params — 模型全部权重，决定显存 <span class=glossary-ref>（第 11 章：MoE 世界：总参数、激活参数与路由的代价）<\/span><\/li><li data-term='active params'>active params — 每 token 实际参与计算的权重，决定算力 <span class=glossary-ref>（第 11 章：MoE 世界：总参数、激活参数与路由的代价）<\/span><\/li><li data-term='expert parallelism'>expert parallelism — 把不同专家放到不同设备上的并行方式 <span class=glossary-ref>（第 11 章：MoE 世界：总参数、激活参数与路由的代价）<\/span><\/li><li data-term='load balancing'>load balancing — 让 token 均匀分配到专家的训练约束 <span class=glossary-ref>（第 11 章：MoE 世界：总参数、激活参数与路由的代价）<\/span><\/li><li data-term='dense'>dense — 每个 token 都走同一套 FFN 的模型 <span class=glossary-ref>（第 11 章：MoE 世界：总参数、激活参数与路由的代价）<\/span><\/li><li data-term='sparse attention'>sparse attention — 每 token 只和部分历史做注意力的机制 <span class=glossary-ref>（第 13 章：注意力与长上下文：MHA、GQA、MLA、滑窗与线性注意力）<\/span><\/li><li data-term='dsa'>DSA — 用索引器选 top-k 历史 token 的稀疏注意力 <span class=glossary-ref>（第 13 章：注意力与长上下文：MHA、GQA、MLA、滑窗与线性注意力）<\/span><\/li><li data-term='linear attention'>linear attention — 用核函数/递归把注意力降到 O(n) 的方案 <span class=glossary-ref>（第 10 章：非 Transformer：RWKV、Mamba、Jamba 与混合注意力）<\/span><\/li><li data-term='ssm'>SSM — 用固定状态递推建模序列的状态空间模型 <span class=glossary-ref>（第 10 章：非 Transformer：RWKV、Mamba、Jamba 与混合注意力）<\/span><\/li><li data-term='mamba'>Mamba — 带选择性状态的空间状态模型 <span class=glossary-ref>（第 10 章：非 Transformer：RWKV、Mamba、Jamba 与混合注意力）<\/span><\/li><li data-term='rwkv'>RWKV — RNN 化 Transformer，time-mix + channel-mix <span class=glossary-ref>（第 10 章：非 Transformer：RWKV、Mamba、Jamba 与混合注意力）<\/span><\/li><li data-term='hybrid architecture'>hybrid architecture — 线性/SSM 层与全注意力层混合的架构 <span class=glossary-ref>（第 10 章：非 Transformer：RWKV、Mamba、Jamba 与混合注意力）<\/span><\/li><li data-term='jamba'>Jamba — Transformer + Mamba 的混合模型 <span class=glossary-ref>（第 10 章：非 Transformer：RWKV、Mamba、Jamba 与混合注意力）<\/span><\/li><li data-term='griffin'>Griffin — RG-LRU + 局部注意力的混合模型 <span class=glossary-ref>（第 10 章：非 Transformer：RWKV、Mamba、Jamba 与混合注意力）<\/span><\/li><li data-term='xlstm'>xLSTM — 指数门控 + 矩阵记忆的 LSTM 变体 <span class=glossary-ref>（第 10 章：非 Transformer：RWKV、Mamba、Jamba 与混合注意力）<\/span><\/li><li data-term='multimodal'>multimodal — 同时处理文本、图像、音频等模态的模型 <span class=glossary-ref>（第 12 章：多模态开放模型：图像怎么变成 token）<\/span><\/li><li data-term='vit'>ViT — 把图像切 patch 后用 Transformer 编码的视觉模型 <span class=glossary-ref>（第 12 章：多模态开放模型：图像怎么变成 token）<\/span><\/li><li data-term='patch'>patch — 图像切分后的固定大小块 <span class=glossary-ref>（第 12 章：多模态开放模型：图像怎么变成 token）<\/span><\/li><li data-term='connector'>connector — 把视觉/音频特征投到语言模型维度的模块 <span class=glossary-ref>（第 12 章：多模态开放模型：图像怎么变成 token）<\/span><\/li><li data-term='resampler'>resampler — 用固定查询把变长视觉特征压成固定 token 的模块 <span class=glossary-ref>（第 12 章：多模态开放模型：图像怎么变成 token）<\/span><\/li><li data-term='early fusion'>early fusion — 在较早层把多模态 token 拼在一起的融合 <span class=glossary-ref>（第 12 章：多模态开放模型：图像怎么变成 token）<\/span><\/li><li data-term='late fusion'>late fusion —
