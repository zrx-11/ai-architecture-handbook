 头数<\/label><label class='quiz-opt'><input type='radio' name='q44' value='2'> 专家数<\/label><label class='quiz-opt'><input type='radio' name='q44' value='3'> 学习率<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch14__": "<h1>测验：第 14 章：许可证、数据与评测：开放模型的“隐形架构”<\/h1><div class='quiz-item' data-qid='q45' data-type='single' data-concept='c11' data-chapter='ch14'><p class='quiz-q'><b>Q1.<\/b> CC-BY-NC 的核心限制是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q45' value='0'> 禁止商用<\/label><label class='quiz-opt'><input type='radio' name='q45' value='1'> 禁止修改<\/label><label class='quiz-opt'><input type='radio' name='q45' value='2'> 禁止再分发<\/label><label class='quiz-opt'><input type='radio' name='q45' value='3'> 禁止研究<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q46' data-type='single' data-concept='c01' data-chapter='ch14'><p class='quiz-q'><b>Q2.<\/b> OLMo 比 Llama 更适合训练复现，因为？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q46' value='0'> 开放数据/代码/日志<\/label><label class='quiz-opt'><input type='radio' name='q46' value='1'> 参数更大<\/label><label class='quiz-opt'><input type='radio' name='q46' value='2'> 没有注意力<\/label><label class='quiz-opt'><input type='radio' name='q46' value='3'> 许可证更严<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q47' data-type='single' data-concept='c12' data-chapter='ch14'><p class='quiz-q'><b>Q3.<\/b> 检测 benchmark 污染的可行方法是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q47' value='0'> 改写题目/换数字重测<\/label><label class='quiz-opt'><input type='radio' name='q47' value='1'> 只看排行榜<\/label><label class='quiz-opt'><input type='radio' name='q47' value='2'> 只看模型大小<\/label><label class='quiz-opt'><input type='radio' name='q47' value='3'> 只跑一个样本<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch15__": "<h1>测验：第 15 章：读 config.json：把架构字段变成可计算的账<\/h1><div class='quiz-item' data-qid='q48' data-type='single' data-concept='c02' data-chapter='ch15'><p class='quiz-q'><b>Q1.<\/b> <code>architectures<\/code> 和 <code>model_type<\/code> 的区别是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q48' value='0'> 前者是类名，后者是配置族<\/label><label class='quiz-opt'><input type='radio' name='q48' value='1'> 两者完全一样<\/label><label class='quiz-opt'><input type='radio' name='q48' value='2'> 前者是许可证<\/label><label class='quiz-opt'><input type='radio' name='q48' value='3'> 后者是参数量<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q49' data-type='single' data-concept='c03' data-chapter='ch15'><p class='quiz-q'><b>Q2.<\/b> <code>num_experts<\/code> 和 <code>num_experts_per_tok<\/code> 的区别是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q49' value='0'> 总专家数 / top-k<\/label><label class='quiz-opt'><input type='radio' name='q49' value='1'> top-k / 总专家数<\/label><label class='quiz-opt'><input type='radio' name='q49' value='2'> 层数 / 头数<\/label><label class='quiz-opt'><input type='radio' name='q49' value='3'> 词表 / 上下文<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q50' data-type='single' data-concept='c10' data-chapter='ch15'><p class='quiz-q'><b>Q3.<\/b> Qwen3.8-2.4T 的 95B 激活大致来自？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q50' value='0'> top-10 专家 + 注意力/embedding<\/label><label class='quiz-opt'><input type='radio' name='q50' value='1'> 全部 512 专家<\/label><label class='quiz-opt'><input type='radio' name='q50' value='2'> 只 embedding<\/label><label class='quiz-opt'><input type='radio' name='q50' value='3'> 只 KV cache<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch16__": "<h1>测验：第 16 章：附录：全球开放权重模型索引<\/h1><div class='quiz-item' data-qid='q51' data-type='single' data-concept='c01' data-chapter='ch16'><p class='quiz-q'><b>Q1.<\/b> 本索引的收录口径是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q51' value='0'> 官方公开、可下载权重的主要家族<\/label><label class='quiz-opt'><input type='radio' name='q51' value='1'> 所有微调/量化 checkpoint<\/label><label class='quiz-opt'><input type='radio' name='q51' value='2'> 所有论文<\/label><label class='quiz-opt'><input type='radio' name='q51' value='3'> 所有 API 模型<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q52' data-type='single' data-concept='c10' data-chapter='ch16'><p class='quiz-q'><b>Q2.<\/b> MoE 权重显存按哪个参数估？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q52' value='0'> 总参数<\/label><label class='quiz-opt'><input type='radio' name='q52' value='1'> 激活参数<\/label><label class='quiz-opt'><input type='radio' name='q52' value='2'> KV 头数<\/label><label class='quiz-opt'><input type='radio' name='q52' value='3'> 词表<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q53' data-type='single' data-concept='c11' data-chapter='ch16'><p class='quiz-q'><b>Q3.<\/b> 选型的正确顺序是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q53' value='0'> 许可证 → 显存 → 上下文 → 任务<\/label><label class='quiz-opt'><input type='radio' name='q53' value='1'> 参数 → 名字 → 排行榜<\/label><label class='quiz-opt'><input type='radio' name='q53' value='2'> 价格 → 颜色 → 品牌<\/label><label class='quiz-opt'><input type='radio' name='q53' value='3'> 上下文 → 许可证 → 参数量<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='transformer'>Transformer — 由自注意力、FFN、残差和归一化堆叠成的序列模型骨架 <span class=glossary-ref>（第 2 章：世界地图：六种骨架，而不是六个公司）<\/span><\/li><li data-term='decoder-only'>decoder-only — 只用因果解码器、按下一个 token 预测训练的架构 <span class=glossary-ref>（第 2 章：世界地图：六种骨架，而不是六个公司）<\/span><\/li><li data-term='encoder-decoder'>encoder-decoder — 编码器双向读输入、解码器自回归生成的架构 <span class=glossary-ref>（第 2 章：世界地图：六种骨架，而不是六个公司）<\/span><\/li><li data-term='注意力'>注意力 — 让每个 token 根据相关性聚合其他 token 信息的机制 <span class=glossary-ref>（第 2 章：世界地图：六种骨架，而不是六个公司）<\/span><\/li><li data-term='自注意力'>自注意力 — Q/K/V 都来自同一序列的注意力 <span class=glossary-ref>（第 2 章：世界地图：六种骨架，而不是六个公司）<\/span><\/li><li data-term='因果掩码'>因果掩码 — 禁止 token 看到未来位置的掩码 <span class=glossary-ref>（第 2 章：世界地图：六种骨架，而不是六个公司）<\/span><\/li><li data-term='mha'>MHA — 每个 Q 头有独立 K/V 的多头注意力 <span class=glossary-ref>（第 13 章：注意力与长上下文：MHA、GQA、MLA、滑窗与线性注意力）<\/span><\/li><li data-term='mqa'>MQA — 所有 Q 头共享 1 组 K/V 的多查询注意力 <span class=glossary-ref>（第 13 章：注意力与长上下文：MHA、GQA、MLA、滑窗与线性注意力）<\/span><\/li><li data-term='gqa'>GQA — Q 头分组共享 K/V 的分组查询注意力 <span class=glossary-ref>（第 13 章：注意力与长上下文：MHA、GQA、MLA、滑窗与线性注意力）<\/span><\/li><li data-term='mla'>MLA — 把 K/V 压成低秩潜向量再投影的多头潜在注意力 <span class=glossary-ref>（第 13 章：注意力与长上下文：MHA、GQA、MLA、滑窗与线性注意力）<\/span><\/li><li data-term='kv cache'>KV cache — 推理时缓存的 Key/Value，避免每步重算历史 <span class=glossary-ref>（第 13 章：注意力与长上下文：MHA、GQA、MLA、滑窗与线性注意力）<\/span><\/li><li data-term='rope'>RoPE — 用旋转位置编码让注意力只看相对位置的方案 <span class=glossary-ref>（第 13 章：注意力与长上下文：MHA、GQA、MLA、滑窗与线性注意力）<\/span><\/li><li data-term='yarn'>YaRN — 通过改旋转频率/温度把上下文外推的方法 <span class=glossary-ref>（第 13 章：注意力与长上下文：MHA、GQA、MLA、滑窗与线性注意力）<\/span><\/li><li data-term='alibi'>ALiBi — 用距离线性偏置代替位置编码的方案 <span class=glossary-ref>（第 8 章：北美开放权重：Falcon、BLOOM、OLMo、DBRX 与“非 Llama”路线）<\/span><\/li><li data-term='sliding window'>sliding window — 每个 token 只看最近 W 个 token 的注意力 <span class=glossary-ref>（第 5 章：Mistral 家族：滑窗、MoE 与多模态的三次转向）<\/span><\/li><li data-term='局部/全局注意力'>局部/全局注意力 — 多数层看局部窗口、少数层看全序列的交替设计 <span class=glossary-ref>（第 6 章：Gemma 家族：小模型、局部/全局交替与统一多模态）<\/span><\/li><li data-term='rmsnorm'>RMSNorm — 只按均方根归一化、不减均值的归一化 <span class=glossary-ref>（第 3 章：Llama 家族：decoder-only 的行业基线）<\/span><\/li><li data-term='layernorm'>LayerNorm — 减均值、除标准差再仿射的归一化 <span class=glossary-ref>（第 3 章：Llama 家族：decoder-only 的行业基线）<\/span><\/li><li data-term='qk-norm'>QK-Norm — 注意力前对 Q/K 做归一化，稳定大 head_dim 训练 <span class=glossary-ref>（第 6 章：Gemma 家族：小模型、局部/全局交替与统一多模态）<\/span><\/li><li data-term='swiglu'>SwiGLU — 用 Swish 门控的两个线性投影组成的 FFN <span class=glossary-ref>（第 3 章：Llama 家族：decoder-only 的行业基线）<\/span><\/li><li data-term='ffn'>FFN — Transformer 层里的前馈网络 <span class=glossary-ref>（第 2 章：世界地图：六种骨架，而不是六个公司）<\/span><\/li><li data-term='moe'>MoE — 把 FFN 拆成多个专家、每 token 只激活 top-k 的架构 <span class=glossary-ref>（第 11 章：MoE 世界：总参数、激活参数与路由的代价）<\/span><\/li><li data-term='router'>router — 给每个 token 选择专家并输出权重的门控网络 <span class=glossary-ref>（第 11 章：MoE 世界：总参数、激活参数与路由的代价）<\/span><\/li><li data-term='top-k'>top-k — 每个 token 只激活的专家数量 <span class=glossary-ref>（第 11 章：MoE 世界：总参数、激活参数与路由的代价）<\/span><\/li><li data-term='expert'>expert — MoE 中独立的一套 FFN 参数 <span class=glossary-ref>（第 11 章：MoE 世界：总参数、激活参数与路由的代价）<\/span><\/li><li data-term='shared expert'>shared expert — 所有 token 都经过的通用专家 <span class=glossary-ref>（第 11 章：MoE 世界：总参数、激活参数与路由的代价）<\/span><\/li><li data-term='total params'>total params — 模型全部权重，决定显存 <span class=glossary-ref>（第 11 章：MoE 世界：总参数、激活参数与路由的代价）<\/span><\/li><li data-term='active params'>active params — 每 token 实际参与计算的权重，决定算力 <span class=glossary-ref>（第 11 章：MoE 世界：总参数、激活参数与路由的代价）<\/span><\/li><li data-term='expert parallelism'>expert parallelism — 把不同专家放到不同设备上的并行方式 <span class=glossary-ref>（第 11 章：MoE 世界：总参数、激活参数与路由的代价）<\/span><\/li><li data-term='load balancing'>load balancing — 让 token 均匀分配到专家的训练约束 <span class=glossary-ref>（第 11 章：MoE 世界：总参数、激活参数与路由的代价）<\/span><\/li><li data-term='dense'>dense — 每个 token 都走同一套 FFN 的模型 <span class=glossary-ref>（第 11 章：MoE 世界：总参数、激活参数与路由的代价）<\/span><\/li><li data-term='sparse attention'>sparse attention — 每 token 只和部分历史做注意力的机制 <span class=glossary-ref>（第 13 章：注意力与长上下文：MHA、GQA、MLA、滑窗与线性注意力）<\/span><\/li><li data-term='dsa'>DSA — 用索引器选 top-k 历史 token 的稀疏注意力 <span class=glossary-ref>（第 13 章：注意力与长上下文：MHA、GQA、MLA、滑窗与线性注意力）<\/span><\/li><li data-term='linear attention'>linear attention — 用核函数/递归把注意力降到 O(n) 的方案 <span class=glossary-ref>（第 10 章：非 Transformer：RWKV、Mamba、Jamba 与混合注意力）<\/span><\/li><li data-term='ssm'>SSM — 用固定状态递推建模序列的状态空间模型 <span class=glossary-ref>（第 10 章：非 Transformer：RWKV、Mamba、Jamba 与混合注意力）<\/span><\/li><li data-term='mamba'>Mamba — 带选择性状态的空间状态模型 <span class=glossary-ref>（第 10 章：非 Transformer：RWKV、Mamba、Jamba 与混合注意力）<\/span><\/li><li data-term='rwkv'>RWKV — RNN 化 Transformer，time-mix + channel-mix <span class=glossary-ref>（第 10 章：非 Transformer：RWKV、Mamba、Jamba 与混合注意力）<\/span><\/li><li data-term='hybrid architecture'>hybrid architecture — 线性/SSM 层与全注意力层混合的架构 <span class=glossary-ref>（第 10 章：非 Transformer：RWKV、Mamba、Jamba 与混合注意力）<\/span><\/li><li data-term='jamba'>Jamba — Transformer + Mamba 的混合模型 <span class=glossary-ref>（第 10 章：非 Transformer：RWKV、Mamba、Jamba 与混合注意力）<\/span><\/li><li data-term='griffin'>Griffin — RG-LRU + 局部注意力的混合模型 <span class=glossary-ref>（第 10 章：非 Transformer：RWKV、Mamba、Jamba 与混合注意力）<\/span><\/li><li data-term='xlstm'>xLSTM — 指数门控 + 矩阵记忆的 LSTM 变体 <span class=glossary-ref>（第 10 章：非 Transformer：RWKV、Mamba、Jamba 与混合注意力）<\/span><\/li><li data-term='multimodal'>multimodal — 同时处理文本、图像、音频等模态的模型 <span class=glossary-ref>（第 12 章：多模态开放模型：图像怎么变成 token）<\/span><\/li><li data-term='vit'>ViT — 把图像切 patch 后用 Transformer 编码的视觉模型 <span class=glossary-ref>（第 12 章：多模态开放模型：图像怎么变成 token）<\/span><\/li><li data-term='patch'>patch — 图像切分后的固定大小块 <span class=glossary-ref>（第 12 章：多模态开放模型：图像怎么变成 token）<\/span><\/li><li data-term='connector'>connector — 把视觉/音频特征投到语言模型维度的模块 <span class=glossary-ref>（第 12 章：多模态开放模型：图像怎么变成 token）<\/span><\/li><li data-term='resampler'>resampler — 用固定查询把变长视觉特征压成固定 token 的模块 <span class=glossary-ref>（第 12 章：多模态开放模型：图像怎么变成 token）<\/span><\/li><li data-term='early fusion'>early fusion — 在较早层把多模态 token 拼在一起的融合 <span class=glossary-ref>（第 12 章：多模态开放模型：图像怎么变成 token）<\/span><\/li><li data-term='late fusion'>late fusion — 只把视觉特征当外挂、在输入端拼接的融合 <span class=glossary-ref>（第 12 章：多模态开放模型：图像怎么变成 token）<\/span><\/li><li data-term='any-to-any'>any-to-any — 文本/图像/音频等任意模态到任意模态的模型 <span class=glossary-ref>（第 12 章：多模态开放模型：图像怎么变成 token）<\/span><\/li><li data-term='image token'>image token — 图像 patch 经编码器/连接器后得到的 token <span class=glossary-ref>（第 12 章：多模态开放模型：图像怎么变成 token）<\/span><\/li><li data-term='tokenizer'>tokenizer — 把文本切成 token 的组件 <span class=glossary-ref>（第 15 章：读 config.json：把架构字段变成可计算的账）<\/span><\/li><li data-term='vocab'>vocab — tokenizer 的词表大小 <span class=glossary-ref>（第 15 章：读 config.json：把架构字段变成可计算的账）<\/span><\/li><li data-term='embedding'>embedding — 把 token id 映射成向量的矩阵 <span class=glossary-ref>（第 15 章：读 config.json：把架构字段变成可计算的账）<\/span><\/li><li data-term='logits'>logits — 模型输出头得到的未归一化分数 <span class=glossary-ref>（第 15 章：读 config.json：把架构字段变成可计算的账）<\/span><\/li><li data-term='softmax'>softmax — 把 logits 变成概率分布的归一化 <span class=glossary-ref>（第 15 章：读 config.json：把架构字段变成可计算的账）<\/span><\/li><li data-term='context length'>context length — 模型能处理的最大 token 数 <span class=glossary-ref>（第 13 章：注意力与长上下文：MHA、GQA、MLA、滑窗与线性注意力）<\/span><\/li><li data-term='prefill'>prefill — 推理时一次性处理输入前缀的阶段 <span class=glossary-ref>（第 13 章：注意力与长上下文：MHA、GQA、MLA、滑窗与线性注意力）<\/span><\/li><li data-term='decode'>decode — 推理时逐 token 生成的阶段 <span class=glossary-ref>（第 13 章：注意力与长上下文：MHA、GQA、MLA、滑窗与线性注意力）<\/span><\/li><li data-term='quantization'>quantization — 把权重/激活降到低精度以省显存 <span class=glossary-ref>（第 14 章：许可证、数据与评测：开放模型的“隐形架构”）<\/span><\/li><li data-term='fp8'>FP8 — 8 位浮点量化格式 <span class=glossary-ref>（第 14 章：许可证、数据与评测：开放模型的“隐形架构”）<\/span><\/li><li data-term='int4'>INT4 — 4 位整数量化格式 <span class=glossary-ref>（第 14 章：许可证、数据与评测：开放模型的“隐形架构”）<\/span><\/li><li data-term='license'>license — 决定能否商用/修改/再分发的法律条款 <span class=glossary-ref>（第 14 章：许可证、数据与评测：开放模型的“隐形架构”）<\/span><\/li><li data-term='apache 2.0'>Apache 2.0 — 允许商用、修改、再分发的宽松许可证 <span class=glossary-ref>（第 14 章：许可证、数据与评测：开放模型的“隐形架构”）<\/span><\/li><li data-term='mit'>MIT — 比 Apache 更短更宽松的许可证 <span class=glossary-ref>（第 14 章：许可证、数据与评测：开放模型的“隐形架构”）<\/span><\/li><li data-term='llama community'>Llama Community — Llama 系列的自定义社区许可证 <span class=glossary-ref>（第 14 章：许可证、数据与评测：开放模型的“隐形架构”）<\/span><\/li><li data-term='gemma terms'>Gemma Terms — Gemma 系列的自定义使用条款 <span class=glossary-ref>（第 14 章：许可证、数据与评测：开放模型的“隐形架构”）<\/span><\/li><li data-term='cc-by-nc'>CC-BY-NC — 禁止商用的 Creative Commons 许可证 <span class=glossary-ref>（第 14 章：许可证、数据与评测：开放模型的“隐形架构”）<\/span><\/li><li data-term='open weights'>open weights — 权重可下载，但不等于代码/数据/商用权利全开放 <span class=glossary-ref>（第 1 章：先定边界：开源、开放权重与“能下载”）<\/span><\/li><li data-term='benchmark contamination'>benchmark contamination — 评测题出现在训练数据里导致分数虚高 <span class=glossary-ref>（第 14 章：许可证、数据与评测：开放模型的“隐形架构”）<\/span><\/li><li data-term='model card'>model card — 模型卡：许可证、数据、评测、限制的说明页 <span class=glossary-ref>（第 14 章：许可证、数据与评测：开放模型的“隐形架构”）<\/span><\/li><\/ul>", "__diagnosis__": "<h1>🩺 诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "__patterns__": "<h1>模式库：六个可复用的判断模式<\/h1>\n<h2>模式 1：许可证先行<\/h2>\n<p><strong>症状<\/strong>：看到模型强、参数大，立刻下载部署。 <strong>做法<\/strong>：先查许可证标签 → 读全文 → 判断商用/再分发/衍生模型条款；不通过直接换模型。 <strong>反例<\/strong>：Command R+ 很强，但 CC-BY-NC 不能商用；Gemma 不是 Apache。<\/p>\n<h2>模式 2：总参数与激活参数分开<\/h2>\n<p><strong>症状<\/strong>：把 <code>2.4T-A95B<\/code> 读成“2.4T 激活”，估错算力；或把 MoE 显存按激活算。 <strong>做法<\/strong>：总参数 → 显存；激活参数 → 每 token 算力；MoE 权重按总参数，KV 按注意力头。 <strong>检查<\/strong>：<code>总/激活<\/code> 比例越低，容量/算力解耦越激进，但 EP 通信越重。<\/p>\n<h2>模式 3：先算 KV，再谈长上下文<\/h2>\n<p><strong>症状<\/strong>：模型卡写 128K/1M，直接上线，结果 OOM。 <strong>做法<\/strong>：<code>KV/token = 2 × L × H_kv × d_head × b<\/code>；×序列长度 ×batch；再和显存预算比。 <strong>检查<\/strong>：1M 上下文若朴素 KV 超过数百 GiB，必然用 GQA/MLA/稀疏/量化/分页。<\/p>\n<h2>模式 4：读 config 而不是读名字<\/h2>\n<p><strong>症状<\/strong>：名字写 7B，实际层数/宽度/头数与同尺寸不同；名字写 A22B，实际总参 235B。 <strong>做法<\/strong>：下载 <code>config.json<\/code> → 看 <code>text_config<\/code> → 记录层数、hidden、Q/KV、head_dim、专家、top-k、上下文、rope_scaling。 <strong>检查<\/strong>：<code>max_position_embeddings<\/code> 可能靠 YaRN 外推，不等于训练长度。<\/p>\n<h2>模式 5：按架构族识别，而不是按公司<\/h2>\n<p><strong>症状<\/strong>：以为“Qwen 都是 dense”“Llama 都是 GQA”“Kimi 是 Llama 套壳”。 <strong>做法<\/strong>：看 <code>model_type<\/code> + <code>architectures<\/code> + 注意力/FFN 字段；公司只是产地。 <strong>检查<\/strong>：同一公司可能同时有 dense、MoE、线性、混合、多模态。<\/p>\n<h2>模式 6：评测防污染<\/h2>\n<p><strong>症状<\/strong>：排行榜分数很高，实际任务很差。 <strong>做法<\/strong>：查 decontamination → 改写题目/换数字重测 → 保留内部 holdout → 人工抽检 LLM 裁判。 <strong>检查<\/strong>：分数在新题上大跌，说明可能靠记忆。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式<\/h2>\n<ul><li>\nKV/token = <code>2 × 层数 × KV头数 × head_dim × 字节数<\/code>\n<\/li><li>\nKV 总量 = <code>KV/token × 序列长度 × batch<\/code>\n<\/li><li>\n权重显存 ≈ <code>参数量 × 字节数<\/code>（FP16=2，FP8/INT8=1，INT4=0.5）\n<\/li><li>\nMoE 总参数 ≈ <code>embedding + 层数 × (注意力 + 专家数 × 3 × hidden × 专家宽度)<\/code>\n<\/li><li>\nMoE 激活 ≈ <code>embedding + 层数 × (注意力 + top-k × 3 × hidden × 专家宽度)<\/code>\n<\/li><li>\n激活比例 = <code>激活 / 总参数<\/code>\n<\/ul>\n<h2>模型速记<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>模型<\/th><th>关键数字<\/th><\/tr><\/thead><tbody><tr><td>Llama 3.3 70B<\/td><td>80 层、8192、64/8、128K、0.3125 MiB/token<\/td><\/tr><tr><td>Llama 4 Scout<\/td><td>109B/17B、16 专家、10M<\/td><\/tr><tr><td>Llama 4 Maverick<\/td><td>400B/17B、128 专家、1M<\/td><\/tr><tr><td>Qwen3.8-2.4T<\/td><td>92 层、8192、64/4、512 专家 top-10、262K<\/td><\/tr><tr><td>Qwen3.8-27B<\/td><td>64 层、5120、24/4、head_dim 256、262K<\/td><\/tr><tr><td>Qwen3.5-397B<\/td><td>60 层、4096、32/2、512 专家 top-10、262K<\/td><\/tr><tr><td>Gemma 3 27B<\/td><td>62 层、5376、32/16、128K、5:1<\/td><\/tr><tr><td>Phi-4<\/td><td>40 层、5120、40/10、16K<\/td><\/tr><tr><td>Mistral Small 4<\/td><td>36 层、4096、32/32、128 专家 top-4、1M<\/td><\/tr><tr><td>Mistral Large 4<\/td><td>72 层、6144、64/64、128+1 专家 top-4、1M<\/td><\/tr><tr><td>GLM-5.3<\/td><td>78 层、6144、64/64、256 专家 top-8、1M<\/td><\/tr><tr><td>Kimi K3<\/td><td>93 层、7168、96/96、896 专家、1M<\/td><\/tr><tr><td>MiniMax M3<\/td><td>60 层、6144、64/4、top-4+1、1M<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>选型顺序<\/h2>\n<ol><li>\n许可证能不能商用？\n<\/li><li>\n显存能不能装下（按总参数）？\n<\/li><li>\n上下文 KV 能不能装下？\n<\/li><li>\n任务/模态/延迟是否匹配？\n<\/li><li>\n评测是否可信（去污染、内部 holdout）？\n<\/ol>"}};
const pages = DATA.rendered;
const manifest = DATA.manifest;
const SYN_GROUPS = [["定义", "含义", "释义", "概念"], ["例题", "算例", "示例", "例子", "案例"], ["习题", "题目", "练习", "测验", "自测"], ["推导", "证明", "论证", "演算"], ["步骤", "流程", "过程", "环节"], ["性质", "特性", "特点", "属性"], ["公式", "表达式", "式子"], ["定理", "定律", "法则", "准则"], ["图像", "图形", "图示", "曲线"], ["计算", "求解", "算出", "求值"], ["平均值", "均值", "平均数"], ["误差", "偏差", "偏离"], ["函数", "映射", "对应关系"], ["导数", "变化率", "切线斜率", "微商"], ["原函数", "不定积分", "反导数"], ["概率", "几率", "可能性"]];
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
const ZS_VERSION = '1.6.1';
/* ---------- 进度导出 / 导入（跨设备） ---------- */
function exportProgress(){
  const data = {};
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.indexOf(SLUG+':')===0) data[k]=localStorage.getItem(k);
  }
  const payload = {app:'zhishu', skillVersion:ZS_VERSION, kind:'companion', exportedAt:new Date().toISOString(), prefix:SLUG+':', data};
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (SLUG||'book')+'-progress-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
function importProgress(file){
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const p = JSON.parse(fr.result);
      if(!p || p.app!=='zhishu' || !p.data || typeof p.data!=='object') throw new Error('不是知枢进度文件');
      let n = 0;
      Object.keys(p.data).forEach(k=>{ if(k.indexOf(SLUG+':')===0){ localStorage.setItem(k, p.data[k]); n++; } });
      if(!n){ alert('这个文件里没有属于本书的进度（slug 不一致）'); return; }
      alert('已导入 '+n+' 条进度，页面将刷新'); location.reload();
    }catch(e){ alert('导入失败：'+e.message); }
  };
  fr.readAsText(file);
}
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{}, mastery: store.get('mastery')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  if(h==='diagnosis') return 'diagnosis';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h;
}
function showPage(rid){
  let id;
  if(rid==='path') id='__path__';
  else if(rid==='diagnosis') id='__diagnosis__';
  else if(rid==='graph') id='__graph__';
  else if(rid.startsWith('quiz/')) id='__quiz_'+rid.split('/')[1]+'__';
  else if(rid==='cards') id='__cards__';
  else if(rid==='glossary') id='__glossary__';
  else if(rid==='patterns') id='__patterns__';
  else if(rid==='cheatsheet') id='__cheatsheet__';
  else if(rid.startsWith('chapter/')) id=rid.split('/')[1];
  else if(rid.startsWith('concept/')) id=rid.split('/')[1];
  else id=rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  $$('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(rid==='diagnosis') initDiagnosis();
  if(rid==='graph') initGraph();
  if(id==='__path__') updatePath();
  renderMath();
  renderMermaid();
  applyPendingHighlight();
}

/* ---------- KaTeX 渲染（多源回退） ---------- */
let katexLoading = false, katexReady = false;
function renderMath(){
  const hasMath = document.querySelector('.katex-inline, .katex-block');
  if(!hasMath) return;
  if(katexReady){ doRenderMath(); return; }
  if(katexLoading) return;
  katexLoading = true;
  const cssUrls = [
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css',
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.css',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.css'
  ];
  const jsUrls = [
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js',
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.js',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.js'
  ];
  let ci = 0, ji = 0;
  const tryCss = () => {
    if(ci >= cssUrls.length) return;
    const link = document.createElement('link');
    link.rel = 'stylesheet'; link.href = cssUrls[ci++];
    link.onload = tryJs; link.onerror = () => { link.remove(); tryCss(); };
    document.head.appendChild(link);
  };
  const tryJs = () => {
    if(ji >= jsUrls.length){ katexLoading = false; return; }
    const s = document.createElement('script');
    s.src = jsUrls[ji++];
    s.onload = () => { katexReady = true; katexLoading = false; doRenderMath(); };
    s.onerror = () => { s.remove(); tryJs(); };
    document.head.appendChild(s);
  };
  tryCss();
}
function doRenderMath(){
  if(typeof katex === 'undefined') return;
  // 行内公式：.katex-inline 里的内容
  $$('.katex-inline').forEach(el=>{
    try{ katex.render(el.textContent, el, {throwOnError:false}); }catch(e){}
  });
  // 块级公式：.katex-block 里的内容
  $$('.katex-block').forEach(el=>{
    try{ katex.render(el.textContent, el, {displayMode:true, throwOnError:false}); }catch(e){}
  });
}
// 公式内容预处理：把 < 后跟字母的位置转成 &lt;，避免被 HTML 解析器当标签吃掉
// （这是 first-principles-derivation 踩过的坑：$m<n$ 会变成残留 $m）
function sanitizeMathHTML(){
  $$('.katex-inline, .katex-block').forEach(el=>{
    el.innerHTML = el.innerHTML.replace(/<([a-zA-Z])/g, '&lt;$1');
  });
}

/* ---------- 进度 ---------- */
function updateProgress(){
  const chs = (manifest.chapters||[]).length;
  const done = (manifest.chapters||[]).filter(c=>state.visited.includes('chapter/'+c.id)).length;
  const pct = chs? Math.round(done/chs*100) : 0;
  $('#progress-fill').style.width = pct+'%';
  $('#progress-label').textContent = `进度 ${pct}% · 已学 ${done}/${chs} 章`;
}
function updatePath(){
  $$('.path-step').forEach(el=>{
    const step = el.id.replace('path-','');
    const s = (manifest.learningPath||[]).find(x=>x.step===step);
    if(s && (s.chapterIds||[]).every(c=>state.visited.includes('chapter/'+c))){
      el.classList.add('passed');
      const lbl = el.querySelector('.checkpoint-ok'); if(!lbl){ const sp=document.createElement('span'); sp.className='done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 概念/章节依赖查找（用于诊断倒推） ---------- */
function findConcept(id){ return (manifest.concepts||[]).find(c=>c.id===id); }
function findChapter(id){ return (manifest.chapters||[]).find(c=>c.id===id); }
function getPrereqs(node){
  if(!node) return [];
  return node.prerequisites || node.prereqs || [];
}
/**
 * 答错倒推：从错题关联的概念/章节出发，沿 prerequisites 回溯，
 * 返回一串"你可能需要先补的"节点，带跳转链接。
 */
function traceBack(startConceptId, startChapterId){
  const visited = new Set();
  const chain = [];
  const queue = [];
  if(startConceptId){ const c = findConcept(startConceptId); if(c) queue.push({node:c, kind:'concept'}); }
  if(startChapterId){ const c = findChapter(startChapterId); if(c) queue.push({node:c, kind:'chapter'}); }
  while(queue.length && chain.length < 6){
    const {node, kind} = queue.shift();
    if(visited.has(node.id)) continue;
    visited.add(node.id);
    chain.push({node, kind});
    (getPrereqs(node)||[]).forEach(pid=>{
      const cn = findConcept(pid); if(cn){ queue.push({node:cn, kind:'concept'}); return; }
      const ch = findChapter(pid); if(ch) queue.push({node:ch, kind:'chapter'});
    });
  }
  return chain;
}

/* ---------- 测验（带倒推） ---------- */
function initQuizzes(rid){
  $$('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        i.parentElement.style.color = (Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) ? 'var(--ok)' : 'var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 答错时：倒推前置 + 误解卡片 + 掌握度更新
      if(!correct){
        let remedy = item.querySelector('.quiz-remedy');
        if(!remedy){ remedy = document.createElement('div'); remedy.className='quiz-remedy'; item.appendChild(remedy); }
        const chain = traceBack(item.dataset.concept, item.dataset.chapter);
        if(chain.length > 1){
          const links = chain.slice(1).map(({node,kind})=>{
            const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
            return `<a href="${href}">${esc(node.title||node.id)}</a>`;
          }).join(' → ');
          remedy.innerHTML = '🔍 可能的根因（沿依赖链回溯）：' + links;
        }
        // 误解卡片：如果选错的选项标注了 misconceptionId
        const checked = item.querySelector('input:checked');
        const misId = checked ? checked.dataset.misconception : '';
        if(misId){
          const mis = (manifest.misconceptions||[]).find(m=>m.id===misId);
          if(mis){
            let misCard = item.querySelector('.misconception-card');
            if(!misCard){ misCard = document.createElement('div'); misCard.className='misconception-card'; item.appendChild(misCard); }
            misCard.innerHTML = `<b>⚠ 常见误解</b><br>你选了「${esc(mis.wrong)}」——${esc(mis.correction)}`;
          }
        }
        // 掌握度下降
        updateMastery(item.dataset.concept, -0.15);
      } else {
        updateMastery(item.dataset.concept, +0.15);
      }
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 知识图谱（vis-network） ---------- */
let networkLoaded = false;
function loadVisNetwork(cb){
  if(networkLoaded){ cb(); return; }
  const urls = [
    'https://cdn.jsdelivr.net/npm/vis-network@9.1.9/dist/vis-network.min.js',
    'https://unpkg.com/vis-network@9.1.9/dist/vis-network.min.js',
    'https://registry.npmmirror.com/vis-network/9.1.9/dist/vis-network.min.js'
  ];
  let i = 0;
  const tryNext = () => {
    if(i >= urls.length) return;
    const s = document.createElement('script');
    s.src = urls[i++];
    const timer = setTimeout(() => { s.onload = null; s.onerror = null; s.remove(); tryNext(); }, 4000);
    s.onload = () => { clearTimeout(timer); networkLoaded = true; cb(); };
    s.onerror = () => { clearTimeout(timer); s.remove(); tryNext(); };
    document.head.appendChild(s);
  };
  tryNext();
}
function initGraph(){
  const container = document.getElementById('graph-container');
  if(!container) return;
  loadVisNetwork(() => {
    if(typeof vis === 'undefined'){ container.innerHTML = '<p class="empty">图谱库加载失败，请联网后刷新</p>'; return; }
    const concepts = manifest.concepts || [];
    const chapters = manifest.chapters || [];
    const nodes = [];
    const edges = [];
    concepts.forEach(c => {
      const mastery = Math.round(getMastery(c.id)*100);
      nodes.push({
        id: 'c_' + c.id,
        label: c.title || c.id,
        title: (c.title||c.id) + '（掌握度 ' + mastery + '%）',
        color: mastery > 70 ? '#86efac' : mastery > 40 ? '#fde68a' : '#fca5a5',
        shape: 'dot',
        size: mastery > 70 ? 20 : 14,
        font: { size: 13 }
      });
    });
    chapters.forEach(ch => {
      nodes.push({
        id: 'ch_' + ch.id,
        label: ch.title || ch.id,
        shape: 'box',
        color: '#93c5fd',
        font: { size: 12 }
      });
    });
    // 前置边
    concepts.forEach(c => {
      (c.prerequisites || []).forEach(p => {
        const pid = typeof p === 'string' ? p : p.id;
        const ptype = typeof p === 'string' ? 'hard' : (p.type || 'hard');
        const from = (pid.startsWith('ch') ? 'ch_' : 'c_') + pid;
        const to = 'c_' + c.id;
        if(nodes.find(n => n.id === from)){
          edges.push({
            from: from, to: to,
            color: { color: ptype === 'hard' ? '#dc2626' : ptype === 'soft' ? '#9ca3af' : '#3b82f6' },
            arrows: 'to',
            width: ptype === 'hard' ? 2 : 1,
            dashes: ptype !== 'hard'
          });
        }
      });
    });
    const data = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };
    const options = {
      physics: { stabilization: true, barnesHut: { gravitationalConstant: -3000 } },
      interaction: { hover: true, tooltipDelay: 200 }
    };
    const net = new vis.Network(container, data, options);
    net.on('click', params => {
      if(params.nodes.length > 0){
        const nid = params.nodes[0];
        if(nid.startsWith('c_')) location.hash = '#/concept/' + nid.slice(2);
        else if(nid.startsWith('ch_')) location.hash = '#/chapter/' + nid.slice(3);
      }
    });
  });
}

/* ---------- 诊断模式 ---------- */
let diagQueue = [], diagIdx = 0, diagWrong = [];
function initDiagnosis(){
  const startBtn = $('#diag-start');
  if(!startBtn || startBtn.dataset.inited) return;
  startBtn.dataset.inited='1';
  startBtn.addEventListener('click', ()=>{
    const all = (manifest.quizzes||[]).slice();
    // 随机抽 5 题（不够就全抽）
    for(let i = all.length-1; i>0; i--){ const j = Math.floor(Math.random()*(i+1)); [all[i],all[j]]=[all[j],all[i]]; }
    diagQueue = all.slice(0, Math.min(5, all.length));
    diagIdx = 0; diagWrong = [];
    showDiagQuestion();
  });
}
function showDiagQuestion(){
  const stage = $('#diag-stage');
  const result = $('#diag-result');
  result.innerHTML = '';
  if(diagIdx >= diagQueue.length){ finishDiagnosis(); return; }
  const q = diagQueue[diagIdx];
  $('#diag-progress').textContent = `第 ${diagIdx+1} / ${diagQueue.length} 题`;
  const fakeItem = document.createElement('div');
  fakeItem.innerHTML = _renderQuizHTML(q, diagIdx+1);
  stage.innerHTML = fakeItem.innerHTML;
  // 绑定检查按钮
  const item = stage.querySelector('.quiz-item');
  const btn = item.querySelector('.quiz-check');
  btn.addEventListener('click', ()=>{
    const type = item.dataset.type;
    let user, correct=false;
    if(type==='single'){
      const sel = item.querySelector('input:checked');
      user = sel? parseInt(sel.value) : null;
      correct = user===q.answer;
    } else if(type==='multi'){
      user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
      const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
      correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
    } else if(type==='blank'){
      const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
      correct = v===String(q.answer).trim().toLowerCase();
    }
    if(!correct){
      diagWrong.push(q);
      const chain = traceBack(q.relatedConceptId, q.chapterId);
      if(chain.length > 1){
        const links = chain.slice(1).map(({node,kind})=>{
          const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
          return `<div class="diag-remedy-item">建议先学：<a href="${href}">${esc(node.title||node.id)}</a></div>`;
        }).join('');
        $('#diag-result').innerHTML = '<h3>这道题答错了，可能的根因：</h3>' + links +
          '<p><button id="diag-next" class="quiz-check">下一题 →</button></p>';
      } else {
        $('#diag-result').innerHTML = '<p><button id="diag-next" class="quiz-check">下一题 →</button></p>';
      }
    } else {
      $('#diag-result').innerHTML = '<p>✓ 正确。<button id="diag-next" class="quiz-check">下一题 →</button></p>';
    }
    $('#diag-next').addEventListener('click', ()=>{ diagIdx++; showDiagQuestion(); });
  });
}
function _renderQuizHTML(q, idx){
  // 复用服务端渲染的 quiz HTML 结构
  const qtype = q.type||'single';
  const qid = q.id||('diag'+idx);
  let html = `<div class='quiz-item' data-qid='${qid}' data-type='${qtype}' data-concept='${esc(q.relatedConceptId||"")}' data-chapter='${esc(q.chapterId||"")}'>`;
  html += `<p class='quiz-q'><b>Q${idx}.</b> ${esc(q.question||"")}</p>`;
  if(qtype==='single'||qtype==='multi'){
    const it = qtype==='single'?'radio':'checkbox';
    html += "<div class='quiz-opts'>";
    (q.options||[]).forEach((o,i)=>{ html += `<label class='quiz-opt'><input type='${it}' name='${qid}' value='${i}'> ${esc(String(o))}</label>`; });
    html += '</div>';
  } else {
    html += `<input class='quiz-blank' type='text' placeholder='填写答案'>`;
  }
  html += `<div class='quiz-actions'><button class='quiz-check'>检查答案</button><span class='quiz-feedback'></span></div></div>`;
  return html;
}
function finishDiagnosis(){
  const total = diagQueue.length;
  const wrong = diagWrong.length;
  const right = total - wrong;
  let html = `<h2>诊断完成：${right}/${total} 正确</h2>`;
  if(wrong === 0){
    html += '<p>🎉 这组题全对，可以继续往下学。</p>';
  } else {
    html += `<p>有 ${wrong} 道题答错。下面是按依赖链回溯的补强建议：</p>`;
    const seen = new Set();
    diagWrong.forEach(q=>{
      const chain = traceBack(q.relatedConceptId, q.chapterId);
      chain.slice(1).forEach(({node,kind})=>{
        if(seen.has(node.id)) return;
        seen.add(node.id);
        const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
        html += `<div class="diag-remedy-item">📚 <a href="${href}">${esc(node.title||node.id)}</a></div>`;
      });
    });
  }
  html += '<p><button id="diag-restart" class="quiz-check">重新诊断</button></p>';
  $('#diag-stage').innerHTML = '';
  $('#diag-progress').textContent = '';
  $('#diag-result').innerHTML = html;
  $('#diag-restart').addEventListener('click', ()=>{
    $('#diag-start').click();
  });
}

function getMastery(cid){
  if(!cid) return 0.5;
  const m = (state.mastery||{})[cid];
  return m !== undefined ? m : 0.3;
}
function updateMastery(cid, delta){
  if(!cid) return;
  if(!state.mastery) state.mastery = {};
  const cur = state.mastery[cid] !== undefined ? state.mastery[cid] : 0.3;
  state.mastery[cid] = Math.max(0, Math.min(1, cur + delta));
  store.set('mastery', state.mastery);
}
function masteryBar(cid){

  return `<div class="mastery-bar"><div style="width:${v}%"></div></div><span class="mastery-label">掌握度 ${v}%</span>`;
}

/* ---------- 搜索 v2：分词 + 多词 + 命中定位 ---------- */
let searchIndex = null;
let pendingHl = [];
function hlEscRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function tokenizeQuery(q){
  q = String(q||'').trim().toLowerCase();
  if(!q) return [];
  const STOP = new Set(['的','了','是','在','和','与','我','你','他','它','这','那','有','就','都','而','及','或',
                        '吗','呢','吧','把','被','对','从','到','为','上','下','里','中','个','一',
                        '什么','怎么','为什么','如何','哪些','这个','那个']);
  const raw = q.split(/[^\p{L}\p{N}]+/u).filter(Boolean);
  const out = [];
  for(const w of raw){
    if(STOP.has(w)) continue;
    if(/^\p{Script=Han}+$/u.test(w) && w.length > 2){
      out.push(w);
      for(let i=0;i+2<=w.length;i++) out.push(w.slice(i,i+2));
    } else out.push(w);
  }
  return [...new Set(out)].slice(0,12);
}
function hlSnippet(text, terms){
  const low = text.toLowerCase();
  let pos = -1, hit = '';
  for(const t of terms){ const i = low.indexOf(t); if(i>=0 && (pos<0 || i<pos)){ pos=i; hit=t; } }
  const start = Math.max(0, (pos<0?0:pos) - 60);
  const end = Math.min(text.length, (pos<0?0:pos) + 140);
  let s = esc(text.slice(start,end));
  let budget = 6;                                 // 每段最多标 6 处，避免常见词把片段糊满
  terms.forEach(t=>{
    if(t.length < 1 || budget <= 0) return;
    s = s.replace(new RegExp(hlEscRe(t),'gi'), m=>{
      if(budget <= 0) return m;
      budget--;
      return '<mark class="hl">' + m + '</mark>';
    });
  });
  return '…' + s + '…';
}
function applyPendingHighlight(){
  const terms = pendingHl.slice(); pendingHl = [];
  if(!terms.length) return;
  const root = $('#view'); if(!root) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  let node, first = null, idx = -1, term = '';
  while((node = walker.nextNode())){
    if(!node.nodeValue || !node.nodeValue.trim()) continue;
    const low = node.nodeValue.toLowerCase();
    for(const t of terms){
      const i = low.indexOf(t);
      if(i>=0 && (first===null || i<idx || (i===idx && t.length>term.length))){
        first = node; idx = i; term = t;
      }
    }
  }
  if(!first) return;
  try{
    const i = first.nodeValue.toLowerCase().indexOf(term);
    if(i<0) return;
    const range = document.createRange();
    range.setStart(first, i); range.setEnd(first, i+term.length);
    const mark = document.createElement('mark');
    mark.className = 'hit-hl';
    range.surroundContents(mark);
    mark.scrollIntoView({block:'center'});
    mark.classList.add('hit-flash');
    setTimeout(()=>mark.classList.remove('hit-flash'), 1800);
  }catch(e){}
}
document.addEventListener('click', (e)=>{
  const a = (e.target && e.target.closest) ? e.target.closest('.search-hit a') : null;
  if(a && a.dataset.hl) pendingHl = tokenizeQuery(a.dataset.hl);

function searchHref(id){

               '__cards__':'#/cards','__glossary__':'#/glossary','__patterns__':'#/patterns',

function searchLabel(id){

function pageTitle(id){

function chapOf(id){
  const chs = manifest.chapters || [];
  const ci = chs.findIndex(c=>c.id===id);
  if(ci >= 0) return {key:'ch:'+id, label:chs[ci].title||id, order:ci};

function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  searchIndex = [];
  Object.entries(pages).forEach(([id, htmlText])=>{
    const href = searchHref(id);
    if(!href) return;
    const text = htmlText.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
    searchIndex.push({id, href, text, label:pageTitle(id), chap:chapOf(id)});
  });
  return searchIndex;
}
function synOf(t){
  const out = [];
  for(const g of SYN_GROUPS){ if(g.indexOf(t) >= 0){ for(const x of g){ if(x !== t) out.push(x); } } }
  return out.slice(0,6);
}
$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim();
  if(!v){ showPage(routeIdFromHash()); return; }
  const terms = tokenizeQuery(v);
  if(!terms.length){ showPage(routeIdFromHash()); return; }
  const grams = [];
  terms.forEach(t=>{ if(t.length >= 2){ for(let i=0;i+2<=t.length;i++) grams.push(t.slice(i,i+2)); } });
  const qGrams = [...new Set(grams)].slice(0,16);
  const snippetTerms = terms.concat(...terms.map(synOf)).slice(0,24);
  const hits = [];
  buildSearchIndex().forEach(p=>{
    const low = p.text.toLowerCase();
    let tHit = 0, sHit = 0, gHit = 0, first = '', viaSyn = '';
    for(const t of terms){
      if(low.includes(t)){ tHit++; if(!first) first = t; continue; }
      for(const s of synOf(t)){
        if(low.includes(s)){ sHit++; if(!viaSyn) viaSyn = s; if(!first) first = s; break; }
      }
    }
    for(const gm of qGrams){ if(low.includes(gm)) gHit++; }
    if(tHit > 0 || sHit > 0 || gHit >= 4){
      hits.push({p, score: tHit*100 + sHit*30 + Math.min(gHit,20), first, viaSyn});
    }
  });
  hits.sort((a,b)=> b.score-a.score || a.p.text.length-b.p.text.length);
  const top = hits.slice(0,20);
  let body;
  if(top.length){
    const gs = {};
    top.forEach(h=>{
      const k = h.p.chap.key;
      (gs[k] = gs[k] || {label:h.p.chap.label, order:h.p.chap.order, ref:!!h.p.chap.ref, hits:[]}).hits.push(h);
    });
    const eff = g => Math.max(...g.hits.map(x=>x.score)) * (g.ref ? 0.55 : 1);
    const order = Object.values(gs).sort((a,b)=> eff(b)-eff(a));
    body = order.map(g=>{
      const inner = g.hits.sort((a,b)=> b.score-a.score).map(h=>
        `<div class="search-hit"><a href="${h.p.href}" data-hl="${esc(h.first)}">${esc(h.p.label)}</a>${h.viaSyn?`<span class="syn-note">同义命中：${esc(h.viaSyn)}</span>`:''}<br><span class="sub">${hlSnippet(h.p.text, snippetTerms)}</span></div>`).join('');
      return `<div class="search-group"><div class="grp-head">${esc(g.label)}<span class="grp-count">${g.hits.length}</span></div>${inner}</div>`;
    }).join('');
  } else {
    body = '<div class="empty">未找到相关内容，试试章节名 / 概念名 / 术语，或减少关键词。</div>';
  }
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' + body;
});

/* ---------- Mermaid 懒加载 ---------- */
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  const boot=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      const code=el.textContent;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  const urls=['https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js',
              'https://registry.npmmirror.com/mermaid/10.9.1/files/dist/mermaid.min.js',
              'https://unpkg.com/mermaid@10.9.1/dist/mermaid.min.js'];
  let ui=0, done=false;
  const tryNext=()=>{
    if(done || ui>=urls.length) return;
    const s=document.createElement('script');
    s.src=urls[ui++];
    const timer=setTimeout(()=>{ if(done) return; s.onload=null; s.onerror=null; s.remove(); tryNext(); }, 4000);
    s.onload=()=>{ done=true; clearTimeout(timer); boot(); };
    s.onerror=()=>{ clearTimeout(timer); s.remove(); tryNext(); };
    document.head.appendChild(s);
  };
  tryNext();
}

<script id="zs-visual-init">
(function(){
  try{
    var B=document.body, H=document.documentElement;
    if(!B.dataset.theme && !H.dataset.theme) B.dataset.theme='dark';
    var EMOJI=/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}]/gu;
    var scope=document.querySelectorAll('header, .topbar, .topbar-fixed, #topbar, .sidebar, .tabs, .hdr-right, .card-actions, .card-controls, .section-title, .card .icon, .icon-label');
    for(var i=0;i<scope.length;i++){
      var w=document.createTreeWalker(scope[i],NodeFilter.SHOW_TEXT,null,false), n;
      while(n=w.nextNode()){
        if(EMOJI.test(n.nodeValue)){
          n.nodeValue=n.nodeValue.replace(EMOJI,'').replace(/[ \t]+/g,' ').replace(/^ | $/g,'');
        }
      }
    }
    var btn=document.getElementById('theme-btn')||document.getElementById('theme')||document.getElementById('themeToggle');
    function label(){
      if(!btn) return;
      var light=B.dataset.theme==='light'||H.getAttribute('data-theme')==='light'||B.dataset.theme==='';
      if(btn.textContent.trim()===''||/浅色|深色/.test(btn.textContent)) btn.textContent=light?'深色':'浅色';
    }
    label();
    if(btn){
      new MutationObserver(label).observe(B,{attributes:true,attributeFilter:['data-theme']});
      new MutationObserver(label).observe(H,{attributes:true,attributeFilter:['data-theme']});
      btn.addEventListener('click',function(){setTimeout(label,0);},true);
    }
  }catch(e){}
})();
</script>
