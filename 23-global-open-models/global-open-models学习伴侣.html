<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --text:#1f2328; --muted:#6b7280;
  --accent:#2563eb; --accent-soft:#dbeafe; --border:#e5e7eb;
  --ok:#16a34a; --bad:#dc2626; --code-bg:#f3f4f6;
  --depth-bg:#fef9c3; --depth-border:#ca8a04;
}
[data-theme="dark"]{
  --bg:#111318; --panel:#1a1d24; --text:#e5e7eb; --muted:#9ca3af;
  --accent:#60a5fa; --accent-soft:#1e3a5f; --border:#2d333d;
  --ok:#4ade80; --bad:#f87171; --code-bg:#20242c;
  --depth-bg:#2a2410; --depth-border:#a16207;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.layout{display:flex;min-height:100vh}
.sidebar{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  padding:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar h1{font-size:17px;margin:2px 0 2px}
.sidebar .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
#q{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
.nav-sec{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.nav-item{display:block;padding:5px 10px;border-radius:6px;color:var(--text);font-size:14px}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .done{float:right;color:var(--ok);font-size:12px}
#nav-toggle{display:none}
.main{flex:1;min-width:0;padding:28px 40px 80px;max-width:920px;margin:0 auto}
.page h1{font-size:26px;border-bottom:2px solid var(--border);padding-bottom:8px;margin-top:0}
.page h2{font-size:20px;margin-top:26px}
.page h3{font-size:17px;margin-top:22px}
.table-wrap{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.page th{background:var(--code-bg)}
.page code{background:var(--code-bg);padding:2px 5px;border-radius:4px;font-size:.9em}
.page pre{background:var(--code-bg);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
.page pre code{background:none;padding:0}
.page blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}
.page blockquote blockquote{border-color:var(--muted)}
.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}
.mermaid-hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
svg{max-width:100%;height:auto}
/* 出处脚注 */
.source-badge{font-size:12px;color:var(--muted);background:var(--code-bg);padding:4px 10px;border-radius:6px;margin:0 0 12px;display:inline-block}
/* 前置知识条 */
.prereq-bar{font-size:13px;color:var(--muted);border-left:3px solid var(--accent);padding:4px 10px;margin:0 0 12px;background:var(--accent-soft)}
.prereq-hard a{color:var(--bad);font-weight:600}
.prereq-soft a{color:var(--muted)}
.prereq-rec a{color:var(--accent)}
.prereq-tag{display:inline-block;font-size:10px;padding:0 4px;border-radius:3px;margin-right:2px;vertical-align:middle}
.prereq-hard .prereq-tag{background:var(--bad);color:#fff}
.prereq-soft .prereq-tag{background:var(--muted);color:#fff}
.prereq-rec .prereq-tag{background:var(--accent);color:#fff}
/* 误解卡片 */
.misconception-card{margin-top:10px;padding:10px 14px;border-left:4px solid var(--bad);background:#fef2f2;border-radius:0 8px 8px 0;font-size:13px}
.misconception-card b{color:var(--bad)}
[data-theme="dark"] .misconception-card{background:#2a1215}
/* 掌握度条 */
.mastery-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:4px 0}
.mastery-bar>div{height:100%;background:var(--ok);transition:width .3s}
.mastery-label{font-size:11px;color:var(--muted)}
/* 深度推导片段 */
.depth-fragment{margin:18px 0;border:1px solid var(--depth-border);border-radius:10px;background:var(--depth-bg);overflow:hidden}
.depth-fragment>summary{padding:10px 14px;cursor:pointer;font-weight:600;font-size:14px;list-style:none}
.depth-fragment>summary:hover{filter:brightness(.95)}
.depth-body{padding:14px 18px;border-top:1px dashed var(--depth-border);background:var(--panel)}
.depth-missing{color:var(--bad);font-size:13px;padding:8px;background:var(--code-bg);border-radius:6px}
/* KaTeX */
.katex-inline{font-size:1.05em}
.katex-block{overflow-x:auto;padding:8px 0;text-align:center}
.katex-block .katex{font-size:1.1em}
/* 测验 */
.quiz-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--panel)}
.quiz-q{margin:0 0 8px;font-weight:500}
.quiz-opts label{display:block;padding:4px 0;cursor:pointer}
.quiz-blank{width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.quiz-remedy{margin-top:8px;padding:8px 12px;background:var(--accent-soft);border-radius:6px;font-size:13px}
/* 抽认卡 */
.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}
#glossary-filter{width:100%;max-width:380px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:6px 0}
.search-group{margin:18px 0}
.grp-head{font-size:13px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--border);padding-bottom:5px;margin-bottom:4px}
.grp-count{margin-left:6px;font-weight:400;opacity:.75}
.syn-note{display:inline-block;margin-left:8px;padding:1px 6px;border-radius:4px;background:var(--accent-soft);color:var(--muted);font-size:12px;vertical-align:middle}
.search-hit mark,.hl{background:#fde68a;color:inherit;padding:0 1px;border-radius:2px}
.hit-hl{background:#fbbf24;color:inherit;border-radius:3px;box-shadow:0 0 0 2px #fde68a}
.hit-flash{animation:hitFlash 1.8s ease-out}
@keyframes hitFlash{from{background:#f59e0b}to{background:#fbbf24}}
[data-theme="dark"] .search-hit mark,[data-theme="dark"] .hl{background:#92400e;color:#fef3c7}
[data-theme="dark"] .hit-hl{background:#b45309;color:#fff;box-shadow:0 0 0 2px #78350f}
.topbar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;justify-content:flex-end;z-index:10}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
#progress-export,#progress-import{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px;white-space:nowrap;margin-right:8px}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:8px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.empty{color:var(--muted);padding:20px 0}
/* 诊断 */
.diag-controls{margin:14px 0;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
#diag-start{padding:8px 20px;border:none;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;font-size:14px}
#diag-progress{margin-left:12px;color:var(--muted);font-size:13px}
#diag-stage .quiz-item{margin:10px 0}
#diag-result{margin-top:16px;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
.diag-remedy-item{padding:10px;margin:8px 0;background:var(--accent-soft);border-radius:8px;font-size:14px}
@media print{.sidebar,.topbar,.quiz-actions,.card-actions,.card-controls,.diag-controls{display:none!important}.main{max-width:none;padding:0}}
@media (max-width:760px){.sidebar{width:100%;height:auto;position:static;padding:10px 14px}
  #nav{display:none;max-height:46vh;overflow-y:auto;overscroll-behavior:contain}.sidebar.open #nav{display:block}
  .nav-item{padding:9px 10px}
  #q,#glossary-filter{font-size:16px}
  .quiz-opts label{padding:8px 0;min-height:30px}
  .quiz-check{padding:10px 18px;min-height:40px}
  #diag-start{min-height:40px}
  .card-actions button{min-height:40px}
  #nav-toggle{display:block;width:100%;padding:8px 10px;margin:4px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;text-align:left;cursor:pointer}
  .layout{flex-direction:column}.main{padding:20px 18px 64px;max-width:none;width:100%}
  .page{overflow-wrap:anywhere}.table-wrap{overflow-x:auto;max-width:100%}.page table{display:table;width:max-content;min-width:100%;max-width:none}
  .page h1,.page h2,.page h3{line-height:1.35}}
</style>

"term": "connector", "def": "把视觉/音频特征投到语言模型维度的模块", "chapterId": "ch12"}, {"term": "resampler", "def": "用固定查询把变长视觉特征压成固定 token 的模块", "chapterId": "ch12"}, {"term": "early fusion", "def": "在较早层把多模态 token 拼在一起的融合", "chapterId": "ch12"}, {"term": "late fusion", "def": "只把视觉特征当外挂、在输入端拼接的融合", "chapterId": "ch12"}, {"term": "any-to-any", "def": "文本/图像/音频等任意模态到任意模态的模型", "chapterId": "ch12"}, {"term": "image token", "def": "图像 patch 经编码器/连接器后得到的 token", "chapterId": "ch12"}, {"term": "tokenizer", "def": "把文本切成 token 的组件", "chapterId": "ch15"}, {"term": "vocab", "def": "tokenizer 的词表大小", "chapterId": "ch15"}, {"term": "embedding", "def": "把 token id 映射成向量的矩阵", "chapterId": "ch15"}, {"term": "logits", "def": "模型输出头得到的未归一化分数", "chapterId": "ch15"}, {"term": "softmax", "def": "把 logits 变成概率分布的归一化", "chapterId": "ch15"}, {"term": "context length", "def": "模型能处理的最大 token 数", "chapterId": "ch13"}, {"term": "prefill", "def": "推理时一次性处理输入前缀的阶段", "chapterId": "ch13"}, {"term": "decode", "def": "推理时逐 token 生成的阶段", "chapterId": "ch13"}, {"term": "quantization", "def": "把权重/激活降到低精度以省显存", "chapterId": "ch14"}, {"term": "FP8", "def": "8 位浮点量化格式", "chapterId": "ch14"}, {"term": "INT4", "def": "4 位整数量化格式", "chapterId": "ch14"}, {"term": "license", "def": "决定能否商用/修改/再分发的法律条款", "chapterId": "ch14"}, {"term": "Apache 2.0", "def": "允许商用、修改、再分发的宽松许可证", "chapterId": "ch14"}, {"term": "MIT", "def": "比 Apache 更短更宽松的许可证", "chapterId": "ch14"}, {"term": "Llama Community", "def": "Llama 系列的自定义社区许可证", "chapterId": "ch14"}, {"term": "Gemma Terms", "def": "Gemma 系列的自定义使用条款", "chapterId": "ch14"}, {"term": "CC-BY-NC", "def": "禁止商用的 Creative Commons 许可证", "chapterId": "ch14"}, {"term": "open weights", "def": "权重可下载，但不等于代码/数据/商用权利全开放", "chapterId": "ch01"}, {"term": "benchmark contamination", "def": "评测题出现在训练数据里导致分数虚高", "chapterId": "ch14"}, {"term": "model card", "def": "模型卡：许可证、数据、评测、限制的说明页", "chapterId": "ch14"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}}, "pages": {"ch01": {"html": "<div class=\"source-badge\">📖 出处：https://huggingface.co/docs/hub/model-cards<\/div><h1>第 1 章 先定边界：开源、开放权重与“能下载”不是一回事<\/h1>\n<blockquote>难度：入门 · 建议 40 分钟 · 前置：无<\/blockquote>\n<blockquote>学习目标：能区分“开放权重”“开源代码”“开放数据”三层；能判断一个模型到底能不能商用、能不能改、能不能复现；能说清本册“全球开放权重模型”的收录口径。<\/blockquote>\n<h2>一句话核心<\/h2>\n<p><strong>“开源大模型”是营销词，不是法律词。<\/strong> 你真正要检查的是三件事：权重能不能下载、许可证允许你做什么、训练数据和代码公开到什么程度。架构只是第四件事。<\/p>\n<h2>1.1 三个层次，不要混着说<\/h2>\n<p>很多讨论把下面三层压成一个“开源”，于是得出错误结论。<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>层次<\/th><th>具体指什么<\/th><th>典型例子<\/th><th>你实际能得到什么<\/th><\/tr><\/thead><tbody><tr><td>开放权重<\/td><td><code>safetensors<\/code> / <code>gguf<\/code> 权重文件可下载<\/td><td>Llama、Qwen、Gemma、Mistral、Kimi、GLM<\/td><td>能推理、能微调；不一定能商用<\/td><\/tr><tr><td>开放代码<\/td><td>模型结构、推理代码、训练框架公开<\/td><td>DeepSeek 的 <code>modeling_*.py<\/code>、Llama 的参考实现<\/td><td>能读懂张量形状、能复现前向<\/td><\/tr><tr><td>开放数据<\/td><td>预训练语料、数据配比、清洗脚本公开<\/td><td>OLMo、Pythia、DCLM、BLOOM 部分数据<\/td><td>能复现训练；大多数模型做不到<\/td><\/tr><\/tbody><\/table><\/div>\n<p>一个模型可以“权重开放、代码开放、数据不开放”。这时你说它“开源”，在工程上勉强能用；在法律和科学复现上，仍然不成立。<\/p>\n<blockquote>判断顺序：<strong>许可证 → 权重 → 代码 → 数据<\/strong>。不要反过来，从“论文写了 architecture”推断“整个模型开源”。<\/blockquote>\n<h2>1.2 许可证是第一道门<\/h2>\n<p>同样是“能下载”，许可证差别很大。<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>许可证族<\/th><th>常见模型<\/th><th>商用<\/th><th>修改<\/th><th>再分发<\/th><th>注意点<\/th><\/tr><\/thead><tbody><tr><td>Apache 2.0<\/td><td>Qwen 多数、Mistral 7B、OLMo、Granite、Phi<\/td><td>可以<\/td><td>可以<\/td><td>可以<\/td><td>保留声明；专利条款<\/td><\/tr><tr><td>MIT<\/td><td>Phi-3/4、Ling、MiMo、MiniCPM 部分<\/td><td>可以<\/td><td>可以<\/td><td>可以<\/td><td>最宽松之一<\/td><\/tr><tr><td>Llama Community<\/td><td>Llama 2/3/3.1/3.3/4<\/td><td>有条件<\/td><td>可以<\/td><td>有条件<\/td><td>月活门槛、命名、衍生模型条款<\/td><\/tr><tr><td>Gemma Terms<\/td><td>Gemma 1/2/3<\/td><td>有条件<\/td><td>可以<\/td><td>有条件<\/td><td>不是 OSI 认证的开源许可证<\/td><\/tr><tr><td>Mistral 自定义<\/td><td>Mistral Large、部分 Medium<\/td><td>视版本<\/td><td>视版本<\/td><td>视版本<\/td><td>研究许可与商用许可分开<\/td><\/tr><tr><td>CC-BY-NC<\/td><td>Command R / R+<\/td><td>禁止商用<\/td><td>可以<\/td><td>可以<\/td><td>商用要另谈<\/td><\/tr><tr><td>自定义开放权重<\/td><td>Kimi、MiniMax、GLM、Step、ERNIE 部分<\/td><td>看条款<\/td><td>看条款<\/td><td>看条款<\/td><td>必须逐条读<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>结论<\/strong>：许可证不是“开源/闭源”二元，而是一组权利的组合。一个模型可以允许你研究、禁止你商用；也可以允许商用、要求你改名；还可以允许商用、但禁止你用它的输出训练另一个模型。<\/p>\n<h2>1.3 “所有模型”到底怎么数<\/h2>\n<p>截至 2026 年 11 月，Hugging Face 上仅 Qwen 一个组织就有 469 个模型仓库，deepseek-ai 有 106 个，meta-llama 70 个，mistralai 83 个。这个数字包含：<\/p>\n<ul><li>\n同一个基座的不同量化版本（FP8、GPTQ、AWQ、GGUF）；\n<\/li><li>\n同一个基座的微调版、合并版、蒸馏版；\n<\/li><li>\n视觉、音频、OCR、嵌入等非语言模型；\n<\/li><li>\n只有模型卡、没有可用权重的占位仓库。\n<\/ul>\n<p>所以“所有模型”如果按 checkpoint 数，永远数不完，也没有学习价值。本册采用<strong>家族级口径<\/strong>：<\/p>\n<blockquote>收录“官方公开发布、可下载权重、有明确架构说明”的主要模型家族；每个家族选 1–6 个代表 checkpoint 讲架构差异；量化版、微调版、合并版只在附录里作为同族变体提及，不单独成章。<\/blockquote>\n<p>这不是偷懒，而是唯一能让你建立结构感的口径。你学会读一个家族的 config，就能读懂它下面 20 个尺寸。<\/p>\n<h2>1.4 本册覆盖的八条架构路线<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>路线<\/th><th>代表家族<\/th><th>核心问题<\/th><\/tr><\/thead><tbody><tr><td>decoder-only dense<\/td><td>Llama 1–3、Mistral 7B、Gemma 2、Phi-4、Qwen 小尺寸<\/td><td>怎么用最少的组件堆出通用模型<\/td><\/tr><tr><td>decoder-only MoE<\/td><td>Mixtral、DeepSeek、Qwen MoE、Kimi、GLM、MiniMax、Llama 4<\/td><td>怎么让总参数很大、每 token 只算一小部分<\/td><\/tr><tr><td>encoder-decoder<\/td><td>T5、Flan-T5、BART、mT5、UL2<\/td><td>编码器理解、解码器生成，什么时候还值得用<\/td><\/tr><tr><td>线性注意力 / SSM / 混合<\/td><td>RWKV、Mamba、Jamba、Griffin、xLSTM、Falcon-H1、Kimi Linear、Qwen3-Next<\/td><td>怎么把 <span class=\"katex-inline\">O(n^2)<\/span> 注意力换掉，代价是什么<\/td><\/tr><tr><td>多模态融合<\/td><td>LLaVA、Qwen-VL、InternVL、Pixtral、Gemma 4、Llama 4、Janus<\/td><td>图像怎么变成 token，融合发生在哪一层<\/td><\/tr><tr><td>扩散语言模型<\/td><td>LLaDA、Dream、DiffusionGemma<\/td><td>不按从左到右生成，能不能做语言<\/td><\/tr><tr><td>小模型 / 端侧<\/td><td>Phi、Gemma E2B/E4B、MiniCPM、SmolLM、MobileLLM<\/td><td>3B 以下怎么还能用<\/td><\/tr><tr><td>嵌入 / 检索模型<\/td><td>BGE、E5、GTE、EmbeddingGemma<\/td><td>不生成文本，但同样是开放权重基础设施<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote>架构路线不是互斥的。Llama 4 同时是 MoE + 多模态 + 长上下文；Kimi K3 同时是线性注意力 + MoE + 多模态；Qwen3.8 同时是 MoE + 多模态。分类只是为了让你一次只抓一个变量。<\/blockquote>\n<h2>1.5 一个具体判断练习<\/h2>\n<p>拿这张表练手，不要查资料，先凭本章规则判断：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>模型<\/th><th>权重<\/th><th>代码<\/th><th>数据<\/th><th>许可证<\/th><th>你会怎么用<\/th><\/tr><\/thead><tbody><tr><td>Llama 3.3 70B<\/td><td>可下载<\/td><td>参考实现<\/td><td>不公开<\/td><td>Llama Community<\/td><td>研究/商用需看条款<\/td><\/tr><tr><td>OLMo 3.1 32B<\/td><td>可下载<\/td><td>完整训练代码<\/td><td>公开<\/td><td>Apache 2.0<\/td><td>可复现、可商用<\/td><\/tr><tr><td>Gemma 3 27B<\/td><td>可下载<\/td><td>推理代码<\/td><td>不公开<\/td><td>Gemma Terms<\/td><td>商用需看条款<\/td><\/tr><tr><td>Command R+<\/td><td>可下载<\/td><td>推理代码<\/td><td>不公开<\/td><td>CC-BY-NC<\/td><td>只能非商用<\/td><\/tr><\/tbody><\/table><\/div>\n<p>如果你把 OLMo 和 Llama 都叫“开源”，就会漏掉“能不能复现训练”这个关键差别。<strong>开放权重是产品，开放数据是科学。<\/strong><\/p>\n<h2>1.6 常见误解<\/h2>\n<ul><li>\n<strong>“Hugging Face 上能下载就是开源。”<\/strong> 错。下载按钮只代表权重可获取，不代表许可证允许商用或再分发。\n<\/li><li>\n<strong>“论文发了架构图，就是架构开源。”<\/strong> 错。架构图是描述，不等于可运行的训练代码；更不等于训练数据。\n<\/li><li>\n<strong>“参数越多越强。”<\/strong> 错。MoE 的总参数和激活参数是两回事；同一总参数下，路由、数据、后训练决定上限。\n<\/li><li>\n<strong>“开源模型 = 没有安全限制。”<\/strong> 错。许可证、使用政策和当地法律仍然适用。\n<\/ul>\n<h2>1.7 自测<\/h2>\n<ol><li>\n一个模型权重可下载、代码公开、训练数据不公开，最准确的说法是什么？\n<\/li><li>\n为什么“Hugging Face 有 469 个 Qwen 仓库”不能推出“Qwen 有 469 个架构”？\n<\/li><li>\nApache 2.0 和 CC-BY-NC 最关键的区别是什么？\n<\/li><li>\n本册为什么按家族而不是按 checkpoint 组织？\n<\/li><li>\n说出三个“开放权重但不算完整开源”的例子，并指出各自缺什么。\n<\/ol>\n<blockquote>参考答案：1）开放权重 + 开放代码，但不是开放数据/完整开源；2）大量仓库是量化、微调、合并和重复上传；3）Apache 允许商用，CC-BY-NC 禁止商用；4）checkpoint 数量无穷且架构重复，家族级才能建立结构感；5）Llama（数据不开放、社区许可）、Gemma（数据不开放、条款限制）、Command R+（非商用）。<\/blockquote>\n<h2>1.8 复习锚点<\/h2>\n<ul><li>\n三个层次：权重、代码、数据。\n<\/li><li>\n判断顺序：许可证 → 权重 → 代码 → 数据。\n<\/li><li>\n本册口径：官方公开、可下载权重、有架构说明的主要家族。\n<\/li><li>\n下一章：把“家族”落到八条架构路线，建立世界地图。\n<\/ul>", "kind": "chapter", "title": "第 1 章：先定边界：开源、开放权重与“能下载”"}, "ch02": {"html": "<div class=\"source-badge\">📖 出处：https://huggingface.co/models<\/div><h1>第 2 章 世界地图：六种骨架，而不是六个公司<\/h1>\n<blockquote>难度：入门 · 建议 50 分钟 · 前置：第 1 章<\/blockquote>\n<blockquote>学习目标：能用“骨架 / 规模 / 注意力 / 训练目标 / 模态 / 许可证”六个维度给任意开放模型定位；能画出一张不按公司分类的架构地图。<\/blockquote>\n<h2>一句话核心<\/h2>\n<p><strong>公司是产地，架构是物种。<\/strong> Llama、Qwen、Gemma、Phi 都是 decoder-only Transformer，但它们的注意力、归一化、激活、位置编码、MoE 路由、模态融合方式不同；反过来，同一个公司也会同时做 dense、MoE、线性注意力和多模态。<\/p>\n<h2>2.1 先看骨架：模型由哪几块组成<\/h2>\n<p>一个自回归语言模型，拆到最小，只有五块：<\/p>\n<ol><li>\n<strong>tokenizer<\/strong>：把文本切成 token，决定词表大小。\n<\/li><li>\n<strong>embedding<\/strong>：把 token id 变成向量。\n<\/li><li>\n<strong>重复的层<\/strong>：每层包含注意力 + FFN（或 MoE）+ 归一化 + 残差。\n<\/li><li>\n<strong>输出头<\/strong>：把最后一层隐藏状态映射回词表。\n<\/li><li>\n<strong>训练目标<\/strong>：下一个 token 预测，或掩码恢复，或扩散去噪。\n<\/ol>\n<p>不同家族改的，基本是第 3 块里的四个旋钮：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>旋钮<\/th><th>可选值<\/th><th>影响<\/th><\/tr><\/thead><tbody><tr><td>注意力<\/td><td>MHA / MQA / GQA / MLA / 滑窗 / 线性 / SSM<\/td><td>KV cache、长上下文、吞吐<\/td><\/tr><tr><td>FFN<\/td><td>dense / MoE / 共享专家<\/td><td>总参数、激活参数、显存<\/td><\/tr><tr><td>归一化<\/td><td>LayerNorm / RMSNorm / QK-Norm<\/td><td>训练稳定性、数值范围<\/td><\/tr><tr><td>位置<\/td><td>绝对位置 / RoPE / YaRN / iRoPE / 无位置<\/td><td>长度外推、长文本<\/td><\/tr><tr><td>激活<\/td><td>ReLU / GELU / SwiGLU / GeGLU<\/td><td>参数量、非线性<\/td><\/tr><tr><td>模态<\/td><td>纯文本 / 图文 / 音频 / 视频<\/td><td>编码器、连接器、token 预算<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote>读任何模型卡，先找这六个旋钮；找不到就说明模型卡写得不完整，不是你的问题。<\/blockquote>\n<h2>2.2 六种骨架<\/h2>\n<h3>A. decoder-only dense<\/h3>\n<p>代表：Llama 1–3、Mistral 7B、Gemma 2、Phi-4、Qwen2.5 小尺寸、Yi、Baichuan。<\/p>\n<p>每层所有参数都参与每个 token 的计算。结构最简单，工程最成熟，KV cache 和算力都好估。缺点是总参数和计算量绑定：想要更强，通常要更多层/更宽，推理成本同步上涨。<\/p>\n<h3>B. decoder-only MoE<\/h3>\n<p>代表：Mixtral、DeepSeek V2/V3/V4、Qwen3.5/3.8 大尺寸、Kimi K2/K3、GLM-5、MiniMax M3、Llama 4、Mistral Large 4。<\/p>\n<p>每层有多个专家 FFN，路由器只激活 top-k 个。总参数可以很大，但每 token 只算激活的一部分。代价是显存要装下全部专家、路由和专家并行通信复杂、微调更挑数据。<\/p>\n<h3>C. encoder-decoder<\/h3>\n<p>代表：T5、Flan-T5、BART、mT5、UL2、ByT5。<\/p>\n<p>编码器双向读输入，解码器自回归生成。输入理解强，输出长度可控；但在通用对话上，decoder-only 更灵活。今天新发的“大模型”少用这条路线，仍大量用于翻译、摘要、结构化生成和检索增强。<\/p>\n<h3>D. 线性注意力 / SSM / 混合<\/h3>\n<p>代表：RWKV、Mamba、Jamba、Griffin、xLSTM、Falcon-H1、Kimi Linear、Qwen3-Next。<\/p>\n<p>把 <span class=\"katex-inline\">O(n^2)<\/span> 的注意力换成 <span class=\"katex-inline\">O(n)<\/span> 的递归或状态空间，长序列显存更省。代价是“精确回看任意位置”的能力被压缩到状态里；混合模型用少量全注意力层补回这一点。<\/p>\n<h3>E. 多模态融合<\/h3>\n<p>代表：LLaVA、Qwen-VL、InternVL、Pixtral、Gemma 4、Llama 4、Janus、Chameleon、MiniCPM-V。<\/p>\n<p>图像先被 ViT 切成 patch，再经连接器变成若干 token，接进语言模型。融合发生在输入端叫“早期融合”，发生在中间层叫“中期融合”，只把视觉特征当外挂叫“晚期融合”。早期融合训练更贵，但模态交互更深。<\/p>\n<h3>F. 扩散语言模型<\/h3>\n<p>代表：LLaDA、Dream、DiffusionGemma。<\/p>\n<p>不按从左到右逐个 token 生成，而是从噪声开始迭代去噪。理论上能并行生成、能全局修改；工程上训练目标、采样步数、KV cache 都不沿用 Transformer 那套。它是 2025–2026 年的新分支，不是主流，但值得知道。<\/p>\n<h2>2.3 一张按“约束”排序的地图<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n  A[你要解决什么问题] --&gt; B{显存/延迟}\n  B --&gt;|单卡 8-24GB| C[小 dense: Phi / Gemma E / Qwen 小尺寸 / MiniCPM]\n  B --&gt;|多卡或大显存| D{要不要长上下文}\n  D --&gt;|要| E[GQA + RoPE/YaRN / 滑窗 / MLA]\n  D --&gt;|不要| F[标准 dense 或 MoE]\n  C --&gt; G{要不要图像}\n  G --&gt;|要| H[Qwen-VL / InternVL / MiniCPM-V / Gemma 4]\n  G --&gt;|不要| I[纯文本 dense]\n  E --&gt; J{要不要极低激活}\n  J --&gt;|要| K[MoE: Qwen MoE / Mixtral / DeepSeek]\n  J --&gt;|不要| L[ dense 大模型]\n  K --&gt; M[再看许可证和训练数据]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>这张图不按公司分，按“你的约束”分。选型时先回答显存、延迟、上下文、模态，再看家族。<\/p>\n<h2>2.4 六个维度的读卡模板<\/h2>\n<p>拿到任意模型卡，按这个顺序填一遍：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>要读的字段<\/th><th>典型坑<\/th><\/tr><\/thead><tbody><tr><td>骨架<\/td><td><code>architectures<\/code>、<code>model_type<\/code><\/td><td><code>LlamaForCausalLM<\/code> 和 <code>Qwen3_5MoeForCausalLM<\/code> 不是同一套实现<\/td><\/tr><tr><td>规模<\/td><td>总参数、激活参数、层数、hidden<\/td><td>名字里的 <code>A22B<\/code> 是激活，不是总参数<\/td><\/tr><tr><td>注意力<\/td><td>heads、KV heads、sliding window、rope<\/td><td>只写了“GQA”不等于知道 KV 头数<\/td><\/tr><tr><td>FFN<\/td><td>intermediate size、专家数、top-k<\/td><td><code>num_experts<\/code> 和 <code>num_experts_per_tok<\/code> 容易混<\/td><\/tr><tr><td>上下文<\/td><td><code>max_position_embeddings<\/code>、<code>rope_scaling<\/code><\/td><td>训练长度和标称最大长度可能不同<\/td><\/tr><tr><td>许可证<\/td><td>license、商用条款<\/td><td>“open” 不是许可证<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>2.5 一个具体对比：同是 7B，为什么形状不同<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>模型<\/th><th>层数<\/th><th>hidden<\/th><th>heads<\/th><th>KV heads<\/th><th>FFN<\/th><th>上下文<\/th><\/tr><\/thead><tbody><tr><td>Llama 2 7B<\/td><td>32<\/td><td>4096<\/td><td>32<\/td><td>32（MHA）<\/td><td>11008<\/td><td>4096<\/td><\/tr><tr><td>Mistral 7B<\/td><td>32<\/td><td>4096<\/td><td>32<\/td><td>8（GQA）<\/td><td>14336<\/td><td>32768（滑窗 4096）<\/td><\/tr><tr><td>Gemma 2 9B<\/td><td>42<\/td><td>3584<\/td><td>16<\/td><td>8（GQA）<\/td><td>14336<\/td><td>8192<\/td><\/tr><tr><td>Qwen2.5 7B<\/td><td>28<\/td><td>3584<\/td><td>28<\/td><td>4（GQA）<\/td><td>18944<\/td><td>131072<\/td><\/tr><\/tbody><\/table><\/div>\n<p>它们都叫“7B 级”，但 KV cache、长文本能力、每层计算量完全不同。<strong>参数规模只是体重，不是骨架。<\/strong><\/p>\n<h2>2.6 常见误解<\/h2>\n<ul><li>\n<strong>“decoder-only 就是 GPT。”<\/strong> 错。GPT 是早期实现之一，今天所有 Llama/Qwen/Mistral 都是 decoder-only，但细节差异很大。\n<\/li><li>\n<strong>“MoE 一定比 dense 强。”<\/strong> 错。MoE 买到的是容量，不是免费能力；路由训不好、专家不均衡，效果会倒退。\n<\/li><li>\n<strong>“线性注意力一定更快。”<\/strong> 只在长序列、够大的 batch 下才明显；短序列和训练前期，核函数与实现开销可能吃掉收益。\n<\/li><li>\n<strong>“多模态就是加一个 ViT。”<\/strong> 连接器、token 压缩、融合层、训练数据配比都会改变效果。\n<\/ul>\n<h2>2.7 自测<\/h2>\n<ol><li>\n用六个维度描述 Llama 3.1 8B 和 Qwen3.8 2.4T-A95B 的差别。\n<\/li><li>\n为什么同是 7B，Mistral 7B 的 KV cache 比 Llama 2 7B 小？\n<\/li><li>\n线性注意力和 MoE 分别解决什么问题？它们能同时用吗？\n<\/li><li>\n“早期融合”和“晚期融合”各有什么代价？\n<\/li><li>\n如果显存只有 24GB，想跑长上下文，优先看哪几个结构特征？\n<\/ol>\n<blockquote>参考答案：1）前者 dense/MHA?（实际 GQA 8 KV）/RoPE/128K；后者 MoE/4 KV/262K/多模态；2）Mistral 用 8 个 KV 头，Llama 2 是 32 个；3）线性注意力解决序列长度，MoE 解决参数容量与激活算力；可以，Kimi/Qwen3-Next 就是混合；4）早期融合交互深但训练贵，晚期融合便宜但模态交互浅；5）GQA/MLA、RoPE/YaRN、滑窗或线性注意力、量化。<\/blockquote>\n<h2>2.8 复习锚点<\/h2>\n<ul><li>\n六旋钮：注意力、FFN、归一化、位置、激活、模态。\n<\/li><li>\n六骨架：dense、MoE、encoder-decoder、线性/SSM、多模态、扩散。\n<\/li><li>\n读卡六维：骨架、规模、注意力、FFN、上下文、许可证。\n<\/li><li>\n下一章：从 Llama 开始，看一条 decoder-only 主线怎么演进。\n<\/ul>", "kind": "chapter", "title": "第 2 章：世界地图：六种骨架，而不是六个公司"}, "ch03": {"html": "<div class=\"source-badge\">📖 出处：https://huggingface.co/meta-llama<\/div><h1>第 3 章 Llama 家族：decoder-only 的行业基线<\/h1>\n<blockquote>难度：入门到中级 · 建议 60 分钟 · 前置：第 2 章<\/blockquote>\n<blockquote>学习目标：能画出 Llama 1→4 的结构演进；能说清 RoPE、GQA、SwiGLU、RMSNorm 各自解决什么；能区分 Llama 4 的“总参数”和“激活参数”；能手算 Llama 3.3 70B 的 KV cache。<\/blockquote>\n<h2>一句话核心<\/h2>\n<p>Llama 不是“一个模型”，而是一条把 decoder-only Transformer 标准化、再逐步加长上下文和 MoE 的路线。Llama 1 定义了骨架，Llama 2 加了聊天与安全，Llama 3 换了 tokenizer 和规模，Llama 3.1 把上下文拉到 128K，Llama 4 走向 MoE + 多模态 + 超长上下文。<\/p>\n<h2>3.1 时间线<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>代际<\/th><th>发布时间<\/th><th>尺寸<\/th><th>关键变化<\/th><\/tr><\/thead><tbody><tr><td>Llama 1<\/td><td>2023-02<\/td><td>7B / 13B / 33B / 65B<\/td><td>decoder-only、RoPE、SwiGLU、RMSNorm、2K 上下文<\/td><\/tr><tr><td>Llama 2<\/td><td>2023-07<\/td><td>7B / 13B / 70B<\/td><td>4K 上下文、GQA（70B）、聊天版与安全对齐<\/td><\/tr><tr><td>Llama 3<\/td><td>2024-04<\/td><td>8B / 70B<\/td><td>128K 词表、15T token 训练、8K 上下文<\/td><\/tr><tr><td>Llama 3.1<\/td><td>2024-07<\/td><td>8B / 70B / 405B<\/td><td>128K 上下文、405B 旗舰、工具调用<\/td><\/tr><tr><td>Llama 3.2<\/td><td>2024-09<\/td><td>1B / 3B / 11B / 90B<\/td><td>小尺寸 + 视觉版、轻量端侧<\/td><\/tr><tr><td>Llama 3.3<\/td><td>2024-12<\/td><td>70B<\/td><td>用 70B 接近 405B 的效果，降低部署成本<\/td><\/tr><tr><td>Llama 4<\/td><td>2025-04<\/td><td>Scout 17B×16E / Maverick 17B×128E<\/td><td>MoE、早期融合多模态、10M/1M 上下文、iRoPE<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote>尺寸写法：<code>17B×16E<\/code> 表示“17B 激活参数 × 16 个专家”；总参数约 109B。Maverick 是 17B×128E，总参数约 400B。<strong>不要把它读成 17B 总参数。<\/strong><\/blockquote>\n<h2>3.2 骨架：Llama 1/2 定下的四个默认值<\/h2>\n<h3>RMSNorm<\/h3>\n<p>LayerNorm 计算均值方差；RMSNorm 只算均方根：<\/p>\n<div class=\"katex-block\">\\text{RMSNorm}(x)=\\frac{x}{\\sqrt{\\frac{1}{d}\\sum_{i=1}^{d}x_i^2+\\epsilon}}\\cdot g<\/div>\n<p>它少了一次减均值，数值更稳、计算更省。今天绝大多数开放模型沿用 RMSNorm 或它的变体。<\/p>\n<h3>SwiGLU<\/h3>\n<p>FFN 不是简单的 <code>Linear → 激活 → Linear<\/code>，而是：<\/p>\n<div class=\"katex-block\">\\text{FFN}(x)=W_2\\big(\\text{Swish}(W_1x)\\otimes W_3x\\big)<\/div>\n<p>两个线性投影，一个做门控，一个做值，再逐元素相乘。它在相同参数量下通常比 ReLU FFN 表现更好，代价是 FFN 中间维度要按比例缩小。<\/p>\n<h3>RoPE<\/h3>\n<p>位置信息不靠绝对位置 embedding，而是把 Q/K 的向量按位置旋转：<\/p>\n<div class=\"katex-block\">R_{\\theta,m} =\\\\\\begin{bmatrix}\\\\\\cos m\\theta & -\\sin m\\theta\\\\\\\\\\sin m\\theta & \\cos m\\theta\\\\\\end{bmatrix}<\/div>\n<p>注意力分数只依赖相对位置 <span class=\"katex-inline\">m-n<\/span>。这就是 Llama 能做长度外推的基础；后来加的 YaRN、Llama 3 的 <code>rope_scaling<\/code> 都是在改旋转频率。<\/p>\n<h3>GQA<\/h3>\n<p>Llama 2 70B 开始用分组查询注意力：64 个 Q 头共享 8 组 K/V 头。KV cache 直接降到 MHA 的 1/8。<\/p>\n<blockquote>注意：Llama 2 的 7B/13B 还是 MHA，Llama 3 的 8B/70B 都是 GQA。不要用“Llama 都用 GQA”这种笼统说法。<\/blockquote>\n<h2>3.3 代表配置<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>模型<\/th><th>层数<\/th><th>hidden<\/th><th>Q 头<\/th><th>KV 头<\/th><th>FFN<\/th><th>上下文<\/th><th>词表<\/th><\/tr><\/thead><tbody><tr><td>Llama 2 7B<\/td><td>32<\/td><td>4096<\/td><td>32<\/td><td>32<\/td><td>11008<\/td><td>4096<\/td><td>32000<\/td><\/tr><tr><td>Llama 3 8B<\/td><td>32<\/td><td>4096<\/td><td>32<\/td><td>8<\/td><td>14336<\/td><td>8192<\/td><td>128256<\/td><\/tr><tr><td>Llama 3.1 8B<\/td><td>32<\/td><td>4096<\/td><td>32<\/td><td>8<\/td><td>14336<\/td><td>131072<\/td><td>128256<\/td><\/tr><tr><td>Llama 3.1 405B<\/td><td>126<\/td><td>16384<\/td><td>128<\/td><td>8<\/td><td>53248<\/td><td>131072<\/td><td>128256<\/td><\/tr><tr><td>Llama 3.3 70B<\/td><td>80<\/td><td>8192<\/td><td>64<\/td><td>8<\/td><td>28672<\/td><td>131072<\/td><td>128256<\/td><\/tr><tr><td>Llama 4 Scout<\/td><td>48<\/td><td>5120<\/td><td>40<\/td><td>8<\/td><td>8192（专家内）<\/td><td>10,485,760<\/td><td>202048<\/td><\/tr><tr><td>Llama 4 Maverick<\/td><td>48<\/td><td>5120<\/td><td>40<\/td><td>8<\/td><td>8192（专家内）<\/td><td>1,048,576<\/td><td>202048<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote>Llama 4 的 <code>intermediate_size<\/code> 是专家内部宽度；总专家数和 top-k 要看 <code>num_local_experts<\/code> / <code>num_experts_per_tok<\/code>。Scout 是 16 专家，Maverick 是 128 专家。<\/blockquote>\n<h2>3.4 Llama 4 改了什么<\/h2>\n<h3>MoE<\/h3>\n<p>Scout 和 Maverick 都是 48 层、5120 hidden、40 个 Q 头、8 个 KV 头，但每层 FFN 换成多个专家。Scout 16 专家，Maverick 128 专家；每个 token 只激活一部分，所以激活参数约 17B。<\/p>\n<p>为什么是 17B 激活？因为推理成本主要由激活参数和 KV cache 决定，不是总参数。Scout 总参数 109B，显存要装全部专家；但每 token 计算量接近 17B 模型。Maverick 总参数 400B，激活仍 17B——这就是 MoE 的“容量与算力解耦”。<\/p>\n<h3>iRoPE<\/h3>\n<p>Llama 4 不是所有层都用同一个 RoPE。它把注意力层分成“局部/全局”两类，用交错的位置处理支持超长上下文。官方把它叫 iRoPE（interleaved RoPE）。具体实现细节在模型代码里，模型卡没有逐层展开；本册只讲设计意图：<strong>让一部分层专注近处，一部分层保留远距离位置信息<\/strong>。<\/p>\n<h3>早期融合多模态<\/h3>\n<p>Llama 4 把图像 token 和文本 token 在较早层就拼在一起，而不是只在最后加一个视觉塔。这让模型能做图文推理，但也意味着视觉和语言一起训练，数据配比和算力成本更高。<\/p>\n<h2>3.5 手算：Llama 3.3 70B 的 KV cache<\/h2>\n<p>公式：<\/p>\n<div class=\"katex-block\">\\text{KV bytes/token}\\\\=2\\times L\\times H_{kv}\\times d_{head}\\times b<\/div>\n<p>其中 <span class=\"katex-inline\">L<\/span> 层数，<span class=\"katex-inline\">H_{kv}<\/span> KV 头数，<span class=\"katex-inline\">d_{head}<\/span> 每头维度，<span class=\"katex-inline\">b<\/span> 每元素字节（FP16=2）。<\/p>\n<p>Llama 3.3 70B：<span class=\"katex-inline\">L=80<\/span>，<span class=\"katex-inline\">H_{kv}=8<\/span>，<span class=\"katex-inline\">d_{head}=128<\/span>，<span class=\"katex-inline\">b=2<\/span>。<\/p>\n<div class=\"katex-block\">2\\times80\\times8\\times128\\times2=327{,}680\\ \\text{bytes/token}\\\\\\approx 0.3125\\ \\text{MiB/token}<\/div>\n<p>128K token 的单序列：<\/p>\n<div class=\"katex-block\">327{,}680\\times131{,}072\\\\=42{,}949{,}672{,}960\\ \\text{bytes}\\\\\\approx 40\\ \\text{GiB}<\/div>\n<p>也就是说，<strong>光 KV cache 就约 40 GiB<\/strong>，还不算权重（70B FP16 约 140 GB）、激活和框架开销。单卡 80GB 想跑 128K，必须量化权重 + KV 量化 + 分页/分离部署，不能拿“模型 70B”直接估。<\/p>\n<blockquote>对比 Llama 3.1 8B：32 层、8 KV 头、128 维，每 token 131,072 bytes = 0.125 MiB；128K 约 16 GiB。小模型的长上下文也不是免费。<\/blockquote>\n<h2>3.6 Llama 的取舍<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>设计<\/th><th>得到什么<\/th><th>付出什么<\/th><\/tr><\/thead><tbody><tr><td>decoder-only<\/td><td>训练目标简单、生成灵活<\/td><td>没有双向编码，输入理解不如 encoder-decoder<\/td><\/tr><tr><td>RoPE<\/td><td>相对位置、易外推<\/td><td>超长外推需要 YaRN/缩放，频率调不好会退化<\/td><\/tr><tr><td>GQA<\/td><td>KV cache 降 4–8 倍<\/td><td>头数太少会损失表达能力<\/td><\/tr><tr><td>SwiGLU<\/td><td>同参数量下效果更好<\/td><td>FFN 宽度要重新配比<\/td><\/tr><tr><td>MoE（Llama 4）<\/td><td>总容量大、激活低<\/td><td>显存、路由、专家并行复杂<\/td><\/tr><tr><td>社区许可证<\/td><td>生态大、工具多<\/td><td>商用条款不是 Apache 那种无条件<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>3.7 常见误解<\/h2>\n<ul><li>\n<strong>“Llama 3.1 405B 是 405B 激活。”<\/strong> 错，它是 dense，405B 总参数也是每 token 激活。\n<\/li><li>\n<strong>“Llama 4 是 17B 模型。”<\/strong> 错，17B 是激活参数，总参数 109B/400B。\n<\/li><li>\n<strong>“GQA 就是 MQA。”<\/strong> 错，MQA 是 1 组 KV，GQA 是多组；Llama 2 70B/3 8B 是 8 组。\n<\/li><li>\n<strong>“上下文 128K 就能塞 128K。”<\/strong> 训练长度、位置外推、KV 显存、注意力精度都会限制实际上限。\n<\/ul>\n<h2>3.8 自测<\/h2>\n<ol><li>\nLlama 1 的四个结构默认值是什么？\n<\/li><li>\nLlama 2 70B 为什么用 GQA？省的是哪部分显存？\n<\/li><li>\nLlama 3.3 70B 在 32K 上下文下单序列 KV 约多少 GiB？\n<\/li><li>\nLlama 4 Scout 和 Maverick 的专家数、总参数、激活参数各是多少？\n<\/li><li>\niRoPE 的设计意图是什么？它没有解决什么？\n<\/ol>\n<blockquote>参考答案：1）RoPE、SwiGLU、RMSNorm、decoder-only；2）64 个 Q 头共享 8 组 KV，省 KV cache；3）327,680×32,768≈10.7 GB≈10 GiB；4）Scout 16 专家/109B/17B，Maverick 128 专家/400B/17B；5）让局部层和全局层分工支持超长上下文；没有解决 KV 显存和训练数据问题。<\/blockquote>\n<h2>3.9 复习锚点<\/h2>\n<ul><li>\nLlama 1→4 的关键变化：RoPE/SwiGLU/RMSNorm → GQA → 128K 词表/128K 上下文 → MoE/多模态/iRoPE。\n<\/li><li>\n总参数 vs 激活参数：Llama 4 是典型。\n<\/li><li>\nKV 公式：<span class=\"katex-inline\">2 L H_{kv} d_{head} b<\/span>。\n<\/li><li>\n下一章：Qwen 如何把 dense、MoE、多模态、线性注意力全部走一遍。\n<\/ul>", "kind": "chapter", "title": "第 3 章：Llama 家族：decoder-only 的行业基线"}, "ch04": {"html": "<div class=\"source-badge\">📖 出处：https://huggingface.co/Qwen<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 3 章：Llama 家族：decoder-only 的行业基线<\/a><\/span><\/div><h1>第 4 章 Qwen 家族：从 0.5B 到 2.4T-A95B 的缩放路线<\/h1>\n<blockquote>难度：中级 · 建议 70 分钟 · 前置：第 3 章<\/blockquote>\n<blockquote>学习目标：能列出 Qwen 1→3.8 的代际主线；能区分 Qwen 的 dense、MoE、混合线性注意力三条子路线；能读 Qwen3.5/3.6/3.8 的 config 并算 KV cache。<\/blockquote>\n<h2>一句话核心<\/h2>\n<p>Qwen 是开放模型里少见的“全尺寸、全架构、全模态”家族：小到 0.8B 端侧 dense，大到 2.4T 总参数 / 95B 激活的 MoE，中间还有 397B-A17B、122B-A10B、35B-A3B 和 27B dense；同时做视觉、音频、OCR 和混合线性注意力。它不是一个模型，而是一棵产品树。<\/p>\n<h2>4.1 时间线<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>代际<\/th><th>时间<\/th><th>尺寸范围<\/th><th>关键变化<\/th><\/tr><\/thead><tbody><tr><td>Qwen 1<\/td><td>2023<\/td><td>7B / 14B / 72B<\/td><td>最早的中英双语开放基座之一<\/td><\/tr><tr><td>Qwen1.5<\/td><td>2024 初<\/td><td>0.5B–72B<\/td><td>更小的尺寸、聊天模板统一<\/td><\/tr><tr><td>Qwen2<\/td><td>2024 中<\/td><td>0.5B–72B + 57B-A14B<\/td><td>GQA、MoE 试水、长上下文<\/td><\/tr><tr><td>Qwen2.5<\/td><td>2024 末<\/td><td>0.5B–72B + 14B/32B<\/td><td>更大数据、更长上下文、工具调用<\/td><\/tr><tr><td>Qwen3<\/td><td>2025<\/td><td>0.6B–235B-A22B + 30B-A3B<\/td><td>dense + MoE 双线、thinking 模式<\/td><\/tr><tr><td>Qwen3-Next<\/td><td>2025<\/td><td>80B-A3B<\/td><td>Gated DeltaNet + Gated Attention 混合<\/td><\/tr><tr><td>Qwen3.5<\/td><td>2026-02<\/td><td>0.8B–397B-A17B<\/td><td>全尺寸 MoE 化、262K 上下文、多模态<\/td><\/tr><tr><td>Qwen3.6<\/td><td>2026-04<\/td><td>27B / 35B-A3B<\/td><td>同骨架迭代、效率优化<\/td><\/tr><tr><td>Qwen3.8<\/td><td>2026-08<\/td><td>27B / 2.4T-A95B / Flash-Next<\/td><td>2.4T 旗舰、qwen4_exp 试验架构<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote>日期来自 Hugging Face 仓库创建时间，不是论文发表时间；同一代际可能分多次上传。<\/blockquote>\n<h2>4.2 三条子路线<\/h2>\n<h3>A. 小尺寸 dense<\/h3>\n<p>Qwen3.5-0.8B/2B/4B/9B、Qwen3.6-27B、Qwen3.8-27B 都是 dense。它们适合端侧、单卡微调、教学。结构上和 Llama 类似：RMSNorm、SwiGLU、RoPE、GQA。<\/p>\n<h3>B. 大尺寸 MoE<\/h3>\n<p>Qwen3.5-35B-A3B/122B-A10B/397B-A17B、Qwen3.6-35B-A3B、Qwen3.8-2.4T-A95B 都是 MoE。共同特征：<\/p>\n<ul><li>\n专家数多：256 或 512；\n<\/li><li>\n每 token 激活 8 或 10 个；\n<\/li><li>\n专家内部宽度窄：512–2048，而不是 dense 的 14336；\n<\/li><li>\nKV 头很少：2 或 4；\n<\/li><li>\n上下文 262,144。\n<\/ul>\n<p>这不是“把 dense FFN 简单复制 256 份”。专家变多、每个变窄，路由更细；总参数涨，激活参数涨得慢。<\/p>\n<h3>C. 混合线性注意力<\/h3>\n<p>Qwen3-Next-80B-A3B 是 Qwen 的混合路线：48 层、2048 hidden、16 Q 头、2 KV 头、512 专家、top-10、262K 上下文。它把部分注意力层换成 Gated DeltaNet（线性注意力），保留少量全注意力层。Qwen3.8-Flash-Next 的 <code>model_type<\/code> 是 <code>qwen4_exp<\/code>，说明 Qwen 还在试验下一代骨架；本册按 config 讲事实，不把试验代号当已定论文。<\/p>\n<h2>4.3 代表配置<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>模型<\/th><th>层数<\/th><th>hidden<\/th><th>Q/KV 头<\/th><th>专家/激活<\/th><th>专家宽度<\/th><th>上下文<\/th><th>类型<\/th><\/tr><\/thead><tbody><tr><td>Qwen3.5-0.8B<\/td><td>24<\/td><td>1024<\/td><td>8/2<\/td><td>dense<\/td><td>3584<\/td><td>262K<\/td><td>dense<\/td><\/tr><tr><td>Qwen3.5-9B<\/td><td>32<\/td><td>4096<\/td><td>16/4<\/td><td>dense<\/td><td>12288<\/td><td>262K<\/td><td>dense<\/td><\/tr><tr><td>Qwen3.5-27B<\/td><td>64<\/td><td>5120<\/td><td>24/4<\/td><td>dense<\/td><td>17408<\/td><td>262K<\/td><td>dense<\/td><\/tr><tr><td>Qwen3.5-35B-A3B<\/td><td>40<\/td><td>2048<\/td><td>16/2<\/td><td>256 / 8<\/td><td>512<\/td><td>262K<\/td><td>MoE<\/td><\/tr><tr><td>Qwen3.5-122B-A10B<\/td><td>48<\/td><td>3072<\/td><td>32/2<\/td><td>256 / 8<\/td><td>1024<\/td><td>262K<\/td><td>MoE<\/td><\/tr><tr><td>Qwen3.5-397B-A17B<\/td><td>60<\/td><td>4096<\/td><td>32/2<\/td><td>512 / 10<\/td><td>1024<\/td><td>262K<\/td><td>MoE<\/td><\/tr><tr><td>Qwen3.6-35B-A3B<\/td><td>40<\/td><td>2048<\/td><td>16/2<\/td><td>256 / 8<\/td><td>512<\/td><td>262K<\/td><td>MoE<\/td><\/tr><tr><td>Qwen3.6-27B<\/td><td>64<\/td><td>5120<\/td><td>24/4<\/td><td>dense<\/td><td>17408<\/td><td>262K<\/td><td>dense<\/td><\/tr><tr><td>Qwen3.8-27B<\/td><td>64<\/td><td>5120<\/td><td>24/4<\/td><td>dense<\/td><td>17408<\/td><td>262K<\/td><td>dense + 视觉<\/td><\/tr><tr><td>Qwen3.8-2.4T-A95B<\/td><td>92<\/td><td>8192<\/td><td>64/4<\/td><td>512 / 10<\/td><td>2048<\/td><td>262K<\/td><td>MoE<\/td><\/tr><tr><td>Qwen3.8-Flash-Next<\/td><td>48<\/td><td>2560<\/td><td>24/2<\/td><td>512 / 10<\/td><td>640<\/td><td>262K<\/td><td>MoE + 视觉<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote>以上数字来自对应 <code>config.json<\/code> 的 <code>text_config<\/code>。<code>Qwen3.5-0.8B<\/code> 的层数/宽度是系列中最小档的代表值；不同小尺寸会有差异，读具体模型时以该模型 config 为准。<\/blockquote>\n<h2>4.4 为什么 Qwen 的 MoE 这么“碎”<\/h2>\n<p>看 Qwen3.8-2.4T-A95B：512 个专家，每个专家中间宽度只有 2048；Qwen3.5-397B-A17B：512 个专家，宽度 1024。对比 Llama 4 Scout：16 个专家，专家宽度 8192。<\/p>\n<p>两种设计哲学：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>设计<\/th><th>专家数<\/th><th>专家宽度<\/th><th>路由<\/th><th>适合什么<\/th><\/tr><\/thead><tbody><tr><td>宽专家、少专家<\/td><td>8–16<\/td><td>8192–14336<\/td><td>top-1/2<\/td><td>通信少、单机友好<\/td><\/tr><tr><td>窄专家、多专家<\/td><td>256–512<\/td><td>512–2048<\/td><td>top-8/10<\/td><td>容量大、细粒度路由、需要专家并行<\/td><\/tr><tr><td>折中<\/td><td>64–128<\/td><td>2048–4096<\/td><td>top-4/8<\/td><td>多机但通信可控<\/td><\/tr><\/tbody><\/table><\/div>\n<p>专家越碎，总参数越大，但每个 token 只读一小撮专家；显存要装全部专家，专家并行（EP）通信量也更大。<strong>Qwen 的大模型不是为单卡设计的。<\/strong><\/p>\n<h2>4.5 手算：Qwen3.8-27B 的 KV cache<\/h2>\n<p>Qwen3.8-27B：<span class=\"katex-inline\">L=64<\/span>，<span class=\"katex-inline\">H_{kv}=4<\/span>，<span class=\"katex-inline\">d_{head}=256<\/span>，FP16 <span class=\"katex-inline\">b=2<\/span>。<\/p>\n<div class=\"katex-block\">2\\times64\\times4\\times256\\times2\\\\=262{,}144\\ \\text{bytes/token}\\\\=0.25\\ \\text{MiB/token}<\/div>\n<p>262,144 token：<\/p>\n<div class=\"katex-block\">262{,}144\\times262{,}144\\\\=68{,}719{,}476{,}736\\ \\text{bytes}\\\\\\approx64\\ \\text{GiB}<\/div>\n<p>单序列 262K 就要 64 GiB KV。Qwen3.8-2.4T-A95B 更狠：<\/p>\n<div class=\"katex-block\">2\\times92\\times4\\times256\\times2\\\\=376{,}832\\ \\text{bytes/token}\\\\\\approx0.359\\ \\text{MiB/token}<\/div>\n<p>262K 约 92 GiB。<strong>长上下文模型的第一道门槛不是权重，是 KV。<\/strong><\/p>\n<h2>4.6 Qwen 的取舍<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>设计<\/th><th>得到什么<\/th><th>付出什么<\/th><\/tr><\/thead><tbody><tr><td>全尺寸覆盖<\/td><td>从端侧到集群都有选择<\/td><td>同名家族差异大，容易选错<\/td><\/tr><tr><td>窄专家 + top-10<\/td><td>总容量大、激活低<\/td><td>显存、EP 通信、路由训练难<\/td><\/tr><tr><td>2–4 KV 头<\/td><td>KV cache 小<\/td><td>头太少可能损失表达；要配合 head_dim<\/td><\/tr><tr><td>262K 上下文<\/td><td>长文档/代码库<\/td><td>KV 显存、注意力计算、位置外推<\/td><\/tr><tr><td>多模态<\/td><td>图文/视频/音频<\/td><td>视觉 token 预算、连接器训练、数据配比<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>4.7 常见误解<\/h2>\n<ul><li>\n<strong>“Qwen3.8-2.4T 是 2.4T 激活。”<\/strong> 错，95B 激活；2.4T 是总参数。\n<\/li><li>\n<strong>“Qwen3.5-397B-A17B 和 3.8-2.4T 是同一档。”<\/strong> 不是，397B/17B 与 2.4T/95B 差一个数量级。\n<\/li><li>\n<strong>“Qwen3.8-27B 是纯文本。”<\/strong> 它的整体架构是 <code>Qwen3_5ForConditionalGeneration<\/code>，带视觉塔；文本 config 只是其中一部分。\n<\/li><li>\n<strong>“262K 就是能处理 262K。”<\/strong> 还要看训练长度、RoPE 缩放、KV 显存和注意力实现。\n<\/ul>\n<h2>4.8 自测<\/h2>\n<ol><li>\nQwen3.5/3.6/3.8 的三条子路线各是什么？\n<\/li><li>\nQwen3.5-397B-A17B 的专家数、top-k、专家宽度是多少？\n<\/li><li>\nQwen3.8-2.4T-A95B 的激活参数占比约多少？\n<\/li><li>\nQwen3.8-27B 在 128K 上下文下单序列 KV 约多少 GiB？\n<\/li><li>\n为什么 Qwen 的大 MoE 不适合单卡部署？\n<\/ol>\n<blockquote>参考答案：1）小 dense、大 MoE、混合线性注意力；2）512 专家，top-10，宽度 1024；3）95/2400≈3.96%；4）0.25 MiB×131072≈32 GiB；5）总参数 2.4T，权重和全部专家要装进显存，需要多卡/EP。<\/blockquote>\n<h2>4.9 复习锚点<\/h2>\n<ul><li>\nQwen 代际：1 → 1.5 → 2 → 2.5 → 3 → 3-Next → 3.5 → 3.6 → 3.8。\n<\/li><li>\n三种子路线：dense、MoE、混合线性。\n<\/li><li>\n大 MoE 特征：256/512 专家、top-8/10、窄专家、2/4 KV 头、262K。\n<\/li><li>\n下一章：Mistral 怎么用滑窗、MoE 和多模态走另一条路线。\n<\/ul>", "kind": "chapter", "title": "第 4 章：Qwen 家族：从 0.5B 到 2.4T-A95B 的缩放路线"}, "ch05": {"html": "<div class=\"source-badge\">📖 出处：https://huggingface.co/mistralai<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 3 章：Llama 家族：decoder-only 的行业基线<\/a><\/span><\/div><h1>第 5 章 Mistral 家族：滑窗、MoE 与多模态的三次转向<\/h1>\n<blockquote>难度：中级 · 建议 60 分钟 · 前置：第 4 章<\/blockquote>\n<blockquote>学习目标：能说清 Mistral 7B 的滑窗注意力为什么省 KV；能区分 Mixtral 的“总参数/激活参数”；能列出 Mistral Small/Medium/Large 4 的结构差异。<\/blockquote>\n<h2>一句话核心<\/h2>\n<p>Mistral 的路线不是“越大越好”，而是三次转向：先用<strong>滑窗注意力<\/strong>把 7B 做到长上下文；再用 <strong>MoE<\/strong> 把容量和激活拆开；最后用 <strong>Pixtral/Voxtral<\/strong> 把图像和音频接进来。它是最早把“开放权重 + 商业许可”做成产品线的欧洲家族。<\/p>\n<h2>5.1 时间线<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>时间<\/th><th>模型<\/th><th>结构关键词<\/th><\/tr><\/thead><tbody><tr><td>2023-09<\/td><td>Mistral 7B<\/td><td>32 层、4096 hidden、GQA 8 KV、滑窗 4096、32K 上下文<\/td><\/tr><tr><td>2023-12<\/td><td>Mixtral 8x7B<\/td><td>8 专家、top-2、总 46.7B / 激活 12.9B<\/td><\/tr><tr><td>2024-01<\/td><td>Mixtral 8x22B<\/td><td>8 专家、top-2、总 141B / 激活 39B、64K 上下文<\/td><\/tr><tr><td>2024-05<\/td><td>Codestral 22B<\/td><td>代码专用、32K 上下文<\/td><\/tr><tr><td>2024-09<\/td><td>Pixtral 12B<\/td><td>视觉编码器 + 语言模型<\/td><\/tr><tr><td>2025-01<\/td><td>Mistral Small 3 24B<\/td><td>40 层、5120 hidden、32/8 GQA、128K<\/td><\/tr><tr><td>2025-03<\/td><td>Mistral Small 3.1 24B<\/td><td>多模态 instruct、Apache 2.0<\/td><\/tr><tr><td>2025-06<\/td><td>Magistral / Voxtral<\/td><td>推理模型、音频模型<\/td><\/tr><tr><td>2026-03<\/td><td>Mistral Small 4 119B<\/td><td>36 层、4096、32/32、128 专家 top-4、1M<\/td><\/tr><tr><td>2026<\/td><td>Mistral Large 4 1T-A52B<\/td><td>72 层、6144、64/64、128 路由专家 + 1 共享、top-4、1M、FP8<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote>2026 的 Small 4 / Large 4 配置来自 Hugging Face <code>config.json<\/code>；Large 4 的权重以 FP8 发布，部署门槛比“1T”听起来低，但仍然需要多卡。<\/blockquote>\n<h2>5.2 Mistral 7B：滑窗注意力<\/h2>\n<p>标准注意力每个 token 都要看前面所有 token，KV cache 随序列长度线性增长，注意力计算随长度平方增长。Mistral 7B 把每个 token 的可见范围限制在最近 <span class=\"katex-inline\">W=4096<\/span> 个 token：<\/p>\n<div class=\"katex-block\">\\text{Attn}(Q,K,V)=\\text{softmax}\\left(\\frac{QK^\\top}{\\sqrt{d}}\\right)V,\\\\\\quad K,V \\in \\mathbb{R}^{W\\times d}<\/div>\n<p>序列超过 4096 时，旧 token 被滚出窗口。这样 KV cache 只保留窗口内的 K/V，显存不随 32K 线性涨。<\/p>\n<p>代价：<strong>模型不能直接回看窗口外的原文<\/strong>。它靠层叠的窗口把信息逐层传递，但精确检索远处 token 的能力弱于全注意力。后来的 Gemma 2/3 用“局部/全局交替”来补这个缺陷。<\/p>\n<h2>5.3 Mixtral：MoE 的早期模板<\/h2>\n<p>Mixtral 8x7B 不是“8 个 7B 模型拼起来”。它每层有 8 个专家 FFN，每个 token 由路由器选 top-2 专家：<\/p>\n<div class=\"katex-block\">y=\\sum_{i\\in \\text{top-2}(g(x))} g_i(x)\\,E_i(x)<\/div>\n<p>总参数约 46.7B（8 个专家 + 注意力 + embedding），每 token 激活约 12.9B（2 个专家 + 共享部分）。8x22B 同理：总 141B，激活 39B。<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>模型<\/th><th>层数<\/th><th>hidden<\/th><th>Q/KV<\/th><th>专家<\/th><th>top-k<\/th><th>总参/激活<\/th><th>上下文<\/th><\/tr><\/thead><tbody><tr><td>Mixtral 8x7B<\/td><td>32<\/td><td>4096<\/td><td>32/8<\/td><td>8<\/td><td>2<\/td><td>46.7B / 12.9B<\/td><td>32K<\/td><\/tr><tr><td>Mixtral 8x22B<\/td><td>56<\/td><td>6144<\/td><td>48/8<\/td><td>8<\/td><td>2<\/td><td>141B / 39B<\/td><td>64K<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote>注意：8x7B 的“7B”是单个专家的宽度量级，不是总参数；总参数还要加注意力和 embedding。<\/blockquote>\n<h2>5.4 Mistral Small / Medium / Large 4<\/h2>\n<h3>Small 3.1 24B<\/h3>\n<p>40 层、5120 hidden、32 Q 头、8 KV 头、128K 上下文。它是 24B 级多模态 instruct，视觉塔是 Pixtral 风格。Apache 2.0，适合单卡 48GB 量化部署。<\/p>\n<h3>Small 4 119B<\/h3>\n<p>36 层、4096 hidden、32 Q 头、32 KV 头（MHA）、128 路由专家、top-4、专家宽度 2048、1M 上下文。这个配置有两个反直觉点：<\/p>\n<ol><li>\n<strong>只有 36 层<\/strong>，但 hidden 4096、专家 128 个，总参数 119B；\n<\/li><li>\n<strong>KV 头 32 个，不是 GQA<\/strong>，所以 1M 上下文的 KV cache 非常贵。\n<\/ol>\n<p>它的设计更像是“宽而浅的 MoE + 强长上下文”，不是“深而窄的 dense”。<\/p>\n<h3>Medium 3.5 128B<\/h3>\n<p>88 层、12288 hidden、96 Q 头、8 KV 头、FFN 28672、262K 上下文。它是 dense，不是 MoE；hidden 12288 比 Large 4 的 6144 宽一倍。宽模型单层表达能力强，但层数少、显存带宽压力大。<\/p>\n<h3>Large 4 1T-A52B<\/h3>\n<p>72 层、6144 hidden、64 Q 头、64 KV 头（MHA）、128 路由专家 + 1 共享专家、top-4、专家宽度 6144、1M 上下文。官方以 FP8 权重发布，视觉塔是 Pixtral（30 层、2048 hidden）。<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>模型<\/th><th>层数<\/th><th>hidden<\/th><th>Q/KV<\/th><th>专家<\/th><th>top-k<\/th><th>上下文<\/th><th>类型<\/th><\/tr><\/thead><tbody><tr><td>Small 3.1 24B<\/td><td>40<\/td><td>5120<\/td><td>32/8<\/td><td>dense<\/td><td>—<\/td><td>128K<\/td><td>dense + 视觉<\/td><\/tr><tr><td>Small 4 119B<\/td><td>36<\/td><td>4096<\/td><td>32/32<\/td><td>128<\/td><td>4<\/td><td>1M<\/td><td>MoE + 视觉<\/td><\/tr><tr><td>Medium 3.5 128B<\/td><td>88<\/td><td>12288<\/td><td>96/8<\/td><td>dense<\/td><td>—<\/td><td>262K<\/td><td>dense<\/td><\/tr><tr><td>Large 4 1T-A52B<\/td><td>72<\/td><td>6144<\/td><td>64/64<\/td><td>128 + 1 共享<\/td><td>4<\/td><td>1M<\/td><td>MoE + 视觉<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>5.5 手算：Mistral 7B 的 KV 账<\/h2>\n<p>Mistral 7B：<span class=\"katex-inline\">L=32<\/span>，<span class=\"katex-inline\">H_{kv}=8<\/span>，<span class=\"katex-inline\">d_{head}=128<\/span>，FP16。<\/p>\n<div class=\"katex-block\">2\\times32\\times8\\times128\\times2\\\\=131{,}072\\ \\text{bytes/token}\\\\=0.125\\ \\text{MiB/token}<\/div>\n<p>32K token：<span class=\"katex-inline\">131{,}072\\times32{,}768=4{,}294{,}967{,}296<\/span> bytes ≈ 4 GiB。<\/p>\n<p>如果是 32 个 KV 头的 MHA：<\/p>\n<div class=\"katex-block\">2\\times32\\times32\\times128\\times2\\\\=524{,}288\\ \\text{bytes/token}\\\\=0.5\\ \\text{MiB/token}<\/div>\n<p>32K 约 16 GiB。<strong>GQA 在这里省了 4 倍。<\/strong><\/p>\n<h2>5.6 取舍<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>设计<\/th><th>得到什么<\/th><th>付出什么<\/th><\/tr><\/thead><tbody><tr><td>滑窗<\/td><td>KV 小、长序列可跑<\/td><td>不能精确回看远处<\/td><\/tr><tr><td>MoE<\/td><td>总容量大、激活低<\/td><td>显存装全部专家、路由通信<\/td><\/tr><tr><td>宽 hidden（Medium）<\/td><td>单层表达强<\/td><td>显存带宽和矩阵乘成本高<\/td><\/tr><tr><td>MHA（Small 4 / Large 4）<\/td><td>表达能力强、实现简单<\/td><td>1M 上下文 KV 巨大<\/td><\/tr><tr><td>多模态<\/td><td>图文/音频<\/td><td>视觉 token 预算、训练数据<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>5.7 常见误解<\/h2>\n<ul><li>\n<strong>“Mistral 7B 支持 32K，所以能直接塞 32K。”<\/strong> 它用 4096 滑窗，32K 是最大位置；超出窗口的信息靠层间传递，不是精确注意力。\n<\/li><li>\n<strong>“Mixtral 8x7B 是 56B 激活。”<\/strong> 总参数 46.7B，激活 12.9B。\n<\/li><li>\n<strong>“Small 4 是 GQA。”<\/strong> 它 32 个 KV 头，是 MHA；不要看“Small”就默认省 KV。\n<\/li><li>\n<strong>“Large 4 是 1T 激活。”<\/strong> 1T 总参数，52B 激活。\n<\/ul>\n<h2>5.8 自测<\/h2>\n<ol><li>\nMistral 7B 的滑窗大小是多少？它省的是哪部分显存？\n<\/li><li>\nMixtral 8x7B 的总参数和激活参数各是多少？\n<\/li><li>\nMistral Small 4 119B 的层数、KV 头数、专家数、上下文各是多少？\n<\/li><li>\nMistral Large 4 1T-A52B 的专家结构和激活参数是什么？\n<\/li><li>\n滑窗注意力最大的能力缺陷是什么？\n<\/ol>\n<blockquote>参考答案：1）4096；省 KV cache（只保留窗口内）；2）46.7B / 12.9B；3）36 层、32 KV、128 专家 top-4、1M；4）128 路由 + 1 共享，top-4，52B 激活；5）不能精确回看窗口外原文。<\/blockquote>\n<h2>5.9 复习锚点<\/h2>\n<ul><li>\nMistral 7B：滑窗 4096 + GQA 8 KV。\n<\/li><li>\nMixtral：8 专家 top-2，8x7B 46.7B/12.9B，8x22B 141B/39B。\n<\/li><li>\nSmall 4 119B：36 层、32/32 MHA、128 专家 top-4、1M。\n<\/li><li>\nLarge 4：72 层、64/64、128+1 专家、top-4、1M、FP8。\n<\/li><li>\n下一章：Gemma 怎么用局部/全局交替和小模型路线。\n<\/ul>", "kind": "chapter", "title": "第 5 章：Mistral 家族：滑窗、MoE 与多模态的三次转向"}, "ch06": {"html": "<div class=\"source-badge\">📖 出处：https://huggingface.co/google<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch04\">第 4 章：Qwen 家族：从 0.5B 到 2.4T-A95B 的缩放路线<\/a><\/span><\/div><h1>第 6 章 Gemma 家族：小模型、局部/全局交替与统一多模态<\/h1>\n<blockquote>难度：中级 · 建议 60 分钟 · 前置：第 5 章<\/blockquote>\n<blockquote>学习目标：能解释 Gemma 2/3 的局部/全局交替为什么省 KV；能说出 Gemma 4 的 any-to-any 架构变化；能比较 Gemma 3 27B 与 Llama 3.3 70B 的 KV 账。<\/blockquote>\n<h2>一句话核心<\/h2>\n<p>Gemma 是 Google 的开放权重线，走的是“小尺寸 + 高质量数据 + 局部/全局交替注意力”的路线。Gemma 2 用 1:1 局部/全局，Gemma 3 用 5:1 局部/全局并加 QK-Norm，Gemma 4 把文本、图像、音频统一进一个 any-to-any 模型。<\/p>\n<h2>6.1 时间线<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>时间<\/th><th>模型<\/th><th>关键变化<\/th><\/tr><\/thead><tbody><tr><td>2024-02<\/td><td>Gemma 1 2B/7B<\/td><td>18/28 层，2K/8K 上下文，Gemma Terms<\/td><\/tr><tr><td>2024-06<\/td><td>Gemma 2 2B/9B/27B<\/td><td>局部/全局交替、soft-capping、GQA、8K<\/td><\/tr><tr><td>2024-10<\/td><td>RecurrentGemma 2B/9B<\/td><td>Griffin 混合：递归 + 局部注意力<\/td><\/tr><tr><td>2024-12<\/td><td>PaliGemma 2<\/td><td>SigLIP 视觉 + Gemma 语言模型<\/td><\/tr><tr><td>2025-03<\/td><td>Gemma 3 1B/4B/12B/27B<\/td><td>128K、5:1 局部/全局、QK-Norm、视觉<\/td><\/tr><tr><td>2026-02<\/td><td>Gemma 4 E2B/E4B<\/td><td>小尺寸 any-to-any，视觉 + 音频<\/td><\/tr><tr><td>2026-06<\/td><td>Gemma 4 12B<\/td><td>统一 any-to-any、262K、48 层<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote>Gemma 1–3 的许可证是 Gemma Terms，不是 OSI 认证的开源许可证；Gemma 4 的模型卡标 Apache 2.0。用之前逐个核对，不要一代代类推。<\/blockquote>\n<h2>6.2 Gemma 2：局部/全局交替<\/h2>\n<p>Gemma 2 每两层一组：一层只看局部窗口（4096），一层看全局。局部层省 KV 和计算，全局层保留长距离信息。它还对注意力 logits 做 soft-capping：<\/p>\n<div class=\"katex-block\">\\text{logits}' = c\\cdot\\tanh\\left(\\frac{\\text{logits}}{c}\\right)<\/div>\n<p>把过大的 logit 压回范围，训练更稳。这个技巧在 Gemma 2 上有效，但不是所有家族都跟。<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>模型<\/th><th>层数<\/th><th>hidden<\/th><th>Q/KV<\/th><th>FFN<\/th><th>上下文<\/th><th>局部窗口<\/th><\/tr><\/thead><tbody><tr><td>Gemma 2 9B<\/td><td>42<\/td><td>3584<\/td><td>16/8<\/td><td>14336<\/td><td>8192<\/td><td>4096<\/td><\/tr><tr><td>Gemma 2 27B<\/td><td>46<\/td><td>4608<\/td><td>32/16<\/td><td>36864<\/td><td>8192<\/td><td>4096<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>6.3 Gemma 3：5:1 交替 + QK-Norm<\/h2>\n<p>Gemma 3 把局部/全局比例改成 5:1：每 6 层里 5 层局部（1024 窗口），1 层全局。这样 128K 上下文下，大部分层只算 1024 窗口，只有少数层承担全局注意力。<\/p>\n<p>QK-Norm 在计算注意力前对 Q 和 K 做归一化：<\/p>\n<div class=\"katex-block\">Q'=\\text{RMSNorm}(Q),\\qquad K'=\\text{RMSNorm}(K)<\/div>\n<p>它能防止 attention logits 随 head_dim 变大而爆炸，是长上下文训练稳定的常用手段。<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>模型<\/th><th>层数<\/th><th>hidden<\/th><th>Q/KV<\/th><th>FFN<\/th><th>上下文<\/th><th>窗口/模式<\/th><th>视觉<\/th><\/tr><\/thead><tbody><tr><td>Gemma 3 4B<\/td><td>34<\/td><td>2560<\/td><td>8/4<\/td><td>10240<\/td><td>131072<\/td><td>1024 / 6<\/td><td>有<\/td><\/tr><tr><td>Gemma 3 12B<\/td><td>48<\/td><td>3840<\/td><td>16/8<\/td><td>15360<\/td><td>131072<\/td><td>1024 / 6<\/td><td>有<\/td><\/tr><tr><td>Gemma 3 27B<\/td><td>62<\/td><td>5376<\/td><td>32/16<\/td><td>21504<\/td><td>131072<\/td><td>1024 / 6<\/td><td>有<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote>Gemma 3 27B 的 KV 头是 16，不是 Llama 3.3 70B 的 8；它的 KV cache 反而更大。局部/全局交替省的是“大部分层的窗口”，不是把 KV 头砍到极小。<\/blockquote>\n<h2>6.4 Gemma 4：any-to-any<\/h2>\n<p>Gemma 4 分两条：<\/p>\n<ul><li>\n<strong>E2B / E4B<\/strong>：小尺寸，文本 + 视觉 + 音频。E4B 的文本 42 层、2560 hidden、8 Q/2 KV、131K；视觉塔 16 层/768，音频塔 12 层/1024。\n<\/li><li>\n<strong>12B Unified<\/strong>：48 层、3840 hidden、16/8、FFN 15360、262K、词表 262144；架构标识 <code>Gemma4UnifiedForConditionalGeneration<\/code>，模型卡标 any-to-any。\n<\/ul>\n<p>“Unified”不是“把三个模型拼在一起”，而是把文本、图像、音频 token 放进同一个自回归序列，用同一套 Transformer 层处理。好处是模态交互深；代价是视觉/音频 token 占用上下文，训练数据配比更难。<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>模型<\/th><th>层数<\/th><th>hidden<\/th><th>Q/KV<\/th><th>FFN<\/th><th>上下文<\/th><th>模态<\/th><\/tr><\/thead><tbody><tr><td>Gemma 4 E4B<\/td><td>42<\/td><td>2560<\/td><td>8/2<\/td><td>10240<\/td><td>131072<\/td><td>文/图/音<\/td><\/tr><tr><td>Gemma 4 12B<\/td><td>48<\/td><td>3840<\/td><td>16/8<\/td><td>15360<\/td><td>262144<\/td><td>文/图/音<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>6.5 手算：Gemma 3 27B 的 KV<\/h2>\n<p><span class=\"katex-inline\">L=62<\/span>，<span class=\"katex-inline\">H_{kv}=16<\/span>，<span class=\"katex-inline\">d_{head}=128<\/span>，FP16：<\/p>\n<div class=\"katex-block\">2\\times62\\times16\\times128\\times2\\\\=507{,}904\\ \\text{bytes/token}\\\\\\approx0.484\\ \\text{MiB/token}<\/div>\n<p>128K：<\/p>\n<div class=\"katex-block\">507{,}904\\times131{,}072\\\\=66{,}571{,}926{,}528\\ \\text{bytes}\\\\\\approx62\\ \\text{GiB}<\/div>\n<p>Gemma 3 4B：<span class=\"katex-inline\">34\\times4\\times256<\/span> 维，每 token：<\/p>\n<div class=\"katex-block\">2\\times34\\times4\\times256\\times2=139{,}264\\ \\text{bytes}\\\\\\approx0.133\\ \\text{MiB}<\/div>\n<p>128K 约 17 GiB。<strong>小模型的长上下文也要算账，不能看“4B”就以为免费。<\/strong><\/p>\n<h2>6.6 取舍<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>设计<\/th><th>得到什么<\/th><th>付出什么<\/th><\/tr><\/thead><tbody><tr><td>局部/全局交替<\/td><td>长上下文省计算和 KV<\/td><td>全局层仍是瓶颈；局部窗口可能丢远处细节<\/td><\/tr><tr><td>soft-capping<\/td><td>训练稳定<\/td><td>推理时 logit 动态范围被压，可能影响极端置信度<\/td><\/tr><tr><td>QK-Norm<\/td><td>大 head_dim 稳定<\/td><td>额外归一化开销<\/td><\/tr><tr><td>小尺寸 + 强数据<\/td><td>端侧可跑<\/td><td>容量有限，复杂推理弱于大模型<\/td><\/tr><tr><td>any-to-any<\/td><td>模态交互深<\/td><td>视觉/音频 token 挤占上下文<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>6.7 常见误解<\/h2>\n<ul><li>\n<strong>“Gemma 3 27B 是 27B 激活。”<\/strong> 它是 dense，27B 总参数也是每 token 激活。\n<\/li><li>\n<strong>“局部窗口 1024 就是只能看 1024。”<\/strong> 全局层会跨窗口传递信息；但精确回看远处仍弱于全注意力。\n<\/li><li>\n<strong>“Gemma 4 是 Gemma 3 加一个视觉塔。”<\/strong> 12B Unified 是统一 any-to-any；E4B 是另一条小尺寸结构。\n<\/li><li>\n<strong>“Gemma 都是 Gemma Terms。”<\/strong> Gemma 4 的 12B 模型卡标 Apache 2.0；逐模型核对。\n<\/ul>\n<h2>6.8 自测<\/h2>\n<ol><li>\nGemma 2 的局部/全局比例是多少？Gemma 3 呢？\n<\/li><li>\nQK-Norm 解决什么问题？\n<\/li><li>\nGemma 3 27B 的 KV 头数、head_dim、上下文各是多少？\n<\/li><li>\nGemma 4 E4B 的文本/视觉/音频塔规模各是多少？\n<\/li><li>\n为什么 Gemma 3 27B 的 KV 比 Llama 3.3 70B 还大？\n<\/ol>\n<blockquote>参考答案：1）Gemma 2 约 1:1；Gemma 3 是 5:1（每 6 层 1 层全局）；2）防止大 head_dim 下 attention logits 爆炸，稳定长上下文训练；3）16 KV、128 维、128K；4）文本 42 层/2560，视觉 16 层/768，音频 12 层/1024；5）它 16 个 KV 头，Llama 3.3 70B 只有 8 个，且 head_dim 相同 128。<\/blockquote>\n<h2>6.9 复习锚点<\/h2>\n<ul><li>\nGemma 2：局部/全局 1:1、soft-capping、GQA。\n<\/li><li>\nGemma 3：5:1、QK-Norm、128K、视觉。\n<\/li><li>\nGemma 4：E2B/E4B 小尺寸 any-to-any；12B Unified 48 层/3840/16/8/262K。\n<\/li><li>\n下一章：Phi 的“小模型 + 教科书数据”路线。\n<\/ul>", "kind": "chapter", "title": "第 6 章：Gemma 家族：小模型、局部/全局交替与统一多模态"}, "ch07": {"html": "<div class=\"source-badge\">📖 出处：https://huggingface.co/microsoft<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch06\">第 6 章：Gemma 家族：小模型、局部/全局交替与统一多模态<\/a><\/span><\/div><h1>第 7 章 Phi 与“小模型优先”路线<\/h1>\n<blockquote>难度：入门到中级 · 建议 50 分钟 · 前置：第 6 章<\/blockquote>\n<blockquote>学习目标：能说清 Phi 系列的“数据质量优先”而不是“结构创新优先”；能比较 Phi-4 14B 与 Phi-4-mini 3.8B 的层数、KV、上下文；能手算小模型的显存门槛。<\/blockquote>\n<h2>一句话核心<\/h2>\n<p>Phi 不是靠“更大的 Transformer”取胜，而是靠<strong>教科书级数据 + 小模型 + 长训练<\/strong>。它的结构基本是 Llama 式 decoder-only，真正的差异在数据配比、课程学习和合成数据；这也是为什么 3.8B 的 Phi-4-mini 能在部分任务上接近 14B 模型。<\/p>\n<h2>7.1 时间线<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>时间<\/th><th>模型<\/th><th>规模<\/th><th>关键点<\/th><\/tr><\/thead><tbody><tr><td>2023-06<\/td><td>Phi-1<\/td><td>1.3B<\/td><td>“Textbooks Are All You Need”，代码/教科书数据<\/td><\/tr><tr><td>2023-09<\/td><td>Phi-1.5<\/td><td>1.3B<\/td><td>加入常识与推理数据<\/td><\/tr><tr><td>2023-12<\/td><td>Phi-2<\/td><td>2.7B<\/td><td>小模型 + 精选数据，32 层<\/td><\/tr><tr><td>2024-05<\/td><td>Phi-3 mini<\/td><td>3.8B<\/td><td>32 层、3072、32/32 MHA、4K/128K 两版<\/td><\/tr><tr><td>2024-05<\/td><td>Phi-3 small/medium<\/td><td>7B / 14B<\/td><td>尺寸扩展，GQA<\/td><\/tr><tr><td>2024-12<\/td><td>Phi-4<\/td><td>14B<\/td><td>40 层、5120、40/10 GQA、16K、MIT<\/td><\/tr><tr><td>2025-02<\/td><td>Phi-4-mini<\/td><td>3.8B<\/td><td>32 层、3072、24/8、128K<\/td><\/tr><tr><td>2025<\/td><td>Phi-4-reasoning / mini-reasoning<\/td><td>14B / 3.8B<\/td><td>推理后训练、长思维链<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote>Phi 的“小”是相对 70B/400B 的大模型；它不是微型端侧模型。3.8B 仍然要 8GB 级显存（4-bit 量化后更小）。<\/blockquote>\n<h2>7.2 结构：基本是 Llama 式<\/h2>\n<p>Phi-3/4 用 decoder-only、RMSNorm、SwiGLU、RoPE、GQA。没有 MoE，没有线性注意力，没有多模态（Phi-3.5-vision 另算）。它的“创新”主要在：<\/p>\n<ol><li>\n<strong>数据课程<\/strong>：先教科书，再难题，再指令数据；\n<\/li><li>\n<strong>合成数据<\/strong>：用大模型生成教材、习题、解释；\n<\/li><li>\n<strong>训练时长<\/strong>：小模型训更多 token；\n<\/li><li>\n<strong>后训练<\/strong>：SFT + DPO/GRPO 做推理和指令跟随。\n<\/ol>\n<p>所以读 Phi 的论文，不要只找“新结构”；要看数据表、训练 token 数、过滤规则。<strong>结构是容器，数据是内容。<\/strong><\/p>\n<h2>7.3 代表配置<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>模型<\/th><th>层数<\/th><th>hidden<\/th><th>Q/KV<\/th><th>FFN<\/th><th>上下文<\/th><th>词表<\/th><th>许可证<\/th><\/tr><\/thead><tbody><tr><td>Phi-3 mini 4K<\/td><td>32<\/td><td>3072<\/td><td>32/32<\/td><td>8192<\/td><td>4096<\/td><td>32064<\/td><td>MIT<\/td><\/tr><tr><td>Phi-4<\/td><td>40<\/td><td>5120<\/td><td>40/10<\/td><td>17920<\/td><td>16384<\/td><td>100352<\/td><td>MIT<\/td><\/tr><tr><td>Phi-4-mini<\/td><td>32<\/td><td>3072<\/td><td>24/8<\/td><td>8192<\/td><td>131072<\/td><td>100352<\/td><td>MIT<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote>Phi-3 mini 是 MHA（32 个 KV 头），不是 GQA；Phi-4 才用 10 个 KV 头。不要看到“Phi-4”就以为所有 Phi 都 GQA。<\/blockquote>\n<h2>7.4 手算：Phi-4 与 Phi-4-mini 的显存<\/h2>\n<h3>权重<\/h3>\n<ul><li>\nPhi-4 14B，FP16：<span class=\"katex-inline\">14\\times2=28<\/span> GB；INT4 约 7 GB。\n<\/li><li>\nPhi-4-mini 3.8B，FP16：<span class=\"katex-inline\">3.8\\times2=7.6<\/span> GB；INT4 约 1.9 GB。\n<\/ul>\n<h3>KV（FP16）<\/h3>\n<p>Phi-4：<span class=\"katex-inline\">L=40<\/span>，<span class=\"katex-inline\">H_{kv}=10<\/span>，<span class=\"katex-inline\">d_{head}=128<\/span>：<\/p>\n<div class=\"katex-block\">2\\times40\\times10\\times128\\times2\\\\=204{,}800\\ \\text{bytes/token}\\\\\\approx0.195\\ \\text{MiB/token}<\/div>\n<p>16K：<span class=\"katex-inline\">204{,}800\\times16{,}384\\approx3.2<\/span> GiB。<\/p>\n<p>Phi-4-mini：<span class=\"katex-inline\">L=32<\/span>，<span class=\"katex-inline\">H_{kv}=8<\/span>，<span class=\"katex-inline\">d_{head}=128<\/span>：<\/p>\n<div class=\"katex-block\">2\\times32\\times8\\times128\\times2\\\\=131{,}072\\ \\text{bytes/token}\\\\=0.125\\ \\text{MiB/token}<\/div>\n<p>128K：<span class=\"katex-inline\">131{,}072\\times131{,}072\\approx16<\/span> GiB。<\/p>\n<blockquote>3.8B 模型在 128K 上下文下，KV 约 16 GiB，已经和 14B 权重（FP16 28GB）同一量级。<strong>长上下文不是小模型的免费赠品。<\/strong><\/blockquote>\n<h2>7.5 小模型的取舍<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>设计<\/th><th>得到什么<\/th><th>付出什么<\/th><\/tr><\/thead><tbody><tr><td>小尺寸<\/td><td>端侧、低延迟、便宜<\/td><td>容量有限，复杂推理弱<\/td><\/tr><tr><td>精选/合成数据<\/td><td>单位参数效率高<\/td><td>数据偏差、泛化风险<\/td><\/tr><tr><td>长训练<\/td><td>小模型也能打<\/td><td>训练成本不一定低<\/td><\/tr><tr><td>MHA（Phi-3 mini）<\/td><td>表达简单、实现成熟<\/td><td>KV 比 GQA 大 4 倍<\/td><\/tr><tr><td>128K（Phi-4-mini）<\/td><td>长文档<\/td><td>KV 显存大，注意力计算涨<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>7.6 怎么选 Phi<\/h2>\n<ul><li>\n<strong>单卡 8GB，跑 4-bit<\/strong>：Phi-4-mini 3.8B 是合理起点；上下文别默认 128K，按实际需求开。\n<\/li><li>\n<strong>单卡 24GB，FP16<\/strong>：Phi-4 14B 可跑，16K 上下文；长上下文要量化 KV。\n<\/li><li>\n<strong>要商用<\/strong>：MIT 最宽松；仍要读模型卡的数据/安全限制。\n<\/li><li>\n<strong>要最强推理<\/strong>：Phi-4-reasoning 是后训练变体，不是新架构；不要期待结构差异。\n<\/ul>\n<h2>7.7 常见误解<\/h2>\n<ul><li>\n<strong>“Phi 是端侧 1B 模型。”<\/strong> Phi-1/1.5 是 1.3B，但 Phi-4 是 14B；系列跨度很大。\n<\/li><li>\n<strong>“Phi-4 用了 MoE。”<\/strong> 没有，dense。\n<\/li><li>\n<strong>“Phi-4-mini 是 Phi-4 的量化版。”<\/strong> 不是，它是独立的小模型，层数/宽度/头数都不同。\n<\/li><li>\n<strong>“小模型 + 128K = 便宜长上下文。”<\/strong> KV 账不认模型大小，只认层数、KV 头、head_dim、序列长度。\n<\/ul>\n<h2>7.8 自测<\/h2>\n<ol><li>\nPhi 系列的结构创新主要是什么？数据创新是什么？\n<\/li><li>\nPhi-4 和 Phi-4-mini 的层数、hidden、Q/KV 各是多少？\n<\/li><li>\nPhi-3 mini 为什么 KV 比 Phi-4 大？\n<\/li><li>\nPhi-4-mini 在 128K 下单序列 KV 约多少 GiB？\n<\/li><li>\n什么场景选 Phi-4，什么场景选 Phi-4-mini？\n<\/ol>\n<blockquote>参考答案：1）结构基本是 Llama 式；数据课程/合成教科书数据是核心；2）Phi-4 40/5120/40/10，Phi-4-mini 32/3072/24/8；3）Phi-3 mini 是 32 个 KV 头的 MHA，Phi-4 是 10 个 KV 头的 GQA；4）约 16 GiB；5）24GB 单卡/16K 选 Phi-4；8GB 端侧/长上下文但可量化选 Phi-4-mini。<\/blockquote>\n<h2>7.9 复习锚点<\/h2>\n<ul><li>\nPhi = 小模型 + 教科书数据 + 长训练 + 后训练。\n<\/li><li>\nPhi-3 mini：32 层、3072、32/32 MHA。\n<\/li><li>\nPhi-4：40 层、5120、40/10、16K。\n<\/li><li>\nPhi-4-mini：32 层、3072、24/8、128K。\n<\/li><li>\n下一章：北美其他开放权重家族，从 Falcon 到 OLMo。\n<\/ul>", "kind": "chapter", "title": "第 7 章：Phi 与“小模型优先”路线"}, "ch08": {"html": "<div class=\"source-badge\">📖 出处：https://huggingface.co/models<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 3 章：Llama 家族：decoder-only 的行业基线<\/a><\/span><\/div><h1>第 8 章 北美开放权重：Falcon、BLOOM、OLMo、DBRX 与“非 Llama”路线<\/h1>\n<blockquote>难度：中级 · 建议 70 分钟 · 前置：第 7 章<\/blockquote>\n<blockquote>学习目标：能列出北美主要开放权重家族及其架构差异；能区分“模型开放”“数据开放”“许可证开放”；能用 KV 公式比较 BLOOM、MPT、Falcon 的部署成本。<\/blockquote>\n<h2>一句话核心<\/h2>\n<p>北美开放权重不是“Llama 的复制品”。Falcon 走 MQA + 早期多语言，BLOOM 走超大 dense + 多语言，MPT 走 ALiBi 长上下文，OLMo 走“数据/代码全开放”，DBRX/Arctic 走 MoE，Command R 走非商用许可，Grok-1 走超大 MoE。它们共同构成“Llama 之外的对照组”。<\/p>\n<h2>8.1 家族速览<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>家族<\/th><th>代表<\/th><th>结构关键词<\/th><th>许可证<\/th><th>备注<\/th><\/tr><\/thead><tbody><tr><td>Falcon<\/td><td>7B / 40B / 180B / Falcon3 / H1<\/td><td>MQA、多语言、Falcon-H1 混合<\/td><td>TII Falcon License<\/td><td>阿联酋 TII<\/td><\/tr><tr><td>MPT<\/td><td>7B / 30B<\/td><td>ALiBi、无位置 embedding、长上下文<\/td><td>Apache 2.0<\/td><td>MosaicML<\/td><\/tr><tr><td>BLOOM<\/td><td>176B<\/td><td>70 层、14336、112 头、ALiBi、多语言<\/td><td>BigScience RAIL<\/td><td>协作项目<\/td><\/tr><tr><td>GPT-NeoX<\/td><td>20B<\/td><td>44 层、6144、64 头、RoPE<\/td><td>Apache 2.0<\/td><td>EleutherAI<\/td><\/tr><tr><td>Pythia<\/td><td>70M–12B<\/td><td>小到大一套、公开训练顺序<\/td><td>Apache 2.0<\/td><td>可复现研究<\/td><\/tr><tr><td>OLMo<\/td><td>1B–32B<\/td><td>全开放数据/代码/训练<\/td><td>Apache 2.0<\/td><td>AI2<\/td><\/tr><tr><td>DCLM<\/td><td>7B<\/td><td>公开数据筛选、dense<\/td><td>自定义/开放<\/td><td>数据研究<\/td><\/tr><tr><td>Nemotron<\/td><td>8B–70B / Nemotron-H<\/td><td>dense + hybrid Mamba<\/td><td>NVIDIA 许可<\/td><td>英伟达<\/td><\/tr><tr><td>Granite<\/td><td>3.x/4.x<\/td><td>dense + hybrid、企业向<\/td><td>Apache 2.0<\/td><td>IBM<\/td><\/tr><tr><td>DBRX<\/td><td>132B<\/td><td>16 专家 top-4、36B 激活<\/td><td>Databricks License<\/td><td>企业 MoE<\/td><\/tr><tr><td>Arctic<\/td><td>480B<\/td><td>128 专家 top-2、17B 激活<\/td><td>Apache 2.0<\/td><td>Snowflake<\/td><\/tr><tr><td>Command R<\/td><td>35B / R+ 104B<\/td><td>dense、128K、工具调用<\/td><td>CC-BY-NC<\/td><td>Cohere<\/td><\/tr><tr><td>Grok-1<\/td><td>314B<\/td><td>8 专家 top-2、8K<\/td><td>Apache 2.0<\/td><td>xAI 开放权重<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote>这张表是“代表”，不是“全部”。同一家族还有大量尺寸、微调、量化版本；附录给更完整的索引。<\/blockquote>\n<h2>8.2 Falcon：MQA 与多语言<\/h2>\n<p>Falcon 7B 的结构很特别：32 层、4544 hidden、71 个 Q 头，但 K/V 头远少于 Q 头（MQA 思路）。这让 KV cache 很小，适合高并发；代价是 K/V 表达被压缩，长上下文精细检索弱。<\/p>\n<p>Falcon 40B：60 层、8192 hidden、128 个 Q 头；Falcon 180B：80 层、14848 hidden、232 个 Q 头。Falcon3 系列把尺寸拉到 1B–40B，改用 GQA、RoPE、128K 上下文；Falcon-H1 则是 Mamba/Transformer 混合，44 层、3072 hidden、12 Q/2 KV、262K。<\/p>\n<h2>8.3 BLOOM：超大 dense 的历史样本<\/h2>\n<p>BLOOM 176B：70 层、14336 hidden、112 个 Q 头、2048 上下文、ALiBi 位置偏置、46 种语言。它是 2022 年最大的开放多语言模型之一，训练数据/代码/协作过程都公开，许可证是 RAIL（有使用限制）。<\/p>\n<p>KV 账（MHA，head_dim 128，FP16）：<\/p>\n<div class=\"katex-block\">2\\times70\\times112\\times128\\times2\\\\=4{,}014{,}080\\ \\text{bytes/token}\\\\\\approx3.83\\ \\text{MiB/token}<\/div>\n<p>2048 上下文约 7.7 GiB。对 176B 权重（FP16 约 352GB）来说，KV 不是最大问题；权重才是。<\/p>\n<h2>8.4 MPT：ALiBi 长上下文<\/h2>\n<p>MPT-7B：32 层、4096 hidden、32 个 Q 头、2048 上下文；MPT-30B：48 层、7168 hidden、64 个 Q 头、8K。它用 ALiBi 而不是 RoPE：给注意力头加一个与距离成线性的偏置，训练短、外推长。<\/p>\n<p>MPT 的工程意义大于架构意义：它是早期用开源训练栈（Composer）大规模训练的代表，证明“不用 RoPE 也能做长上下文”。<\/p>\n<h2>8.5 OLMo / Pythia / DCLM：开放数据三兄弟<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>模型<\/th><th>开放什么<\/th><th>架构<\/th><th>为什么重要<\/th><\/tr><\/thead><tbody><tr><td>OLMo 2 7B<\/td><td>数据、代码、训练日志、checkpoint<\/td><td>32 层、4096、32/32、4K<\/td><td>真正可复现的训练<\/td><\/tr><tr><td>OLMo 3 32B<\/td><td>同上，规模更大<\/td><td>64 层、5120、40/8、64K YaRN<\/td><td>开放模型的质量上限<\/td><\/tr><tr><td>Pythia 12B<\/td><td>训练顺序、数据去重版<\/td><td>36 层、5120、40 头、2K<\/td><td>研究缩放/记忆<\/td><\/tr><tr><td>DCLM 7B<\/td><td>数据筛选管线<\/td><td>32 层、4096、32 头、2K/8K<\/td><td>数据质量研究<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote>如果你要研究“数据配比对模型的影响”，OLMo/Pythia/DCLM 比 Llama 更有价值；Llama 只给权重，不给数据。<\/blockquote>\n<h2>8.6 DBRX / Arctic / Grok-1：MoE 的三种写法<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>模型<\/th><th>总参/激活<\/th><th>层数<\/th><th>hidden<\/th><th>专家<\/th><th>top-k<\/th><th>上下文<\/th><\/tr><\/thead><tbody><tr><td>DBRX<\/td><td>132B / 36B<\/td><td>40<\/td><td>6144<\/td><td>16<\/td><td>4<\/td><td>32K<\/td><\/tr><tr><td>Arctic<\/td><td>480B / 17B<\/td><td>80?<\/td><td>7168?<\/td><td>128<\/td><td>2<\/td><td>32K<\/td><\/tr><tr><td>Grok-1<\/td><td>314B / ?<\/td><td>64<\/td><td>6144<\/td><td>8<\/td><td>2<\/td><td>8K<\/td><\/tr><\/tbody><\/table><\/div>\n<p>DBRX 是“少专家、宽专家、top-4”，偏企业单机/多机；Arctic 是“多专家、top-2”，激活极低但总参数大；Grok-1 是“8 专家 top-2”，更接近早期 Mixtral 思路。三者的路由策略不同，不能只看“都是 MoE”。<\/p>\n<blockquote>Arctic 的部分层数/宽度在公开模型卡里写法不一，表中标 <code>?<\/code> 的字段不要当精确值；读具体 config 为准。<\/blockquote>\n<h2>8.7 Command R 与许可证陷阱<\/h2>\n<p>Command R 35B、Command R+ 104B 是 Cohere 的开放权重模型，支持 128K、工具调用、RAG。它们的许可证是 CC-BY-NC 4.0：<strong>可以研究、可以改、不能商用<\/strong>。很多团队下载后直接上线，违反许可。<\/p>\n<blockquote>选型时先问“商用吗？”再问“多大？”。许可证错，模型再好也不能用。<\/blockquote>\n<h2>8.8 手算：BLOOM vs MPT 的 KV<\/h2>\n<p>MPT-7B：32 层、32 KV、head_dim 128、FP16：<\/p>\n<div class=\"katex-block\">2\\times32\\times32\\times128\\times2=524{,}288\\ \\text{bytes/token}=0.5\\ \\text{MiB/token}<\/div>\n<p>2048 上下文约 1 GiB。<\/p>\n<p>BLOOM 176B 每 token 3.83 MiB，是 MPT 的 7.6 倍。<strong>大 dense + 多 KV 头 = KV 灾难；这就是 GQA/MQA 后来成为默认的原因。<\/strong><\/p>\n<h2>8.9 常见误解<\/h2>\n<ul><li>\n<strong>“BLOOM 是开源模型，所以能随便商用。”<\/strong> RAIL 有使用限制，不是 Apache。\n<\/li><li>\n<strong>“MPT 用 ALiBi 就一定比 RoPE 长。”<\/strong> 外推行为不同，实际长上下文还要看训练长度和数据。\n<\/li><li>\n<strong>“OLMo 只是另一个 7B。”<\/strong> 它的价值在数据/代码/日志全开放，架构不是重点。\n<\/li><li>\n<strong>“Command R 是 Apache。”<\/strong> 它是 CC-BY-NC，不能商用。\n<\/ul>\n<h2>8.10 自测<\/h2>\n<ol><li>\nFalcon 7B 的 Q 头数和 KV 策略有什么特别？\n<\/li><li>\nBLOOM 176B 的层数、hidden、头数、上下文各是多少？\n<\/li><li>\nOLMo 与 Llama 最大的差别是什么？\n<\/li><li>\nDBRX、Arctic、Grok-1 的专家数和 top-k 各是多少？\n<\/li><li>\nCommand R+ 的许可证是什么？商用需要做什么？\n<\/ol>\n<blockquote>参考答案：1）71 个 Q 头，K/V 头远少于 Q（MQA 思路）；2）70 层、14336、112 头、2048；3）OLMo 开放数据/代码/训练日志，Llama 只开放权重；4）DBRX 16/top-4，Arctic 128/top-2，Grok-1 8/top-2；5）CC-BY-NC 4.0，商用需另获授权。<\/blockquote>\n<h2>8.11 复习锚点<\/h2>\n<ul><li>\nFalcon：MQA、多语言、Falcon-H1 混合。\n<\/li><li>\nBLOOM：70/14336/112/2048、RAIL。\n<\/li><li>\nMPT：ALiBi、长上下文。\n<\/li><li>\nOLMo/Pythia/DCLM：开放数据。\n<\/li><li>\nDBRX/Arctic/Grok-1：MoE 三种路由。\n<\/li><li>\nCommand R：非商用许可。\n<\/li><li>\n下一章：中国开放权重，从 GLM 到 Kimi、MiniMax、InternLM。\n<\/ul>", "kind": "chapter", "title": "第 8 章：北美开放权重：Falcon、BLOOM、OLMo、DBRX 与“非 Llama”路线"}, "ch09": {"html": "<div class=\"source-badge\">📖 出处：https://huggingface.co/models<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch04\">第 4 章：Qwen 家族：从 0.5B 到 2.4T-A95B 的缩放路线<\/a><\/span><\/div><h1>第 9 章 中国开放权重：GLM、Kimi、MiniMax、InternLM 与“多路线并行”<\/h1>\n<blockquote>难度：中级 · 建议 75 分钟 · 前置：第 8 章<\/blockquote>\n<blockquote>学习目标：能列出中国主要开放权重家族；能区分 dense、MoE、线性/稀疏注意力的组合；能读懂 GLM/Kimi/MiniMax/Intern-S2 的 config 字段；能判断许可证不是统一的 Apache。<\/blockquote>\n<h2>一句话核心<\/h2>\n<p>中国开放权重不是“一家一个 Llama 复制品”。GLM 走 MoE + DSA 稀疏注意力，Kimi 走线性注意力 + 超大专家数，MiniMax 走稀疏 MoE + 多模态，InternLM 走 Qwen3.5 MoE 衍生 + 多模态，MiniCPM 走小尺寸端侧，Step/ERNIE/Ling/MiMo 各自有独立的混合/路由设计。<\/p>\n<h2>9.1 家族速览<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>家族<\/th><th>代表<\/th><th>结构关键词<\/th><th>许可证<\/th><th>备注<\/th><\/tr><\/thead><tbody><tr><td>GLM<\/td><td>GLM-5.3 / 5.3-Flash<\/td><td>MoE + DSA、1M、64/64 MHA<\/td><td>自定义<\/td><td>智谱/Z.ai<\/td><\/tr><tr><td>Kimi<\/td><td>K2 / K2.5 / K3<\/td><td>线性注意力 + MoE、896 专家、1M<\/td><td>自定义<\/td><td>月之暗面<\/td><\/tr><tr><td>MiniMax<\/td><td>M1 / M2 / M3<\/td><td>稀疏 MoE、4 KV、1M、视觉<\/td><td>自定义<\/td><td>MiniMax<\/td><\/tr><tr><td>InternLM<\/td><td>InternLM 2.5 / Intern-S2<\/td><td>Qwen3.5 MoE 衍生、多模态<\/td><td>Apache 2.0<\/td><td>上海 AI Lab<\/td><\/tr><tr><td>MiniCPM<\/td><td>MiniCPM5 / V 4.7 / o 4.5<\/td><td>小尺寸 dense、端侧、多模态<\/td><td>Apache 2.0<\/td><td>OpenBMB<\/td><\/tr><tr><td>Baichuan<\/td><td>Baichuan 2 / M1 / M2 / Omni<\/td><td>dense、医疗/全模态<\/td><td>自定义/Apache<\/td><td>百川<\/td><\/tr><tr><td>Yi<\/td><td>Yi 6B/9B/34B / 200K<\/td><td>dense、长上下文<\/td><td>Apache 2.0<\/td><td>零一万物<\/td><\/tr><tr><td>Step<\/td><td>Step-5-Preview<\/td><td>MoE、1M、视觉感知编码器<\/td><td>自定义<\/td><td>阶跃星辰<\/td><\/tr><tr><td>ERNIE<\/td><td>ERNIE 4.5 300B-A47B / 5.5 Flash<\/td><td>MoE、Paddle 生态<\/td><td>Apache 2.0<\/td><td>百度<\/td><\/tr><tr><td>Ling<\/td><td>Ling 3.0/3.1<\/td><td>混合 MoE、512 专家<\/td><td>MIT<\/td><td>蚂蚁 inclusionAI<\/td><\/tr><tr><td>MiMo<\/td><td>MiMo-V2.6<\/td><td>MoE、1M、384 专家<\/td><td>MIT<\/td><td>小米<\/td><\/tr><tr><td>dots<\/td><td>dots.llm1<\/td><td>MoE、128 专家 + 2 共享<\/td><td>自定义<\/td><td>小红书<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote>“中国开放权重”不是地理标签，而是发布主体在中国、权重可从 Hugging Face 等公开渠道下载的模型。许可证逐家不同，不能一概说“Apache”。<\/blockquote>\n<h2>9.2 GLM：MoE + DSA<\/h2>\n<p>GLM-5.3 的 config：<\/p>\n<ul><li>\n<code>model_type: glm_moe_dsa<\/code>，说明它是 MoE + DSA（稀疏注意力）组合；\n<\/li><li>\n78 层、6144 hidden、64 Q/64 KV（MHA）、256 路由专家 + 1 共享、top-8、专家宽度 2048、1M 上下文、词表 154880；\n<\/li><li>\nFlash 版 45 层、4096 hidden、288 专家、top-8、1M。\n<\/ul>\n<p>64 个 KV 头 + 1M 上下文，如果按稠密 KV 算会爆炸；DSA 的作用是对注意力做稀疏化/压缩，让长上下文可落地。具体稀疏模式在 <code>GlmMoeDsaForCausalLM<\/code> 实现里，模型卡没有逐行展开；本册只讲设计意图：<strong>不是所有 token 都做全量注意力<\/strong>。<\/p>\n<h2>9.3 Kimi：线性注意力 + 896 专家<\/h2>\n<p>Kimi K3 的 config：<\/p>\n<ul><li>\n93 层、7168 hidden、96 Q/96 KV、896 专家、1M 上下文、词表 163840；\n<\/li><li>\n架构标识 <code>KimiLinearForCausalLM<\/code>；\n<\/li><li>\n带视觉塔，是图文模型。\n<\/ul>\n<p>它是“线性/混合注意力 + 超大 MoE”的组合。96 个 KV 头看起来像 MHA，但如果用了线性注意力，KV 的增长方式不再按 <span class=\"katex-inline\">O(n)<\/span> 存完整 cache；具体层类型要看代码。K2 系列则是 1T 总参数 / 32B 激活级别的 MoE，K3 把专家数推到 896。<\/p>\n<p><strong>不要用“Kimi 是 Llama 套壳”解释它。<\/strong> 它的注意力实现和路由规模都和 Llama 不同。<\/p>\n<h2>9.4 MiniMax：4 个 KV 头的 1M 模型<\/h2>\n<p>MiniMax-M3：<\/p>\n<ul><li>\n60 层、6144 hidden、64 Q/4 KV、top-4 + 1 共享专家、1M 上下文、词表 200064；\n<\/li><li>\n视觉塔 32 层、1280 hidden、16 头；\n<\/li><li>\n架构 <code>MiniMaxM3SparseForConditionalGeneration<\/code>。\n<\/ul>\n<p>如果按稠密 KV 估算，60 层 × 4 KV × 128 维 × 2 字节 × 2：<\/p>\n<div class=\"katex-block\">2\\times60\\times4\\times128\\times2\\\\=245{,}760\\ \\text{bytes/token}\\\\\\approx0.234\\ \\text{MiB/token}<\/div>\n<p>1M token 约 234 GiB。<strong>1M 上下文不可能靠朴素 KV 硬存<\/strong>；MiniMax 用稀疏注意力/压缩来降低实际占用。这个数字不是“它真的存了 234 GiB”，而是“如果不做稀疏化，代价会是这样”。<\/p>\n<h2>9.5 InternLM / Intern-S2：Qwen3.5 MoE 衍生<\/h2>\n<p>Intern-S2-397B 的 config：<\/p>\n<ul><li>\n60 层、4096 hidden、32 Q/2 KV、512 专家、top-10、专家宽度 1024、262K、词表 251392；\n<\/li><li>\n<code>model_type: qwen3_5_moe_text<\/code>，架构 <code>Qwen3_5MoeForConditionalGeneration<\/code>；\n<\/li><li>\n视觉塔 1152 hidden。\n<\/ul>\n<p>它说明一个事实：<strong>开放模型之间会互相复用骨架<\/strong>。Intern-S2 不是从零写一个新 Transformer，而是在 Qwen3.5 MoE 骨架上做多模态/数据/后训练。读 config 时看到 <code>qwen3_5_moe<\/code>，不要惊讶；这不等于“没有创新”，创新在数据、视觉连接器、训练配方。<\/p>\n<h2>9.6 MiniCPM：小尺寸端侧<\/h2>\n<p>MiniCPM5-2B：<\/p>\n<ul><li>\n42 层、2048 hidden、16 Q/2 KV、FFN 6144、128K、词表 130560；\n<\/li><li>\n<code>model_type: llama<\/code>，<code>LlamaForCausalLM<\/code>；\n<\/li><li>\nApache 2.0。\n<\/ul>\n<p>它是典型的“小 dense + 长上下文 + 端侧优化”。MiniCPM-V 4.7 35B-A3B 则是多模态 MoE；MiniCPM-o 4.5 是 any-to-any。小尺寸家族也会分叉，不要以为 MiniCPM 只有 2B。<\/p>\n<h2>9.7 Step / ERNIE / Ling / MiMo / dots<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>模型<\/th><th>层数<\/th><th>hidden<\/th><th>Q/KV<\/th><th>专家<\/th><th>top-k<\/th><th>上下文<\/th><th>架构<\/th><\/tr><\/thead><tbody><tr><td>Step-5-Preview<\/td><td>92<\/td><td>4096<\/td><td>64/?<\/td><td>MoE（数量未在 config 展开）<\/td><td>8<\/td><td>1M<\/td><td><code>Step5ForCausalLM<\/code> + 感知编码器<\/td><\/tr><tr><td>ERNIE 4.5 300B-A47B<\/td><td>54<\/td><td>8192<\/td><td>64/8<\/td><td>MoE（300B 总/47B 激活）<\/td><td>—<\/td><td>128K<\/td><td><code>Ernie4_5_MoeForCausalLM<\/code><\/td><\/tr><tr><td>Ling 3.1 flash<\/td><td>72<\/td><td>4096<\/td><td>64/64<\/td><td>512<\/td><td>8<\/td><td>262K<\/td><td><code>BailingMoeV3<\/code> 混合<\/td><\/tr><tr><td>MiMo-V2.6 Pro<\/td><td>70<\/td><td>6144<\/td><td>128/8<\/td><td>384<\/td><td>8<\/td><td>1M<\/td><td><code>MiMoV2<\/code><\/td><\/tr><tr><td>dots.llm1<\/td><td>62<\/td><td>4096<\/td><td>32/32<\/td><td>128 + 2 共享<\/td><td>6<\/td><td>32K<\/td><td><code>Dots1<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote>表中 <code>—<\/code> 表示模型卡/config 没有给出可靠数字，不硬填。Step-5 的专家总数、ERNIE 的 top-k 在公开 config 里没有直接字段，正文不编造。<\/blockquote>\n<h2>9.8 许可证：别默认 Apache<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>模型<\/th><th>许可证标签<\/th><th>商用判断<\/th><\/tr><\/thead><tbody><tr><td>Intern-S2 / MiniCPM5 / ERNIE 4.5 / Yi<\/td><td>Apache 2.0<\/td><td>可商用，保留声明<\/td><\/tr><tr><td>Ling 3.1 / MiMo-V2.6<\/td><td>MIT<\/td><td>可商用，保留声明<\/td><\/tr><tr><td>GLM-5.3 / Kimi K3 / MiniMax M3 / Step-5 / dots<\/td><td><code>other<\/code><\/td><td>逐条读模型卡，可能限制商用/再分发<\/td><\/tr><tr><td>Baichuan 部分<\/td><td>自定义/Apache<\/td><td>逐模型读<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote><code>license: other<\/code> 不是“没有许可证”，而是“许可证不在标准 SPDX 列表里”。必须打开模型卡读全文。<\/blockquote>\n<h2>9.9 自测<\/h2>\n<ol><li>\nGLM-5.3 的层数、hidden、Q/KV、专家数、top-k、上下文各是多少？\n<\/li><li>\nKimi K3 为什么不能按“Llama 套壳”解释？\n<\/li><li>\nMiniMax M3 的 4 个 KV 头 + 1M 上下文，朴素 KV 约多少？这说明什么？\n<\/li><li>\nIntern-S2 的 <code>model_type<\/code> 是什么？这说明了什么？\n<\/li><li>\n列出至少三个“中国开放权重但许可证不是 Apache”的模型。\n<\/ol>\n<blockquote>参考答案：1）78/6144/64/64/256/top-8/1M；2）<code>KimiLinearForCausalLM<\/code> 线性/混合注意力 + 896 专家，和 Llama 的 MHA/GQA 不同；3）约 234 GiB，说明 1M 必须稀疏/压缩；4）<code>qwen3_5_moe_text<\/code>，说明复用 Qwen3.5 MoE 骨架；5）GLM-5.3、Kimi K3、MiniMax M3、Step-5、dots 等。<\/blockquote>\n<h2>9.10 复习锚点<\/h2>\n<ul><li>\nGLM：MoE + DSA，78 层/6144/64/64/256/top-8/1M。\n<\/li><li>\nKimi：线性 + 896 专家，93 层/7168/96/96/1M。\n<\/li><li>\nMiniMax：60 层/6144/64/4/top-4+1/1M。\n<\/li><li>\nIntern-S2：Qwen3.5 MoE 衍生，60/4096/32/2/512/top-10/262K。\n<\/li><li>\nMiniCPM：2B dense Llama 架构，42/2048/16/2/128K。\n<\/li><li>\n许可证：Apache/MIT/自定义三分，不统一。\n<\/li><li>\n下一章：非 Transformer 路线，RWKV、Mamba、Jamba、Falcon-H1、Kimi Linear、Qwen3-Next。\n<\/ul>", "kind": "chapter", "title": "第 9 章：中国开放权重：GLM、Kimi、MiniMax、InternLM 与“多路线并行”"}, "ch10": {"html": "<div class=\"source-badge\">📖 出处：https://huggingface.co/models<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch09\">第 9 章：中国开放权重：GLM、Kimi、MiniMax、InternLM 与“多路线并行”<\/a><\/span><\/div><h1>第 10 章 非 Transformer：RWKV、Mamba、Jamba 与混合注意力<\/h1>\n<blockquote>难度：中高 · 建议 80 分钟 · 前置：第 3 章、第 9 章<\/blockquote>\n<blockquote>学习目标：能区分线性注意力、状态空间模型（SSM）和混合架构；能写出 SSM 的递归式；能说清“线性复杂度”换来了什么、失去了什么；能识别 Kimi Linear、Qwen3-Next、Falcon-H1 的混合设计。<\/blockquote>\n<h2>一句话核心<\/h2>\n<p>Transformer 的注意力是“每个 token 和前面所有 token 两两算”，复杂度 <span class=\"katex-inline\">O(n^2)<\/span>、KV cache 随长度线性涨。非 Transformer 路线用<strong>递归状态<\/strong>或<strong>线性核<\/strong>把复杂度降到 <span class=\"katex-inline\">O(n)<\/span>，但把“精确回看任意位置”压缩进一个固定大小的状态。混合架构用少量全注意力层补回精确检索。<\/p>\n<h2>10.1 三条路线<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>路线<\/th><th>代表<\/th><th>核心机制<\/th><th>复杂度<\/th><\/tr><\/thead><tbody><tr><td>线性注意力 / RNN 化<\/td><td>RWKV、Kimi Linear、Qwen3-Next<\/td><td>用递归状态或核函数替代 softmax 注意力<\/td><td><span class=\"katex-inline\">O(n)<\/span><\/td><\/tr><tr><td>状态空间模型 SSM<\/td><td>Mamba、Mamba-2、Falcon-H1<\/td><td>连续状态递推，选择性扫描<\/td><td><span class=\"katex-inline\">O(n)<\/span><\/td><\/tr><tr><td>混合<\/td><td>Jamba、Griffin、RecurrentGemma、Falcon-H1、Kimi K3、Qwen3-Next<\/td><td>线性层 + 少量全注意力层<\/td><td>接近 <span class=\"katex-inline\">O(n)<\/span>，局部 <span class=\"katex-inline\">O(n^2)<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote>“非 Transformer”不是“没有 Transformer 层”。Jamba、Falcon-H1、Kimi K3 都保留了一部分注意力；准确说法是“混合架构”。<\/blockquote>\n<h2>10.2 SSM 的递推式<\/h2>\n<p>一个最简状态空间层：<\/p>\n<div class=\"katex-block\">h_t = A h_{t-1} + B x_t<\/div>\n<div class=\"katex-block\">y_t = C h_t<\/div>\n<p><span class=\"katex-inline\">h_t<\/span> 是固定维度的状态，<span class=\"katex-inline\">x_t<\/span> 是当前 token 的输入。每来一个 token，只做一次矩阵乘和加法，不保存前面所有 token 的 K/V。序列长度 <span class=\"katex-inline\">n<\/span> 的计算量是 <span class=\"katex-inline\">O(n)<\/span>，显存是 <span class=\"katex-inline\">O(1)<\/span>（相对长度）。<\/p>\n<p>Mamba 的关键是“选择性”：<span class=\"katex-inline\">B<\/span>、<span class=\"katex-inline\">C<\/span>、<span class=\"katex-inline\">\\Delta<\/span> 由输入动态决定，让模型能选择记住/忘记什么。Mamba-2 把选择性 SSM 写成更适合 GPU 的矩阵形式。<\/p>\n<p><strong>代价<\/strong>：状态维度固定，长序列的细节会被压缩。需要精确查找某个早期 token 时，SSM 不如全注意力。<\/p>\n<h2>10.3 RWKV：RNN 化 Transformer<\/h2>\n<p>RWKV 把 Transformer 的注意力拆成两个模块：<\/p>\n<ul><li>\n<strong>time-mix<\/strong>：沿时间轴混合历史信息，递归更新；\n<\/li><li>\n<strong>channel-mix<\/strong>：沿特征维混合，类似 FFN。\n<\/ul>\n<p>它的推理可以像 RNN 一样逐 token 递推，训练又能并行。RWKV-4/5/6/7 逐步改进数值稳定性和状态容量；RWKV-7 引入更灵活的动态状态。<\/p>\n<p>RWKV 的优势是<strong>常数显存、长序列推理<\/strong>；劣势是状态容量有限，复杂检索/长程依赖不如全注意力。<\/p>\n<h2>10.4 Mamba / Jamba / Griffin / xLSTM<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>模型<\/th><th>机制<\/th><th>规模<\/th><th>上下文<\/th><th>备注<\/th><\/tr><\/thead><tbody><tr><td>Mamba<\/td><td>选择性 SSM<\/td><td>130M–2.7B / 7B 级<\/td><td>视版本<\/td><td>纯 SSM<\/td><\/tr><tr><td>Mamba-2<\/td><td>结构化 SSM + GPU 优化<\/td><td>130M–?<\/td><td>视版本<\/td><td>更快<\/td><\/tr><tr><td>Jamba<\/td><td>Transformer + Mamba 混合，比例约 1:7?<\/td><td>52B 总/12B 激活<\/td><td>256K<\/td><td>AI21<\/td><\/tr><tr><td>Griffin<\/td><td>RG-LRU + 局部注意力<\/td><td>2B/9B（RecurrentGemma）<\/td><td>视版本<\/td><td>DeepMind<\/td><\/tr><tr><td>xLSTM<\/td><td>指数门控 + 矩阵记忆<\/td><td>7B 级<\/td><td>视版本<\/td><td>2024<\/td><\/tr><tr><td>Falcon-H1<\/td><td>Mamba/Transformer 混合<\/td><td>7B/34B?<\/td><td>262K<\/td><td>TII<\/td><\/tr><tr><td>Kimi Linear<\/td><td>KDA 线性注意力 + 少量全注意力<\/td><td>93 层/7168<\/td><td>1M<\/td><td>Kimi K3<\/td><\/tr><tr><td>Qwen3-Next<\/td><td>Gated DeltaNet + Gated Attention<\/td><td>80B-A3B<\/td><td>262K<\/td><td>阿里<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote>Jamba 的混合比例在不同资料里有 1:7、1:3 等说法；读具体模型卡/论文，不要背一个固定比例。本表只标“混合”。<\/blockquote>\n<h2>10.5 Kimi Linear 与 Qwen3-Next<\/h2>\n<h3>Kimi K3<\/h3>\n<p>93 层、7168 hidden、96 Q/96 KV、896 专家、1M 上下文，架构 <code>KimiLinearForCausalLM<\/code>。它不是“每层都全注意力”，而是把线性注意力（KDA，Kimi Delta Attention）和少量全注意力层混合。线性层负责长序列的常数显存，全注意力层负责精确检索。<\/p>\n<h3>Qwen3-Next<\/h3>\n<p>48 层、2048 hidden、16 Q/2 KV、512 专家、top-10、262K。它用 Gated DeltaNet（线性注意力） + Gated Attention 的混合；大部分层是线性，少量层是全注意力。它的 80B 总参数 / 3B 激活，是“线性 + MoE”的组合。<\/p>\n<blockquote>这两个模型说明 2025–2026 的趋势：<strong>不是纯线性替代 Transformer，而是混合<\/strong>。纯线性在长序列便宜，但精确回看和 in-context learning 弱；全注意力强，但长序列贵。<\/blockquote>\n<h2>10.6 手算：注意力 vs 状态<\/h2>\n<p>假设序列长度 <span class=\"katex-inline\">n=131{,}072<\/span>，hidden <span class=\"katex-inline\">d=4096<\/span>，FP16。<\/p>\n<h3>全注意力<\/h3>\n<p>注意力分数矩阵大小 <span class=\"katex-inline\">n\\times n<\/span>，即使不存完整矩阵，计算也要 <span class=\"katex-inline\">O(n^2 d)<\/span>。KV cache 每层约 <span class=\"katex-inline\">2n d<\/span> 字节（MHA 近似），32 层就是：<\/p>\n<div class=\"katex-block\">2\\times32\\times131{,}072\\times4096\\times2\\\\\\approx 68.7\\ \\tex
