-&gt; C[&quot;每 128 个压 1 条：约 7812 条&quot;]\n  C --&gt; A[&quot;稠密注意力（全部条目）&quot;]\n  W[&quot;SWA：最近 128 token&quot;] --&gt; A<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>压缩率 <span class=\"katex-inline\">m&#x27;=128<\/span>，比 CSA 的 4 大 32 倍。压缩方式与 CSA 类似：压缩权重 softmax 后加权求和，但不做重叠压缩。<\/p>\n<p>为什么不做稀疏：压缩后只剩约 7812 条（1M 上下文），稠密算也可接受；省掉索引器的计算和存储，结构更简单。<\/p>\n<p>为什么需要它：CSA 的 top-k 只能覆盖“最相关的 512 条”，对需要全局扫一遍的任务（比如长文档主题归纳）不够。HCA 保留一个粗粒度的全局视图，弥补这个缺口。<\/p>\n<p>V4-Pro 前 2 层用 HCA，V4-Flash 前 2 层用纯 SWA；之后都是 CSA/HCA 交错。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\nHCA 不是“比 CSA 更弱”，它是不同分工。\n<\/li><li>\nHCA 的 128:1 压缩不是“只保留 128 个 token”，是把每 128 个压成 1 条，总数仍是序列长度的 1/128。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch08<\/td><td>V4<\/td><td>m&#x27;=128，稠密注意力<\/td><\/tr><tr><td>ch09<\/td><td>V4.1<\/td><td>改为纯 CSA2，不再用 HCA<\/td><\/tr><tr><td>ch10<\/td><td>架构演进<\/td><td>重压缩路线<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：CSA、注意力\n<\/li><li>\n后续：CSA2\n<\/ul>", "c24": "<div class=\"source-badge\">出处：DeepSeek-V4 技术报告 §2.2<\/div><h1>mHC（流形约束超连接）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 8 章、第 9 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>mHC 把 Transformer 的残差流从 1 条扩成 4 条，用一个受双随机约束的矩阵混合它们，替代简单的逐元素相加。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是 V4 提升训练稳定性和深层信息传递的关键结构，V4.1 还升级成 Single-Pass mHC，降低显存开销。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  X[&quot;4 条残差流 X&quot;] --&gt; M[&quot;双随机矩阵 M&quot;]\n  M --&gt; S[&quot;混合结果 MX&quot;]\n  X --&gt; L[&quot;子层 Layer(X)&quot;]\n  S --&gt; A[&quot;相加&quot;]\n  L --&gt; A\n  A --&gt; Y[&quot;输出 4 条流&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>标准残差：<span class=\"katex-inline\">y=x+\\text{Layer}(x)<\/span>，只有一条流。<\/p>\n<p>mHC：把隐藏状态复制成 <span class=\"katex-inline\">n=4<\/span> 条残差流，用 <span class=\"katex-inline\">4\\times4<\/span> 矩阵 <span class=\"katex-inline\">M<\/span> 混合：<\/p>\n<div class=\"katex-block\">X_{\\text{out}}=M X_{\\text{in}}+\\text{Layer}(X_{\\text{in}})<\/div>\n<p><span class=\"katex-inline\">M<\/span> 约束为<strong>双随机矩阵<\/strong>：每行和 1、每列和 1、元素非负。这个约束保证混合是凸组合，不会放大信号，也不会让某条流吞掉其他流。训练时用 Sinkhorn-Knopp 迭代 20 次，把学到的矩阵投影回这个流形。<\/p>\n<p>为什么有效：<\/p>\n<ul><li>\n多条流提供更多“信息通道”，不同层可以写不同流。\n<\/li><li>\n双随机约束让混合稳定，避免深层残差爆炸。\n<\/li><li>\n模型可以学“哪些流该合并”，比固定加法灵活。\n<\/ul>\n<p>代价：显存和通信增加。V4 用融合核、重计算、DualPipe 调整，把开销压到流水线阶段的 6.7%。V4.1 的 Single-Pass mHC 用一个融合核完成，激活访存减半。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\nmHC 不是“简单多加几条残差”，关键是矩阵约束。\n<\/li><li>\n双随机约束不是“随便归一化”，行列都要为 1，Sinkhorn 是迭代投影。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch08<\/td><td>V4<\/td><td>n=4，Sinkhorn 20 次<\/td><\/tr><tr><td>ch09<\/td><td>V4.1<\/td><td>Single-Pass mHC<\/td><\/tr><tr><td>ch10<\/td><td>架构对比<\/td><td>残差结构演进<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：残差连接、矩阵乘法\n<\/li><li>\n后续：Sinkhorn、训练稳定性\n<\/ul><details class=\"depth-fragment\"><summary>展开完整第一性原理推导（mHC（流形约束超连接））<\/summary><div class=\"depth-body\"><h2>mHC 的第一性原理推导：为什么残差要“矩阵混合”，还要双随机约束<\/h2>\n<h3>第一步：标准残差在做什么<\/h3>\n<p>一个 Transformer 层可以写成：<\/p>\n<div class=\"katex-block\">x_{l+1}=x_l+F_l(x_l)<\/div>\n<p><span class=\"katex-inline\">x_l<\/span> 是第 <span class=\"katex-inline\">l<\/span> 层的输入，<span class=\"katex-inline\">F_l<\/span> 是注意力或 FFN。残差让信息有一条直通路径：即使 <span class=\"katex-inline\">F_l<\/span> 输出很小，<span class=\"katex-inline\">x_{l+1}<\/span> 仍约等于 <span class=\"katex-inline\">x_l<\/span>。<\/p>\n<p>问题是，所有层共用同一条残差流。第 1 层写进去的信息，到第 60 层可能被后续层覆盖得差不多了。层与层之间也会互相干扰：某一层想保留的特征，可能被下一层的写入冲掉。<\/p>\n<h3>第二步：多几条残差流<\/h3>\n<p>mHC 把一条流扩成 <span class=\"katex-inline\">n=4<\/span> 条，记作矩阵 <span class=\"katex-inline\">X\\in\\mathbb{R}^{4\\times d}<\/span>，每一行是一条流。子层仍然处理拼接后的表示，输出也写成 4 条流。层间混合不再用“直接相加”，而是用一个 <span class=\"katex-inline\">4\\times4<\/span> 矩阵 <span class=\"katex-inline\">M<\/span>：<\/p>\n<div class=\"katex-block\">X_{\\text{out}}=M X_{\\text{in}}+F(X_{\\text{in}})<\/div>\n<p><span class=\"katex-inline\">M_{ij}<\/span> 表示“第 <span class=\"katex-inline\">j<\/span> 条输入流有多少比例进入第 <span class=\"katex-inline\">i<\/span> 条输出流”。这样模型可以学“哪些流该合并、哪些该分开”。<\/p>\n<h3>第三步：为什么不能随便学 M<\/h3>\n<p>如果 <span class=\"katex-inline\">M<\/span> 没有任何约束，训练可能学到很大的元素，导致：<\/p>\n<ul><li>\n某条流的数值被放大，深层爆炸。\n<\/li><li>\n某条流被完全忽略，等于白扩。\n<\/li><li>\n不同层之间的尺度漂移，训练不稳。\n<\/ul>\n<p>所以 mHC 把 <span class=\"katex-inline\">M<\/span> 约束为<strong>双随机矩阵<\/strong>（doubly stochastic）：<\/p>\n<ol><li>\n所有元素非负：<span class=\"katex-inline\">M_{ij}\\ge 0<\/span>。\n<\/li><li>\n每行和为 1：<span class=\"katex-inline\">\\sum_j M_{ij}=1<\/span>。\n<\/li><li>\n每列和为 1：<span class=\"katex-inline\">\\sum_i M_{ij}=1<\/span>。\n<\/ol>\n<p>这保证 <span class=\"katex-inline\">M<\/span> 是一个“凸组合 + 置换”的混合：输出的每条流都是输入流的加权平均，总信号既不放大也不缩小。<\/p>\n<h3>第四步：Sinkhorn 怎么把矩阵投影回约束<\/h3>\n<p>训练时 <span class=\"katex-inline\">M<\/span> 由参数算出，不天然满足双随机。Sinkhorn-Knopp 迭代做交替归一化：<\/p>\n<ol><li>\n每行除以行和，让行和为 1。\n<\/li><li>\n每列除以列和，让列和为 1。\n<\/li><li>\n重复。\n<\/ol>\n<p>拿一个 2×2 的例子：<\/p>\n<div class=\"katex-block\">M=\\begin{bmatrix}2 & 1\\\\1 & 2\\end{bmatrix}<\/div>\n<p>第一步行归一化：<\/p>\n<div class=\"katex-block\">\\begin{bmatrix}2/3 & 1/3\\\\1/3 & 2/3\\end{bmatrix}<\/div>\n<p>行和已经为 1，列和也是 1（<span class=\"katex-inline\">2/3+1/3=1<\/span>），一次就收敛。再看一个不对称的：<\/p>\n<div class=\"katex-block\">M=\\begin{bmatrix}1 & 2\\\\3 & 4\\end{bmatrix}<\/div>\n<p>行归一化：<\/p>\n<div class=\"katex-block\">\\begin{bmatrix}1/3 & 2/3\\\\3/7 & 4/7\\end{bmatrix}<\/div>\n<p>列和：第一列 <span class=\"katex-inline\">1/3+3/7\\approx0.333+0.429=0.762<\/span>，第二列 <span class=\"katex-inline\">2/3+4/7\\approx0.667+0.571=1.238<\/span>。不满足，继续列归一化、行归一化，反复迭代，最终逼近双随机。V4 迭代 20 次，足够稳定。<\/p>\n<h3>第五步：数值感受稳定性<\/h3>\n<p>假设输入两条流都是 1，<span class=\"katex-inline\">M<\/span> 是双随机：<\/p>\n<div class=\"katex-block\">X_{\\text{out}}=M\\begin{bmatrix}1\\\\1\\end{bmatrix}=\\begin{bmatrix}1\\\\1\\end{bmatrix}<\/div>\n<p>因为每行和为 1，输出每条流仍是 1，总和不放大。如果 <span class=\"katex-inline\">M<\/span> 不受约束，比如 <span class=\"katex-inline\">\\begin{bmatrix}10 &amp; 0\\\\0 &amp; 1\\end{bmatrix}<\/span>，输出第一条流变成 10，信号放大 10 倍，深层容易爆炸。<\/p>\n<h3>第六步：代价与优化<\/h3>\n<p>4 条流意味着 4 倍的激活存储和跨层通信。V4 用融合核、选择性重计算、DualPipe 调整，把额外开销压到流水线阶段的 6.7%。V4.1 的 Single-Pass mHC 把多个 kernel 合成一个，激活访存减半。<\/p>\n<h3>差生检查<\/h3>\n<ul><li>\n矩阵、行和、列和都给了具体数字。\n<\/li><li>\nSinkhorn 的每一步都能手算复核。\n<\/li><li>\n解释了“为什么需要约束”，并用反例说明不约束会放大信号。\n<\/li><li>\n区分了算法收益和工程代价。\n<\/ul>\n<h3>前置与后续<\/h3>\n<ul><li>\n前置：矩阵乘法、残差连接（第 1、4 章）\n<\/li><li>\n后续：Sinkhorn、V4 训练稳定性（ch08）、Single-Pass mHC（ch09）\n<\/ul><\/div><\/details>", "c25": "<div class=\"source-badge\">出处：DeepSeek-V4 技术报告 §2.4<\/div><h1>Muon 优化器<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 8 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>Muon 是一种矩阵级优化器：先用 Newton-Schulz 迭代把梯度矩阵正交化，再做带动量和权重衰减的更新。<\/p>\n<h2>为什么重要<\/h2>\n<p>V4 大部分参数改用 Muon，是训练更快、更稳的关键。它和 AdamW 的区别，是“逐元素自适应”与“矩阵整体正交化”的区别。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  G[&quot;梯度矩阵 G&quot;] --&gt; N[&quot;Newton-Schulz：奇异值拉向 1&quot;]\n  N --&gt; O[&quot;正交化梯度&quot;]\n  O --&gt; M[&quot;动量 + 权重衰减&quot;]\n  M --&gt; U[&quot;参数更新&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>AdamW 对每个参数维护一阶、二阶矩，逐元素缩放。Muon 把参数矩阵的梯度当成整体，做多项式迭代：<\/p>\n<div class=\"katex-block\">G_{k+1}=aG_k+bG_kG_k^TG_k+c(G_kG_k^T)^2G_k<\/div>\n<p>V4 的 Newton-Schulz 分两段：前 8 步用系数 <span class=\"katex-inline\">(3.4445,-4.7750,2.0315)<\/span> 快速收敛，后 2 步用 <span class=\"katex-inline\">(2,-1.5,0.5)<\/span> 把奇异值稳定在 1。<\/p>\n<p>配置：动量 0.95，权重衰减 0.1，更新矩阵 RMS 缩放到 0.18。Embedding、输出头、RMSNorm 仍用 AdamW。<\/p>\n<p>分布式难点：Muon 需要完整梯度矩阵，和 ZeRO 的分片逻辑冲突。V4 用混合 ZeRO：稠密参数背包分配，MoE 参数按专家展平分配，并在多余数据并行组里冗余计算。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\nMuon 不是“另一个 AdamW”，它作用于矩阵整体，不是逐元素。\n<\/li><li>\n正交化不是“把梯度变成单位矩阵”，是把奇异值拉到接近 1，保留方向信息。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch08<\/td><td>V4<\/td><td>大多数模块用 Muon<\/td><\/tr><tr><td>ch09<\/td><td>V4.1<\/td><td>继续使用，适配 Engram<\/td><\/tr><tr><td>ch11<\/td><td>训练<\/td><td>优化器与架构共同影响稳定性<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：梯度下降、矩阵乘法\n<\/li><li>\n后续：Newton-Schulz、ZeRO\n<\/ul>", "c26": "<div class=\"source-badge\">出处：DeepSeek-V4.1-Flash 论文 §2.2<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c28\">SWA（滑动窗口注意力）<\/a><\/span><\/div><h1>CED（因果编码器—解码器）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 9 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>CED 把 Transformer 分成前半编码器和后半解码器：解码器的全局 KV 直接从编码器末端隐藏状态投影，不再逐层计算。<\/p>\n<h2>为什么重要<\/h2>\n<p>它让 V4.1 的 prefill 只激活 8B 参数，decode 激活 16B，直接针对智能体“输入重、输出轻”的负载。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[&quot;输入 token&quot;] --&gt; B[&quot;编码器 20 层&quot;]\n  B --&gt; C[&quot;H20&quot;]\n  C --&gt; D[&quot;投影出解码器全局 KV&quot;]\n  C --&gt; E[&quot;解码器 20 层：SWA 逐层 + 全局 KV 复用&quot;]\n  E --&gt; F[&quot;输出&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>标准 Transformer 每层都用自己的隐藏状态生成 K/V。CED 规定，对 <span class=\"katex-inline\">l&gt;L/2<\/span> 的解码器层：<\/p>\n<div class=\"katex-block\">C_l=H_{L/2}W_l^{KV},\\quad Z_l=H_{L/2}W_l^{Z}<\/div>\n<p><span class=\"katex-inline\">H_{L/2}<\/span> 是编码器最后一层的隐藏状态，<span class=\"katex-inline\">W_l^{KV}<\/span>、<span class=\"katex-inline\">W_l^{Z}<\/span> 是每层独立的投影。这样 prefill 只需算前一半层，后一半的全局 KV 一次投影出来。<\/p>\n<p>局部 SWA 仍逐层算，因为局部细节依赖每层自己的表示。为避免回放成本，CED 用 Decoder SWA Bounded Replay：只回放最近 <span class=\"katex-inline\">n_{\\text{win}}=128<\/span> 个 token。<\/p>\n<p>复杂度：prefill 从 <span class=\"katex-inline\">O(NL)<\/span> 降到 <span class=\"katex-inline\">O(NL/2+n_{\\text{win}}L/2)<\/span>，近似减半。<\/p>\n<p>为什么 decode 激活更多：生成每个 token 时，解码器 20 层全部参与，参数回到完整规模。所以“prefill 8B / decode 16B”不是两个模型，是同一模型的不同阶段。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\nCED 不是“编码器只处理输入、解码器只处理输出”的简单分工，关键是 KV 的投影路径。\n<\/li><li>\nCED 不是“完全不用算后 20 层”，decode 阶段后 20 层照常参与。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch09<\/td><td>V4.1<\/td><td>20 编码 + 20 解码<\/td><\/tr><tr><td>ch10<\/td><td>架构对比<\/td><td>非对称计算<\/td><\/tr><tr><td>ch11<\/td><td>部署<\/td><td>prefill/decode 成本分离<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：Transformer 层、KV cache\n<\/li><li>\n后续：SWA Bounded Replay、CSA2\n<\/ul><details class=\"depth-fragment\"><summary>展开完整第一性原理推导（CED（因果编码器—解码器））<\/summary><div class=\"depth-body\"><h2>CED 的第一性原理推导：为什么 prefill 能只算一半<\/h2>\n<h3>第一步：prefill 和 decode 是两笔不同的账<\/h3>\n<p>生成一段回答分两个阶段：<\/p>\n<ul><li>\n<strong>prefill<\/strong>：把整段输入一次性读进模型，算出所有层、所有位置的 KV cache。这个阶段并行度高，计算量大。\n<\/li><li>\n<strong>decode<\/strong>：每生成一个新 token，读已有 KV cache，算出下一个 token。这个阶段每步只算一个 token，受显存带宽限制。\n<\/ul>\n<p>智能体场景输入很长、输出很短，prefill 占大头。CED 就是针对 prefill 动刀。<\/p>\n<h3>第二步：标准 Transformer 的 prefill 为什么贵<\/h3>\n<p>40 层的模型，每一层都要：<\/p>\n<ol><li>\n用自己的隐藏状态算 K、V。\n<\/li><li>\n把 K、V 写入 cache。\n<\/li><li>\n做注意力。\n<\/ol>\n<p>prefill 的计算量大致是 <span class=\"katex-inline\">O(NL)<\/span>：<span class=\"katex-inline\">N<\/span> 是输入长度，<span class=\"katex-inline\">L<\/span> 是层数。<span class=\"katex-inline\">N=100<\/span> 万、<span class=\"katex-inline\">L=40<\/span> 时，这个数字非常大。<\/p>\n<h3>第三步：CED 把后 20 层的 KV 一次性投影出来<\/h3>\n<p>CED 把 40 层分成两半：前 20 层编码器，后 20 层解码器。对解码器层 <span class=\"katex-inline\">l&gt;20<\/span>：<\/p>\n<div class=\"katex-block\">C_l=H_{20}W_l^{KV},\\quad Z_l=H_{20}W_l^{Z}<\/div>\n<p><span class=\"katex-inline\">H_{20}<\/span> 是编码器最后一层的隐藏状态。也就是说，解码器的全局 KV 不再由每层自己的隐藏状态逐层生成，而是从 <span class=\"katex-inline\">H_{20}<\/span> 用每层独立的投影矩阵一次性算出来。<\/p>\n<p>prefill 只需要算前 20 层，后 20 层的全局 KV 一次矩阵乘法就得到。计算量近似减半：<\/p>\n<div class=\"katex-block\">O(NL)\\rightarrow O(NL/2+n_{\\text{win}}L/2)<\/div>\n<p><span class=\"katex-inline\">n_{\\text{win}}=128<\/span> 是滑动窗口长度，第二项是局部 SWA 的回放成本。<span class=\"katex-inline\">N\\gg n_{\\text{win}}<\/span> 时，第二项可以忽略。<\/p>\n<h3>第四步：为什么局部 SWA 不能也省掉<\/h3>\n<p>全局 KV 可以从 <span class=\"katex-inline\">H_{20}<\/span> 投影，但 SWA 的 KV 依赖每层自己的局部表示。如果也省掉，后 20 层看不到最近的词，局部细节（相邻词、标点、代码缩进）会丢失。<\/p>\n<p>完全重建 SWA 需要回放 <span class=\"katex-inline\">L/2\\times n_{\\text{win}}<\/span> 个 token，成本不小。CED 用 <strong>Decoder SWA Bounded Replay<\/strong>：只回放最近 <span class=\"katex-inline\">n_{\\text{win}}=128<\/span> 个 token，而不是整个窗口 × 层数。论文说精度损失可忽略。<\/p>\n<h3>第五步：数值感受<\/h3>\n<p>假设 40 层，输入 100 万 token。标准 prefill 要算 40 层；CED 只算 20 层编码器 + 少量 SWA 回放，计算量约 50%。后 20 层的全局 KV 用 20 次投影矩阵乘 <span class=\"katex-inline\">H_{20}<\/span>，相比逐层注意力，成本很小。<\/p>\n<p>激活参数：prefill 时只走编码器路径，约 8B；decode 时 20 层解码器全部参与，回到 16B。这不是两个模型，是同一模型在不同阶段激活不同子集。<\/p>\n<h3>第六步：代价和边界<\/h3>\n<ul><li>\n解码器全局 KV 全部来自 <span class=\"katex-inline\">H_{20}<\/span>，表达能力受编码器末端表示限制。论文用每层独立投影和训练补偿。\n<\/li><li>\nSWA 回放仍有成本，短输入、多轮对话时更明显。\n<\/li><li>\nCED 让训练和推理的流水线更复杂，跨阶段共享状态管理是工程难点。\n<\/li><li>\ndecode 阶段并没有省，16B 激活是实打实的。\n<\/ul>\n<h3>差生检查<\/h3>\n<ul><li>\nprefill/decode 的区别先用白话讲清。\n<\/li><li>\n复杂度公式里的 <span class=\"katex-inline\">N<\/span>、<span class=\"katex-inline\">L<\/span>、<span class=\"katex-inline\">n_{\\text{win}}<\/span> 都解释了。\n<\/li><li>\n数值例子说明“约一半”从哪来。\n<\/li><li>\n解释了“为什么 decode 仍是 16B”，避免误解成两个模型。\n<\/ul>\n<h3>前置与后续<\/h3>\n<ul><li>\n前置：Transformer 层、KV cache、自回归生成（第 4、5 章）\n<\/li><li>\n后续：CSA2（ch09）、SWA Bounded Replay（ch09）\n<\/ul><\/div><\/details>", "c27": "<div class=\"source-badge\">出处：DeepSeek-V4.1-Flash 论文 §2.3<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c22\">CSA（压缩稀疏注意力）<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c23\">HCA（重度压缩注意力）<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c26\">CED（因果编码器—解码器）<\/a><\/span><\/div><h1>CSA2（压缩稀疏注意力 2）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 9 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>CSA2 在 CSA 的基础上增加跨层复用：主 KV、索引器 K、top-k 索引都可以从前面层继承，层与层之间不再各存一份。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是 V4.1 把全局 KV 压到 890 B/token 的核心。没有跨层复用，FP4 和 CED 也到不了这个量级。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  F[&quot;Full：算主 KV + 索引 K + top-k&quot;] --&gt; R1[&quot;Reindex：复用 KV，重算 top-k&quot;]\n  R1 --&gt; R2[&quot;Reuse：复用 KV + top-k&quot;]\n  R2 --&gt; R3[&quot;Reuse：继续复用&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>三种模式：<\/p>\n<ul><li>\n<strong>Full<\/strong>：完整路径。生成本层主 KV、索引器 K，跑索引器，选 top-k。\n<\/li><li>\n<strong>Reindex<\/strong>：复用前层主 KV 和索引器 K，用自己的索引 Q 重新打分，选新 top-k。KV 共享，选择可变。\n<\/li><li>\n<strong>Reuse<\/strong>：复用前层主 KV 和 top-k 索引，不跑索引器，直接做注意力。\n<\/ul>\n<p>V4.1 的排布：<\/p>\n<ul><li>\n编码器：18 层 CSA2，m=2，每 6 层一组，1 Full + 5 Reuse。\n<\/li><li>\n解码器：20 层 CSA2，m=1，每 4 层一组，首组 1 Full + 3 Reuse，后四组 1 Reindex + 3 Reuse。\n<\/ul>\n<p>另外两个简化：去掉 CSA 的重叠压缩和绝对位置嵌入；索引器 K 直接从主 KV 投影，不再单独压缩。<\/p>\n<p>分层稀疏索引器：解码器第一个 Full 层建 2048 块 × 8 位置的候选池（16384 个候选），后续 Reindex 只在池里选 top-512，成本从线性变常数。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\nCSA2 不是“每层都不算 KV”，Full 层仍然完整计算。\n<\/li><li>\nReuse 不是“完全复制前层输出”，每层仍算自己的 Q 和 SWA KV。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch09<\/td><td>V4.1<\/td><td>三模式 + 分层索引器<\/td><\/tr><tr><td>ch10<\/td><td>架构演进<\/td><td>压缩从序列维扩展到层维<\/td><\/tr><tr><td>ch11<\/td><td>部署<\/td><td>减少 KV 存储与索引计算<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：CSA、KV cache\n<\/li><li>\n后续：FP4 KV、持久缓存\n<\/ul><details class=\"depth-fragment\"><summary>展开完整第一性原理推导（CSA2（压缩稀疏注意力 2））<\/summary><div class=\"depth-body\"><h2>CSA2 的第一性原理推导：把“层”也当成一个可以压缩的维度<\/h2>\n<h3>第一步：KV cache 的三个压缩维度<\/h3>\n<p>长上下文缓存可以从三个方向压：<\/p>\n<ol><li>\n<strong>条目大小<\/strong>：每个 KV 条目用多少个数、多少位。GQA 减少 KV 头数，MLA 用低秩潜向量，FP4 降低位宽。\n<\/li><li>\n<strong>序列长度<\/strong>：每 <span class=\"katex-inline\">m<\/span> 个 token 压成 1 条。CSA 的 4:1、HCA 的 128:1 属于这一类。\n<\/li><li>\n<strong>层数<\/strong>：相邻层共用同一份 KV，不再每层存一份。CSA2 的跨层复用属于这一类。\n<\/ol>\n<p>V4 已经用了前两个维度，V4.1 把第三个维度也用上，三个维度相乘，才有 890 B/token。<\/p>\n<h3>第二步：相邻层的 KV 有多像<\/h3>\n<p>Transformer 每层的 KV 由该层隐藏状态投影而来。相邻层的表示高度相关，尤其是深层。既然相似，就没必要每层都存一份完整的全局 KV。<\/p>\n<p>CSA2 让一部分层只读不写：从前面层继承主 KV 和索引器 K，自己只算 query 和 SWA KV。<\/p>\n<h3>第三步：三种模式的分工<\/h3>\n<ul><li>\n<strong>Full<\/strong>：完整计算，写主 KV、索引器 K，跑索引器选 top-k。它是“生产者”。\n<\/li><li>\n<strong>Reindex<\/strong>：复用生产者的主 KV 和索引器 K，但用自己的索引 Q 重新打分，选新的 top-k。它共享存储，但保留“选择变化”的能力。\n<\/li><li>\n<strong>Reuse<\/strong>：连 top-k 索引也复用，直接做注意力。它是“纯消费者”，最省。\n<\/ul>\n<p>V4.1 编码器每 6 层一组：1 个 Full + 5 个 Reuse。解码器每 4 层一组：首组 1 Full + 3 Reuse，后四组 1 Reindex + 3 Reuse。<\/p>\n<h3>第四步：存储账怎么算<\/h3>\n<p>假设一个 6 层组，只有 1 层 Full 写全局 KV，其余 5 层复用。全局 KV 存储从 6 份变成 1 份：<\/p>\n<div class=\"katex-block\">\\text{存储降幅}=\\frac{6}{1}=6\\ \\text{倍}<\/div>\n<p>解码器 20 层，只有 1 层 Full 写全局 KV（首组第一层），其余 19 层复用；4 个 Reindex 层只重算索引，不写 KV。全局 KV 存储接近 1/20。再叠加 FP4（相对 FP16 再降 4 倍），就能到 890 B/token。<\/p>\n<p>注意：SWA 的 KV 每层都要算、都要存，不在这个账里。所以“1/20”只指全局 KV，不是全部缓存。<\/p>\n<h3>第五步：索引器成本怎么变常数<\/h3>\n<p>问题：即使 KV 共享，Reindex 层仍要对自己的 Q 和全部索引 K 打分，成本随上下文线性增长。<\/p>\n<p>分层稀疏索引器：解码器第一个 Full 层先选 2048 个块，每块 8 个位置，共 16384 个候选。后面的 Reindex 只在这 16384 个候选里选 top-512，不再对 100 万条全扫。<\/p>\n<p>成本对比：<\/p>\n<ul><li>\n全扫：每个 query 打 100 万分。\n<\/li><li>\n分层：第一个 Full 层打 100 万分，后面每层只打 16384 分。\n<\/ul>\n<p>对深层来说，成本从 <span class=\"katex-inline\">O(N)<\/span> 变成 <span class=\"katex-inline\">O(1)<\/span>（相对上下文长度）。<\/p>\n<h3>第六步：三个维度相乘<\/h3>\n<p>以 V4-Flash 的 3514 B/token 为起点：<\/p>\n<ul><li>\n跨层复用：全局 KV 存储大幅下降。\n<\/li><li>\nFP4：每个数从 16 位降到 4 位，约 1/4。\n<\/li><li>\nCED：解码器全局 KV 只存一份，不再逐层。\n<\/ul>\n<p>三者相乘，得到 890 B/token。论文说约是 V4-Flash 的 1/4，和这个量级吻合。<\/p>\n<h3>差生检查<\/h3>\n<ul><li>\n三个压缩维度用白话分开讲，不混在一起。\n<\/li><li>\n6 层组的存储账可以用除法复核。\n<\/li><li>\n分层索引器的候选数 2048×8=16384 明确写出。\n<\/li><li>\n强调 890 B/token 只指全局 KV，避免误解为全部缓存。\n<\/ul>\n<h3>前置与后续<\/h3>\n<ul><li>\n前置：CSA、KV cache、softmax（第 5、8 章）\n<\/li><li>\n后续：FP4（ch09）、持久 KV cache（ch09）\n<\/ul><\/div><\/details>", "c28": "<div class=\"source-badge\">出处：DeepSeek-V4/V4.1 技术报告<\/div><h1>SWA（滑动窗口注意力）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 8 章、第 9 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>SWA 让每个 token 只看最近固定窗口内的 token，窗口外的历史不参与注意力。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是长上下文模型的“局部视野”分支。CSA/HCA 负责远端压缩，SWA 负责最近细节，两者缺一不可。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  T[&quot;当前 token&quot;] --&gt; W[&quot;最近 128 个 token&quot;]\n  W --&gt; A[&quot;局部注意力&quot;]\n  T --&gt; G[&quot;CSA/HCA 全局分支&quot;]\n  A --&gt; O[&quot;合并输出&quot;]\n  G --&gt; O<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>标准注意力看全部历史，SWA 只保留最近 <span class=\"katex-inline\">n_{\\text{win}}<\/span> 个 token 的 KV。V4/V4.1 的窗口都是 128。<\/p>\n<p>作用：<\/p>\n<ul><li>\n保证局部细节不被压缩抹掉，比如相邻词、标点、代码缩进。\n<\/li><li>\n严格保持因果性：压缩块内的 token 互相看不见，SWA 补上这段局部信息。\n<\/li><li>\n降低缓存：只需存最近 128 个 token 的 KV，不用存全部。\n<\/ul>\n<p>V4.1 进一步用 <strong>SWA Bounded Replay<\/strong>：持久缓存不存 SWA，命中前缀时只回放最近 128 个 token 重建，不再回放整个窗口 × 层数。论文说精度损失可忽略。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\nSWA 不是“只看 128 个 token 就完了”，它和全局分支叠加使用。\n<\/li><li>\nSWA 不是“不需要位置编码”，窗口内的位置关系仍要编码。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch08<\/td><td>V4<\/td><td>每层附加 128 窗口分支<\/td><\/tr><tr><td>ch09<\/td><td>V4.1<\/td><td>前 2 层纯 SWA，其余层叠加<\/td><\/tr><tr><td>ch10<\/td><td>架构对比<\/td><td>局部视野的稳定角色<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：注意力、因果掩码\n<\/li><li>\n后续：SWA Bounded Replay、KV cache\n<\/ul>", "c29": "<div class=\"source-badge\">出处：DeepSeek-V4.1-Flash 论文 §2.4.2<\/div><h1>Engram（条件记忆）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 9 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>Engram 是一个通过哈希查表的条件记忆模块，把“记事实、记搭配”从矩阵计算里拆出来，用 <span class=\"katex-inline\">O(1)<\/span> 的查表完成。<\/p>\n<h2>为什么重要<\/h2>\n<p>V4.1 用 196B 参数的 Engram 增强模型能力，却不增加每 token 的矩阵计算量。这是“参数多、算力省”的另一种解法，和 MoE 不同。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  T[&quot;输入 token&quot;] --&gt; N[&quot;N-gram 压缩（2/3/4 阶）&quot;]\n  N --&gt; H[&quot;8 个哈希头&quot;]\n  H --&gt; E[&quot;约 1600 万条目的表&quot;]\n  E --&gt; G[&quot;门控&quot;]\n  G --&gt; M[&quot;注入主干&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>流程：<\/p>\n<ol><li>\n对输入 token 序列做 N-gram 组合（2、3、4 阶），得到短语级键。\n<\/li><li>\n每个键用 8 个哈希头映射到 8 张表，每张约 1600 万条目。\n<\/li><li>\n查到嵌入向量，经上下文感知门控后注入主干。\n<\/ol>\n<p>参数：196B，平均分到两个模块，放在第 1 层和第 14 层。每阶嵌入维度 2048，表项用 FP8 存。<\/p>\n<p>为什么省算力：查表是内存访问，不是矩阵乘法。模型可以把“固定搭配、事实、术语”存进 Engram，把计算留给推理和组合。<\/p>\n<p>为什么放两层：平衡流水线显存。放一层，那一层压力太大；放太深，对早层表示影响小。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\nEngram 不是 MoE 专家，它不参与路由，也不做 FFN 计算。\n<\/li><li>\nEngram 不是“外挂知识库”，它是模型参数的一部分，随训练更新。\n<\/li><li>\n查表不等于“不会泛化”，哈希碰撞和门控让它在相似上下文里仍能组合。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch09<\/td><td>V4.1<\/td><td>196B 参数，第 1、14 层<\/td><\/tr><tr><td>ch10<\/td><td>架构对比<\/td><td>记忆与计算解耦<\/td><\/tr><tr><td>ch11<\/td><td>部署<\/td><td>主机内存预取<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：embedding、MoE\n<\/li><li>\n后续：条件记忆、FP8\n<\/ul>", "c30": "<div class=\"source-badge\">出处：DeepSeek-V4.1-Flash 论文 §2.4.3<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c28\">SWA（滑动窗口注意力）<\/a><\/span><\/div><h1>DSpark（投机解码）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 9 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>DSpark 是 V4.1 独立训练的投机解码模块：用一个小 drafter 一次猜多个 token，再由主模型按置信度验证接受。<\/p>\n<h2>为什么重要<\/h2>\n<p>decode 阶段每步只生成一个 token，GPU 利用率低。DSpark 用“先猜后验”把多步合并，降低长上下文生成的延迟。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">sequenceDiagram\n  participant D as DSpark drafter\n  participant M as 主模型\n  D-&gt;&gt;D: 3 层 Transformer，并行出 5 个草稿\n  D-&gt;&gt;M: 提交草稿\n  M-&gt;&gt;M: 并行验证\n  M-&gt;&gt;D: 接受匹配前缀，拒绝其余<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>结构：3 个 Transformer 块，滑动窗口 128。一次前向并行给出 5 个草稿位置的 logits，半自回归生成草稿。<\/p>\n<p>验证：主模型对草稿做并行前向，按置信度调度决定接受多少。匹配的前缀直接接受，第一个不匹配的位置由主模型纠正。<\/p>\n<p>训练：DSpark 在主干预训练之后单独训练，不参与主干梯度。V4.1 主干预训练时甚至不用 MTP，把投机解码完全交给 DSpark。<\/p>\n<p>为什么有效：decode 是显存带宽瓶颈，一次验证多个 token 能把带宽摊薄。草稿接受率越高，加速越明显。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\nDSpark 不是 MTP，MTP 是主干上的辅助训练头，DSpark 是独立 drafter。\n<\/li><li>\n投机解码不是“一定变快”，草稿接受率低时，验证成本会吃掉收益。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch09<\/td><td>V4.1<\/td><td>独立训练，5 个草稿位置<\/td><\/tr><tr><td>ch10<\/td><td>架构对比<\/td><td>推理加速路线<\/td><\/tr><tr><td>ch11<\/td><td>部署<\/td><td>长上下文 decode 优化<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：自回归生成、MTP\n<\/li><li>\n后续：投机解码、置信度验证\n<\/ul>", "c31": "<div class=\"source-badge\">出处：DeepSeek-V4/V4.1 技术报告<\/div><h1>FP4 量化<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 9 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>FP4 用 4 位浮点数表示权重或 KV cache，把存储和带宽压到 FP16 的约四分之一，代价是精度损失。<\/p>\n<h2>为什么重要<\/h2>\n<p>V4.1 的 890 B/token 全局 KV，很大一部分来自 FP4。没有它，CSA2 的跨层复用也压不到这个量级。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[&quot;FP16：16 位/数&quot;] --&gt; B[&quot;FP8：8 位/数&quot;]\n  B --&gt; C[&quot;FP4：4 位/数&quot;]\n  C --&gt; D[&quot;存储 1/4，带宽 1/4&quot;]\n  D --&gt; E[&quot;精度损失需训练补偿&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>V4.1 的使用位置：<\/p>\n<ul><li>\n主 KV cache 用 FP4。\n<\/li><li>\nEngram 表和键值投影用 FP8。\n<\/li><li>\n视觉模块用 FP8。\n<\/li><li>\nMoE 专家权重在 V4 后训练阶段做 FP4 量化感知训练。\n<\/ul>\n<p>为什么能压：浮点数的位宽决定动态范围和精度。FP4 只有 4 位，表示范围很窄，需要缩放因子（scale）把数值映射到合适区间。缩放因子的选择决定量化误差。<\/p>\n<p>风险：长上下文里，KV 的微小误差会累积；注意力对异常值敏感。论文用训练补偿和混合精度（RoPE 维度保留 BF16）降低风险。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\nFP4 不是“把数直接截断”，需要缩放和量化策略。\n<\/li><li>\nFP4 不是“所有部分都用”，关键位置仍保留更高精度。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>ch08<\/td><td>V4<\/td><td>MoE 专家与索引器 QK 做 FP4 QAT<\/td><\/tr><tr><td>ch09<\/td><td>V4.1<\/td><td>主 KV 用 FP4<\/td><\/tr><tr><td>ch11<\/td><td>部署<\/td><td>精度与成本的取舍<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：KV cache、矩阵乘法\n<\/li><li>\n后续：量化感知训练、混合精度\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：R1 上：问题、R1-Zero、GRPO<\/strong><br>阅读：<a href=\"#/chapter/ch06\">第 6 章：R1 论文拆解（上）：先学会读论文，再看 R1-Zero<\/a><br>检查点：能复述 GRPO 的采样、奖励、优势计算<\/li><li class='path-step' id='path-02'><strong>步骤 02：R1 下：四阶段与蒸馏<\/strong><br>阅读：<a href=\"#/chapter/ch07\">第 7 章：R1 论文拆解（下）：四阶段流水线、蒸馏与局限<\/a><br>检查点：能画出 R1 完整训练流程并说出局限<\/li><li class='path-step' id='path-03'><strong>步骤 03：V4：CSA/HCA、mHC、Muon<\/strong><br>阅读：<a href=\"#/chapter/ch08\">第 8 章：V4 论文拆解：百万上下文的成本怎么砍<\/a><br>检查点：能说出 1M 上下文省的是哪两项成本<\/li><li class='path-step' id='path-04'><strong>步骤 04：V4.1：CED、CSA2、Engram、DSpark<\/strong><br>阅读：<a href=\"#/chapter/ch09\">第 9 章：V4.1 论文拆解：非对称 CED 与 KV cache 极限<\/a><br>检查点：能解释 prefill 8B 与 decode 16B 的来源<\/li><li class='path-step' id='path-05'><strong>步骤 05：附录：论文公式逐项拆解<\/strong><br>阅读：<a href=\"#/chapter/ch10\">附录：论文公式逐项拆解<\/a><br>检查点：能复算 GRPO、CSA、mHC 与 KV 字节<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<p>（无综合题）<\/p>", "__quiz_ch06__": "<h1>测验：第 6 章：R1 论文拆解（上）：先学会读论文，再看 R1-Zero<\/h1><div class='quiz-item' data-qid='q01' data-type='single' data-concept='c18' data-chapter='ch06'><p class='quiz-q'><b>Q1.<\/b> R1-Zero 的奖励由哪两部分组成？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 过程奖励 + 结果奖励<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 准确性奖励 + 格式奖励<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 人类偏好 + 长度惩罚<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 价值模型 + 策略模型<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='blank' data-concept='c17' data-chapter='ch06'><p class='quiz-q'><b>Q2.<\/b> GRPO 中优势的分母是组内______。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='single' data-concept='c17' data-chapter='ch06'><p class='quiz-q'><b>Q3.<\/b> R1-Zero 的初始基座是哪个模型？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> DeepSeek-V3-Base<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> DeepSeek-V4-Flash<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> Qwen-7B<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> Llama-70B<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch07__": "<h1>测验：第 7 章：R1 论文拆解（下）：四阶段流水线、蒸馏与局限<\/h1><div class='quiz-item' data-qid='q04' data-type='single' data-concept='c19' data-chapter='ch07'><p class='quiz-q'><b>Q1.<\/b> R1 的冷启动数据规模大约是多少？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> 几千条<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> 80 万条<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> 8 万条<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> 45T token<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q05' data-type='single' data-concept='c21' data-chapter='ch07'><p class='quiz-q'><b>Q2.<\/b> R1 的蒸馏阶段使用什么训练方式？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> 强化学习<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> 监督微调<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> 蒙特卡洛树搜索<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> 过程奖励模型<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single' data-concept='c17' data-chapter='ch07'><p class='quiz-q'><b>Q3.<\/b> 论文明确列为失败尝试的是哪一项？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> GRPO<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> 过程奖励模型（PRM）<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> 冷启动<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> 拒绝采样<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch08__": "<h1>测验：第 8 章：V4 论文拆解：百万上下文的成本怎么砍<\/h1><div class='quiz-item' data-qid='q07' data-type='single' data-concept='c22' data-chapter='ch08'><p class='quiz-q'><b>Q1.<\/b> V4 的 CSA 压缩率是多少？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 2:1<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> 4:1<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> 64:1<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 128:1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single' data-concept='c23' data-chapter='ch08'><p class='quiz-q'><b>Q2.<\/b> V4 的 HCA 压缩率是多少？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> 2:1<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> 4:1<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> 64:1<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> 128:1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q09' data-type='single' data-concept='c24' data-chapter='ch08'><p class='quiz-q'><b>Q3.<\/b> mHC 的混合矩阵被约束成什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q09' value='0'> 只有行和为 1<\/label><label class='quiz-opt'><input type='radio' name='q09' value='1'> 双随机矩阵<\/label><label class='quiz-opt'><input type='radio' name='q09' value='2'> 正交矩阵<\/label><label class='quiz-opt'><input type='radio' name='q09' value='3'> 稀疏矩阵<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch09__": "<h1>测验：第 9 章：V4.1 论文拆解：非对称 CED 与 KV cache 极限<\/h1><div class='quiz-item' data-qid='q10' data-type='single' data-concept='c26' data-chapter='ch09'><p class='quiz-q'><b>Q1.<\/b> V4.1 的 CED 中，解码器全局 KV 来自哪里？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q10' value='0'> 每层自己的隐藏状态<\/label><label class='quiz-opt'><input type='radio' name='q10' value='1'> 编码器第 20 层的隐藏状态<\/label><label class='quiz-opt'><input type='radio' name='q10' value='2'> 输入 embedding<\/label><label class='quiz-opt'><input type='radio' name='q10' value='3'> Engram 查表<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q11' data-type='blank' data-concept='c27' data-chapter='ch09'><p class='quiz-q'><b>Q2.<\/b> V4.1 的全局 KV cache 是每 token ______ 字节。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q12' data-type='single' data-concept='c27' data-chapter='ch09'><p class='quiz-q'><b>Q3.<\/b> CSA2 的 Reuse 模式复用了什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q12' value='0'> 只复用 Q<\/label><label class='quiz-opt'><input type='radio' name='q12' value='1'> 主 KV 和 top-k 索引<\/label><label class='quiz-opt'><input type='radio' name='q12' value='2'> 只复用位置编码<\/label><label class='quiz-opt'><input type='radio' name='q12' value='3'> 完全重新计算<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='r1-zero'>R1-Zero — V3-Base 直接做纯 RL、不做冷启动得到的推理模型。 <span class=glossary-ref>（第 6 章：R1 论文拆解（上）：先学会读论文，再看 R1-Zero）<\/span><\/li><li data-term='grpo'>GRPO — 用组内相对优势替代价值模型的策略优化算法。 <span class=glossary-ref>（第 6 章：R1 论文拆解（上）：先学会读论文，再看 R1-Zero）<\/span><\/li><li data-term='规则奖励'>规则奖励 — 用确定性规则判分，如答案匹配、格式检查。 <span class=glossary-ref>（第 6 章：R1 论文拆解（上）：先学会读论文，再看 R1-Zero）<\/span><\/li><li data-term='冷启动'>冷启动 — RL 前用少量高质量长链推理做 SFT，稳定格式。 <span class=glossary-ref>（第 7 章：R1 论文拆解（下）：四阶段流水线、蒸馏与局限）<\/span><\/li><li data-term='拒绝采样'>拒绝采样 — 生成多个回答，只保留达标样本做 SFT。 <span class=glossary-ref>（第 7 章：R1 论文拆解（下）：四阶段流水线、蒸馏与局限）<\/span><\/li><li data-term='知识蒸馏'>知识蒸馏 — 让学生模型学习教师模型的输出。 <span class=glossary-ref>（第 7 章：R1 论文拆解（下）：四阶段流水线、蒸馏与局限）<\/span><\/li><li data-term='奖励黑客'>奖励黑客 — 模型钻奖励漏洞拿高分但没真完成任务。 <span class=glossary-ref>（第 7 章：R1 论文拆解（下）：四阶段流水线、蒸馏与局限）<\/span><\/li><li data-term='过程奖励模型（prm）'>过程奖励模型（PRM） — 给推理每一步打分的奖励模型，R1 尝试后未作主方案。 <span class=glossary-ref>（第 7 章：R1 论文拆解（下）：四阶段流水线、蒸馏与局限）<\/span><\/li><li data-term='mcts'>MCTS — 蒙特卡洛树搜索，R1 尝试后未作主方案。 <span class=glossary-ref>（第 7 章：R1 论文拆解（下）：四阶段流水线、蒸馏与局限）<\/span><\/li><li data-term='csa'>CSA — 每 4 个 token 压 1 条再做 top-k 稀疏的注意力。 <span class=glossary-ref>（第 8 章：V4 论文拆解：百万上下文的成本怎么砍）<\/span><\/li><li data-term='hca'>HCA — 每 128 个 token 压 1 条再做稠密注意力的注意力。 <span class=glossary-ref>（第 8 章：V4 论文拆解：百万上下文的成本怎么砍）<\/span><\/li><li data-term='mhc'>mHC — 用双随机矩阵混合多条残差流的超连接。 <span class=glossary-ref>（第 8 章：V4 论文拆解：百万上下文的成本怎么砍）<\/span><\/li><li data-term='muon'>Muon — 对梯度矩阵做正交化的优化器。 <span class=glossary-ref>（第 8 章：V4 论文拆解：百万上下文的成本怎么砍）<\/span><\/li><li data-term='sinkhorn-knopp'>Sinkhorn-Knopp — 交替行列归一化，把矩阵投影到双随机流形。 <span class=glossary-ref>（第 8 章：V4 论文拆解：百万上下文的成本怎么砍）<\/span><\/li><li data-term='双随机矩阵'>双随机矩阵 — 行和、列和都为 1 的非负矩阵。 <span class=glossary-ref>（第 8 章：V4 论文拆解：百万上下文的成本怎么砍）<\/span><\/li><li data-term='ced'>CED — 前半编码器、后半解码器，解码全局 KV 由编码器末端投影。 <span class=glossary-ref>（第 9 章：V4.1 论文拆解：非对称 CED 与 KV cache 极限）<\/span><\/li><li data-term='csa2'>CSA2 — CSA 的跨层复用版本，有 Full/Reindex/Reuse 三模式。 <span class=glossary-ref>（第 9 章：V4.1 论文拆解：非对称 CED 与 KV cache 极限）<\/span><\/li><li data-term='swa'>SWA — 只看最近固定窗口的滑动窗口注意力。 <span class=glossary-ref>（第 9 章：V4.1 论文拆解：非对称 CED 与 KV cache 极限）<\/span><\/li><li data-term='swa bounded replay'>SWA Bounded Replay — 只回放最近一个窗口重建 SWA 缓存。 <span class=glossary-ref>（第 9 章：V4.1 论文拆解：非对称 CED 与 KV cache 极限）<\/span><\/li><li data-term='engram'>Engram — 用哈希查表的条件记忆模块。 <span class=glossary-ref>（第 9 章：V4.1 论文拆解：非对称 CED 与 KV cache 极限）<\/span><\/li><li data-term='dspark'>DSpark — V4.1 独立训练的投机解码 drafter。 <span class=glossary-ref>（第 9 章：V4.1 论文拆解：非对称 CED 与 KV cache 极限）<\/span><\/li><li data-term='fp4'>FP4 — 4 位浮点量化，存储和带宽约为 FP16 的 1/4。 <span class=glossary-ref>（第 9 章：V4.1 论文拆解：非对称 CED 与 KV cache 极限）<\/span><\/li><li data-term='全局 kv cache'>全局 KV cache — 常驻 HBM 的主 KV 缓存；V4.1 为 890 B/token。 <span class=glossary-ref>（第 9 章：V4.1 论文拆解：非对称 CED 与 KV cache 极限）<\/span><\/li><li data-term='持久 kv cache'>持久 KV cache — 放 SSD/主机内存、用于前缀复用的缓存。 <span class=glossary-ref>（第 9 章：V4.1 论文拆解：非对称 CED 与 KV cache 极限）<\/span><\/li><li data-term='预填充（prefill）'>预填充（prefill） — 一次性读入整段输入并建立 KV cache。 <span class=glossary-ref>（第 9 章：V4.1 论文拆解：非对称 CED 与 KV cache 极限）<\/span><\/li><li data-term='解码（decode）'>解码（decode） — 逐 token 生成输出。 <span class=glossary-ref>（第 9 章：V4.1 论文拆解：非对称 CED 与 KV cache 极限）<\/span><\/li><\/ul>", "__diagnosis__": "<h1>诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：读论文五问<\/h2>\n<p>问题是什么 → 方法核心改了什么 → 数据从哪来 → 实验证明了什么 → 作者承认的局限是什么。<\/p>\n<h2>框架：实验表三分类<\/h2>\n<p>主结果（和基线比）、消融（去掉组件看掉多少）、训练曲线（看机制）。三类不能混读。<\/p>\n<h2>决策规则<\/h2>\n<ul><li>\n先看基线是不是同一个基座，再看提升幅度。\n<\/li><li>\n先看评测是 pass@1 还是 pass@k，再比较分数。\n<\/li><li>\n作者没做的实验，通常就是局限。\n<\/ul>\n<h2>反模式<\/h2>\n<ul><li>\n只看摘要的最高分。\n<\/li><li>\n把“作者解释”当成“实验结论”。\n<\/li><li>\n把不同论文的 benchmark 直接横比。\n<\/ul>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>关键数字<\/h2>\n<table><thead><tr><th>项目<\/th><th>数值<\/th><\/tr><\/thead><tbody><tr><td>R1-Zero AIME 2024<\/td><td>15.6% → 71.0%<\/td><\/tr><tr><td>R1 AIME 2024<\/td><td>79.8%<\/td><\/tr><tr><td>R1 MATH-500<\/td><td>97.3%<\/td><\/tr><tr><td>R1 冷启动数据<\/td><td>几千条<\/td><\/tr><tr><td>R1 SFT 数据<\/td><td>约 80 万条（60 万推理 + 20 万通用）<\/td><\/tr><tr><td>R1 蒸馏数据<\/td><td>约 8 万条<\/td><\/tr><tr><td>V4-Pro<\/td><td>1.6T / 49B，61 层<\/td><\/tr><tr><td>V4-Flash<\/td><td>284B / 13B，43 层<\/td><\/tr><tr><td>CSA 压缩率<\/td><td>4:1<\/td><\/tr><tr><td>HCA 压缩率<\/td><td>128:1<\/td><\/tr><tr><td>V4 1M 上下文<\/td><td>Pro 27% FLOPs / 10% KV；Flash 10% / 7%（vs V3.2）<\/td><\/tr><tr><td>V4.1-Flash<\/td><td>552B + 196B Engram，prefill 8B / decode 16B<\/td><\/tr><tr><td>V4.1 全局 KV<\/td><td>890 B/token<\/td><\/tr><tr><td>V4.1 持久 KV<\/td><td>约 V4-Flash 的 1/8<\/td><\/tr><\/tbody><\/table>\n<h2>公式<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>GRPO 优势<\/td><td><span class=\"katex-inline\">A_i=(r_i-\\bar r)/\\mathrm{std}(r)<\/span><\/td><\/tr><tr><td>压缩注意力<\/td><td>每 m 个 token 加权压成 1 条<\/td><\/tr><tr><td>OPD<\/td><td><span class=\"katex-inline\">\\sum_i w_i D_{KL}(\\pi_\\theta\\|\\pi_{E_i})<\/span><\/td><\/tr><\/tbody><\/table>"}};
const pages = DATA.rendered;
const manifest = DATA.manifest;
const SYN_GROUPS = [["定义", "含义", "释义", "概念"], ["例题", "算例", "示例", "例子", "案例"], ["习题", "题目", "练习", "测验", "自测"], ["推导", "证明", "论证", "演算"], ["步骤", "流程", "过程", "环节"], ["性质", "特性", "特点", "属性"], ["公式", "表达式", "式子"], ["定理", "定律", "法则", "准则"], ["图像", "图形", "图示", "曲线"], ["计算", "求解", "算出", "求值"], ["平均值", "均值", "平均数"], ["误差", "偏差", "偏离"], ["函数", "映射", "对应关系"], ["导数", "变化率", "切线斜率", "微商"], ["原函数", "不定积分", "反导数"], ["概率", "几率", "可能性"]];
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
const ZS_VERSION = '1.5.0';
/* ---------- 进度导出 / 导入（跨设备） ---------- */
function exportProgress(){
  const data = {};
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.indexOf(SLUG+':')===0) data[k]=localStorage.getItem(k);
  }
  const payload = {app:'zhishu', skillVersion:ZS_VERSION, kind:'companion', exportedAt:new Date().toISOString(), prefix:SLUG+':', data};
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (SLUG||'book')+'-progress-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
function importProgress(file){
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const p = JSON.parse(fr.result);
      if(!p || p.app!=='zhishu' || !p.data || typeof p.data!=='object') throw new Error('不是知枢进度文件');
      let n = 0;
      Object.keys(p.data).forEach(k=>{ if(k.indexOf(SLUG+':')===0){ localStorage.setItem(k, p.data[k]); n++; } });
      if(!n){ alert('这个文件里没有属于本书的进度（slug 不一致）'); return; }
      alert('已导入 '+n+' 条进度，页面将刷新'); location.reload();
    }catch(e){ alert('导入失败：'+e.message); }
  };
  fr.readAsText(file);
}
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{}, mastery: store.get('mastery')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  if(h==='diagnosis') return 'diagnosis';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h;
}
function showPage(rid){
  let id;
  if(rid==='path') id='__path__';
  else if(rid==='diagnosis') id='__diagnosis__';
  else if(rid==='graph') id='__graph__';
  else if(rid.startsWith('quiz/')) id='__quiz_'+rid.split('/')[1]+'__';
  else if(rid==='cards') id='__cards__';
  else if(rid==='glossary') id='__glossary__';
  else if(rid==='patterns') id='__patterns__';
  else if(rid==='cheatsheet') id='__cheatsheet__';
  else if(rid.startsWith('chapter/')) id=rid.split('/')[1];
  else if(rid.startsWith('concept/')) id=rid.split('/')[1];
  else id=rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  $$('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(rid==='diagnosis') initDiagnosis();
  if(rid==='graph') initGraph();
  if(id==='__path__') updatePath();
  renderMath();
  renderMermaid();
  applyPendingHighlight();
}

/* ---------- KaTeX 渲染（多源回退） ---------- */
let katexLoading = false, katexReady = false;
function renderMath(){
  const hasMath = document.querySelector('.katex-inline, .katex-block');
  if(!hasMath) return;
  if(katexReady){ doRenderMath(); return; }
  if(katexLoading) return;
  katexLoading = true;
  const cssUrls = [
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.css',
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.css'
  ];
  const jsUrls = [
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.js',
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.js'
  ];
  let ci = 0, ji = 0;
  const tryCss = () => {
    if(ci >= cssUrls.length){ tryJs(); return; }
    const link = document.createElement('link');
    link.rel = 'stylesheet'; link.href = cssUrls[ci++];
    let settled = false, timer = null;
    const next = () => {
      if(settled) return;
      settled = true; clearTimeout(timer); link.remove(); tryCss();
    };
    timer = setTimeout(next, 4000);
    link.onload = () => {
      if(settled) return;
      settled = true; clearTimeout(timer); tryJs();
    };
    link.onerror = next;
    document.head.appendChild(link);
  };
  const tryJs = () => {
    if(ji >= jsUrls.length){ katexLoading = false; return; }
    const s = document.createElement('script');
    s.src = jsUrls[ji++];
    let settled = false, timer = null;
    const next = () => {
      if(settled) return;
      settled = true; clearTimeout(timer); s.onload = null; s.onerror = null; s.remove(); tryJs();
    };
    timer = setTimeout(next, 5000);
    s.onload = () => {
      if(settled) return;
      settled = true; clearTimeout(timer); katexReady = true; katexLoading = false; doRenderMath();
    };
    s.onerror = next;
    document.head.appendChild(s);
  };
  tryCss();
}
function doRenderMath(){
  if(typeof katex === 'undefined') return;
  // 行内公式：.katex-inline 里的内容
  $$('.katex-inline').forEach(el=>{
    try{ katex.render(el.textContent, el, {throwOnError:false}); }catch(e){}
  });
  // 块级公式：.katex-block 里的内容
  $$('.katex-block').forEach(el=>{
    try{ katex.render(el.textContent, el, {displayMode:true, throwOnError:false}); }catch(e){}
  });
}
// 公式内容预处理：把 < 后跟字母的位置转成 &lt;，避免被 HTML 解析器当标签吃掉

/* ---------- 概念/章节依赖查找（用于诊断倒推） ---------- */
function findConcept(id){ return (manifest.concepts||[]).find(c=>c.id===id); }
function findChapter(id){ return (manifest.chapters||[]).find(c=>c.id===id); }
function getPrereqs(node){
  if(!node) return [];
  return node.prerequisites || node.prereqs || [];
}
/**
 * 答错倒推：从错题关联的概念/章节出发，沿 prerequisites 回溯，
 * 返回一串"你可能需要先补的"节点，带跳转链接。
 */
function traceBack(startConceptId, startChapterId){
  const visited = new Set();
  const chain = [];
  const queue = [];
  if(startConceptId){ const c = findConcept(startConceptId); if(c) queue.push({node:c, kind:'concept'}); }
  if(startChapterId){ const c = findChapter(startChapterId); if(c) queue.push({node:c, kind:'chapter'}); }
  while(queue.length && chain.length < 6){
    const {node, kind} = queue.shift();
    if(visited.has(node.id)) continue;
    visited.add(node.id);
    chain.push({node, kind});
    (getPrereqs(node)||[]).forEach(pid=>{
      const cn = findConcept(pid); if(cn){ queue.push({node:cn, kind:'concept'}); return; }
      const ch = findChapter(pid); if(ch) queue.push({node:ch, kind:'chapter'});
    });
  }
  return chain;
}

let networkLoaded = false;
function loadVisNetwork(cb){
  if(networkLoaded){ cb(); return; }

    'https://unpkg.com/vis-network@9.1.9/dist/vis-network.min.js',
    'https://registry.npmmirror.com/vis-network/9.1.9/dist/vis-network.min.js'
  ];
  let i = 0;
  const tryNext = () => {
    if(i >= urls.length) return;
    const s = document.createElement('script');
    s.src = urls[i++];
    const timer = setTimeout(() => { s.onload = null; s.onerror = null; s.remove(); tryNext(); }, 4000);
    s.onload = () => { clearTimeout(timer); networkLoaded = true; cb(); };

function initGraph(){
  const container = document.getElementById('graph-container');

        font: { size: 12 }
      });

let diagQueue = [], diagIdx = 0, diagWrong = [];
function initDiagnosis(){
  const startBtn = $('#diag-start');
  if(!startBtn || startBtn.dataset.inited) return;
  startBtn.dataset.inited='1';
  startBtn.addEventListener('click', ()=>{

    diagQueue = all.slice(0, Math.min(5, all.length));
    diagIdx = 0; diagWrong = [];
    showDiagQuestion();
  });
}
function showDiagQuestion(){
  const stage = $('#diag-stage');
  const result = $('#diag-result');
  result.innerHTML = '';
  if(diagIdx >= diagQueue.length){ finishDiagnosis(); return; }
  const q = diagQueue[diagIdx];
  $('#diag-progress').textContent = `第 ${diagIdx+1} / ${diagQueue.length} 题`;
  const fakeItem = document.createElement('div');
  fakeItem.innerHTML = _renderQuizHTML(q, diagIdx+1);
  stage.innerHTML = fakeItem.innerHTML;
  // 绑定检查按钮
  const item = stage.querySelector('.quiz-item');
  const btn = item.querySelector('.quiz-check');
  btn.addEventListener('click', ()=>{
    const type = item.dataset.type;
    let user, correct=false;
    if(type==='single'){
      const sel = item.querySelector('input:checked');
      user = sel? parseInt(sel.value) : null;
      correct = user===q.answer;
    } else if(type==='multi'){
      user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
      const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
      correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
    } else if(type==='blank'){
      const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
      correct = v===String(q.answer).trim().toLowerCase();
    }
    if(!correct){
      diagWrong.push(q);
      const chain = traceBack(q.relatedConceptId, q.chapterId);
      if(chain.length > 1){
        const links = chain.slice(1).map(({node,kind})=>{
          const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
          return `<div class="diag-remedy-item">建议先学：<a href="${href}">${esc(node.title||node.id)}</a></div>`;
        }).join('');
        $('#diag-result').innerHTML = '<h3>这道题答错了，可能的根因：</h3>' + links +
          '<p><button id="diag-next" class="quiz-check">下一题 →</button></p>';
      } else {
        $('#diag-result').innerHTML = '<p><button id="diag-next" class="quiz-check">下一题 →</button></p>';
      }
    } else {
      $('#diag-result').innerHTML = '<p>✓ 正确。<button id="diag-next" class="quiz-check">下一题 →</button></p>';
    }
    $('#diag-next').addEventListener('click', ()=>{ diagIdx++; showDiagQuestion(); });
  });
}
function _renderQuizHTML(q, idx){
  // 复用服务端渲染的 quiz HTML 结构
  const qtype = q.type||'single';
  const qid = q.id||('diag'+idx);
  let html = `<div class='quiz-item' data-qid='${qid}' data-type='${qtype}' data-concept='${esc(q.relatedConceptId||"")}' data-chapter='${esc(q.chapterId||"")}'>`;
  html += `<p class='quiz-q'><b>Q${idx}.</b> ${esc(q.question||"")}</p>`;
  if(qtype==='single'||qtype==='multi'){
    const it = qtype==='single'?'radio':'checkbox';
    html += "<div class='quiz-opts'>";
    (q.options||[]).forEach((o,i)=>{ html += `<label class='quiz-opt'><input type='${it}' name='${qid}' value='${i}'> ${esc(String(o))}</label>`; });
    html += '</div>';
  } else {
    html += `<input class='quiz-blank' type='text' placeholder='填写答案'>`;
  }
  html += `<div class='quiz-actions'><button class='quiz-check'>检查答案</button><span class='quiz-feedback'></span></div></div>`;

}
function finishDiagnosis(){
  const total = diagQueue.length;
  const wrong = diagWrong.length;
  const right = total - wrong;
  let html = `<h2>诊断完成：${right}/${total} 正确</h2>`;
  if(wrong === 0){
    html += '<p>这组题全对，可以继续往下学。</p>';
  } else {
    html += `<p>有 ${wrong} 道题答错。下面是按依赖链回溯的补强建议：</p>`;
    const seen = new Set();
    diagWrong.forEach(q=>{
      const chain = traceBack(q.relatedConceptId, q.chapterId);
      chain.slice(1).forEach(({node,kind})=>{
        if(seen.has(node.id)) return;
        seen.add(node.id);
        const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
        html += `<div class="diag-remedy-item"><a href="${href}">${esc(node.title||node.id)}</a></div>`;
      });
    });
  }
  html += '<p><button id="diag-restart" class="quiz-check">重新诊断</button></p>';
  $('#diag-stage').innerHTML = '';
  $('#diag-progress').textContent = '';
  $('#diag-result').innerHTML = html;
  $('#diag-restart').addEventListener('click', ()=>{
    $('#diag-start').click();
  });
}

/* ---------- 搜索 v2：分词 + 多词 + 命中定位 ---------- */
let searchIndex = null;
let pendingHl = [];
function hlEscRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function tokenizeQuery(q){
  q = String(q||'').trim().toLowerCase();
  if(!q) return [];
  const STOP = new Set(['的','了','是','在','和','与','我','你','他','它','这','那','有','就','都','而','及','或',
                        '吗','呢','吧','把','被','对','从','到','为','上','下','里','中','个','一',
                        '什么','怎么','为什么','如何','哪些','这个','那个']);
  const raw = q.split(/[^\p{L}\p{N}]+/u).filter(Boolean);
  const out = [];
  for(const w of raw){
    if(STOP.has(w)) continue;
    if(/^\p{Script=Han}+$/u.test(w) && w.length > 2){
      out.push(w);
      for(let i=0;i+2<=w.length;i++) out.push(w.slice(i,i+2));
    } else out.push(w);
  }
  return [...new Set(out)].slice(0,12);
}
function hlSnippet(text, terms){
  const low = text.toLowerCase();
  let pos = -1, hit = '';
  for(const t of terms){ const i = low.indexOf(t); if(i>=0 && (pos<0 || i<pos)){ pos=i; hit=t; } }
  const start = Math.max(0, (pos<0?0:pos) - 60);
  const end = Math.min(text.length, (pos<0?0:pos) + 140);
  let s = esc(text.slice(start,end));
  let budget = 6;                                 // 每段最多标 6 处，避免常见词把片段糊满
  terms.forEach(t=>{
    if(t.length < 1 || budget <= 0) return;
    s = s.replace(new RegExp(hlEscRe(t),'gi'), m=>{
      if(budget <= 0) return m;
      budget--;
      return '<mark class="hl">' + m + '</mark>';
    });
  });
  return '…' + s + '…';
}
function applyPendingHighlight(){
  const terms = pendingHl.slice(); pendingHl = [];
  if(!terms.length) return;
  const root = $('#view'); if(!root) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  let node, first = null, idx = -1, term = '';
  while((node = walker.nextNode())){
    if(!node.nodeValue || !node.nodeValue.trim()) continue;
    const low = node.nodeValue.toLowerCase();
    for(const t of terms){
      const i = low.indexOf(t);
      if(i>=0 && (first===null || i<idx || (i===idx && t.length>term.length))){
        first = node; idx = i; term = t;
      }
    }
  }
  if(!first) return;
  try{
    const i = first.nodeValue.toLowerCase().indexOf(term);
    if(i<0) return;
    const range = document.createRange();
    range.setStart(first, i); range.setEnd(first, i+term.length);
    const mark = document.createElement('mark');
    mark.className = 'hit-hl';
    range.surroundContents(mark);
    mark.scrollIntoView({block:'center'});
    mark.classList.add('hit-flash');
    setTimeout(()=>mark.classList.remove('hit-flash'), 1800);
  }catch(e){}
}
document.addEventListener('click', (e)=>{
  const a = (e.target && e.target.closest) ? e.target.closest('.search-hit a') : null;
  if(a && a.dataset.hl) pendingHl = tokenizeQuery(a.dataset.hl);
});
function searchHref(id){
  const map = {'__path__':'#/path','__diagnosis__':'#/diagnosis','__graph__':'#/graph',
               '__cards__':'#/cards','__glossary__':'#/glossary','__patterns__':'#/patterns',
               '__cheatsheet__':'#/cheatsheet'};
  if(map[id]) return map[id];
  if(id.startsWith('__quiz_')) return '#/quiz/'+id.replace('__quiz_','').replace(/__$/,'');
  if(id.startsWith('__')) return '';
  return '#/'+id;
}
function searchLabel(id){
  if((manifest.chapters||[]).some(c=>c.id===id)) return '章节：'+id;
  if((manifest.concepts||[]).some(c=>c.id===id)) return '概念：'+id;
  const map = {'__path__':'学习路径','__diagnosis__':'诊断测试','__graph__':'知识图谱','__cards__':'抽认卡',
               '__glossary__':'术语表','__patterns__':'模式库','__cheatsheet__':'速查表'};
  if(map[id]) return map[id];
  if(id.startsWith('__quiz_')) return '测验';
  return id;
}
function pageTitle(id){
  const ch = (manifest.chapters||[]).find(c=>c.id===id);
  if(ch) return ch.title || id;
  const cp = (manifest.concepts||[]).find(c=>c.id===id);
  if(cp) return cp.title || id;
  const map = {'__path__':'学习路径','__diagnosis__':'诊断测试','__graph__':'知识图谱','__cards__':'抽认卡',
               '__glossary__':'术语表','__patterns__':'模式库','__cheatsheet__':'速查表'};
  if(map[id]) return map[id];
  if(id.startsWith('__quiz_')){
    const q = (manifest.quizzes||[]).find(x=>'__quiz_'+x.id===id);
    return q ? '测验 · '+String(q.question||'').slice(0,14) : '测验';
  }
  return id;
}
function chapOf(id){
  const chs = manifest.chapters || [];
  const ci = chs.findIndex(c=>c.id===id);
  if(ci >= 0) return {key:'ch:'+id, label:chs[ci].title||id, order:ci};
  const cp = (manifest.concepts||[]).find(c=>c.id===id);
  if(cp){
    const chId = (cp.chapterIds||[])[0];
    const i = chs.findIndex(c=>c.id===chId);
    if(i >= 0) return {key:'ch:'+chId, label:chs[i].title||chId, order:i};
    return {key:'zz', label:'未归入章节', order:900};
  }
  return {key:'tools', label:'术语与工具页', order:950, ref:true};
}
function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  searchIndex = [];
  Object.entries(pages).forEach(([id, htmlText])=>{
    const href = searchHref(id);
    if(!href) return;
    const text = htmlText.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
    searchIndex.push({id, href, text, label:pageTitle(id), chap:chapOf(id)});
  });
  return searchIndex;
}
function synOf(t){
  const out = [];
  for(const g of SYN_GROUPS){ if(g.indexOf(t) >= 0){ for(const x of g){ if(x !== t) out.push(x); } } }
  return out.slice(0,6);
}
$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim();
  if(!v){ showPage(routeIdFromHash()); return; }
  const terms = tokenizeQuery(v);
  if(!terms.length){ showPage(routeIdFromHash()); return; }
  const grams = [];
  terms.forEach(t=>{ if(t.length >= 2){ for(let i=0;i+2<=t.length;i++) grams.push(t.slice(i,i+2)); } });
  const qGrams = [...new Set(grams)].slice(0,16);
  const snippetTerms = terms.concat(...terms.map(synOf)).slice(0,24);
  const hits = [];
  buildSearchIndex().forEach(p=>{
    const low = p.text.toLowerCase();
    let tHit = 0, sHit = 0, gHit = 0, first = '', viaSyn = '';
    for(const t of terms){
      if(low.includes(t)){ tHit++; if(!first) first = t; continue; }
      for(const s of synOf(t)){
        if(low.includes(s)){ sHit++; if(!viaSyn) viaSyn = s; if(!first) first = s; break; }
      }
    }
    for(const gm of qGrams){ if(low.includes(gm)) gHit++; }
    if(tHit > 0 || sHit > 0 || gHit >= 4){
      hits.push({p, score: tHit*100 + sHit*30 + Math.min(gHit,20), first, viaSyn});
    }
  });
  hits.sort((a,b)=> b.score-a.score || a.p.text.length-b.p.text.length);
  const top = hits.slice(0,20);
  let body;
  if(top.length){
    const gs = {};
    top.forEach(h=>{
      const k = h.p.chap.key;
      (gs[k] = gs[k] || {label:h.p.chap.label, order:h.p.chap.order, ref:!!h.p.chap.ref, hits:[]}).hits.push(h);
    });
    const eff = g => Math.max(...g.hits.map(x=>x.score)) * (g.ref ? 0.55 : 1);
    const order = Object.values(gs).sort((a,b)=> eff(b)-eff(a));
    body = order.map(g=>{
      const inner = g.hits.sort((a,b)=> b.score-a.score).map(h=>
        `<div class="search-hit"><a href="${h.p.href}" data-hl="${esc(h.first)}">${esc(h.p.label)}</a>${h.viaSyn?`<span class="syn-note">同义命中：${esc(h.viaSyn)}</span>`:''}<br><span class="sub">${hlSnippet(h.p.text, snippetTerms)}</span></div>`).join('');
      return `<div class="search-group"><div class="grp-head">${esc(g.label)}<span class="grp-count">${g.hits.length}</span></div>${inner}</div>`;
    }).join('');
  } else {
    body = '<div class="empty">未找到相关内容，试试章节名 / 概念名 / 术语，或减少关键词。</div>';
  }
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' + body;
});

/* ---------- Mermaid 懒加载 ---------- */
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  const boot=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      const code=el.textContent;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  const urls=['https://registry.npmmirror.com/mermaid/10.9.1/files/dist/mermaid.min.js',
              'https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js',
              'https://unpkg.com/mermaid@10.9.1/dist/mermaid.min.js'];
  let ui=0, done=false;
  const tryNext=()=>{
    if(done || ui>=urls.length) return;
    const s=document.createElement('script');
    s.src=urls[ui++];
    const timer=setTimeout(()=>{ if(done) return; s.onload=null; s.onerror=null; s.remove(); tryNext(); }, 4000);
    s.onload=()=>{ done=true; clearTimeout(timer); boot(); };
    s.onerror=()=>{ clearTimeout(timer); s.remove(); tryNext(); };
    document.head.appendChild(s);
  };
  tryNext();
}
