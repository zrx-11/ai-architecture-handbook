<code>deepseek-ai/eagle3_qwen3_14b_ttt7</code></td><td>—</td><td>—</td><td>—</td></tr><tr><td><code>deepseek-ai/eagle3_qwen3_4b_ttt7</code></td><td>—</td><td>—</td><td>—</td></tr><tr><td><code>deepseek-ai/eagle3_qwen3_8b_ttt7</code></td><td>—</td><td>—</td><td>—</td></tr></tbody></table>\n<h2>读这张表的三个提醒</h2>\n<ol><li>\n<strong><code>Base</code> / <code>Chat</code> / <code>Instruct</code> 是训练阶段</strong>，不是不同结构。\n</li><li>\n<strong><code>DSpark</code> / <code>DFlash</code> / <code>Eagle3</code> 是投机解码或蒸馏权重</strong>，不是主模型；<code>ESFT-*</code> 是专家微调的门控/token 权重，不是通用对话模型。\n</li><li>\n<strong>许可证逐个看</strong>：MIT、Apache 2.0、DeepSeek Model License 是三套条款，不能一句“开源”带过。\n</ol>\n<h2>复习锚点</h2>\n<ul><li>\n先按家族归类，再看 checkpoint。\n</li><li>\n参数量看总参数，算力看激活参数。\n</li><li>\n新模型卡先看 <code>architectures</code> / <code>model_type</code>。\n</ul>","kind":"chapter","title":"附录：105+ 张模型卡索引"},"ch13":{"html":"<div class=\"source-badge\">出处：https://arxiv.org/abs/2609.19969</div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必</span> <a href=\"#/chapter/ch09\">第 9 章：V4.1：把 KV cache 压到 890 B/token</a></span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必</span> <a href=\"#/chapter/ch12\">附录：105+ 张模型卡索引</a></span></div><h1>第 13 章：手算手册：从参数量到 KV 账</h1>\n<ul><li>\n<strong>难度</strong>：★★☆ | <strong>预估学时</strong>：4 小时 | <strong>前置</strong>：第 3–9 章\n</ul>\n<h2>学习目标</h2>\n<p>学完本章，你能：用层数/隐藏维/专家数粗估总参数与激活参数；用 KV cache 公式算各代单序列显存；用 GRPO 和 Sinkhorn 各手算一遍；解释为什么“参数没翻倍，显存却差一个量级”。</p>\n<h2>一句话核心</h2>\n<p>模型卡上的数字不是背下来的，是算出来的。会算之后，你看到 671B/37B、1.6T/49B、890 B/token，就知道它们在说什么。</p>\n<h2>1. 参数量粗估：先抓大头</h2>\n<p>一个 decoder 层的参数主要来自两块：</p>\n<ul><li>\n注意力：Q/K/V/O 四个投影，约 <span class=\"katex-inline\">4d^2</span>。\n</li><li>\nFFN：SwiGLU 三个矩阵，约 <span class=\"katex-inline\">3d\\,d_{ff}</span>；dense 模型通常 <span class=\"katex-inline\">d_{ff}\\approx\\frac{8}{3}d</span>，所以约 <span class=\"katex-inline\">8d^2</span>。\n</ul>\n<p>dense 模型粗估：</p>\n<div class=\"katex-block\">N\\approx L(4d^2+8d^2)=12Ld^2</div>\n<p>MoE 模型粗估：</p>\n<div class=\"katex-block\">N\\approx L(4d^2)+L_{\\text{moe}}\\left(N_{\\text{routed}}+N_{\\text{shared}}\\right)3d\\,d_{\\text{expert}}</div>\n<p>其中 <span class=\"katex-inline\">L_{\\text{moe}}</span> 是真正带 MoE 的层数。V3 前 3 层是 dense FFN，所以 <span class=\"katex-inline\">L_{\\text{moe}}=58</span>，不是 61。这个细节会让估算从“差 5%”变成“差 2%”。</p>\n<h2>2. V3 的 671B 怎么来的</h2>\n<p>V3：<span class=\"katex-inline\">d=7168</span>，<span class=\"katex-inline\">L=61</span>，<span class=\"katex-inline\">L_{\\text{moe}}=58</span>，路由专家 256，共享 1，专家中间维 2048。</p>\n<p>注意力：</p>\n<div class=\"katex-block\">61\\times4\\times7168^2=61\\times205{,}520{,}896\\approx12.54\\text{B}</div>\n<p>单个专家：</p>\n<div class=\"katex-block\">3\\times7168\\times2048=44{,}040{,}192\\approx44.04\\text{M}</div>\n<p>路由专家总量：</p>\n<div class=\"katex-block\">58\\times256\\times44.04\\text{M}\\approx653.9\\text{B}</div>\n<p>共享专家：</p>\n<div class=\"katex-block\">58\\times1\\times44.04\\text{M}\\approx2.55\\text{B}</div>\n<p>合计：</p>\n<div class=\"katex-block\">12.54+653.9+2.55\\approx669.0\\text{B}</div>\n<p>再加 embedding、norm、门控、MTP 等，落在 671B 附近。注意这里没把 MTP 的 14B 算进主模型；HuggingFace 的 685B 才是“主模型 + MTP”。</p>\n<h2>3. V3 的 37B 激活怎么来的</h2>\n<p>激活参数 = 全部注意力 + top-k 专家 + 共享专家 + embedding/门控。</p>\n<p>top-8 路由：</p>\n<div class=\"katex-block\">58\\times8\\times44.04\\text{M}\\approx20.43\\text{B}</div>\n<p>加上共享 2.55B、注意力 12.54B、embedding 约 0.13B：</p>\n<div class=\"katex-block\">12.54+20.43+2.55+0.13\\approx35.65\\text{B}</div>\n<p>与官方 37B 的差额来自 MLA 的投影矩阵、门控、norm 等。粗估能到 36B 左右，说明你抓住了大头。</p>\n<h2>4. V4-Pro 与 V4-Flash 的粗估</h2>\n<p>V4-Pro：<span class=\"katex-inline\">d=7168</span>，<span class=\"katex-inline\">L=61</span>，384 路由 + 1 共享，专家中间维 3072。</p>\n<p>单专家：</p>\n<div class=\"katex-block\">3\\times7168\\times3072\\approx66.06\\text{M}</div>\n<p>路由专家：</p>\n<div class=\"katex-block\">61\\times384\\times66.06\\text{M}\\approx1{,}547\\text{B}</div>\n<p>加注意力 12.54B、共享 4.03B，约 1.56T；官方 1.6T，差额在投影、embedding、门控等。</p>\n<p>V4-Flash：<span class=\"katex-inline\">d=4096</span>，<span class=\"katex-inline\">L=43</span>，256 路由 + 1 共享，专家中间维 2048。</p>\n<p>单专家：</p>\n<div class=\"katex-block\">3\\times4096\\times2048\\approx25.17\\text{M}</div>\n<p>路由专家：</p>\n<div class=\"katex-block\">43\\times256\\times25.17\\text{M}\\approx277.1\\text{B}</div>\n<p>加注意力 2.89B、共享 1.08B，约 281B；官方 284B。粗估误差在 1% 左右，比按 40 层算更准。</p>\n<p>V4.1-Flash：<span class=\"katex-inline\">d=5120</span>，<span class=\"katex-inline\">L=40</span>，384 路由 + 1 共享，专家中间维 2304。</p>\n<p>注意力：</p>\n<div class=\"katex-block\">40\\times4\\times5120^2\\approx4.19\\text{B}</div>\n<p>单专家：</p>\n<div class=\"katex-block\">3\\times5120\\times2304\\approx35.39\\text{M}</div>\n<p>路由专家：</p>\n<div class=\"katex-block\">40\\times384\\times35.39\\text{M}\\approx543.6\\text{B}</div>\n<p>加共享 1.42B、注意力 4.19B、embedding 约 0.66B，约 549.3B；官方 552B 主干。这个估算和官方口径只差 0.5%，说明配置字段读对了。</p>\n<h2>5. KV cache：四种公式</h2>\n<h3>5.1 MHA</h3>\n<p>每 token 每层：</p>\n<div class=\"katex-block\">2\\times h\\times d_h\\times b</div>\n<p><span class=\"katex-inline\">h</span> 是头数，<span class=\"katex-inline\">d_h</span> 是每头维度，<span class=\"katex-inline\">b</span> 是每元素字节（BF16=2）。</p>\n<h3>5.2 GQA</h3>\n<div class=\"katex-block\">2\\times g\\times d_h\\times b</div>\n<p><span class=\"katex-inline\">g</span> 是 KV 组数。DeepSeek-LLM 67B 的 <span class=\"katex-inline\">g=8</span>，是 MHA 的 1/8。</p>\n<h3>5.3 MLA</h3>\n<div class=\"katex-block\">(\\text{kv\\_lora\\_rank}+\\text{qk\\_rope\\_head\\_dim})\\times b</div>\n<p>V2/V3 是 <span class=\"katex-inline\">(512+64)\\times2=1152</span> B/token/层。</p>\n<h3>5.4 全局 KV（V4/V4.1）</h3>\n<p>论文直接给每 token 字节数，例如 V4.1 的 890 B/token、V3.2 的 48,068 B/token。这个数已经跨层、跨压缩路径汇总，不要再乘层数。</p>\n<h2>6. 各代单序列 KV 账</h2>\n<table><thead><tr><th>模型</th><th>每 token 每层</th><th>层数</th><th>每 token</th><th>128K 单序列</th><th>1M 单序列</th></tr></thead><tbody><tr><td>V2</td><td>1152 B</td><td>60</td><td>69,120 B</td><td>9.06 GB</td><td>72.4 GB</td></tr><tr><td>V3</td><td>1152 B</td><td>61</td><td>70,272 B</td><td>9.21 GB</td><td>73.6 GB</td></tr><tr><td>V3.2</td><td>全局 48,068 B</td><td>—</td><td>48,068 B</td><td>6.30 GB</td><td>48.1 GB</td></tr><tr><td>V4.1</td><td>全局 890 B</td><td>—</td><td>890 B</td><td>0.117 GB</td><td>0.89 GB</td></tr></tbody></table>\n<p>1M 的 V3 单序列约 73.6 GB，50 并发就是 3.68 TB；V4.1 的 1M 单序列 0.89 GB，50 并发 44.5 GB。差的是两个数量级，不是“窗口大一点”。</p>\n<p>计算时注意 GB/GiB：按十进制 GB 算是上面的数；按 GiB 会小 7% 左右。工程上留 20% 余量，别卡着算。</p>\n<h2>7. DSA 的复杂度账</h2>\n<p>全注意力每层是 <span class=\"katex-inline\">O(L^2)</span> 对。1M 上下文：</p>\n<div class=\"katex-block\">L^2=10^{12}</div>\n<p>DSA 每层精算 <span class=\"katex-inline\">Lk</span>，取 <span class=\"katex-inline\">k=2048</span>：</p>\n<div class=\"katex-block\">Lk=10^6\\times2048=2.048\\times10^9</div>\n<p>比值：</p>\n<div class=\"katex-block\">\\frac{10^{12}}{2.048\\times10^9}\\approx488</div>\n<p>也就是说，精算阶段的配对数量少约 488 倍。索引器仍要对历史 token 打分，不是零成本；它的维度小、实现轻，但仍然是 <span class=\"katex-inline\">O(L)</span> 级别的扫描。所以 DSA 的端到端加速小于 488 倍，论文报的是整体吞吐/价格改善。</p>\n<h2>8. CSA/HCA 的压缩率</h2>\n<p>CSA <span class=\"katex-inline\">m=4</span>：1M token 压成 250k 个条目，压缩率 75%。top-k=1024 时，每个 query 只看 1024/250k≈0.41% 的条目。</p>\n<p>HCA <span class=\"katex-inline\">m&#x27;=128</span>：1M token 压成 7,813 个块，压缩率 99.2%。它负责极远端，不负责局部细节。</p>\n<p>SWA 128：最近 128 token 精确计算，保代码括号、实体名这类细节。</p>\n<p>三条路径不是三选一，而是按距离分层。只用 HCA 会丢细节，只用 SWA 覆盖不了 1M。</p>\n<h2>9. GRPO 手算</h2>\n<p>四个回答奖励 <span class=\"katex-inline\">[1,0,0,-1]</span>：</p>\n<p>均值：</p>\n<div class=\"katex-block\">\\frac{1+0+0-1}{4}=0</div>\n<p>标准差：</p>\n<div class=\"katex-block\">\\sqrt{\\frac{(1-0)^2+0+0+(-1-0)^2}{4}}=\\sqrt{0.5}\\approx0.707</div>\n<p>优势：</p>\n<div class=\"katex-block\">\\left[\\frac{1}{0.707},0,0,\\frac{-1}{0.707}\\right]\\approx[1.414,0,0,-1.414]</div>\n<p>四个全 1：均值 1，标准差 0，优势全 0，没有梯度。四个 <span class=\"katex-inline\">[1,1,0,0]</span>：均值 0.5，标准差 0.5，优势 <span class=\"katex-inline\">[1,1,-1,-1]</span>。</p>\n<p>这解释了两件事：全对/全错的题不产生学习信号；组内要有区分度，RL 才转得动。</p>\n<h2>10. Sinkhorn 手算一个 3×3</h2>\n<p>初始矩阵：</p>\n<div class=\"katex-block\">M=\\begin{bmatrix}1&2&0\\\\3&1&1\\\\0&2&1\\end{bmatrix}</div>\n<p>行归一化：</p>\n<div class=\"katex-block\">\\begin{bmatrix}0.333&0.667&0\\\\0.6&0.2&0.2\\\\0&0.667&0.333\\end{bmatrix}</div>\n<p>列归一化：</p>\n<div class=\"katex-block\">\\begin{bmatrix}0.357&0.435&0\\\\0.643&0.130&0.375\\\\0&0.435&0.625\\end{bmatrix}</div>\n<p>再做一轮行归一化：</p>\n<div class=\"katex-block\">\\begin{bmatrix}0.451&0.549&0\\\\0.560&0.113&0.327\\\\0&0.410&0.590\\end{bmatrix}</div>\n<p>两三轮后每行、每列都接近 1。V4 的 mHC 重复 20 次，是为了让混合矩阵稳定满足双随机约束。</p>\n<h2>11. 训练显存粗估</h2>\n<p>训练显存的大头：</p>\n<div class=\"katex-block\">\\text{权重}+\\text{梯度}+\\text{优化器状态}+\\text{激活}+\\text{通信缓冲}</div>\n<p>以 BF16 + Adam 为例，每个参数约 2（权重）+2（梯度）+4（Adam m）+4（Adam v）=12 B；混合精度再加一份 FP32 主权重，约 16 B/参数。671B 全量训练，光权重/梯度/优化器就约 10.7 TB，必须并行切分。</p>\n<p>推理显存则主要是权重 + KV cache + 激活。671B BF16 约 1.34 TB；FP8 约 671 GB；4-bit 约 335 GB。MoE 还要加上专家并行/offload 的开销。</p>\n<p>这些数字是量级估算，不是某张卡的实测。目的是让你在看部署方案时，知道瓶颈在权重、KV 还是通信。</p>\n<h2>12. 15 道计算题（答案在题后）</h2>\n<ol><li>\n7B dense，30 层，4096 维，粗估参数量。\n</li><li>\nV3 注意力部分多少 B？\n</li><li>\nV3 单个专家多少 M？\n</li><li>\nV3 top-8 路由专家激活多少 B？\n</li><li>\nV3 每 token 每层 MLA 缓存多少字节？\n</li><li>\nV3 128K 单序列 KV 多少 GB？\n</li><li>\nV4.1 1M 单序列全局 KV 多少 MB？\n</li><li>\nV4.1 50 并发 1M 多少 GB？\n</li><li>\n1M 全注意力配对数多少？\n</li><li>\nDSA k=2048 时精算配对数多少？\n</li><li>\nCSA m=4 压缩率多少？\n</li><li>\nHCA m&#x27;=128 压缩率多少？\n</li><li>\nGRPO 奖励 [1,1,0,0] 的优势是多少？\n</li><li>\nSinkhorn 第一步先做什么归一化？\n</li><li>\n671B BF16 推理权重约多少 TB？\n</ol>\n<p>答案：</p>\n<ol><li>\n<span class=\"katex-inline\">12\\times30\\times4096^2\\approx6.04</span>B（加 embedding 约 6.2B）。\n</li><li>\n<span class=\"katex-inline\">61\\times4\\times7168^2\\approx12.54</span>B。\n</li><li>\n<span class=\"katex-inline\">3\\times7168\\times2048\\approx44.04</span>M。\n</li><li>\n<span class=\"katex-inline\">58\\times8\\times44.04\\text{M}\\approx20.43</span>B。\n</li><li>\n<span class=\"katex-inline\">(512+64)\\times2=1152</span> B。\n</li><li>\n<span class=\"katex-inline\">70{,}272\\times131{,}072\\approx9.21</span> GB。\n</li><li>\n<span class=\"katex-inline\">890\\times10^6=890</span> MB。\n</li><li>\n<span class=\"katex-inline\">890\\text{MB}\\times50=44.5</span> GB。\n</li><li>\n<span class=\"katex-inline\">10^{12}</span>。\n</li><li>\n<span class=\"katex-inline\">2.048\\times10^9</span>。\n</li><li>\n75%。\n</li><li>\n99.2%。\n</li><li>\n均值 0.5，标准差 0.5，优势 <span class=\"katex-inline\">[1,1,-1,-1]</span>。\n</li><li>\n行归一化。\n</li><li>\n<span class=\"katex-inline\">671\\times2=1{,}342</span> GB≈1.34 TB。\n</ol>\n<h2>13. 常见误解</h2>\n<ul><li>\n别以为参数量估算要精确到个位——抓住注意力、专家、共享三块，误差 10% 以内就够用。\n</li><li>\n别以为 KV cache 只跟上下文有关——它跟层数、头数、每头维度、精度都有关。\n</li><li>\n别以为 DSA 的 488 倍就是端到端加速——索引器、内核、带宽都会吃掉一部分。\n</li><li>\n别以为训练显存 = 推理显存——训练多梯度、优化器状态、激活，通常是推理的几倍。\n</ul>\n<h2>14. 复习锚点</h2>\n<ul><li>\ndense 粗估 <span class=\"katex-inline\">12Ld^2</span>；MoE 加专家项，注意 <code>first_k_dense_replace</code>。\n</li><li>\nV3 的 671B = 注意力 12.54B + 路由 653.9B + 共享 2.55B 左右。\n</li><li>\nV3 的 37B 激活 = 注意力 + top-8 路由 + 共享。\n</li><li>\nMLA 每 token 每层 1152 B；V3 128K 约 9.21 GB。\n</li><li>\nV4.1 1M 单序列 890 MB；50 并发 44.5 GB。\n</ul>","kind":"chapter","title":"第 13 章：手算手册：从参数量到 KV 账"},"ch14":{"html":"<div class=\"source-badge\">出处：https://huggingface.co/deepseek-ai</div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必</span> <a href=\"#/chapter/ch09\">第 9 章：V4.1：把 KV cache 压到 890 B/token</a></span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必</span> <a href=\"#/chapter/ch13\">第 13 章：手算手册：从参数量到 KV 账</a></span></div><h1>第 14 章：源码地图：拿到 config.json 和 modeling 文件怎么读</h1>\n<ul><li>\n<strong>难度</strong>：★★☆ | <strong>预估学时</strong>：3 小时 | <strong>前置</strong>：第 4–9 章、第 13 章\n</ul>\n<h2>学习目标</h2>\n<p>学完本章，你能：从 <code>config.json</code> 的字段反推模型结构；按 forward 顺序找到 MLA、MoE、MTP 的实现位置；用 20 行伪代码复述 MLA 和 MoE；判断哪些代有公开代码、哪些只能读论文。</p>\n<h2>一句话核心</h2>\n<p>读源码不要从第一行读到最后一行。先读 <code>config.json</code> 拿到形状，再按“embedding → attention → MoE → norm → lm_head”的顺序找类，最后看 cache 和并行。</p>\n<h2>1. 公开代码覆盖到哪</h2>\n<table><thead><tr><th>代</th><th>公开 <code>modeling_*.py</code></th><th>说明</th></tr></thead><tbody><tr><td>DeepSeek-LLM / Coder</td><td>有</td><td>LLaMA 式实现，结构简单</td></tr><tr><td>DeepSeekMoE 16B</td><td>有</td><td><code>DeepseekForCausalLM</code>，MLA 之前的 MoE</td></tr><tr><td>V2 / V2-Lite / Coder-V2</td><td>有</td><td><code>DeepseekV2ForCausalLM</code>，MLA 首次完整公开</td></tr><tr><td>V3 / V3.1</td><td>有</td><td><code>DeepseekV3ForCausalLM</code>，含 MTP、无辅助损失均衡</td></tr><tr><td>V3.2</td><td>部分</td><td><code>DeepseekV32ForCausalLM</code>，DSA 的实现细节以技术报告为主</td></tr><tr><td>V4 / V4.1</td><td>以技术报告为主</td><td>权重和配置公开，训练/推理框架未逐行公开</td></tr></tbody></table>\n<p>“权重公开”不等于“训练代码公开”。V4/V4.1 的 <code>config.json</code> 能告诉你形状，但 CSA/HCA、CED、Engram 的 kernel 级实现不一定在仓库里。</p>\n<h2>1.1 读模型卡的顺序</h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n  A[&quot;HuggingFace 模型卡 README&quot;] --&gt; B[&quot;config.json&quot;]\n  B --&gt; C[&quot;architectures / num_hidden_layers / hidden_size&quot;]\n  C --&gt; D[&quot;attention 字段：heads / head_dim / kv_lora_rank&quot;]\n  D --&gt; E[&quot;moe 字段：n_routed_experts / top-k / moe_intermediate_size&quot;]\n  E --&gt; F[&quot;context / rope / sliding_window&quot;]\n  F --&gt; G[&quot;license / 论文链接&quot;]\n  G --&gt; H[&quot;modeling_*.py：forward 七步&quot;]\n  H --&gt; I[&quot;MLA / MoE / MTP / DSA / CSA 的实现位置&quot;]</div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。</p>\n<p>看图说明：先读模型卡，再读 <code>config.json</code>，最后才进 <code>modeling_*.py</code>。顺序反了会被几千行 Python 淹掉；先有字段地图，代码只是字段的实现。</p>\n<h2>2. config.json 的字段地图</h2>\n<p>拿到一份 <code>config.json</code>，先看这十几个字段：</p>\n<table><thead><tr><th>字段</th><th>含义</th><th>典型值</th></tr></thead><tbody><tr><td><code>architectures</code></td><td>模型类名</td><td><code>DeepseekV3ForCausalLM</code></td></tr><tr><td><code>num_hidden_layers</code></td><td>层数</td><td>61</td></tr><tr><td><code>hidden_size</code></td><td>隐藏维</td><td>7168</td></tr><tr><td><code>num_attention_heads</code></td><td>查询头数</td><td>128</td></tr><tr><td><code>num_key_value_heads</code></td><td>KV 头数（GQA）</td><td>1 或 8</td></tr><tr><td><code>kv_lora_rank</code></td><td>MLA 潜向量维度</td><td>512</td></tr><tr><td><code>qk_nope_head_dim</code></td><td>非 RoPE 部分维度</td><td>128</td></tr><tr><td><code>qk_rope_head_dim</code></td><td>RoPE 部分维度</td><td>64</td></tr><tr><td><code>v_head_dim</code></td><td>V 每头维度</td><td>128</td></tr><tr><td><code>n_routed_experts</code></td><td>路由专家数</td><td>256</td></tr><tr><td><code>n_shared_experts</code></td><td>共享专家数</td><td>1</td></tr><tr><td><code>num_experts_per_tok</code></td><td>top-k</td><td>8</td></tr><tr><td><code>moe_intermediate_size</code></td><td>专家中间维</td><td>2048</td></tr><tr><td><code>first_k_dense_replace</code></td><td>前几层是 dense</td><td>3</td></tr><tr><td><code>max_position_embeddings</code></td><td>最大位置</td><td>163840</td></tr></tbody></table>\n<p>看到 <code>architectures</code> 先判断代际：<code>DeepseekV2ForCausalLM</code> 是 V2，<code>DeepseekV3ForCausalLM</code> 是 V3/V3.1，<code>DeepseekV32ForCausalLM</code> 是 V3.2，<code>DeepseekV4ForCausalLM</code> 是 V4，<code>DeepseekV41ForCausalLM</code> 是 V4.1。</p>\n<h2>3. forward 的七步</h2>\n<p>不管哪一代，主干基本都是这个顺序：</p>\n<pre class=\"lang-text\"><code>input_ids\n  → token embedding\n  → N 个 decoder layer\n      → RMSNorm\n      → attention（MLA / DSA / CSA）\n      → residual\n      → RMSNorm\n      → FFN（dense 或 MoE）\n      → residual\n  → final RMSNorm\n  → lm_head\n  → logits</code></pre>\n<p>不同代改的是中间两个块：</p>\n<ul><li>\nV2/V3：attention 是 MLA，FFN 是 DeepSeekMoE。\n</li><li>\nV3.2：attention 里多一个 DSA 索引器 + top-k。\n</li><li>\nV4：attention 里多 token 压缩（CSA/HCA），残差是 mHC。\n</li><li>\nV4.1：编码器/解码器分开，解码器 KV 由编码器末端投影。\n</ul>\n<h2>4. MLA 的 20 行伪代码</h2>\n<pre class=\"lang-python\"><code># x: [B, L, d]\nq_a = linear(x, W_q_a)          # d -&gt; q_lora_rank\nq = linear(q_a, W_q_b)          # -&gt; heads * (qk_nope + qk_rope)\nkv_a = linear(x, W_kv_a)        # d -&gt; kv_lora_rank + qk_rope\nc, k_pe = split(kv_a, [kv_lora_rank, qk_rope])\nkv = linear(c, W_kv_b)          # -&gt; heads * (qk_nope + v_head)\nk_nope, v = split(kv, [qk_nope, v_head])\nk = concat(k_nope, broadcast(k_pe), dim=-1)\nq = concat(q_nope, q_pe, dim=-1)\nscores = q @ k.transpose(-1, -2) / sqrt(d_head)\nattn = softmax(scores)\nout = attn @ v\nout = linear(out, W_o)\n# cache: c and k_pe only</code></pre>\n<p>关键点：<code>c</code> 和 <code>k_pe</code> 是缓存内容；<code>k_nope</code>、<code>v</code> 是计算时从 <code>c</code> 上投影还原出来的，不持久存。</p>\n<h2>5. DeepSeekMoE 的 15 行伪代码</h2>\n<pre class=\"lang-python\"><code># x: [B, L, d]\ngate_logits = linear(x, W_gate)          # [B, L, n_routed]\nscores = softmax(gate_logits)\ntopk_val, topk_idx = topk(scores, k)\n# 共享专家始终算\nshared = shared_expert(x)\n# 路由专家只算 top-k\nrouted = 0\nfor i in topk_idx:\n    routed += gate_weight[i] * expert_i(x)\nout = shared + routed</code></pre>\n<p>V3 的无辅助损失均衡在门控分数上加一个可学习偏置 <code>b_i</code>，只影响 top-k 选择，不影响选中后的加权。代码里通常能看到 <code>e_score_correction_bias</code> 这类参数。</p>\n<h2>6. MTP 的位置</h2>\n<p>MTP 不是主干的一层，而是挂在主干 hidden state 上的额外预测头。训练时：</p>\n<pre class=\"lang-text\"><code>h_t = backbone(x_t)\nlogits_t1 = lm_head(h_t)\nh_t2 = mtp_block(h_t, embedding(x_{t+1}))\nlogits_t2 = lm_head(h_t2)\nloss = CE(logits_t1, x_{t+1}) + lambda * CE(logits_t2, x_{t+2})</code></pre>\n<p>HuggingFace 权重里那 14B 就是 <code>mtp_block</code> 的参数。推理不用投机解码时，可以只加载主干。</p>\n<h2>7. DSA 的代码位置</h2>\n<p>DSA 在 attention 里多两个东西：</p>\n<ol><li>\n<strong>indexer</strong>：给 query 和历史 token 打分。\n</li><li>\n<strong>top-k gather</strong>：只取分数最高的 k 个 K/V 做注意力。\n</ol>\n<p>伪代码：</p>\n<pre class=\"lang-python\"><code>score = indexer(q, k_cache)          # [B, L, L_hist]\ntopk = topk(score, k)\nk_sel = gather(k_cache, topk)\nv_sel = gather(v_cache, topk)\nattn = softmax(q @ k_sel.transpose(-1, -2)) @ v_sel</code></pre>\n<p>它不改 MLP，也不改 embedding；改的是 attention 的读取范围。</p>\n<h2>8. V4.1 的 CED / CSA2 / Engram 在代码里长什么样</h2>\n<p>这三块公开代码不完整，只能按论文描述给出“结构位置”：</p>\n<ul><li>\n<strong>CED</strong>：模型分成 encoder 20 层、decoder 20 层；decoder 的全局 KV 由 <code>H20 @ W_l^KV</code> 得到。代码里会看到两个 stack，而不是一个 40 层 stack。\n</li><li>\n<strong>CSA2</strong>：attention 里多一个 <code>mode</code> 选择（Full/Reindex/Reuse），以及跨层传递的 KV/index 缓存。\n</li><li>\n<strong>Engram</strong>：embedding 旁边多一个 N-gram 哈希表，查表结果拼进 hidden state；它不是 FFN，也不是 attention。\n</ul>\n<p>读 V4.1 的 <code>config.json</code> 时，重点看 <code>num_hidden_layers</code> 是不是 40、是否有 <code>engram</code> 相关字段、<code>kv_lora_rank</code> 是否变小。不要拿 V3 的 61 层去套。</p>\n<h2>9. 读模型卡的顺序</h2>\n<ol><li>\n<code>config.json</code>：确认 <code>architectures</code>、层数、隐藏维、专家数、上下文。\n</li><li>\n<code>README.md</code>：确认训练 token、许可证、评测口径。\n</li><li>\n<code>modeling_*.py</code>：确认 attention/MoE 的实现细节。\n</li><li>\n<code>generation_config.json</code>：确认默认解码参数、是否支持思考模式。\n</li><li>\n<code>tokenizer_config.json</code>：确认模板、特殊 token、上下文上限。\n</ol>\n<p>五份文件读完，基本能判断“这张卡能不能跑、要怎么跑、跑出来是什么”。</p>\n<h2>10. 常见误解</h2>\n<ul><li>\n别以为 <code>config.json</code> 里 <code>num_hidden_layers=61</code> 就是 61 层全 MoE——还要看 <code>first_k_dense_replace</code>。\n</li><li>\n别以为 <code>num_key_value_heads=1</code> 就是 MQA——MLA 的 KV 压缩不走 GQA/MQA 那套，<code>kv_lora_rank</code> 才是关键。\n</li><li>\n别以为 HuggingFace 权重总量就是主模型——V3 的 685B 含 MTP，V4.1 的 763B 含 Engram。\n</li><li>\n别以为 V4/V4.1 的代码和 V3 一样能直接跑——结构类名、层数、KV 路径都变了。\n</ul>\n<h2>11. 自测题</h2>\n<ol><li>\n<code>architectures</code> 是 <code>DeepseekV32ForCausalLM</code>，最可能是哪代？（答案：C；解析：V3.2-Exp/V3.2 的结构标识。）\n<ul>\n<li>\nA. V2　B. V3　C. V3.2　D. V4\n</li><li>\nMLA 缓存的两个张量是什么？（答案：A；解析：潜向量 c 和 RoPE key。）\n</li><li>\nA. c 和 k_pe　B. q 和 k　C. k_nope 和 v　D. 全部 K/V\n</li><li>\nV3 的 <code>first_k_dense_replace=3</code> 意味着什么？（答案：B；解析：前 3 层是 dense FFN，之后才是 MoE。）\n</li><li>\nA. 前 3 层是 MoE　B. 前 3 层是 dense　C. 只有 3 层　D. 3 个共享专家\n</ul>\n</ol>\n<h2>12. 复习锚点</h2>\n<ul><li>\n先读 <code>config.json</code>，再读 <code>modeling</code>；不要从第一行读到最后一行。\n</li><li>\nMLA 缓存 <code>c</code> 和 <code>k_pe</code>，<code>k_nope/v</code> 是计算时还原的。\n</li><li>\nMoE 门控先 softmax 再 top-k；V3 的偏置只影响选择。\n</li><li>\nMTP 是挂在 hidden state 上的额外头，不是主干层。\n</li><li>\nV3.2 之后的结构，代码覆盖不完整，以技术报告为准。\n</ul>","kind":"chapter","title":"第 14 章：源码地图：拿到 config.json 和 modeling 文件怎么读"},"c01":{"html":"<div class=\"source-badge\">出处：https://arxiv.org/abs/2401.06066</div><h1>稠密模型与 MoE</h1>\n<ul><li>\n<strong>难度</strong>：基础 | <strong>涉及章节</strong>：第 1–4 章\n</ul>\n<h2>一句话定义</h2>\n<p>稠密模型每个 token 都走同一套 FFN；MoE 把 FFN 拆成多个专家，每个 token 只走其中一部分。</p>\n<h2>为什么重要</h2>\n<p>这是 DeepSeek 从第一代走到 V2/V3 的主线。不理解稠密与 MoE 的差别，就看不懂“总参数 671B、激活 37B”这类数字。</p>\n<h2>图示</h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[&quot;稠密：所有 token 走同一个 FFN&quot;] --&gt; B[&quot;算力 = 参数量&quot;]\n  C[&quot;MoE：token 选 top-k 专家&quot;] --&gt; D[&quot;算力 = 激活参数&quot;]\n  C --&gt; E[&quot;显存 = 总参数&quot;]</div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。</p>\n<h2>详解</h2>\n<p>稠密模型的 FFN 是一个固定矩阵，所有 token 都经过它。参数量多大，每个 token 的矩阵乘法就多大，算力和显存基本同向增长。</p>\n<p>MoE 的 FFN 由多个专家组成，门控给每个 token 选 top-k 个专家。总参数包含所有专家，显存要全装；但每个 token 只算被选中的专家，算力按激活参数估。DeepSeekMoE 16B 是 16B 总参数、2.8B 激活；V3 是 671B 总参数、37B 激活。</p>\n<p>MoE 的代价是路由、负载均衡、专家并行通信；收益是同样算力下容量更大。它适合“显存宽裕、算力紧张”的推理场景，不适合显存受限的单机。</p>\n<h2>常见误解</h2>\n<ul><li>\n别以为 MoE 每个 token 都算所有专家——只算 top-k。\n</li><li>\n别以为总参数大就一定慢——算力看激活参数，但显存和通信会拖后腿。\n</li><li>\n别以为专家越多越好——路由组合爆炸、负载不均、通信成本都会上升。\n</ul>\n<h2>在书中出现的脉络</h2>\n<table><thead><tr><th>章节</th><th>语境</th><th>关键结论</th></tr></thead><tbody><tr><td>第 3 章</td><td>DeepSeekMoE</td><td>细粒度专家 + 共享专家</td></tr><tr><td>第 4 章</td><td>V2</td><td>160 路由 + 2 共享</td></tr><tr><td>第 5 章</td><td>V3</td><td>256 路由 + 1 共享，top-8</td></tr></tbody></table>\n<h2>相关概念</h2>\n<ul><li>\n前置：FFN、门控\n</li><li>\n后续：总参数与激活参数、DeepSeekMoE、负载均衡\n</ul>","kind":"concept","title":"稠密模型与 MoE"},"c02":{"html":"<div class=\"source-badge\">出处：https://arxiv.org/abs/2412.19437</div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必</span> <a href=\"#/concept/c01\">稠密模型与 MoE</a></span></div><h1>总参数与激活参数</h1>\n<ul><li>\n<strong>难度</strong>：基础 | <strong>涉及章节</strong>：第 3–5 章、第 8–9 章\n</ul>\n<h2>一句话定义</h2>\n<p>总参数是模型权重总量，决定显存；激活参数是每个 token 实际参与计算的权重，决定算力。</p>\n<h2>为什么重要</h2>\n<p>DeepSeek 的模型卡经常同时写两个数：671B/37B、1.6T/49B、552B 主干 + 196B Engram / 8B prefill。不分开看，就会把显存和算力估错。</p>\n<h2>详解</h2>\n<p>稠密模型的总参数和激活参数相同。MoE 不同：所有专家都要存，但每个 token 只走 top-k。V3 的 671B 是总参数，37B 是激活；显存按 671B 估，算力按 37B 估。</p>\n<p>还有第三种口径：HuggingFace 权重总量。V3 的 HF 总大小 685B = 671B 主模型 + 14B MTP。V4.1 的 763B = 552B 主干 + 196B Engram。这些“总权重”不等于“激活参数”。</p>\n<p>估算公式：</p>\n<div class=\"katex-block\">ext{显存} \u0007pprox \text{总参数}\times\text{每参数字节}+\text{KV cache}+\text{激活}</div>\n<div class=\"katex-block\">ext{算力} \u0007pprox \text{激活参数}\times2\times\text{token 数}</div>\n<h2>常见误解</h2>\n<ul><li>\n别以为 685B 是 V3 的主模型——其中 14B 是 MTP。\n</li><li>\n别以为 763B 是 V4.1 的激活——激活是 8B/16B。\n</li><li>\n别以为 MoE 显存可以只装激活专家——路由到哪个专家不确定，通常要全装或 offload。\n</ul>\n<h2>在书中出现的脉络</h2>\n<table><thead><tr><th>章节</th><th>语境</th><th>关键结论</th></tr></thead><tbody><tr><td>第 3 章</td><td>MoE 16B</td><td>16B 总 / 2.8B 激活</td></tr><tr><td>第 5 章</td><td>V3</td><td>671B 总 / 37B 激活；HF 685B 含 MTP</td></tr><tr><td>第 9 章</td><td>V4.1</td><td>552B 主干 + 196B Engram；8B/16B 激活</td></tr></tbody></table>\n<h2>相关概念</h2>\n<ul><li>\n前置：稠密模型与 MoE\n</li><li>\n后续：KV cache、专家并行\n</ul>","kind":"concept","title":"总参数与激活参数"},"c03":{"html":"<div class=\"source-badge\">出处：https://arxiv.org/abs/2401.02954</div><h1>GQA（分组查询注意力）</h1>\n<ul><li>\n<strong>难度</strong>：基础 | <strong>涉及章节</strong>：第 2 章\n</ul>\n<h2>一句话定义</h2>\n<p>GQA 让多个查询头共享一组 K/V，减少 KV cache 和注意力带宽。</p>\n<h2>为什么重要</h2>\n<p>DeepSeek-LLM 67B 用 64 个查询头、8 个 KV 头，这是第一代省显存的关键。理解 GQA，才能理解后面 MLA 为什么要走另一条路。</p>\n<h2>详解</h2>\n<p>标准 MHA：每个查询头都有自己的 K/V，KV cache 每 token 每层是 <span class=\"katex-inline\">2hd_h</span> 个数。GQA 把 <span class=\"katex-inline\">h</span> 个查询头分成 <span class=\"katex-inline\">g</span> 组，每组共享一套 K/V，KV cache 降到 <span class=\"katex-inline\">2gd_h</span>。</p>\n<p>67B 的 <span class=\"katex-inline\">h=64,g=8</span>，KV cache 是 MHA 的 1/8。查询头仍然有 64 个，表达能力保留一部分；K/V 投影矩阵变小，推理带宽下降。</p>\n<p>代价是多个查询头看到同一组 K/V，模型容量受影响。GQA 是在 MHA 和 MQA（只有 1 组 KV）之间的折中。</p>\n<h2>常见误解</h2>\n<ul><li>\n别以为 GQA 是“只有 8 个头”——查询头还是 64 个。\n</li><li>\n别以为 GQA 只省显存——它还省注意力带宽，提升 decode 速度。\n</li><li>\n别以为 GQA 能替代 MLA——MLA 压的是潜向量，压缩比更高，但计算更复杂。\n</ul>\n<h2>在书中出现的脉络</h2>\n<table><thead><tr><th>章节</th><th>语境</th><th>关键结论</th></tr></thead><tbody><tr><td>第 2 章</td><td>LLM 67B</td><td>64 查询头 / 8 KV 头</td></tr><tr><td>第 2 章</td><td>Coder 33B</td><td>56 查询头 / 8 KV 头</td></tr></tbody></table>\n<h2>相关概念</h2>\n<ul><li>\n前置：多头注意力\n</li><li>\n后续：MLA\n</ul>","kind":"concept","title":"GQA（分组查询注意力）"},"c04":{"html":"<div class=\"source-badge\">出处：https://arxiv.org/abs/2405.04434</div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必</span> <a href=\"#/concept/c03\">GQA（分组查询注意力）</a></span></div><h1>MLA（多头潜在注意力）</h1>\n<ul><li>\n<strong>难度</strong>：高难 | <strong>涉及章节</strong>：第 4–5 章、第 8–9 章\n</ul>\n<h2>一句话定义</h2>\n<p>MLA 把每层每 token 的 K/V 压成一个低维潜向量，推理时只缓存潜向量和 RoPE 部分，不缓存完整 K/V。</p>\n<h2>为什么重要</h2>\n<p>MLA 是 V2/V3 的骨架，也是 DeepSeek 把 128K 上下文做成可部署的关键。不懂 MLA，就看不懂“KV cache 降低 93%”这类数字。</p>\n<h2>详解</h2>\n<p>标准 MHA 缓存每个头的 K/V，128 头、128 维、60 层、BF16 约 3.9 MB/token。MLA 改为缓存：</p>\n<ul><li>\n潜向量 <span class=\"katex-inline\">c_t</span>：512 维。\n</li><li>\n解耦 RoPE key <span class=\"katex-inline\">k_t^R</span>：64 维。\n</ul>\n<p>每层 576 个数，BF16 约 69 KB/token。需要 K/V 时，用上投影矩阵从 <span class=\"katex-inline\">c_t</span> 还原。缓存的是压缩表示，计算时再展开。</p>\n<p>代价是多了下投影/上投影矩阵乘法；收益是显存和带宽大幅下降。论文口径 KV cache 降低 93.3%、吞吐提升 5.76 倍，是端到端测量。</p>\n<h2>常见误解</h2>\n<ul><li>\n别以为 MLA 是量化——它是低秩压缩，不是把浮点数变窄。\n</li><li>\n别以为缓存 512 维就等于注意力只算 512 维——还原后仍是完整多头 K/V。\n</li><li>\n别以为 MLA 没有代价——投影矩阵增加计算，训练也更复杂。\n</ul>\n<h2>在书中出现的脉络</h2>\n<table><thead><tr><th>章节</th><th>语境</th><th>关键结论</th></tr></thead><tbody><tr><td>第 4 章</td><td>V2</td><td>512 + 64 潜向量缓存</td></tr><tr><td>第 5 章</td><td>V3</td><td>沿用 MLA，规模放大</td></tr><tr><td>第 8 章</td><td>V4</td><td>MLA 之上再加 token 压缩 + DSA</td></tr></tbody></table>\n<h2>相关概念</h2>\n<ul><li>\n前置：GQA、KV cache\n</li><li>\n后续：DSA、CSA/HCA、CSA2\n</ul>","kind":"concept","title":"MLA（多头潜在注意力）"},"c05":{"html":"<div class=\"source-badge\">出处：https://arxiv.org/abs/2401.06066</div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必</span> <a href=\"#/concept/c01\">稠密模型与 MoE</a></span></div><h1>DeepSeekMoE</h1>\n<ul><li>\n<strong>难度</strong>：进阶 | <strong>涉及章节</strong>：第 3–5 章\n</ul>\n<h2>一句话定义</h2>\n<p>DeepSeekMoE 用“细粒度专家分割 + 共享专家隔离”替代传统 MoE 的少量大专家。</p>\n<h2>为什么重要</h2>\n<p>它是 DeepSeek 自己的 MoE 设计，V2/V3/V4 都沿用了这套思路。理解它，才能看懂 64/160/256/384 个路由专家这些配置。</p>\n<h2>详解</h2>\n<p>传统 MoE 专家少而宽，路由一变输出差异大，训练不稳。DeepSeekMoE 把每个专家切窄，增加专家数，同时增加激活专家数（top-6/top-8），让组合更细。</p>\n<p>共享专家始终激活，学通用知识；路由专家只学细分知识。这样路由专家不用重复学“通用语言”，容量利用率更高。</p>\n<p>16B 配置：64 路由 + 2 共享，top-6，28 层，2048 维，专家中间维 1408。V2 放大到 160 路由 + 2 共享，V3 到 256 路由 + 1 共享，V4-Pro 到 384 路由 + 1 共享。</p>\n<h2>常见误解</h2>\n<ul><li>\n别以为共享专家参与路由——它始终激活。\n</li><li>\n别以为专家越多激活越多——top-k 决定激活数。\n</li><li>\n别以为 DeepSeekMoE 等于“普通 MoE 加共享专家”——细粒度分割是另一半。\n</ul>\n<h2>在书中出现的脉络</h2>\n<table><thead><tr><th>章节</th><th>语境</th><th>关键结论</th></tr></thead><tbody><tr><td>第 3 章</td><td>MoE 16B</td><td>64 + 2，top-6</td></tr><tr><td>第 4 章</td><td>V2</td><td>160 + 2，top-6</td></tr><tr><td>第 5 章</td><td>V3</td><td>256 + 1，top-8</td></tr></tbody></table>\n<h2>相关概念</h2>\n<ul><li>\n前置：FFN、门控\n</li><li>\n后续：负载均衡、专家并行\n</ul>","kind":"concept","title":"DeepSeekMoE"},"c06":{"html":"<div class=\"source-badge\">出处：https://arxiv.org/abs/2412.19437</div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必</span> <a href=\"#/concept/c02\">总参数与激活参数</a></span></div><h1>MTP（多 token 预测）</h1>\n<ul><li>\n<strong>难度</strong>：进阶 | <strong>涉及章节</strong>：第 5 章\n</ul>\n<h2>一句话定义</h2>\n<p>MTP 让模型在每个位置不仅预测下一个 token，还额外预测第 2 个未来 token。</p>\n<h2>为什么重要</h2>\n<p>V3 的 HuggingFace 权重比主模型多 14B，就是 MTP 模块。不理解它，就会把 685B 误读成“V3 是 685B”。</p>\n<h2>详解</h2>\n<p>标准训练在位置 <span class=\"katex-inline\">t</span> 预测 <span class=\"katex-inline\">t+1</span>。MTP 在同一个位置再预测 <span class=\"katex-inline\">t+2</span>，损失是两项相加：</p>\n<div class=\"katex-block\">\\mathcal{L}=\\mathcal{L}_{t+1}+\\lambda\\mathcal{L}_{t+2}</div>\n<p>好处是训练信号更密，模型要学“下一步”和“下两步”；推理时可作为投机解码的草稿。</p>\n<p>代价是训练多一个 14B 模块，显存和计算增加；推理不用时可以去掉。</p>\n<h2>常见误解</h2>\n<ul><li>\n别以为 MTP 是独立模型——它挂在主干上。\n</li><li>\n别以为 MTP 只在推理时用——它首先是训练目标。\n</li><li>\n别以为 685B = 671B 主模型 + 14B 专家——14B 是 MTP。\n</ul>\n<h2>在书中出现的脉络</h2>\n<table><thead><tr><th>章节</th><th>语境</th><th>关键结论</th></tr></thead><tbody><tr><td>第 5 章</td><td>V3</td><td>671B + 14B MTP = 685B</td></tr><tr><td>第 9 章</td><td>V4.1</td><td>DSpark 是另一种推理加速器</td></tr></tbody></table>\n<h2>相关概念</h2>\n<ul><li>\n前置：自回归语言模型\n</li><li>\n后续：投机解码、DSpark\n</ul>","kind":"concept","title":"MTP（多 token 预测）"},"c07":{"html":"<div class=\"source-badge\">出处：https://arxiv.org/abs/2501.12948</div><h1>GRPO（组相对策略优化）</h1>\n<ul><li>\n<strong>难度</strong>：高难 | <strong>涉及章节</strong>：第 6 章\n</ul>\n<h2>一句话定义</h2>\n<p>GRPO 对同一道题采一组回答，用组内奖励的均值和标准差算优势，不需要单独的 value model。</p>\n<h2>为什么重要</h2>\n<p>R1-Zero/R1 的推理能力主要来自 GRPO + 规则奖励。理解它，才能理解“为什么架构没变，能力却变了”。</p>\n<h2>详解</h2>\n<p>对每个问题采 <span class=\"katex-inline\">G</span> 个回答，奖励 <span class=\"katex-inline\">r_i</span>，优势：</p>\n<div class=\"katex-block\">A_i=\\frac{r_i-\\operatorname{mean}(r)}{\\operatorname{std}(r)}</div>\n<p>然后做带 clip 的策略梯度更新。奖励高于组平均的回答获得正优势，低于的获得负优势。全对或全错的组标准差为 0，没有梯度。</p>\n<p>好处是省掉 value model，训练更简单；坏处是组内采样成本高，奖励函数必须可靠。</p>\n<h2>常见误解</h2>\n<ul><li>\n别以为 GRPO 完全无监督——它需要可验证的奖励函数。\n</li><li>\n别以为全对组也能学——标准差 0，优势全 0。\n</li><li>\n别以为 GRPO 只能做数学——代码、逻辑、工具任务都可以，只要有验证器。\n</ul>\n<h2>在书中出现的脉络</h2>\n<table><thead><tr><th>章节</th><th>语境</th><th>关键结论</th></tr></thead><tbody><tr><td>第 6 章</td><td>R1-Zero</td><td>纯 RL + GRPO，AIME 15.6→71.0</td></tr><tr><td>第 6 章</td><td>R1</td><td>四阶段流水线</td></tr></tbody></table>\n<h2>相关概念</h2>\n<ul><li>\n前置：策略梯度、奖励\n</li><li>\n后续：RLHF、Agent RL\n</ul>","kind":"concept","title":"GRPO（组相对策略优化）"},"c08":{"html":"<div class=\"source-badge\">出处：https://api-docs.deepseek.com/zh-cn/updates/</div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必</span> <a href=\"#/concept/c04\">MLA（多头潜在注意力）</a></span></div><h1>DSA（DeepSeek 稀疏注意力）</h1>\n<ul><li>\n<strong>难度</strong>：高难 | <strong>涉及章节</strong>：第 7–8 章\n</ul>\n<h2>一句话定义</h2>\n<p>DSA 用轻量索引器给每个 query 选 top-k 个历史 token，只对这些 token 做注意力。</p>\n<h2>为什么重要</h2>\n<p>V3.2 和 V4 的长上下文成本能降下来，DSA 是核心结构。它把注意力从 <span class=\"katex-inline\">O(L^2)</span> 拉向 <span class=\"katex-inline\">O(Lk)</span>。</p>\n<h2>详解</h2>\n<p>标准注意力每个 query 看所有历史 token。DSA 分两步：</p>\n<ol><li>\n索引器给每个 query-历史 token 对打分。\n</li><li>\n每个 query 只保留分数最高的 <span class=\"katex-inline\">k</span> 个 token，做 <span class=\"katex-inline\">QK^\\top</span> 和加权。\n</ol>\n<p>索引器很轻，精算只发生在 top-k 上。代价是索引器有计算、top-k 可能选错、实现复杂。</p>\n<p>V3.2-Exp 首次引入 DSA，API 价格降 50% 以上；V4 把 DSA 和 token 压缩结合。</p>\n<h2>常见误解</h2>\n<ul><li>\n别以为 DSA 是把注意力矩阵随机稀疏化——它是可学习索引 + top-k。\n</li><li>\n别以为 DSA 只省计算——它还省 KV 读取带宽。\n</li><li>\n别以为 top-k 越大越好——k 大成本高，k 小丢信息。\n</ul>\n<h2>在书中出现的脉络</h2>\n<table><thead><tr><th>章节</th><th>语境</th><th>关键结论</th></tr></thead><tbody><tr><td>第 7 章</td><td>V3.2-Exp</td><td>首次引入 DSA</td></tr><tr><td>第 8 章</td><td>V4</td><td>token 压缩 + DSA</td></tr></tbody></table>\n<h2>相关概念</h2>\n<ul><li>\n前置：注意力、top-k\n</li><li>\n后续：CSA/HCA、CSA2\n</ul>","kind":"concept","title":"DSA（DeepSeek 稀疏注意力）"},"c09":{"html":"<div class=\"source-badge\">出处：https://arxiv.org/abs/2606.19348</div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必</span> <a href=\"#/concept/c08\">DSA（DeepSeek 稀疏注意力）</a></span></div><h1>CSA 与 HCA</h1>\n<ul><li>\n<strong>难度</strong>：高难 | <strong>涉及章节</strong>：第 8 章\n</ul>\n<h2>一句话定义</h2>\n<p>CSA 把每 <span class=\"katex-inline\">m</span> 个 token 的 KV 压成一个条目再做稀疏选择；HCA 用更粗的块表示极远端历史。</p>\n<h2>为什么重要</h2>\n<p>V4 的 1M 上下文不是只靠 DSA，而是 CSA/HCA/SWA 分层：近处精确、中程压缩、远端粗粒度。</p>\n<h2>详解</h2>\n<ul><li>\nCSA：<span class=\"katex-inline\">m=4</span>，每 4 个 token 压一个条目；Pro top-k 1024，Flash top-k 512。\n</li><li>\nHCA：<span class=\"katex-inline\">m&#x27;=128</span>，每 128 个 token 压一个块；负责极远端。\n</li><li>\nSWA：最近 128 token 精确窗口，保细节。\n</ul>\n<p>三条路径按距离分工，输出汇总。压缩会丢细节，所以不能只用一种。</p>\n<h2>常见误解</h2>\n<ul><li>\n别以为 CSA 是平均池化——它是可学习压缩 + top-k。\n</li><li>\n别以为 HCA 能替代 SWA——极远端块表示会丢局部细节。\n</li><li>\n别以为 1M 上下文只靠 RoPE 外推——成本结构才是瓶颈。\n</ul>\n<h2>在书中出现的脉络</h2>\n<table><thead><tr><th>章节</th><th>语境</th><th>关键结论</th></tr></thead><tbody><tr><td>第 8 章</td><td>V4</td><td>压缩 + DSA，论文拆成 CSA/HCA/SWA</td></tr></tbody></table>\n<h2>相关概念</h2>\n<ul><li>\n前置：DSA\n</li><li>\n后续：CSA2、CED\n</ul>","kind":"concept","title":"CSA 与 HCA"},"c10":{"html":"<div class=\"source-badge\">出处：https://arxiv.org/abs/2606.19348</div><h1>mHC（流形约束超连接）</h1>\n<ul><li>\n<strong>难度</strong>：高难 | <strong>涉及章节</strong>：第 8 章\n</ul>\n<h2>一句话定义</h2>\n<p>mHC 把 Transformer 的残差流扩成多通道，并用 Sinkhorn 把通道混合矩阵约束成双随机矩阵。</p>\n<h2>为什么重要</h2>\n<p>V4 的深层稳定性来自 mHC。它解决的是“残差一条线越传越偏”的问题，不是加层。</p>\n<h2>详解</h2>\n<p>标准残差：<span class=\"katex-inline\">x_{l+1}=x_l+F(x_l)</span>，流宽度 <span class=\"katex-inline\">d</span>。mHC 把流扩成 <span class=\"katex-inline\">n</span> 倍（V4 取 4），每个通道有自己的子空间，再用混合矩阵 <span class=\"katex-inline\">M</span> 在通道间交换信息。</p>\n<p>约束：<span class=\"katex-inline\">M</span> 必须是双随机矩阵——每行和 1、每列和 1、非负。用 Sinkhorn 迭代：</p>\n<div class=\"katex-block\">M_{ij}\\leftarrow\\frac{M_{ij}}{\\sum_j M_{ij}},\\quad M_{ij}\\leftarrow\\frac{M_{ij}}{\\sum_i M_{ij}}</div>\n<p>重复 20 次。双随机保证信息不会全挤到少数通道，深层残差更稳。</p>\n<p>代价是每次前向多 20 次归一化，激活显存也增加。</p>\n<h2>常见误解</h2>\n<ul><li>\n别以为 mHC 是“多加几层”——它是残差流扩容与混合。\n</li><li>\n别以为 softmax 就够了——softmax 只保证行和 1，列可能集中。\n</li><li>\n别以为 Sinkhorn 是推理专用——训练和推理都要做。\n</ul>\n<h2>在书中出现的脉络</h2>\n<table><thead><tr><th>章节</th><th>语境</th><th>关键结论</th></tr></thead><tbody><tr><td>第 8 章</td><td>V4</td><td>4 倍残差流 + Sinkhorn 20 次</td></tr></tbody></table>\n<h2>相关概念</h2>\n<ul><li>\n前置：残差连接\n</li><li>\n后续：深层训练稳定性\n</ul>","kind":"concept","title":"mHC（流形约束超连接）"},"c11":{"html":"<div class=\"source-badge\">出处：https://arxiv.org/abs/2609.19969</div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必</span> <a href=\"#/concept/c09\">CSA 与 HCA</a></span></div><h1>CED 与 CSA2</h1>\n<ul><li>\n<strong>难度</strong>：高难 | <strong>涉及章节</strong>：第 9 章\n</ul>\n<h2>一句话定义</h2>\n<p>CED 把模型拆成 20 层编码器 + 20 层解码器，解码器的全局 KV 由编码器末端投影；CSA2 让相邻层复用 KV 和 top-k 索引。</p>\n<h2>为什么重要</h2>\n<p>V4.1 把 prefill 算力减半、全局 KV 压到 890 B/token，靠的就是这两件结构。</p>\n<h2>详解</h2>\n<p>CED：编码器 20 层建立全局 KV，解码器 20 层不再自己算，而是：</p>\n<div class=\"katex-block\">C_l=H_{20}W_l^{KV},\\quad l>20</div>\n<p>prefill 只算前 20 层，解码器复用投影。代价是解码器表达受编码器末端限制。</p>\n<p>CSA2 三模式：</p>\n<ul><li>\nFull：重算 KV/index。\n</li><li>\nReindex：复用 KV，重建索引。\n</li><li>\nReuse：复用 KV 和上一层 top-k 索引。\n</ul>\n<p>编码器每 6 层一组：1 Full + 5 Reuse；解码器每 4 层一组，首组 Full + 3 Reuse，后四组 Reindex + 3 Reuse。</p>\n<h2>常见误解</h2>\n<ul><li>\n别以为 CED 是“少训 20 层”——它是编码器-解码器分工。\n</li><li>\n别以为 Reuse 永远正确——分布漂移时要 Reindex。\n</li><li>\n别以为 890 B/token 是全部缓存——只是全局 KV。\n</ul>\n<h2>在书中出现的脉络</h2>\n<table><thead><tr><th>章节</th><th>语境</th><th>关键结论</th></tr></thead><tbody><tr><td>第 9 章</td><td>V4.1</td><td>20+20 层，CSA2 复用</td></tr></tbody></table>\n<h2>相关概念</h2>\n<ul><li>\n前置：CSA/HCA、KV cache\n</li><li>\n后续：Engram、DSpark\n</ul>","kind":"concept","title":"CED 与 CSA2"},"c12":{"html":"<div class=\"source-badge\">出处：https://arxiv.org/abs/2609.19969</div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必</span> <a href=\"#/concept/c02\">总参数与激活参数</a></span></div><h1>Engram 与 DSpark</h1>\n<ul><li>\n<strong>难度</strong>：进阶 | <strong>涉及章节</strong>：第 9 章\n</ul>\n<h2>一句话定义</h2>\n<p>Engram 用 N-gram 哈希查表替代部分矩阵计算；DSpark 是独立训练的投机解码 drafter。</p>\n<h2>为什么重要</h2>\n<p>V4.1 的 196B Engram 解释了“为什么总参数 763B、激活却只有 8B/16B”；DSpark 解释了 decode 加速从哪来。</p>\n<h2>详解</h2>\n<p>Engram：把输入 N-gram 哈希到固定表，查表得到记忆向量，拼进隐藏状态。O(1) 访问，不做矩阵乘。196B 是表参数，不参与每 token 稠密计算。代价是表大、哈希冲突、训练要学配合。</p>\n<p>DSpark：小模型先猜几个 token，主模型验证，减少 decode 步数。它和 MTP 不同：MTP 偏训练信号，DSpark 是推理加速器。</p>\n<h2>常见误解</h2>\n<ul><li>\n别以为 Engram 是 MoE——它查表，不是专家 FFN。\n</li><li>\n别以为 196B Engram 等于 196B 激活——激活只有 8B/16B。\n</li><li>\n别以为 DSpark 会改变主模型输出——它只加速，验证不过就回退。\n</ul>\n<h2>在书中出现的脉络</h2>\n<table><thead><tr><th>章节</th><th>语境</th><th>关键结论</th></tr></thead><tbody><tr><td>第 9 章</td><td>V4.1</td><td>552B + 196B Engram；DSpark</td></tr></tbody></table>\n<h2>相关概念</h2>\n<ul><li>\n前置：MoE、投机解码\n</li><li>\n后续：部署优化\n</ul>","kind":"concept","title":"Engram 与 DSpark"},"c13":{"html":"<div class=\"source-badge\">出处：https://huggingface.co/deepseek-ai</div><h1>视觉压缩：VL、OCR 与 Janus</h1>\n<ul><li>\n<strong>难度</strong>：进阶 | <strong>涉及章节</strong>：第 10 章\n</ul>\n<h2>一句话定义</h2>\n<p>视觉模型把图像编码成少量 token，再交给语言主干；不同模型对“理解”和“生成”用不同的视觉路径。</p>\n<h2>为什么重要</h2>\n<p>DeepSeek 的多模态不是一条主线，而是三种任务：理解（VL/VL2）、文档压缩（OCR）、理解+生成（Janus）。</p>\n<h2>详解</h2>\n<p>VL2 用动态切图 + DeepSeekMoE-27B，把高分辨率图切成多块编码，再做视觉问答/定位。激活参数 1.0B/2.8B/4.5B。</p>\n<p>OCR 用光学压缩：整页图 → 少量视觉 token → 语言模型恢复文字/版面。OCR2 用视觉因果流，按阅读顺序处理。</p>\n<p>Janus 解耦两条视觉路径：理解用 SigLIP-L 这类语义编码器；生成用 VQ tokenizer + 自回归。两条路径共享语言主干，但视觉编码器分开。</p>\n<h2>常见误解</h2>\n<ul><li>\n别以为 VL2 的 1.0B 是总参数——是激活参数。\n</li><li>\n别以为 OCR 只是传统 OCR——它是视觉 token 压缩 + 语言模型。\n</li><li>\n别以为 Janus 用一个编码器同时做理解和生成——它是解耦的。\n</ul>\n<h2>在书中出现的脉络</h2>\n<table><thead><tr><th>章节</th><th>语境</th><th>关键结论</th></tr></thead><tbody><tr><td>第 10 章</td><td>VL/VL2</td><td>理解型视觉模型</td></tr><tr><td>第 10 章</td><td>OCR/OCR2</td><td>光学压缩</td></tr><tr><td>第 10 章</td><td>Janus</td><td>解耦理解与生成</td></tr></tbody></table>\n<h2>相关概念</h2>\n<ul><li>\n前置：视觉编码器、tokenizer\n</li><li>\n后续：多模态 Agent\n</ul>","kind":"concept","title":"视觉压缩：VL、OCR 与 Janus"},"__path__":{"html":"<h1>学习路径</h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。</p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：先会读模型卡</strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：家族地图</a>、<a href=\"#/chapter/ch02\">第 2 章：Dense 起步：LLM、Coder 与 Math</a><br>检查点：六问读四张卡</li><li class='path-step' id='path-02'><strong>步骤 02：稠密模型</strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：Dense 起步：LLM、Coder 与 Math</a><br>检查点：手画 67B 配置</li><li class='path-step' id='path-03'><strong>步骤 03：MoE 与专家</strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：DeepSeekMoE：把 FFN 拆成细粒度专家</a><br>检查点：算 16B 激活比例</li><li class='path-step' id='path-04'><strong>步骤 04：V2 与 MLA</strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：V2 代：MLA + DeepSeekMoE 的组合</a><br>检查点：算 69 KB/token</li><li class='path-step' id='path-05'><strong>步骤 05：V3 与 R1</strong><br>阅读：<a href=\"#/chapter/ch05\">第 5 章：V3 代：671B/37B 的骨架</a>、<a href=\"#/chapter/ch06\">第 6 章：R1 代：同一副骨架，换训练目标</a><br>检查点：解释 685B；算 GRPO</li><li class='path-step' id='path-06'><strong>步骤 06：V3.2 / V4 / V4.1</strong><br>阅读：<a href=\"#/chapter/ch07\">第 7 章：V3.1 / V3.2：从推理模型到 Agent 模型</a>、<a href=\"#/chapter/ch08\">第 8 章：V4 代：百万上下文成为默认</a>、<a href=\"#/chapter/ch09\">第 9 章：V4.1：把 KV cache 压到 890 B/token</a>、<a href=\"#/chapter/ch13\">第 13 章：手算手册：从参数量到 KV 账</a><br>检查点：画 CSA/HCA；算 890 MB；跑一遍手算题</li><li class='path-step' id='path-07'><strong>步骤 07：多模态、专用与选型</strong><br>阅读：<a href=\"#/chapter/ch10\">第 10 章：多模态与专用模型</a>、<a href=\"#/chapter/ch11\">第 11 章：全家族对比与选型</a>、<a href=\"#/chapter/ch14\">第 14 章：源码地图：拿到 config.json 和 modeling 文件怎么读</a><br>检查点：三场景选型；读一份 config.json</li></ol><p>进度：<span id='path-progress-label'>0/0</span></p>","kind":"path","title":"学习路径"},"__graph__":{"html":"<h1>知识图谱</h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。</p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"></div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读</p>","kind":"graph","title":"知识图谱"},"__quiz_all__":{"html":"<h1>综合测验（全书 36 题）</h1><div class='quiz-item' data-qid='q01' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q1.</b> DeepSeek 四代结构主线的最合理排序是？</p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> dense → MoE → MLA + MoE → 稀疏注意力/百万上下文</label><label class='quiz-opt'><input type='radio' name='q01' value='1'> MoE → dense → MLA → CNN</label><label class='quiz-opt'> ss='quiz-opt'><input type='radio' name='q04' value='3'> 16</label></div><div class='quiz-actions'><button class='quiz-check'>检查答案</button><span class='quiz-feedback'></span></div></div><div class='quiz-item' data-qid='q05' data-type='single' data-concept='c01' data-chapter='ch02'><p class='quiz-q'><b>Q5.</b> Coder 的 FIM 训练对应哪种任务？</p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> 中间填空补全</label><label class='quiz-opt'><input type='radio' name='q05' value='1'> 图像分类</label><label class='quiz-opt'><input type='radio' name='q05' value='2'> 语音识别</label><label class='quiz-opt'><input type='radio' name='q05' value='3'> 机器翻译</label></div><div class='quiz-actions'><button class='quiz-check'>检查答案</button><span class='quiz-feedback'></span></div></div><div class='quiz-item' data-qid='q06' data-type='single' data-concept='c01' data-chapter='ch02'><p class='quiz-q'><b>Q6.</b> DeepSeek-Coder-V2 属于哪个家族？</p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> 第一代 dense Coder</label><label class='quiz-opt'><input type='radio' name='q06' value='1'> V3 家族</label><label class='quiz-opt'><input type='radio' name='q06' value='2'> V2 家族</label><label class='quiz-opt'><input type='radio' name='q06' value='3'> Janus</label></div><div class='quiz-actions'><button class='quiz-check'>检查答案</button><span class='quiz-feedback'></span></div></div><div class='quiz-item' data-qid='q07' data-type='single' data-concept='c05' data-chapter='ch03'><p class='quiz-q'><b>Q7.</b> DeepSeekMoE 16B 每 token 选几个路由专家？</p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 2</label><label class='quiz-opt'><input type='radio' name='q07' value='1'> 6</label><label class='quiz-opt'><input type='radio' name='q07' value='2'> 8</label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 64</label></div><div class='quiz-actions'><button class='quiz-check'>检查答案</button><span class='quiz-feedback'></ ='quiz-actions'><button class='quiz-check'>检查答案</button><span class='quiz-feedback'></span></div></div><div class='quiz-item' data-qid='q38' data-type='single' data-concept='c04' data-chapter='ch13'><p class='quiz-q'><b>Q2.</b> V3 的注意力部分粗估多少 B？</p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q38' value='0'> 约 12.54B</label><label class='quiz-opt'><input type='radio' name='q38' value='1'> 约 2.55B</label><label class='quiz-opt'><input type='radio' name='q38' value='2'> 约 653.9B</label><label class='quiz-opt'><input type='radio' name='q38' value='3'> 约 671B</label></div><div class='quiz-actions'><button class='quiz-check'>检查答案</button><span class='quiz-feedback'></span></div></div><div class='quiz-item' data-qid='q39' data-type='single' data-concept='c04' data-chapter='ch13'><p class='quiz-q'><b>Q3.</b> V3 的 128K 单序列 KV 约多少？</p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q39' value='0'> 约 9.21 GB</label><label class='quiz-opt'><input type='radio' name='q39' value='1'> 约 890 MB</label><label class='quiz-opt'><input type='radio' name='q39' value='2'> 约 48 GB</label><label class='quiz-opt'><input type='radio' name='q39' value='3'> 约 1.34 TB</label></div><div class='quiz-actions'><button class='quiz-check'>检查答案</button><span class='quiz-feedback'></span></div></div><div class='quiz-item' data-qid='q40' data-type='single' data-concept='c11' data-chapter='ch13'><p class='quiz-q'><b>Q4.</b> V4.1 的 1M 单序列全局 KV 约多少？</p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q40' value='0'> 约 890 MB</label><label class='quiz-opt'><input type='radio' name='q40' value='1'> 约 9 GB</label><label class='quiz-opt'><input type='radio' name='q40' value='2'> 约 48 GB</label><label class='quiz-opt'><input type='radio' name='q40' value='3'> 约 2.4 TB</label></div><div class='quiz-actions'><button class='quiz-check'>检查答案</button><span class='quiz-feedback'></span></div></div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。</p>","kind":"quiz","title":"测验"},"__quiz_ch14__":{"html":"<h1>测验：第 14 章：源码地图：拿到 config.json 和 modeling 文件怎么读</h1><div class='quiz-item' data-qid='q41' data-type='single' data-concept='c05' data-chapter='ch14'><p class='quiz-q'><b>Q1.</b> <code>first_k_dense_replace=3</code> 意味着什么？</p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q41' value='0'> 前 3 层是 dense FFN</label><label class='quiz-opt'><input type='radio' name='q41' value='1'> 前 3 层是 MoE</label><label class='quiz-opt'><input type='radio' name='q41' value='2'> 只有 3 层</label><label class='quiz-opt'><input type='radio' name='q41' value='3'> 3 个共享专家</label></div><div class='quiz-actions'><button class='quiz-check'>检查答案</button><span class='quiz-feedback'></span></div></div><div class='quiz-item' data-qid='q42' data-type='single' data-concept='c04' data-chapter='ch14'><p class='quiz-q'><b>Q2.</b> MLA 缓存的两个张量是什么？</p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q42' value='0'> c 和 k_pe</label><label class='quiz-opt'><input type='radio' name='q42' value='1'> q 和 k</label><label class='quiz-opt'><input type='radio' name='q42' value='2'> k_nope 和 v</label><label class='quiz-opt'><input type='radio' name='q42' value='3'> 全部 K/V</label></div><div class='quiz-actions'><button class='quiz-check'>检查答案</button><span class='quiz-feedback'></span></div></div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。</p>","kind":"quiz","title":"测验"},"__cards__":{"html":"<h1>抽认卡</h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。</p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部</option></select></label><span class='card-counts'>认识 <b id='card-known'>0</b> · 不熟 <b id='card-again'>0</b> · 剩余 <b id='card-left'>0</b></span></div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'></div><div class='fc-back'></div></div></div></div><div class='card-actions'><button id='card-again-btn'>不熟</button><button id='card-known-btn'>认识</button></div>","kind":"cards","title":"抽认卡"},"__glossary__":{"html":"<h1>术语表</h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='transformer'>Transformer — 由自注意力 + FFN + 残差组成的序列模型骨架 <span class=glossary-ref>（第 1 章：家族地图）</span></li><li data-term='稠密模型'>稠密模型 — 每个 token 都走同一套 FFN 的模型 <span class=glossary-ref>（第 1 章：家族地图）</span></li><li data-term='moe'>MoE — 混合专家：FFN 拆成多个专家，每个 token 只走 top-k <span class=glossary-ref>（第 1 章：家族地图）</span></li><li data-term='路由专家'>路由专家 — 由门控选择是否激活的专家 <span class=glossary-ref>（第 1 章：家族地图）</span></li><li data-term='共享专家'>共享专家 — 始终激活、负责通用知识的专家 <span class=glossary-ref>（第 3 章：DeepSeekMoE：把 FFN 拆成细粒度专家）</span></li><li data-term='门控'>门控 — 给 token 和专家打分、决定路由的模块 <span class=glossary-ref>（第 3 章：DeepSeekMoE：把 FFN 拆成细粒度专家）</span></li><li data-term='top-k'>top-k — 每个 token 只选分数最高的 k 个专家 <span class=glossary-ref>（第 3 章：DeepSeekMoE：把 FFN 拆成细粒度专家）</span></li><li data-term='总参数'>总参数 — 模型全部权重数量，决定显存 <span class=glossary-ref>（第 1 章：家族地图）</span></li><li data-term='激活参数'>激活参数 — 每个 token 实际参与计算的权重数量，决定算力 <span class=glossary-ref>（第 1 章：家族地图）</span></li><li data-term='专家并行'>专家并行 — 把不同专家放到不同设备上的并行方式 <span class=glossary-ref>（第 3 章：DeepSeekMoE：把 FFN 拆成细粒度专家）</span></li><li data-term='负载均衡'>负载均衡 — 让各专家处理量接近，避免专家塌缩 <span class=glossary-ref>（第 3 章：DeepSeekMoE：把 FFN 拆成细粒度专家）</span></li><li data-term='专家塌缩'>专家塌缩 — 门控总选少数专家，其余专家学不到东西 <span class=glossary-ref>（第 3 章：DeepSeekMoE：把 FFN 拆成细粒度专家）</span></li><li data-term='辅助损失'>辅助损失 — 加在主损失外、用来拉平专家负载的损失项 <span class=glossary-ref>（第 3 章：DeepSeekMoE：把 FFN 拆成细粒度专家）</span></li><li data-term='无辅助损失均衡'>无辅助损失均衡 — 用可学习专家偏置代替辅助损失的均衡方法 <span class=glossary-ref>（第 5 章：V3 代：671B/37B 的骨架）</span></li><li data-term='mha'>MHA — 多头注意力：每个头有独立 Q/K/V <span class=glossary-ref>（第 2 章：Dense 起步：LLM、Coder 与 Math）</span></li><li data-term='gqa'>GQA — 分组查询注意力：多个查询头共享一组 K/V <span class=glossary-ref>（第 2 章：Dense 起步：LLM、Coder 与 Math）</span></li><li data-term='mqa'>MQA — 多查询注意力：所有查询头共享一组 K/V <span class=glossary-ref>（第 2 章：Dense 起步：LLM、Coder 与 Math）</span></li><li data-term='kv cache'>KV cache — 解码时缓存历史 K/V，避免重复计算 <span class=glossary-ref>（第 2 章：Dense 起步：LLM、Coder 与 Math）</span></li><li data-term='mla'>MLA — 多头潜在注意力：缓存低维潜向量 + RoPE key <span class=glossary-ref>（第 4 章：V2 代：MLA + DeepSeekMoE 的组合）</span></li><li data-term='潜向量'>潜向量 — 低维压缩表示，MLA 缓存的核心 <span class=glossary-ref>（第 4 章：V2 代：MLA + DeepSeekMoE 的组合）</span></li><li data-term='rope'>RoPE — 旋转位置编码，把位置信息编码进 Q/K <span class=glossary-ref>（第 4 章：V2 代：MLA + DeepSeekMoE 的组合）</span></li><li data-term='解耦 rope'>解耦 RoPE — MLA 中单独保留的 RoPE key 部分 <span class=glossary-ref>（第 4 章：V2 代：MLA + DeepSeekMoE 的组合）</span></li><li data-term='上下文长度'>上下文长度 — 模型一次能处理的 token 数 <span class=glossary-ref>（第 4 章：V2 代：MLA + DeepSeekMoE 的组合）</span></li><li data-term='fim'>FIM — 中间填空：挖掉中间片段让模型补回 <span class=glossary-ref>（第 2 章：Dense 起步：LLM、Coder 与 Math）</span></li><li data-term='代码续写'>代码续写 — 根据前缀继续生成代码 <span class=glossary-ref>（第 2 章：Dense 起步：LLM、Coder 与 Math）</span></li><li data-term='coder-v2'>Coder-V2 — V2 骨架的代码继续预训练模型 <span class=glossary-ref>（第 4 章：V2 代：MLA + DeepSeekMoE 的组合）</span></li><li data-term='v2-lite'>V2-Lite — V2 的 16B/2.4B 缩小版 <span class=glossary-ref>（第 4 章：V2 代：MLA + DeepSeekMoE 的组合）</span></li><li data-term='mtp'>MTP — 多 token 预测：额外预测 t+2 <span class=glossary-ref>（第 5 章：V3 代：671B/37B 的骨架）</span></li><li data-term='投机解码'>投机解码 — 小模型先猜、大模型验证的加速方法 <span class=glossary-ref>（第 5 章：V3 代：671B/37B 的骨架）</span></li><li data-term='fp8'>FP8 — 8 位浮点训练/推理精度 <span class=glossary-ref>（第 5 章：V3 代：671B/37B 的骨架）</span></li><li data-term='fp4'>FP4 — 4 位浮点精度，V4/V4.1 用于权重/KV <span class=glossary-ref>（第 8 章：V4 代：百万上下文成为默认）</span></li><li data-term='dualpipe'>DualPipe — 双向流水线并行 <span class=glossary-ref>（第 5 章：V3 代：671B/37B 的骨架）</span></li><li data-term='eplb'>EPLB — 专家并行负载均衡 <span class=glossary-ref>（第 5 章：V3 代：671B/37B 的骨架）</span></li><li data-term='3fs'>3FS — DeepSeek 的分布式文件系统 <span class=glossary-ref>（第 5 章：V3 代：671B/37B 的骨架）</span></li><li data-term='r1-zero'>R1-Zero — 不做冷启动、直接纯 RL 的推理模型 <span class=glossary-ref>（第 6 章：R1 代：同一副骨架，换训练目标）</span></li><li data-term='grpo'>GRPO — 组相对策略优化：组内标准化算优势 <span class=glossary-ref>（第 6 章：R1 代：同一副骨架，换训练目标）</span></li><li data-term='规则奖励'>规则奖励 — 用可验证规则给回答打分，不训练奖励模型 <span class=glossary-ref>（第 6 章：R1 代：同一副骨架，换训练目标）</span></li><li data-term='冷启动 sft'>冷启动 SFT — 先用少量高质量长 CoT 数据做监督微调 <span class=glossary-ref>（第 6 章：R1 代：同一副骨架，换训练目标）</span></li><li data-term='拒绝采样'>拒绝采样 — 只保留答案正确/格式合格的采样结果 <span class=glossary-ref>（第 6 章：R1 代：同一副骨架，换训练目标）</span></li><li data-term='蒸馏'>蒸馏 — 用大模型输出微调小模型，学生架构可不同 <span class=glossary-ref>（第 6 章：R1 代：同一副骨架，换训练目标）</span></li><li data-term='长 cot'>长 CoT — 长链思维：先写推理过程再给答案 <span class=glossary-ref>（第 6 章：R1 代：同一副骨架，换训练目标）</span></li><li data-term='混合推理'>混合推理 — 一个模型同时支持思考/非思考模式 <span class=glossary-ref>（第 7 章：V3.1 / V3.2：从推理模型到 Agent 模型）</span></li><li data-term='dsa'>DSA — DeepSeek 稀疏注意力：索引器 + top-k <span class=glossary-ref>（第 7 章：V3.1 / V3.2：从推理模型到 Agent 模型）</span></li><li data-term='索引器'>索引器 — 给 query-历史 token 打分的小模块 <span class=glossary-ref>（第 7 章：V3.1 / V3.2：从推理模型到 Agent 模型）</span></li><li data-term='agent'>Agent — 能多轮调工具、观察结果、继续行动的系统 <span class=glossary-ref>（第 7 章：V3.1 / V3.2：从推理模型到 Agent 模型）</span></li><li data-term='agent rl'>Agent RL — 用环境反馈训练 Agent 的强化学习 <span class=glossary-ref>（第 7 章：V3.1 / V3.2：从推理模型到 Agent 模型）</span></li><li data-term='v3.2-speciale'>V3.2-Speciale — V3.2 的长思考增强版，偏评测 <span class=glossary-ref>（第 7 章：V3.1 / V3.2：从推理模型到 Agent 模型）</span></li><li data-term='csa'>CSA — 压缩稀疏注意力：每 m 个 token 压一个条目 <span class=glossary-ref>（第 8 章：V4 代：百万上下文成为默认）</span></li><li data-term='hca'>HCA — 重度压缩注意力：每 m′ 个 token 压一个块 <span class=glossary-ref>（第 8 章：V4 代：百万上下文成为默认）</span></li><li data-term='swa'>SWA — 滑动窗口注意力：只算最近窗口 <span class=glossary-ref>（第 8 章：V4 代：百万上下文成为默认）</span></li><li data-term='mhc'>mHC — 流形约束超连接：残差流扩容 + 双随机混合 <span class=glossary-ref>（第 8 章：V4 代：百万上下文成为默认）</span></li><li data-term='sinkhorn'>Sinkhorn — 交替行/列归一化，逼近双随机矩阵 <span class=glossary-ref>（第 8 章：V4 代：百万上下文成为默认）</span></li><li data-term='双随机矩阵'>双随机矩阵 — 每行和 1、每列和 1、元素非负的矩阵 <span class=glossary-ref>（第 8 章：V4 代：百万上下文成为默认）</span></li><li data-term='muon'>Muon — 对矩阵参数做正交化的优化器 <span class=glossary-ref>（第 8 章：V4 代：百万上下文成为默认）</span></li><li data-term='ced'>CED — 非对称编码器-解码器：20 层编码 + 20 层解码 <span class=glossary-ref>（第 9 章：V4.1：把 KV cache 压到 890 B/token）</span></li><li data-term='csa2'>CSA2 — 跨层复用 KV/索引的压缩稀疏注意力 <span class=glossary-ref>（第 9 章：V4.1：把 KV cache 压到 890 B/token）</span></li><li data-term='reuse'>Reuse — 复用 KV 和上一层 top-k 索引 <span class=glossary-ref>（第 9 章：V4.1：把 KV cache 压到 890 B/token）</span></li><li data-term='reindex'>Reindex — 复用 KV 但重建索引 <span class=glossary-ref>（第 9 章：V4.1：把 KV cache 压到 890 B/token）</span></li><li data-term='engram'>Engram — N-gram 哈希查表记忆模块 <span class=glossary-ref>（第 9 章：V4.1：把 KV cache 压到 890 B/token）</span></li><li data-term='dspark'>DSpark — 独立训练的投机解码 drafter <span class=glossary-ref>（第 9 章：V4.1：把 KV cache 压到 890 B/token）</span></li><li data-term='vl2'>VL2 — 基于 DeepSeekMoE-27B 的视觉语言模型 <span class=glossary-ref>（第 10 章：多模态与专用模型）</span></li><li data-term='janus'>Janus — 解耦视觉编码的理解+生成统一模型 <span class=glossary-ref>（第 10 章：多模态与专用模型）</span></li><li data-term='光学压缩'>光学压缩 — 把整页图压成少量视觉 token <span class=glossary-ref>（第 10 章：多模态与专用模型）</span></li><li data-term='prover-v2'>Prover-V2 — 用 V3 主干做 Lean 形式化证明的模型 <span class=glossary-ref>（第 10 章：多模态与专用模型）</span></li><li data-term='math-v2'>Math-V2 — 基于 V3.2-Exp-Base 的自验证数学证明模型 <span class=glossary-ref>（第 10 章：多模态与专用模型）</span></li><li data-term='模型卡'>模型卡 — HuggingFace 上描述权重、配置、许可证的页面 <span class=glossary-ref>（第 11 章：全家族对比与选型）</span></li><li data-term='开放权重'>开放权重 — 权重公开，但训练数据/流程未必公开 <span class=glossary-ref>（第 11 章：全家族对比与选型）</span></li><li data-term='deepseek model license'>DeepSeek Model License — DeepSeek 自定义开放权重许可证 <span class=glossary-ref>（第 11 章：全家族对比与选型）</span></li></ul>","kind":"glossary","title":"术语表"},"__diagnosis__":{"html":"<h1>诊断测试</h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。</p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）</button><span id='diag-progress'></span></div><div id='diag-stage'></div><div id='diag-result'></div>","kind":"diagnosis","title":"诊断测试"},"__patterns__":{"html":"<h1>模式与框架库</h1>\n<h2>框架 1：六问读卡法</h2>\n<p>拿到任何一张模型卡，按顺序问：</p>\n<ol><li>\n<code>architectures</code> / <code>model_type</code> 是什么？\n</li><li>\n总参数、激活参数各多少？\n</li><li>\n注意力是 MHA/GQA/MLA/DSA/CSA/HCA/CSA2 中的哪一种？\n</li><li>\nFFN 是 dense 还是 MoE？多少路由专家、多少共享专家、top-k 多少？\n</li><li>\n上下文多长、训练 token 多少、精度是什么？\n</li><li>\n许可证是什么？\n</ol>\n<p>这六个问题能把“新架构”和“同架构新 checkpoint”分开。</p>\n<h2>框架 2：代际主线</h2>\n<table><thead><tr><th>代</th><th>解决的问题</th><th>关键结构</th></tr></thead><tbody><tr><td>Dense</td><td>先把语言模型跑起来</td><td>LLaMA 式 decoder、GQA</td></tr><tr><td>MoE</td><td>同样算力下扩大容量</td><td>细粒度专家、共享专家、top-k</td></tr><tr><td>V2</td><td>KV cache 太大</td><td>MLA、160 路由</td></tr><tr><td>V3</td><td>规模与训练稳定性</td><td>256 路由、MTP、无辅助损失均衡、FP8</td></tr><tr><td>V3.2</td><td>长上下文与 Agent</td><td>DSA、Agent RL</td></tr><tr><td>V4</td><td>1M 上下文成本</td><td>token 压缩 + DSA、mHC、Muon</td></tr><tr><td>V4.1</td><td>KV cache 再压</td><td>CED、CSA2、Engram、DSpark、FP4 KV</td></tr></tbody></table>\n<h2>框架 3：选型顺序</h2>\n<p>任务 → 显存 → 延迟 → 上下文 → 许可证。</p>\n<p>不要反过来从“哪个模型最大”开始。V4-Pro 1.6T 对单机没有意义；V2-Lite 16B/2.4B 才是学习实验的入口。</p>\n<h2>决策规则</h2>\n<ul><li>\n本地实验、显存 &lt; 24 GB：V2-Lite、OCR、Janus-Pro-1B。\n</li><li>\n通用对话/代码、有 8 卡 A100/H100：V3.1 671B/37B。\n</li><li>\n1M 文档 Agent、要低成本：V4.1-Flash 或 V4-Flash。\n</li><li>\n最高质量、不计成本：V4-Pro。\n</li><li>\nLean 形式化：Prover-V2-671B；自然语言数学证明：Math-V2。\n</li><li>\n文档 OCR：OCR2；视觉理解：VL2；理解+生成：Janus-Pro。\n</li><li>\n商用且不想读自定义条款：优先 MIT/Apache 2.0 的 checkpoint。\n</ul>\n<h2>反模式</h2>\n<ul><li>\n<strong>只看总参数</strong>：MoE 的算力看激活参数，显存看总参数，两个数要分开。\n</li><li>\n<strong>把 HF 权重总量当主模型</strong>：V3 的 685B 含 14B MTP；V4.1 的 763B 含 196B Engram。\n</li><li>\n<strong>把同家族 checkpoint 当新架构</strong>：V3-0324、V3.1、V3.1-Terminus 结构相同。\n</li><li>\n<strong>把“开放权重”写成“OSI 开源”</strong>：DeepSeek Model License 不是 MIT/Apache。\n</li><li>\n<strong>用 V4-Pro 的分数套 V4-Flash</strong>：两者不是同一档。\n</li><li>\n<strong>忽略压缩的代价</strong>：CSA/HCA 会丢细节，CED 的解码器表达受编码器末端限制。\n</ul>","kind":"模式库","title":"模式库"},"__cheatsheet__":{"html":"<h1>速查表</h1>\n<h2>配置速查</h2>\n<table><thead><tr><th>模型</th><th>总/激活</th><th>层</th><th>隐藏</th><th>头</th><th>路由/共享</th><th>top-k</th><th>上下文</th></tr></thead><tbody><tr><td>LLM 7B</td><td>7B</td><td>30</td><td>4096</td><td>32/32</td><td>dense</td><td>—</td><td>4K</td></tr><tr><td>LLM 67B</td><td>67B</td><td>95</td><td>8192</td><td>64/8</td><td>dense</td><td>—</td><td>4K</td></tr><tr><td>Coder 33B</td><td>33B</td><td>62</td><td>7168</td><td>56/8</td><td>dense</td><td>—</td><td>16K</td></tr><tr><td>MoE 16B</td><td>16B/2.8B</td><td>28</td><td>2048</td><td>16</td><td>64+2</td><td>6</td><td>4K</td></tr><tr><td>V2</td><td>236B/21B</td><td>60</td><td>5120</td><td>128</td><td>160+2</td><td>6</td><td>128K</td></tr><tr><td>V2-Lite</td><td>16B/2.4B</td><td>27</td><td>2048</td><td>16</td><td>64+2</td><td>6</td><td>128K</td></tr><tr><td>Coder-V2</td><td>236B/21B</td><td>60</td><td>5120</td><td>128</td><td>160+2</td><td>6</td><td>128K</td></tr><tr><td>V3</td><td>671B/37B</td><td>61</td><td>7168</td><td>128</td><td>256+1</td><td>8</td><td>128K</td></tr><tr><td>R1</td><td>671B/37B</td><td>61</td><td>7168</td><td>128</td><td>256+1</td><td>8</td><td>128K</td></tr><tr><td>V3.1</td><td>671B/37B</td><td>61</td><td>7168</td><td>128</td><td>256+1</td><td>8</td><td>128K</td></tr><tr><td>V3.2</td><td>671B/37B</td><td>61</td><td>7168</td><td>128</td><td>256+1</td><td>8</td><td>128K</td></tr><tr><td>V4-Pro</td><td>1.6T/49B</td><td>61</td><td>7168</td><td>128</td><td>384+1</td><td>6</td><td>1M</td></tr><tr><td>V4-Flash</td><td>284B/13B</td><td>43</td><td>4096</td><td>64</td><td>256+1</td><td>6</td><td>1M</td></tr><tr><td>V4.1-Flash</td><td>552B+196B Engram；8B/16B 激活</td><td>40（20+20）</td><td>—</td><td>—</td><td>MoE+Engram</td><td>—</td><td>1M</td></tr><tr><td>OCR</td><td>3.3B</td><td>12</td><td>1280</td><td>10</td><td>64+2</td><td>6</td><td>8K</td></tr><tr><td>Prover-V2</td><td>671B/37B</td><td>61</td><td>7168</td><td>128</td><td>256+1</td><td>8</td><td>128K</td></tr></tbody></table>\n<h2>公式速查</h2>\n<p>KV cache（MHA，每 token 每层）：</p>\n<div class=\"katex-block\">2hd_h\\times\\text{字节}</div>\n<p>MLA（每 token 每层）：</p>\n<div class=\"katex-block\">(\\text{kv\\_lora\\_rank}+\\text{qk\\_rope\\_head\\_dim})\\times\\text{字节}</div>\n<p>V2 实例：</p>\n<div class=\"katex-block\">(512+64)\\times2\\times60=69{,}120\\ \\text{B/token}\\approx69\\ \\text{KB}</div>\n<p>GRPO 优势：</p>\n<div class=\"katex-block\">A_i=\\frac{r_i-\\operatorname{mean}(r)}{\\operatorname{std}(r)}</div>\n<p>CED 解码器 KV：</p>\n<div class=\"katex-block\">C_l=H_{20}W_l^{KV},\\quad l>20</div>\n<p>Sinkhorn：</p>\n<div class=\"katex-block\">M_{ij}\\leftarrow\\frac{M_{ij}}{\\sum_j M_{ij}},\\quad M_{ij}\\leftarrow\\frac{M_{ij}}{\\sum_i M_{ij}}</div>\n<p>890 B/token 的 1M 账：</p>\n<div class=\"katex-block\">890\\ \\text{B}\\times1{,}000{,}000=890\\ \\text{MB}</div>\n<h2>许可证速查</h2>\n<table><thead><tr><th>许可证</th><th>代表模型</th><th>要点</th></tr></thead><tbody><tr><td>MIT</td><td>V3、R1、V3.1、V3.2、V4、V4.1、Janus</td><td>限制最少，商用友好</td></tr><tr><td>Apache 2.0</td><td>Math-V2、OCR2</td><td>带专利授权，商用友好</td></tr><tr><td>DeepSeek Model License</td><td>LLM、Coder、MoE、V2、VL/VL2、Prover</td><td>开放权重 + 自定义条款，不是 OSI 开源</td></tr></tbody></table>\n<h2>术语速查</h2>\n<ul><li>\n<strong>总参数</strong>：显存。<strong>激活参数</strong>：算力。\n</li><li>\n<strong>MLA</strong>：缓存潜向量，不缓存完整 K/V。\n</li><li>\n<strong>DSA</strong>：索引器 + top-k。\n</li><li>\n<strong>CSA/HCA</strong>：token 维度压缩 + 分层稀疏。\n</li><li>\n<strong>CED</strong>：20 层编码 + 20 层解码，解码器复用编码器 KV。\n</li><li>\n<strong>Engram</strong>：N-gram 查表，不是矩阵乘。\n</ul>","kind":"速查表","title":"速查表"}},"base_dir":"/home/user/Doubao/chats/38454307882185474/deepseek-architecture-learning/09-deepseek-family","nav":[{"label":"学习路径","href":"#/path"},{"label":"知识图谱","href":"#/graph"},{"label":"诊断测试","href":"#/diagnosis"},{"label":"章节","children":[{"label":"第 1 章：家族地图","href":"#/chapter/ch01"},{"label":"第 2 章：Dense 起步：LLM、Coder 与 Math","href":"#/chapter/ch02"},{"label":"第 3 章：DeepSeekMoE：把 FFN 拆成细粒度专家","href":"#/chapter/ch03"},{"label":"第 4 章：V2 代：MLA + DeepSeekMoE 的组合","href":"#/chapter/ch04"},{"label":"第 5 章：V3 代：671B/37B 的骨架","href":"#/chapter/ch05"},{"label":"第 6 章：R1 代：同一副骨架，换训练目标","href":"#/chapter/ch06"},{"label":"第 7 章：V3.1 / V3.2：从推理模型到 Agent 模型","href":"#/chapter/ch07"},{"label":"第 8 章：V4 代：百万上下文成为默认","href":"#/chapter/ch08"},{"label":"第 9 章：V4.1：把 KV cache 压到 890 B/token","href":"#/chapter/ch09"},{"label":"第 10 章：多模态与专用模型","href":"#/chapter/ch10"},{"label":"第 11 章：全家族对比与选型","href":"#/chapter/ch11"},{"label":"附录：105+ 张模型卡索引","href":"#/chapter/ch12"},{"label":"第 13 章：手算手册：从参数量到 KV 账","href":"#/chapter/ch13"},{"label":"第 14 章：源码地图：拿到 config.json 和 modeling 文件怎么读","href":"#/chapter/ch14"}]},{"label":"概念","children":[{"label":"稠密模型与 MoE","href":"#/concept/c01"},{"label":"总参数与激活参数","href":"#/concept/c02"},{"label":"GQA（分组查询注意力）","href":"#/concept/c03"},{"label":"MLA（多头潜在注意力）","href":"#/concept/c04"},{"label":"DeepSeekMoE","href":"#/concept/c05"},{"label":"MTP（多 token 预测）","href":"#/concept/c06"},{"label":"GRPO（组相对策略优化）","href":"#/concept/c07"},{"label":"DSA（DeepSeek 稀疏注意力）","href":"#/concept/c08"},{"label":"CSA 与 HCA","href":"#/concept/c09"},{"label":"mHC（流形约束超连接）","href":"#/concept/c10"},{"label":"CED 与 CSA2","href":"#/concept/c11"},{"label":"Engram 与 DSpark","href":"#/concept/c12"},{"label":"视觉压缩：VL、OCR 与 Janus","href":"#/concept/c13"}]},{"label":"测验","children":[{"label":"综合测验","href":"#/quiz/all"},{"label":"测验：第 1 章：家族地图","href":"#/quiz/ch01"},{"label":"测验：第 2 章：Dense 起步：LLM、Coder 与 Math","href":"#/quiz/ch02"},{"label":"测验：第 3 章：DeepSeekMoE：把 FFN 拆成细粒度专家","href":"#/quiz/ch03"},{"label":"测验：第 4 章：V2 代：MLA + DeepSeekMoE 的组合","href":"#/quiz/ch04"},{"label":"测验：第 5 章：V3 代：671B/37B 的骨架","href":"#/quiz/ch05"},{"label":"测验：第 6 章：R1 代：同一副骨架，换训练目标","href":"#/quiz/ch06"},{"label":"测验：第 7 章：V3.1 / V3.2：从推理模型到 Agent 模型","href":"#/quiz/ch07"},{"label":"测验：第 8 章：V4 代：百万上下文成为默认","href":"#/quiz/ch08"},{"label":"测验：第 9 章：V4.1：把 KV cache 压到 890 B/token","href":"#/quiz/ch09"},{"label":"测验：第 10 章：多模态与专用模型","href":"#/quiz/ch10"},{"label":"测验：第 11 章：全家族对比与选型","href":"#/quiz/ch11"},{"label":"测验：附录：105+ 张模型卡索引","href":"#/quiz/ch12"},{"label":"测验：第 13 章：手算手册：从参数量到 KV 账","href":"#/quiz/ch13"},{"label":"测验：第 14 章：源码地图：拿到 config.json 和 modeling 文件怎么读","href":"#/quiz/ch14"}]},{"label":"抽认卡","href":"#/cards"},{"label":"术语表","href":"#/glossary"},{"label":"模式库","href":"#/patterns"},{"label":"速查表","href":"#/cheatsheet"}],"rendered":{"ch01":"<div class=\"source-badge\">出处：https://huggingface.co/deepseek-ai</div><h1>第 1 章：家族地图：先看代际，不要背模型名</h1>\n<ul><li>\n<strong>难度</strong>：★☆☆ | <strong>预估学时</strong>：1 小时 | <strong>前置</strong>：基础篇第 1–4 章\n</ul>\n<h2>学习目标</h2>\n<p>学完本章，你能：把 DeepSeek 的公开模型按四代归位；说出每一代改的是注意力、FFN 还是训练目标；看到一个陌生 checkpoint 名字时，判断它属于哪个家族、大概是什么配置。</p>\n<h2>一句话核心</h2>\n<p>DeepSeek 的模型不是十几个互不相干的“新模型”，而是四条主线上的迭代：dense 起步 → MoE 化 → MLA + MoE → 稀疏注意力与百万上下文。名字里的 <code>Base / Chat / Instruct / R1 / Terminus / Exp / Speciale / DSpark</code> 是训练阶段和部署形态，不是新的网络结构。</p>\n<h2>1. 四代主线</h2>\n<table><thead><tr><th>代</th><th>时间</th><th>代表模型</th><th>总参数 / 激活</th><th>注意力</th><th>FFN</th><th>上下文</th><th>关键变化</th></tr></thead><tbody><tr><td>Dense 起步</td><td>2023–2024</td><td>DeepSeek-LLM 7B/67B、Coder 1.3B/6.7B/33B、Math 7B</td><td>7B/67B、1.3B–33B</td><td>MHA / GQA</td><td>dense FFN</td><td>4K / 16K</td><td>先把 LLaMA 式 decoder 跑通，代码与数学分支持续预训练</td></tr><tr><td>第一次 MoE</td><td>2024</td><td>DeepSeekMoE 16B</td><td>16B / 2.8B</td><td>MHA</td><td>64 路由 + 2 共享专家，top-6</td><td>4K</td><td>细粒度专家 + 共享专家隔离</td></tr><tr><td>MLA + MoE</td><td>2024</td><td>V2 236B、V2-Lite 16B、Coder-V2 236B、V2.5</td><td>236B/21B、16B/2.4B</td><td>MLA</td><td>160 路由 + 2 共享，top-6</td><td>128K</td><td>KV cache 压缩，V2 成为后续 V3 的骨架</td></tr><tr><td>V3 代</td><td>2024–2025</td><td>V3 671B、R1 671B、V3.1、V3.2</td><td>671B/37B</td><td>MLA → DSA</td><td>256 路由 + 1 共享，top-8</td><td>128K</td><td>无辅助损失负载均衡、MTP、FP8、GRPO、Agent RL</td></tr><tr><td>V4 代</td><td>2026</td><td>V4-Pro 1.6T、V4-Flash 284B、V4.1-Flash 552B</td><td>1.6T/49B、284B/13B、552B/8B–16B</td><td>token 压缩 + DSA / CSA-HCA / CSA2</td><td>256–384 路由 + 1 共享，top-6</td><td>1M</td><td>mHC、Muon、CED、Engram、DSpark、FP4 KV</td></tr></tbody></table>\n<p>这张表是“骨架级”归类。每一代里还有若干 checkpoint，它们共享网络结构，差别主要在训练数据、后训练、精度和部署形态。</p>\n<h2>2. 名字怎么读</h2>\n<ul><li>\n<strong>Base</strong>：只做预训练，补全/续写为主，不保证听指令。\n</li><li>\n<strong>Chat / Instruct</strong>：做过指令微调，能对话。\n</li><li>\n<strong>R1 / R1-Zero</strong>：推理模型；R1-Zero 是纯 RL 版本，R1 是四阶段版本。\n</li><li>\n<strong>Terminus</strong>：同一代的小版本收尾，修语言一致性、Agent 表现，不是新架构。\n</li><li>\n<strong>Exp</strong>：实验版，通常先验证一个结构改动，再发正式版。\n</li><li>\n<strong>Speciale</strong>：长思考增强版，偏评测与研究，不保证日常对话体验。\n</li><li>\n<strong>DSpark / DFlash / Eagle3</strong>：投机解码 drafter 或蒸馏权重，不是主模型。\n</li><li>\n<strong>Vision-Exp</strong>：视觉理解实验版，主干通常复用同代文本模型。\n</li><li>\n<strong>日期后缀</strong>（<code>-0324</code>、<code>-0528</code>、<code>-0731</code>、<code>-0813</code>、<code>-1017</code>）：同结构的新训练/后训练 checkpoint，不要当成新架构。\n</ul>\n<p>看到 <code>DeepSeek-V3.2-Exp-Base</code>，拆成三部分：家族 <code>V3.2</code>、阶段 <code>Exp</code>、训练形态 <code>Base</code>。看到 <code>DeepSeek-R1-Distill-Qwen-7B</code>，拆成：方法 <code>R1</code>、蒸馏 <code>Distill</code>、学生模型 <code>Qwen-7B</code>。学生模型不是 DeepSeek 的 MoE 架构。</p>\n<h2>3. 每一代到底改了什么</h2>\n<h3>3.1 Dense 起步：先把地基打平</h3>\n<p>DeepSeek-LLM 7B/67B 是 LLaMA 式 decoder：RoPE 位置编码、SwiGLU、RMSNorm、GQA。67B 是 95 层、8192 隐藏维、64 个注意力头、8 个 KV 头，上下文 4096。Coder 33B 把上下文拉到 16K，词表缩到 32256，训练语料 87% 代码、13% 自然语言。</p>\n<p>这一代的价值是建立 tokenizer、数据管线、训练稳定性；架构上没有 DeepSeek 自己的标志性组件。</p>\n<h3>3.2 DeepSeekMoE：把 FFN 拆细</h3>\n<p>标准 MoE 通常是“少量大专家”，DeepSeekMoE 走另一条路：把每个专家切得更细，增加专家数量，同时留 2 个共享专家。16B 版本是 28 层、2048 隐藏维、64 个路由专家 + 2 个共享专家，每 token 选 6 个路由专家，激活约 2.8B。</p>\n<p>共享专家负责通用知识，路由专家负责细分知识。这样做的代价是路由和负载均衡变复杂，收益是同样激活参数下容量更大。</p>\n<h3>3.3 V2：MLA 把 KV cache 压下来</h3>\n<p>V2 是第一个把 MLA 和 DeepSeekMoE 一起上生产规模的模型：236B 总参数、21B 激活、60 层、5120 隐藏维、128 个注意力头、160 个路由专家 + 2 个共享专家、top-6、128K 上下文。</p>\n<p>MLA 把每层每 token 的 K/V 压成低维潜向量（512 维）加一个解耦的 RoPE 部分（64 维），缓存的不再是每个头的完整 K/V。论文口径是 KV cache 降低约 93.3%，吞吐提升约 5.76 倍。这个数字是端到端测量，不是单 token 字节数的理论比。</p>\n<p>V2-Lite 是同一骨架的缩小版：16B 总参数、2.4B 激活、27 层、64 路由 + 2 共享。它适合本地学习和单卡/小集群实验。</p>\n<h3>3.4 V3：把 V2 推到 671B</h3>\n<p>V3 沿用 MLA + DeepSeekMoE，但规模拉到 671B 总参数、37B 激活：61 层、7168 隐藏维、128 头、256 路由专家 + 1 共享专家、top-8、128K 上下文、14.8T 训练 token。</p>\n<p>结构上的新增点有三个：无辅助损失的负载均衡（给专家加可学习偏置，不往主损失加辅助项）、MTP（多 token 预测，额外预测 t+2）、FP8 混合精度训练。HuggingFace 上 V3 总大小 685B，其中 671B 主模型 + 14B MTP 模块，这个差额经常被误读成“V3 是 685B”。</p>\n<h3>3.5 V4：百万上下文成为默认</h3>\n<p>V4 把上下文拉到 1M，并把长上下文成本当成架构问题：token 维度压缩 + DSA 稀疏注意力，配合 mHC 残差、Muon 优化器、FP4+FP8 混合精度。V4-Pro 是 1.6T 总参数 / 49B 激活，V4-Flash 是 284B / 13B。两者不是“同架构不同大小”这么简单：层数、专家数、隐藏维都不同。</p>\n<p>V4.1-Flash 再往前走一步：552B 主干 + 196B Engram，CED 非对称编码器-解码器，CSA2 跨层 KV 复用，全局 KV 压到 890 B/token。它原生支持图像输入，prefill 8B、decode 16B 激活。</p>\n<h2>4. 同一家族里的 checkpoint 怎么处理</h2>\n<p>以 V3 家族为例：V3、V3-Base、V3-0324、V3.1、V3.1-Base、V3.1-Terminus、V3.2-Exp、V3.2、V3.2-Speciale 共享 61 层、7168 隐藏维、256 路由专家这套主干。区别是：</p>\n<ul><li>\nV3-0324：后训练更新，代码/数学/前端提升，结构不变。\n</li><li>\nV3.1：加入混合推理模板，一个模型同时支持思考/非思考，结构不变。\n</li><li>\nV3.2-Exp：引入 DSA 稀疏注意力，结构变了。\n</li><li>\nV3.2：DSA 正式版 + Agent 后训练。\n</li><li>\nV3.2-Speciale：长思考版本，结构同 V3.2，训练与推理预算不同。\n</ul>\n<p>所以读模型卡时，先看 <code>config.json</code> 的 <code>architectures</code> 和 <code>model_type</code>：<code>DeepseekV3ForCausalLM</code> 和 <code>DeepseekV32ForCausalLM</code> 是两代结构；<code>DeepseekV3ForCausalLM</code> 的多个 checkpoint 才是同结构。</p>\n<h2>5. 图示</h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[&quot;Dense：LLM / Coder / Math&quot;] --&gt; B[&quot;DeepSeekMoE：64 路由 + 2 共享&quot;]\n  B --&gt; C[&quot;V2：MLA + 160 路由&quot;]\n  C --&gt; D[&quot;V3：671B/37B + MTP + 无辅助损失均衡&quot;]\n  D --&gt; E[&quot;R1：同骨架，GRPO 四阶段&quot;]\n  D --&gt; F[&quot;V3.1：混合推理&quot;]\n  F --&gt; G[&quot;V3.2：DSA 稀疏注意力 + Agent&quot;]\n  G --&gt; H[&quot;V4：1M 上下文 + CSA/HCA + mHC&quot;]\n  H --&gt; I[&quot;V4.1：CED + CSA2 + Engram + 890 B/token&quot;]\n  A --&gt; J[&quot;多模态：VL / VL2 / Janus / OCR&quot;]\n  D --&gt; K[&quot;专用：Prover-V2 / Math-V2&quot;]</div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。</p>\n<p>看图说明：主线是“dense → MoE → MLA → 稀疏注意力 → 百万上下文”；多模态和专用模型是从不同代主干分出去的枝，不是另一条主线。</p>\n<h2>6. 常见误解</h2>\n<ul><li>\n别以为 <code>V3</code> 和 <code>V3.1</code> 是两套完全不同的网络——V3.1 主要改的是推理模板与后训练，主干配置相同。\n</li><li>\n别以为 <code>671B</code> 就是每个 token 都算 671B——MoE 只激活 37B，显存要装下全部专家，算力按激活参数估。\n</li><li>\n别以为 <code>V2-Lite</code> 是“阉割版不能用”——它是 16B/2.4B 的完整 MLA + MoE 结构，适合学习和本地推理。\n</li><li>\n别以为所有“开源”都是同一种许可证——V3/R1/V4 是 MIT，V2/VL2/Prover 是 DeepSeek Model License，Math-V2/OCR2 是 Apache 2.0。\n</ul>\n<h2>7. 自测题</h2>\n<ol><li>\nV3 的 671B 和 37B 分别指什么？（答案：B；解析：671B 总参数，37B 每 token 激活。）\n<ul>\n<li>\nA. 671B 激活，37B 总参数　B. 671B 总参数，37B 激活　C. 两者都是总参数　D. 两者都是激活参数\n</li><li>\nV3.2-Exp 相比 V3.1 的结构变化是什么？（答案：C；解析：引入 DSA 稀疏注意力。）\n</li><li>\nA. 换成 dense　B. 去掉 MoE　C. 引入 DSA 稀疏注意力　D. 改成 CNN\n</li><li>\nV2-Lite 的激活参数约多少？（答案：A；解析：16B 总参数、2.4B 激活。）\n</li><li>\nA. 2.4B　B. 16B　C. 21B　D. 37B\n</ul>\n</ol>\n<h2>8. 复习锚点</h2>\n<ul><li>\n四代主线：dense → MoE → MLA+MoE → 稀疏注意力/百万上下文。\n</li><li>\n名字里的 Base/Chat/R1/Exp/Speciale 是阶段，不是新结构。\n</li><li>\n同家族 checkpoint 先看 <code>architectures</code> 和 <code>model_type</code>。\n</li><li>\n总参数看显存，激活参数看算力。\n</li><li>\n下一章从 dense 起步开始，先把“没有路由”的模型吃透。\n</ul>","ch02":"<div class=\"source-badge\">出处：https://arxiv.org/abs/2401.02954</div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必</span> <a href=\"#/chapter/ch01\">第 1 章：家族地图</a></span></div><h1>第 2 章：dense 起步：LLM、Coder 与 Math</h1>\n<ul><li>\n<strong>难度</strong>：★☆☆ | <strong>预估学时</strong>：2 小时 | <strong>前置</strong>：第 1 章、基础篇第 1–4 章\n</ul>\n<h2>学习目标</h2>\n<p>学完本章，你能：画出 DeepSeek-LLM 67B 和 Coder 33B 的层数/头数/上下文配置；解释 GQA 为什么省 KV；说出 Coder 的 FIM 训练与 16K 上下文解决了什么问题；理解 Math 分支为什么从 Coder 继续预训练。</p>\n<h2>一句话核心</h2>\n<p>第一代没有 DeepSeek 自己的注意力或 MoE 结构，价值在于把 LLaMA 式 decoder、GQA、长上下文和代码/数学数据管线跑通。后面的 V2/V3 都建立在这套工程基础上。</p>\n<h2>1. DeepSeek-LLM：7B 与 67B</h2>\n<h3>1.1 结构</h3>\n<p>DeepSeek-LLM 的 <code>config.json</code> 是标准 LLaMA 结构：</p>\n<table><thead><tr><th>配置</th><th>7B</th><th>67B</th></tr></thead><tbody><tr><td>层数</td><td>30</td><td>95</td></tr><tr><td>隐藏维</td><td>4096</td><td>8192</td></tr><tr><td>注意力头</td><td>32</td><td>64</td></tr><tr><td>KV 头</td><td>32（MHA）</td><td>8（GQA）</td></tr><tr><td>中间维</td><td>11008</td><td>22016</td></tr><tr><td>上下文</td><td>4096</td><td>4096</td></tr><tr><td>词表</td><td>102400</td><td>102400</td></tr></tbody></table>\n<p>7B 是完整多头注意力（每个头都有自己的 K/V），67B 用 GQA：64 个查询头共享 8 组 K/V。这样 KV cache 降到原来的约 1/8，推理显存和带宽都降下来。</p>\n<h3>1.2 训练</h3>\n<p>官方口径是从零在 2 万亿 token 的中英文数据上训练。67B Base 在推理、代码、数学、中文理解上超过 Llama2 70B Base；67B Chat 在匈牙利高中考试拿到 65 分，中文能力超过 GPT-3.5。这些数字是官方模型卡口径，不是独立复现。</p>\n<h3>1.3 为什么先学它</h3>\n<p>dense 模型没有路由、没有专家并行、没有负载均衡。你只需要跟踪一条线：token → embedding → N 层（注意力 + FFN）→ logits。把这条线走通，再去看 MoE 的“多专家分支”才不会乱。</p>\n<h2>2. DeepSeek-Coder：1.3B / 6.7B / 33B</h2>\n<h3>2.1 数据与目标</h3>\n<p>Coder 系列每个模型从零在 2 万亿 token 上训练，语料 87% 代码、13% 中英文自然语言。上下文 16K，支持项目级代码补全。训练里加了填空（FIM）任务：把代码中间挖掉一段，让模型根据前后文补回来。这个目标直接对应 IDE 里的“中间补全”，不是普通的从左到右续写。</p>\n<h3>2.2 33B 的结构</h3>\n<table><thead><tr><th>项</th><th>值</th></tr></thead><tbody><tr><td>层数</td><td>62</td></tr><tr><td>隐藏维</td><td>7168</td></tr><tr><td>注意力头</td><td>56</td></tr><tr><td>KV 头</td><td>8（GQA）</td></tr><tr><td>中间维</td><td>19200</td></tr><tr><td>上下文</td><td>16384</td></tr><tr><td>词表</td><td>32256</td></tr></tbody></table>\n<p>词表比 LLM 的 102400 小很多，因为代码 token 分布不同。上下文从 4K 拉到 16K，靠 RoPE 外推与训练长度调整，不是简单改一个配置。</p>\n<h3>2.3 Coder-V2 不是 dense</h3>\n<p><code>DeepSeek-Coder-V2</code> 是 MoE：236B 总参数 / 21B 激活，从 V2 的中间 checkpoint 继续预训练 6 万亿 token，支持 338 种语言、128K 上下文。它属于 V2 家族，不是第一代 Coder 的放大版。第 4 章会讲。</p>\n<h2>3. DeepSeek-Math：7B 的数学分支</h2>\n<p>DeepSeekMath 7B 以 DeepSeek-Coder-v1.5 7B 为起点，继续在 Common Crawl 里抽出的数学相关 token 上预训练，总量约 5000 亿 token。MATH 基准 51.7%，不使用外部工具和投票。它验证了一件事：在代码/数学这种有明确结构的语料上继续预训练，比单纯堆通用语料更有效。</p>\n<p>这也是后面 R1 用“规则奖励 + 可验证答案”做 RL 的伏笔：数学题天然容易判对错。</p>\n<h2>4. 图示：dense 一层的形状</h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n  X[&quot;X: [B, L, d]&quot;] --&gt; A[&quot;RMSNorm&quot;]\n  A --&gt; Q[&quot;Q = XW_Q: [B, L, d]&quot;]\n  A --&gt; K[&quot;K = XW_K: [B, L, d_kv]&quot;]\n  A --&gt; V[&quot;V = XW_V: [B, L, d_kv]&quot;]\n  Q --&gt; S[&quot;QK^T / sqrt(d_h): [B, h, L, L]&quot;]\n  K --&gt; S\n  S --&gt; P[&quot;softmax&quot;]\n  P --&gt; O[&quot;PV: [B, h, L, d_h]&quot;]\n  V --&gt; O\n  O --&gt; R[&quot;输出投影 + 残差&quot;]\n  R --&gt; F[&quot;FFN: d -&gt; 4d -&gt; d&quot;]\n  F --&gt; Y[&quot;下一层&quot;]</div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。</p>\n<p>看图说明：dense 层的计算量主要来自两个矩阵乘法——注意力分数 <span class=\"katex-inline\">L^2d</span> 和 FFN 的 <span class=\"katex-inline\">d^2</span>。上下文翻倍，注意力分数按平方涨；这就是后面 MLA、DSA、CSA 要解决的问题。</p>\n<h2>5. GQA 的账</h2>\n<p>设 <span class=\"katex-inline\">h</span> 个查询头，<span class=\"katex-inline\">g</span> 组 KV 头，每头维度 <span class=\"katex-inline\">d_h</span>。标准 MHA 的 KV cache 每 token 每层是 <span class=\"katex-inline\">2hd_h</span> 个数；GQA 是 <span class=\"katex-inline\">2gd_h</span>。67B 的 <span class=\"katex-inline\">h=64,g=8</span>，KV cache 是 MHA 的 <span class=\"katex-inline\">8/64=1/8</span>。</p>\n<p>但 GQA 不是免费的：多个查询头共享同一组 K/V，会损失一些表达能力。DeepSeek 在 67B 上选择 <span class=\"katex-inline\">g=8</span>，是在显存和效果之间取的一个点；到 V2 的 MLA，干脆把 KV 压成潜向量，换了一条路。</p>\n<h2>6. 常见误解</h2>\n<ul><li>\n别以为 67B 的 8 个 KV 头是“只有 8 个头”——查询头还是 64 个，只是 K/V 分组共享。\n</li><li>\n别以为 Coder 的 16K 上下文是靠改一个 <code>max_position_embeddings</code> 就得到的——训练长度、RoPE 频率、数据都要配合。\n</li><li>\n别以为 Math 7B 是纯数学语料训出来的——它从 Coder 7B 继续预训练，代码能力是数学推理的底座。\n</li><li>\n别以为 Coder-V2 是第一代 Coder 的继续训练——它换成了 V2 的 MoE + MLA 骨架。\n</ul>\n<h2>7. 自测题</h2>\n<ol><li>\nDeepSeek-LLM 67B 的 KV 头数是多少？（答案：B；解析：64 个查询头、8 个 KV 头，GQA。）\n<ul>\n<li>\nA. 64　B. 8　C. 32　D. 16\n</li><li>\nCoder 的 FIM 训练对应什么任务？（答案：A；解析：挖掉中间一段，根据前后文补全。）\n</li><li>\nA. 中间填空补全　B. 图像分类　C. 语音识别　D. 机器翻译\n</li><li>\nCoder-V2 属于哪个家族？（答案：C；解析：236B/21B 的 MoE，属于 V2 家族。）\n</li><li>\nA. 第一代 dense Coder　B. V3 家族　C. V2 家族　D. Janus\n</ul>\n</ol>\n<h2>8. 复习锚点</h2>\n<ul><li>\n第一代是 LLaMA 式 dense：RoPE、SwiGLU、RMSNorm、GQA。\n</li><li>\n67B 是 95 层、8192 维、64 查询头 / 8 KV 头、4K 上下文。\n</li><li>\nCoder 33B 是 62 层、7168 维、56 头 / 8 KV 头、16K 上下文。\n</li><li>\nCoder-V2 不是 dense，是 V2 的 MoE 分支。\n</li><li>\n下一章进入 DeepSeekMoE：第一次把 FFN 拆成专家。\n</ul>","ch03":"<div class=\"source-badge\">出处：https://arxiv.org/abs/2401.06066</div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必</span> <a href=\"#/chapter/ch02\">第 2 章：Dense 起步：LLM、Coder 与 Math</a></span></div><h1>第 3 章：DeepSeekMoE：把 FFN 拆成细粒度专家</h1>\n<ul><li>\n<strong>难度</strong>：★★☆ | <strong>预估学时</strong>：2 小时 | <strong>前置</strong>：第 2 章、基础篇第 4 章\n</ul>\n<h2>学习目标</h2>\n<p>学完本章，你能：解释“细粒度专家分割 + 共享专家隔离”这两刀切在哪；手算一个 token 的路由权重；区分总参数、激活参数和显存占用；说出 DeepSeekMoE 16B 与 V2/V3 的继承关系。</p>\n<h2>一句话核心</h2>\n<p>DeepSeekMoE 不是简单地把 FFN 换成“多个大 FFN”，而是把每个 FFN 切得更细、专家数量更多，再留两个共享专家兜住通用知识。这样在相同激活参数下，模型容量更大。</p>\n<h2>1. 标准 MoE 的问题</h2>\n<p>Transformer 的 FFN 通常是一个大矩阵：<span class=\"katex-inline\">d \\to 4d \\to d</span>。MoE 把它换成 <span class=\"katex-inline\">N</span> 个专家，每个 token 只走其中 <span class=\"katex-inline\">k</span> 个。问题是：</p>\n<ul><li>\n专家太少、太大：每个专家都很宽，路由稍微一变，输出差异很大，训练不稳定。\n</li><li>\n专家太多、太小：单个专家容量不足，路由组合爆炸。\n</li><li>\n没有共享专家：每个专家都要重复学“通用语言知识”，浪费容量。\n</ul>\n<p>DeepSeekMoE 的两个设计分别对应后两个问题。</p>\n<h2>2. 两刀：细粒度分割 + 共享专家</h2>\n<h3>2.1 细粒度专家分割</h3>\n<p>把原来一个宽 FFN 切成 <span class=\"katex-inline\">m</span> 个更窄的专家，同时把激活专家数也按比例增加。原来选 2 个大专家，现在选 6 个细专家。总激活参数量差不多，但组合更多，知识分配更细。</p>\n<h3>2.2 共享专家隔离</h3>\n<p>留 <span class=\"katex-inline\">N_s</span> 个专家对所有 token 始终激活，专门学通用知识；路由专家只学细分知识。这样路由专家不用重复学“主谓宾”，共享专家也不会被路由噪声带偏。</p>\n<p>DeepSeekMoE 16B 的配置是：64 个路由专家 + 2 个共享专家，每 token 选 top-6 路由专家。共享专家始终参与，所以每个 token 实际走 6 个路由 + 2 个共享。</p>\n<h2>3. 路由手算</h2>\n<p>设 8 个路由专家，top-2，某个 token 的打分是：</p>\n<div class=\"katex-block\">s=[0.1,0.05,0.2,0.15,0.3,0.05,0.1,0.05]</div>\n<p>选第 5 个（0.3）和第 3 个（0.2）。归一化权重：</p>\n<div class=\"katex-block\">w_5=\\frac{0.3}{0.3+0.2}=0.6,\\quad w_3=\\frac{0.2}{0.5}=0.4</div>\n<p>输出：</p>\n<div class=\"katex-block\">y=0.6\\cdot E_5(x)+0.4\\cdot E_3(x)+E_{\\text{shared}}(x)</div>\n<p>如果 top-1，就只有 <span class=\"katex-inline\">E_5(x)</span>，权重 1。top-k 越大，组合越平滑，但计算越多。</p>\n<h2>4. 16B 的结构</h2>\n<table><thead><tr><th>项</th><th>值</th></tr></thead><tbody><tr><td>层数</td><td>28</td></tr><tr><td>隐藏维</td><td>2048</td></tr><tr><td>注意力头</td><td>16（MHA）</td></tr><tr><td>路由专家</td><td>64</td></tr><tr><td>共享专家</td><td>2</td></tr><tr><td>top-k</td><td>6</td></tr><tr><td>专家中间维</td><td>1408</td></tr><tr><td>激活专家</td><td>6 路由 + 2 共享（每专家 1408）</td></tr><tr><td>上下文</td><td>4096</td></tr><tr><td>总参数 / 激活</td><td>16B / 约 2.8B</td></tr></tbody></table>\n<p>论文里还有一个 145B 总参数 / 22B 激活的扩展配置，用来验证“专家再多也能训”；公开权重以 16B 为主。读论文时不要把两个配置混在一起。</p>\n<h2>5. 负载均衡：为什么专家会塌缩</h2>\n<p>如果所有 token 都挤向少数专家，其他专家收不到梯度，参数学不动，这叫专家塌缩。早期做法是加辅助损失：</p>\n<div class=\"katex-block\">\\mathcal{L}_{\\text{aux}}=\\alpha\\sum_i f_i p_i</div>\n<p>其中 <span class=\"katex-inline\">f_i</span> 是分到专家 <span class=\"katex-inline\">i</span> 的 token 比例，<span class=\"katex-inline\">p_i</span> 是路由概率均值。它惩罚负载集中，但和语言建模目标打架，<span class=\"katex-inline\">\\alpha</span> 难调。</p>\n<p>V3 改成无辅助损失的偏置：给每个专家一个可学习偏置 <span class=\"katex-inline\">b_i</span>，路由分数变成 <span class=\"katex-inline\">s_i+b_i</span>。训练时统计负载，负载高的专家调低 <span class=\"katex-inline\">b_i</span>，负载低的调高。偏置只影响“选不选”，不影响选中后的加权系数。这样不往主损失加项，也能把负载拉平。</p>\n<h2>6. 显存与算力的账</h2>\n<p>MoE 的参数量要分开看：</p>\n<ul><li>\n<strong>总参数</strong>：所有专家都要存，显存按总参数估。\n</li><li>\n<strong>激活参数</strong>：每 token 只算 top-k 专家，算力按激活参数估。\n</li><li>\n<strong>通信</strong>：专家并行时，token 要被路由到不同卡，通信量随专家并行度上升。\n</ul>\n<p>16B 总参数、2.8B 激活，意味着显存接近 16B dense，算力接近 2.8B dense。这就是 MoE 的“用显存换算力”。如果显存不够，可以把专家 offload 到 CPU/SSD，但延迟会上升。</p>\n<h2>7. 图示</h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n  X[&quot;token x&quot;] --&gt; G[&quot;门控：打分 s_i&quot;]\n  G --&gt; T[&quot;top-k 选择&quot;]\n  T --&gt; E1[&quot;路由专家 1&quot;]\n  T --&gt; E2[&quot;路由专家 k&quot;]\n  X --&gt; S[&quot;共享专家（始终激活）&quot;]\n  E1 --&gt; W[&quot;按权重求和&quot;]\n  E2 --&gt; W\n  S --&gt; W\n  W --&gt; Y[&quot;输出&quot;]</div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。</p>\n<p>看图说明：共享专家是一条“旁路”，不参与路由；路由专家只处理细分知识。两条路的输出相加，不是二选一。</p>\n<h2>8. 常见误解</h2>\n<ul><li>\n别以为 top-6 就是“6 个专家全部参与训练”——只有被选中的 6 个收到这个 token 的梯度。\n</li><li>\n别以为总参数 16B 就按 16B 算 FLOPs——算力看激活的 2.8B，但显存要装 16B。\n</li><li>\n别以为共享专家是“第 65 个路由专家”——它不参与路由，始终激活。\n</li><li>\n别以为负载均衡只是“训练技巧”——它决定专家是否被充分利用，直接影响容量。\n</ul>\n<h2>9. 自测题</h2>\n<ol><li>\nDeepSeekMoE 16B 每 token 选几个路由专家？（答案：B；解析：top-6，另有 2 个共享专家始终激活。）\n<ul>\n<li>\nA. 2　B. 6　C. 8　D. 64\n</li><li>\n共享专家的作用是什么？（答案：A；解析：始终激活，兜住通用知识，减少路由专家重复学习。）\n</li><li>\nA. 学通用知识　B. 只处理英文　C. 替代注意力　D. 只做负载均衡\n</li><li>\nMoE 的显存按什么估？（答案：C；解析：所有专家都要存，按总参数；算力按激活参数。）\n</li><li>\nA. 激活参数　B. top-k　C. 总参数　D. 词表大小\n</ul>\n</ol>\n<h2>10. 复习锚点</h2>\n<ul><li>\nDeepSeekMoE 两刀：细粒度专家分割、共享专家隔离。\n</li><li>\n16B：64 路由 + 2 共享，top-6，28 层，2048 维。\n</li><li>\n总参数看显存，激活参数看算力。\n</li><li>\n负载均衡决定专家是否被充分训练。\n</li><li>\n下一章看 V2 怎么把 MoE 和 MLA 装进同一个 236B 模型。\n</ul>","ch04":"<div class=\"source-badge\">出处：https://arxiv.org/abs/2405.04434</div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必</span> <a href=\"#/chapter/ch03\">第 3 章：DeepSeekMoE：把 FFN 拆成细粒度专家</a></span></div><h1>第 4 章：V2 代：MLA + DeepSeekMoE 的组合</h1>\n<ul><li>\n<strong>难度</strong>：★★★ | <strong>预估学时</strong>：3 小时 | <strong>前置</strong>：第 3 章、基础篇第 3–5 章\n</ul>\n<h2>学习目标</h2>\n<p>学完本章，你能：写出 V2 的 60 层/160 专家/top-6 配置；用形状解释 MLA 缓存的是什么；手算一个 token 的 KV cache 字节；区分 V2、V2-Lite、Coder-V2、V2.5 的关系。</p>\n<h2>一句话核心</h2>\n<p>V2 是 DeepSeek 第一代“生产级”架构：MLA 把 KV cache 压成低维潜向量，DeepSeekMoE 把 FFN 拆成 160 个路由专家 + 2 个共享专家。V3 的骨架就是从这里长出来的。</p>\n<h2>1. V2 的配置</h2>\n<table><thead><tr><th>项</th><th>V2</th><th>V2-Lite</th></tr></thead><tbody><tr><td>总参数 / 激
