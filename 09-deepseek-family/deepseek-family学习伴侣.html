<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>DeepSeek 模型全谱</title>
<link rel="stylesheet" href="https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.0.6/css/pico.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/dist/dist/vis-network.min.css">
<style>
:root{
  --bg:#edf1f8; --panel:#f9fbff; --text:#111827; --muted:#5b6478;
  --accent:#3950de; --accent-soft:#e4e9ff; --border:#d9e0ee;
  --ok:#0f9f74; --bad:#c62b45; --code-bg:#f2f4fa;
  --depth-bg:#fff7e0; --depth-border:#b8860b;
  --grid:rgba(17,24,39,.035);
  --font-display:"Noto Serif CJK SC","Noto Serif SC","Songti SC",STSong,Georgia,serif;
}
[data-theme="dark"]{
  --bg:#080d1a; --panel:#101a2f; --text:#f1f5ff; --muted:#8494b4;
  --accent:#5c7cff; --accent-soft:#16213b; --border:#253252;
  --ok:#2bd9a5; --bad:#ff7088; --code-bg:#0b1222;
  --depth-bg:#141b30; --depth-border:#3a4c7a;
  --grid:rgba(199,208,229,.045);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.layout{display:flex;min-height:100vh}
.sidebar{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  padding:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar h1{font-size:17px;margin:2px 0 2px}
.sidebar .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
#q{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
.nav-sec{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.nav-item{display:block;padding:5px 10px;border-radius:6px;color:var(--text);font-size:14px}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .done{float:right;color:var(--ok);font-size:12px}
#nav-toggle{display:none}
.main{flex:1;min-width:0;padding:28px 40px 80px;max-width:920px;margin:0 auto}
.page h1{font-size:26px;border-bottom:2px solid var(--border);padding-bottom:8px;margin-top:0}
.page h2{font-size:20px;margin-top:26px}
.page h3{font-size:17px;margin-top:22px}
.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.page th{background:var(--code-bg)}
.page code{background:var(--code-bg);padding:2px 5px;border-radius:4px;font-size:.9em}
.page pre{background:var(--code-bg);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
.page pre code{background:none;padding:0}
.page blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}
.page blockquote blockquote{border-color:var(--muted)}
.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}
.mermaid-hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
svg{max-width:100%;height:auto}
/* 出处脚注 */
.source-badge{font-size:12px;color:var(--muted);background:var(--code-bg);padding:4px 10px;border-radius:6px;margin:0 0 12px;display:inline-block}
/* 前置知识条 */
.prereq-bar{font-size:13px;color:var(--muted);border-left:3px solid var(--accent);padding:4px 10px;margin:0 0 12px;background:var(--accent-soft)}
.prereq-hard a{color:var(--bad);font-weight:600}
.prereq-soft a{color:var(--muted)}
.prereq-rec a{color:var(--accent)}
.prereq-tag{display:inline-block;font-size:10px;padding:0 4px;border-radius:3px;margin-right:2px;vertical-align:middle}
.prereq-hard .prereq-tag{background:var(--bad);color:#fff}
.prereq-soft .prereq-tag{background:var(--muted);color:#fff}
.prereq-rec .prereq-tag{background:var(--accent);color:#fff}
/* 误解卡片 */
.misconception-card{margin-top:10px;padding:10px 14px;border-left:4px solid var(--bad);background:#fef2f2;border-radius:0 8px 8px 0;font-size:13px}
.misconception-card b{color:var(--bad)}
[data-theme="dark"] .misconception-card{background:#2a1215}
/* 掌握度条 */
.mastery-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:4px 0}
.mastery-bar>div{height:100%;background:var(--ok);transition:width .3s}
.mastery-label{font-size:11px;color:var(--muted)}
/* 深度推导片段 */
.depth-fragment{margin:18px 0;border:1px solid var(--depth-border);border-radius:10px;background:var(--depth-bg);overflow:hidden}
.depth-fragment>summary{padding:10px 14px;cursor:pointer;font-weight:600;font-size:14px;list-style:none}
.depth-fragment>summary:hover{filter:brightness(.95)}
.depth-body{padding:14px 18px;border-top:1px dashed var(--depth-border);background:var(--panel)}
.depth-missing{color:var(--bad);font-size:13px;padding:8px;background:var(--code-bg);border-radius:6px}
/* KaTeX */
.katex-inline{font-size:1.05em}
.katex-block{overflow-x:auto;padding:8px 0;text-align:center}
.katex-block .katex{font-size:1.1em}
/* 测验 */
.quiz-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--panel)}
.quiz-q{margin:0 0 8px;font-weight:500}
.quiz-opts label{display:block;padding:4px 0;cursor:pointer}
.quiz-blank{width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.quiz-remedy{margin-top:8px;padding:8px 12px;background:var(--accent-soft);border-radius:6px;font-size:13px}
/* 抽认卡 */
.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}
#glossary-filter{width:100%;max-width:380px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:6px 0}
.search-group{margin:18px 0}
.grp-head{font-size:13px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--border);padding-bottom:5px;margin-bottom:4px}
.grp-count{margin-left:6px;font-weight:400;opacity:.75}
.syn-note{display:inline-block;margin-left:8px;padding:1px 6px;border-radius:4px;background:var(--accent-soft);color:var(--muted);font-size:12px;vertical-align:middle}
.search-hit mark,.hl{background:#fde68a;color:inherit;padding:0 1px;border-radius:2px}
.hit-hl{background:#fbbf24;color:inherit;border-radius:3px;box-shadow:0 0 0 2px #fde68a}
.hit-flash{animation:hitFlash 1.8s ease-out}
@keyframes hitFlash{from{background:#f59e0b}to{background:#fbbf24}}
[data-theme="dark"] .search-hit mark,[data-theme="dark"] .hl{background:#92400e;color:#fef3c7}
[data-theme="dark"] .hit-hl{background:#b45309;color:#fff;box-shadow:0 0 0 2px #78350f}
.topbar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;justify-content:flex-end;z-index:10}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
#progress-export,#progress-import{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px;white-space:nowrap;margin-right:8px}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:8px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.empty{color:var(--muted);padding:20px 0}
/* 诊断 */
.diag-controls{margin:14px 0;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
#diag-start{padding:8px 20px;border:none;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;font-size:14px}
#diag-progress{margin-left:12px;color:var(--muted);font-size:13px}
#diag-stage .quiz-item{margin:10px 0}
#diag-result{margin-top:16px;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
.diag-remedy-item{padding:10px;margin:8px 0;background:var(--accent-soft);border-radius:8px;font-size:14px}
@media print{.sidebar,.topbar,.quiz-actions,.card-actions,.card-controls,.diag-controls{display:none!important}.main{max-width:none;padding:0}}
@media (max-width:760px){.sidebar{width:100%;height:auto;position:static;padding:10px 14px}
  #nav{display:none;max-height:46vh;overflow-y:auto;overscroll-behavior:contain}.sidebar.open #nav{display:block}
  .nav-item{padding:9px 10px}
  #q,#glossary-filter{font-size:16px}
  .quiz-opts label{padding:8px 0;min-height:30px}
  .quiz-check{padding:10px 18px;min-height:40px}
  #diag-start{min-height:40px}
  .card-actions button{min-height:40px}
  #nav-toggle{display:block;width:100%;padding:8px 10px;margin:4px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;text-align:left;cursor:pointer}
  .layout{flex-direction:column}.main{padding:20px 18px 64px;max-width:none;width:100%}
  .page{overflow-wrap:anywhere}.page table{display:block;overflow-x:auto;max-width:100%}
  .page h1,.page h2,.page h3{line-height:1.35}}
</style>
<style id="visual-skin">
:root{--font-body:"Noto Sans CJK SC","Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --font-mono:"JetBrains Mono","SFMono-Regular",Consolas,"Liberation Mono",monospace}
html,body{overflow-x:clip;max-width:100%}
body{font-family:var(--font-body);background-color:var(--bg);
  background-image:radial-gradient(circle at 1px 1px,var(--grid) 1px,transparent 0);background-size:26px 26px;
  color:var(--text);line-height:1.8;font-size:15.5px;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
::selection{background:var(--accent);color:#fff}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sidebar{width:280px;padding:20px 18px;background:var(--panel);border-right:1px solid var(--border)}
.sidebar h1{font-family:var(--font-display);font-size:1.15rem;line-height:1.42;font-weight:600;letter-spacing:-.01em;margin:0 0 6px}
.sidebar .sub{font-size:11.5px;line-height:1.65;color:var(--muted);margin-bottom:16px}
#q{height:38px;background:var(--code-bg);border:1px solid var(--border);border-radius:8px;font-size:14px;padding:0 10px;margin-bottom:14px}
#q::placeholder{color:var(--muted)}
.nav-sec{font-size:10.5px;letter-spacing:.1em;color:var(--muted);margin:18px 0 6px}
.nav-item{padding:7px 10px;border-radius:8px;font-size:13.5px;line-height:1.5;color:var(--text)}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.main{padding:34px 44px 96px;max-width:940px}
.topbar{background:var(--bg);padding:0 0 14px;margin-bottom:24px;border-bottom:1px solid var(--border);gap:8px}
.topbar button{height:32px;padding:0 11px;border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;font-size:12.5px;font-family:var(--font-body)}
.topbar button:hover{border-color:var(--accent);color:var(--accent)}
#progress-bar{height:4px;background:var(--border);border-radius:0;margin:10px 0 8px}
#progress-bar>div{background:var(--accent);transition:none}
.page h1{font-family:var(--font-display);font-size:clamp(1.5rem,3vw,2.1rem);line-height:1.42;font-weight:600;letter-spacing:-.015em;border-bottom:1px solid var(--border);padding-bottom:14px}
.page h2{font-family:var(--font-display);font-size:1.45rem;line-height:1.5;font-weight:600;margin-top:36px}
.page h3{font-size:1.08rem;line-height:1.55;margin-top:28px}
.page p{margin:12px 0}
.page table{font-size:13.5px;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.page th,.page td{border:1px solid var(--border);padding:8px 11px}
.page th{background:var(--code-bg);font-weight:600;color:var(--text)}
.page code{background:var(--code-bg);border:1px solid var(--border);border-radius:4px;font-family:var(--font-mono);font-size:.9em;padding:1px 5px}
.page pre{background:var(--code-bg);border:1px solid var(--border);border-radius:10px;padding:14px;font-family:var(--font-mono);font-size:13px}
.page blockquote{border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0;padding:8px 14px}
.source-badge{font-size:11.5px;background:var(--code-bg);border:1px solid var(--border);border-radius:6px;padding:4px 10px;color:var(--muted)}
.prereq-bar{border-left:3px solid var(--accent);background:var(--accent-soft);padding:6px 12px;border-radius:0 8px 8px 0}
.misconception-card{background:var(--code-bg);border-left:3px solid var(--bad);border-radius:0 8px 8px 0}
.depth-fragment{background:var(--depth-bg);border:1px solid var(--depth-border);border-radius:10px}
.depth-fragment>summary{color:var(--text)}
.mermaid{background:var(--code-bg);border:1px solid var(--border);border-radius:8px}
@media (max-width:760px){
  .sidebar{width:100%;height:auto;position:static;padding:14px 16px;border-right:0;border-bottom:1px solid var(--border)}
  .sidebar h1{font-size:1.05rem}
  .main{padding:24px 18px 64px;max-width:none}
  .topbar{padding-bottom:10px;margin-bottom:18px}
  .page h1{font-size:1.5rem}
  .page h2{font-size:1.25rem}
  .nav-item{padding:9px 10px;min-height:36px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media print{.sidebar,.topbar{display:none!important}.main{max-width:none;padding:0}}
</style>
<style id="zs-visual-theme">
/* 知枢 · 深色视觉层 · 只改样式，不改结构
   适用：知枢多书总入口 / 单书伴侣 / 旧版从零推导页。
   设计口径：深色底、钴蓝+鲸青、衬线标题、点阵底纹、无玻璃拟态。 */

:root,
html[data-theme="dark"],
body[data-theme="dark"] {
  --bg: #080d1a;
  --bg-soft: #0b1222;
  --bg2: #0b1222;
  --bg3: #16213b;
  --panel: #101a2f;
  --panel-2: #16213b;
  --card: #101a2f;
  --text: #f1f5ff;
  --text2: #c7d0e5;
  --text3: #8494b4;
  --muted: #8494b4;
  --border: #253252;
  --accent: #5c7cff;
  --accent-strong: #4d6bff;
  --accent2: #16c7d9;
  --accent3: #2bd9a5;
  --accent-soft: #18264a;
  --ok: #2bd9a5;
  --bad: #ff7088;
  --warn: #f5b35c;
  --danger: #ff7088;
  --code-bg: #0a1120;
  --dot: rgba(92, 124, 255, .12);
  --radius: 10px;
  --font-display: "Noto Serif CJK SC", "Noto Serif SC", "Songti SC", "STSong", Georgia, serif;
  --font-body: "Noto Sans CJK SC", "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  --ink: #f1f5ff;
  --ink-2: #c7d0e5;
  --ink-3: #8494b4;
  --paper: #080d1a;
  --paper-2: #101a2f;
  --wash: #0b1222;
  --line: #253252;
  --line-soft: #1b2742;
}

html[data-theme="light"],
body[data-theme="light"],
body[data-theme=""] {
  --bg: #edf1f8;
  --bg-soft: #e4eaf5;
  --bg2: #e4eaf5;
  --bg3: #dbe4f2;
  --panel: #f9fbff;
  --panel-2: #f1f5fc;
  --card: #f9fbff;
  --text: #111827;
  --text2: #26324a;
  --text3: #5b6b86;
  --muted: #5b6b86;
  --border: #c9d4e8;
  --accent: #3950de;
  --accent-strong: #2f43c9;
  --accent2: #0e8fa4;
  --accent3: #12805f;
  --accent-soft: #dbe4ff;
  --ok: #12805f;
  --bad: #c02a44;
  --warn: #9a5b00;
  --danger: #c02a44;
  --code-bg: #eef2f9;
  --dot: rgba(57, 80, 222, .10);
  --ink: #111827;
  --ink-2: #26324a;
  --ink-3: #5b6b86;
  --paper: #edf1f8;
  --paper-2: #f9fbff;
  --wash: #e4eaf5;
  --line: #c9d4e8;
  --line-soft: #dbe4f2;
}

html,
body {
  background-color: var(--bg) !important;
  color: var(--text) !important;
}

body {
  font-family: var(--font-body) !important;
  background-image: radial-gradient(circle at 1px 1px, var(--dot) 1px, transparent 1.2px);
  background-size: 26px 26px;
  background-attachment: fixed;
  font-size: 16px;
  line-height: 1.72;
}

h1, h2, h3, h4, h5,
.page h1, .page h2, .page h3,
.brand, .hero-title, .title {
  font-family: var(--font-display) !important;
  letter-spacing: -.012em;
}

h1, h2, h3, h4, h5,
.page h1, .page h2, .page h3 {
  color: var(--text) !important;
}

header,
.topbar,
.topbar-fixed,
#topbar,
.site-header {
  background: var(--bg) !important;
  border-color: var(--border) !important;
  color: var(--text) !important;
}

header,
.topbar,
.topbar-fixed,
#topbar {
  box-shadow: 0 1px 0 var(--border);
}

/* 通用 hero / 页头：旧版单页常用 .header 或 .hero，不是 header 标签 */
.hero,
.header,
.page-header,
.hero-block {
  background: var(--bg) !important;
  color: var(--text) !important;
  border-bottom: 1px solid var(--border);
  box-shadow: none !important;
}

.hero h1,
.header h1,
.page-header h1,
.hero p,
.header p,
.page-header p {
  color: var(--text) !important;
}

.section-title {
  border-left-color: var(--accent) !important;
  color: var(--text) !important;
}

.stat .num,
.metric .num,
.kpi .value {
  color: var(--accent2) !important;
}


.brand span,
.sub,
.meta,
.muted,
.text-muted,
.card .meta,
.book-card .meta {
  color: var(--muted) !important;
}

.sidebar,
aside.sidebar,
#sidebar,
.rail {
  background: var(--bg-soft) !important;
  border-color: var(--border) !important;
}

.main,
main.main,
#view,
.view {

构主线的最合理排序是？","options":["dense → MoE → MLA + MoE → 稀疏注意力/百万上下文","MoE → dense → MLA → CNN","dense → MLA → MoE → RNN","V2 → V3 → V1 → V4"],"answer":0,"explain":"先 dense，再把 FFN 拆成 MoE，再用 MLA 压 KV，最后用 DSA/CSA 做稀疏长上下文。","relatedConceptId":"c01"},{"id":"q02","chapterId":"ch01","type":"single","question":"模型卡写“671B/37B”，这两个数分别指？","options":["671B 激活，37B 总参数","671B 总参数，37B 每 token 激活","两者都是总参数","两者都是激活参数"],"answer":1,"explain":"MoE 的总参数要全装，激活参数决定每 token 算力。","relatedConceptId":"c02"},{"id":"q03","chapterId":"ch01","type":"single","question":"哪个 checkpoint 第一次把 `architectures` 换成 `DeepseekV32ForCausalLM`？","options":["V3","V3.1","V3.2-Exp","V3.1-Terminus"],"answer":2,"explain":"V3.2-Exp 引入 DSA，结构标识随之变化；V3.1 仍是 V3 结构。","relatedConceptId":"c08"},{"id":"q04","chapterId":"ch02","type":"single","question":"DeepSeek-LLM 67B 的 KV 头数是多少？","options":["64","8","32","16"],"answer":1,"explain":"67B 是 64 个查询头、8 个 KV 头的 GQA。","relatedConceptId":"c03"},{"id":"q05","chapterId":"ch02","type":"single","question":"Coder 的 FIM 训练对应哪种任务？","options":["中间填空补全","图像分类","语音识别","机器翻译"],"answer":0,"explain":"FIM 把代码中间挖掉，让模型根据前后文补回，对应 IDE 中间补全。","relatedConceptId":"c01"},{"id":"q06","chapterId":"ch02","type":"single","question":"DeepSeek-Coder-V2 属于哪个家族？","options":["第一代 dense Coder","V3 家族","V2 家族","Janus"],"answer":2,"explain":"Coder-V2 是 236B/21B 的 V2 骨架代码继续预训练，不是 dense Coder 放大。","relatedConceptId":"c01"},{"id":"q07","chapterId":"ch03","type":"single","question":"DeepSeekMoE 16B 每 token 选几个路由专家？","options":["2","6","8","64"],"answer":1,"explain":"top-6 路由专家，另有 2 个共享专家始终激活。","relatedConceptId":"c05"},{"id":"q08","chapterId":"ch03","type":"single","question":"共享专家的主要作用是什么？","options":["学通用知识，减少路由专家重复学习","只处理英文","替代注意力","只做负载均衡"],"answer":0,"explain":"共享专家始终激活，兜住通用语言知识；路由专家专注细分知识。","relatedConceptId":"c05"},{"id":"q09","chapterId":"ch03","type":"single","question":"MoE 的显存占用主要按什么估？","options":["激活参数","top-k","总参数","词表大小"],"answer":2,"explain":"所有专家都要存，显存按总参数；算力按激活参数。","relatedConceptId":"c02"},{"id":"q10","chapterId":"ch04","type":"single","question":"MLA 推理时持久缓存的核心内容是什么？","options":["每个头的完整 K/V","低维潜向量 c 和解耦 RoPE key","只有 Query","整个隐藏层"],"answer":1,"explain":"MLA 缓存 512 维潜向量 + 64 维 RoPE key，计算时再上投影还原 K/V。","relatedConceptId":"c04"},{"id":"q11","chapterId":"ch04","type":"single","question":"V2 的路由专家数量是多少？","options":["64","128","160","256"],"answer":2,"explain":"V2 是 160 个路由专家 + 2 个共享专家，top-6。","relatedConceptId":"c05"},{"id":"q12","chapterId":"ch04","type":"single","question":"V2-Lite 的总参数/激活参数约多少？","options":["16B/2.4B","236B/21B","671B/37B","7B/7B"],"answer":0,"explain":"V2-Lite 保留完整 MLA + MoE 结构，规模缩到 16B/2.4B。","relatedConceptId":"c02"},{"id":"q13","chapterId":"ch05","type":"single","question":"V3 的 MTP 在位置 t 额外预测哪个 token？","options":["t+1","t+2","t-1","随机位置"],"answer":1,"explain":"MTP 在预测 t+1 的同时额外预测 t+2，增加训练信号密度。","relatedConceptId":"c06"},{"id":"q14","chapterId":"ch05","type":"single","question":"V3 有多少个路由专家？","options":["64","160","256","384"],"answer":2,"explain":"V3 是 256 路由 + 1 共享，top-8；384 是 V4-Pro。","relatedConceptId":"c05"},{"id":"q15","chapterId":"ch05","type":"single","question":"HuggingFace 上 V3 的 685B 权重由什么组成？","options":["671B 主模型 + 14B MTP","685B 全是主模型","671B + 14B 视觉编码器","685B 全是专家"],"answer":0,"explain":"V3 主模型 671B，MTP 模块 14B，合计约 685B。","relatedConceptId":"c06"},{"id":"q16","chapterId":"ch06","type":"single","question":"R1-Zero 与 R1 的关键区别是什么？","options":["有没有冷启动 SFT","参数规模不同","注意力不同","词表不同"],"answer":0,"explain":"R1-Zero 从 Base 直接纯 RL；R1 先做冷启动 SFT，再做推理 RL、拒绝采样和再对齐。","relatedConceptId":"c07"},{"id":"q17","chapterId":"ch06","type":"single","question":"GRPO 的优势怎么算？","options":["用 value model 估","组内奖励减均值、除以标准差","直接取奖励","用人类偏好打分"],"answer":1,"explain":"GRPO 对同一题采一组回答，做组内标准化；全对/全错组标准差为 0，没有梯度。","relatedConceptId":"c07"},{"id":"q18","chapterId":"ch06","type":"single","question":"R1 蒸馏的 Qwen-7B 学生模型是什么架构？","options":["DeepSeek V3 MoE","MLA","Qwen dense","CNN"],"answer":2,"explain":"蒸馏学生是 Qwen2.5/Llama dense，继承 R1 的输出分布，不继承 DeepSeek MoE 结构。","relatedConceptId":"c07"},{"id":"q19","chapterId":"ch07","type":"single","question":"V3.2-Exp 的结构变化是什么？","options":["换成 dense","引入 DSA 稀疏注意力","去掉 MoE","改成 CNN"],"answer":1,"explain":"DSA 用轻量索引器 + top-k，把长上下文注意力成本从 O(L^2) 降到约 O(Lk)。","relatedConceptId":"c08"},{"id":"q20","chapterId":"ch07","type":"single","question":"V3.2 的“思考融入工具调用”指什么？","options":["思考与工具调用交替进行","只思考不调工具","只调工具不思考","两个模型分别做"],"answer":0,"explain":"V3.2 在思考模式下可以多轮“想 → 调工具 → 再想”，同时支持思考/非思考工具调用。","relatedConceptId":"c08"},{"id":"q21","chapterId":"ch07","type":"single","question":"V3.2-Speciale 的主要限制是什么？","options":["没有公开权重","不支持中文","不支持工具调用，偏研究评测","只有 7B"],"answer":2,"explain":"Speciale 是长思考增强版，只通过临时 API 开放，不支持工具调用。","relatedConceptId":"c08"},{"id":"q22","chapterId":"ch08","type":"single","question":"V4-Pro 的总参数/激活约多少？","options":["1.6T/49B","284B/13B","671B/37B","552B/8B"],"answer":0,"explain":"V4-Pro 是 1.6T 总参数、49B 激活；V4-Flash 是 284B/13B。","relatedConceptId":"c02"},{"id":"q23","chapterId":"ch08","type":"single","question":"CSA 的 m=4 表示什么？","options":["4 个注意力头","每 4 个 token 的 KV 压成一个条目","4 层","top-k=4"],"answer":1,"explain":"CSA 按每 4 个 token 压一个条目，再做 top-k 稀疏选择。","relatedConceptId":"c09"},{"id":"q24","chapterId":"ch08","type":"single","question":"mHC 的 Sinkhorn 迭代目标是什么？","options":["稀疏矩阵","单位矩阵","双随机矩阵","对角矩阵"],"answer":2,"explain":"Sinkhorn 交替行/列归一化，把混合矩阵约束成每行和 1、每列和 1 的双随机矩阵。","relatedConceptId":"c10"},{"id":"q25","chapterId":"ch09","type":"single","question":"V4.1 的主干参数是多少？","options":["284B","552B","1.6T","671B"],"answer":1,"explain":"V4.1 是 552B 主干 + 196B Engram，HF 总权重约 763B。","relatedConceptId":"c02"},{"id":"q26","chapterId":"ch09","type":"single","question":"CED 的解码器全局 KV 来自哪里？","options":["每层自己算","输入 embedding","编码器第 20 层隐藏状态投影","Engram 查表"],"answer":2,"explain":"解码器第 l 层全局 KV = H20 乘投影矩阵，prefill 只算前 20 层编码器。","relatedConceptId":"c11"},{"id":"q27","chapterId":"ch09","type":"single","question":"CSA2 的 Reuse 模式复用了什么？","options":["KV 和上一层 top-k 索引","只复用 Q","只复用位置编码","完全重算"],"answer":0,"explain":"Reuse 复用主 KV 和上一层选好的 top-k 索引；分布漂移时改用 Reindex。","relatedConceptId":"c11"},{"id":"q28","chapterId":"ch09","type":"single","question":"V4.1 的 890 B/token 指什么？","options":["每 token 全部缓存","每 token 全局 KV 的稳态占用","每 token 的模型权重","每 token 的激活参数"],"answer":1,"explain":"890 B/token 是全局 KV，不含持久 KV、SWA、Engram、激活和框架开销。","relatedConceptId":"c11"},{"id":"q29","chapterId":"ch10","type":"single","question":"VL2 的 1.0B/2.8B/4.5B 指什么？","options":["总参数","激活参数","层数","上下文长度"],"answer":1,"explain":"VL2 Tiny/Small/Base 的激活参数分别是 1.0B/2.8B/4.5B，总参数更高。","relatedConceptId":"c13"},{"id":"q30","chapterId":"ch10","type":"single","question":"Janus 的“解耦视觉编码”指什么？","options":["理解和生成用不同视觉路径","只用一种编码器","不用视觉编码器","只做生成"],"answer":0,"explain":"理解用 SigLIP-L 这类语义编码器，生成用 VQ tokenizer，两条路径分开。","relatedConceptId":"c13"},{"id":"q31","chapterId":"ch10","type":"single","question":"Prover-V2-671B 用哪代语言主干？","options":["V2","V4","V3","Janus"],"answer":2,"explain":"Prover-V2-671B 直接用 V3 的 61 层/7168 维/256 路由结构，做 Lean 证明训练。","relatedConceptId":"c05"},{"id":"q32","chapterId":"ch10","type":"single","question":"OCR2 的核心结构变化是什么？","options":["换成 dense","视觉因果流","去掉视觉编码器","改成 CNN"],"answer":1,"explain":"OCR2 用 Visual Causal Flow 按阅读顺序处理版面，仍是 3B 级 MoE。","relatedConceptId":"c13"},{"id":"q33","chapterId":"ch11","type":"single","question":"哪个模型首次引入 MLA？","options":["V3","V2","R1","V4"],"answer":1,"explain":"V2 是第一个把 MLA + DeepSeekMoE 上生产规模的模型。","relatedConceptId":"c04"},{"id":"q34","chapterId":"ch11","type":"single","question":"哪个模型首次引入 DSA？","options":["V2","V3.1","V3.2-Exp","V4.1"],"answer":2,"explain":"V3.2-Exp 于 2025-09-29 引入 DSA，API 价格降 50% 以上。","relatedConceptId":"c08"},{"id":"q35","chapterId":"ch11","type":"single","question":"V4.1 的 552B 和 196B 分别是什么？","options":["主干 + Engram","两次专家数","训练/推理参数","视觉/文本参数"],"answer":0,"explain":"552B 是主干，196B 是 Engram 查表参数；prefill/decode 激活是 8B/16B。","relatedConceptId":"c12"},{"id":"q36","chapterId":"ch11","type":"single","question":"下列哪类许可证商用限制最少？","options":["MIT/Apache 2.0","DeepSeek Model License","无许可证","仅研究许可"],"answer":0,"explain":"MIT/Apache 2.0 是 OSI 开源许可证；DeepSeek Model License 是自定义开放权重条款。","relatedConceptId":"c02"},{"id":"q37","chapterId":"ch13","type":"single","question":"dense 模型参数量粗估公式是？","options":["12Ld²","Ld","2Ld","4Ld²"],"answer":0,"explain":"注意力约 4d² + FFN 约 8d²，合计 12d² 每层。","relatedConceptId":"c02"},{"id":"q38","chapterId":"ch13","type":"single","question":"V3 的注意力部分粗估多少 B？","options":["约 12.54B","约 2.55B","约 653.9B","约 671B"],"answer":0,"explain":"61 层 × 4 × 7168² ≈ 12.54B。","relatedConceptId":"c04"},{"id":"q39","chapterId":"ch13","type":"single","question":"V3 的 128K 单序列 KV 约多少？","options":["约 9.21 GB","约 890 MB","约 48 GB","约 1.34 TB"],"answer":0,"explain":"70,272 B/token × 131,072 ≈ 9.21 GB。","relatedConceptId":"c04"},{"id":"q40","chapterId":"ch13","type":"single","question":"V4.1 的 1M 单序列全局 KV 约多少？","options":["约 890 MB","约 9 GB","约 48 GB","约 2.4 TB"],"answer":0,"explain":"890 B/token × 1M = 890 MB，只是全局 KV。","relatedConceptId":"c11"},{"id":"q41","chapterId":"ch14","type":"single","question":"`first_k_dense_replace=3` 意味着什么？","options":["前 3 层是 dense FFN","前 3 层是 MoE","只有 3 层","3 个共享专家"],"answer":0,"explain":"前 3 层用 dense FFN，之后才换成 MoE。","relatedConceptId":"c05"},{"id":"q42","chapterId":"ch14","type":"single","question":"MLA 缓存的两个张量是什么？","options":["c 和 k_pe","q 和 k","k_nope 和 v","全部 K/V"],"answer":0,"explain":"缓存潜向量 c 和 RoPE key k_pe；k_nope/v 计算时还原。","relatedConceptId":"c04"}],"flashcards":[{"id":"f01","chapterId":"ch01","front":"DeepSeek 四代结构主线","back":"dense → MoE → MLA + MoE → DSA/CSA + 百万上下文","tags":"主线,代际"},{"id":"f02","chapterId":"ch01","front":"671B/37B 各指什么","back":"671B 总参数（显存），37B 每 token 激活（算力）","tags":"参数,MoE"},{"id":"f03","chapterId":"ch02","front":"DeepSeek-LLM 67B 的注意力","back":"64 查询头 / 8 KV 头，GQA","tags":"LLM,GQA"},{"id":"f04","chapterId":"ch02","front":"Coder 的 FIM 是什么","back":"中间填空：挖掉代码中间，按前后文补回","tags":"Coder,FIM"},{"id":"f05","chapterId":"ch02","front":"Coder-V2 属于哪个家族","back":"V2 家族，236B/21B 的代码继续预训练","tags":"Co
