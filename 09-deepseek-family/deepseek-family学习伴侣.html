活</td><td>236B / 21B</td><td>16B / 2.4B</td></tr><tr><td>层数</td><td>60</td><td>27</td></tr><tr><td>隐藏维</td><td>5120</td><td>2048</td></tr><tr><td>注意力头</td><td>128</td><td>16</td></tr><tr><td>路由专家</td><td>160</td><td>64</td></tr><tr><td>共享专家</td><td>2</td><td>2</td></tr><tr><td>top-k</td><td>6</td><td>6</td></tr><tr><td>专家中间维</td><td>1536</td><td>1408</td></tr><tr><td>上下文</td><td>128K（配置 163840）</td><td>128K（配置 163840）</td></tr><tr><td>训练 token</td><td>8.1T</td><td>未单独披露</td></tr></tbody></table>\n<p>V2 的 21B 激活、236B 总参数，是“用显存换算力”的典型：显存按 236B 估，算力按 21B 估。<code>config.json</code> 里还有一个容易忽略的字段：<code>first_k_dense_replace=1</code>，意思是第 1 层用 dense FFN，从第 2 层起才是 MoE。算参数量时要把这层单独算，不能直接拿 60 层乘专家数。</p>\n<h2>2. MLA：缓存潜向量，不缓存完整 K/V</h2>\n<h3>2.1 标准 MHA 的缓存</h3>\n<p>每个 token、每层、每个头都要存 K 和 V，各 <span class=\"katex-inline\">d_h</span> 个数。128 头、128 维、60 层、BF16：</p>\n<div class=\"katex-block\">2\\times128\\times128\\times2\\times60\\approx3{,}932{,}160\\ \\text{字节/token}</div>\n<p>约 3.9 MB/token。1M 上下文单序列就是 3.9 TB，根本放不下。</p>\n<h3>2.2 MLA 的做法</h3>\n<p>MLA 不直接存每头的 K/V，而是把 K/V 联合压缩成一个低维潜向量 <span class=\"katex-inline\">c_t</span>（512 维），再存一个解耦的 RoPE 部分 <span class=\"katex-inline\">k_t^R</span>（64 维）。推理时只缓存这两部分，需要 K/V 时再用上投影矩阵还原。</p>\n<p>配置里对应：</p>\n<ul><li>\n<code>kv_lora_rank = 512</code>\n</li><li>\n<code>qk_rope_head_dim = 64</code>\n</li><li>\n<code>qk_nope_head_dim = 128</code>\n</li><li>\n<code>v_head_dim = 128</code>\n</ul>\n<p>每 token 每层缓存约 <span class=\"katex-inline\">512+64=576</span> 个数，BF16：</p>\n<div class=\"katex-block\">576\\times2\\times60=69{,}120\\ \\text{字节/token}</div>\n<p>约 69 KB/token。与 MHA 的 3.9 MB 相比，理论比约 57 倍。论文口径的 KV cache 降低 93.3%、吞吐提升 5.76 倍，是端到端测量，包含带宽、并行和 kernel 效率，不等于单 token 字节数的理论比。</p>\n<h3>2.3 为什么能这样压</h3>\n<p>K/V 的主要信息集中在低维子空间里。MLA 用低秩投影把 K/V 压到 512 维，再用上投影还原。代价是多了投影矩阵的计算，但推理时省下的显存和带宽远大于这点计算。</p>\n<h2>3. Coder-V2：V2 的代码分支</h2>\n<p>Coder-V2 是 236B/21B 的 MoE，从 V2 中间 checkpoint 继续预训练 6T token，支持 338 种语言、128K 上下文。它不是第一代 Coder 的放大版，而是 V2 骨架的代码继续预训练。代码任务上对标 GPT-4-Turbo，通用能力与 V2 持平。</p>\n<p>Coder-V2-Lite 是 16B/2.4B 的版本，适合本地实验。</p>\n<h2>4. V2.5：把 Chat 和 Coder 合并</h2>\n<p>V2.5 不是一个新结构，而是把 V2 Chat 和 Coder V2 合并后做统一后训练：通用能力、代码、写作、指令跟随一起对齐。API 上 <code>deepseek-chat</code> 和 <code>deepseek-coder</code> 都指向 V2.5。V2.5-1210 是 2024 年 12 月的更新版，MATH-500 从 74.8% 到 82.8%，LiveCodeBench 从 29.2% 到 34.38%。</p>\n<p>这说明一件事：同一副 V2 骨架，通过数据配比和后训练，可以覆盖通用与代码两种场景，不必为每个场景单独训一套结构。</p>\n<h2>5. 形状表</h2>\n<table><thead><tr><th>张量</th><th>形状</th></tr></thead><tbody><tr><td>输入 <span class=\"katex-inline\">X</span></td><td><span class=\"katex-inline\">[B,L,5120]</span></td></tr><tr><td>Q 投影</td><td><span class=\"katex-inline\">[B,L,128\\times(128+64)]</span></td></tr><tr><td>KV 潜向量 <span class=\"katex-inline\">c</span></td><td><span class=\"katex-inline\">[B,L,512]</span></td></tr><tr><td>RoPE key</td><td><span class=\"katex-inline\">[B,L,64]</span></td></tr><tr><td>还原后的 K/V</td><td><span class=\"katex-inline\">[B,L,128,128]</span></td></tr><tr><td>注意力分数</td><td><span class=\"katex-inline\">[B,128,L,L]</span></td></tr></tbody></table>\n<p>注意：缓存的是 <span class=\"katex-inline\">c</span> 和 RoPE key，不是还原后的完整 K/V。还原发生在计算时，不占持久显存。</p>\n<h2>6. 图示</h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n  X[&quot;X: [B,L,5120]&quot;] --&gt; C[&quot;下投影：c = XW_DKV&quot;]\n  C --&gt; Cache[&quot;缓存 c: 512 维&quot;]\n  C --&gt; Up[&quot;上投影还原 K/V&quot;]\n  X --&gt; R[&quot;RoPE key: 64 维&quot;]\n  R --&gt; Cache2[&quot;缓存 RoPE key&quot;]\n  Up --&gt; Attn[&quot;MLA 注意力&quot;]\n  Cache --&gt; Attn\n  Cache2 --&gt; Attn\n  Attn --&gt; O[&quot;输出&quot;]</div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。</p>\n<p>看图说明：缓存路径（下投影 + RoPE）和计算路径（上投影还原）分开。省显存的关键是只存低维潜向量，不存还原后的完整 K/V。</p>\n<h2>7. 常见误解</h2>\n<ul><li>\n别以为 MLA 是“把 K/V 量化成 8 bit”——它是低秩压缩，不是量化。\n</li><li>\n别以为缓存 512 维就等于每层只算 512 维——还原后仍是 128 头、128 维的 K/V，只是不持久存。\n</li><li>\n别以为 V2-Lite 只是“参数少一点”——它保留了 MLA + MoE 的完整结构，是学习 V2 的最小可用样本。\n</li><li>\n别以为 V2.5 是新架构——它是 V2 骨架的合并后训练版。\n</ul>\n<h2>8. 自测题</h2>\n<ol><li>\nMLA 推理时缓存的核心内容是什么？（答案：B；解析：低维潜向量 c 和解耦的 RoPE key。）\n<ul>\n<li>\nA. 每个头的完整 K/V　B. 低维潜向量和 RoPE key　C. 只有 Query　D. 整个隐藏层\n</li><li>\nV2 的路由专家数量是多少？（答案：C；解析：160 个路由 + 2 个共享，top-6。）\n</li><li>\nA. 64　B. 128　C. 160　D. 256\n</li><li>\nV2-Lite 的总参数/激活参数约多少？（答案：A；解析：16B 总参数、2.4B 激活。）\n</li><li>\nA. 16B/2.4B　B. 236B/21B　C. 671B/37B　D. 7B/7B\n</ul>\n</ol>\n<h2>9. 复习锚点</h2>\n<ul><li>\nV2：236B/21B、60 层、5120 维、128 头、160 路由 + 2 共享、top-6、128K。\n</li><li>\nMLA 缓存 <span class=\"katex-inline\">c</span>（512）+ RoPE key（64），不缓存完整 K/V。\n</li><li>\nV2-Lite 是 16B/2.4B 的完整 MLA + MoE。\n</li><li>\nCoder-V2 是 V2 的代码继续预训练，不是第一代 Coder 的放大。\n</li><li>\n下一章看 V3 怎么把 236B 推到 671B，并加入 MTP 与无辅助损失均衡。\n</ul>","ch05":"<div class=\"source-badge\">出处：https://arxiv.org/abs/2412.19437</div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必</span> <a href=\"#/chapter/ch04\">第 4 章：V2 代：MLA + DeepSeekMoE 的组合</a></span></div><h1>第 5 章：V3 代：671B/37B 的骨架</h1>\n<ul><li>\n<strong>难度</strong>：★★★ | <strong>预估学时</strong>：3 小时 | <strong>前置</strong>：第 4 章、基础篇第 5 章\n</ul>\n<h2>学习目标</h2>\n<p>学完本章，你能：写出 V3 的 61 层/7168 维/256 路由专家配置；解释 MTP 为什么让 HuggingFace 权重多出 14B；说出无辅助损失负载均衡与 FP8 训练各解决什么问题；区分 V3、V3-0324、V3.1、V3.1-Terminus 的差别。</p>\n<h2>一句话核心</h2>\n<p>V3 沿用 V2 的 MLA + DeepSeekMoE，把规模推到 671B 总参数 / 37B 激活，并加了三件东西：MTP 训练目标、无辅助损失负载均衡、FP8 混合精度。它不是一个全新架构，而是 V2 的规模化与工程化。</p>\n<h2>1. 配置</h2>\n<table><thead><tr><th>项</th><th>V3</th></tr></thead><tbody><tr><td>总参数 / 激活</td><td>671B / 37B</td></tr><tr><td>层数</td><td>61</td></tr><tr><td>隐藏维</td><td>7168</td></tr><tr><td>注意力头</td><td>128</td></tr><tr><td>路由专家</td><td>256</td></tr><tr><td>共享专家</td><td>1</td></tr><tr><td>top-k</td><td>8</td></tr><tr><td>专家中间维</td><td>2048</td></tr><tr><td>上下文</td><td>128K（配置 163840）</td></tr><tr><td>训练 token</td><td>14.8T</td></tr><tr><td>精度</td><td>FP8 混合</td></tr></tbody></table>\n<p>HuggingFace 上 V3 总大小 685B，其中 671B 主模型 + 14B MTP 模块。很多人看到 685B 就以为“V3 是 685B”，其实是把 MTP 头也算进去了。</p>\n<p><code>config.json</code> 里还有一个关键字段：<code>first_k_dense_replace=3</code>。V3 的前 3 层是 dense FFN，从第 4 层起才是 MoE。算总参数时，前 3 层按 dense 算，后 58 层按“256 路由 + 1 共享”算；直接把 61 层都乘 256 个专家，会高估约 5%。</p>\n<h2>2. MTP：多 token 预测</h2>\n<p>标准自回归训练在每个位置预测下一个 token（<span class=\"katex-inline\">t+1</span>）。MTP 让每个位置额外预测未来第 2 个 token（<span class=\"katex-inline\">t+2</span>），并把这个预测头串在主干后面。</p>\n<p>训练时的损失是两项相加：</p>\n<div class=\"katex-block\">\\mathcal{L}_{\\text{MTP}}=\\mathcal{L}_{t+1}+\\lambda\\mathcal{L}_{t+2}</div>\n<p>好处是增加训练信号密度：同一个 token 位置，模型要同时学“下一步”和“下两步”。V3 论文说 MTP 能提升模型性能，也可以用于推理时的投机解码。</p>\n<p>代价是训练时多一个 14B 的 MTP 模块，显存和计算增加；推理时如果不用投机解码，可以把 MTP 头去掉。</p>\n<h2>3. 无辅助损失负载均衡</h2>\n<p>MoE 的经典问题是专家塌缩。V2/V3 之前的做法是加辅助损失，但辅助损失和语言建模目标会打架。V3 的做法是给每个专家一个可学习偏置 <span class=\"katex-inline\">b_i</span>：</p>\n<div class=\"katex-block\">\\text{route}_i=\\text{topk}(s_i+b_i)</div>\n<p>训练时统计每个专家的负载，负载高的调低 <span class=\"katex-inline\">b_i</span>，负载低的调高。偏置只影响“选不选”，不影响选中后的加权系数。这样不需要往主损失里加辅助项，也能把负载拉平。</p>\n<p>这个方法的代价是：偏置的更新规则是启发式的，不是梯度下降；极端负载下仍可能震荡。V3 论文报告它比辅助损失更稳定。</p>\n<h2>4. FP8 训练</h2>\n<p>V3 用 FP8 混合精度训练：大部分矩阵乘法用 FP8，少数敏感部分用 BF16/FP32。FP8 的动态范围小，需要精细的缩放（scaling）和分块策略，否则梯度会溢出或下溢。</p>\n<p>工程上配合了 DualPipe 双向流水线并行、EPLB 专家并行负载均衡、3FS 文件系统。这些不是模型结构，但决定了 671B 能不能在集群上训起来。</p>\n<h2>5. V3 家族 checkpoint</h2>\n<table><thead><tr><th>Checkpoint</th><th>结构</th><th>变化</th></tr></thead><tbody><tr><td>V3 / V3-Base</td><td><code>DeepseekV3ForCausalLM</code></td><td>原始预训练 / 后训练</td></tr><tr><td>V3-0324</td><td>同结构</td><td>后训练更新：MMLU-Pro 75.9→81.2，GPQA 59.1→68.4，AIME 39.6→59.4</td></tr><tr><td>V3.1 / V3.1-Base</td><td>同结构</td><td>混合推理：一个模型同时支持思考/非思考；128K；Agent 后训练</td></tr><tr><td>V3.1-Terminus</td><td>同结构</td><td>修中英文混杂、异常字符；优化 Code/Search Agent</td></tr></tbody></table>\n<p>这些 checkpoint 的 <code>config.json</code> 都是 61 层、7168 维、256 路由专家、top-8。差别在训练数据、后训练模板和部署形态，不是网络结构。</p>\n<h2>6. 图示：V3 一层</h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n  X[&quot;X: [B,L,7168]&quot;] --&gt; N[&quot;RMSNorm&quot;]\n  N --&gt; MLA[&quot;MLA：缓存 c(512) + RoPE(64)&quot;]\n  MLA --&gt; R1[&quot;残差相加&quot;]\n  R1 --&gt; N2[&quot;RMSNorm&quot;]\n  N2 --&gt; G[&quot;门控：256 路由 + 1 共享&quot;]\n  G --&gt; E[&quot;top-8 专家&quot;]\n  E --&gt; R2[&quot;残差相加&quot;]\n  R2 --&gt; Y[&quot;下一层&quot;]</div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。</p>\n<p>看图说明：一层里有两个残差块——注意力块和 MoE 块。MoE 块的门控只决定走哪些专家，共享专家始终参与。</p>\n<h2>7. 常见误解</h2>\n<ul><li>\n别以为 671B 是每个 token 都算一遍——只激活 37B。\n</li><li>\n别以为 MTP 是一个独立模型——它是挂在主干上的训练头，权重 14B。\n</li><li>\n别以为 V3.1 是新架构——它改的是推理模板和后训练。\n</li><li>\n别以为 FP8 只是“存储格式”——训练时的缩放、累加、通信都要配套，否则会掉点。\n</ul>\n<h2>8. 自测题</h2>\n<ol><li>\nV3 的 MTP 额外预测哪个位置？（答案：B；解析：在位置 t 额外预测 t+2。）\n<ul>\n<li>\nA. t+1　B. t+2　C. t-1　D. 随机\n</li><li>\nV3 有多少路由专家？（答案：C；解析：256 路由 + 1 共享，top-8。）\n</li><li>\nA. 64　B. 160　C. 256　D. 384\n</li><li>\nV3 的 685B HuggingFace 权重由什么组成？（答案：A；解析：671B 主模型 + 14B MTP。）\n</li><li>\nA. 671B + 14B MTP　B. 685B 全是主模型　C. 671B + 14B 视觉编码器　D. 685B 全是专家\n</ul>\n</ol>\n<h2>9. 复习锚点</h2>\n<ul><li>\nV3：671B/37B、61 层、7168 维、256 路由 + 1 共享、top-8、14.8T token。\n</li><li>\nMTP 额外预测 t+2，HF 权重多 14B。\n</li><li>\n无辅助损失均衡靠专家偏置，不往主损失加项。\n</li><li>\nV3.1 是混合推理，V3.2 才换 DSA 结构。\n</li><li>\n下一章看 R1：同一副 V3 骨架，怎么用 RL 把推理能力拉起来。\n</ul>","ch06":"<div class=\"source-badge\">出处：https://arxiv.org/abs/2501.12948</div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必</span> <a href=\"#/chapter/ch05\">第 5 章：V3 代：671B/37B 的骨架</a></span></div><h1>第 6 章：R1 代：同一副骨架，换训练目标</h1>\n<ul><li>\n<strong>难度</strong>：★★★ | <strong>预估学时</strong>：3 小时 | <strong>前置</strong>：第 5 章、论文拆解第 6–7 章\n</ul>\n<h2>学习目标</h2>\n<p>学完本章，你能：解释 R1-Zero 和 R1 的区别；写出 GRPO 的组内标准化与目标函数；复述 R1 四阶段流水线；说出蒸馏学生模型的参数与限制；判断“架构没变，能力为什么变了”。</p>\n<h2>一句话核心</h2>\n<p>R1 没有换网络结构，还是 V3 的 671B/37B MoE + MLA。它换的是训练目标：用可验证奖励 + GRPO 做 RL，把“长链推理”从模型里逼出来。能力提升主要来自数据和训练，不是新层。</p>\n<h2>1. R1-Zero：纯 RL 的极限实验</h2>\n<p>R1-Zero 从 V3 Base 直接做 RL，不做 SFT 冷启动。奖励是规则奖励：</p>\n<ul><li>\n答案正确：+1。\n</li><li>\n格式正确（把推理放在 <code>...</code> 里）：+1。\n</li><li>\n语言一致：少量惩罚。\n</ul>\n<p>GRPO 不训练 value model，而是对同一道题采一组回答，用组内奖励标准化得到优势：</p>\n<div class=\"katex-block\">A_i=\\frac{r_i-\\operatorname{mean}(r_1,\\dots,r_G)}{\\operatorname{std}(r_1,\\dots,r_G)}</div>\n<p>然后做带 clip 的策略更新。AIME 2024 从 15.6 涨到 71.0，证明“纯 RL 也能把推理能力拉起来”。但 R1-Zero 有可读性问题：中英文混杂、格式混乱、思考过程重复。</p>\n<h2>2. R1：四阶段流水线</h2>\n<p>R1 在 R1-Zero 前面加了冷启动，在后面加了拒绝采样和再对齐：</p>\n<ol><li>\n<strong>冷启动 SFT</strong>：用少量高质量长 CoT 数据，让模型先学会“像人一样写推理”，解决可读性。\n</li><li>\n<strong>推理 RL</strong>：用 GRPO + 规则奖励，继续拉数学、代码、逻辑的正确率。\n</li><li>\n<strong>拒绝采样 + SFT</strong>：对 RL 后的模型采样，只保留答案正确、格式合格的样本，混入通用数据，做一轮 SFT。\n</li><li>\n<strong>RL 对齐</strong>：用奖励模型/规则混合，提升有用性、无害性、语言一致性。\n</ol>\n<p>最终 R1 的 AIME 2024 是 79.8，MATH-500 97.3，GPQA 71.5，LiveCodeBench 65.9，Codeforces 96.3% 通过率。这些数字是论文口径，不是独立复现。</p>\n<h2>3. 蒸馏：把长 CoT 塞进小模型</h2>\n<p>R1 蒸馏不是把 671B 压小，而是用 R1 生成 80 万条冷启动数据，去微调 Qwen/Llama 学生模型：</p>\n<table><thead><tr><th>学生模型</th><th>参数量</th></tr></thead><tbody><tr><td>R1-Distill-Qwen-1.5B</td><td>1.5B</td></tr><tr><td>R1-Distill-Qwen-7B</td><td>7B</td></tr><tr><td>R1-Distill-Qwen-14B</td><td>14B</td></tr><tr><td>R1-Distill-Qwen-32B</td><td>32B</td></tr><tr><td>R1-Distill-Llama-8B</td><td>8B</td></tr><tr><td>R1-Distill-Llama-70B</td><td>70B</td></tr></tbody></table>\n<p>学生模型的架构是 Qwen2.5 或 Llama3，不是 DeepSeek 的 MoE。它们继承的是 R1 的“推理数据分布”，不是 R1 的网络结构。R1-0528-Qwen3-8B 是后续的 8B 蒸馏版本。</p>\n<h2>4. 为什么“同骨架”能出不同能力</h2>\n<p>V3 是“会写代码、会答题”的通用模型；R1 是“愿意花长 token 去想”的推理模型。差别在：</p>\n<ul><li>\n<strong>数据</strong>：R1 的 RL 题目以数学、代码、逻辑为主，答案可验证。\n</li><li>\n<strong>奖励</strong>：规则奖励直接给正确性打分，不依赖人类偏好模型。\n</li><li>\n<strong>采样</strong>：组内采样 + 标准化，让“比平均好”的回答获得正优势。\n</li><li>\n<strong>预算</strong>：推理时允许更长的 CoT，用 token 换正确率。\n</ul>\n<p>这四条都不改网络结构。它说明“架构决定上限，数据与训练决定你怎么爬到上限”。</p>\n<h2>5. GRPO 的一个数值例子</h2>\n<p>四个回答奖励 <span class=\"katex-inline\">[1,0,0,-1]</span>，均值 0，标准差约 0.707：</p>\n<div class=\"katex-block\">A=[1.414,0,0,-1.414]</div>\n<p>奖励全为 1 时，标准差 0，优势全 0，这一组不产生梯度。这就是“全对/全错题目没有学习信号”的原因。训练时要保证题目难度分布有梯度，否则 RL 空转。</p>\n<h2>6. 局限</h2>\n<ul><li>\n长 CoT 成本高：简单题也可能生成几千 token。\n</li><li>\n幻觉：R1 仍会在长链里编造中间步骤；R1-0528 专门抑制了一部分。\n</li><li>\n安全与对齐：纯规则奖励不覆盖有用性/无害性，R1 的第四阶段才补。\n</li><li>\n蒸馏学生模型的能力上限受学生架构限制，不是“越小越划算”。\n</ul>\n<h2>7. 图示</h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[&quot;V3 Base&quot;] --&gt; B[&quot;R1-Zero：纯 RL + GRPO&quot;]\n  B --&gt; C[&quot;可读性问题&quot;]\n  C --&gt; D[&quot;R1：冷启动 SFT&quot;]\n  D --&gt; E[&quot;推理 RL&quot;]\n  E --&gt; F[&quot;拒绝采样 + SFT&quot;]\n  F --&gt; G[&quot;RL 对齐&quot;]\n  G --&gt; H[&quot;R1 671B&quot;]\n  H --&gt; I[&quot;蒸馏：Qwen/Llama 1.5B–70B&quot;]</div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。</p>\n<p>看图说明：R1-Zero 是去掉冷启动的消融实验；R1 是加了冷启动、拒绝采样和再对齐的完整流水线；蒸馏是从 R1 分出去的学生模型分支。</p>\n<h2>8. 常见误解</h2>\n<ul><li>\n别以为 R1 是新架构——它和 V3 共享 671B/37B 的 MoE + MLA。\n</li><li>\n别以为 R1-Zero 比 R1 更强——R1-Zero 在部分基准上接近，但可读性和通用性差。\n</li><li>\n别以为蒸馏是把 671B 量化——蒸馏是让学生模型学 R1 的输出分布，架构完全不同。\n</li><li>\n别以为 GRPO 不需要 reward model 就“完全无监督”——它需要可验证的奖励函数。\n</ul>\n<h2>9. 自测题</h2>\n<ol><li>\nR1-Zero 与 R1 的关键区别是什么？（答案：A；解析：R1-Zero 不做冷启动 SFT，直接纯 RL。）\n<ul>\n<li>\nA. 有没有冷启动 SFT　B. 参数规模不同　C. 注意力不同　D. 词表不同\n</li><li>\nGRPO 的优势怎么算？（答案：B；解析：组内奖励减均值、除以标准差。）\n</li><li>\nA. 用 value model 估　B. 组内标准化　C. 直接取奖励　D. 用人类偏好打分\n</li><li>\nR1 蒸馏的 Qwen-7B 学生模型是什么架构？（答案：C；解析：Qwen2.5 的 dense 架构，不是 DeepSeek MoE。）\n</li><li>\nA. DeepSeek V3 MoE　B. MLA　C. Qwen dense　D. CNN\n</ul>\n</ol>\n<h2>10. 复习锚点</h2>\n<ul><li>\nR1 不换结构，换训练目标。\n</li><li>\nR1-Zero：纯 RL + GRPO + 规则奖励；R1：四阶段。\n</li><li>\nGRPO 用组内标准化，全对/全错组没有梯度。\n</li><li>\n蒸馏学生模型是 Qwen/Llama 架构，继承数据分布，不继承网络。\n</li><li>\n下一章看 V3.1/V3.2：从推理模型走向 Agent 模型。\n</ul>","ch07":"<div class=\"source-badge\">出处：https://api-docs.deepseek.com/zh-cn/updates/</div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必</span> <a href=\"#/chapter/ch05\">第 5 章：V3 代：671B/37B 的骨架</a></span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必</span> <a href=\"#/chapter/ch06\">第 6 章：R1 代：同一副骨架，换训练目标</a></span></div><h1>第 7 章：V3.1 / V3.2：从推理模型到 Agent 模型</h1>\n<ul><li>\n<strong>难度</strong>：★★★ | <strong>预估学时</strong>：3 小时 | <strong>前置</strong>：第 5–6 章、论文拆解第 8 章\n</ul>\n<h2>学习目标</h2>\n<p>学完本章，你能：解释“混合推理”为什么能在一个模型里同时支持思考/非思考；说出 DSA 稀疏注意力的索引器与 top-k 在做什么；区分 V3.1、V3.1-Terminus、V3.2-Exp、V3.2、V3.2-Speciale；判断 Agent 训练数据合成对能力的影响。</p>\n<h2>一句话核心</h2>\n<p>V3.1 把“思考”和“不思考”合并进一个模型；V3.2 把“思考”嵌进工具调用，并用 DSA 稀疏注意力降低长上下文成本。V3.2 是 DeepSeek 从“会推理”走向“会做 Agent 任务”的分界线。</p>\n<h2>1. V3.1：一个模型，两种模式</h2>\n<p>V3.1 的结构还是 V3 的 61 层、7168 维、256 路由专家、top-8。变化在推理模板：</p>\n<ul><li>\n非思考模式：直接给答案，和 V3 类似。\n</li><li>\n思考模式：先输出 <code>...</code> 里的长 CoT，再给答案。\n</li><li>\n通过 chat template 里的特殊 token 切换，不需要部署两个模型。\n</ul>\n<p>官方口径：V3.1 在 SWE-bench Verified 66.0、SWE-bench Multilingual 54.5、Terminal-bench 31.3。V3.1-Terminus 是小版本收尾，修中英文混杂、异常字符，优化 Code/Search Agent，不换结构。</p>\n<p>混合推理的代价是：同一个模型要同时学两种分布，思考模式的 token 预算更高；模板错了，模型可能在该思考时不思考，或在该直接答时啰嗦。</p>\n<h2>2. V3.2-Exp：DSA 稀疏注意力</h2>\n<p>V3.2-Exp 建在 V3.1-Terminus 上，引入 DeepSeek Sparse Attention（DSA）。标准注意力每个 query 要看所有历史 token，长上下文下 <span class=\"katex-inline\">L^2</span> 成本爆炸。DSA 的做法是：</p>\n<ol><li>\n<strong>轻量索引器</strong>：给每个 query 和每个历史 token 打一个相关性分数。\n</li><li>\n<strong>top-k 选择</strong>：每个 query 只对分数最高的 <span class=\"katex-inline\">k</span> 个 token 做注意力。\n</li><li>\n<strong>只算被选中的 token</strong>：没被选中的不参与 <span class=\"katex-inline\">QK^\\top</span> 和加权。\n</ol>\n<p>这样注意力复杂度从 <span class=\"katex-inline\">O(L^2)</span> 降到约 <span class=\"katex-inline\">O(Lk)</span>。代价是索引器本身有计算，且 top-k 选错会丢信息。V3.2-Exp 的 API 价格降了 50% 以上，说明长上下文成本确实下来了。</p>\n<p>DSA 是结构改动，不是后训练技巧。<code>config.json</code> 的 <code>architectures</code> 从 <code>DeepseekV3ForCausalLM</code> 变成 <code>DeepseekV32ForCausalLM</code>，这是判断 V3.2 与 V3.1 不同的硬标志。</p>\n<h2>3. V3.2：思考融入工具调用</h2>\n<p>V3.2 是 DSA 正式版，结构同 V3.2-Exp，重点在后训练：</p>\n<ul><li>\n首个把“思考”直接嵌进工具调用的模型：思考模式下可以多轮“想 → 调工具 → 再想”。\n</li><li>\n同时支持思考/非思考模式的工具调用。\n</li><li>\nAgent 训练数据合成：1800+ 环境、85,000+ 复杂指令，构造“难解答、易验证”的 RL 任务。\n</li><li>\n公开基准达到 GPT-5 水平，略低于 Gemini-3.0-Pro；输出长度比 Kimi-K2-Thinking 短。\n</ul>\n<p>V3.2-Speciale 是长思考增强版，结合 Math-V2 的定理证明能力，在 IMO 2025、CMO 2025、ICPC World Finals 2025、IOI 2025 拿金牌。它只通过临时 API 开放，不支持工具调用，不适合日常对话。</p>\n<h2>4. Agent 训练为什么难</h2>\n<p>普通 SFT 只能教“怎么答”，教不会“怎么在多轮工具调用里试错”。Agent RL 需要：</p>\n<ul><li>\n<strong>环境</strong>：代码执行、网页、文件系统、终端等，能给出可验证结果。\n</li><li>\n<strong>奖励</strong>：任务是否完成、测试是否通过、答案是否正确。\n</li><li>\n<strong>轨迹</strong>：一次任务可能几十步，信用分配很难。\n</li><li>\n<strong>成本</strong>：每次 rollout 都要真的跑工具，比纯文本 RL 贵得多。\n</ul>\n<p>V3.2 的 1800+ 环境/85k 指令，就是用大规模合成把“难解答、易验证”的任务铺开。这个方向比“再加一层网络”更能提升 Agent 能力。</p>\n<h2>5. 三代对比</h2>\n<table><thead><tr><th>项</th><th>V3.1</th><th>V3.2-Exp</th><th>V3.2</th><th>V3.2-Speciale</th></tr></thead><tbody><tr><td>结构</td><td>V3 MLA+MoE</td><td>DSA</td><td>DSA</td><td>DSA</td></tr><tr><td>思考模式</td><td>有</td><td>有</td><td>有</td><td>只有长思考</td></tr><tr><td>工具调用</td><td>非思考为主</td><td>支持</td><td>思考+非思考</td><td>不支持</td></tr><tr><td>上下文</td><td>128K</td><td>128K</td><td>128K</td><td>128K</td></tr><tr><td>定位</td><td>混合推理</td><td>稀疏注意力实验</td><td>Agent 正式版</td><td>评测/研究</td></tr></tbody></table>\n<h2>6. 图示</h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  Q[&quot;query&quot;] --&gt; I[&quot;轻量索引器：给历史 token 打分&quot;]\n  I --&gt; T[&quot;top-k 选择&quot;]\n  T --&gt; A[&quot;只对选中 token 做注意力&quot;]\n  A --&gt; O[&quot;输出&quot;]\n  H[&quot;历史 KV&quot;] --&gt; I\n  H --&gt; A</div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。</p>\n<p>看图说明：索引器是“粗筛”，注意力是“精算”。DSA 省的是精算阶段，不是把索引器也省掉。</p>\n<h2>7. 常见误解</h2>\n<ul><li>\n别以为 V3.1 是“两个模型拼在一起”——它是一个模型、两套模板。\n</li><li>\n别以为 DSA 只是“把注意力矩阵稀疏化”——它需要一个可学习的索引器，选错会掉点。\n</li><li>\n别以为 V3.2-Speciale 适合日常用——它 token 消耗高、不支持工具调用。\n</li><li>\n别以为 Agent 能力只靠模型变大——环境、奖励、轨迹设计同样关键。\n</ul>\n<h2>8. 自测题</h2>\n<ol><li>\nV3.2-Exp 的结构变化是什么？（答案：B；解析：引入 DSA 稀疏注意力。）\n<ul>\n<li>\nA. 换成 dense　B. DSA　C. 去掉 MoE　D. 改成 CNN\n</li><li>\nV3.2 的“思考融入工具调用”指什么？（答案：A；解析：思考模式下可以多轮思考 + 调工具。）\n</li><li>\nA. 思考与工具交替　B. 只思考不调工具　C. 只调工具不思考　D. 两个模型分别做\n</li><li>\nV3.2-Speciale 的主要限制是什么？（答案：C；解析：只支持长思考，不支持工具调用，偏研究。）\n</li><li>\nA. 没有权重　B. 不支持中文　C. 不支持工具调用　D. 只有 7B\n</ul>\n</ol>\n<h2>9. 复习锚点</h2>\n<ul><li>\nV3.1：同结构，混合推理模板。\n</li><li>\nV3.2-Exp：DSA 稀疏注意力，<code>DeepseekV32ForCausalLM</code>。\n</li><li>\nV3.2：DSA + Agent 后训练，思考嵌入工具调用。\n</li><li>\nV3.2-Speciale：长思考、评测向、不支持工具。\n</li><li>\n下一章看 V4：把 1M 上下文做成默认能力。\n</ul>","ch08":"<div class=\"source-badge\">出处：https://arxiv.org/abs/2606.19348</div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必</span> <a href=\"#/chapter/ch07\">第 7 章：V3.1 / V3.2：从推理模型到 Agent 模型</a></span></div><h1>第 8 章：V4 代：百万上下文成为默认</h1>\n<ul><li>\n<strong>难度</strong>：★★★ | <strong>预估学时</strong>：4 小时 | <strong>前置</strong>：第 7 章、论文拆解第 8 章、架构篇第 10 章\n</ul>\n<h2>学习目标</h2>\n<p>学完本章，你能：写出 V4-Pro 与 V4-Flash 的参数/层数/专家数；解释 token 维度压缩 + DSA 的组合；说出 mHC 与 Muon 各解决什么问题；区分 V4-Pro 与 V4-Flash 的适用场景；理解 1M 上下文为什么是架构问题。</p>\n<h2>一句话核心</h2>\n<p>V4 不是把 V3 的上下文“调大”，而是重新设计长上下文的成本结构：先在 token 维度压缩，再用 DSA 稀疏注意力只算相关 token，配合 mHC 稳定深层残差、Muon 优化训练。1M 上下文是这套结构的默认结果。</p>\n<h2>1. 配置</h2>\n<table><thead><tr><th>项</th><th>V4-Pro</th><th>V4-Flash</th></tr></thead><tbody><tr><td>总参数 / 激活</td><td>1.6T / 49B</td><td>284B / 13B</td></tr><tr><td>层数</td><td>61</td><td>43</td></tr><tr><td>隐藏维</td><td>7168</td><td>4096</td></tr><tr><td>注意力头</td><td>128</td><td>64</td></tr><tr><td>KV 头</td><td>1</td><td>1</td></tr><tr><td>路由专家</td><td>384</td><td>256</td></tr><tr><td>共享专家</td><td>1</td><td>1</td></tr><tr><td>top-k</td><td>6</td><td>6</td></tr><tr><td>专家中间维</td><td>3072</td><td>2048</td></tr><tr><td>上下文</td><td>1M</td><td>1M</td></tr><tr><td>精度</td><td>FP4 + FP8 混合</td><td>FP4 + FP8 混合</td></tr></tbody></table>\n<p>V4-Pro 的 1.6T 是总参数，49B 是每 token 激活；V4-Flash 是 284B/13B。两者不是简单的“同架构缩放”：层数、隐藏维、专家数都不同。</p>\n<h3>1.1 配置里还能读到什么</h3>\n<p><code>config.json</code> 里有一批比“层数/专家数”更细的字段，直接对应论文里的机制：</p>\n<table><thead><tr><th>字段</th><th>V4-Pro</th><th>V4-Flash</th><th>含义</th></tr></thead><tbody><tr><td><code>head_dim</code></td><td>512</td><td>512</td><td>每头维度，比 V3 的 128 大很多</td></tr><tr><td><code>q_lora_rank</code></td><td>1536</td><td>1024</td><td>Q 的低秩投影维度</td></tr><tr><td><code>o_lora_rank</code></td><td>1024</td><td>1024</td><td>输出投影的低秩维度</td></tr><tr><td><code>o_groups</code></td><td>16</td><td>8</td><td>输出分组数</td></tr><tr><td><code>index_n_heads</code></td><td>64</td><td>64</td><td>DSA 索引器头数</td></tr><tr><td><code>index_head_dim</code></td><td>128</td><td>128</td><td>索引器每头维度</td></tr><tr><td><code>index_topk</code></td><td>1024</td><td>512</td><td>每个 query 选多少历史 token</td></tr><tr><td><code>sliding_window</code></td><td>128</td><td>128</td><td>SWA 窗口</td></tr><tr><td><code>hc_mult</code></td><td>4</td><td>4</td><td>mHC 残差流扩展倍数</td></tr><tr><td><code>hc_sinkhorn_iters</code></td><td>20</td><td>20</td><td>Sinkhorn 迭代次数</td></tr><tr><td><code>compress_ratios</code></td><td><code>[128,128,4,...]</code></td><td><code>[0,0,4,...]</code></td><td>每层压缩比，128 是 HCA，4 是 CSA，0 是不压缩</td></tr></tbody></table>\n<p><code>head_dim=512</code> 是一个容易忽略的改动：V3 的 MLA 每头是 128 维（<code>qk_nope_head_dim=128</code>、<code>v_head_dim=128</code>），V4 把每头拉到 512 维，注意力的表达空间更大，但 Q/K/V 投影和 kernel 也要重写。</p>\n<p><code>num_hash_layers=3</code> 是配置里存在、但公开论文没有展开的字段。读模型卡时先记下它，不要据此推断“前 3 层一定是哈希路由”；参数估算按全 MoE 粗估即可，误差在 2% 以内。公开材料没讲清的机制，宁可标“待确认”，也不要补一个听起来合理的解释。</p>\n<h2>2. 注意力：token 压缩 + DSA</h2>\n<p>V4 的公开材料把注意力概括为“token 维度压缩 + DSA 稀疏注意力”。技术报告里进一步拆成两条压缩路径：</p>\n<ul><li>\n<strong>CSA（压缩稀疏注意力）</strong>：每 <span class=\"katex-inline\">m</span> 个 token 的 KV 压成一个条目，query 再对压缩条目做 top-k 选择。V4 里 <span class=\"katex-inline\">m=4</span>，Pro top-k 1024，Flash top-k 512。\n</li><li>\n<strong>HCA（重度压缩注意力）</strong>：每 <span class=\"katex-inline\">m&#x27;</span> 个 token 压成一个更粗的块表示，负责极远端历史。V4 里 <span class=\"katex-inline\">m&#x27;=128</span>，SWA 窗口 128。\n</ul>\n<p>再加上 DSA 的索引器/选择机制，整体复杂度从 <span class=\"katex-inline\">O(L^2)</span> 降到接近 <span class=\"katex-inline\">O(Lk)</span>。代价是压缩会丢细节：代码里的一个括号、检索里的一个实体，可能在块表示里被平均掉。所以 V4 不是只用一种压缩，而是 CSA/HCA/SWA 混合。</p>\n<h2>3. mHC：残差流扩容 + 双随机约束</h2>\n<p>标准 Transformer 的残差是一条宽度为 <span class=\"katex-inline\">d</span> 的流。mHC 把残差流扩展为 <span class=\"katex-inline\">n</span> 倍（V4 取 <span class=\"katex-inline\">n=4</span>），让不同通道承担不同子空间，再用 Sinkhorn 迭代把混合矩阵归一化成双随机矩阵。</p>\n<p>双随机矩阵：每行和为 1，每列和为 1，元素非负。Sinkhorn 交替做行归一化和列归一化：</p>\n<div class=\"katex-block\">M_{ij}\\leftarrow\\frac{M_{ij}}{\\sum_j M_{ij}},\\quad M_{ij}\\leftarrow\\frac{M_{ij}}{\\sum_i M_{ij}}</div>\n<p>重复 20 次，得到近似双随机矩阵。为什么不用普通 softmax：softmax 只保证行和为 1，列可能全挤到少数几列，深层残差会失衡；双随机让信息在通道间更均匀地混合。</p>\n<p>代价是每次前向多 20 次归一化迭代，训练和推理都有额外开销；扩展 4 倍也增加激活显存。</p>\n<h2>4. Muon 优化器</h2>\n<p>V4 用 Muon 替代部分 AdamW。Muon 对矩阵参数做正交化更新，让更新方向更“均匀”，在大模型训练里通常能提升稳定性/样本效率。它不是网络结构，但会影响训练曲线和最终效果。</p>\n<p>Muon 的代价是实现复杂、对超参敏感；不是“换个优化器就一定更好”。V4 论文报告的是它在这套架构和训练配方下的结果。</p>\n<h2>5. 1M 上下文的账</h2>\n<p>以 V4.1 的 890 B/token 为例，1M 单序列全局 KV 约 890 MB；50 并发约 44.5 GB。这还没算持久 KV、SWA、Engram、激活和框架开销。V3.2 的 48,068 B/token 在 1M 下单序列约 48 GB，50 并发约 2.4 TB。</p>\n<p>所以 V4 的 1M 不是“把 RoPE 拉长”，而是把 KV 字节和注意力计算同时压下来。没有 CSA/HCA/DSA，1M 上下文在单机上跑不起来。</p>\n<h2>6. 图示</h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n  X[&quot;1M token 输入&quot;] --&gt; C[&quot;CSA：每 4 个 token 压一个条目&quot;]\n  X --&gt; H[&quot;HCA：每 128 个 token 压一个块&quot;]\n  X --&gt; S[&quot;SWA：最近 128 token 精确窗口&quot;]\n  C --&gt; K[&quot;top-k 选择&quot;]\n  H --&gt; K\n  K --&gt; A[&quot;稀疏注意力&quot;]\n  S --&gt; A\n  A --&gt; R[&quot;mHC 残差 + MoE&quot;]\n  R --&gt; Y[&quot;输出&quot;]</div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。</p>\n<p>看图说明：三条路径分工——SWA 保最近细节，CSA 保中近程，HCA 保极远端。不是三选一，而是按距离分层。</p>\n<h2>7. V4-Pro 与 V4-Flash 怎么选</h2>\n<ul><li>\n<strong>V4-Pro</strong>：1.6T/49B，质量上限高，适合高质量长文档、复杂 Agent、评测。代价是算力/显存贵。\n</li><li>\n<strong>V4-Flash</strong>：284B/13B，速度快、成本低，简单 Agent 任务与 Pro 接近，高难度任务有差距。\n</li><li>\n<strong>不要</strong>把 V4-Pro 的分数直接套到 Flash 上；两者不是同一档。\n</ul>\n<p>官方口径：V4-Pro 在 Agentic Coding 上达到开源最佳，世界知识大幅领先其他开源模型，仅稍逊 Gemini-3.1-Pro；V4-Flash 推理接近 Pro，简单 Agent 任务旗鼓相当，高难度任务仍有差距。</p>\n<h2>8. 常见误解</h2>\n<ul><li>\n别以为 1M 上下文就是“窗口大”——KV 显存和注意力计算才是瓶颈。\n</li><li>\n别以为 CSA 只是“每 4 个 token 取平均”——它是可学习的压缩 + top-k 选择，不是简单池化。\n</li><li>\n别以为 mHC 是“多加几层”——它是残差流的宽度扩展与混合约束。\n</li><li>\n别以为 Muon 是“推理加速器”——它是训练优化器，推理时不用。\n</ul>\n<h2>9. 自测题</h2>\n<ol><li>\nV4-Pro 的总参数/激活约多少？（答案：A；解析：1.6T 总参数、49B 激活。）\n<ul>\n<li>\nA. 1.6T/49B　B. 284B/13B　C. 671B/37B　D. 552B/8B\n</li><li>\nCSA 的 <span class=\"katex-inline\">m=4</span> 表示什么？（答案：B；解析：每 4 个 token 的 KV 压成一个条目。）\n</li><li>\nA. 4 个头　B. 每 4 个 token 压一个条目　C. 4 层　D. top-k=4\n</li><li>\nmHC 的 Sinkhorn 迭代目标是什么？（答案：C；解析：把混合矩阵归一化成双随机矩阵。）\n</li><li>\nA. 稀疏矩阵　B. 单位矩阵　C. 双随机矩阵　D. 对角矩阵\n</ul>\n</ol>\n<h2>10. 复习锚点</h2>\n<ul><li>\nV4-Pro 1.6T/49B，61 层，384 路由 + 1 共享，top-6，1M。\n</li><li>\nV4-Flash 284B/13B，43 层，256 路由 + 1 共享。\n</li><li>\n注意力：token 压缩 + DSA，论文拆成 CSA/HCA/SWA 分层。\n</li><li>\nmHC：残差扩容 4 倍 + Sinkhorn 双随机。\n</li><li>\n下一章看 V4.1：CED + CSA2 + Engram，把全局 KV 压到 890 B/token。\n</ul>","ch09":"<div class=\"source-badge\">出处：https://arxiv.org/abs/2609.19969</div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必</span> <a href=\"#/chapter/ch08\">第 8 章：V4 代：百万上下文成为默认</a></span></div><h1>第 9 章：V4.1：把 KV cache 压到 890 B/token</h1>\n<ul><li>\n<strong>难度</strong>：★★★ | <strong>预估学时</strong>：4 小时 | <strong>前置</strong>：第 8 章、论文拆解第 9 章、架构篇第 14 章\n</ul>\n<h2>学习目标</h2>\n<p>学完本章，你能：写出 V4.1-Flash 的 552B 主干 + 196B Engram 配置；解释 CED 为什么把编码阶段压到 20 层；说出 CSA2 的 Full/Reindex/Reuse 三模式；复算 890 B/token 的 1M 单序列与并发显存；判断它和 V4-Pro 的对比边界。</p>\n<h2>一句话核心</h2>\n<p>V4.1 的核心不是“再加参数”，而是把长上下文的 KV cache 当成第一瓶颈：CED 让编码器只算前 20 层，CSA2 跨层复用 KV/index，Engram 用查表替代部分矩阵计算，FP4 KV 再压一半。四件事叠加，才有 890 B/token。</p>\n<h2>1. 配置</h2>\n<table><thead><tr><th>项</th><th>V4.1-Flash</th></tr></thead><tbody><tr><td>主干参数</td><td>552B</td></tr><tr><td>Engram</td><td>196B</td></tr><tr><td>HuggingFace 总参数</td><td>约 763B</td></tr><tr><td>prefill 激活</td><td>8B</td></tr><tr><td>decode 激活</td><td>16B</td></tr><tr><td>上下文</td><td>1M</td></tr><tr><td>训练 token</td><td>45T（多模态语料）</td></tr><tr><td>视觉</td><td>原生图像输入，文本自回归输出</td></tr><tr><td>精度</td><td>FP4 + FP8 混合</td></tr></tbody></table>\n<p>注意三个“总参数”口径：论文说 552B 主干 + 196B Engram；HuggingFace 模型卡显示约 763B 总权重；prefill/decode 激活分别是 8B/16B。写文章时要把这三个数分开，不能混成“763B 激活”。</p>\n<h3>1.1 配置里还能读到什么</h3>\n<p>V4.1 的 <code>config.json</code> 是嵌套的：文本参数在 <code>text_config</code>，视觉参数在 <code>vision_config</code>。关键字段如下：</p>\n<table><thead><tr><th>字段</th><th>值</th><th>含义</th></tr></thead><tbody><tr><td><code>text_config.hidden_size</code></td><td>5120</td><td>主干隐藏维</td></tr><tr><td><code>text_config.num_hidden_layers</code></td><td>40</td><td>20 编码 + 20 解码</td></tr><tr><td><code>text_config.num_attention_heads</code></td><td>64</td><td>查询头</td></tr><tr><td><code>text_config.head_dim</code></td><td>512</td><td>每头维度</td></tr><tr><td><code>text_config.n_routed_experts</code></td><td>384</td><td>路由专家</td></tr><tr><td><code>text_config.n_shared_experts</code></td><td>1</td><td>共享专家</td></tr><tr><td><code>text_config.num_experts_per_tok</code></td><td>6</td><td>top-6</td></tr><tr><td><code>text_config.moe_intermediate_size</code></td><td>2304</td><td>专家中间维</td></tr><tr><td><code>text_config.q_lora_rank</code></td><td>1280</td><td>Q 低秩维度</td></tr><tr><td><code>text_config.o_lora_rank</code></td><td>1024</td><td>输出低秩维度</td></tr><tr><td><code>text_config.o_groups</code></td><td>8</td><td>输出分组</td></tr><tr><td><code>text_config.sliding_window</code></td><td>128</td><td>SWA 窗口</td></tr><tr><td><code>text_config.num_nextn_predict_layers</code></td><td>3</td><td>MTP 头层数</td></tr><tr><td><code>text_config.engram_layer_ids</code></td><td><code>[1, 14]</code></td><td>Engram 插在第 1、14 层</td></tr><tr><td><code>text_config.engram_max_ngram_size</code></td><td>4</td><td>4-gram 哈希</td></tr><tr><td><code>text_config.engram_vocab_size</code></td><td>16,000,000</td><td>Engram 词表</td></tr><tr><td><code>text_config.engram_n_heads</code></td><td>8</td><td>Engram 头数</td></tr><tr><td><code>text_config.engram_head_dim</code></td><td>256</td><td>Engram 每头维度</td></tr><tr><td><code>vision_config.num_hidden_layers</code></td><td>32</td><td>视觉编码器层数</td></tr><tr><td><code>vision_config.hidden_size</code></td><td>1024</td><td>视觉隐藏维</td></tr><tr><td><code>vision_config.patch_size</code></td><td>14</td><td>视觉 patch</td></tr><tr><td><code>vision_config.max_image_tokens</code></td><td>1024</td><td>单图最多 token</td></tr></tbody></table>\n<p>这组字段解释了三件事：</p>\n<ol><li>\n<strong>为什么 552B 主干能装进 40 层</strong>：<code>hidden_size=5120</code> 比 V4-Pro 的 7168 小，专家中间维 2304 也比 3072 小；层数少、宽度小，参数自然降下来。\n</li><li>\n<strong>Engram 不是每层都插</strong>：只在第 1、14 层插，查表参数 196B，但不参与每 token 的稠密矩阵计算，所以 prefill 激活只有 8B。\n</li><li>\n<strong>CED 的 20+20 不是拍脑袋</strong>：<code>candidate_source_layer_id=20</code>、<code>kv_source_layer_ids=[2,8,14,20]</code> 说明全局 KV 的建立和复用都围绕第 20 层分界；解码器从第 21 层起不再自己建全局 KV。\n</ol>\n<p><code>compress_ratios</code> 也值得看：V4.1 的文本配置是 <code>[0,0,2,2,...]</code>，前两层不压缩，从第 3 层起大量 <code>2</code>，对应 CSA2 的 <span class=\"katex-inline\">m=2</span>；最后几层是 <code>0,0,0</code>，对应解码器末端的特殊处理。V4-Pro 是 <code>[128,128,4,...]</code>，开头两个 128 是 HCA，后面 4 是 CSA。把这些数字和章节里的机制对上，配置就不再是天书。</p>\n<h2>2. CED：非对称编码器-解码器</h2>\n<p>标准 decoder 每层都要维护全局 KV。V4.1 把 40 层拆成：</p>\n<ul><li>\n<strong>编码器 20 层</strong>：只做输入编码，建立全局 KV。\n</li><li>\n<strong>解码器 20 层</strong>：不再自己算全局 KV，而是从编码器第 20 层的隐藏状态投影得到。\n</ul>\n<p>公式：</p>\n<div class=\"katex-block\">C_l=H_{20}W_l^{KV},\\quad l>20</div>\n<p>其中 <span class=\"katex-inline\">C_l</span> 是解码器第 <span class=\"katex-inline\">l</span> 层的全局 KV，<span class=\"katex-inline\">H_{20}</span> 是编码器最后一层的隐藏状态，<span class=\"katex-inline\">W_l^{KV}</span> 是第 <span class=\"katex-inline\">l</span> 层的投影矩阵。</p>\n<p>这样全局 KV 的建立只发生在 20 层编码器，解码器 20 层不再重复建立全局 KV；论文口径是 prefill 算力显著下降，但不是严格“减半”，因为解码器仍有 20 层的注意力与 FFN 计算。代价是解码器层的全局 KV 都来自同一个 <span class=\"katex-inline\">H_{20}</span>，表达能力受编码器末端限制；所以它不是“白嫖”，是用结构换成本。</p>\n<h2>3. CSA2：跨层复用 KV 与索引</h2>\n<p>CSA2 在 CSA 的基础上加了三档复用：</p>\n<ul><li>\n<strong>Full</strong>：重新算完整 KV/index。\n</li><li>\n<strong>Reindex</strong>：复用 KV，但重新建索引，处理分布漂移。\n</li><li>\n<strong>Reuse</strong>：复用 KV 和上一层选好的 top-k 索引，只做少量更新。\n</ul>\n<p>编码器 18 层 CSA2，<span class=\"katex-inline\">m=2</span>，每 6 层一组：1 层 Full + 5 层 Reuse。解码器 20 层 CSA2，<span class=\"katex-inline\">m=1</span>，每 4 层一组：首组 1 Full + 3 Reuse，后四组 1 Reindex + 3 Reuse。</p>\n<p>CSA2 的 indexer 有 32 头、128 维，分层索引器 2048 块 × 8 位置 = 16384 个候选。这个设计的目标不是“更准”，而是把 1M 上下文的索引成本压到可接受范围。</p>\n<h2>4. Engram：用查表替代矩阵计算</h2>\n<p>Engram 是一个 N-gram 哈希记忆模块：把输入里的 N-gram 哈希到固定表，查表得到记忆向量，再拼进隐藏状态。它是 O(1) 内存访问，不需要矩阵乘法。</p>\n<p>196B 的 Engram 是“外挂”参数，不参与每 token 的稠密矩阵计算，所以 prefill 激活只有 8B。代价是表很大，显存/存储要装下；哈希冲突会丢信息；训练时要学表和主干怎么配合。</p>\n<p>Engram 和 MoE 的区别：MoE 还是 FFN 矩阵，只是稀疏激活；Engram 是查表，不是矩阵乘。两者都增加总参数，但计算形态不同。</p>\n<h2>5. DSpark 与 FP4 KV</h2>\n<p>DSpark 是独立训练的投机解码 drafter：先让小模型猜几个 token，再由主模型验证，减少 decode 步数。它和 MTP 的分工是：MTP 偏训练信号，DSpark 是推理加速器。</p>\n<p>FP4 KV 把每 token 的 KV 字节再压一半。890 B/token 是全局 KV 的稳态占用，不含持久 KV、SWA、Engram、激活和框架开销。按 1M 单序列：</p>\n<div class=\"katex-block\">890\\ \\text{B}\\times1{,}000{,}000=890\\ \\text{MB}</div>\n<p>50 并发约 44.5 GB。对比 V3.2 的 48,068 B/token：1M 单序列约 48 GB，50 并发约 2.4 TB。这就是 V4.1 能把 1M 上下文做成“可部署”的原因。</p>\n<h2>6. 基准怎么读</h2>\n<p>V4.1 论文给的 Terminal-Bench 3.0 是 30.0，DeepSWE 74.2，CyberGym 88.1，Automation-Bench 54.8。Terminal-Bench 不如 Opus 5 的 43.3。</p>\n<p>读法：</p>\n<ul><li>\n先看基准版本与评测协议，不同论文的 Terminal-Bench 版本可能不同。\n</li><li>\n区分“平均分”和“某类任务分”。\n</li><li>\n区分“模型能力”和“Agent 框架能力”，工具调用、重试、上下文管理都会影响结果。\n</li><li>\nV4.1 当前对标的是 V4-Flash，不是 V4-Pro；不能写“全面超越 V4-Pro”。\n</ul>\n<h2>7. 图示</h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n  I[&quot;输入 token&quot;] --&gt; E[&quot;编码器 20 层（CSA2）&quot;]\n  E --&gt; H[&quot;H20&quot;]\n  H --&gt; P[&quot;投影出解码器全局 KV&quot;]\n  P --&gt; D[&quot;解码器 20 层（CSA2）&quot;]\n  D --&gt; O[&quot;输出 token&quot;]\n  I --&gt; G[&quot;Engram：N-gram 查表&quot;]\n  G --&gt; E\n  G --&gt; D</div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。</p>\n<p>看图说明：编码器负责“读”，解码器负责“写”；解码器不再重复算全局 KV，而是复用编码器末端投影。Engram 是旁路，不参与注意力。</p>\n<h2>8. 常见误解</h2>\n<ul><li>\n别以为 552B 就是全部参数——还有 196B Engram，HF 总权重约 763B。\n</li><li>\n别以为 prefill 8B 就是“模型只有 8B”——它是激活参数，权重仍要装 552B+196B。\n</li><li>\n别以为 CED 只是“少算 20 层”——解码器全局 KV 来自编码器末端，表达受限，是取舍。\n</li><li>\n别以为 890 B/token 是全部缓存——只是全局 KV，不含持久 KV/SWA/Engram。\n</li><li>\n别以为 V4.1 全面超过 V4-Pro——当前对标 V4-Flash，Terminal-Bench 仍低于 Opus 5。\n</ul>\n<h2>9. 自测题</h2>\n<ol><li>\nV4.1 的主干参数是多少？（答案：B；解析：552B 主干 + 196B Engram。）\n<ul>\n<li>\nA. 284B　B. 552B　C. 1.6T　D. 671B\n</li><li>\nCED 的解码器全局 KV 来自哪里？（答案：C；解析：编码器第 20 层隐藏状态投影。）\n</li><li>\nA. 每层自己算　B. 输入 embedding　C. 编码器第 20 层　D. Engram 查表\n</li><li>\nCSA2 的 Reuse 模式复用了什么？（答案：A；解析：主 KV 和上一层选好的 top-k 索引。）\n</li><li>\nA. KV 和索引　B. 只复用 Q　C. 只复用位置编码　D. 完全重算\n</ul>\n</ol>\n<h2>10. 复习锚点</h2>\n<ul><li>\nV4.1：552B 主干 + 196B Engram，8B prefill / 16B decode，1M。\n</li><li>\nCED：20 层编码 + 20 层解码，解码器 KV 由 H20 投影。\n</li><li>\nCSA2：Full / Reindex / Reuse 三模式，跨层复用。\n</li><li>\nEngram：N-gram 哈希查表，O(1) 访问，不是矩阵乘。\n</li><li>\n890 B/token 只是全局 KV；1M 单序列 890 MB，50 并发 44.5 GB。\n</ul>","ch10":"<div class=\"source-badge\">出处：https://huggingface.co/deepseek-ai</div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必</span> <a href=\"#/chapter/ch07\">第 7 章：V3.1 / V3.2：从推理模型到 Agent 模型</a></span></div><h1>第 10 章：多模态与专用模型：VL、Janus、OCR、Prover、Math-V2</h1>\n<ul><li>\n<strong>难度</strong>：★★☆ | <strong>预估学时</strong>：3 小时 | <strong>前置</strong>：第 5–9 章\n</ul>\n<h2>学习目标</h2>\n<p>学完本章，你能：区分 VL2 的“理解型 MoE”和 Janus 的“理解+生成统一”；说出 OCR 的光学压缩在做什么；解释 Prover-V2 与 Math-V2 的不同任务；把这些模型放回 DeepSeek 的主干代际。</p>\n<h2>一句话核心</h2>\n<p>这些模型不是另一条主线，而是把不同代的语言主干接上视觉编码器、形式化证明器或自验证训练器。看它们时先问“主干是哪一代”，再问“额外加了什么头/编码器”。</p>\n<h2>1. DeepSeek-VL / VL2：理解型视觉语言模型</h2>\n<h3>1.1 VL</h3>\n<p>DeepSeek-VL 有 1.3B 和 7B 两个版本，使用混合视觉编码器，在固定 token 预算内处理 1024×1024 高分辨率图像。它做的是视觉问答、OCR、图表理解、视觉定位，不生成图像。</p>\n<h3>1.2 VL2</h3>\n<p>DeepSeek-VL2 建在 DeepSeekMoE-27B 上，是 MoE 视觉语言模型。三个变体的激活参数分别是：</p>\n<table><thead><tr><th>变体</th><th>激活参数</th></tr></thead><tbody><tr><td>VL2-Tiny</td><td>1.0B</td></tr><tr><td>VL2-Small</td><td>2.8B</td></tr><tr><td>VL2-Base</td><td>4.5B</td></tr></tbody></table>\n<p>它支持动态切图（把高分辨率图切成多块，分别编码再拼），在视觉问答、OCR、文档/表格/图表理解、视觉定位上表现竞争力。注意：1.0B/2.8B/4.5B 是激活参数，总参数更高；不要把“Tiny”当成 1B dense。</p>\n<h2>2. Janus / Janus-Pro：理解与生成统一</h2>\n<p>Janus 的关键设计是<strong>解耦视觉编码</strong>：</p>\n<ul><li>\n理解路径：用 SigLIP-L 这类视觉编码器，把图像变成语义特征。\n</li><li>\n生成路径：用 VQ tokenizer（LlamaGen 那类）把图像变成离散 token，再自回归生成。\n</li><li>\n两条路径共享同一个 Transformer 主干，但视觉编码器分开。\n</ul>\n<p>为什么要分开：理解需要“语义”，生成需要“像素级重建”，同一个编码器很难同时做好。Janus-Pro 在此基础上升级，基于 DeepSeek-LLM-1.5B/7B，支持 384×384 输入，生成质量与理解能力都提升。</p>\n<p>Janus 系列包括 Janus-1.3B、JanusFlow-1.3B、Janus-Pro-1B、Janus-Pro-7B。JanusFlow 用流式生成替代部分自回归；Janus-Pro 是更强的统一版。</p>\n<h2>3. DeepSeek-OCR：把图像压成视觉 token</h2>\n<p>OCR 的任务不是“识别文字”这么简单。DeepSeek-OCR 的核心是<strong>光学压缩</strong>：把一整页图像编码成少量视觉 token，再让语言模型从这些 token 里恢复文字/结构。</p>\n<p>配置：3.3B 总参数，12 层，1280 隐藏维，64 路由 + 2 共享专家，top-6，8192 上下文。它基于 DeepSeek-VL2 的视觉语言骨架，但把重点放在“高压缩率下还能读对”。</p>\n<p>DeepSeek-OCR 2 换成“视觉因果流”（Visual Causal Flow），用更接近人类阅读顺序的因果结构处理版面；默认配置 (0–6)×768×768 + 1×1024×1024，对应 (0–6)×144 + 256 个视觉 token。它仍然是 3B 级 MoE，许可证 Apache 2.0。</p>\n<h2>4. DeepSeek-Prover-V2：形式化定理证明</h2>\n<p>Prover-V2 做的是 Lean 4 形式化证明，不是自然语言数学。它有两个版本：</p>\n<ul><li>\nProver-V2-671B：直接用 V3 架构（61 层、7168 维、256 路由、top-8），在 Lean 证明数据上训练。\n</li><li>\nProver-V2-7B：小模型，用于子目标搜索/草稿。\n</ul>\n<p>它先把自然语言题目形式化成 Lean 命题，再搜证明。MiniF2F-test 通过率 88.9%，ProverBench 覆盖 AIME 24/25 与教材题。和 R1 的区别：R1 用自然语言长 CoT 做数学，Prover 用形式化证明器验证每一步。</p>\n<h2>5. DeepSeek-Math-V2：自验证数学推理</h2>\n<p>Math-V2 建在 V3.2-Exp-Base 上，核心是“自验证”：模型生成证明，另一个 LLM 验证器审查，验证不通过就重写。训练时用高难度样本持续优化，推理时用 scaled test-time compute。</p>\n<p>结果：IMO 2025、CMO 2024 金牌水平，Putnam 2024 118/120。它和 Prover-V2 的分工：Math-V2 偏自然语言证明与自验证，Prover-V2 偏 Lean 形式化。</p>\n<h2>6. 代际归属</h2>\n<table><thead><tr><th>模型</th><th>语言主干</th><th>额外结构</th><th>任务</th></tr></thead><tbody><tr><td>VL 1.3B/7B</td><td>DeepSeek-LLM</td><td>混合视觉编码器</td><td>视觉理解</td></tr><tr><td>VL2 Tiny/Small/Base</td><td>DeepSeekMoE-27B</td><td>动态切图 + MoE</td><td>视觉理解/定位</td></tr><tr><td>Janus / Janus-Pro</td><td>DeepSeek-LLM-1.5B/7B</td><td>解耦视觉编码 + 生成 tokenizer</td><td>理解 + 生成</td></tr><tr><td>OCR / OCR2</td><td>VL2 骨架</td><td>光学压缩 / 视觉因果流</td><td>文档 OCR</td></tr><tr><td>Prover-V2 671B</td><td>V3</td><td>Lean 证明数据</td><td>形式化证明</td></tr><tr><td>Math-V2</td><td>V3.2-Exp-Base</td><td>自验证训练</td><td>数学证明</td></tr></tbody></table>\n<h2>7. 图示</h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[&quot;DeepSeek-LLM&quot;] --&gt; B[&quot;VL 1.3B/7B&quot;]\n  A --&gt; C[&quot;Janus / Janus-Pro&quot;]\n  D[&quot;DeepSeekMoE-27B&quot;] --&gt; E[&quot;VL2&quot;]\n  E --&gt; F[&quot;OCR / OCR2&quot;]\n  G[&quot;V3&quot;] --&gt; H[&quot;Prover-V2-671B&quot;]\n  I[&quot;V3.2-Exp-Base&quot;] --&gt; J[&quot;Math-V2&quot;]</div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。</p>\n<p>看图说明：语言主干是根，视觉/证明/自验证是不同分枝。不要把 Janus 的生成路径和 VL2 的理解路径混为一谈。</p>\n<h2>8. 常见误解</h2>\n<ul><li>\n别以为 VL2 的 1.0B/2.8B/4.5B 是总参数——是激活参数。\n</li><li>\n别以为 Janus 是“一个编码器同时做理解和生成”——它恰恰是解耦成两条视觉路径。\n</li><li>\n别以为 OCR 只是传统 OCR——它用视觉 token 压缩 + 语言模型恢复。\n</li><li>\n别以为 Prover-V2 和 R1 是同一个任务——一个 Lean 形式化，一个自然语言 CoT。\n</li><li>\n别以为 Math-V2 是“更大的 R1”——它换了自验证训练框架。\n</ul>\n<h2>9. 自测题</h2>\n<ol><li>\nVL2 的 1.0B/2.8B/4.5B 指什么？（答案：B；解析：激活参数，不是总参数。）\n<ul>\n<li>\nA. 总参数　B. 激活参数　C. 层数　D. 上下文长度\n</li><li>\nJanus 的解耦视觉编码指什么？（答案：A；解析：理解用语义编码器，生成用 VQ tokenizer。）\n</li><li>\nA. 理解和生成用不同视觉路径　B. 只用一种编码器　C. 不用视觉编码器　D. 只做生成\n</li><li>\nProver-V2-671B 用哪代语言主干？（答案：C；解析：V3 的 61 层/7168 维/256 路由。）\n</li><li>\nA. V2　B. V4　C. V3　D. Janus\n</ul>\n</ol>\n<h2>10. 复习锚点</h2>\n<ul><li>\nVL2 是 DeepSeekMoE-27B 的视觉版，Tiny/Small/Base 激活 1.0B/2.8B/4.5B。\n</li><li>\nJanus 解耦理解与生成两条视觉路径。\n</li><li>\nOCR 用光学压缩，OCR2 用视觉因果流，3B 级。\n</li><li>\nProver-V2 用 V3 主干做 Lean 证明；Math-V2 用 V3.2-Exp-Base 做自验证。\n</li><li>\n下一章把全部家族放进一张对比表，并给选型决策树。\n</ul>","ch11":"<div class=\"source-badge\">出处：https://huggingface.co/deepseek-ai</div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必</span> <a href=\"#/chapter/ch09\">第 9 章：V4.1：把 KV cache 压到 890 B/token</a></span></div><h1>第 11 章：全家族对比与选型</h1>\n<ul><li>\n<strong>难度</strong>：★★☆ | <strong>预估学时</strong>：2 小时 | <strong>前置</strong>：第 1–10 章\n</ul>\n<h2>学习目标</h2>\n<p>学完本章，你能：用一张表比较所有主要家族；按任务/显存/许可证做选型；说出每一代真正改动的结构件；拿到一张新模型卡时，用六个问题快速定位它。</p>\n<h2>一句话核心</h2>\n<p>选型不是“越大越好”，而是先看任务需要什么能力，再看显存能装下什么总参数、延迟能接受什么激活参数，最后看许可证是否允许你的用法。</p>\n<h2>1. 主家族对比</h2>\n<table><thead><tr><th>家族</th><th>代表</th><th>总/激活</th><th>层数</th><th>注意力</th><th>FFN/路由</th><th>上下文</th><th>许可证</th></tr></thead><tbody><tr><td>LLM</td><td>7B/67B</td><td>7B/67B</td><td>30/95</td><td>MHA/GQA</td><td>dense</td><td>4K</td><td>DeepSeek Model License</td></tr><tr><td>Coder</td><td>1.3B/6.7B/33B</td><td>dense</td><td>24/32/62</td><td>GQA</td><td>dense</td><td>16K</td><td>DeepSeek Model License</td></tr><tr><td>MoE</td><td>16B</td><td>16B/2.8B</td><td>28</td><td>MHA</td><td>64 路由 + 2 共享，top-6</td><td>4K</td><td>DeepSeek Model License</td></tr><tr><td>V2</td><td>236B</td><td>236B/21B</td><td>60</td><td>MLA</td><td>160 路由 + 2 共享，top-6</td><td>128K</td><td>DeepSeek Model License</td></tr><tr><td>V2-Lite</td><td>16B</td><td>16B/2.4B</td><td>27</td><td>MLA</td><td>64 路由 + 2 共享，top-6</td><td>128K</td><td>DeepSeek Model License</td></tr><tr><td>Coder-V2</td><td>236B</td><td>236B/21B</td><td>60</td><td>MLA</td><td>160 路由 + 2 共享，top-6</td><td>128K</td><td>DeepSeek Model License</td></tr><tr><td>V3</td><td>671B</td><td>671B/37B</td><td>61</td><td>MLA</td><td>256 路由 + 1 共享，top-8</td><td>128K</td><td>MIT</td></tr><tr><td>R1</td><td>671B</td><td>671B/37B</td><td>61</td><td>MLA</td><td>256 路由 + 1 共享，top-8</td><td>128K</td><td>MIT</td></tr><tr><td>V3.1</td><td>671B</td><td>671B/37B</td><td>61</td><td>MLA</td><td>256 路由 + 1 共享，top-8</td><td>128K</td><td>MIT</td></tr><tr><td>V3.2</td><td>671B</td><td>671B/37B</td><td>61</td><td>DSA</td><td>256 路由 + 1 共享，top-8</td><td>128K</td><td>MIT</td></tr><tr><td>V4-Pro</td><td>1.6T</td><td>1.6T/49B</td><td>61</td><td>压缩 + DSA（CSA/HCA）</td><td>384 路由 + 1 共享，top-6</td><td>1M</td><td>MIT</td></tr><tr><td>V4-Flash</td><td>284B</td><td>284B/13B</td><td>43</td><td>压缩 + DSA（CSA/HCA）</td><td>256 路由 + 1 共享，top-6</td><td>1M</td><td>MIT</td></tr><tr><td>V4.1-Flash</td><td>763B</td><td>552B 主干 + 196B Engram；8B/16B 激活</td><td>40（20+20）</td><td>CED + CSA2</td><td>MoE + Engram</td><td>1M</td><td>MIT</td></tr><tr><td>VL2</td><td>Tiny/Small/Base</td><td>激活 1.0B/2.8B/4.5B</td><td>—</td><td>—</td><td>DeepSeekMoE-27B</td><td>—</td><td>DeepSeek Model License</td></tr><tr><td>Janus-Pro</td><td>1B/7B</td><td>dense</td><td>—</td><td>—</td><td>解耦视觉编码</td><td>—</td><td>MIT</td></tr><tr><td>OCR</td><td>3.3B</td><td>3.3B</td><td>12</td><td>—</td><td>64 路由 + 2 共享，top-6</td><td>8K</td><td>MIT</td></tr><tr><td>OCR2</td><td>3B 级</td><td>3B 级</td><td>12</td><td>—</td><td>64 路由 + 2 共享，top-6</td><td>8K</td><td>Apache 2.0</td></tr><tr><td>Prover-V2</td><td>671B/7B</td><td>671B/37B；7B dense</td><td>61</td><td>MLA</td><td>256 路由 + 1 共享</td><td>128K</td><td>DeepSeek Model License</td></tr><tr><td>Math-V2</td><td>671B 级</td><td>671B/37B</td><td>61</td><td>DSA</td><td>256 路由 + 1 共享</td><td>128K</td><td>Apache 2.0</td></tr></tbody></table>\n<p>表中“—”表示官方模型卡没有给出统一口径，或者该模型不是纯文本 Transformer，不要硬填。</p>\n<h2>2. 许可证不是一回事</h2>\n<p>“开源”在 DeepSeek 这里分三档：</p>\n<ul><li>\n<strong>MIT</strong>：V3、R1、V3.1、V3.2、V4、V4.1、Janus。限制最少，商用友好。\n</li><li>\n<strong>DeepSeek Model License</strong>：LLM、Coder、MoE、V2、V2-Lite、Coder-V2、VL、VL2、Prover-V2。允许商用，但有使用条款，不是 OSI 意义上的完全开源。\n</li><li>\n<strong>Apache 2.0</strong>：Math-V2、OCR2。商用友好，带专利授权条款。\n</ul>\n<p>严格说，只有 MIT/Apache 2.0 的权重是“OSI 开源许可证”；DeepSeek Model License 是“开放权重 + 自定义许可”。写“DeepSeek 全部开源”不准确。</p>\n<h2>3. 选型决策树</h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n  A[&quot;你要做什么&quot;] --&gt; B{&quot;任务类型&quot;}\n  B --&gt;|学习/本地实验| C[&quot;V2-Lite 16B/2.4B&quot;]\n  B --&gt;|通用对话/代码| D[&quot;V3.1 671B/37B&quot;]\n  B --&gt;|长上下文/Agent| E[&quot;V4.1-Flash 或 V4-Pro&quot;]\n  B --&gt;|最高质量| F[&quot;V4-Pro 1.6T/49B&quot;]\n  B --&gt;|数学证明| G[&quot;Math-V2 / Prover-V2&quot;]\n  B --&gt;|文档 OCR| H[&quot;OCR2&quot;]\n  B --&gt;|视觉理解| I[&quot;VL2&quot;]\n  B --&gt;|图像生成+理解| J[&quot;Janus-Pro&quot;]</div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。</p>\n<p>决策顺序：</p>\n<ol><li>\n<strong>先看任务</strong>：文本、代码、数学、OCR、视觉理解、图像生成，模型不是通用的。\n</li><li>\n<strong>再看显存</strong>：总参数决定能不能装下；V4-Pro 1.6T 不是单机能跑的。\n</li><li>\n<strong>再看延迟</strong>：激活参数决定每 token 算力；V4.1 的 8B/16B 激活适合高并发。\n</li><li>\n<strong>再看上下文</strong>：128K 够不够？要 1M 就只能在 V4 代里选。\n</li><li>\n<strong>最后看许可证</strong>：商用优先 MIT/Apache；DeepSeek Model License 要读条款。\n</ol>\n<h2>4. 每一代真正改了什么</h2>\n<table><thead><tr><th>代</th><th>结构改动</th><th>训练改动</th></tr></thead><tbody><tr><td>Dense</td><td>LLaMA 式 decoder、GQA</td><td>2T 中英文/代码预训练</td></tr><tr><td>MoE</td><td>细粒度专家、共享专家</td><td>负载均衡</td></tr><tr><td>V2</td><td>MLA、160 路由</td><td>8.1T token</td></tr><tr><td>V3</td><td>256 路由、MTP、无辅助损失均衡、FP8</td><td>14.8T token</td></tr><tr><td>R1</td><td>无结构改动</td><td>GRPO、四阶段 RL、蒸馏</td></tr><tr><td>V3.1</td><td>无结构改动</td><td>混合推理模板、Agent 后训练</td></tr><tr><td>V3.2</td><td>DSA 稀疏注意力</td><td>Agent RL、1800+ 环境</td></tr><tr><td>V4</td><td>token 压缩 + DSA、mHC、Muon、1M</td><td>FP4+FP8、长上下文训练</td></tr><tr><td>V4.1</td><td>CED、CSA2、Engram、DSpark、FP4 KV</td><td>45T 多模态语料</td></tr></tbody></table>\n<p>这张表回答一个常见问题：“为什么参数没翻倍，能力却提升了？”因为改动不一定在参数量上，可能在注意力、路由、训练目标、数据配比上。</p>\n<h2>5. 拿到新模型卡，问六个问题</h2>\n<ol><li>\n<code>architectures</code> / <code>model_type</code> 是什么？属于哪一代？\n</li><li>\n总参数多少，激活参数多少？层数、隐藏维、头数、KV 头数？\n</li><li>\n注意力是 MHA/GQA/MLA/DSA/CSA/HCA/CSA2 中的哪一种？\n</li><li>\nFFN 是 dense 还是 MoE？多少路由专家、多少共享专家、top-k 多少？\n</li><li>\n上下文多长？训练 token 多少？精度是什么？\n</li><li>\n许可证是什么？权重、代码、数据分别开放到什么程度？\n</ol>\n<p>六个问题答完，你就知道它是“新架构”还是“同架构的新 checkpoint”。</p>\n<h2>6. 常见误解</h2>\n<ul><li>\n别以为 V4.1 是 V4-Pro 的缩小版——它是新的 CED + CSA2 + Engram 结构。\n</li><li>\n别以为 V3.1 比 V3 结构新——只是模板和后训练。\n</li><li>\n别以为参数越大越适合你——显存、延迟、成本都是约束。\n</li><li>\n别以为“开源”= MIT——许可证要逐个看。\n</li><li>\n别以为 OCR/Janus/VL2 是“小玩具”——它们是不同任务上的专用架构。\n</ul>\n<h2>7. 自测题</h2>\n<ol><li>\n哪一个模型首次引入 MLA？（答案：B；解析：V2。）\n<ul>\n<li>\nA. V3　B. V2　C. R1　D. V4\n</li><li>\n哪一个模型引入 DSA？（答案：C；解析：V3.2-Exp。）\n</li><li>\nA. V2　B. V3.1　C. V3.2-Exp　D. V4.1\n</li><li>\nV4.1 的 552B 和 196B 分别是什么？（答案：A；解析：552B 主干 + 196B Engram。）\n</li><li>\nA. 主干 + Engram　B. 两次专家数　C. 训练/推理参数　D. 视觉/文本参数\n</li><li>\n商用限制最少的是哪类许可证？（答案：A；解析：MIT/Apache 2.0 最宽松；DeepSeek Model License 有自定义条款。）\n</li><li>\nA. MIT/Apache 2.0　B. DeepSeek Model License　C. 无许可证　D. 仅研究许可\n</ul>\n</ol>\n<h2>8. 复习锚点</h2>\n<ul><li>\n四代结构主线：dense → MoE → MLA → DSA/CSA → CED/CSA2。\n</li><li>\n选型顺序：任务 → 显存 → 延迟 → 上下文 → 许可证。\n</li><li>\n同家族 checkpoint 先看 <code>architectures</code>，再看训练阶段。\n</li><li>\nMIT / DeepSeek Model License / Apache 2.0 是三档，不要混。\n</li><li>\n下一章是附录：105+ 张模型卡索引，按家族列出全部公开 checkpoint。\n</ul>","ch12":"<div class=\"source-badge\">出处：https://huggingface.co/api/models?author=deepseek-ai&amp;limit=200</div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必</span> <a href=\"#/chapter/ch11\">第 11 章：全家族对比与选型</a></span></div><h1>附录：105+ 张模型卡索引</h1>\n<ul><li>\n<strong>难度</strong>：★☆☆ | <strong>预估学时</strong>：30 分钟 | <strong>前置</strong>：第 1–11 章\n</ul>\n<h2>说明</h2>\n<p>这张索引按家族列出 HuggingFace <code>deepseek-ai</code> 组织下的公开模型卡。同一家族的多个 checkpoint 通常共享网络结构，差别在训练数据、后训练、精度或用途；不要把它们当成不同架构。参数量优先按模型卡/命名口径，标注“激活”的是激活参数。</p>\n<h2>1. 索引怎么用</h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n  A[&quot;先定代际&quot;] --&gt; B{&quot;dense 还是 MoE？&quot;}\n  B --&gt;|dense| C[&quot;LLM / Coder / Math&quot;]\n  B --&gt;|MoE| D[&quot;MoE-16B / V2 / V3 / V4&quot;]\n  D --&gt; E{&quot;有没有新结构件？&quot;}\n  E --&gt;|MLA| F[&quot;V2 代&quot;]\n  E --&gt;|MTP + 无辅助损失| G[&quot;V3 代&quot;]\n  E --&gt;|DSA| H[&quot;V3.2&quot;]\n  E --&gt;|CSA/HCA + mHC| I[&quot;V4 代&quot;]\n  E --&gt;|CED + CSA2 + Engram| J[&quot;V4.1&quot;]\n  A --&gt; K{&quot;是不是多模态/专用？&quot;}
